"堪","m":"可，能够","t":"实词","d":["忍受","胜任"]},{"u":5,"w":"怎生","m":"怎样，如何","t":"实词","d":["怎么出生","为什么"]},{"u":7,"w":"次第","m":"光景，情形","t":"古今异义","d":["依次顺序","次序"]}],"tricky":["觅","戚","乍","息","盏","憔悴","堪","梧桐","怎生"],"keyLines":[{"u":0,"hint":"《声声慢》开篇连用叠字，表现词人若有所失、凄凉孤独的三句是："},{"u":3,"hint":"《声声慢》中，词人见到北归大雁而生伤心之感、因为它们是旧时相识的句子是："},{"u":6,"hint":"《声声慢》中，描写梧桐细雨、黄昏时点点滴滴的句子是："},{"u":7,"hint":"《声声慢》结尾，感叹愁绪无法用一个字概括的句子是："}],"appr":[{"q":"开头连用十四个叠字有什么艺术效果？","a":"词人用“寻寻觅觅”“冷冷清清”“凄凄惨惨戚戚”由动作到环境再到心境，层层递进，音节回环低沉，一下子把读者带入孤独凄苦的氛围，也是全词情感的总纲。"},{"q":"词中选用了哪些意象？如何表达愁情？","a":"选用淡酒、晚风、归雁、黄花、梧桐、细雨等深秋常见景物，把无形的愁绪寄托在可感的物象上，从白天写到黄昏，景景含愁，情景交融。"},{"q":"“这次第，怎一个愁字了得”好在哪里？","a":"结尾用反问收束，既承接前面所写的种种愁境，又说明愁怀之深广远非一个“愁”字能够概括，余味不尽，以少总多。"}]},{"id":"h1a-p11","volume":"h1a","title":"静女","author":"《诗经》","dynasty":"先秦","genre":"诗经（国风·邶风）","kind":"poem","intro":"出自《诗经·邶风》，是一首描写青年男女约会、赠物定情的民歌，写男子赴约时的焦急与得到信物后的欣喜。","theme":"通过约会与赠物的情节，表现青年男子对心上人纯真热烈的爱恋。","tags":["爱情","叙事","抒情"],"units":[{"t":"静女其姝，俟我于城隅。","tr":"文静的姑娘多么美丽，约好在城角的僻静处等我。","p":0,"r":1},{"t":"爱而不见，搔首踟蹰。","tr":"我爱她却找不到她，急得抓着头在原地走来走去。","p":0,"r":1},{"t":"静女其娈，贻我彤管。","tr":"文静的姑娘多么娇好，送给我一支红色的彤管。","p":1,"r":1},{"t":"彤管有炜，说怿女美。","tr":"这红管闪着光彩，我喜爱它，更喜爱姑娘的美好。","p":1,"r":1},{"t":"自牧归荑，洵美且异。","tr":"她从郊外牧场带回嫩茅草送我，确实美丽又特别。","p":2,"r":1},{"t":"匪女之为美，美人之贻。","tr":"并不是这草本身有多美，而是因为它是美人所赠。","p":2,"r":1}],"notes":[{"u":0,"w":"姝","m":"美丽","t":"实词","d":["文静","端庄"]},{"u":0,"w":"俟","m":"等待","t":"实词","d":["迎接","寻找"]},{"u":0,"w":"城隅","m":"城角（一说城上的角楼）","t":"实词","d":["城门口","城外郊野"]},{"u":1,"w":"爱","m":"通“薆”，隐藏","t":"通假","d":["喜爱","爱慕"]},{"u":1,"w":"踟蹰","m":"徘徊不前的样子","t":"实词","d":["焦急呼喊","沉思默想"]},{"u":2,"w":"娈","m":"容貌美好","t":"实词","d":["温顺","柔弱"]},{"u":2,"w":"贻","m":"赠送","t":"实词","d":["遗留","丢失"]},{"u":3,"w":"说怿","m":"喜爱（“说”通“悦”）","t":"通假","d":["解说","疑惑"]},{"u":4,"w":"归","m":"通“馈”，赠送","t":"通假","d":["返回","归属"]},{"u":4,"w":"洵","m":"确实，诚然","t":"实词","d":["迅速","全部"]},{"u":5,"w":"匪","m":"通“非”，不是","t":"通假","d":["强盗","盗匪"]}],"tricky":["姝","踟蹰","娈","贻","彤","荑"],"keyLines":[{"u":1,"hint":"《静女》中，写男子找不到心上人而焦急徘徊的句子是："},{"u":3,"hint":"《静女》中，表达因喜爱彤管而更喜爱姑娘的句子是："},{"u":5,"hint":"《静女》中，表明男子珍视荑草是因为它是心上人所赠的句子是："}],"appr":[{"q":"第一章写“爱而不见，搔首踟蹰”，刻画了怎样的人物形象？","a":"通过“搔首”“踟蹰”两个动作，生动写出男子赴约时见不到姑娘的焦急、无措，又带着几分憨态，使人物形象真实可感，富有生活情趣。"},{"q":"“匪女之为美，美人之贻”表达了什么情感？","a":"荑草本是平常之物，诗人却觉得格外美，是因为它出自心上人之手。以物写情、爱屋及乌，把热恋中的男子对姑娘的深情表现得含蓄而真切。"}]},{"id":"h1a-p12","volume":"h1a","title":"涉江采芙蓉","author":"古诗十九首","dynasty":"东汉","genre":"五言古诗","kind":"poem","intro":"选自《古诗十九首》，作者不详，写游子思念远方的妻子（或写思妇怀念远人），情意深长而含蓄。","theme":"抒写夫妻两地分居、相思难见的忧伤与怅惘。","tags":["思乡","怀人","抒情"],"units":[{"t":"涉江采芙蓉，兰泽多芳草。","tr":"渡过江水去采摘荷花，生长兰草的水泽边芳草繁茂。","p":0,"r":1},{"t":"采之欲遗谁？所思在远道。","tr":"采来这些花草想送给谁呢？我思念的人远在遥远的地方。","p":0,"r":1},{"t":"还顾望旧乡，长路漫浩浩。","tr":"回头眺望故乡，漫长的道路无边无际。","p":0,"r":1},{"t":"同心而离居，忧伤以终老。","tr":"两人心意相同却分隔两地，只能在忧伤中度过一生。","p":0,"r":1}],"notes":[{"u":0,"w":"涉","m":"渡过","t":"实词","d":["行走","游览"]},{"u":0,"w":"芙蓉","m":"荷花","t":"古今异义","d":["木芙蓉","一种香草"]},{"u":0,"w":"泽","m":"水边聚水的洼地","t":"实词","d":["恩泽","光泽"]},{"u":1,"w":"遗","m":"赠送（读wèi）","t":"实词","d":["遗失","遗留"]},{"u":2,"w":"还顾","m":"回头看","t":"实词","d":["回来探望","顾念"]},{"u":2,"w":"旧乡","m":"故乡","t":"实词","d":["旧时的村庄","昔日的同乡"]},{"u":2,"w":"浩浩","m":"旷远无边的样子","t":"实词","d":["水势盛大","声势壮阔"]}],"tricky":["芙蓉","涉","遗","漫","浩"],"keyLines":[{"u":1,"hint":"《涉江采芙蓉》中，以设问点出所采香花要赠给远方思念之人的句子是："},{"u":2,"hint":"《涉江采芙蓉》中，写回望故乡、归路漫长遥远的句子是："},{"u":3,"hint":"《涉江采芙蓉》中，写夫妻心意相通却被迫分居、终生忧伤的句子是："}],"appr":[{"q":"“采之欲遗谁？所思在远道”这一问一答有什么作用？","a":"以设问引出思念对象，自问自答，把采花的动机和盘托出，使情感由景入情自然转折，也突出了所思之人远在天涯，增强了相思的深切。"},{"q":"这首诗的结尾表达了怎样的情感？","a":"“同心而离居，忧伤以终老”直抒胸臆，写出两心相印却无法团聚的痛苦，并预想一生都在忧伤中度过，感情沉痛，余味悠长。"}]},{"id":"h1a-p13","volume":"h1a","title":"虞美人·春花秋月何时了","author":"李煜","dynasty":"五代（南唐）","genre":"词","kind":"poem","intro":"李煜亡国后被囚于宋都汴京，在忧愁与思念故国中写下此词，传说因此词触怒宋太宗而被赐死，是其绝命词。","theme":"借今昔对比，抒发亡国之痛与无尽的故国之思。","tags":["怀古","亡国之痛","抒情"],"units":[{"t":"春花秋月何时了？往事知多少。","tr":"春花秋月的轮回什么时候才能结束？往事又还剩下多少让我回想。","p":0,"r":1},{"t":"小楼昨夜又东风，故国不堪回首月明中。","tr":"昨夜小楼上又吹来了春风，在明月下我实在不忍回望故国。","p":0,"r":1},{"t":"雕栏玉砌应犹在，只是朱颜改。","tr":"雕花的栏杆、玉石的台阶应该还在，只是宫中人的容颜已经改变。","p":1,"r":1},{"t":"问君能有几多愁，恰似一江春水向东流。","tr":"请问你能有多少忧愁？就像一江春水滔滔向东流去，无穷无尽。","p":1,"r":1}],"notes":[{"u":0,"w":"了","m":"完结，了结","t":"实词","d":["明白","完成"]},{"u":1,"w":"故国","m":"指已灭亡的南唐","t":"古今异义","d":["古老的国家","祖国"]},{"u":1,"w":"不堪","m":"不能忍受","t":"实词","d":["不好","无法承担"]},{"u":2,"w":"雕栏玉砌","m":"雕花的栏杆和玉石的台阶，指南唐宫殿","t":"实词","d":["精美的家具","富丽的园林"]},{"u":2,"w":"朱颜","m":"红润的容颜，这里指昔日宫中人","t":"实词","d":["红色的脸谱","朱红色的栏杆"]},{"u":3,"w":"君","m":"你，泛指对方，也可理解为作者自问","t":"实词","d":["君王","诸君"]}],"tricky":["砌","雕栏","朱颜","堪","恰"],"keyLines":[{"u":0,"hint":"《虞美人》中，开篇以自然永恒的景物发问、引出往事之痛的句子是："},{"u":2,"hint":"《虞美人》中，以景物依旧反衬人事已非的句子是："},{"u":3,"hint":"《虞美人》中，把愁绪比作滔滔不尽的江水的句子是："},{"u":1,"hint":"《虞美人》中，写词人在月夜不忍回顾亡国往事的句子是："}],"appr":[{"q":"“问君能有几多愁，恰似一江春水向东流”用了什么手法？有何妙处？","a":"用设问和比喻，把无形的愁绪比作奔流不尽的江水，既写出愁之多、愁之深，也写出愁思绵延不断，形象生动，成为咏愁名句。"},{"q":"“雕栏玉砌应犹在，只是朱颜改”表达了怎样的情感？","a":"以宫殿的不变反衬人事的变迁，“应犹在”是揣测，“只是”一转，流露亡国后物是人非的沉痛与无奈，对比强烈，感慨深沉。"}]},{"id":"h1a-p14","volume":"h1a","title":"鹊桥仙·纤云弄巧","author":"秦观","dynasty":"北宋","genre":"词","kind":"poem","intro":"这是一首咏七夕牛郎织女传说的词，作者摆脱了传统写法中的悲苦基调，赋予爱情以新的境界。","theme":"歌颂牛郎织女忠贞不渝的爱情，表达爱情不在朝夕相伴而在长久相守的观念。","tags":["爱情","咏节日","议论抒情"],"units":[{"t":"纤云弄巧，飞星传恨，银汉迢迢暗度。","tr":"轻柔的云彩变幻出巧妙的图案，流星传递着离别的遗憾，牛郎织女悄悄渡过遥远的银河。","p":0,"r":1},{"t":"金风玉露一相逢，便胜却人间无数。","tr":"在秋风白露的时节一旦相会，就胜过人间无数平凡的相聚。","p":0,"r":1},{"t":"柔情似水，佳期如梦，忍顾鹊桥归路！","tr":"情意像流水一样温柔，相会的时光像梦一样短暂，怎忍心回头看那鹊桥上的归路！","p":1,"r":1},{"t":"两情若是久长时，又岂在朝朝暮暮。","tr":"只要两人的感情能够天长地久，又何必贪求日日夜夜相守。","p":1,"r":1}],"notes":[{"u":0,"w":"纤云","m":"轻盈纤细的云","t":"实词","d":["厚重的云","彩色的云霞"]},{"u":0,"w":"弄巧","m":"变幻出巧妙的样子","t":"实词","d":["卖弄技巧","织出巧布"]},{"u":0,"w":"银汉","m":"银河","t":"实词","d":["银色的汉水","星河边的城池"]},{"u":0,"w":"迢迢","m":"遥远的样子","t":"实词","d":["高耸的样子","波动的样子"]},{"u":1,"w":"金风玉露","m":"秋风白露，指秋天（七夕时节）","t":"实词","d":["金色的风和玉石般的露水","富贵的生活"]},{"u":2,"w":"忍顾","m":"怎忍回头看","t":"实词","d":["忍耐着回顾","不顾"]},{"u":3,"w":"岂","m":"难道，怎么","t":"虚词","d":[]}],"tricky":["纤","迢","鹊","忍顾","朝朝暮暮"],"keyLines":[{"u":1,"hint":"《鹊桥仙》中，写牛郎织女一次相逢就胜过人间无数凡俗相聚的句子是："},{"u":3,"hint":"《鹊桥仙》中，表达爱情应长久相守、不必朝夕相伴的千古名句是："},{"u":2,"hint":"《鹊桥仙》中，写相会短暂、不忍离别回望的句子是："}],"appr":[{"q":"“两情若是久长时，又岂在朝朝暮暮”体现了怎样的爱情观？","a":"它强调真挚的爱情重在心灵相通、天长地久，而不在于形影不离。这一议论既是对牛郎织女的慰藉，也超越了世俗的离愁别恨，格调高远。"},{"q":"这首词在写法上有什么特点？","a":"叙事、抒情和议论融合：上阕写相会的情景，下阕写依依惜别并升华出议论；运用比喻（柔情似水、佳期如梦），语言清新，情景交融，意境优美。"}]},{"id":"h1a-w01","volume":"h1a","title":"劝学（节选）","author":"荀子","dynasty":"先秦","genre":"论说文","kind":"prose","intro":"荀子是战国后期的儒家代表人物，《劝学》是《荀子》开篇之作，用大量比喻劝勉人们坚持学习。","theme":"论述学习的重要性，强调学习须积累、坚持、专一。","tags":["说理","劝学","议论"],"units":[{"t":"君子曰：学不可以已。","tr":"君子说：学习是不可以停止的。","p":0,"r":1},{"t":"青，取之于蓝，而青于蓝；","tr":"靛青是从蓼蓝中提取出来的，却比蓼蓝的颜色更青；","p":0,"r":1},{"t":"冰，水为之，而寒于水。","tr":"冰是由水凝结而成的，却比水更寒冷。","p":0,"r":1},{"t":"木直中绳，鞣以为轮，其曲中规。","tr":"笔直的木料合乎墨线的要求，把它用火烤弯做成车轮，弯曲的弧度就合乎圆规画出的圆。","p":0,"r":1},{"t":"虽有槁暴，不复挺者，鞣使之然也。","tr":"即使又被晒干，木料也不会再变直，这是经过加工使它变成这样的。","p":0,"r":1},{"t":"故木受绳则直，金就砺则利，","tr":"所以木材经过墨线量过就能取直，金属刀剑拿到磨刀石上磨就能锋利，","p":0,"r":1},{"t":"君子博学而日参省乎己，则知明而行无过矣。","tr":"君子广泛地学习，又每天检查反省自己，就能智慧明达，行为也没有过失了。","p":0,"r":1},{"t":"吾尝终日而思矣，不如须臾之所学也；","tr":"我曾经整天地苦苦思索，却不如片刻学到的东西多；","p":1,"r":1},{"t":"吾尝跂而望矣，不如登高之博见也。","tr":"我曾经踮起脚远望，却不如登上高处看得广阔。","p":1,"r":1},{"t":"登高而招，臂非加长也，而见者远；","tr":"登到高处招手，手臂并没有变长，可是远处的人也能看见；","p":1,"r":1},{"t":"顺风而呼，声非加疾也，而闻者彰。","tr":"顺着风向呼喊，声音并没有变得更响，可是听的人听得更清楚。","p":1,"r":1},{"t":"假舆马者，非利足也，而致千里；","tr":"借助车马的人，并不是脚走得快，却能到达千里之外；","p":1,"r":1},{"t":"假舟楫者，非能水也，而绝江河。","tr":"借助舟船的人，并不是善于游泳，却能横渡江河。","p":1,"r":1},{"t":"君子生非异也，善假于物也。","tr":"君子的资质与常人并没有不同，只是善于借助外物罢了。","p":1,"r":1},{"t":"积土成山，风雨兴焉；","tr":"泥土堆积成了高山，风雨就从那里兴起；","p":2,"r":1},{"t":"积水成渊，蛟龙生焉；","tr":"水流汇积成了深潭，蛟龙就在其中生长；","p":2,"r":1},{"t":"积善成德，而神明自得，圣心备焉。","tr":"善行积累成为美德，就会自然获得智慧，圣人的思想境界也就具备了。","p":2,"r":1},{"t":"故不积跬步，无以至千里；","tr":"所以不一步一步地积累，就无法走到千里之外；","p":2,"r":1},{"t":"不积小流，无以成江海。","tr":"不汇聚细小的水流，就无法形成江海。","p":2,"r":1},{"t":"骐骥一跃，不能十步；","tr":"千里马跳一下，也不能跳出十步远；","p":2,"r":1},{"t":"驽马十驾，功在不舍。","tr":"劣马拉车走十天，成功在于不停止。","p":2,"r":1},{"t":"锲而舍之，朽木不折；","tr":"雕刻几下就停下来，连腐朽的木头也刻不断；","p":2,"r":1},{"t":"锲而不舍，金石可镂。","tr":"一直刻下去不放弃，连金属和石头也能雕刻成功。","p":2,"r":1},{"t":"蚓无爪牙之利，筋骨之强，","tr":"蚯蚓没有锋利的爪子和牙齿，也没有强健的筋骨，","p":3,"r":1},{"t":"上食埃土，下饮黄泉，用心一也。","tr":"却能向上吃到泥土，向下喝到地下的泉水，这是因为它用心专一。","p":3,"r":1},{"t":"蟹六跪而二螯，非蛇鳝之穴无可寄托者，","tr":"螃蟹有六条腿和两只大钳，可是除了蛇和鳝鱼的洞穴，就没有可以栖身的地方，","p":3,"r":1},{"t":"用心躁也。","tr":"这是因为它用心浮躁。","p":3,"r":1}],"notes":[{"u":0,"w":"已","m":"停止","t":"实词","d":["已经","完毕"]},{"u":1,"w":"蓝","m":"蓼蓝，一种可提取靛青染料的草","t":"实词","d":["蓝色","蔚蓝的天空"]},{"u":1,"w":"青于蓝","m":"比蓝更青（“于”表比较）","t":"特殊句式","d":[]},{"u":3,"w":"中","m":"符合，合乎（读zhòng）","t":"实词","d":["中间","击中"]},{"u":3,"w":"鞣","m":"通“煣”，用火烘烤使木料弯曲","t":"通假","d":["用脚踩踏","用手揉搓"]},{"u":3,"w":"绳","m":"墨线","t":"实词","d":["绳子","约束"]},{"u":4,"w":"槁","m":"枯干","t":"实词","d":["稿件","高处"]},{"u":4,"w":"暴","m":"通“曝”，晒","t":"通假","d":["凶暴","突然"]},{"u":4,"w":"挺","m":"直","t":"实词","d":["挺拔向上","硬撑"]},{"u":5,"w":"受","m":"经受，接受（此指经过量度）","t":"实词","d":["遭受","容纳"]},{"u":5,"w":"就","m":"靠近，接近","t":"实词","d":["成功","就是"]},{"u":5,"w":"砺","m":"磨刀石","t":"实词","d":["砥砺品行","锋芒"]},{"u":5,"w":"利","m":"锋利","t":"实词","d":["利益","顺利"]},{"u":6,"w":"日","m":"每天（名词作状语）","t":"词类活用","d":[]},{"u":6,"w":"参省","m":"检验，省察","t":"实词","d":["参加检阅","参照观看"]},{"u":6,"w":"乎","m":"相当于“于”，介词","t":"虚词","d":[]},{"u":6,"w":"知","m":"通“智”，智慧","t":"通假","d":["知道","了解"]},{"u":7,"w":"须臾","m":"片刻，一会儿","t":"实词","d":["必须等待","需要的时间"]},{"u":8,"w":"跂","m":"踮起脚后跟","t":"实词","d":["歧路","跳起来"]},{"u":8,"w":"博见","m":"见得广，看得远","t":"实词","d":["博览群书","知识渊博"]},{"u":9,"w":"加","m":"更，增加","t":"实词","d":["加以","施加"]},{"u":10,"w":"彰","m":"清楚","t":"实词","d":["彰显","表彰"]},{"u":10,"w":"疾","m":"强劲，响亮","t":"实词","d":["疾病","快速"]},{"u":11,"w":"假","m":"借助，凭借","t":"实词","d":["虚假","假如"]},{"u":11,"w":"舆马","m":"车马","t":"实词","d":["舆论与良马","驿站的马"]},{"u":12,"w":"能水","m":"善于游泳（“水”名词作动词）","t":"词类活用","d":[]},{"u":12,"w":"绝","m":"横渡","t":"实词","d":["断绝","极其"]},{"u":13,"w":"生","m":"通“性”，资质，禀赋","t":"通假","d":["出生","生存"]},{"u":13,"w":"物","m":"外物，客观事物","t":"实词","d":["物品","万物"]},{"u":14,"w":"兴","m":"兴起","t":"实词","d":["兴盛","兴趣"]},{"u":15,"w":"渊","m":"深潭","t":"实词","d":["渊博","渊源"]},{"u":16,"w":"神明","m":"智慧，心智","t":"古今异义","d":["神灵","神仙"]},{"u":16,"w":"备","m":"具备，完备","t":"实词","d":["防备","准备好"]},{"u":17,"w":"跬步","m":"半步（古代跨一次脚为跬，跨两次为步）","t":"实词","d":["一步","小跑"]},{"u":17,"w":"无以","m":"没有用来……的办法","t":"特殊句式","d":[]},{"u":19,"w":"骐骥","m":"骏马，千里马","t":"实词","d":["麒麟","良种牛"]},{"u":20,"w":"驽马","m":"劣马，跑不快的马","t":"实词","d":["疲惫的马","幼小的马"]},{"u":20,"w":"十驾","m":"马拉车走十天的路程（一驾为一天的路程）","t":"实词","d":["驾十次车","十辆车"]},{"u":21,"w":"锲","m":"用刀雕刻","t":"实词","d":["契约","割断"]},{"u":21,"w":"舍","m":"停止，放弃","t":"实词","d":["房舍","施舍"]},{"u":22,"w":"镂","m":"雕刻","t":"实词","d":["漏掉","镂空"]},{"u":23,"w":"爪牙","m":"爪子和牙齿","t":"古今异义","d":["党羽","得力助手"]},{"u":24,"w":"上食","m":"向上吃（名词“上”作状语）","t":"词类活用","d":[]},{"u":24,"w":"黄泉","m":"地下的泉水","t":"古今异义","d":["阴间","黄河之水"]},{"u":25,"w":"跪","m":"蟹脚","t":"实词","d":["下跪","屈膝"]},{"u":25,"w":"寄托","m":"容身，栖身之处","t":"古今异义","d":["把希望交付他人","感情有所依托"]},{"u":26,"w":"躁","m":"浮躁，不专一","t":"实词","d":["急躁发怒","喧闹"]}],"tricky":["鞣","槁","跂","跬","驽","镂"],"keyLines":[{"u":1,"hint":"荀子用靛青与蓼蓝的关系说明学生可以超过老师、后天学习能使人超越原来的句子是："},{"u":14,"hint":"《劝学》中，用“泥土堆积成了高山，风雨就在那里兴起”这一事理说明积累作用的句子是："},{"u":13,"hint":"《劝学》中，指出君子与常人资质相同，高明之处只在善于借助外物的句子是："},{"u":17,"hint":"《劝学》中，从反面强调不一步一步积累就无法达到千里之远的句子是："},{"u":22,"hint":"《劝学》中，强调持之以恒、坚持不懈就能成功的句子是："},{"u":24,"hint":"《劝学》中，以蚯蚓为例，说明用心专一的句子是："}],"appr":[{"q":"《劝学》主要运用了什么论证方法？举例说明。","a":"以比喻论证为主：用青出于蓝、冰寒于水说明学习使人进步，用登高、顺风、假舆马舟楫说明借助外物，用积土成山、积水成渊说明积累，再用蚓与蟹作对比，把抽象道理说得具体可感。"},{"q":"“青，取之于蓝，而青于蓝；冰，水为之，而寒于水”表达了什么观点？","a":"靛青出自蓼蓝却比蓼蓝更青，冰由水凝成却比水更冷，比喻学生经过学习可以超越老师、人通过后天学习可以超越原来的自己，表明学习的重要作用。"},{"q":"文末用蚯蚓与螃蟹作对比，目的是什么？","a":"蚯蚓外形弱小，却因用心专一而能“上食埃土，下饮黄泉”；螃蟹有利钳多足，却因浮躁而无处安身。以此说明学习成败不取决于条件，而取决于是否专心致志。"}]},{"id":"h1a-w02","volume":"h1a","title":"师说","author":"韩愈","dynasty":"唐","genre":"论说文","kind":"prose","intro":"唐代士大夫风气耻于从师，韩愈积极倡导师道，借赠给青年李蟠之机写下此文，意在批评世风、阐明从师学习的道理。","theme":"阐明教师的职责与从师的必要，提出“道之所存，师之所存”的择师标准，批判耻于学师的陋习。","tags":["说理","议论","劝学"],"units":[{"t":"古之学者必有师。","tr":"古代求学的人一定有老师。","p":0,"r":1},{"t":"师者，所以传道受业解惑也。","tr":"老师，是用来传授道理、讲授学业、解答疑难的人。","p":0,"r":1},{"t":"人非生而知之者，孰能无惑？","tr":"人不是生下来就懂得道理的，谁能没有疑惑呢？","p":0,"r":1},{"t":"惑而不从师，其为惑也，终不解矣。","tr":"有了疑惑却不去跟随老师学习，那些疑惑最终也无法解开了。","p":0,"r":1},{"t":"生乎吾前，其闻道也固先乎吾，吾从而师之；","tr":"生在我之前的人，他懂得道理本来就早于我，我就跟从他并以他为师；","p":0,"r":1},{"t":"生乎吾后，其闻道也亦先乎吾，吾从而师之。","tr":"生在我之后的人，如果他懂得道理也早于我，我同样跟从他并以他为师。","p":0,"r":1},{"t":"吾师道也，夫庸知其年之先后生于吾乎？","tr":"我是向有道的人学习，哪里用得着去计较他的年龄比我大还是比我小呢？","p":0,"r":1},{"t":"是故无贵无贱，无长无少，道之所存，师之所存也。","tr":"所以无论地位高低，无论年纪大小，道理在哪里，老师就在哪里。","p":0,"r":1},{"t":"嗟乎！师道之不传也久矣！","tr":"唉！从师学习的风尚不流传已经很久了！","p":1,"r":1},{"t":"欲人之无惑也难矣！","tr":"要想让人没有疑惑可就难了！","p":1,"r":1},{"t":"古之圣人，其出人也远矣，犹且从师而问焉；","tr":"古代的圣人，他们超出常人很远，尚且跟从老师求教；","p":1,"r":1},{"t":"今之众人，其下圣人也亦远矣，而耻学于师。","tr":"现在的一般人，他们低于圣人也很远，却以向老师学习为耻。","p":1,"r":1},{"t":"是故圣益圣，愚益愚。","tr":"因此圣人更加圣明，愚人更加愚昧。","p":1,"r":1},{"t":"圣人之所以为圣，愚人之所以为愚，其皆出于此乎？","tr":"圣人之所以成为圣人，愚人之所以成为愚人，大概都是由这个原因造成的吧？","p":1,"r":1},{"t":"爱其子，择师而教之；于其身也，则耻师焉，惑矣。","tr":"爱自己的孩子，就挑选老师来教他；对于自己，却以拜师为耻，真是糊涂啊。","p":1,"r":1},{"t":"彼童子之师，授之书而习其句读者，","tr":"那些孩童的老师，教给孩子书本、帮助他们学习断句的人，","p":1,"r":1},{"t":"非吾所谓传其道解其惑者也。","tr":"并不是我所说的传授道理、解答疑惑的老师。","p":1,"r":1},{"t":"句读之不知，惑之不解，或师焉，或不焉，","tr":"不懂得断句，有疑惑不能解决，前者去请教老师，后者却不去请教，","p":1,"r":1},{"t":"小学而大遗，吾未见其明也。","tr":"小的方面学了，大的方面却丢了，我看不出他有什么高明。","p":1,"r":1},{"t":"巫医乐师百工之人，不耻相师。","tr":"巫医、乐师和各种工匠，不以互相拜师学习为耻。","p":1,"r":1},{"t":"士大夫之族，曰师曰弟子云者，则群聚而笑之。","tr":"士大夫这类人，一说到谁是老师、谁是弟子，就成群聚在一起讥笑人家。","p":1,"r":1},{"t":"问之，则曰：“彼与彼年相若也，道相似也，","tr":"问他们为什么笑，就说：“那个人和那个人年龄差不多，学问也差不多，","p":1,"r":1},{"t":"位卑则足羞，官盛则近谀。”","tr":"以地位低的人为师就足以感到羞耻，以官职高的人为师就近乎谄媚。”","p":1,"r":1},{"t":"呜呼！师道之不复可知矣。","tr":"唉！从师学习的风尚不能恢复，由此可以知道了。","p":1,"r":1},{"t":"巫医乐师百工之人，君子不齿，","tr":"巫医、乐师和各种工匠，士大夫是看不起、不屑与之并列的，","p":1,"r":1},{"t":"今其智乃反不能及，其可怪也欤！","tr":"如今士大夫的见识竟反而赶不上他们，这真是奇怪啊！","p":1,"r":1},{"t":"圣人无常师。","tr":"圣人没有固定的老师。","p":2,"r":1},{"t":"孔子师郯子、苌弘、师襄、老聃。","tr":"孔子曾向郯子、苌弘、师襄、老聃学习。","p":2,"r":1},{"t":"郯子之徒，其贤不及孔子。","tr":"郯子这些人，他们的德才不及孔子。","p":2,"r":1},{"t":"孔子曰：“三人行，则必有我师。”","tr":"孔子说：“几个人同行，其中一定有可以做我老师的人。”","p":2,"r":1},{"t":"是故弟子不必不如师，师不必贤于弟子，","tr":"因此学生不一定不如老师，老师不一定比学生贤能，","p":2,"r":1},{"t":"闻道有先后，术业有专攻，如是而已。","tr":"只是懂得道理有先有后，在学问技艺上各有专长，如此罢了。","p":2,"r":1},{"t":"李氏子蟠，年十七，好古文，","tr":"李家的孩子李蟠，年纪十七岁，爱好古文，","p":3,"r":1},{"t":"六艺经传皆通习之，不拘于时，学于余。","tr":"六经的经文和传文都学习了一遍，不受当时不良风气的限制，来向我学习。","p":3,"r":1},{"t":"余嘉其能行古道，作《师说》以贻之。","tr":"我赞许他能遵行古人从师学习的风尚，写了这篇《师说》来赠送给他。","p":3,"r":1}],"notes":[{"u":0,"w":"学者","m":"求学的人","t":"古今异义","d":["有专门学问的人","做学术研究的人"]},{"u":1,"w":"所以","m":"用来……的（“所以”+动词）","t":"古今异义","d":["因此","所以然"]},{"u":1,"w":"传道受业解惑","m":"传授道理，讲授学业，解答疑难","t":"实词","d":["传说道理","接受学业"]},{"u":1,"w":"受","m":"通“授”，传授","t":"通假","d":["接受","承受"]},{"u":2,"w":"孰","m":"谁","t":"实词","d":["熟悉","哪一个季节"]},{"u":2,"w":"惑","m":"疑惑，疑难问题","t":"实词","d":["迷惑受骗","糊涂"]},{"u":2,"w":"生而知之","m":"生下来就懂得道理","t":"特殊句式","d":[]},{"u":3,"w":"从","m":"跟随","t":"实词","d":["从事","服从"]},{"u":4,"w":"师","m":"以……为师，向……学习（名词作动词，意动）","t":"词类活用","d":[]},{"u":4,"w":"固","m":"本来，当然","t":"实词","d":["坚固","固执"]},{"u":4,"w":"先乎吾","m":"比我早（介词“乎”表比较，同“于”）","t":"特殊句式","d":[]},{"u":6,"w":"庸","m":"岂，哪里","t":"实词","d":["平庸","功劳"]},{"u":6,"w":"夫","m":"发语词，无义","t":"虚词","d":[]},{"u":7,"w":"无","m":"无论，不论","t":"实词","d":["没有","不要"]},{"u":8,"w":"嗟乎","m":"感叹词，唉","t":"虚词","d":[]},{"u":10,"w":"出人","m":"超出一般人","t":"实词","d":["出门见人","出生做人"]},{"u":10,"w":"犹且","m":"尚且","t":"古今异义","d":["仍然而且","好像并且"]},{"u":11,"w":"下","m":"低于，不如（形容词用作动词）","t":"词类活用","d":[]},{"u":11,"w":"耻","m":"以……为耻（意动用法）","t":"词类活用","d":[]},{"u":11,"w":"学于师","m":"向老师学习（状语后置，“于师”应在“学”前）","t":"特殊句式","d":[]},{"u":14,"w":"耻师","m":"以拜师为耻","t":"词类活用","d":[]},{"u":15,"w":"句读","m":"古代称文辞停顿处为读或逗，句末停顿为句","t":"古今异义","d":["书籍的阅读","朗读课文"]},{"u":17,"w":"不","m":"通“否”","t":"通假","d":["不要","没有"]},{"u":17,"w":"或","m":"有的","t":"实词","d":["或者","也许"]},{"u":18,"w":"小学而大遗","m":"学了小的方面，却丢了大的方面","t":"特殊句式","d":[]},{"u":19,"w":"百工","m":"各种工匠","t":"古今异义","d":["一百种工作","许多官员"]},{"u":19,"w":"相师","m":"互相学习（“相”表示彼此）","t":"实词","d":["拜对方为师","亲自教授"]},{"u":20,"w":"族","m":"类","t":"实词","d":["家族","民族"]},{"u":20,"w":"云者","m":"……的人（“云”助词，“者”表示人）","t":"虚词","d":[]},{"u":21,"w":"相若","m":"相似，差不多","t":"实词","d":["相互约定","若有若无"]},{"u":22,"w":"足","m":"足以，可以","t":"实词","d":["脚","充足"]},{"u":22,"w":"谀","m":"谄媚，奉承","t":"实词","d":["谏诤","诋毁"]},{"u":24,"w":"不齿","m":"不愿提及，与之同列都认为羞耻","t":"古今异义","d":["没有牙齿","不屑一提"]},{"u":25,"w":"乃","m":"竟然","t":"实词","d":["于是","是"]},{"u":25,"w":"欤","m":"语气词，表感叹","t":"虚词","d":[]},{"u":26,"w":"常师","m":"固定的老师","t":"实词","d":["常常拜师","平常的老师"]},{"u":28,"w":"贤","m":"德才好","t":"实词","d":["贤人","贤惠"]},{"u":30,"w":"贤于","m":"比……贤能（“于”表比较）","t":"特殊句式","d":[]},{"u":31,"w":"术业","m":"学业，技艺","t":"实词","d":["技术事业","魔术职业"]},{"u":31,"w":"攻","m":"钻研，学习","t":"实词","d":["攻打","批评"]},{"u":33,"w":"六艺","m":"六经，指《诗》《书》《礼》《乐》《易》《春秋》","t":"古今异义","d":["六种技艺","六门课程"]},{"u":33,"w":"拘","m":"限制，受束缚","t":"实词","d":["拘捕","拘谨"]},{"u":34,"w":"嘉","m":"赞许","t":"实词","d":["美好","嘉奖"]},{"u":34,"w":"贻","m":"赠送","t":"实词","d":["遗留","耽误"]}],"tricky":["谀","聃","苌","贻","郯","蟠"],"keyLines":[{"u":1,"hint":"《师说》中，韩愈概括教师职责的句子是："},{"u":7,"hint":"《师说》中，表明择师不论地位高低、年龄长幼，只以“道”为标准的句子是："},{"u":12,"hint":"《师说》中，概括圣人因从师而更圣明、愚人因耻师而更愚昧的句子是："},{"u":14,"hint":"《师说》中，揭示士大夫为子女择师却自己耻于从师这一矛盾做法的句子是："},{"u":30,"hint":"《师说》中，说明师生关系并不固定、学生可以超过老师的句子是："},{"u":31,"hint":"《师说》中，韩愈总结从师理由、指出各人都有所长的句子是："}],"appr":[{"q":"《师说》开篇提出了什么观点？作者是如何围绕它展开论证的？","a":"中心论点是“古之学者必有师”。作者先说明师的作用和择师的标准，再用古今对比、爱子择师与自己耻师的对比、士大夫与巫医乐师百工的对比分析耻师之风，又举孔子为例，最后点明作《师说》的缘由。"},{"q":"文中运用了哪些对比？有什么作用？","a":"有古之圣人与今之众人、对子择师与对己耻师、士大夫与巫医乐师百工三组对比。通过对照突出当时耻于从师的不合理，使批评深刻有力，也增强了文章的说服力。"},{"q":"“道之所存，师之所存也”体现了怎样的择师观？","a":"择师看的是对方有没有“道”，不论年龄大小、地位高低。这打破了当时重门第、重年资的偏见，体现了进步的师生观和平等求学的态度。"}]},{"id":"h1a-w03","volume":"h1a","title":"赤壁赋","author":"苏轼","dynasty":"北宋","genre":"文赋（散文赋）","kind":"prose","intro":"元丰五年（1082），苏轼被贬黄州，七月与友人夜游黄州城外的赤壁（实为赤鼻矶），借主客问答写下此文，是宋代文赋的代表作。","theme":"借月夜泛舟，从人生短暂的悲叹转入对变与不变的哲思，表现旷达乐观、超脱物外的人生态度。","tags":["写景","说理","抒怀"],"units":[{"t":"壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。","tr":"壬戌年的秋天，七月十六日，我与客人乘着小船，在赤壁之下游玩。","p":0,"r":1},{"t":"清风徐来，水波不兴。","tr":"清凉的风缓缓吹来，江面上没有一丝波浪。","p":0,"r":1},{"t":"举酒属客，诵明月之诗，歌窈窕之章。","tr":"我举起酒杯劝客人同饮，吟诵《月出》诗中含有“窈窕”的那一章。","p":0,"r":1},{"t":"少焉，月出于东山之上，徘徊于斗牛之间。","tr":"不一会儿，月亮从东山后面升起，在斗宿和牛宿之间缓缓移动。","p":0,"r":1},{"t":"白露横江，水光接天。","tr":"白茫茫的水汽笼罩着江面，粼粼的水光与天际相连。","p":0,"r":1},{"t":"纵一苇之所如，凌万顷之茫然。","tr":"任凭这一叶小船漂向它想去的地方，越过那茫茫万顷的江面。","p":0,"r":1},{"t":"浩浩乎如冯虚御风，而不知其所止；","tr":"浩浩荡荡，好像凌空驾风而行，不知将停在何处；","p":0,"r":1},{"t":"飘飘乎如遗世独立，羽化而登仙。","tr":"轻飘飘的，好像脱离尘世、超然独立，长出翅膀飞升成仙。","p":0,"r":1},{"t":"于是饮酒乐甚，扣舷而歌之。","tr":"这时喝酒喝得十分高兴，我敲着船边打着节拍唱起歌来。","p":1,"r":1},{"t":"歌曰：“桂棹兮兰桨，击空明兮溯流光。","tr":"歌词是：“桂木做的棹啊兰木做的桨，拍打着澄澈的月下江水，逆着浮动的月光上行。","p":1,"r":1},{"t":"渺渺兮予怀，望美人兮天一方。”","tr":"我的情思悠远渺茫啊，眺望心中所思念的人，却在天的另一边。”","p":1,"r":1},{"t":"客有吹洞箫者，倚歌而和之。","tr":"客人中有会吹洞箫的，依着歌声的节拍来伴奏。","p":1,"r":1},{"t":"其声呜呜然，如怨如慕，如泣如诉；","tr":"那箫声呜呜作响，像在怨恨，像在思慕，像在啜泣，又像在倾诉；","p":1,"r":1},{"t":"余音袅袅，不绝如缕。","tr":"尾音婉转悠长，像细丝一样连绵不断。","p":1,"r":1},{"t":"舞幽壑之潜蛟，泣孤舟之嫠妇。","tr":"能使深谷里潜藏的蛟龙起舞，能使孤舟上的寡妇落泪。","p":1,"r":1},{"t":"苏子愀然，正襟危坐，而问客曰：“何为其然也？”","tr":"我神色忧愁起来，整理衣襟端正坐好，问客人说：“箫声为什么这样悲凉呢？”","p":2,"r":1},{"t":"客曰：“‘月明星稀，乌鹊南飞。’此非曹孟德之诗乎？","tr":"客人说：“‘月光明亮星星稀疏，乌鹊向南飞去。’这不是曹孟德的诗句吗？","p":2,"r":1},{"t":"西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？","tr":"向西望是夏口，向东望是武昌，山水环绕交错，一片苍翠茂盛，这不就是曹孟德被周瑜围困的地方吗？","p":2,"r":1},{"t":"方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，","tr":"当他攻破荆州，攻占江陵，顺着长江向东进军的时候，战船首尾相接绵延千里，旌旗遮蔽了天空，","p":2,"r":1},{"t":"酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？","tr":"面对大江斟满酒，横握着长矛吟诗，本是一代的英雄，可如今又在哪里呢？","p":2,"r":1},{"t":"况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，","tr":"何况我和您在江边的沙洲上捕鱼砍柴，以鱼虾为伴侣，以麋鹿为朋友，","p":2,"r":1},{"t":"驾一叶之扁舟，举匏樽以相属。","tr":"驾着一叶小小的船，举起葫芦做的酒杯互相劝饮。","p":2,"r":1},{"t":"寄蜉蝣于天地，渺沧海之一粟。","tr":"我们像蜉蝣一样寄身在天地之间，渺小得如同大海中的一粒谷米。","p":2,"r":1},{"t":"哀吾生之须臾，羡长江之无穷。","tr":"哀叹我们的一生只是短暂的片刻，羡慕长江的奔流没有尽头。","p":2,"r":1},{"t":"挟飞仙以遨游，抱明月而长终。","tr":"想与飞仙携手漫游，拥抱明月而永远长存。","p":2,"r":1},{"t":"知不可乎骤得，托遗响于悲风。”","tr":"明知这愿望不可能轻易实现，只好把心中的感慨寄托在箫声里，任它随着悲凉的秋风飘散。”","p":2,"r":1},{"t":"苏子曰：“客亦知夫水与月乎？","tr":"我说：“您也知道那江水与明月吗？","p":3,"r":1},{"t":"逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。","tr":"流逝的像这江水，却从未真正流走；时圆时缺的像那月亮，却终究没有增减。","p":3,"r":1},{"t":"盖将自其变者而观之，则天地曾不能以一瞬；","tr":"如果从事物变化的一面来看，那么天地间连一眨眼的工夫都不能保持不变；","p":3,"r":1},{"t":"自其不变者而观之，则物与我皆无尽也，而又何羡乎！","tr":"如果从事物不变的一面来看，那么万物和我们都是无穷无尽的，又何必羡慕什么呢！","p":3,"r":1},{"t":"且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。","tr":"再说天地之间，万物各有主人，如果不是我所应有的，即使一丝一毫也不能拿取。","p":3,"r":1},{"t":"惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，","tr":"只有江上的清风，和山间的明月，耳朵听到它就成为声音，眼睛看到它就成为景色，","p":3,"r":1},{"t":"取之无禁，用之不竭。","tr":"拿取它没有人禁止，享用它也不会穷尽。","p":3,"r":1},{"t":"是造物者之无尽藏也，而吾与子之所共适。”","tr":"这是大自然取之不尽的宝藏，而我和您可以共同享用。”","p":3,"r":1},{"t":"客喜而笑，洗盏更酌。","tr":"客人高兴地笑了，洗净酒杯重新斟酒。","p":4,"r":1},{"t":"肴核既尽，杯盘狼籍。","tr":"菜肴和果品都已吃完，杯子盘子杂乱地摆着。","p":4,"r":1},{"t":"相与枕藉乎舟中，不知东方之既白。","tr":"我们互相枕靠着躺在船里，不知不觉东方已经发白了。","p":4,"r":1}],"notes":[{"u":0,"w":"既望","m":"农历每月十六日","t":"实词","d":["农历十五日","月末最后一天"]},{"u":1,"w":"徐","m":"缓缓地","t":"实词","d":["慢慢变凉","轻轻地"]},{"u":1,"w":"兴","m":"起，兴起","t":"实词","d":["兴盛","高兴"]},{"u":2,"w":"属","m":"劝请（读zhǔ）","t":"实词","d":["隶属","连接"]},{"u":2,"w":"窈窕之章","m":"指《诗经·陈风·月出》中含“窈窕”的一章","t":"实词","d":["美丽的篇章","女子的歌曲"]},{"u":3,"w":"少焉","m":"一会儿","t":"实词","d":["少年时","很少"]},{"u":3,"w":"斗牛","m":"斗宿和牛宿，二十八星宿中的两宿","t":"实词","d":["斗和牛两种动物","北斗与牵牛星"]},{"u":4,"w":"横","m":"横贯，笼罩","t":"实词","d":["蛮横","横向穿过"]},{"u":5,"w":"一苇","m":"像一片苇叶般的小船","t":"实词","d":["一根芦苇","一片芦苇荡"]},{"u":5,"w":"如","m":"往，到","t":"实词","d":["如同","如果"]},{"u":5,"w":"凌","m":"越过","t":"实词","d":["欺凌","升高"]},{"u":5,"w":"万顷","m":"形容江面极其宽广","t":"实词","d":["万亩田地","许多波浪"]},{"u":6,"w":"冯","m":"通“凭”，乘，凌","t":"通假","d":["通“凭”，依靠","通“逢”，遇到"]},{"u":6,"w":"御","m":"驾乘","t":"实词","d":["抵御","统治"]},{"u":7,"w":"遗世","m":"离开人世，超脱尘世","t":"实词","d":["留给后世","遗弃别人"]},{"u":7,"w":"羽化","m":"长出翅膀飞升，指成仙","t":"实词","d":["蝉蜕壳变飞虫","羽毛脱落"]},{"u":8,"w":"于是","m":"在这时（“于”“是”两词）","t":"古今异义","d":["表因果的连词，因此","在这件事上"]},{"u":8,"w":"扣","m":"敲，打","t":"实词","d":["扣留","扣紧"]},{"u":9,"w":"空明","m":"月光下澄澈的江水","t":"实词","d":["空虚澄明的心境","天空明亮"]},{"u":9,"w":"溯","m":"逆流而上","t":"实词","d":["追溯往事","顺流而下"]},{"u":10,"w":"渺渺","m":"悠远渺茫的样子","t":"实词","d":["微小的样子","模糊不清"]},{"u":10,"w":"美人","m":"指所思慕的人（寄托理想）","t":"古今异义","d":["漂亮的女子","美好的人才"]},{"u":11,"w":"倚歌","m":"依着歌声的节拍","t":"实词","d":["靠着唱歌","倚仗歌声"]},{"u":11,"w":"和","m":"伴奏，应和（读hè）","t":"一词多义" intro":"乾隆三十九年（1774）冬，姚鼐辞官后冒着风雪来到泰安，与友人朱孝纯同登泰山观日出，写下这篇记游之作，被誉为桐城派散文的名篇。","theme":"按登山经过、观日出、览山中景物依次写来，记叙泰山雪后日出的壮丽，笔法简洁，写出作者对自然的赞叹。","tags":["写景","叙事","游记"],"units":[{"t":"泰山之阳，汶水西流；其阴，济水东流。","tr":"泰山的南面，汶水向西流；北面，济水向东流。","p":0,"r":1},{"t":"阳谷皆入汶，阴谷皆入济。","tr":"南面山谷里的水都流入汶水，北面山谷里的水都流入济水。","p":0,"r":1},{"t":"当其南北分者，古长城也。","tr":"正处在泰山南北分界线上的，是古长城。","p":0,"r":1},{"t":"最高日观峰，在长城南十五里。","tr":"最高的山峰是日观峰，在古长城以南十五里。","p":0,"r":1},{"t":"余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，","tr":"我在乾隆三十九年十二月，从京城出发，冒着风雪，经过齐河、长清，","p":1,"r":1},{"t":"穿泰山西北谷，越长城之限，至于泰安。","tr":"穿过泰山西北的山谷，越过古长城的界限，到了泰安。","p":1,"r":1},{"t":"是月丁未，与知府朱孝纯子颍由南麓登。","tr":"这个月的丁未日，我和知府朱孝纯（字子颍）从泰山南麓登山。","p":1,"r":1},{"t":"四十五里，道皆砌石为磴，其级七千有余。","tr":"山路有四十五里，道路都是用石头砌成的台阶，台阶有七千多级。","p":1,"r":1},{"t":"泰山正南面有三谷。","tr":"泰山的正南面有三条山谷。","p":1,"r":1},{"t":"中谷绕泰安城下，郦道元所谓环水也。","tr":"中间的山谷环绕着泰安城下流过，就是郦道元所说的环水。","p":1,"r":1},{"t":"余始循以入，道少半，越中岭，复循西谷，遂至其巅。","tr":"我起初沿着它进山，走了不到一半路程，越过中岭，又沿着西谷前行，就到了山顶。","p":1,"r":1},{"t":"古时登山，循东谷入，道有天门。","tr":"古时候登泰山，是沿着东谷进去的，路上有一处叫天门的地方。","p":1,"r":1},{"t":"东谷者，古谓之天门溪水，余所不至也。","tr":"东谷，古人称它为天门溪水，是我没有到过的地方。","p":1,"r":1},{"t":"今所经中岭及山巅崖限当道者，世皆谓之天门云。","tr":"如今我所经过的中岭以及山顶上拦在路中的山崖，世人都把它们称作天门。","p":1,"r":1},{"t":"道中迷雾冰滑，磴几不可登。","tr":"路上雾气迷茫，冰层湿滑，石阶几乎无法攀登。","p":1,"r":1},{"t":"及既上，苍山负雪，明烛天南，","tr":"等到登上山顶，青黑的山峰披着白雪，雪光明亮，照亮了南面的天空，","p":1,"r":1},{"t":"望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。","tr":"远望夕阳映照着城郭，汶水、徂徕山像画一样，而半山腰停留的云雾像一条带子。","p":1,"r":1},{"t":"戊申晦，五鼓，与子颍坐日观亭，待日出。","tr":"戊申日是这个月的最后一天，五更时分，我与子颍坐在日观亭里，等待日出。","p":2,"r":1},{"t":"大风扬积雪击面。","tr":"大风卷起地上的积雪，扑打在脸上。","p":2,"r":1},{"t":"亭东自足下皆云漫。","tr":"亭子东面从脚下起，到处都是弥漫的云雾。","p":2,"r":1},{"t":"稍见云中白若樗蒲数十立者，山也。","tr":"渐渐看见云雾中有几十个白得像樗蒲棋子一样竖立着的东西，那是山峰。","p":2,"r":1},{"t":"极天云一线异色，须臾成五采。","tr":"天边云层中出现一线与众不同的颜色，一会儿就变成了五彩缤纷。","p":2,"r":1},{"t":"日上，正赤如丹，下有红光动摇承之。","tr":"太阳升起来，正红得像朱砂，下面有红光摇荡着托住它。","p":2,"r":1},{"t":"或曰，此东海也。","tr":"有人说，这下面就是东海。","p":2,"r":1},{"t":"回视日观以西峰，或得日，或否，绛皓驳色，而皆若偻。","tr":"回头看日观峰以西的各个山峰，有的照到了阳光，有的没有，红的白的颜色错杂，而且都像弯着腰。","p":2,"r":1},{"t":"亭西有岱祠，又有碧霞元君祠。","tr":"日观亭的西面有岱祠，又有碧霞元君祠。","p":3,"r":1},{"t":"皇帝行宫在碧霞元君祠东。","tr":"皇帝的行宫在碧霞元君祠的东面。","p":3,"r":1},{"t":"是日观道中石刻，自唐显庆以来，其远古刻尽漫失。","tr":"这天在日观亭一路所看到的石刻，从唐代显庆年间以来的都有，那些更久远的古代石刻都已磨灭遗失。","p":3,"r":1},{"t":"僻不当道者，皆不及往。","tr":"那些偏僻、不在路边的，都没来得及去看。","p":3,"r":1},{"t":"山多石，少土；石苍黑色，多平方，少圜。","tr":"山上石头多，泥土少；石头呈青黑色，大多是方正平整的，圆形的很少。","p":4,"r":1},{"t":"少杂树，多松，生石罅，皆平顶。","tr":"杂树很少，松树很多，生长在石缝中，树顶都是平的。","p":4,"r":1},{"t":"冰雪，无瀑水，无鸟兽音迹。","tr":"山上有冰雪，没有流水瀑布，也没有鸟兽的声音和踪迹。","p":4,"r":1},{"t":"至日观以西，无树，而雪与人膝齐。","tr":"到了日观峰以西，没有树木，而积雪与人的膝盖一样高。","p":4,"r":1}],"notes":[{"u":0,"w":"阳","m":"山的南面（古以山南水北为阳）","t":"实词","d":["太阳","阳光充足的地方"]},{"u":0,"w":"阴","m":"山的北面","t":"实词","d":["阴暗","背阴潮湿"]},{"u":1,"w":"阳谷","m":"山南面山谷里的水（省略“水”）","t":"特殊句式"},{"u":2,"w":"当","m":"位于，正处在","t":"实词","d":["应当","抵挡"]},{"u":2,"w":"古长城也","m":"“……也”表判断，是古长城","t":"特殊句式"},{"u":4,"w":"乘","m":"趁着，冒着","t":"实词","d":["乘坐","乘法"]},{"u":4,"w":"历","m":"经过","t":"实词","d":["历史","一个接一个"]},{"u":4,"w":"京师","m":"京城，指北京","t":"实词","d":["老师","首都的军队"]},{"u":5,"w":"穿","m":"穿过","t":"实词","d":["穿戴","钻孔"]},{"u":5,"w":"限","m":"界限，门槛","t":"实词","d":["限制","期限"]},{"u":5,"w":"至于","m":"到达（古义）","t":"古今异义","d":["表示另提一事的连词","达到某种程度"]},{"u":6,"w":"是月","m":"这个月（“是”，这）","t":"古今异义","d":["正是这个月","判断系词加月份"]},{"u":6,"w":"南麓","m":"山的南脚","t":"实词","d":["南面的山顶","南边的山谷"]},{"u":7,"w":"砌","m":"用石头垒筑","t":"实词","d":["雕刻","铺设"]},{"u":7,"w":"磴","m":"石头台阶","t":"实词","d":["山路","石桥"]},{"u":7,"w":"级","m":"台阶","t":"实词","d":["等级","年级"]},{"u":9,"w":"绕","m":"环绕，从旁边绕过","t":"实词","d":["缠绕","绕道"]},{"u":9,"w":"所谓","m":"所说的（古义，“所”字结构）","t":"古今异义","d":["所说的那样，含不以为然","人们称作的"]},{"u":10,"w":"循","m":"沿着","t":"实词","d":["遵守","巡视"]},{"u":10,"w":"少半","m":"不到一半","t":"古今异义","d":["很少一半","多于一半"]},{"u":10,"w":"越","m":"越过，翻过","t":"实词","d":["更加","越国"]},{"u":10,"w":"遂","m":"于是，就","t":"实词","d":["顺利","终于完成"]},{"u":10,"w":"巅","m":"山顶","t":"实词","d":["山腰","山脚"]},{"u":12,"w":"余所不至也","m":"“所不至”，所字结构，意为“没有到过的地方”","t":"特殊句式"},{"u":13,"w":"当道","m":"挡在路中间","t":"实词","d":["主持大局","掌权"]},{"u":13,"w":"云","m":"语气词，用于句末，相当于“了”","t":"虚词"},{"u":14,"w":"几","m":"几乎，差不多","t":"实词","d":["几个","多少"]},{"u":15,"w":"及","m":"等到","t":"实词","d":["赶上","和"]},{"u":15,"w":"既","m":"已经","t":"实词","d":["既然","完毕"]},{"u":15,"w":"负","m":"背负，这里指披着","t":"实词","d":["辜负","失败"]},{"u":15,"w":"烛","m":"照亮（名词作动词）","t":"词类活用"},{"u":16,"w":"居","m":"停留，停驻","t":"实词","d":["居住","占据"]},{"u":16,"w":"城郭","m":"城墙，泛指城市","t":"古今异义","d":["城邦与郊区","城市外围的村庄"]},{"u":17,"w":"晦","m":"农历每月的最后一天","t":"实词","d":["昏暗","不明显"]},{"u":17,"w":"五鼓","m":"五更，天将亮时","t":"实词","d":["五声鼓响","傍晚"]},{"u":19,"w":"漫","m":"弥漫，布满","t":"实词","d":["随意","水满溢"]},{"u":20,"w":"稍","m":"渐渐","t":"实词","d":["稍微","略微"]},{"u":20,"w":"樗蒲","m":"古代一种博戏，所用棋子为白色的方形","t":"实词","d":["一种树","古代乐器"]},{"u":21,"w":"极天","m":"天边","t":"实词","d":["极高的天空","整个天空"]},{"u":21,"w":"须臾","m":"一会儿","t":"实词","d":["必须","很久"]},{"u":21,"w":"采","m":"通“彩”，彩色","t":"通假","d":["通“踩”，踏","通“菜”，蔬菜"]},{"u":22,"w":"丹","m":"朱砂，红色颜料","t":"实词","d":["丹药","红花"]},{"u":22,"w":"动摇","m":"摇动，摇荡","t":"古今异义","d":["意志不坚定","不稳固"]},{"u":22,"w":"承","m":"托着，捧着","t":"实词","d":["承担","继承"]},{"u":23,"w":"或","m":"有人","t":"实词","d":["或许","或者"]},{"u":24,"w":"驳色","m":"杂色，颜色错杂","t":"实词","d":["驳斥的颜色","褪色"]},{"u":24,"w":"偻","m":"弯腰曲背","t":"实词","d":["高大","挺立"]},{"u":24,"w":"绛皓","m":"红色和白色","t":"实词","d":["红色与黑色","白色与金色"]},{"u":27,"w":"是","m":"这，代词","t":"古今异义","d":["表判断的系词","对的"]},{"u":27,"w":"漫失","m":"磨灭遗失，模糊不清","t":"实词","d":["随意丢失","随水漂走"]},{"u":28,"w":"僻","m":"偏僻","t":"实词","d":["偏爱","怪异"]},{"u":29,"w":"平方","m":"平正方整","t":"古今异义","d":["一个数的二次幂","平整的地方"]},{"u":29,"w":"圜","m":"通“圆”，圆形","t":"通假","d":["通“环”，环绕","通“远”，远方"]},{"u":30,"w":"石罅","m":"石头的缝隙","t":"实词","d":["石洞","岩石上的平面"]},{"u":31,"w":"音迹","m":"声音和踪迹","t":"实词","d":["音乐的痕迹","回声"]},{"u":32,"w":"齐","m":"一样高，平","t":"实词","d":["整齐","全都"]}],"tricky":["汶","济","徂徕","樗蒲","绛皓","圜"],"keyLines":[{"u":14,"hint":"《登泰山记》中，描写登山途中雾气重、冰层滑、台阶几乎难以攀登的句子是："},{"u":16,"hint":"《登泰山记》中，写登顶后远望夕阳照城郭、半山云雾如带的句子是："},{"u":21,"hint":"《登泰山记》中，描写日出前天边云色由一线异色转为多彩的句子是："},{"u":22,"hint":"《登泰山记》中，写日出时太阳颜色与红光托举之景的句子是："},{"u":31,"hint":"《登泰山记》中，写泰山冬日寂静、不见瀑布和鸟兽的句子是："}],"appr":[{"q":"第一段在全文中起什么作用？","a":"开篇先交代泰山南北的水系与古长城的位置，点明泰山的地理形势，并带出日观峰这一最高点，既说明全文的主要地点，也为后文登顶观日出作铺垫，写法简洁。"},{"q":"作者是如何描写日出的？有何特色？","a":"按“云漫—白山—异色—五采—日上—红光承之”的顺序写，抓住颜色与形态的变化，用“正赤如丹”“动摇承之”写出旭日初升的壮美。语言简练，层次分明。"},{"q":"全文在写法上有什么特点？","a":"以时间和游踪为线索，先写登山，再写观日出，后写山中景物，详略得当。多用短句，不事雕饰，记叙、写景融为一体，体现桐城派“雅洁”的文风。"}]},{"id":"h1b-p01","volume":"h1b","title":"登岳阳楼","author":"杜甫","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"大历三年（768年）冬，杜甫出峡后漂泊到岳阳，登上岳阳楼，面对浩瀚的洞庭湖，写下这首晚年名作。","theme":"借洞庭湖的壮阔景象，抒写自己老病孤舟、漂泊无依的身世之悲，以及对国家战乱的深切忧虑。","tags":["登临","忧国","抒怀"],"units":[{"t":"昔闻洞庭水，今上岳阳楼。","tr":"从前就听说过洞庭湖的盛名，今天终于登上了岳阳楼。","p":0,"r":1},{"t":"吴楚东南坼，乾坤日夜浮。","tr":"浩瀚的湖水把吴地和楚地分裂在东南两边，天地仿佛日夜漂浮在湖面之上。","p":0,"r":1},{"t":"亲朋无一字，老病有孤舟。","tr":"亲戚朋友没有一点音讯寄来，年老多病的我只有一叶孤舟相伴。","p":1,"r":1},{"t":"戎马关山北，凭轩涕泗流。","tr":"北方边关一带仍战火不息，我倚着楼窗遥望，不禁泪水纵横。","p":1,"r":1}],"notes":[{"u":1,"w":"坼","m":"分裂，裂开","t":"实词","d":["倒塌","相连"]},{"u":1,"w":"乾坤","m":"天地","t":"实词","d":["日月","阴阳二气"]},{"u":2,"w":"无一字","m":"没有一点音信","t":"实词","d":["不识字","没有一首诗"]},{"u":2,"w":"老病","m":"年老多病","t":"实词","d":["衰老而死","病痛的老人"]},{"u":3,"w":"戎马","m":"战马，指战争","t":"实词","d":["军队的统帅","骑兵的坐骑"]},{"u":3,"w":"凭轩","m":"倚靠着楼上的窗或栏杆","t":"实词","d":["凭借车驾","登上高楼"]},{"u":3,"w":"涕泗","m":"眼泪和鼻涕，泛指眼泪","t":"实词","d":["口水","汗水"]}],"tricky":["坼","乾坤","涕泗","轩"],"keyLines":[{"u":1,"hint":"《登岳阳楼》中，以“坼”和“浮”两个动词写出洞庭湖广阔浩渺、吞吐天地气势的两句是："},{"u":2,"hint":"《登岳阳楼》中，写诗人亲友音讯断绝、自己年老多病又孤身漂泊的两句是："},{"u":3,"hint":"《登岳阳楼》中，表现诗人心系国事、忧时伤世而泪流不止的两句是："}],"appr":[{"q":"颔联“吴楚东南坼，乾坤日夜浮”好在哪里？","a":"“坼”“浮”二字炼得极好，写出湖面辽阔，仿佛把吴楚大地劈开、让天地浮动，以夸张的笔法展现洞庭湖的雄浑气势，也为下文抒写个人渺小孤独的处境形成强烈反衬。"},{"q":"全诗情感如何变化？","a":"前两联由闻名到登临，写景壮阔；颈联转入个人处境，写亲朋断绝、老病孤舟的凄凉；尾联再由个人推及国家，以北方战乱作结，使身世之悲融入忧国之痛，境界由大转悲而更显深沉。"},{"q":"颈联与尾联分别抒发了什么感情？","a":"颈联抒发漂泊无依、老病孤独的个人身世之感；尾联写关山以北战事未息，诗人凭窗流泪，表达对国家动荡、百姓苦难的忧虑，家国之痛合而为一。"}]},{"id":"h1b-p02","volume":"h1b","title":"桂枝香·金陵怀古","author":"王安石","dynasty":"北宋","genre":"词","kind":"poem","intro":"王安石出知江宁府（金陵）时登高远望，写下这首怀古词。词以壮阔的秋景起笔，下片借六朝兴亡发议论，是北宋怀古词的名篇。","theme":"描绘金陵晚秋的壮丽景色，借六朝荒淫亡国的史事，抒发对历史兴亡的感慨，寄寓对时局的忧虑。","tags":["怀古","写景","咏史"],"units":[{"t":"登临送目，正故国晚秋，天气初肃。","tr":"登上高处极目远望，正是故都金陵的深秋，天气刚刚转为清冷肃杀。","p":0,"r":1},{"t":"千里澄江似练，翠峰如簇。","tr":"千里长江澄澈如一条白练，青翠的山峰聚集成簇。","p":0,"r":1},{"t":"归帆去棹残阳里，背西风，酒旗斜矗。","tr":"来来往往的船只在夕阳余晖中航行，酒旗迎着西风斜斜地竖立着。","p":0,"r":1},{"t":"彩舟云淡，星河鹭起，画图难足。","tr":"彩饰的船只在淡云般的水汽中穿行，白鹭从江中沙洲飞起，这景象连图画也难以画尽。","p":0,"r":1},{"t":"念往昔、繁华竞逐，叹门外楼头，悲恨相续。","tr":"想起往昔，六朝的帝王贵族竞相追逐奢华，可叹在城门外楼头发生的亡国悲剧，一再重演。","p":1,"r":1},{"t":"千古凭高对此，谩嗟荣辱。","tr":"千百年来人们登高望此江山，只是徒然感叹兴衰荣辱。","p":1,"r":1},{"t":"六朝旧事如流水，但寒烟衰草凝绿。","tr":"六朝旧事如同流水一去不返，如今只剩下冷烟和衰草凝结着一片青绿。","p":1,"r":1},{"t":"至今商女，时时犹唱，后庭遗曲。","tr":"直到今天，歌女们还时常唱着亡国之君留下的《后庭花》遗曲。","p":1,"r":1}],"notes":[{"u":0,"w":"故国","m":"旧都，指金陵","t":"古今异义","d":["自己的祖国","古老的国家"]},{"u":0,"w":"肃","m":"肃杀，清冷萧瑟","t":"实词","d":["严肃","恭敬"]},{"u":1,"w":"练","m":"白色的绢","t":"实词","d":["练习","熟练"]},{"u":1,"w":"簇","m":"聚集，丛聚","t":"实词","d":["箭头","尖锐"]},{"u":2,"w":"棹","m":"船桨，此指船","t":"实词","d":["桌子","划水的动作"]},{"u":2,"w":"矗","m":"直立，高耸","t":"实词","d":["倾斜","飘动"]},{"u":3,"w":"星河","m":"天河，此处指长江（一说银河般的江水）","t":"实词","d":["满天星斗","江中的沙洲"]},{"u":4,"w":"门外楼头","m":"指陈后主时隋兵已至朱雀门外而后主仍在结绮阁上寻欢的史事","t":"实词","d":["城门外的酒楼","门前的楼阁"]},{"u":5,"w":"谩嗟","m":"徒然感叹","t":"实词","d":["傲慢地叹息","随意叹息"]},{"u":7,"w":"商女","m":"歌女","t":"古今异义","d":["商人的女儿","经商的妇女"]},{"u":7,"w":"后庭遗曲","m":"指陈后主所作《玉树后庭花》，被视为亡国之音","t":"实词","d":["后宫流传的乐曲","宫廷的失传古曲"]}],"tricky":["棹","矗","簇","谩嗟","凝绿"],"keyLines":[{"u":1,"hint":"《桂枝香·金陵怀古》中，以比喻写长江澄澈、青山聚拢的壮阔秋景的两句是："},{"u":6,"hint":"词中以“流水”“寒烟衰草”概括六朝兴亡旧事已成陈迹的句子是："},{"u":7,"hint":"词的结尾借歌女仍唱亡国之曲，暗含讽喻的三句是："},{"u":0,"hint":"词的开篇点明登高远望、时令地点的句子是："}],"appr":[{"q":"上片写景有什么特点？","a":"由江到山、由舟到酒旗，再到云、鹭，层次分明，色彩清丽开阔。既有“澄江似练，翠峰如簇”的宏观画面，又有帆、旗、鹭等细节点缀，动静结合，为下片怀古铺垫了苍凉背景。"},{"q":"下片怀古的用意是什么？","a":"词人借六朝竞逐繁华而相继灭亡的史事，说明沉溺奢靡必致亡国。结句写商女仍唱《后庭花》，暗讽当时统治者不以前朝为鉴，含有对北宋时局的忧虑和劝诫。"},{"q":"这首词在结构和手法上有何特点？","a":"上片写景、下片抒怀，由景生情，情景交融；下片多用典故，并以议论作结，使词的意境由壮阔转为沉郁，打破了“词为艳科”的传统，具有雄健的格调。"}]},{"id":"h1b-p03","volume":"h1b","title":"念奴娇·过洞庭","author":"张孝祥","dynasty":"南宋","genre":"词","kind":"poem","intro":"乾道二年（1166年），张孝祥被罢官，自桂林北归，途经洞庭湖时写下此词。词借月夜洞庭的澄澈景象，抒写光明磊落的胸怀。","theme":"描绘洞庭月夜水天一色的空明境界，抒发词人胸襟澄澈、超然物外、傲视世俗的豪情。","tags":["写景","抒怀","豪放"],"units":[{"t":"洞庭青草，近中秋、更无一点风色。","tr":"洞庭湖和青草湖相连，临近中秋，一点风也没有。","p":0,"r":1},{"t":"玉鉴琼田三万顷，著我扁舟一叶。","tr":"三万顷的湖面像白玉镜子和美玉铺成的田野，我这一叶小舟就置身其中。","p":0,"r":1},{"t":"素月分辉，银河共影，表里俱澄澈。","tr":"皎洁的月亮洒下光辉，银河也倒映在湖中，天上水里上下一片澄澈透明。","p":0,"r":1},{"t":"悠然心会，妙处难与君说。","tr":"我悠然自得，心中领会，这美妙的境界难以对你细说。","p":0,"r":1},{"t":"应念岭海经年，孤光自照，肝胆皆冰雪。","tr":"回想在岭南一年多的岁月，只有月亮的孤光陪伴，我的心胸像冰雪一样纯洁。","p":1,"r":1},{"t":"短发萧骚襟袖冷，稳泛沧浪空阔。","tr":"我头发稀疏短少，衣襟衣袖一片清冷，却安稳地泛舟在空阔的湖面上。","p":1,"r":1},{"t":"尽挹西江，细斟北斗，万象为宾客。","tr":"我要舀尽西江之水，慢慢用北斗七星斟酒，请天地万物都来做我的宾客。","p":1,"r":1},{"t":"扣舷独啸，不知今夕何夕。","tr":"我敲着船舷独自长啸，竟不知今夜是何年何夕。","p":1,"r":1}],"notes":[{"u":0,"w":"更","m":"更加、再","t":"虚词","d":[]},{"u":1,"w":"玉鉴","m":"玉制的镜子，形容湖面平静明亮","t":"实词","d":["玉做的鉴定","镶玉的器皿"]},{"u":1,"w":"著","m":"放置，使置身于","t":"实词","d":["显著","穿着"]},{"u":1,"w":"扁舟","m":"小船","t":"实词","d":["扁平的船板","破旧的船"]},{"u":2,"w":"表里","m":"里外，指天上和水中","t":"古今异义","d":["外表和内心","正面与反面"]},{"u":4,"w":"岭海","m":"岭南和南海一带，指作者任职的广西","t":"实词","d":["山岭与大海","海边的山岭"]},{"u":4,"w":"孤光","m":"指孤零零的月光","t":"实词","d":["孤独的灯光","孤高的光彩"]},{"u":5,"w":"萧骚","m":"稀疏的样子","t":"实词","d":["萧条冷落","风声萧瑟"]},{"u":5,"w":"沧浪","m":"青苍色的水，此指湖水","t":"实词","d":["江边的亭子","浪花翻涌"]},{"u":6,"w":"挹","m":"舀取","t":"实词","d":["推让","抑制"]},{"u":6,"w":"万象","m":"天地间一切景物","t":"实词","d":["各种迹象","众多的气象官"]},{"u":6,"w":"宾客","m":"名词作动词，意为当作宾客","t":"词类活用","d":[]}],"tricky":["鉴","琼","澄澈","萧骚","挹","舷"],"keyLines":[{"u":2,"hint":"《念奴娇·过洞庭》中，写月光、银河倒映湖中，天水上下通明的三句是："},{"u":4,"hint":"词中词人以“冰雪”自比，表白自己光明磊落、问心无愧的句子是："},{"u":6,"hint":"词中表现词人气吞天地、豪迈不羁的想象之句是："},{"u":3,"hint":"《念奴娇·过洞庭》中，表现词人沉醉美景、心领神会却难以言传的两句是："}],"appr":[{"q":"上片是如何描写洞庭月夜之景的？","a":"先写中秋将近、风平浪静，再以“玉鉴琼田”比喻湖面，以“扁舟一叶”与三万顷湖面对照，月光银河与湖水交相辉映，写出空明澄澈、物我相融的境界，为下片抒怀作铺垫。"},{"q":"下片表现了词人怎样的胸襟？","a":"词人回顾岭南岁月，以“肝胆皆冰雪”自表忠诚磊落；虽然短发衣单，却安然泛舟；末尾设想舀西江、斟北斗，邀万象为宾客，表现出豪迈洒脱、傲视世俗的气概。"},{"q":"这首词的艺术特色是什么？","a":"情景交融，写景由实入虚；想象奇特，夸张瑰丽；结句忘怀时间，浪漫旷达，风格近似苏轼，豪放清旷。"}]},{"id":"h1b-p04","volume":"h1b","title":"游园","author":"汤显祖","dynasty":"明","genre":"传奇（戏曲）·《牡丹亭》节选","kind":"poem","intro":"《牡丹亭》是汤显祖的代表作，写杜丽娘与柳梦梅生死相恋的故事。《游园》选自第十出《惊梦》的前半部分，写杜丽娘在丫鬟春香陪伴下初次游览后花园的所见所感。","theme":"借春日园景的繁盛与冷落，刻画杜丽娘青春觉醒、伤春自怜的心理，表现对自由与美好生活的向往。","tags":["戏曲","写景","抒情"],"units":[{"t":"梦回莺啭，乱煞年光遍。","tr":"从梦中醒来，听见黄莺婉转啼叫，春光遍地，让人心绪纷乱。","p":0,"r":0},{"t":"人立小庭深院。","tr":"我独自站在幽深院落的小庭中。","p":0,"r":0},{"t":"炷尽沉烟，抛残绣线，恁今春关情似去年？","tr":"沉香已经燃尽，绣线也丢在一旁，为何今年春天牵动的情思比去年更甚？","p":0,"r":0},{"t":"袅晴丝吹来闲庭院，摇漾春如线。","tr":"晴日里飘荡的游丝被风吹进幽静的庭院，摇摇荡荡，像一根春天的线。","p":1,"r":1},{"t":"停半晌、整花钿。","tr":"停下片刻，整理一下头上的花钿。","p":1,"r":1},{"t":"没揣菱花，偷人半面，迤逗的彩云偏。","tr":"不料菱花镜偷偷照出我半边脸，引得如云的发髻都歪斜了。","p":1,"r":1},{"t":"步香闺怎便把全身现！","tr":"我迈出闺房，怎么就让整个身影都显露出来了！","p":1,"r":1},{"t":"你道翠生生出落的裙衫儿茜，艳晶晶花簪八宝瑱。","tr":"你说我这翠生生的裙衫红得鲜艳，亮闪闪的花簪镶着八宝首饰。","p":2,"r":1},{"t":"可知我一生儿爱好是天然。","tr":"可你知道吗，我一生爱的是天然之美。","p":2,"r":1},{"t":"恰三春好处无人见。","tr":"偏偏这三春的好光景无人来看。","p":2,"r":1},{"t":"不提防沉鱼落雁鸟惊喧，则怕的羞花闭月花愁颤。","tr":"没提防连鱼雁都被惊得沉落、鸟儿被惊得喧闹，只怕花儿也羞得颤抖，月亮也躲进云里。","p":2,"r":1},{"t":"原来姹紫嫣红开遍，似这般都付与断井颓垣。","tr":"原来满园姹紫嫣红的鲜花开得到处都是，却都白白地抛给了残破的井栏和倒塌的矮墙。","p":3,"r":1},{"t":"良辰美景奈何天，赏心乐事谁家院！","tr":"美好的时光和景致，却无可奈何地度过，赏心乐事又落在谁家的庭院呢！","p":3,"r":1},{"t":"朝飞暮卷，云霞翠轩；","tr":"清晨的云霞飞舞，傍晚的云霞卷收，映着翠色的楼阁；","p":3,"r":1},{"t":"雨丝风片，烟波画船——","tr":"细雨如丝，微风吹拂，烟波之上浮着画船——","p":3,"r":1},{"t":"锦屏人忒看的这韶光贱！","tr":"可深闺中的人却太不把这大好春光当回事！","p":3,"r":1},{"t":"遍青山啼红了杜鹃，荼蘼外烟丝醉软。","tr":"杜鹃啼遍青山，仿佛把花也啼红了；荼蘼花外，柔软的烟丝般的柳丝像喝醉了一样低垂。","p":4,"r":1},{"t":"春香呵，牡丹虽好，他春归怎占的先！","tr":"春香啊，牡丹花虽然好，可它在春天将尽时开放，怎么能占得先机呢！","p":4,"r":1},{"t":"闲凝眄，生生燕语明如剪，呖呖莺歌溜的圆。","tr":"闲来凝神细看，只听燕子的啼声清脆如剪，黄莺的歌声婉转圆润。","p":4,"r":1}],"notes":[{"u":0,"w":"乱煞","m":"搅乱得厉害，使人心绪烦乱","t":"实词","d":["杀死","吵闹"]},{"u":0,"w":"莺啭","m":"黄莺婉转鸣叫","t":"实词","d":["黄莺飞舞","黄莺惊飞"]},{"u":2,"w":"恁","m":"怎么，为何","t":"实词","d":["你们","这样"]},{"u":3,"w":"袅","m":"（游丝）飘荡摇曳","t":"实词","d":["鸟叫声","烟雾升腾"]},{"u":3,"w":"晴丝","m":"晴天空中飘荡的游丝","t":"实词","d":["晴天织的丝线","细雨"]},{"u":4,"w":"花钿","m":"头上的花形首饰","t":"实词","d":["花朵","铜钱"]},{"u":5,"w":"菱花","m":"镜子（古代铜镜背面常有菱花纹）","t":"实词","d":["菱角花","池塘中的花"]},{"u":5,"w":"迤逗","m":"引逗，撩惹","t":"实词","d":["缓慢行走","曲折迂回"]},{"u":7,"w":"茜","m":"红色，大红","t":"实词","d":["茜草","青绿色"]},{"u":7,"w":"瑱","m":"垂挂的玉饰，此指首饰","t":"实词","d":["镇压","填充"]},{"u":10,"w":"沉鱼落雁","m":"形容女子容貌极美","t":"实词","d":["鱼雁受惊坠落","水中鱼和天上雁"]},{"u":11,"w":"姹紫嫣红","m":"各种娇艳的花朵，色彩鲜艳","t":"实词","d":["紫红色的衣裳","花谢后的残红"]},{"u":11,"w":"颓垣","m":"倒塌的矮墙","t":"实词","d":["颓废的人","坚固的城墙"]},{"u":12,"w":"奈何天","m":"无可奈何的时光（心境）","t":"实词","d":["没有办法的老天爷","无奈的天气"]},{"u":15,"w":"锦屏人","m":"深闺中的人，指闺中女子","t":"实词","d":["画屏上的人","织锦的工匠"]},{"u":15,"w":"忒","m":"太，过于","t":"实词","d":["特别","差错"]},{"u":15,"w":"韶光","m":"美好的春光","t":"实词","d":["少年时光","山的名字"]},{"u":16,"w":"荼蘼","m":"花名，春末夏初开放，常被用来象征春尽","t":"实词","d":["茶叶的一种","夏天的荷花"]},{"u":18,"w":"眄","m":"斜看，细看","t":"实词","d":["闭眼","回头"]}],"tricky":["姹紫嫣红","颓垣","荼蘼","韶光","菱花","呖呖"],"keyLines":[{"u":11,"hint":"《游园》中，写满园春花盛开，却无人欣赏、被冷落于残垣断井的两句是："},{"u":12,"hint":"杜丽娘感叹美好时光和赏心乐事无处安放、难以如愿的两句是："},{"u":15,"hint":"《游园》中，批评深闺女子不重视大好春光的句子是："},{"u":18,"hint":"《游园》中，以“剪”“圆”形容燕语莺歌，写其清脆婉转的两句是："}],"appr":[{"q":"【皂罗袍】“原来姹紫嫣红开遍，似这般都付与断井颓垣”表达了什么情感？","a":"以姹紫嫣红的繁花与断井颓垣的荒凉形成强烈对比，既写出春色满园却无人赏玩的冷落，也暗喻杜丽娘青春美好却被禁锢深闺的处境，表达了她惜春伤春、对自由生活的向往。"},{"q":"“良辰美景奈何天，赏心乐事谁家院”在曲中起什么作用？","a":"这两句化用谢灵运“天下良辰美景赏心乐事四者难并”的意思，以反问和感叹表现眼前良辰美景却无处寄托的失落，使景中之情升华为对命运的叹息，是全曲情感转折的关键。"},{"q":"这套曲词在语言上有什么特点？","a":"辞藻华美，多用比喻、对偶、叠词和口语化的衬字，如“生生”“呖呖”，既富有音乐美，又细腻地传达出杜丽娘的内心波澜，情景交融。"}]},{"id":"h1b-w01","volume":"h1b","title":"子路、曾皙、冉有、公西华侍坐","author":"孔子弟子及再传弟子","dynasty":"先秦","genre":"语录体（《论语·先进》）","kind":"prose","intro":"选自《论语·先进》。记孔子与四位弟子闲坐，请他们各谈志向，并对各人的回答加以点评，集中体现了儒家“为国以礼”的政治理想。","theme":"借四子言志，表现孔子重礼乐教化、崇尚仁政的主张，也刻画出四位弟子各异的性格。","tags":["言志","儒家","对话","叙事"],"units":[{"t":"子路、曾皙、冉有、公西华侍坐。","tr":"子路、曾皙、冉有、公西华四人陪着孔子坐着。","p":0,"r":0},{"t":"子曰：“以吾一日长乎尔，毋吾以也。","tr":"孔子说：“我年纪比你们大一点，你们不要因为我年长就不敢说话。","p":1,"r":1},{"t":"居则曰：‘不吾知也！’如或知尔，则何以哉？”","tr":"你们平时总说：‘没有人了解我呀！’假如有人了解你们，那你们打算怎么做呢？”","p":1,"r":1},{"t":"子路率尔而对曰：“千乘之国，摄乎大国之间，加之以师旅，因之以饥馑；","tr":"子路不假思索地抢先回答：“一个拥有千辆兵车的国家，夹在几个大国之间，外面有军队来侵犯，国内又接连遭遇饥荒；","p":2,"r":1},{"t":"由也为之，比及三年，可使有勇，且知方也。”","tr":"让我去治理它，等到三年，就能使百姓有勇气，并且懂得做人的道理。”","p":2,"r":1},{"t":"夫子哂之。","tr":"孔子微微一笑。","p":3,"r":0},{"t":"“求！尔何如？”","tr":"“冉求，你怎么样？”","p":4,"r":0},{"t":"对曰：“方六七十，如五六十，求也为之，比及三年，可使足民。","tr":"冉有回答：“一个纵横六七十里或五六十里的小国，让我去治理，等到三年，可以让百姓富足起来。","p":4,"r":0},{"t":"如其礼乐，以俟君子。”","tr":"至于礼乐教化，就只好等待贤明的君子来推行了。”","p":4,"r":0},{"t":"“赤！尔何如？”","tr":"“公西赤，你怎么样？”","p":5,"r":0},{"t":"对曰：“非曰能之，愿学焉。","tr":"公西华回答：“不敢说我已经有这个能力，只是愿意学着去做。","p":5,"r":0},{"t":"宗庙之事，如会同，端章甫，愿为小相焉。”","tr":"祭祀的事，或者诸侯会盟朝见，我愿穿着礼服、戴着礼帽，做一个小小的司仪。”","p":5,"r":0},{"t":"“点！尔何如？”","tr":"“曾点，你怎么样？”","p":6,"r":0},{"t":"鼓瑟希，铿尔，舍瑟而作，对曰：“异乎三子者之撰。”","tr":"曾皙弹瑟的声音渐渐稀疏，“铿”的一声收住，他放下瑟站起来，回答说：“我的想法和他们三位所讲的不一样。”","p":6,"r":1},{"t":"子曰：“何伤乎？亦各言其志也！”","tr":"孔子说：“有什么妨碍呢？不过是各自说说自己的志向罢了！”","p":6,"r":1},{"t":"曰：“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。”","tr":"曾皙说：“暮春时节，春天的衣服已经穿上了，我和五六位成年人、六七个少年，到沂水里洗洗澡，在舞雩台上吹吹风，一路唱着歌回来。”","p":6,"r":1},{"t":"夫子喟然叹曰：“吾与点也！”","tr":"孔子长长地叹了一口气说：“我赞成曾点的想法啊！”","p":6,"r":1},{"t":"三子者出，曾皙后。","tr":"子路、冉有、公西华三人退出，曾皙留在最后。","p":7,"r":0},{"t":"曾皙曰：“夫三子者之言何如？”","tr":"曾皙问：“他们三位的话怎么样？”","p":7,"r":0},{"t":"子曰：“亦各言其志也已矣。”","tr":"孔子说：“也不过是各人说说自己的志向罢了。”","p":7,"r":0},{"t":"曰：“夫子何哂由也？”","tr":"曾皙又问：“老师为什么笑仲由呢？”","p":7,"r":0},{"t":"曰：“为国以礼，其言不让，是故哂之。”","tr":"孔子说：“治理国家要靠礼，可他说话一点不谦让，所以我笑他。”","p":7,"r":0},{"t":"“唯求则非邦也与？”“安见方六七十如五六十而非邦也者？”","tr":"（曾皙问：）“难道冉求讲的就不是治国吗？”（孔子答：）“哪里见得纵横六七十里、五六十里的地方就不是国家呢？”","p":7,"r":0},{"t":"“唯赤则非邦也与？”“宗庙会同，非诸侯而何？","tr":"（曾皙问：）“难道公西赤讲的就不是治国吗？”（孔子答：）“祭祀宗庙、诸侯会见，不是诸侯的事又是什么？","p":7,"r":0},{"t":"赤也为之小，孰能为之大？”","tr":"公西赤只愿做小司仪，那谁能去做大司仪呢？”","p":7,"r":0}],"notes":[{"u":1,"w":"长","m":"年长，比……大","t":"实词","d":["增长","擅长"]},{"u":1,"w":"毋吾以也","m":"即“毋以吾”，不要因为我（年长而不敢说）","t":"特殊句式"},{"u":2,"w":"不吾知也","m":"即“不知吾”，没有人了解我（否定句宾语前置）","t":"特殊句式"},{"u":2,"w":"或","m":"有人","t":"实词","d":["或许","有时"]},{"u":2,"w":"何以","m":"即“以何”，用什么（办法）","t":"特殊句式"},{"u":3,"w":"率尔","m":"急遽而不加思考的样子","t":"实词","d":["坦率真诚的样子","带头领先的样子"]},{"u":3,"w":"乘","m":"兵车（一车四马为一乘）","t":"古今异义","d":["乘坐","计算"]},{"u":3,"w":"摄","m":"夹处，夹在中间","t":"实词","d":["摄取","代理管理"]},{"u":3,"w":"因","m":"接连，继之以","t":"实词","d":["因为","依靠"]},{"u":3,"w":"饥馑","m":"泛指饥荒（谷物不熟为饥，蔬菜不熟为馑）","t":"实词","d":["饥饿而瘦弱","贫穷困苦"]},{"u":4,"w":"比及","m":"等到","t":"实词","d":["相比","追赶到"]},{"u":4,"w":"方","m":"道理，合乎礼义的行事准则","t":"实词","d":["方向","地方"]},{"u":5,"w":"哂","m":"微笑（带有讥笑的意味）","t":"实词","d":["大笑","叹息"]},{"u":7,"w":"足民","m":"使百姓富足","t":"词类活用"},{"u":8,"w":"俟","m":"等待","t":"实词","d":["侍奉","依靠"]},{"u":8,"w":"如","m":"至于","t":"实词","d":["如果","好像"]},{"u":11,"w":"端章甫","m":"穿着礼服、戴着礼帽（名词作动词）","t":"词类活用"},{"u":11,"w":"会同","m":"诸侯会见盟聚（会见称会，共同朝见天子称同）","t":"实词","d":["会合相同","聚会协商"]},{"u":13,"w":"希","m":"稀疏，稀少（“稀”的本字）","t":"通假","d":["希望","罕见"]},{"u":13,"w":"作","m":"站起来","t":"实词","d":["创作","兴起"]},{"u":13,"w":"撰","m":"才能，才具（此指为政的抱负）","t":"实词","d":["撰写","文章"]},{"u":14,"w":"伤","m":"妨害","t":"实词","d":["受伤","悲伤"]},{"u":15,"w":"莫","m":"通“暮”，晚","t":"通假","d":["没有谁","不要"]},{"u":15,"w":"风乎舞雩","m":"在舞雩台上吹风乘凉（名词作动词）","t":"词类活用"},{"u":15,"w":"咏","m":"唱歌，吟唱","t":"实词","d":["咏叹","朗诵诗文"]},{"u":16,"w":"喟然","m":"叹息的样子","t":"实词","d":["高兴的样子","叹服的样子"]},{"u":16,"w":"与","m":"赞同","t":"实词","d":["给予","参与"]},{"u":22,"w":"与","m":"通“欤”，句末疑问语气词","t":"通假","d":["参与","和、同"]},{"u":22,"w":"安见","m":"哪里见得，怎么见得","t":"实词","d":["平安地见到","怎能看见"]}],"tricky":["哂","铿","舞雩","饥馑","喟","俟"],"keyLines":[{"u":15,"hint":"曾皙描绘暮春时节与人同游、沐浴吹风、歌咏而归的情景的句子是："},{"u":16,"hint":"孔子听了曾皙的志向，感慨地表示赞同的句子是："},{"u":14,"hint":"孔子鼓励学生不要顾虑，大家各自说出志向的句子是："},{"u":4,"hint":"子路自述若让他治理千乘之国，三年能使百姓有勇气又懂道理的句子是："},{"u":21,"hint":"孔子解释为什么笑子路，指出治国要靠礼，而子路说话不谦让的句子是："},{"u":8,"hint":"冉有自谦，说礼乐教化的事情要等待贤人来做的句子是："}],"appr":[{"q":"四位弟子的志向有何不同？反映出各自怎样的性格？","a":"子路想使大国强起来，语气急切自信；冉有愿使小国富足，礼乐则谦让他人；公西华只愿做个小司仪，十分谦逊；曾皙描绘暮春出游，从容洒脱。四人言辞各异，性格鲜明。"},{"q":"孔子为什么独独赞同曾皙，“吾与点也”蕴含着什么思想？","a":"曾皙所描绘的是百姓安居乐业、人人和乐、礼乐融洽的太平景象，正是孔子“礼治”“仁政”的最高理想；它比单纯的治军、理财、做司仪更接近教化的终极目的，所以孔子深表赞同。"},{"q":"孔子为什么“哂”子路，却认为冉有、公西华说的也是治国之事？","a":"孔子认为治国要以礼，子路言辞急躁、毫不谦让，与礼的精神相违，所以微笑；而冉有、公西华所述都属于国家大事，只是态度谦逊，因此孔子肯定他们所说同样是“邦”事。"}]},{"id":"h1b-w02","volume":"h1b","title":"齐桓晋文之事","author":"孟子及其弟子","dynasty":"先秦","genre":"论说文（《孟子·梁惠王上》）","kind":"prose","intro":"选自《孟子·梁惠王上》。孟子游说齐宣王，借“以羊易牛”一事引导他认识自己的仁心，进而劝他放弃武力争霸，推行保民而王的仁政。","theme":"主张以仁政“保民而王”，提出制民之产、教化百姓的治国方案，批评以武力求霸的做法。","tags":["议论","仁政","儒家","说理"],"units":[{"t":"齐宣王问曰：“齐桓、晋文之事，可得闻乎？”","tr":"齐宣王问道：“齐桓公、晋文公称霸的事迹，可以讲给我听听吗？”","p":0,"r":0},{"t":"孟子对曰：“仲尼之徒无道桓、文之事者，是以后世无传焉，臣未之闻也。","tr":"孟子回答说：“孔子的门徒没有谈论齐桓、晋文之事的，所以后世没有流传，我没有听说过。","p":0,"r":0},{"t":"无以，则王乎？”","tr":"如果一定要我讲，那就讲讲用仁德统一天下的王道吧？”","p":0,"r":0},{"t":"曰：“德何如，则可以王矣？”","tr":"宣王问：“具备怎样的德行，就可以称王天下了？”","p":1,"r":1},{"t":"曰：“保民而王，莫之能御也。”","tr":"孟子说：“安抚爱护百姓而称王天下，没有人能够阻挡。”","p":1,"r":1},{"t":"曰：“若寡人者，可以保民乎哉？”","tr":"宣王问：“像我这样的人，能够安抚百姓吗？”","p":1,"r":0},{"t":"曰：“可。”","tr":"孟子说：“可以。”","p":1,"r":0},{"t":"曰：“何由知吾可也？”","tr":"宣王问：“根据什么知道我可以呢？”","p":1,"r":0},{"t":"曰：“臣闻之胡龁曰，王坐于堂上，有牵牛而过堂下者，王见之，曰：‘牛何之？’","tr":"孟子说：“我听胡龁说，大王坐在堂上，有人牵着牛从堂下走过，大王看见了，问：‘牛要牵到哪里去？’","p":2,"r":0},{"t":"对曰：‘将以衅钟。’王曰：‘舍之！吾不忍其觳觫，若无罪而就死地。’","tr":"那人回答：‘要用它的血涂钟。’大王说：‘放了它！我不忍心看它惊恐发抖的样子，没有罪过却要走向死地。’","p":2,"r":0},{"t":"对曰：‘然则废衅钟与？’曰：‘何可废也？以羊易之！’不识有诸？”","tr":"那人问：‘那么是不是就废除衅钟的仪式呢？’大王说：‘怎么能废除呢？用羊来换它！’不知道有这件事吗？”","p":2,"r":0},{"t":"曰：“有之。”","tr":"宣王说：“有这事。”","p":2,"r":0},{"t":"曰：“是心足以王矣。百姓皆以王为爱也，臣固知王之不忍也。”","tr":"孟子说：“凭这样的心就足以称王天下了。百姓都以为大王吝啬，我本来就知道大王是不忍心。”","p":2,"r":0},{"t":"王曰：“然。诚有百姓者。齐国虽褊小，吾何爱一牛？","tr":"宣王说：“是的，确实有这样议论的百姓。齐国虽然狭小，我怎么会吝惜一头牛呢？","p":3,"r":0},{"t":"即不忍其觳觫，若无罪而就死地，故以羊易之也。”","tr":"正是不忍心它惊恐发抖、无罪而走向死地的样子，所以才用羊去换它。”","p":3,"r":0},{"t":"曰：“王无异于百姓之以王为爱也。以小易大，彼恶知之？","tr":"孟子说：“大王不要对百姓认为您吝啬感到奇怪。用小的换大的，他们哪里知道您的用意？","p":3,"r":0},{"t":"王若隐其无罪而就死地，则牛羊何择焉？”","tr":"大王如果是怜悯它无罪而被送去处死，那么牛和羊又有什么区别呢？”","p":3,"r":0},{"t":"王笑曰：“是诚何心哉？我非爱其财而易之以羊也，宜乎百姓之谓我爱也。”","tr":"宣王笑着说：“这到底是什么心理呢？我并不是吝惜钱财才用羊去换牛，百姓说我吝啬也难怪啊。”","p":4,"r":0},{"t":"曰：“无伤也，是乃仁术也，见牛未见羊也。","tr":"孟子说：“没有关系，这正是仁爱的做法，因为您看见了牛而没有看见羊。","p":4,"r":0},{"t":"君子之于禽兽也，见其生，不忍见其死；闻其声，不忍食其肉。","tr":"君子对于禽兽，看见它活着，就不忍心看它死去；听到它哀鸣，就不忍心吃它的肉。","p":4,"r":0},{"t":"是以君子远庖厨也。”","tr":"所以君子要远离厨房。”","p":4,"r":0},{"t":"王说，曰：“《诗》云：‘他人有心，予忖度之。’夫子之谓也。","tr":"宣王高兴了，说：“《诗经》说：‘别人有心思，我能揣测到。’说的就是先生您啊。","p":5,"r":0},{"t":"夫我乃行之，反而求之，不得吾心。","tr":"我自己做了这件事，回头去探求，却想不明白自己的心思。","p":5,"r":0},{"t":"夫子言之，于我心有戚戚焉。此心之所以合于王者，何也？”","tr":"先生一说，我心里就有所触动。这种心思为什么合乎王道呢？”","p":5,"r":0},{"t":"曰：“有复于王者曰：‘吾力足以举百钧，而不足以举一羽；","tr":"孟子说：“假如有人向大王报告说：‘我的力气足以举起三千斤，却举不起一根羽毛；","p":6,"r":0},{"t":"明足以察秋毫之末，而不见舆薪。’则王许之乎？”","tr":"我的眼力足以看清秋天鸟兽新生细毛的末梢，却看不见整车的柴草。’大王会认可他吗？”","p":6,"r":0},{"t":"曰：“否。”","tr":"宣王说：“不会。”","p":6,"r":0},{"t":"“今恩足以及禽兽，而功不至于百姓者，独何与？","tr":"“如今您的恩惠足以施及禽兽，而功德却不能达到百姓，这是为什么呢？","p":6,"r":0},{"t":"然则一羽之不举，为不用力焉；舆薪之不见，为不用明焉；","tr":"这样看来，一根羽毛举不起来，是因为没有用力；整车柴草看不见，是因为没有用眼力；","p":6,"r":0},{"t":"百姓之不见保，为不用恩焉。故王之不王，不为也，非不能也。”","tr":"百姓得不到安抚，是因为没有施恩。所以大王没有称王天下，是不肯做，而不是做不到。”","p":6,"r":0},{"t":"曰：“不为者与不能者之形何以异？”","tr":"宣王问：“不肯做和做不到的表现，有什么不同？”","p":7,"r":0},{"t":"曰：“挟太山以超北海，语人曰‘我不能’，是诚不能也。","tr":"孟子说：“夹着泰山跳过北海，告诉别人说‘我做不到’，这是真的做不到。","p":7,"r":0},{"t":"为长者折枝，语人曰‘我不能’，是不为也，非不能也。","tr":"替长辈按摩肢体，告诉别人说‘我做不到’，这是不肯做，而不是做不到。","p":7,"r":0},{"t":"故王之不王，非挟太山以超北海之类也；王之不王，是折枝之类也。","tr":"所以大王没有称王天下，不属于夹泰山跳北海一类；而是属于替长者按摩一类。","p":7,"r":0},{"t":"“老吾老，以及人之老；幼吾幼，以及人之幼；天下可运于掌。","tr":"“尊敬自己的长辈，推及去尊敬别人的长辈；爱护自己的孩子，推及去爱护别人的孩子；这样治理天下就像在手掌上转动东西一样容易。","p":8,"r":1},{"t":"《诗》云：‘刑于寡妻，至于兄弟，以御于家邦。’","tr":"《诗经》说：‘给妻子做榜样，再推广到兄弟，进而治理好家邦。’","p":8,"r":1},{"t":"言举斯心加诸彼而已。","tr":"这是说把这样的心推广到别人身上罢了。","p":8,"r":1},{"t":"故推恩足以保四海，不推恩无以保妻子。","tr":"所以推广恩德足以安定天下，不推广恩德连妻子儿女都保不住。","p":8,"r":1},{"t":"古之人所以大过人者无他焉，善推其所为而已矣。","tr":"古代的圣贤之所以大大超过一般人，没有别的原因，只是善于推广他们所做的事罢了。","p":8,"r":1},{"t":"今恩足以及禽兽，而功不至于百姓者，独何与？","tr":"如今您的恩惠足以施及禽兽，而功德却不能达到百姓，这是为什么呢？","p":8,"r":1},{"t":"“权，然后知轻重；度，然后知长短。","tr":"“用秤称一称，才知道轻重；用尺量一量，才知道长短。","p":9,"r":1},{"t":"物皆然，心为甚。王请度之！","tr":"万物都是这样，人心尤其如此。请大王衡量一下自己的心吧！","p":9,"r":1},{"t":"抑王兴甲兵，危士臣，构怨于诸侯，然后快于心与？”","tr":"难道大王兴兵打仗，使将士冒生命危险，与诸侯结下怨仇，然后心里才痛快吗？”","p":9,"r":0},{"t":"王曰：“否。吾何快于是？将以求吾所大欲也。”","tr":"宣王说：“不是。我怎么会以此为痛快？是想借此满足我最大的愿望。”","p":10,"r":0},{"t":"曰：“王之所大欲，可得闻与？”王笑而不言。","tr":"孟子问：“大王最大的愿望，可以说给我听听吗？”宣王笑而不答。","p":10,"r":0},{"t":"曰：“为肥甘不足于口与？轻暖不足于体与？","tr":"孟子说：“是因为肥美甘甜的食物不够口味吗？轻软暖和的衣服不够穿吗？","p":10,"r":0},{"t":"抑为采色不足视于目与？声音不足听于耳与？","tr":"还是因为绚丽的色彩不够看吗？动听的音乐不够听吗？","p":10,"r":0},{"t":"便嬖不足使令于前与？王之诸臣皆足以供之，而王岂为是哉？”","tr":"还是因为身边侍从不够使唤吗？这些大王的臣子都足以供给，难道大王是为了这些吗？”","p":10,"r":0},{"t":"曰：“否，吾不为是也。”","tr":"宣王说：“不，我不是为这些。”","p":10,"r":0},{"t":"曰：“然则王之所大欲可知已：欲辟土地，朝秦楚，莅中国而抚四夷也。","tr":"孟子说：“那么大王最大的愿望就可以知道了：是想开拓疆土，使秦、楚来朝，君临中原而安抚四方的少数民族。","p":11,"r":0},{"t":"以若所为求若所欲，犹缘木而求鱼也。”","tr":"用您这样的做法去追求这样的愿望，就好比爬到树上去捉鱼。”","p":11,"r":0},{"t":"王曰：“若是其甚与？”","tr":"宣王问：“有这么严重吗？”","p":11,"r":0},{"t":"曰：“殆有甚焉。缘木求鱼，虽不得鱼，无后灾。","tr":"孟子说：“恐怕还有更严重的。爬树捉鱼，虽然捉不到鱼，却没有后患。","p":11,"r":0},{"t":"以若所为求若所欲，尽心力而为之，后必有灾。”","tr":"用您这样的做法去追求这样的愿望，倾尽心力去做，以后一定有灾祸。”","p":11,"r":0},{"t":"曰：“可得闻与？”","tr":"宣王问：“可以说给我听听吗？”","p":12,"r":0},{"t":"曰：“邹人与楚人战，则王以为孰胜？”","tr":"孟子说：“邹国人和楚国人打仗，大王认为谁会赢？”","p":12,"r":0},{"t":"曰：“楚人胜。”","tr":"宣王说：“楚国人赢。”","p":12,"r":0},{"t":"曰：“然则小固不可以敌大，寡固不可以敌众，弱固不可以敌强。","tr":"孟子说：“这样看来，小国本来就不能抵挡大国，人少的本来不能抵挡人多的，弱的本来不能抵挡强的。","p":12,"r":0},{"t":"海内之地方千里者九，齐集有其一。","tr":"天下方圆千里的土地有九块，齐国合起来只占其中一块。","p":12,"r":0},{"t":"以一服八，何以异于邹敌楚哉？盖亦反其本矣。","tr":"以一块去征服八块，这和邹国对抗楚国有什么两样？为什么不回到根本上来呢？","p":12,"r":0},{"t":"“今王发政施仁，使天下仕者皆欲立于王之朝，","tr":"“如今大王如果发布政令、施行仁政，就会使天下做官的人都想到大王的朝廷里来任职，","p":13,"r":1},{"t":"耕者皆欲耕于王之野，商贾皆欲藏于王之市，","tr":"种田的人都想到大王的田野里来耕种，做买卖的人都想把货物存放在大王的市场上，","p":13,"r":1},{"t":"行旅皆欲出于王之涂，天下之欲疾其君者皆欲赴愬于王。","tr":"出门旅行的人都想取道大王的境内，天下那些痛恨自己国君的人都想来向大王申诉。","p":13,"r":1},{"t":"其若是，孰能御之？”","tr":"如果真能这样，谁还能抵挡呢？”","p":13,"r":1},{"t":"王曰：“吾惛，不能进于是矣。","tr":"宣王说：“我头脑昏聩，不能进一步领会这个道理了。","p":14,"r":0},{"t":"愿夫子辅吾志，明以教我。我虽不敏，请尝试之。”","tr":"希望先生辅助我实现心愿，明白地教导我。我虽然不聪敏，也请让我试一试。”","p":14,"r":0},{"t":"曰：“无恒产而有恒心者，惟士为能。","tr":"孟子说：“没有固定的产业却有稳定的道德观念，只有士人才能做到。","p":15,"r":1},{"t":"若民，则无恒产，因无恒心。","tr":"至于一般百姓，没有固定的产业，就因此没有稳定的道德观念。","p":15,"r":1},{"t":"苟无恒心，放辟邪侈，无不为已。","tr":"一旦没有稳定的道德观念，就会放纵邪僻、胡作非为，什么事都干得出来。","p":15,"r":1},{"t":"及陷于罪，然后从而刑之，是罔民也。","tr":"等到他们陷入犯罪，再去处罚他们，这是陷害百姓。","p":15,"r":1},{"t":"焉有仁人在位，罔民而可为也？","tr":"哪有仁爱的人当政，却做出陷害百姓的事呢？","p":15,"r":1},{"t":"是故明君制民之产，必使仰足以事父母，俯足以畜妻子，","tr":"所以英明的君主规定百姓的产业，一定要使他们上能侍奉父母，下能养活妻子儿女，","p":15,"r":1},{"t":"乐岁终身饱，凶年免于死亡；然后驱而之善，故民之从之也轻。","tr":"丰年一生吃饱，荒年也不致饿死；然后督促他们向善，百姓也就容易听从了。","p":15,"r":1},{"t":"“今也制民之产，仰不足以事父母，俯不足以畜妻子，","tr":"“如今规定百姓的产业，上不足以侍奉父母，下不足以养活妻子儿女，","p":16,"r":1},{"t":"乐岁终身苦，凶年不免于死亡。","tr":"丰年也一生劳苦，荒年更免不了死亡。","p":16,"r":1},{"t":"此惟救死而恐不赡，奚暇治礼义哉？","tr":"这样只顾救命还怕不够，哪有闲暇去讲求礼义呢？","p":16,"r":1},{"t":"“王欲行之，则盍反其本矣：","tr":"“大王想推行仁政，为什么不回到根本上来呢：","p":17,"r":1},{"t":"五亩之宅，树之以桑，五十者可以衣帛矣；","tr":"五亩大的宅院，种上桑树，五十岁的人就可以穿上丝织的衣服了；","p":17,"r":1},{"t":"鸡豚狗彘之畜，无失其时，七十者可以食肉矣；","tr":"鸡、猪、狗等牲畜，不错过它们的繁殖时节，七十岁的人就可以吃上肉了；","p":17,"r":1},{"t":"百亩之田，勿夺其时，数口之家可以无饥矣；","tr":"百亩的田地，不耽误它的耕种季节，数口之家就可以不挨饿了；","p":17,"r":1},{"t":"谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。","tr":"认真办好学校教育，反复讲明孝敬父母、尊敬兄长的道理，须发花白的人就不会背着、顶着东西在路上奔波了。","p":17,"r":1},{"t":"老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。”","tr":"老年人穿丝衣吃肉食，百姓不挨饿不受冻，这样还不能称王天下的，是从来没有过的事。”","p":17,"r":1}],"notes":[{"u":9,"w":"衅","m":"用牲畜的血涂器物行祭","t":"实词","d":["衅仇","裂缝"]},{"u":8,"w":"之","m":"到、往","t":"实词","d":["的","他"]},{"u":9,"w":"觳觫","m":"恐惧发抖的样子","t":"实词","d":["饥饿虚弱的样子","愤怒挣扎的样子"]},{"u":9,"w":"若","m":"那样、这样","t":"实词","d":["如果","你"]},{"u":10,"w":"易","m":"替换，交换","t":"实词","d":["容易","改变"]},{"u":10,"w":"诸","m":"“之乎”的合音","t":"虚词"},{"u":10,"w":"何可废也","m":"怎么可以废除（宾语前置式的疑问句，“何”表反问）","t":"特殊句式"},{"u":12,"w":"爱","m":"吝啬、舍不得","t":"古今异义","d":["喜爱","爱护"]},{"u":13,"w":"褊","m":"狭小","t":"实词","d":["贫穷","偏僻"]},{"u":15,"w":"恶","m":"哪里、怎么","t":"实词","d":["厌恶","凶恶"]},{"u":16,"w":"何择","m":"有什么区别（宾语前置）","t":"特殊句式"},{"u":18,"w":"术","m":"方法、途径","t":"古今异义","d":["技术","学术"]},{"u":20,"w":"远","m":"使……远离（意动用法）","t":"词类活用"},{"u":21,"w":"夫子之谓","m":"说的就是先生（宾语前置，“之”为提宾标志）","t":"特殊句式"},{"u":21,"w":"忖度","m":"揣测、推想","t":"实词","d":["称量","思念"]},{"u":23,"w":"戚戚","m":"心有所动的样子","t":"实词","d":["忧愁悲伤的样子","亲近的样子"]},{"u":24,"w":"钧","m":"古代重量单位，三十斤","t":"实词","d":["平均","均匀"]},{"u":25,"w":"明","m":"视力、眼力","t":"词类活用"},{"u":25,"w":"舆薪","m":"一车柴草","t":"实词","d":["车和柴","车上的人"]},{"u":32,"w":"折枝","m":"按摩、搔痒（一说折取树枝）","t":"实词","d":["折断树枝作拐杖","弯腰行礼"]},{"u":31,"w":"挟","m":"夹在腋下","t":"实词","d":["依仗","带领"]},{"u":34,"w":"老","m":"第一个“老”：尊敬，第二个：老人","t":"词类活用"},{"u":34,"w":"幼", ："},{"u":77,"hint":"孟子描绘仁政下老年人得以穿丝衣的情景，句子是："},{"u":50,"hint":"孟子用一个比喻批评宣王以武力求霸的做法，不可能达到目的，句子是："}],"appr":[{"q":"孟子为何从“以羊易牛”切入游说齐宣王？","a":"这是宣王亲身做过的事，说明他本有恻隐之心。孟子先肯定其仁心，增强信心，再指出“不为”而非“不能”，由此引出推恩保民，方法巧妙而有说服力。"},{"q":"“缘木求鱼”的比喻有什么作用？","a":"把宣王兴兵争霸求大欲比作爬树捉鱼，指出手段与目的背道而驰，甚至后患更大，既形象生动，又有力地说明以武力称霸行不通。"},{"q":"本文在论证上有哪些特点？","a":"层层推进：先引导宣王认识仁心，再用类比（举羽、见薪）说明不为与不能，又以邹楚之战作对比，最后提出制民之产、教化百姓的具体方案，逻辑严密。"}]},{"id":"h1b-w03","volume":"h1b","title":"庖丁解牛","author":"庄周及其后学","dynasty":"战国","genre":"寓言（《庄子·养生主》）","kind":"prose","intro":"选自《庄子·养生主》。通过厨师为文惠君宰牛的故事，说明顺应事物的自然规律就能游刃有余，进而引出养生之道。","theme":"以庖丁解牛的技艺说明顺应自然规律、避实就虚方能处世无碍，并由此阐发养生之理。","tags":["寓言","说理","道家","叙事"],"units":[{"t":"庖丁为文惠君解牛，手之所触，肩之所倚，足之所履，膝之所踦，","tr":"厨师替文惠君宰牛，手所接触的地方，肩所倚靠的地方，脚所踩踏的地方，膝所抵住的地方，","p":0,"r":0},{"t":"砉然向然，奏刀騞然，莫不中音。","tr":"发出皮骨相离的砉砉声，进刀时发出騞騞声，没有一种声音不合乎音律。","p":0,"r":0},{"t":"合于《桑林》之舞，乃中《经首》之会。","tr":"既合乎《桑林》舞曲的节拍，又合乎《经首》乐章的节奏。","p":0,"r":0},{"t":"文惠君曰：“嘻，善哉！技盖至此乎？”","tr":"文惠君说：“啊，好极了！技术怎么能达到这样的地步呢？”","p":1,"r":0},{"t":"庖丁释刀对曰：“臣之所好者道也，进乎技矣。","tr":"庖丁放下刀回答说：“我所喜好的是道，它已经超过技术了。","p":2,"r":1},{"t":"始臣之解牛之时，所见无非牛者。","tr":"我开始宰牛的时候，眼里所看到的无非是整头的牛。","p":2,"r":1},{"t":"三年之后，未尝见全牛也。","tr":"三年以后，就不再看到整头的牛了。","p":2,"r":1},{"t":"方今之时，臣以神遇而不以目视，官知止而神欲行。","tr":"到了现在，我只凭精神去接触牛，而不用眼睛去看，感官的作用停止了，精神却在运行。","p":2,"r":1},{"t":"依乎天理，批大郤，导大窾，因其固然。","tr":"依照牛身天然的结构，劈开筋骨间的大缝隙，顺着骨节间的空隙进刀，顺着它本来的构造去处理。","p":2,"r":1},{"t":"技经肯綮之未尝，而况大軱乎！","tr":"连经络相连、筋骨交结的地方都不曾碰过，何况大骨头呢！","p":2,"r":1},{"t":"良庖岁更刀，割也；族庖月更刀，折也。","tr":"好厨师一年换一把刀，因为他们是用刀割肉；普通厨师一个月换一把刀，因为他们是用刀砍骨头。","p":3,"r":1},{"t":"今臣之刀十九年矣，所解数千牛矣，","tr":"如今我的刀已经用了十九年，宰过的牛有几千头了，","p":3,"r":1},{"t":"而刀刃若新发于硎。","tr":"而刀刃还像刚在磨刀石上磨出来的一样。","p":3,"r":1},{"t":"彼节者有间，而刀刃者无厚；","tr":"那牛的骨节之间有空隙，而刀刃却薄得没有厚度；","p":3,"r":1},{"t":"以无厚入有间，恢恢乎其于游刃必有余地矣，","tr":"用没有厚度的刀刃插入有空隙的骨节，宽绰得很，刀刃运转起来一定有富余的空间，","p":3,"r":1},{"t":"是以十九年而刀刃若新发于硎。","tr":"所以用了十九年，刀刃仍像刚磨出来的一样。","p":3,"r":0},{"t":"虽然，每至于族，吾见其难为，怵然为戒，","tr":"虽然如此，每当遇到筋骨交错的地方，我看到它难以下刀，就格外小心，警惕起来，","p":4,"r":0},{"t":"视为止，行为迟，动刀甚微，謋然已解，如土委地。","tr":"眼神专注，动作放慢，用刀极其轻微，哗啦一声牛就解体了，像泥土散落在地上。","p":4,"r":0},{"t":"提刀而立，为之四顾，为之踌躇满志，善刀而藏之。”","tr":"我提着刀站起来，环顾四周，心满意足，然后把刀擦拭干净收藏起来。”","p":4,"r":0},{"t":"文惠君曰：“善哉！吾闻庖丁之言，得养生焉。”","tr":"文惠君说：“好啊！我听了庖丁的这番话，懂得了养生的道理。”","p":5,"r":0}],"notes":[{"u":0,"w":"庖丁","m":"名叫丁的厨师","t":"实词","d":["姓丁的医生","管理厨房的官员"]},{"u":0,"w":"解","m":"宰割、分解","t":"实词","d":["理解","解释"]},{"u":0,"w":"踦","m":"抵住，用膝盖顶住","t":"实词","d":["踢","绊倒"]},{"u":1,"w":"砉然","m":"皮骨相离的声音","t":"实词","d":["刀碰骨头的声音","水流声"]},{"u":1,"w":"奏","m":"进，进献","t":"实词","d":["演奏","奏章"]},{"u":1,"w":"中","m":"合乎","t":"实词","d":["中间","射中"]},{"u":3,"w":"盖","m":"通“盍”，何、怎么","t":"通假","d":["大概","覆盖"]},{"u":4,"w":"释","m":"放下","t":"实词","d":["解释","释放"]},{"u":4,"w":"进","m":"超过","t":"实词","d":["前进","进献"]},{"u":6,"w":"未尝","m":"不曾","t":"古今异义","d":["不可","没有品尝"]},{"u":7,"w":"神","m":"精神、心神","t":"实词","d":["神灵","神奇"]},{"u":7,"w":"官","m":"感官","t":"实词","d":["官员","官府"]},{"u":8,"w":"天理","m":"天然的结构、自然的纹理","t":"古今异义","d":["天道法则","上天的道理"]},{"u":8,"w":"批","m":"劈开、击","t":"实词","d":["批评","批准"]},{"u":8,"w":"郤","m":"通“隙”，空隙","t":"通假","d":["怨恨","姓氏"]},{"u":8,"w":"窾","m":"骨节间的空处","t":"实词","d":["款项","诚恳"]},{"u":8,"w":"因","m":"依照、顺着","t":"实词","d":["因为","原因"]},{"u":9,"w":"技经肯綮之未尝","m":"（连）经络相连、筋骨结合处都未曾碰过（宾语前置）","t":"特殊句式"},{"u":9,"w":"軱","m":"大骨","t":"实词","d":["大车","大腿肉"]},{"u":10,"w":"更","m":"更换","t":"实词","d":["更加","更改"]},{"u":10,"w":"族","m":"众、一般的","t":"实词","d":["家族","民族"]},{"u":11,"w":"数千牛","m":"几千头牛（数量词作补语）","t":"特殊句式"},{"u":12,"w":"硎","m":"磨刀石","t":"实词","d":["刀鞘","磨刀"]},{"u":13,"w":"间","m":"空隙","t":"实词","d":["中间","离间"]},{"u":14,"w":"恢恢","m":"宽阔的样子","t":"实词","d":["微小的样子","明亮的样子"]},{"u":16,"w":"怵然","m":"警惕的样子","t":"实词","d":["恐惧的样子","兴奋的样子"]},{"u":17,"w":"謋","m":"象声词，骨肉分离声","t":"实词","d":["惊叫","争吵"]},{"u":17,"w":"委","m":"堆积、散落","t":"实词","d":["委托","委屈"]},{"u":18,"w":"善","m":"通“缮”，擦拭","t":"通假","d":["好","擅长"]},{"u":18,"w":"踌躇","m":"从容自得的样子","t":"古今异义","d":["犹豫不决","徘徊"]},{"u":18,"w":"为之四顾","m":"为此（而）环顾","t":"特殊句式"}],"tricky":["砉","騞","踦","郤","窾","軱","硎","怵","謋","踌躇"],"keyLines":[{"u":4,"hint":"庖丁对文惠君说，自己所追求的是自然之道，已经高于一般技术，原话是："},{"u":6,"hint":"庖丁说明自己解牛技艺精进、渐入佳境的两句话是："},{"u":7,"hint":"庖丁描述自己解牛时“依靠精神而非眼睛”的句子是："},{"u":8,"hint":"庖丁说他解牛时顺着牛的自然结构操作的四个短句是："},{"u":13,"hint":"庖丁解释自己的刀为何多年不钝，其原理的句子是："},{"u":14,"hint":"说明庖丁游刃有余的原因，把“无厚”与“有间”对比的句子是："}],"appr":[{"q":"庖丁解牛经历了哪三个阶段？说明了什么道理？","a":"由“所见无非牛”，到“未尝见全牛”，再到“以神遇而不以目视”，体现了技艺从生疏到纯熟、由外在到内在的提升，说明只有掌握并顺应事物的规律，才能做到得心应手。"},{"q":"“彼节者有间，而刀刃者无厚”这一比喻的深意是什么？","a":"以无厚之刃入有间之骨，比喻处世要避开矛盾冲突，顺应自然，因而能游刃有余。这正是庄子“养生”主张的形象表达。"},{"q":"文末文惠君“得养生焉”说明了什么？","a":"寓言的重点不在解牛技术，而在借此说明处世养生之道：顺应自然，避实就虚，保全自身，因而作者通过君王之口点明了全篇主旨。"}]},{"id":"h1b-w04","volume":"h1b","title":"烛之武退秦师","author":"左丘明","dynasty":"春秋","genre":"史传（《左传·僖公三十年》）","kind":"prose","intro":"选自《左传·僖公三十年》。晋、秦联军围攻郑国，郑国危急，老臣烛之武深夜出城游说秦穆公，凭一番利害分析使秦军退兵，解除了国难。","theme":"记叙烛之武以利害为说辞离间秦晋、退去秦师的经过，表现其临危受命的胆识和卓越的外交辩才。","tags":["叙事","外交","史传","说理"],"units":[{"t":"晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。","tr":"晋文公、秦穆公联合围攻郑国，因为郑国曾对晋国无礼，而且依附晋国的敌手楚国而对晋国有二心。","p":0,"r":1},{"t":"晋军函陵，秦军氾南。","tr":"晋军驻扎在函陵，秦军驻扎在氾水南面。","p":0,"r":1},{"t":"佚之狐言于郑伯曰：“国危矣，若使烛之武见秦君，师必退。”","tr":"佚之狐对郑文公说：“国家危险了，如果派烛之武去见秦国国君，秦军一定会撤退。”","p":1,"r":1},{"t":"公从之。","tr":"郑文公听从了他。","p":1,"r":1},{"t":"辞曰：“臣之壮也，犹不如人；今老矣，无能为也已。”","tr":"烛之武推辞说：“我壮年的时候，尚且不如别人；如今老了，更不能做什么了。”","p":1,"r":1},{"t":"公曰：“吾不能早用子，今急而求子，是寡人之过也。","tr":"郑文公说：“我没有及早重用您，现在危急了才来求您，这是我的过错。","p":1,"r":1},{"t":"然郑亡，子亦有不利焉！”","tr":"可是郑国灭亡了，对您也有不利啊！”","p":1,"r":1},{"t":"许之。","tr":"烛之武答应了。","p":1,"r":1},{"t":"夜缒而出。","tr":"夜里用绳子把他从城墙上吊下去。","p":2,"r":1},{"t":"见秦伯，曰：“秦、晋围郑，郑既知亡矣。","tr":"他见到秦穆公，说：“秦国、晋国围攻郑国，郑国已经知道要灭亡了。","p":2,"r":1},{"t":"若亡郑而有益于君，敢以烦执事。","tr":"如果灭掉郑国对您有好处，那就冒昧地拿这件事来麻烦您身边的人了。","p":2,"r":1},{"t":"越国以鄙远，君知其难也，焉用亡郑以陪邻？","tr":"越过别国而把远方的郑国当作边邑，您知道这是困难的，哪里用得着灭掉郑国来增加邻国的土地呢？","p":2,"r":1},{"t":"邻之厚，君之薄也。","tr":"邻国的势力雄厚了，您的力量就相对薄弱了。","p":2,"r":1},{"t":"若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。","tr":"如果放弃灭郑，把它当作东方道路上的主人，您的使臣往来经过时，供给他们缺少的东西，对您也没有什么害处。","p":2,"r":1},{"t":"且君尝为晋君赐矣，许君焦、瑕，朝济而夕设版焉，君之所知也。","tr":"况且您曾经对晋国国君施过恩惠，他答应给您焦、瑕两地，可是早晨渡河回国，晚上就在那里筑城防备您，这是您所知道的。","p":2,"r":1},{"t":"夫晋，何厌之有？","tr":"晋国哪有满足的时候呢？","p":2,"r":1},{"t":"既东封郑，又欲肆其西封，若不阙秦，将焉取之？","tr":"它既已在东边把郑国当作疆界，又想向西扩展边界，如果不损害秦国，它还能从哪里取得土地呢？","p":2,"r":1},{"t":"阙秦以利晋，唯君图之。”","tr":"损害秦国来使晋国得利，希望您仔细考虑。”","p":2,"r":1},{"t":"秦伯说，与郑人盟。","tr":"秦穆公很高兴，和郑国人订立了盟约。","p":3,"r":1},{"t":"使杞子、逢孙、杨孙戍之，乃还。","tr":"派杞子、逢孙、杨孙驻守郑国，自己就率军回国了。","p":3,"r":1},{"t":"子犯请击之。","tr":"子犯请求出兵攻击秦军。","p":4,"r":1},{"t":"公曰：“不可。微夫人之力不及此。","tr":"晋文公说：“不行。没有那个人的力量，我不会有今天。","p":4,"r":1},{"t":"因人之力而敝之，不仁；失其所与，不知；以乱易整，不武。","tr":"依靠别人的力量又去损害他，是不仁义；失去同盟者，是不明智；用纷乱代替整齐，是不勇武。","p":4,"r":1},{"t":"吾其还也。”亦去之。","tr":"我们还是回去吧。”于是晋军也离开了郑国。","p":4,"r":1}],"notes":[{"u":0,"w":"伯","m":"春秋时诸侯爵位名","t":"实词","d":["伯父","兄长"]},{"u":0,"w":"以","m":"因为","t":"虚词"},{"u":0,"w":"贰","m":"从属二主，有二心","t":"实词","d":["数目二","副手"]},{"u":1,"w":"军","m":"驻扎","t":"词类活用"},{"u":2,"w":"国","m":"国都、国家","t":"一词多义"},{"u":2,"w":"见","m":"使……见（去见）","t":"实词","d":["看见","被"]},{"u":4,"w":"壮","m":"壮年","t":"实词","d":["强壮","雄壮"]},{"u":4,"w":"无能为","m":"做不成什么事","t":"特殊句式"},{"u":5,"w":"子","m":"对人的尊称，您","t":"实词","d":["孩子","男子"]},{"u":8,"w":"缒","m":"用绳子拴住人（或物）从上往下送","t":"词类活用"},{"u":9,"w":"亡","m":"灭亡","t":"实词","d":["逃亡","死亡"]},{"u":10,"w":"烦","m":"麻烦","t":"词类活用"},{"u":10,"w":"执事","m":"办事人员，指秦国国君身边的人","t":"古今异义","d":["执行任务","职业"]},{"u":11,"w":"鄙","m":"把……当作边邑","t":"词类活用"},{"u":11,"w":"陪","m":"增加","t":"实词","d":["陪同","赔偿"]},{"u":11,"w":"焉","m":"哪里","t":"虚词"},{"u":12,"w":"厚","m":"雄厚，指势力增强","t":"实词","d":["厚重","丰厚"]},{"u":12,"w":"薄","m":"薄弱","t":"实词","d":["微薄","轻视"]},{"u":13,"w":"舍","m":"放弃","t":"实词","d":["房舍","舍得"]},{"u":13,"w":"东道主","m":"东方道路上的主人，后泛指接待客人的人","t":"古今异义","d":["东方的主人","东边的道路"]},{"u":13,"w":"行李","m":"外交使者","t":"古今异义","d":["出行的包袱","行装"]},{"u":13,"w":"共","m":"同“供”，供给","t":"通假","d":["共同","一共"]},{"u":13,"w":"乏困","m":"缺少的东西","t":"实词","d":["疲乏困倦","贫穷困苦"]},{"u":14,"w":"赐","m":"恩惠","t":"实词","d":["赏赐财物","赐予官职"]},{"u":14,"w":"济","m":"渡河","t":"实词","d":["救济","成功"]},{"u":14,"w":"朝","m":"早晨","t":"古今异义","d":["朝廷","朝见"]},{"u":14,"w":"版","m":"筑土墙用的夹板，指筑城","t":"实词","d":["书页","木牌"]},{"u":15,"w":"何厌之有","m":"有什么满足（宾语前置）","t":"特殊句式"},{"u":16,"w":"东封","m":"向东把……当作边界","t":"词类活用"},{"u":16,"w":"肆","m":"延伸、扩张","t":"实词","d":["放肆","店铺"]},{"u":16,"w":"阙","m":"使……减损，损害","t":"词类活用"},{"u":16,"w":"焉","m":"从哪里","t":"虚词"},{"u":17,"w":"图","m":"考虑，谋划","t":"实词","d":["图画","企图"]},{"u":18,"w":"说","m":"同“悦”，高兴","t":"通假","d":["说话","劝说"]},{"u":18,"w":"盟","m":"订立盟约","t":"词类活用"},{"u":19,"w":"戍","m":"驻守","t":"实词","d":["戍边的人","守卫国都"]},{"u":21,"w":"微","m":"没有、不是","t":"实词","d":["微小","细微"]},{"u":21,"w":"夫人","m":"那个人，指秦穆公","t":"古今异义","d":["别人的妻子","诸侯的妻子"]},{"u":22,"w":"敝","m":"损害","t":"实词","d":["破旧","疲惫"]},{"u":22,"w":"知","m":"同“智”，明智","t":"通假","d":["知道","了解"]},{"u":22,"w":"与","m":"同盟者，盟国","t":"实词","d":["给予","参与"]},{"u":22,"w":"武","m":"勇武","t":"实词","d":["武器","武力"]},{"u":22,"w":"易","m":"代替","t":"实词","d":["容易","交换"]}],"tricky":["氾","缒","阙","杞","逢","敝"],"keyLines":[{"u":11,"hint":"烛之武向秦伯陈述，越过别国以远方之地为边邑很困难的两句是："},{"u":12,"hint":"烛之武指出灭郑只会使邻国晋国壮大、秦国相对削弱的句子是："},{"u":13,"hint":"烛之武提出，放过郑国，让郑国供给秦国使者所需的建议是："},{"u":15,"hint":"烛之武以反问揭示晋国贪得无厌的句子是："},{"u":16,"hint":"烛之武指出晋国向西扩张必然损害秦国的两句是："},{"u":21,"hint":"晋文公说，没有秦穆公的帮助就没有今天，所以不应攻击秦军，其句子是："},{"u":22,"hint":"晋文公从仁、智、武三方面说明不可攻秦的句子是："}],"appr":[{"q":"烛之武游说秦伯的说辞有什么特点？","a":"他先站在秦国立场说灭郑对秦无益、存郑有利，再以晋背信为例说明晋国贪婪，最后点出晋强必损秦，层层分析利害，句句为秦着想，因而打动秦穆公。"},{"q":"文中如何刻画烛之武的形象？","a":"他先以年老推辞，表现出不满与自重；国难当头又夜缒而出，体现胆识与忠诚；说辞里能审时度势、利害分明，展现出卓越的外交才能。"},{"q":"“因人之力而敝之，不仁；失其所与，不知；以乱易整，不武”表现了晋文公怎样的特点？","a":"他从仁、智、武三方面权衡后放弃攻秦，表明他理智克制、懂得顾全大局，也反映晋国当时不愿与秦为敌的政治考量。"}]},{"id":"h1b-w05","volume":"h1b","title":"鸿门宴","author":"司马迁","dynasty":"西汉","genre":"史传（纪传体）","kind":"prose","intro":"选自《史记·项羽本纪》。秦亡之际，刘邦先入关中，项羽率大军压境，双方在鸿门会面，司马迁以精彩的场面描写再现了这场惊心动魄的政治较量。","theme":"通过鸿门宴上的明争暗斗，展现刘邦的善于权变、项羽的骄傲轻敌，并预示楚汉成败的走向。","tags":["史传","叙事","人物形象"],"units":[{"t":"沛公军霸上，未得与项羽相见。","tr":"刘邦的军队驻扎在霸上，还没能和项羽见面。","p":0,"r":0},{"t":"沛公左司马曹无伤使人言于项羽曰：","tr":"刘邦的左司马曹无伤派人对项羽说：","p":0,"r":0},{"t":"“沛公欲王关中，使子婴为相，珍宝尽有之。”","tr":"“刘邦想在关中称王，让子婴当丞相，秦宫的珍宝全被他占有了。”","p":0,"r":0},{"t":"项羽大怒，曰：“旦日飨士卒，为击破沛公军！”","tr":"项羽勃然大怒，说：“明天犒劳士兵，替我把刘邦的军队击垮！”","p":0,"r":0},{"t":"当是时，项羽兵四十万，在新丰鸿门；沛公兵十万，在霸上。","tr":"当时，项羽有兵四十万，驻在新丰鸿门；刘邦有兵十万，驻在霸上。","p":0,"r":0},{"t":"范增说项羽曰：“沛公居山东时，贪于财货，好美姬。","tr":"范增劝项羽说：“刘邦住在崤山以东时，贪图钱财，喜爱美女。","p":0,"r":0},{"t":"今入关，财物无所取，妇女无所幸，此其志不在小。","tr":"如今进了关，财物一点不拿，妇女一个不亲近，这说明他的志向不小。","p":0,"r":0},{"t":"吾令人望其气，皆为龙虎，成五采，此天子气也。","tr":"我让人观望他那里的云气，都呈龙虎的形状，五彩斑斓，这是天子之气啊。","p":0,"r":0},{"t":"急击勿失！”","tr":"赶快攻打，不要错过时机！”","p":0,"r":0},{"t":"楚左尹项伯者，项羽季父也，素善留侯张良。","tr":"楚国的左尹项伯，是项羽的叔父，一向与留侯张良交好。","p":1,"r":0},{"t":"项伯乃夜驰之沛公军，私见张良，具告以事，","tr":"项伯就连夜骑马赶到刘邦军营，私下会见张良，把事情全部告诉他，","p":1,"r":0},{"t":"欲呼张良与俱去，曰：“毋从俱死也。”","tr":"想叫张良跟自己一起离开，说：“不要跟着刘邦一起送死。”","p":1,"r":0},{"t":"张良曰：“臣为韩王送沛公，沛公今事有急，亡去不义，不可不语。”","tr":"张良说：“我受韩王之托护送刘邦，如今刘邦有危难，逃走是不义的，不能不告诉他。”","p":1,"r":0},{"t":"良乃入，具告沛公。","tr":"张良于是进去，把情况全部告诉了刘邦。","p":1,"r":0},{"t":"沛公大惊，曰：“为之奈何？”","tr":"刘邦大吃一惊，说：“这可怎么办？”","p":1,"r":0},{"t":"张良曰：“谁为大王为此计者？”","tr":"张良问：“是谁给大王出的这个主意？”","p":1,"r":0},{"t":"曰：“鲰生说我曰：‘距关，毋内诸侯，秦地可尽王也。’故听之。”","tr":"刘邦说：“有个浅陋的小人劝我说：‘守住函谷关，别放诸侯进来，秦地就能全部称王了。’所以我听了他的。”","p":1,"r":0},{"t":"良曰：“料大王士卒足以当项王乎？”","tr":"张良说：“您估计自己的兵力足以抵挡项王吗？”","p":1,"r":0},{"t":"沛公默然，曰：“固不如也，且为之奈何？”","tr":"刘邦沉默了一会儿，说：“本来就比不上，那该怎么办呢？”","p":1,"r":0},{"t":"张良曰：“请往谓项伯，言沛公不敢背项王也。”","tr":"张良说：“请让我去告诉项伯，说刘邦不敢背叛项王。”","p":1,"r":0},{"t":"沛公曰：“君安与项伯有故？”","tr":"刘邦问：“你怎么和项伯有交情？”","p":1,"r":0},{"t":"张良曰：“秦时与臣游，项伯杀人，臣活之；","tr":"张良说：“秦朝时他与我交往，项伯杀了人，我救了他；","p":1,"r":0},{"t":"今事有急，故幸来告良。”","tr":"如今事情危急，所以他幸而来告诉我。”","p":1,"r":0},{"t":"沛公曰：“孰与君少长？”良曰：“长于臣。”","tr":"刘邦问：“他和你比谁年长？”张良说：“比我大。”","p":1,"r":0},{"t":"沛公曰：“君为我呼入，吾得兄事之。”","tr":"刘邦说：“你替我请他进来，我要像对待兄长那样对待他。”","p":1,"r":0},{"t":"张良出，要项伯。项伯即入见沛公。","tr":"张良出去，邀请项伯。项伯随即进来会见刘邦。","p":1,"r":0},{"t":"沛公奉卮酒为寿，约为婚姻，曰：","tr":"刘邦捧着酒杯向项伯敬酒祝寿，并约定结为儿女亲家，说：","p":1,"r":0},{"t":"“吾入关，秋毫不敢有所近，籍吏民，封府库，而待将军。","tr":"“我进入关中，丝毫财物都不敢占有，登记官吏百姓的名册，封存府库，等待将军到来。","p":1,"r":0},{"t":"所以遣将守关者，备他盗之出入与非常也。","tr":"之所以派兵把守函谷关，是为了防备其他盗贼进出和意外变故。","p":1,"r":0},{"t":"日夜望将军至，岂敢反乎！","tr":"我日夜盼望将军到来，怎么敢反叛呢！","p":1,"r":0},{"t":"愿伯具言臣之不敢倍德也。”","tr":"希望您详细转告项王，我是不敢忘恩负义的。”","p":1,"r":0},{"t":"项伯许诺。谓沛公曰：“旦日不可不蚤自来谢项王。”","tr":"项伯答应了，对刘邦说：“明天你不能不早点亲自来向项王道歉。”","p":1,"r":0},{"t":"沛公曰：“诺。”","tr":"刘邦说：“好。”","p":1,"r":0},{"t":"于是项伯复夜去，至军中，具以沛公言报项王，","tr":"于是项伯又连夜离开，回到军中，把刘邦的话详细报告项王，","p":1,"r":0},{"t":"因言曰：“沛公不先破关中，公岂敢入乎？","tr":"趁机说：“刘邦如果不先攻破关中，您怎么敢进来呢？","p":1,"r":0},{"t":"今人有大功而击之，不义也，不如因善遇之。”","tr":"现在人家有大功反而攻打他，是不义的，不如趁此好好款待他。”","p":1,"r":0},{"t":"项王许诺。","tr":"项王答应了。","p":1,"r":0},{"t":"沛公旦日从百余骑来见项王。","tr":"第二天一早，刘邦带着一百多名随从来见项王。","p":2,"r":0},{"t":"至鸿门，谢曰：“臣与将军戮力而攻秦，","tr":"到了鸿门，向项王道歉说：“我和将军合力攻打秦国，","p":2,"r":0},{"t":"将军战河北，臣战河南，","tr":"将军在黄河以北作战，我在黄河以南作战，","p":2,"r":0},{"t":"然不自意能先入关破秦，得复见将军于此。","tr":"但没想到自己能先入关攻破秦国，能在这里再见到将军。","p":2,"r":0},{"t":"今者有小人之言，令将军与臣有郤。”","tr":"如今有小人挑拨的话，使将军和我产生了隔阂。”","p":2,"r":0},{"t":"项王曰：“此沛公左司马曹无伤言之；不然，籍何以至此？”","tr":"项王说：“这是刘邦的左司马曹无伤说的；不然，我怎么会这样呢？”","p":2,"r":0},{"t":"项王即日因留沛公与饮。","tr":"项王当天就留刘邦一起饮酒。","p":2,"r":0},{"t":"项王、项伯东向坐；亚父南向坐，亚父者，范增也；","tr":"项王、项伯面朝东坐；亚父面朝南坐，亚父就是范增；","p":2,"r":0},{"t":"沛公北向坐；张良西向侍。","tr":"刘邦面朝北坐；张良面朝西陪侍。","p":2,"r":0},{"t":"范增数目项王，举所佩玉玦以示之者三，","tr":"范增多次向项王使眼色，再三举起身上佩带的玉玦示意他下令，","p":2,"r":0},{"t":"项王默然不应。","tr":"项王沉默不回应。","p":2,"r":0},{"t":"范增起，出召项庄，谓曰：“君王为人不忍，","tr":"范增起身出去，召来项庄，对他说：“君王为人心软，","p":2,"r":0},{"t":"若入前为寿，寿毕，请以剑舞，因击沛公于坐，杀之。","tr":"你进去上前敬酒，敬完酒，请求舞剑，趁机把刘邦击杀在座位上。","p":2,"r":0},{"t":"不者，若属皆且为所虏！”","tr":"否则，你们这些人都将被他俘虏！”","p":2,"r":0},{"t":"庄则入为寿。寿毕，曰：“君王与沛公饮，","tr":"项庄就进去敬酒。敬完酒，说：“君王和沛公饮酒，","p":2,"r":0},{"t":"军中无以为乐，请以剑舞。”项王曰：“诺。”","tr":"军中没有什么可作娱乐的，请让我舞剑。”项王说：“好。”","p":2,"r":0},{"t":"项庄拔剑起舞，项伯亦拔剑起舞，","tr":"项庄拔剑起舞，项伯也拔剑起舞，","p":2,"r":0},{"t":"常以身翼蔽沛公，庄不得击。","tr":"常用身体像鸟张翼一样掩护刘邦，项庄无法刺击。","p":2,"r":0},{"t":"于是张良至军门，见樊哙。","tr":"这时张良来到军营门口，见到樊哙。","p":3,"r":0},{"t":"樊哙曰：“今日之事何如？”","tr":"樊哙问：“今天的事情怎么样？”","p":3,"r":0},{"t":"良曰：“甚急。今者项庄拔剑舞，其意常在沛公也。”","tr":"张良说：“非常危急。现在项庄拔剑起舞，他的用意始终在刘邦身上。”","p":3,"r":0},{"t":"哙曰：“此迫矣，臣请入，与之同命。”","tr":"樊哙说：“这太紧迫了，请让我进去，与他同生死。”","p":3,"r":0},{"t":"哙即带剑拥盾入军门。","tr":"樊哙立刻佩着剑、持着盾牌冲入军门。","p":3,"r":1},{"t":"交戟之卫士欲止不内，樊哙侧其盾以撞，","tr":"持戟交叉守门的卫士想阻拦不让进，樊哙侧过盾牌一撞，","p":3,"r":1},{"t":"卫士仆地，哙遂入，披帷西向立，","tr":"卫士倒在地上，樊哙于是闯入，掀开帷帐面朝西站立，","p":3,"r":1},{"t":"瞋目视项王，头发上指，目眦尽裂。","tr":"瞪着眼睛看项王，头发直竖，眼角都要裂开。","p":3,"r":1},{"t":"项王按剑而跽曰：“客何为者？”","tr":"项王手按佩剑直起身问：“来客是干什么的？”","p":3,"r":1},{"t":"张良曰：“沛公之参乘樊哙者也。”","tr":"张良说：“是刘邦的陪乘樊哙。”","p":3,"r":1},{"t":"项王曰：“壮士！赐之卮酒。”则与斗卮酒。","tr":"项王说：“壮士！赏他一杯酒。”于是给了他一大杯酒。","p":3,"r":1},{"t":"哙拜谢，起，立而饮之。","tr":"樊哙拜谢，起身，站着把酒喝了。","p":3,"r":1},{"t":"项王曰：“赐之彘肩。”则与一生彘肩。","tr":"项王说：“赏他一只猪腿。”于是给了他一只生猪腿。","p":3,"r":1},{"t":"樊哙覆其盾于地，加彘肩上，拔剑切而啖之。","tr":"樊哙把盾牌扣在地上，把猪腿放在上面，拔剑切着吃。","p":3,"r":1},{"t":"项王曰：“壮士！能复饮乎？”","tr":"项王说：“壮士！还能再喝吗？”","p":3,"r":1},{"t":"樊哙曰：“臣死且不避，卮酒安足辞！","tr":"樊哙说：“我连死都不回避，一杯酒哪里值得推辞！","p":3,"r":1},{"t":"夫秦王有虎狼之心，杀人如不能举，刑人如恐不胜，","tr":"秦王有虎狼一样的心肠，杀人唯恐杀不完，用刑唯恐不够狠，","p":3,"r":1},{"t":"天下皆叛之。怀王与诸将约曰：","tr":"天下人都背叛了他。怀王曾与各位将领约定说：","p":3,"r":1},{"t":"‘先破秦入咸阳者王之。’","tr":"‘先攻破秦国进入咸阳的人，就封他为王。’","p":3,"r":1},{"t":"今沛公先破秦入咸阳，毫毛不敢有所近，","tr":"如今刘邦先攻破秦国进入咸阳，一丝一毫都不敢占有，","p":3,"r":1},{"t":"封闭宫室，还军霸上，以待大王来。","tr":"封闭宫室，退回军队驻在霸上，等待大王到来。","p":3,"r":1},{"t":"故遣将守关者，备他盗出入与非常也。","tr":"特意派兵把守函谷关，是为了防备其他盗贼出入和意外变故。","p":3,"r":1},{"t":"劳苦而功高如此，未有封侯之赏，","tr":"如此劳苦功高，没有得到封侯的赏赐，","p":3,"r":1},{"t":"而听细说，欲诛有功之人。","tr":"反而听信小人谗言，想要杀有功的人。","p":3,"r":1},{"t":"此亡秦之续耳，窃为大王不取也！”","tr":"这是已灭亡的秦朝的继续罢了，我私下认为大王不该这样做！”","p":3,"r":1},{"t":"项王未有以应，曰：“坐。”樊哙从良坐。","tr":"项王没有话可回答，说：“坐。”樊哙就挨着张良坐下。","p":3,"r":0},{"t":"坐须臾，沛公起如厕，因招樊哙出。","tr":"坐了一会儿，刘邦起身去厕所，顺便招呼樊哙出来。","p":4,"r":0},{"t":"沛公已出，项王使都尉陈平召沛公。","tr":"刘邦出去后，项王派都尉陈平去召他回来。","p":4,"r":0},{"t":"沛公曰：“今者出，未辞也，为之奈何？”","tr":"刘邦说：“刚才出来，没有告辞，该怎么办？”","p":4,"r":0},{"t":"樊哙曰：“大行不顾细谨，大礼不辞小让。","tr":"樊哙说：“做大事不必顾及细枝末节，讲大礼不必躲避小的责备。","p":4,"r":1},{"t":"如今人方为刀俎，我为鱼肉，何辞为？”","tr":"如今人家正是菜刀和砧板，我们是鱼和肉，还告辞干什么？”","p":4,"r":1},{"t":"于是遂去。乃令张良留谢。","tr":"于是就离开了，并让张良留下道歉。","p":4,"r":0},{"t":"良问曰：“大王来何操？”","tr":"张良问：“大王来时带了什么礼物？”","p":4,"r":0},{"t":"曰：“我持白璧一双，欲献项王，","tr":"刘邦说：“我带了一对白璧，想献给项王，","p":4,"r":0},{"t":"玉斗一双，欲与亚父，会其怒，不敢献。","tr":"一对玉斗，想送给亚父，正赶上他们发怒，不敢献。","p":4,"r":0},{"t":"公为我献之。”张良曰：“谨诺。”","tr":"你替我献上吧。”张良说：“遵命。”","p":4,"r":0},{"t":"当是时，项王军在鸿门下，沛公军在霸上，相去四十里。","tr":"当时，项王军队在鸿门下，刘邦军队在霸上，相距四十里。","p":4,"r":0},{"t":"沛公则置车骑，脱身独骑，","tr":"刘邦就丢下车辆随从，脱身独自骑马，","p":4,"r":0},{"t":"与樊哙、夏侯婴、靳强、纪信等四人持剑盾步走，","tr":"与樊哙、夏侯婴、靳强、纪信等四人手持剑和盾牌步行，","p":4,"r":0},{"t":"从郦山下，道芷阳间行。","tr":"从郦山脚下，取道芷阳抄小路走。","p":4,"r":0},{"t":"沛公谓张良曰：“从此道至吾军，不过二十里耳。","tr":"刘邦对张良说：“从这条路到我军营，不过二十里罢了。","p":4,"r":0},{"t":"度我至军中，公乃入。”","tr":"估计我回到军中，你再进去。”","p":4,"r":0},{"t":"沛公已去，间至军中，张良入谢，曰：","tr":"刘邦已经离开，抄小路回到军中，张良进去道歉，说：","p":4,"r":0},{"t":"“沛公不胜桮杓，不能辞。","tr":"“刘邦禁不住酒力，不能亲自告辞。","p":4,"r":0},{"t":"谨使臣良奉白璧一双，再拜献大王足下；","tr":"特派我张良恭敬地献上白璧一对，拜两拜献给大王；","p":4,"r":0},{"t":"玉斗一双，再拜奉大将军足下。”","tr":"玉斗一对，拜两拜献给大将军。”","p":4,"r":0},{"t":"项王曰：“沛公安在？”","tr":"项王问：“刘邦在哪里？”","p":4,"r":0},{"t":"良曰：“闻大王有意督过之，脱身独去，已至军矣。”","tr":"张良说：“听说大王有意责备他，他就脱身独自离开，已经回到军中了。”","p":4,"r":0},{"t":"项王则受璧，置之坐上。","tr":"项王于是接受了白璧，放在座位上。","p":4,"r":0},{"t":"亚父受玉斗，置之地，拔剑撞而破之，曰：","tr":"范增接过玉斗，放在地上，拔剑敲碎它，说：","p":4,"r":0},{"t":"“唉！竖子不足与谋。","tr":"“唉！这小子不值得和他共谋大事。","p":4,"r":0},{"t":"夺项王天下者，必沛公也。吾属今为之虏矣！”","tr":"夺取项王天下的，一定是刘邦。我们这些人将要成为他的俘虏了！”","p":4,"r":0},{"t":"沛公至军，立诛杀曹无伤。","tr":"刘邦回到军中，立即杀了曹无伤。","p":4,"r":0}],"notes":[{"u":3,"w":"旦日","m":"明天","t":"古今异义","d":["白天","从早到晚"]},{"u":3,"w":"飨","m":"用酒食犒劳","t":"实词","d":["享受","宴请宾客"]},{"u":2,"w":"王","m":"称王，做王","t":"词类活用"},{"u":0,"w":"军","m":"驻军","t":"词类活用"},{"u":2,"w":"相","m":"丞相","t":"实词","d":["相互","察看"]},{"u":5,"w":"说","m":"劝说","t":"通假","d":["解说","高兴"]},{"u":9,"w":"善","m":"交好，友好","t":"词类活用"},{"u":9,"w":"素","m":"向来，平素","t":"实词","d":["白色","朴素"]},{"u":10,"w":"之","m":"到，往","t":"实词","d":["的","他"]},{"u":11,"w":"从","m":"跟随","t":"实词","d":["从事","依从"]},{"u":12,"w":"亡","m":"逃跑","t":"实词","d":["灭亡","死亡"]},{"u":16,"w":"鲰生","m":"浅陋的小人","t":"实词","d":["年轻后生","卑微的书生"]},{"u":16,"w":"内","m":"同“纳”，接纳","t":"通假","d":["里面","内部"]},{"u":21,"w":"游","m":"交往","t":"实词","d":["游玩","游历"]},{"u":24,"w":"兄事之","m":"像对待兄长一样侍奉他","t":"词类活用"},{"u":25,"w":"要","m":"同“邀”，邀请","t":"通假","d":["重要","要求"]},{"u":26,"w":"寿","m":"敬酒祝寿","t":"词类活用"},{"u":26,"w":"婚姻","m":"儿女亲家","t":"古今异义","d":["结婚的事","夫妻关系"]},{"u"
