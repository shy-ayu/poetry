<style>

window.PIECES = [{"id":"g7a-p01","volume":"g7a","title":"观沧海","author":"曹操","dynasty":"东汉","genre":"乐府诗（四言）","kind":"poem","intro":"建安十二年，曹操北征乌桓得胜，归途登上碣石山，面对大海写下此诗，是现存最早的完整山水诗之一。","theme":"借大海的壮阔景象，抒发统一天下的雄心壮志与博大胸襟。","tags":["写景","抒怀","言志"],"units":[{"t":"东临碣石，以观沧海。","tr":"向东登上碣石山，来观赏苍茫的大海。","p":0,"r":1},{"t":"水何澹澹，山岛竦峙。","tr":"海水多么浩荡起伏，山岛高高耸立。","p":0,"r":1},{"t":"树木丛生，百草丰茂。","tr":"岛上树木丛生，百草繁茂。","p":0,"r":1},{"t":"秋风萧瑟，洪波涌起。","tr":"秋风阵阵萧瑟，海中涌起巨大的波浪。","p":0,"r":1},{"t":"日月之行，若出其中；","tr":"太阳和月亮的运行，好像都出自这大海之中；","p":0,"r":1},{"t":"星汉灿烂，若出其里。","tr":"银河里的万千星辰，也好像从大海里升起。","p":0,"r":1},{"t":"幸甚至哉，歌以咏志。","tr":"庆幸得很啊，就用诗歌来表达心志吧。","p":0,"r":1}],"notes":[{"u":0,"w":"临","m":"登上，到达","t":"实词","d":["面对","靠近"]},{"u":0,"w":"沧海","m":"青苍色的大海","t":"实词","d":["沧桑巨变","遥远的海边"]},{"u":1,"w":"澹澹","m":"水波摇动的样子","t":"实词","d":["平静清澈的样子","浩渺无边的样子"]},{"u":1,"w":"竦峙","m":"高高耸立","t":"实词","d":["连绵起伏","隐约浮现"]},{"u":3,"w":"萧瑟","m":"树木被秋风吹动的声音","t":"实词","d":["景象荒凉冷清","秋意渐深"]},{"u":6,"w":"幸甚至哉","m":"庆幸得很啊（“至哉”指极点）","t":"特殊句式","d":[]}],"tricky":["澹","竦","峙","汉"],"keyLines":[{"u":4,"hint":"《观沧海》中，诗人以想象表现大海吞吐日月的气魄的两句是："},{"u":5,"hint":"与“日月之行，若出其中”相对，写银河也像出自大海的句子是："},{"u":3,"hint":"《观沧海》中描写秋风吹拂、海面掀起巨浪的句子是："}],"appr":[{"q":"“日月之行，若出其中；星汉灿烂，若出其里”运用了什么手法？有什么作用？","a":"运用想象和夸张，把日月星辰写成出自大海，突出大海吞吐宇宙的气势，也衬托出诗人博大的胸襟和统一天下的壮志。"},{"q":"全诗景物描写与抒情之间是怎样的关系？","a":"前面写所见之景，由近及远、由实到虚；末句“歌以咏志”点明目的，表明前面的写景都是借景抒怀，以海之壮阔比喻志向之远大。"}]},{"id":"g7a-p02","volume":"g7a","title":"次北固山下","author":"王湾","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"王湾乘船南下，在冬末春初时节停泊于润州北固山下，见江上风物而思念故乡，写下此诗。","theme":"描绘江南早春开阔明丽的景色，抒发旅途中浓浓的思乡之情。","tags":["写景","思乡","羁旅"],"units":[{"t":"客路青山外，行舟绿水前。","tr":"旅客前行的路在青山之外，行船在碧绿的江水之上向前航行。","p":0,"r":1},{"t":"潮平两岸阔，风正一帆悬。","tr":"潮水上涨，江面与两岸齐平，显得十分开阔；风势和顺，一面帆高高挂起。","p":0,"r":1},{"t":"海日生残夜，江春入旧年。","tr":"红日从海上升起，驱散了残留的夜色；江南的春意，在旧年尚未结束时就已来临。","p":0,"r":1},{"t":"乡书何处达？归雁洛阳边。","tr":"寄给家乡的书信该怎样送到呢？但愿北归的大雁替我捎到洛阳一带。","p":0,"r":1}],"notes":[{"u":0,"w":"客路","m":"旅人前行的路途","t":"实词","d":["客人的房间","宾客往来的道路"]},{"u":1,"w":"平","m":"（江面）与两岸齐平，水面涨满","t":"实词","d":["平静","平坦"]},{"u":1,"w":"悬","m":"挂（起）","t":"实词","d":["悬挂在空中不动","悬而未决"]},{"u":1,"w":"正","m":"（风向）顺，不偏斜","t":"实词","d":["正好","端正"]},{"u":2,"w":"残夜","m":"将尽未尽的夜晚","t":"实词","d":["凄凉的夜晚","漫长的夜晚"]},{"u":2,"w":"旧年","m":"过去的一年，指年内未尽之时","t":"实词","d":["往年旧事","多年以前"]},{"u":3,"w":"乡书","m":"家信","t":"古今异义","d":["家乡的书籍","地方志书"]},{"u":3,"w":"归雁","m":"北归的大雁","t":"实词","d":["迷路的大雁","南飞的大雁"]}],"tricky":["潮","悬","残","雁"],"keyLines":[{"u":2,"hint":"《次北固山下》中，写景中蕴含自然新旧交替的哲理、给人积极向上之感的两句是："},{"u":1,"hint":"描写春潮上涨、江面开阔，顺风行船、一帆高挂景象的两句是："},{"u":3,"hint":"诗人借飞雁寄托思乡之情、询问家书何时能送到家乡的两句是："}],"appr":[{"q":"“海日生残夜，江春入旧年”一联在炼字上有何妙处？","a":"“生”“入”二字将日出与春来人格化，赋予自然以生机和力量；夜未尽而日已生，年未尽而春已至，在景中暗含新事物孕育于旧事物之中的理趣。"},{"q":"尾联如何表达诗人的情感？","a":"诗人由眼前所见的春景转到思乡，借“归雁”传书的传统意象，问家书何时能到洛阳，含蓄地抒发了羁旅在外的乡愁，也与首联“客路”相呼应。"}]},{"id":"g7a-p03","volume":"g7a","title":"闻王昌龄左迁龙标遥有此寄","author":"李白","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"好友王昌龄被贬为龙标尉，远赴偏僻的湘西之地，李白听到消息后写下这首诗，寄去思念与慰藉。","theme":"借明月寄托对友人的牵挂，表达对其被贬远行的同情与关切。","tags":["友情","寄赠","借景抒情"],"units":[{"t":"杨花落尽子规啼，闻道龙标过五溪。","tr":"柳絮落尽、杜鹃声声啼叫的时节，听说你被贬为龙标尉，要经过险远的五溪之地。","p":0,"r":1},{"t":"我寄愁心与明月，随君直到夜郎西。","tr":"我把满怀的忧愁寄托给明月，让它一路陪伴你，直到夜郎以西。","p":0,"r":1}],"notes":[{"u":0,"w":"杨花","m":"柳絮","t":"实词","d":["杨树的花朵","白色的野花"]},{"u":0,"w":"子规","m":"杜鹃鸟","t":"实词","d":["规劝君子的人","校正圆形的工具"]},{"u":0,"w":"闻道","m":"听说","t":"实词","d":["听到真理","听见说教"]},{"u":0,"w":"龙标","m":"古地名，王昌龄被贬任职之处，在今湖南怀化一带","t":"实词","d":["龙形的标志","地名，在今四川"]},{"u":1,"w":"与","m":"给","t":"实词","d":["和，同","参与"]},{"u":1,"w":"夜郎西","m":"夜郎以西，泛指王昌龄贬所一带","t":"实词","d":["夜郎国的西边宫殿","夜里向西走"]}],"tricky":["啼","寄","愁","随"],"keyLines":[{"u":1,"hint":"李白在《闻王昌龄左迁龙标遥有此寄》中，把愁心寄托给明月、陪伴友人远行的两句是："},{"u":0,"hint":"诗的开头以暮春景物渲染凄凉气氛，并交代友人将经过险远之地的句子是："}],"appr":[{"q":"诗中“明月”这一意象有什么作用？","a":"明月无私，天涯共赏，诗人把无法亲至的牵挂托付给它，让它随友人一路同行，既把抽象的愁思化为可感的形象，也写出友情的深厚。"},{"q":"前两句的景物描写有何作用？","a":"杨花飘零、子规悲啼，营造出暮春凄清哀伤的氛围，既暗示友人遭贬的不幸，也铺垫了下文寄托忧愁的感情基调。"}]},{"id":"g7a-p04","volume":"g7a","title":"天净沙·秋思","author":"马致远","dynasty":"元","genre":"散曲（小令）","kind":"poem","intro":"这是元代散曲家马致远的小令，描绘秋日黄昏的萧瑟景色，写出漂泊天涯游子的愁苦，被后人称作“秋思之祖”。","theme":"以一组萧瑟的秋景烘托气氛，抒发游子漂泊天涯、思念故乡的愁思。","tags":["羁旅","思乡","借景抒情"],"units":[{"t":"枯藤老树昏鸦，","tr":"枯萎的藤蔓缠着老树，黄昏时乌鸦归巢栖息。","p":0,"r":1},{"t":"小桥流水人家，","tr":"小桥下流水潺潺，旁边有几户人家。","p":0,"r":1},{"t":"古道西风瘦马。","tr":"荒凉的古道上，西风阵阵，一匹瘦马缓缓前行。","p":0,"r":1},{"t":"夕阳西下，","tr":"夕阳渐渐向西落下，","p":0,"r":1},{"t":"断肠人在天涯。","tr":"悲伤欲绝的游子仍漂泊在天涯。","p":0,"r":1}],"notes":[{"u":0,"w":"昏鸦","m":"黄昏时归巢的乌鸦","t":"实词","d":["昏昏欲睡的乌鸦","受惊的乌鸦"]},{"u":1,"w":"人家","m":"住户，家庭","t":"古今异义","d":["别人的家","他人"]},{"u":2,"w":"古道","m":"荒凉的旧路","t":"实词","d":["古代的道理","古人的学说"]},{"u":2,"w":"瘦马","m":"瘦弱的马","t":"实词","d":["良马","疲倦的老马"]},{"u":4,"w":"断肠人","m":"伤心到极点的人，指漂泊天涯的游子","t":"实词","d":["身体有病的人","肠胃不好的人"]},{"u":4,"w":"天涯","m":"天边，指极远的地方","t":"实词","d":["天空的边缘","河流的尽头"]}],"tricky":["藤","昏","鸦","涯"],"keyLines":[{"u":2,"hint":"《天净沙·秋思》中，以古道、西风、瘦马三种意象渲染萧瑟凄凉气氛的句子是："},{"u":4,"hint":"点明全曲主旨、直接抒发游子漂泊天涯之愁的句子是："},{"u":1,"hint":"与前后萧瑟之景形成对照，以温馨安宁的景象反衬游子孤苦的句子是："}],"appr":[{"q":"前三句连用九个名词性意象，有什么表达效果？","a":"枯藤、老树、昏鸦、小桥、流水、人家、古道、西风、瘦马并列呈现，没有多余的连接词，却组成一幅凄清的秋郊夕照图，言简意丰，为末句抒情做足铺垫。"},{"q":"“小桥流水人家”在曲中起什么作用？","a":"这一句描绘出宁静温暖的人家生活，以乐景写哀情，与游子孤身漂泊形成鲜明对比，使“断肠”之情更为突出。"}]},{"id":"g7a-p05","volume":"g7a","title":"峨眉山月歌","author":"李白","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"李白青年时离开四川，乘舟沿江东下，途中见峨眉山月，写下这首诗，既是对故乡山水的依恋，也寄托对友人的思念。","theme":"通过月夜行舟的见闻，抒发对故乡山水和友人的依依不舍之情。","tags":["写景","思念","羁旅"],"units":[{"t":"峨眉山月半轮秋，影入平羌江水流。","tr":"秋夜里，峨眉山头悬着半轮明月，月影映入平羌江中，随江水流动。","p":0,"r":1},{"t":"夜发清溪向三峡，思君不见下渝州。","tr":"夜里从清溪驿出发，驶向三峡；想念你却见不到你，只能顺江而下前往渝州。","p":0,"r":1}],"notes":[{"u":0,"w":"半轮秋","m":"秋夜的半轮月亮","t":"实词","d":["秋天的一半","半个车轮"]},{"u":0,"w":"平羌","m":"平羌江，即今青衣江","t":"实词","d":["平定羌人","平静的江水"]},{"u":0,"w":"影","m":"月亮的倒影","t":"实词","d":["人的影子","光线"]},{"u":1,"w":"发","m":"出发","t":"实词","d":["发出","发现"]},{"u":1,"w":"君","m":"你，一说指月亮","t":"实词","d":["君主","友人的敬称，指某位官员"]},{"u":1,"w":"下","m":"顺流而下，前往","t":"实词","d":["落下","降低"]}],"tricky":["峨","眉","羌","渝"],"keyLines":[{"u":0,"hint":"《峨眉山月歌》中，写秋夜半月高悬、月影映入江水随波流动的两句是："},{"u":1,"hint":"诗人夜晚从清溪出发驶向三峡，表达对友人思念之情的两句是："},{"u":0,"hint":"运用“影入”“流”，写出月光与江水融为一体、静中有动之景的句子是："}],"appr":[{"q":"这首诗连用了哪些地名？有什么妙处？","a":"诗中先后出现峨眉山、平羌江、清溪、三峡、渝州五个地名，随着行舟的推进依次展开，既交代了行程，又勾勒出一幅千里江行图，毫无堆砌之感。"},{"q":"诗中“月”有什么作用？","a":"月始终伴随行程，从峨眉山头到江水流影，再到“思君”，月既是景，也成为诗人思念与故乡眷恋的寄托，使全诗意境清朗而深远。"}]},{"id":"g7a-p06","volume":"g7a","title":"江南逢李龟年","author":"杜甫","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"杜甫晚年漂泊江南，在潭州偶遇当年名满京城的宫廷乐师李龟年，回想盛世与乱离，写下此诗。","theme":"借重逢旧识，抒发对盛世的追忆和对世事沧桑、人生飘零的感慨。","tags":["怀旧","感时伤世","叙事"],"units":[{"t":"岐王宅里寻常见，崔九堂前几度闻。","tr":"当年在岐王府中常常见到你，在崔九的厅堂里也多次听到你的演唱。","p":0,"r":1},{"t":"正是江南好风景，落花时节又逢君。","tr":"如今正是江南风景最美的时候，在落花纷飞的暮春，我们又一次相遇了。","p":0,"r":1}],"notes":[{"u":0,"w":"岐王","m":"唐玄宗的弟弟李范","t":"实词","d":["岐山的君王","唐代的亲王，名李隆基"]},{"u":0,"w":"寻常","m":"经常，平常","t":"古今异义","d":["普通的","八尺和十六尺"]},{"u":0,"w":"闻","m":"听","t":"古今异义","d":["用鼻子闻气味","听说"]},{"u":0,"w":"崔九","m":"崔涤，在家中排行第九，玄宗时的近臣","t":"实词","d":["姓崔的九个人","九位官员"]},{"u":1,"w":"好风景","m":"美好的风光","t":"实词","d":["好看的画","好的风气"]},{"u":1,"w":"君","m":"你，指李龟年","t":"实词","d":["国君","夫君"]}],"tricky":["岐","崔","逢","寻"],"keyLines":[{"u":1,"hint":"《江南逢李龟年》中，点明重逢的时间、地点，寓含盛衰之感的两句是："},{"u":0,"hint":"诗人追忆当年在王府和贵族家中常见、常听李龟年演唱的两句是："},{"u":1,"hint":"以暮春“落花”之景暗示世事凋零、人生飘零的句子是："}],"appr":[{"q":"“落花时节又逢君”蕴含了怎样的感情？","a":"“落花”既点明暮春时令，又象征盛世衰落、人生飘零；“又逢君”写出久别重逢，欣喜之中夹杂着无限沧桑，感情含蓄而深沉。"},{"q":"这首诗在写法上有什么特点？","a":"全诗只叙旧事、写眼前，没有一句直接抒情，却通过今昔对比和“好风景”的反衬，把时代离乱、人生沧桑的感慨藏在平淡语言之下，言浅意深。"}]},{"id":"g7a-p07","volume":"g7a","title":"行军九日思长安故园","author":"岑参","dynasty":"唐","genre":"五言绝句","kind":"poem","intro":"天宝末年岑参随军出征，重阳节这天身处军营，登高无酒，遥想故乡长安，写下此诗。","theme":"借重阳登高无酒的遗憾，抒发战地思乡与对故园亲人的牵挂。","tags":["思乡","节令","边塞"],"units":[{"t":"强欲登高去，无人送酒来。","tr":"勉强想要登高远望，却没有人送酒来共度佳节。","p":0,"r":1},{"t":"怜君思故园，应在战场开。","tr":"可怜长安的菊花，想念故乡，大概正在战场旁边孤零零地开放。","p":0,"r":1}],"notes":[{"u":0,"w":"强欲","m":"勉强想要","t":"实词","d":["强烈希望","强行要求"]},{"u":0,"w":"登高","m":"重阳节登高的习俗","t":"实词","d":["登上高楼","攀登高峰"]},{"u":0,"w":"送酒","m":"据说陶渊明重阳无酒，王弘派人送酒，此处指无人送酒","t":"实词","d":["送别饮酒","赠送酒器"]},{"u":1,"w":"怜","m":"可怜，怜惜","t":"实词","d":["喜爱","同情他人"]},{"u":1,"w":"君","m":"指长安故园的菊花","t":"实词","d":["您，对人的尊称","国君"]},{"u":1,"w":"故园","m":"指故乡长安","t":"实词","d":["旧日花园","废弃的园林"]}],"tricky":["强","欲","怜","战"],"keyLines":[{"u":0,"hint":"《行军九日思长安故园》中，诗人重阳节想登高赏秋，却没有人送酒来的句子是："},{"u":1,"hint":"《行军九日思长安故园》中，诗人想象故园菊花开在战场旁、借以寄托思乡之情的句子是："},{"u":1,"hint":"《行军九日思长安故园》中，用拟人手法表达对故乡思念与战地凄凉的两句是："}],"appr":[{"q":"“怜君思故园，应在战场开”运用了什么手法？有何效果？","a":"运用拟人手法，把长安的菊花写成思念故园的人，又想象它开在战场旁，既写出战乱的景象，也把诗人自己的思乡之情含蓄地转到菊花身上，情感更曲折深沉。"},{"q":"这首诗“思乡”的情感是怎样表达的？","a":"诗人没有直说想家，而是借重阳登高、送酒的典故，写无人送酒的失落，再以遥想故乡的菊花“应在战场开”，由人及花，由己及物，用想象含蓄表达思乡与对故园的牵挂。"}]},{"id":"g7a-p08","volume":"g7a","title":"夜上受降城闻笛","author":"李益","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"李益久在边塞从军，一个月夜在受降城听到笛声，触动戍边将士的思乡之情，写下此诗。","theme":"通过边塞月夜的苍凉景象与笛声，写出征人浓重的思乡之情。","tags":["边塞","思乡","写景"],"units":[{"t":"回乐烽前沙似雪，受降城外月如霜。","tr":"回乐烽前的沙地白得像雪，受降城外的月光冷得像霜。","p":0,"r":1},{"t":"不知何处吹芦管，一夜征人尽望乡。","tr":"不知是从哪里传来了芦管的声音，一整夜戍边的将士都在遥望故乡。","p":0,"r":1}],"notes":[{"u":0,"w":"回乐烽","m":"回乐县附近的烽火台","t":"实词","d":["回来取乐的烽火","一座山峰"]},{"u":0,"w":"受降城","m":"唐代为防御突厥所筑的城，在今内蒙古一带","t":"实词","d":["接受投降的城","受到降雪的城"]},{"u":0,"w":"霜","m":"这里比喻月光的清冷","t":"实词","d":["秋天的寒霜","白发"]},{"u":1,"w":"芦管","m":"芦苇做成的管乐器，笛类","t":"实词","d":["芦苇的管子","水管"]},{"u":1,"w":"征人","m":"出征戍边的将士","t":"实词","d":["远行的旅人","征收赋税的人"]},{"u":1,"w":"尽","m":"全，都","t":"实词","d":["用完","尽头"]}],"tricky":["烽","芦","征","霜"],"keyLines":[{"u":0,"hint":"《夜上受降城闻笛》中，以沙和月写出边塞夜景清冷荒寒的两句是："},{"u":1,"hint":"《夜上受降城闻笛》中，表现戍边将士整夜思念家乡的句子是："},{"u":1,"hint":"《夜上受降城闻笛》中，点明笛声引发思乡之情的诗句是："}],"appr":[{"q":"“沙似雪”“月如霜”有什么表达效果？","a":"两个比喻写出月夜沙地一片洁白、月光寒冷如霜的景象，营造出荒凉清冷的边塞氛围，为下文征人思乡的悲情作铺垫。"},{"q":"末句“一夜征人尽望乡”如何表达情感？","a":"“一夜”写时间之长，“尽”写人数之多，说明笛声勾起了所有戍边将士的思乡之情，以群体的情感强化思乡的深沉，余味无穷。"}]},{"id":"g7a-p09","volume":"g7a","title":"秋词（其一）","author":"刘禹锡","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"刘禹锡一生屡遭贬谪，却乐观豪迈。他在贬官期间作《秋词》，一反历来悲秋的传统。","theme":"一反文人悲秋的传统，赞美秋天的壮阔高远，表现乐观向上的豪情。","tags":["写景","抒怀","哲理"],"units":[{"t":"自古逢秋悲寂寥，我言秋日胜春朝。","tr":"自古以来，人们一遇到秋天就悲叹萧条冷落，我却说秋天比春天更好。","p":0,"r":1},{"t":"晴空一鹤排云上，便引诗情到碧霄。","tr":"晴朗的天空中，一只白鹤冲开云层向上飞去，也把我的诗情引到了碧蓝的云霄。","p":0,"r":1}],"notes":[{"u":0,"w":"逢","m":"遇到","t":"实词","d":["迎接","相逢"]},{"u":0,"w":"寂寥","m":"空旷冷落","t":"实词","d":["寂寞孤独","安静"]},{"u":0,"w":"春朝","m":"春天","t":"实词","d":["春天的早晨","朝廷"]},{"u":1,"w":"排云","m":"冲开云层","t":"实词","d":["排列成云","推走乌云"]},{"u":1,"w":"碧霄","m":"碧蓝的天空","t":"实词","d":["碧绿的树梢","晴朗的早晨"]},{"u":0,"w":"胜","m":"胜过，优于","t":"实词","d":["胜利","美景"]}],"tricky":["寥","胜","霄","排"],"keyLines":[{"u":0,"hint":"《秋词》中，诗人一反传统悲秋之意、直接表明秋日胜过春天的句子是："},{"u":1,"hint":"《秋词》中，用白鹤凌空写出秋日高远壮阔、引发诗情的句子是："},{"u":0,"hint":"《秋词》中概括古人对秋天的普遍情感的句子是："}],"appr":[{"q":"“自古逢秋悲寂寥，我言秋日胜春朝”表现了诗人怎样的态度？","a":"诗人先写古人悲秋的惯例，再用“我言”直接反驳，表现他不落俗套的见解和不因逆境而消沉的乐观精神。"},{"q":"“晴空一鹤排云上”一句有什么妙处？","a":"“排”字写出白鹤奋力冲破云层的力量，画面开阔、动感强烈，象征诗人昂扬向上的精神，也使“诗情”有了具体可感的依托。"}]},{"id":"g7a-p10","volume":"g7a","title":"夜雨寄北","author":"李商隐","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"李商隐客居巴蜀，在秋夜雨声中给远在北方长安的亲友（一说妻子）寄诗。","theme":"写夜雨中羁旅的孤寂和对团聚的期盼，借想象重逢相谈今夜情景，表达思念。","tags":["思念","抒情","夜雨"],"units":[{"t":"君问归期未有期，巴山夜雨涨秋池。","tr":"你问我回家的日期，我还没有定下；今夜巴山下着大雨，秋天的池塘水都涨满了。","p":0,"r":1},{"t":"何当共剪西窗烛，却话巴山夜雨时。","tr":"什么时候才能和你一起坐在西窗下剪烛花，再谈起今夜巴山夜雨的情景呢？","p":0,"r":1}],"notes":[{"u":0,"w":"君","m":"对对方的尊称，你","t":"实词","d":["国君","诸位"]},{"u":0,"w":"期","m":"日期，归期","t":"实词","d":["期望","期限"]},{"u":0,"w":"巴山","m":"泛指四川东部的山","t":"实词","d":["巴蜀一座山","巴掌大的山"]},{"u":1,"w":"何当","m":"何时才能","t":"实词","d":["为什么应当","怎么能够"]},{"u":1,"w":"西窗烛","m":"西窗下的烛光，剪去烛芯使之明亮","t":"实词","d":["吹灭蜡烛","点燃蜡烛"]},{"u":1,"w":"却话","m":"回头说起，再说起","t":"实词","d":["退却不谈","推辞说话"]}],"tricky":["涨","剪","烛","池"],"keyLines":[{"u":0,"hint":"《夜雨寄北》中，诗人回答对方询问归期的句子是："},{"u":1,"hint":"《夜雨寄北》中，诗人想象日后团聚、共话今夜情景的两句是："},{"u":0,"hint":"《夜雨寄北》中，描写巴山秋夜雨水涨满池塘的句子是："}],"appr":[{"q":"这首诗中“巴山夜雨”出现了两次，有什么作用？","a":"第一次是眼前的实景，渲染羁旅孤寂；第二次是想象团聚时回忆今夜的情景。两次重复使时空交叠，将今夜的愁苦与未来的欢聚对照，感情含蓄而深长。"},{"q":"“何当共剪西窗烛”表现了诗人怎样的心情？","a":"诗人以设想团聚、秉烛夜谈的温馨场面，反衬眼前的孤寂，表达了对相聚的殷切盼望和对亲人的深切思念。"}]},{"id":"g7a-p11","volume":"g7a","title":"十一月四日风雨大作（其二）","author":"陆游","dynasty":"南宋","genre":"七言绝句","kind":"poem","intro":"陆游晚年闲居山阴农村，在风雨交加的夜里，梦中仍想着收复失地、报效国家。","theme":"表达了诗人年老体衰却仍心系国事、渴望为国效力的爱国情怀。","tags":["爱国","抒怀","梦境"],"units":[{"t":"僵卧孤村不自哀，尚思为国戍轮台。","tr":"我直挺挺躺在偏僻的乡村里，并不为自己感到悲哀，还想着为国家去戍守边疆轮台。","p":0,"r":1},{"t":"夜阑卧听风吹雨，铁马冰河入梦来。","tr":"夜深了，我躺着听风雨声，梦里全是披着铁甲的战马奔过冰封的河流。","p":0,"r":1}],"notes":[{"u":0,"w":"僵卧","m":"直挺挺地躺着，形容无所作为","t":"实词","d":["僵硬而死","躺着休息"]},{"u":0,"w":"不自哀","m":"不为自己悲伤","t":"实词","d":["不会自我哀悼","不被别人哀怜"]},{"u":0,"w":"戍","m":"守卫","t":"实词","d":["征收","兵器"]},{"u":0,"w":"轮台","m":"古地名，在今新疆，这里泛指边疆","t":"实词","d":["一座高台","打猎的地方"]},{"u":1,"w":"夜阑","m":"夜将尽，夜深","t":"实词","d":["夜幕刚降","夜色宁静"]},{"u":1,"w":"铁马","m":"披着铁甲的战马","t":"实词","d":["铁制的马","风铃"]}],"tricky":["僵","戍","阑","铁"],"keyLines":[{"u":0,"hint":"《十一月四日风雨大作》中，表现诗人身处困境却不悲哀、仍心怀报国志向的两句是："},{"u":1,"hint":"《十一月四日风雨大作》中，写诗人在梦中仍然驰骋沙场的句子是："},{"u":1,"hint":"《十一月四日风雨大作》中，诗人因风雨声而梦见战场的两句是："}],"appr":[{"q":"“僵卧孤村不自哀”表现了诗人怎样的形象？","a":"诗人年老、贫病、孤居乡村，却“不自哀”，说明他的悲哀不在个人遭遇，而在国事未了，塑造出忧国忘身、坚韧执着的形象。"},{"q":"“铁马冰河入梦来”有什么表达效果？","a":"这句借风雨声引发梦境，用“铁马”“冰河”写出战场的壮阔和肃杀，以梦写志，表现诗人日夜思念收复失地的强烈愿望，情感悲壮。"}]},{"id":"g7a-p12","volume":"g7a","title":"潼关","author":"谭嗣同","dynasty":"清","genre":"七言绝句","kind":"poem","intro":"谭嗣同年轻时路过潼关，面对黄河与秦岭交汇的雄奇地势，写下此诗，借景抒发胸怀。","theme":"通过描绘潼关雄伟险要的地势，表现诗人开阔的胸襟和豪迈的气概。","tags":["写景","抒怀","咏物"],"units":[{"t":"终古高云簇此城，秋风吹散马蹄声。","tr":"自古以来，高高的云彩就簇拥着这座城，秋风把马蹄声吹散在空中。","p":0,"r":1},{"t":"河流大野犹嫌束，山入潼关不解平。","tr":"黄河奔流在辽阔的原野上，还嫌受到约束；秦岭的山脉进入潼关之后，也不知道什么是平坦。","p":0,"r":1}],"notes":[{"u":0,"w":"终古","m":"自古以来，久远","t":"实词","d":["最终","古代终结"]},{"u":0,"w":"簇","m":"簇拥，聚集","t":"实词","d":["一簇花","排列"]},{"u":0,"w":"此城","m":"指潼关城","t":"实词","d":["这座城市的人","此刻的城池"]},{"u":1,"w":"犹嫌束","m":"仍嫌受到约束","t":"实词","d":["还嫌太窄","仍然害怕约束"]},{"u":1,"w":"大野","m":"辽阔的原野","t":"实词","d":["大的野兽","野外的大火"]},{"u":1,"w":"不解","m":"不知道，不懂","t":"实词","d":["不能解开","不理解别人"]}],"tricky":["簇","潼","嫌","束"],"keyLines":[{"u":0,"hint":"《潼关》中，写潼关高耸、云气缭绕的雄姿的句子是："},{"u":1,"hint":"《潼关》中，写黄河奔腾、嫌被约束的气势的句子是："},{"u":1,"hint":"《潼关》中，写山脉起伏、不得平坦的两句是："}],"appr":[{"q":"“河流大野犹嫌束，山入潼关不解平”运用了什么手法？有何效果？","a":"运用拟人手法，写黄河“嫌束”、山势“不解平”，赋予河山倔强不羁的性格，突出潼关地势的险要雄奇，也寄托了诗人不甘受束缚的豪情。"},{"q":"这首诗的景物描写有什么特点？","a":"诗从云、风、河、山着笔，有高有低、有动有静，由城写到河山，视野开阔，气象雄浑，写景同时流露出诗人开阔的胸怀。"}]},{"id":"g7a-w01","volume":"g7a","title":"咏雪","author":"刘义庆","dynasty":"南朝宋","genre":"志人小说（笔记小说）","kind":"prose","intro":"选自《世说新语·言语》，记叙谢安在寒冷的雪天与子侄辈聚会，让大家即景咏雪的一段家庭趣事。","theme":"通过谢家子弟咏雪的对话，赞赏谢道韫的才思敏捷，展现融洽风雅的家庭文化氛围。","tags":["叙事","咏物","家庭"],"units":[{"t":"谢太傅寒雪日内集，与儿女讲论文义。","tr":"谢太傅在一个寒冷的雪天把家人聚在一起，同子侄们谈论诗文的义理。","p":0,"r":1},{"t":"俄而雪骤，公欣然曰：“白雪纷纷何所似？”","tr":"不一会儿，雪下得又大又急，太傅高兴地问：“这纷纷扬扬的白雪像什么呢？”","p":0,"r":1},{"t":"兄子胡儿曰：“撒盐空中差可拟。”","tr":"哥哥的儿子胡儿说：“把盐撒在空中，大致可以相比。”","p":0,"r":1},{"t":"兄女曰：“未若柳絮因风起。”","tr":"哥哥的女儿说：“不如比作柳絮凭借风势飘舞起来。”","p":0,"r":1},{"t":"公大笑乐。","tr":"太傅高兴得哈哈大笑。","p":0,"r":1},{"t":"即公大兄无奕女，左将军王凝之妻也。","tr":"这位女孩就是太傅大哥谢无奕的女儿，左将军王凝之的妻子。","p":0,"r":1}],"notes":[{"u":0,"w":"太傅","m":"对谢安的尊称，谢安曾任太傅","t":"实词","d":["太子的老师","年长的官员"]},{"u":0,"w":"内集","m":"家庭聚会","t":"实词","d":["在室内集合","内部会议"]},{"u":0,"w":"儿女","m":"子侄辈（泛指家中年轻一辈）","t":"古今异义","d":["儿子和女儿","自己的孩子"]},{"u":0,"w":"讲论","m":"讲解、讨论","t":"实词","d":["讲道理责备","宣讲演说"]},{"u":1,"w":"俄而","m":"不久，一会儿","t":"实词","d":["忽然","于是"]},{"u":1,"w":"骤","m":"急，猛","t":"实词","d":["多次","突然停止"]},{"u":1,"w":"欣然","m":"高兴的样子","t":"实词","d":["勉强的样子","惊讶的样子"]},{"u":1,"w":"所似","m":"像什么（“所”与动词构成名词性短语）","t":"特殊句式"},{"u":2,"w":"差可拟","m":"大致可以相比","t":"实词","d":["差别可以比较","比较差的比喻"]},{"u":3,"w":"未若","m":"不如，比不上","t":"实词","d":["没有像","不曾"]},{"u":3,"w":"因风起","m":"凭借风势而飘起","t":"实词","d":["因为风而停止","沿着风向飘落"]},{"u":5,"w":"即","m":"就是","t":"实词","d":["立即","靠近"]},{"u":2,"w":"兄子","m":"哥哥的儿子","t":"古今异义","d":["兄弟的孩子","哥哥和儿子"]},{"u":5,"w":"妻也","m":"“也”表判断，是……的妻子","t":"虚词"}],"tricky":["骤","撒","絮","凝","奕"],"keyLines":[{"u":1,"hint":"谢太傅雪天提出“白雪纷纷何所似”这一问题的句子是："},{"u":2,"hint":"谢朗用“撒盐”来比喻下雪的句子是："},{"u":3,"hint":"谢道韫以“柳絮”比喻飞雪的名句是："},{"u":5,"hint":"交代咏柳絮之人身份的补叙句是："}],"appr":[{"q":"胡儿与谢道韫的比喻有何高下？为什么？","a":"“撒盐”只取白色与颗粒的形似，显得笨重、呆板；“柳絮因风起”既写出雪的轻盈，又写出飘舞之势，还有春意，更有诗意，所以更胜一筹。"},{"q":"文末为什么要补叙“即公大兄无奕女，左将军王凝之妻也”？","a":"交代说话者的身份，说明她就是后来以才华闻名的谢道韫，使“才女”之评价有所依托，也使上文的称赞更有分量。"}]},{"id":"g7a-w02","volume":"g7a","title":"陈太丘与友期行","author":"刘义庆","dynasty":"南朝宋","genre":"志人小说（笔记小说）","kind":"prose","intro":"选自《世说新语·方正》，写陈太丘与朋友相约同行，朋友失约，七岁的元方据理力争的故事。","theme":"赞扬陈元方明辨是非、维护父亲尊严，说明为人要讲诚信、懂礼貌。","tags":["叙事","诚信","人物"],"units":[{"t":"陈太丘与友期行，期日中。","tr":"陈太丘和朋友约好同行，约定在正午。","p":0,"r":1},{"t":"过中不至，太丘舍去，去后乃至。","tr":"过了正午朋友还没到，太丘就不再等而离开了，他走后朋友才到。","p":0,"r":1},{"t":"元方时年七岁，门外戏。","tr":"那时元方才七岁，正在门外玩耍。","p":0,"r":1},{"t":"客问元方：“尊君在不？”","tr":"客人问元方：“令尊在家吗？”","p":0,"r":1},{"t":"答曰：“待君久不至，已去。”","tr":"元方回答说：“等您很久您都没来，他已经走了。”","p":0,"r":1},{"t":"友人便怒曰：“非人哉！与人期行，相委而去。”","tr":"朋友于是生气地说：“真不是个人啊！和别人约好同行，却丢下人家自己走了。”","p":0,"r":1},{"t":"元方曰：“君与家君期日中。","tr":"元方说：“您和我父亲约定在正午。","p":0,"r":1},{"t":"日中不至，则是无信；","tr":"正午时您没到，这就是不讲信用；","p":0,"r":1},{"t":"对子骂父，则是无礼。”","tr":"对着人家的儿子骂他的父亲，这就是没有礼貌。”","p":0,"r":1},{"t":"友人惭，下车引之。","tr":"朋友感到惭愧，下了车想拉元方。","p":0,"r":1},{"t":"元方入门不顾。","tr":"元方走进家门，头也不回。","p":0,"r":1}],"notes":[{"u":0,"w":"期","m":"约定","t":"实词","d":["日期","期望"]},{"u":0,"w":"日中","m":"正午","t":"实词","d":["太阳当空","每天正中"]},{"u":1,"w":"过中","m":"过了正午（中：正午）","t":"实词","d":["超过中间","经过中途"]},{"u":1,"w":"舍去","m":"不再等候，丢下而离开","t":"实词","d":["放弃职位","舍得离开"]},{"u":1,"w":"乃","m":"才","t":"实词","d":["于是","竟然"]},{"u":2,"w":"戏","m":"玩耍","t":"实词","d":["表演","嬉笑"]},{"u":3,"w":"尊君","m":"对别人父亲的尊称，令尊","t":"实词","d":["尊贵的君主","对朋友的敬称"]},{"u":3,"w":"不","m":"同“否”，表疑问语气","t":"通假","d":["不要","没有"]},{"u":4,"w":"君","m":"您，对对方的尊称","t":"实词","d":["君主","君子"]},{"u":6,"w":"家君","m":"对别人称自己的父亲","t":"实词","d":["一家之主","国君"]},{"u":5,"w":"相委而去","m":"丢下别人自己走了（相：表示动作偏指一方；委：丢下）","t":"特殊句式"},{"u":5,"w":"非人哉","m":"不是个君子（“非人”，不是人）","t":"实词","d":["不是别人","不是常人"]},{"u":7,"w":"无信","m":"不讲信用","t":"实词","d":["没有信件","不相信"]},{"u":9,"w":"惭","m":"惭愧","t":"实词","d":["生气","后悔"]},{"u":9,"w":"引","m":"拉","t":"实词","d":["引导","带领"]},{"u":10,"w":"顾","m":"回头看","t":"古今异义","d":["照顾","顾虑"]},{"u":4,"w":"待","m":"等待","t":"实词","d":["对待","接待"]}],"tricky":["期","委","惭","顾"],"keyLines":[{"u":7,"hint":"元方指出客人不守约定即为失信的话是："},{"u":8,"hint":"元方指责客人当面辱骂他人父亲是失礼的话是："},{"u":5,"hint":"客人迁怒于人、骂太丘不守信的话是："},{"u":10,"hint":"表现元方对失礼客人态度的句子是："}],"appr":[{"q":"元方是怎样驳斥客人的？这样说有什么力量？","a":"元方先指出对方约定正午却迟到，是“无信”，再指出当着孩子骂其父亲，是“无礼”。两句话一前一后，抓住对方失理之处，层层递进，有理有据，使客人无言以对。"},{"q":"本文表达了怎样的道理？","a":"文章借元方与客人的冲突，说明做人要守信用、讲礼貌；同时赞扬元方小小年纪明事理、懂方圆、敢维护父亲的尊严。"}]},{"id":"g7a-w03","volume":"g7a","title":"《论语》十二章","author":"孔子弟子及再传弟子","dynasty":"春秋战国","genre":"语录体散文","kind":"prose","intro":"《论语》是记录孔子及其弟子言行的语录体著作，儒家经典之一。此处选取其中关于学习态度、方法与修身的十二则。","theme":"围绕学习态度、学习方法和个人修养，阐述好学、乐学、思学结合、虚心求教及志向坚定的主张。","tags":["说理","学习","修身"],"units":[{"t":"子曰：“学而时习之，不亦说乎？","tr":"孔子说：“学了知识并按时温习，不是很愉快吗？","p":0,"r":1},{"t":"有朋自远方来，不亦乐乎？","tr":"有志趣相投的人从远方来，不是很快乐吗？","p":0,"r":1},{"t":"人不知而不愠，不亦君子乎？”","tr":"别人不了解我，我却不恼怒，不也是有修养的君子吗？”","p":0,"r":1},{"t":"曾子曰：“吾日三省吾身：为人谋而不忠乎？","tr":"曾子说：“我每天多次反省自己：替别人出主意办事是否尽心竭力了呢？","p":1,"r":1},{"t":"与朋友交而不信乎？","tr":"和朋友交往是否诚实守信了呢？","p":1,"r":1},{"t":"传不习乎？”","tr":"老师传授的学业是否温习了呢？”","p":1,"r":1},{"t":"子曰：“吾十有五而志于学，三十而立，","tr":"孔子说：“我十五岁立志于学问，三十岁能自立于世，","p":2,"r":1},{"t":"四十而不惑，五十而知天命，","tr":"四十岁遇事不再迷惑，五十岁懂得天命，","p":2,"r":1},{"t":"六十而耳顺，七十而从心所欲，不逾矩。”","tr":"六十岁能听进不同的意见，七十岁能随心所欲而不越出规矩。”","p":2,"r":1},{"t":"子曰：“温故而知新，可以为师矣。”","tr":"孔子说：“温习旧知识而能获得新的体会，就可以做别人的老师了。”","p":3,"r":1},{"t":"子曰：“学而不思则罔，思而不学则殆。”","tr":"孔子说：“只学习而不思考，就会迷惑不解；只空想而不学习，就会疑惑而无所得。”","p":4,"r":1},{"t":"子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。","tr":"孔子说：“颜回多么有德行啊！一竹筐饭，一瓢水，住在简陋的小巷里，别人受不了那种穷苦，颜回却不改变他的快乐。","p":5,"r":1},{"t":"贤哉，回也！”","tr":"颜回多么有德行啊！”","p":5,"r":1},{"t":"子曰：“知之者不如好之者，好之者不如乐之者。”","tr":"孔子说：“懂得它的人不如喜爱它的人，喜爱它的人不如以它为乐的人。”","p":6,"r":1},{"t":"子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。","tr":"孔子说：“吃粗粮，喝冷水，弯起胳膊当枕头，快乐也就在其中了。","p":7,"r":1},{"t":"不义而富且贵，于我如浮云。”","tr":"靠不正当手段得来的富贵，对我来说如同天上的浮云。”","p":7,"r":1},{"t":"子曰：“三人行，必有我师焉。","tr":"孔子说：“几个人同行，其中一定有可以做我老师的人。","p":8,"r":1},{"t":"择其善者而从之，其不善者而改之。”","tr":"选取他们的优点向他学习，看到他们的缺点就对照自己加以改正。”","p":8,"r":1},{"t":"子在川上曰：“逝者如斯夫，不舍昼夜。”","tr":"孔子在河边感叹：“逝去的时光就像这河水啊，日夜不停地流走。”","p":9,"r":1},{"t":"子曰：“三军可夺帅也，匹夫不可夺志也。”","tr":"孔子说：“三军的主帅可以被夺走，普通人的志向却不可被夺走。”","p":10,"r":1},{"t":"子夏曰：“博学而笃志，切问而近思，仁在其中矣。”","tr":"子夏说：“广泛学习并坚守志向，恳切发问并多想眼前的事，仁德就在其中了。”","p":11,"r":1}],"notes":[{"u":0,"w":"说","m":"同“悦”，愉快","t":"通假","d":["言说","劝说"]},{"u":0,"w":"时习","m":"按时温习（时：按时；习：温习）","t":"实词","d":["时常练习","适时学习"]},{"u":2,"w":"愠","m":"生气，恼怒","t":"实词","d":["怨恨","惊讶"]},{"u":2,"w":"君子","m":"品德高尚的人","t":"古今异义","d":["有地位的人","丈夫的称呼"]},{"u":3,"w":"三省","m":"多次反省（三：虚指，多次）","t":"实词","d":["三次反省","三个方面反省"]},{"u":3,"w":"谋","m":"谋划，出主意","t":"实词","d":["图谋","计谋"]},{"u":3,"w":"忠","m":"尽心竭力","t":"古今异义","d":["忠诚于国君","忠厚老实"]},{"u":4,"w":"信","m":"诚实，守信","t":"实词","d":["相信","书信"]},{"u":5,"w":"传","m":"老师传授的学业","t":"实词","d":["传说","传递"]},{"u":6,"w":"有","m":"同“又”，用在整数和零数之间","t":"通假","d":["有无的有","占有"]},{"u":6,"w":"立","m":"自立，立足于社会","t":"实词","d":["站立","建立"]},{"u":7,"w":"不惑","m":"不迷惑，通达事理","t":"实词","d":["不疑惑别人","不被迷惑别人"]},{"u":7,"w":"天命","m":"上天的旨意，指不能为人力所支配的事","t":"实词","d":["自然寿命","天子的命令"]},{"u":8,"w":"耳顺","m":"能听进不同意见","t":"实词","d":["耳朵灵敏","顺从他人"]},{"u":8,"w":"逾矩","m":"越出规矩（逾：越过；矩：规矩）","t":"实词","d":["超过规格","逃避责任"]},{"u":9,"w":"故","m":"旧的知识","t":"古今异义","d":["原因","所以"]},{"u":9,"w":"以为师","m":"可以凭此做老师（为：做，当）","t":"实词","d":["认为他是老师","因此拜师"]},{"u":10,"w":"罔","m":"迷惑，没有所得","t":"实词","d":["欺骗","网罗"]},{"u":10,"w":"殆","m":"疑惑；有害","t":"实词","d":["危险","大概"]},{"u":11,"w":"贤","m":"有德行","t":"古今异义","d":["有才能","贤惠"]},{"u":11,"w":"箪","m":"古代盛饭的圆形竹器","t":"实词","d":["饭碗","木桶"]},{"u":11,"w":"食","m":"饭食（读sì）","t":"实词","d":["吃","食物"]},{"u":11,"w":"堪","m":"能忍受","t":"实词","d":["可以","胜任"]},{"u":14,"w":"疏食","m":"粗粮","t":"实词","d":["蔬菜","简单饭菜"]},{"u":14,"w":"曲肱","m":"弯着胳膊","t":"实词","d":["弯着腿","低头"]},{"u":14,"w":"枕","m":"用作枕头（名词作动词）","t":"词类活用"},{"u":15,"w":"不义而富且贵","m":"用不正当手段得来的富贵","t":"特殊句式"},{"u":16,"w":"三人行","m":"几个人同行（三：泛指多数）","t":"实词","d":["三个人走","第三人走"]},{"u":16,"w":"焉","m":"于此，在其中（兼词）","t":"虚词"},{"u":17,"w":"善者","m":"优点（形容词作名词）","t":"词类活用"},{"u":18,"w":"逝者","m":"逝去的时光（指代流水）","t":"实词","d":["死去的人","往事"]},{"u":18,"w":"斯","m":"这，指河水","t":"实词","d":["此刻","斯文"]},{"u":18,"w":"舍","m":"舍弃，停止","t":"实词","d":["住所","舍得"]},{"u":19,"w":"夺","m":"改变，夺取","t":"实词","d":["抢夺","丢失"]},{"u":19,"w":"匹夫","m":"平民百姓","t":"古今异义","d":["勇猛的人","一匹布的丈夫"]},{"u":20,"w":"笃志","m":"坚定志向","t":"实词","d":["忠厚的志向","诚实的目标"]},{"u":20,"w":"近思","m":"思考身边的事情","t":"实词","d":["接近想法","近来的想法"]}],"tricky":["愠","箪","瓢","逾","肱","笃","殆"],"keyLines":[{"u":9,"hint":"孔子谈温习旧知识而获得新体会，认为这样就可以做老师的句子是："},{"u":10,"hint":"孔子论述学习与思考相互关系的句子是："},{"u":13,"hint":"孔子用学习的三种层次说明乐学境界最高的句子是："},{"u":15,"hint":"孔子表示对不义之财、不义富贵毫不在意的句子是："},{"u":16,"hint":"孔子主张随时向身边人学习的句子是："},{"u":17,"hint":"孔子要求见到别人长处、短处时分别应怎样做的句子是："},{"u":18,"hint":"孔子站在河边感叹时光流逝的名句是："},{"u":19,"hint":"孔子强调普通人志向坚定不可动摇的句子是："},{"u":5,"hint":"曾子“三省”中，反省自己学业的一句是："},{"u":7,"hint":"孔子谈自己四十岁、五十岁达到的境界的句子是："}],"appr":[{"q":"“学而不思则罔，思而不学则殆”说明了什么道理？","a":"说明学习与思考必须结合：只读书不思考，就会迷惑而不得要领；只空想不读书，就会因缺乏根基而疑惑危险。二者相辅相成，缺一不可。"},{"q":"“贤哉，回也”这则语录运用了什么手法？表现了颜回怎样的品质？","a":"通过“一箪食，一瓢饮，在陋巷”与“不改其乐”的对比，并重复“贤哉，回也”加以赞叹，表现颜回安贫乐道、专心向学、不被物质条件所困的高尚品质。"},{"q":"“知之者不如好之者，好之者不如乐之者”表达了什么观点？","a":"以层层递进的方式指出：了解、爱好、以之为乐是学习的三个层次，只有把学习当作乐事，才能持久投入、境界最高，说明兴趣对学习至关重要。"}]},{"id":"g7a-w04","volume":"g7a","title":"诫子书","author":"诸葛亮","dynasty":"三国蜀汉","genre":"书信（家书）","kind":"prose","intro":"诸葛亮晚年写给儿子诸葛瞻的家书，劝诫他修身立志、勤勉向学，是流传很广的家训名篇。","theme":"强调从静心、节俭、立志与勤学做起来修养品德、成就学业，并告诫要珍惜光阴。","tags":["说理","修身","家训"],"units":[{"t":"夫君子之行，静以修身，俭以养德。","tr":"君子的操守，是依靠内心安静来修养身心，依靠俭朴来培养品德。","p":0,"r":1},{"t":"非淡泊无以明志，非宁静无以致远。","tr":"不恬淡寡欲就无法表明志向，不安定清静就无法达到远大目标。","p":0,"r":1},{"t":"夫学须静也，才须学也，非学无以广才，非志无以成学。","tr":"学习必须静下心来，才干必须靠学习获得；不学习就无法增长才干，没有志向就不能成就学业。","p":0,"r":1},{"t":"淫慢则不能励精，险躁则不能治性。","tr":"放纵懈怠就不能振奋精神，轻浮急躁就不能修养性情。","p":0,"r":1},{"t":"年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！","tr":"年华随着时间飞逝，意志随着岁月消磨，最后像枯叶一样凋零，大多不能为社会所用，只能悲哀地守着穷困的破屋，到那时后悔哪里还来得及！","p":0,"r":1}],"notes":[{"u":0,"w":"夫","m":"发语词，无实义","t":"虚词"},{"u":0,"w":"行","m":"品行，操守","t":"古今异义","d":["行走","行为方式"]},{"u":0,"w":"静","m":"安静，宁静","t":"实词","d":["静止","沉默"]},{"u":0,"w":"修身","m":"修养身心","t":"实词","d":["修饰身体","修建身体"]},{"u":0,"w":"俭","m":"节俭，俭朴","t":"实词","d":["吝啬","简单"]},{"u":0,"w":"养德","m":"培养品德（养：培养）","t":"实词","d":["保养身体","赡养"]},{"u":1,"w":"淡泊","m":"不追求名利，恬淡","t":"古今异义","d":["淡薄的饮食","清淡的味道"]},{"u":1,"w":"明志","m":"表明志向","t":"实词","d":["明白道理","显示智慧"]},{"u":1,"w":"宁静","m":"安定清静","t":"实词","d":["寂静","平和"]},{"u":1,"w":"致远","m":"达到远大目标","t":"实词","d":["走向远方","送到远处"]},{"u":2,"w":"须","m":"必须","t":"实词","d":["须要等待","胡须"]},{"u":2,"w":"才","m":"才干，才能","t":"实词","d":["仅仅","刚刚"]},{"u":2,"w":"广才","m":"增长才干（广：使……增多，使动用法）","t":"词类活用"},{"u":1,"w":"无以","m":"没有用来……的办法","t":"特殊句式"},{"u":3,"w":"淫慢","m":"放纵懈怠","t":"实词","d":["过度怠慢","行为不端"]},{"u":3,"w":"励精","m":"振奋精神","t":"实词","d":["激励他人","勤奋精明"]},{"u":3,"w":"险躁","m":"轻薄急躁","t":"实词","d":["危险烦躁","冒险前进"]},{"u":3,"w":"治性","m":"修养性情","t":"实词","d":["治理国家","治疗疾病"]},{"u":4,"w":"驰","m":"疾行，飞逝","t":"实词","d":["驱车","驰骋"]},{"u":4,"w":"遂","m":"终于","t":"实词","d":["顺利","于是"]},{"u":4,"w":"枯落","m":"像枯枝败叶一样凋落","t":"实词","d":["干枯掉落","衰落死去"]},{"u":4,"w":"接世","m":"接触社会，为社会所用","t":"实词","d":["迎接世界","连接世事"]},{"u":4,"w":"穷庐","m":"穷困简陋的屋舍","t":"实词","d":["荒芜的庐舍","深山的庐舍"]},{"u":4,"w":"何及","m":"怎么来得及","t":"特殊句式"}],"tricky":["淡","泊","淫","躁","庐"],"keyLines":[{"u":0,"hint":"诸葛亮在《诫子书》中提出修身养德应做到的两方面是："},{"u":1,"hint":"《诫子书》中强调没有淡泊就不能明确志向的句子是："},{"u":2,"hint":"《诫子书》中说明学习必须静心、才干来自学习的句子是："},{"u":3,"hint":"告诫儿子放纵、浮躁都会影响修养的句子是："},{"u":4,"hint":"《诫子书》中感叹年华流逝、意志消磨的句子是："}],"appr":[{"q":"《诫子书》中“静”与“俭”各起什么作用？","a":"“静”指内心安宁专一，是修养身心、专心学业的前提；“俭”指节俭朴素，能培养不被物欲牵累的品德。二者合在一起，是作者提出的修身养德之本。"},{"q":"结尾为什么要写“悲守穷庐，将复何及”？","a":"以虚拟的悲惨后果警醒儿子：虚度光阴、不立志勤学，终将一事无成、悔之晚矣。以结果反衬珍惜时光、及早立志的重要，使劝诫更有力。"}]},{"id":"g7a-w05","volume":"g7a","title":"狼","author":"蒲松龄","dynasty":"清","genre":"文言短篇小说","kind":"prose","intro":"选自《聊斋志异》。写一个屠户傍晚回家途中遇到两只狼，在危急中机智搏斗、最终杀死二狼的故事。","theme":"通过屠户与狼的搏斗，揭示恶人（狼）贪婪凶狡的本质，说明对恶人不能退让，须勇敢而机智地斗争。","tags":["叙事","寓意","人物"],"units":[{"t":"一屠晚归，担中肉尽，止有剩骨。","tr":"一个屠户傍晚回家，担子里的肉已卖完，只剩下些骨头。","p":0,"r":1},{"t":"途中两狼，缀行甚远。","tr":"路上遇到两只狼，紧紧跟着他走了很远。","p":0,"r":1},{"t":"屠惧，投以骨。","tr":"屠户害怕，就把骨头扔给狼。","p":0,"r":1},{"t":"一狼得骨止，一狼仍从。","tr":"一只狼得到骨头停了下来，另一只狼仍然跟着他。","p":0,"r":1},{"t":"复投之，后狼止而前狼又至。","tr":"屠户又把骨头扔给它，后面那只狼停下了，可先前那只狼又跟了上来。","p":0,"r":1},{"t":"骨已尽矣，而两狼之并驱如故。","tr":"骨头已经扔完了，可两只狼仍像原来一样一起追赶。","p":0,"r":1},{"t":"屠大窘，恐前后受其敌。","tr":"屠户非常窘迫，担心前后同时受到狼的攻击。","p":1,"r":1},{"t":"顾野有麦场，场主积薪其中，苫蔽成丘。","tr":"他环顾田野，看见一个麦场，场主把柴草堆在里面，覆盖起来像座小山。","p":1,"r":1},{"t":"屠乃奔倚其下，弛担持刀。","tr":"屠户于是跑过去背靠柴草堆，卸下担子，拿起屠刀。","p":1,"r":1},{"t":"狼不敢前，眈眈相向。","tr":"狼不敢上前，瞪着眼睛朝着屠户。","p":1,"r":1},{"t":"少时，一狼径去，其一犬坐于前。","tr":"过了一会儿，一只狼径直走开了，另一只像狗一样蹲坐在前面。","p":2,"r":1},{"t":"久之，目似瞑，意暇甚。","tr":"时间久了，那狼的眼睛似乎闭上了，神情十分悠闲。","p":2,"r":1},{"t":"屠暴起，以刀劈狼首，又数刀毙之。","tr":"屠户突然跳起，用刀劈砍狼的头，又连砍几刀杀死了它。","p":2,"r":1},{"t":"方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。","tr":"正要离开，转身看柴草堆后面，另一只狼正在里面打洞，想从洞中钻进去从背后攻击屠户。","p":2,"r":1},{"t":"身已半入，止露尻尾。","tr":"狼的身子已钻进去一半，只露出屁股和尾巴。","p":2,"r":1},{"t":"屠自后断其股，亦毙之。","tr":"屠户从后面砍断它的后腿，也把这只狼杀死了。","p":2,"r":1},{"t":"乃悟前狼假寐，盖以诱敌。","tr":"这才明白先前那只狼假装睡觉，原来是用来诱骗屠户。","p":2,"r":1},{"t":"狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。","tr":"狼也够狡猾的了，可一会儿工夫两只都被杀死，禽兽的欺诈手段能有多少呢？只是给人添些笑料罢了。","p":3,"r":1}],"notes":[{"u":0,"w":"止","m":"只，仅仅","t":"实词","d":["停止","居住"]},{"u":1,"w":"缀","m":"紧跟","t":"实词","d":["连缀","点缀"]},{"u":2,"w":"投","m":"扔，投掷","t":"实词","d":["投靠","投入"]},{"u":3,"w":"止","m":"停下","t":"实词","d":["只","居住"]},{"u":4,"w":"前狼","m":"先前那只狼（前：先前）","t":"实词","d":["前面的狼","前来的狼"]},{"u":5,"w":"并驱","m":"一起追赶","t":"实词","d":["并排驾车","驱赶牲畜"]},{"u":5,"w":"如故","m":"像原来一样","t":"实词","d":["如同旧友","好像故事"]},{"u":6,"w":"窘","m":"处境困迫，危急","t":"实词","d":["尴尬","害怕"]},{"u":6,"w":"敌","m":"攻击，袭击（名词作动词）","t":"词类活用"},{"u":7,"w":"顾","m":"环视，看","t":"古今异义","d":["顾虑","照顾"]},{"u":7,"w":"薪","m":"柴草","t":"实词","d":["薪水","木材"]},{"u":7,"w":"苫蔽","m":"用草席等覆盖遮蔽","t":"实词","d":["遮挡阳光","苫盖屋顶"]},{"u":8,"w":"弛","m":"卸下","t":"实词","d":["松弛","放松"]},{"u":9,"w":"眈眈","m":"注视的样子（形容凶狠地注视）","t":"实词","d":["犹豫不决","愤怒的样子"]},{"u":10,"w":"径","m":"径直，直接","t":"实词","d":["小路","直径"]},{"u":10,"w":"犬坐","m":"像狗那样蹲坐（名词作状语）","t":"词类活用"},{"u":11,"w":"暇","m":"悠闲，从容","t":"实词","d":["空闲","暇日"]},{"u":12,"w":"暴","m":"突然","t":"实词","d":["凶暴","猛烈"]},{"u":12,"w":"毙","m":"杀死","t":"实词","d":["倒下","毁坏"]},{"u":13,"w":"洞","m":"打洞（名词作动词）","t":"词类活用"},{"u":13,"w":"隧","m":"钻洞，打洞（名词作动词）","t":"词类活用"},{"u":15,"w":"股","m":"大腿","t":"古今异义","d":["股份","部分"]},{"u":16,"w":"假寐","m":"装睡","t":"实词","d":["小睡","休息"]},{"u":16,"w":"盖","m":"表推测，大概是","t":"虚词"},{"u":17,"w":"黠","m":"狡猾","t":"实词","d":["聪明","凶恶"]},{"u":17,"w":"变诈","m":"狡诈，诡变","t":"实词","d":["变化多端","诈骗"]},{"u":17,"w":"几何","m":"多少","t":"古今异义","d":["几何学","若干图形"]},{"u":17,"w":"止增笑耳","m":"只是增加笑料罢了（止：只；耳：罢了）","t":"虚词"}],"tricky":["缀","窘","眈","暇","毙","黠"],"keyLines":[{"u":2,"hint":"《狼》中屠户见狼跟随，因害怕而扔出骨头的句子是："},{"u":6,"hint":"写屠户处境危急、担心被狼前后夹击的句子是："},{"u":9,"hint":"写屠户依靠麦场柴草堆后，狼不敢冒进的句子是："},{"u":11,"hint":"写狼假装睡觉、以迷惑屠户的神态句子是："},{"u":13,"hint":"写另一只狼想打洞钻入柴堆攻击屠户后方的句子是："},{"u":16,"hint":"点明前面那只狼的行为目的是引诱屠户的句子是："},{"u":17,"hint":"作者评论狼虽狡猾却终被杀死的议论句是："}],"appr":[{"q":"《狼》中的屠户和狼分别有怎样的形象？","a":"狼贪婪、凶狠又狡诈，先尾随、后分工，一只假寐，一只打洞偷袭；屠户起初怕而退让，处境危急后冷静观察、抓住时机果断反击，表现出机智勇敢。"},{"q":"结尾议论有什么作用？","a":"以“狼亦黠矣”承接前文，“顷刻两毙”写结果，再以“止增笑耳”点明寓意：狡诈的恶人终究逃不过惩罚；也表明对恶人要勇于斗争、善于斗争，不能幻想退让。"}]},{"id":"g7a-w06","volume":"g7a","title":"穿井得一人","author":"吕不韦门客","dynasty":"战国","genre":"寓言","kind":"prose","intro":"选自《吕氏春秋·慎行论·察传》。丁氏说自家打井“得一人”，辗转传成“挖出一个人”，说明传言易失真。","theme":"说明对听来的话要认真调查核实，不可轻信传言，否则以讹传讹。","tags":["寓言","说理","叙事"],"units":[{"t":"宋之丁氏，家无井而出溉汲，常一人居外。","tr":"宋国有个姓丁的人家，家里没有水井，要到外面打水浇灌，常常安排一个人在外面专管打水。","p":0,"r":1},{"t":"及其家穿井，告人曰：“吾穿井得一人。”","tr":"等到他家挖了井，他告诉别人说：“我家挖井得到了一个人。”","p":0,"r":1},{"t":"有闻而传之者：“丁氏穿井得一人。”","tr":"有听到的人传话说：“丁家挖井挖出了一个人。”","p":0,"r":1},{"t":"国人道之，闻之于宋君。","tr":"都城里的人都谈论这件事，一直传到宋国国君耳中。","p":0,"r":1},{"t":"宋君令人问之于丁氏，丁氏对曰：“得一人之使，非得一人于井中也。”","tr":"宋国国君派人向丁家询问，丁氏回答说：“是得到了一个人的劳力，并不是在井里挖到一个人。”","p":0,"r":1},{"t":"求闻之若此，不若无闻也。","tr":"像这样去求取传闻，还不如没有听到。","p":0,"r":1}],"notes":[{"u":0,"w":"溉汲","m":"浇灌与打水，这里指到外面打水","t":"实词","d":["灌溉庄稼","汲取知识"]},{"u":0,"w":"居外","m":"住在外面，指专管打水","t":"实词","d":["居于国外","在外面居住"]},{"u":1,"w":"及","m":"等到","t":"实词","d":["到达","和"]},{"u":1,"w":"穿","m":"挖掘","t":"实词","d":["穿过","穿着"]},{"u":2,"w":"闻","m":"听说","t":"实词","d":["气味","出名"]},{"u":3,"w":"国人","m":"国都里的人","t":"古今异义","d":["本国人民","国内居民"]},{"u":3,"w":"道","m":"说，谈论","t":"实词","d":["道路","道理"]},{"u":3,"w":"闻之于宋君","m":"被宋君听到（使宋君听说）","t":"特殊句式"},{"u":4,"w":"令","m":"派，使","t":"实词","d":["命令","美好"]},{"u":4,"w":"对","m":"回答","t":"实词","d":["面对","对付"]},{"u":4,"w":"使","m":"役使，指劳力","t":"实词","d":["使者","使用"]},{"u":4,"w":"非得一人于井中也","m":"“于井中”介宾短语后置，应为“于井中得一人”","t":"特殊句式"},{"u":5,"w":"求闻之若此","m":"像这样","t":"实词","d":["如果这样","假如这些"]},{"u":5,"w":"不若","m":"不如","t":"实词","d":["不像","不顺从"]}],"tricky":["溉","汲","穿","若"],"keyLines":[{"u":1,"hint":"丁氏说自家挖井省去一个人的劳力时，原话是："},{"u":2,"hint":"写传话人把“得一人”传讹的句子是："},{"u":4,"hint":"丁氏澄清误会的话是："},{"u":5,"hint":"概括全文寓意、说明传言不可轻信的句子是："}],"appr":[{"q":"故事中的传言是怎样一步步变样的？说明了什么？","a":"丁氏说“得一人之使”，被人说成“穿井得一人”，再传到国君那里，意思已完全走样。说明传言经过转述极易失真，不加核实就会以讹传讹。"},{"q":"文末“求闻之若此，不若无闻也”有什么作用？","a":"是全文的议论收束，点明寓意：听到消息要审慎判断、核实真伪，否则不如不听。对后文及读者有警醒作用。"}]},{"id":"g7a-w07","volume":"g7a","title":"杞人忧天","author":"列子及其后学","dynasty":"战国","genre":"寓言","kind":"prose","intro":"选自《列子·天瑞》。讲杞国有人担心天塌地陷，吃不下睡不着，经人开导才释然。","theme":"讽刺为不必要的事过分忧虑的人，也提示人们遇事要明白道理，不要无端焦虑。","tags":["寓言","说理","叙事"],"units":[{"t":"杞国有人忧天地崩坠，身亡所寄，废寝食者。","tr":"杞国有个人担心天塌地陷，自己无处容身，因此睡不着觉、吃不下饭。","p":0,"r":1},{"t":"又有忧彼之所忧者，因往晓之，曰：","tr":"又有人为他的忧虑而担忧，于是前去开导他，说：","p":0,"r":1},{"t":"“天，积气耳，亡处亡气。","tr":"“天不过是积聚起来的气体罢了，没有哪里没有气。","p":0,"r":1},{"t":"若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？”","tr":"你一举一动、一呼一吸，整天都在天里活动，为什么还担心它塌下来呢？”","p":0,"r":1},{"t":"其人曰：“天果积气，日月星宿，不当坠耶？”","tr":"那人说：“天如果真是积聚的气体，那么日月星辰不该掉下来吗？”","p":1,"r":0},{"t":"晓之者曰：“日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。”","tr":"开导的人说：“日月星辰也是气体中会发光的东西，即使掉下来，也不会砸伤什么。”","p":1,"r":0},{"t":"其人曰：“奈地坏何？”","tr":"那人又问：“地陷了怎么办呢？”","p":2,"r":0},{"t":"晓之者曰：“地，积块耳，充塞四虚，亡处亡块。","tr":"开导的人说：“大地不过是土块积聚而成，填满了四面的空处，没有哪里没有土块。","p":2,"r":0},{"t":"若躇步跐蹈，终日在地上行止，奈何忧其坏？”","tr":"你迈步踩踏，整天都在地上行走，为什么还担心它会塌坏呢？”","p":2,"r":0},{"t":"其人舍然大喜，晓之者亦舍然大喜。","tr":"那人心里的疑虑顿时消除，非常高兴；开导他的人也很高兴。","p":3,"r":0}],"notes":[{"u":0,"w":"崩坠","m":"崩塌坠落","t":"实词","d":["崩溃","倒塌"]},{"u":0,"w":"亡","m":"同“无”，没有","t":"通假","d":["逃亡","死亡"]},{"u":0,"w":"寄","m":"寄托，依附，容身","t":"实词","d":["寄送","寄生"]},{"u":0,"w":"废寝食","m":"停止睡觉和吃饭","t":"特殊句式"},{"u":1,"w":"忧彼之所忧者","m":"担忧他所忧虑的事的人（“者”字结构）","t":"特殊句式"},{"u":1,"w":"晓","m":"开导，告知","t":"实词","d":["知道","天亮"]},{"u":1,"w":"因","m":"于是，就","t":"实词","d":["因为","依据"]},{"u":2,"w":"耳","m":"罢了，语气词","t":"虚词"},{"u":2,"w":"积气","m":"积聚的气体","t":"实词","d":["积累怨气","聚集的气息"]},{"u":3,"w":"屈伸","m":"弯曲和伸展","t":"实词","d":["屈服伸张","屈从拉伸"]},{"u":3,"w":"行止","m":"行走和停止，泛指活动","t":"实词","d":["行为举止","出行休息"]},{"u":3,"w":"奈何","m":"为什么，怎么","t":"古今异义","d":["无可奈何","怎么办"]},{"u":4,"w":"宿","m":"星宿，星辰（读xiù）","t":"实词","d":["住宿","夜晚"]},{"u":4,"w":"不当","m":"难道不会（当：应当）","t":"实词","d":["不恰当","不应该"]},{"u":5,"w":"只使","m":"即使，纵使","t":"古今异义","d":["只是让","只有使"]},{"u":5,"w":"中伤","m":"击中而伤害","t":"古今异义","d":["诽谤","陷害"]},{"u":7,"w":"充塞","m":"充满，填满","t":"实词","d":["堵塞","塞住"]},{"u":7,"w":"四虚","m":"四面的空处","t":"实词","d":["四个虚空","四方虚构"]},{"u":3,"w":"若","m":"你","t":"实词","d":["如果","像"]},{"u":8,"w":"躇步","m":"踱步，缓行（躇：迈步）","t":"实词","d":["快步走","大步跳跃"]},{"u":9,"w":"舍然","m":"同“释然”，疑虑消除的样子","t":"通假","d":["舍弃的样子","放弃的样子"]}],"tricky":["杞","崩","宿","躇","跐"],"keyLines":[{"u":0,"hint":"《杞人忧天》中描写杞国人因担心天地崩塌而寝食不安的句子是："},{"u":3,"hint":"开导者说明人一直生活在天中，不必担心天会塌下来的话是："},{"u":5,"hint":"开导者说明日月星辰即使坠落也不会伤人的话是："},{"u":8,"hint":"开导者说明人整天活动于地上，不必担心地塌的话是："},{"u":9,"hint":"写杞人和开导者最后都放下忧虑的句子是："}],"appr":[{"q":"这则寓言反映了杞人怎样的特点？","a":"杞人缺乏基本常识，又过分忧虑，对不可能发生的事庸人自扰，连饭也吃不下、觉也睡不着，是一个无端忧虑的人。"},{"q":"这则寓言对我们有什么启示？","a":"启示我们，对没有根据、不必要的事不应忧虑，要遇事冷静思考、多学知识；同时也说明好心开导他人要晓之以理，才能帮人解除忧虑。"}]},{"id":"g7b-p01","volume":"g7b","title":"木兰诗","author":"佚名","dynasty":"北朝","genre":"乐府民歌（叙事诗）","kind":"poem","intro":"选自《乐府诗集》，是北朝民歌，讲述女子木兰女扮男装替父从军、凯旋后辞官还乡的故事，后经文人润色。","theme":"赞美木兰勤劳勇敢、深明大义、不慕功名的品质，也表达了对和平生活与亲情的向往。","tags":["叙事","民歌","英雄"],"units":[{"t":"唧唧复唧唧，木兰当户织。","tr":"一声接一声的叹息，木兰正对着房门织布。","p":0,"r":1},{"t":"不闻机杼声，唯闻女叹息。","tr":"听不到织布机的声音，只听见姑娘在叹气。","p":0,"r":1},{"t":"问女何所思？问女何所忆？","tr":"问姑娘在思念什么？问姑娘在牵挂什么？","p":0,"r":1},{"t":"女亦无所思，女亦无所忆。","tr":"姑娘说也没有思念什么，也没有牵挂什么。","p":0,"r":1},{"t":"昨夜见军帖，可汗大点兵；","tr":"昨夜看见征兵的文书，可汗大规模征召士兵；","p":0,"r":1},{"t":"军书十二卷，卷卷有爷名。","tr":"征兵的名册有很多卷，每一卷上都有父亲的名字。","p":0,"r":1},{"t":"阿爷无大儿，木兰无长兄，","tr":"父亲没有成年的儿子，木兰也没有哥哥，","p":0,"r":1},{"t":"愿为市鞍马，从此替爷征。","tr":"愿意去买鞍马，从此代替父亲出征。","p":0,"r":1},{"t":"东市买骏马，西市买鞍鞯，","tr":"到东市买来骏马，到西市买来马鞍和垫子，","p":1,"r":1},{"t":"南市买辔头，北市买长鞭。","tr":"到南市买来缰绳嚼子，到北市买来长鞭。","p":1,"r":1},{"t":"旦辞爷娘去，暮宿黄河边。","tr":"早晨辞别爹娘上路，晚上宿在黄河岸边。","p":1,"r":1},{"t":"不闻爷娘唤女声，但闻黄河流水鸣溅溅。","tr":"听不见爹娘呼唤女儿的声音，只听见黄河水哗哗流淌。","p":1,"r":1},{"t":"旦辞黄河去，暮至黑山头。","tr":"早晨辞别黄河出发，傍晚到达黑山脚下。","p":1,"r":1},{"t":"不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。","tr":"听不见爹娘呼唤女儿的声音，只听见燕山胡人战马的嘶鸣声。","p":1,"r":1},{"t":"万里赴戎机，关山度若飞。","tr":"不远万里奔赴战场，翻越关山像飞一样迅速。","p":2,"r":1},{"t":"朔气传金柝，寒光照铁衣。","tr":"北方的寒气中传来打更的梆声，清冷的月光映照着铠甲。","p":2,"r":1},{"t":"将军百战死，壮士十年归。","tr":"将士们身经百战，有的战死沙场，有的多年后得胜归来。","p":2,"r":1},{"t":"归来见天子，天子坐明堂。","tr":"回来朝见天子，天子坐在殿堂上。","p":3,"r":1},{"t":"策勋十二转，赏赐百千强。","tr":"记功升了很多级，赏赐的财物成百上千还多。","p":3,"r":1},{"t":"可汗问所欲，木兰不用尚书郎。","tr":"可汗问她想要什么，木兰说不愿做尚书郎。","p":3,"r":1},{"t":"愿驰千里足，送儿还故乡。","tr":"只希望骑上千里马，送我回到故乡。","p":3,"r":1},{"t":"爷娘闻女来，出郭相扶将；","tr":"爹娘听说女儿回来了，互相搀扶着到城外迎接；","p":4,"r":1},{"t":"阿姊闻妹来，当户理红妆；","tr":"姐姐听说妹妹回来了，对着门整理好艳丽的妆容；","p":4,"r":1},{"t":"小弟闻姊来，磨刀霍霍向猪羊。","tr":"弟弟听说姐姐回来了，霍霍地磨刀去杀猪宰羊。","p":4,"r":1},{"t":"开我东阁门，坐我西阁床。","tr":"打开我东面阁楼的门，坐在我西面阁楼的床上。","p":4,"r":1},{"t":"脱我战时袍，著我旧时裳。","tr":"脱下我打仗时穿的战袍，穿上我从前的女儿装。","p":4,"r":1},{"t":"当窗理云鬓，对镜帖花黄。","tr":"对着窗子梳理像云一样的鬓发，对着镜子在额上贴好花黄。","p":4,"r":1},{"t":"出门看火伴，火伴皆惊忙：","tr":"走出门去看同伴，同伴们都惊讶不已：","p":4,"r":1},{"t":"同行十二年，不知木兰是女郎。","tr":"一起出征十二年，竟不知道木兰是女孩。","p":4,"r":1},{"t":"雄兔脚扑朔，雌兔眼迷离；","tr":"雄兔的脚爱乱蹬，雌兔的眼睛常眯着；","p":5,"r":1},{"t":"双兔傍地走，安能辨我是雄雌？","tr":"两只兔子贴着地面一起跑，怎能分辨哪只是雄哪只是雌呢？","p":5,"r":1}],"notes":[{"u":0,"w":"当户","m":"对着门","t":"实词","d":["守着门户","挡住门"]},{"u":1,"w":"机杼","m":"织布机","t":"实词","d":["织布的梭子","织布的人"]},{"u":4,"w":"军帖","m":"征兵的文书","t":"实词","d":["军队的帖子","军事命令"]},{"u":4,"w":"可汗","m":"古代西北少数民族对君主的称呼","t":"实词","d":["将军的称呼","官名"]},{"u":5,"w":"爷","m":"父亲","t":"古今异义","d":["爷爷","老年男子"]},{"u":7,"w":"市","m":"买","t":"实词","d":["集市","做买卖"]},{"u":8,"w":"鞍鞯","m":"马鞍和马鞍下的垫子","t":"实词","d":["马的缰绳","马的饲料"]},{"u":9,"w":"辔头","m":"驾驭牲口的嚼子和缰绳","t":"实词","d":["马的脚","马的鞭子"]},{"u":15,"w":"金柝","m":"古时军中用的刁斗，白天煮饭、夜间打更","t":"实词","d":["金属的门闩","金色的铃铛"]},{"u":16,"w":"壮士","m":"这里指勇猛的战士","t":"古今异义","d":["身体强壮的人","勇于献身的人"]},{"u":18,"w":"强","m":"有余","t":"实词","d":["强大","强迫"]},{"u":19,"w":"尚书郎","m":"尚书省的官员","t":"实词","d":["尚书的儿子","做尚书的人"]},{"u":21,"w":"郭","m":"外城","t":"实词","d":["城门","城楼"]},{"u":26,"w":"帖","m":"通“贴”，粘贴","t":"通假","d":["书写","帖子"]},{"u":27,"w":"火伴","m":"同伴（古代兵制十人同灶吃饭称火伴）","t":"古今异义","d":["烧火的伙计","火力的搭档"]},{"u":25,"w":"著","m":"通“着”，穿","t":"通假","d":["写作","显著"]}],"tricky":["柝","鞯","辔","啾","帖","鬓"],"keyLines":[{"u":0,"hint":"《木兰诗》开头以织布声和叹息声引出木兰心事的句子是："},{"u":5,"hint":"表明军书上每卷都有父亲名字、点出木兰替父从军原因的句子是："},{"u":15,"hint":"描写北方边塞夜晚寒冷、军营凄清景象的两句是："},{"u":16,"hint":"概括战争艰苦、将士久战的句子是："},{"u":30,"hint":"《木兰诗》结尾以双兔比喻，表现木兰女扮男装难以被识破的句子是："}],"appr":[{"q":"《木兰诗》中“东市买骏马”四句运用了什么手法？有何作用？","a":"运用互文和排比，铺陈木兰购置战马与装备的情景，节奏明快，写出出征前准备的紧张有序和木兰的果断利落。"},{"q":"“万里赴戎机，关山度若飞”表现了什么？","a":"写出行军路途遥远、迅速，“若飞”夸张而形象，表现了木兰英姿飒爽、行军神速的战士风貌。"},{"q":"结尾“雄兔脚扑朔”四句有什么作用？","a":"用兔子作比喻，说明雌雄难辨，含蓄表现木兰女扮男装多年不被发现，使全诗在轻松幽默的气氛中收束，也赞颂木兰的机智。"}]},{"id":"g7b-p02","volume":"g7b","title":"竹里馆","author":"王维","dynasty":"唐","genre":"五言绝句","kind":"poem","intro":"王维晚年隐居辋川，常与友人唱和，此诗是《辋川集》中的一首，写他月夜独坐竹林的闲适心境。","theme":"写月夜独坐幽篁、弹琴长啸的情景，表现诗人恬淡自适、清幽宁静的心境。","tags":["写景","隐逸","抒怀"],"units":[{"t":"独坐幽篁里，弹琴复长啸。","tr":"独自坐在幽静的竹林里，一边弹琴一边放声长啸。","p":0,"r":1},{"t":"深林人不知，明月来相照。","tr":"深林里没有人知道我在这里，只有明月前来与我相伴。","p":0,"r":1}],"notes":[{"u":0,"w":"幽篁","m":"幽深的竹林","t":"实词","d":["弯曲的竹子","竹制的乐器"]},{"u":0,"w":"啸","m":"撮口发出长而清越的声音","t":"实词","d":["大声叫喊","吟诵诗歌"]},{"u":1,"w":"深林","m":"幽深的竹林","t":"实词","d":["茂密的森林","远处的树林"]},{"u":1,"w":"相照","m":"照着我","t":"实词","d":["互相映照","一起照亮"]}],"tricky":["篁","啸"],"keyLines":[{"u":1,"hint":"《竹里馆》中表现诗人幽居无人知晓，唯有明月为伴的两句是："},{"u":0,"hint":"写诗人月夜在竹林中弹琴长啸的句子是："},{"u":1,"hint":"以“明月”衬托诗人孤独而又闲适心境的句子是："}],"appr":[{"q":"“明月来相照”用了什么手法？有何作用？","a":"运用拟人，把明月写成有情的知己前来相伴，既衬出环境的清幽，也表现诗人孤独中自得其乐的情怀。"},{"q":"全诗营造了怎样的意境？","a":"以幽篁、深林、明月、琴声、长啸构成清静幽远的意境，动静相生，表现诗人超然物外、淡泊宁静的心境。"}]},{"id":"g7b-p03","volume":"g7b","title":"春夜洛城闻笛","author":"李白","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"李白客居洛阳时，春夜听到笛声，引发思乡之情而作。","theme":"闻笛声而起思乡之情，抒发游子客居他乡的乡愁。","tags":["思乡","抒怀"],"units":[{"t":"谁家玉笛暗飞声，散入春风满洛城。","tr":"是谁家吹起了悠扬的笛子，笛声暗暗飞出，随着春风传遍整个洛阳城。","p":0,"r":1},{"t":"此夜曲中闻折柳，何人不起故园情？","tr":"今夜在曲子中听到《折杨柳》，有谁不会勾起对故乡的思念呢？","p":0,"r":1}],"notes":[{"u":0,"w":"玉笛","m":"笛子的美称","t":"实词","d":["玉制的箫","玉石敲击声"]},{"u":0,"w":"暗","m":"悄悄地，不知不觉","t":"实词","d":["昏暗","幽深"]},{"u":0,"w":"飞声","m":"笛声飘扬传开","t":"实词","d":["飞鸟的叫声","声音很大"]},{"u":1,"w":"折柳","m":"《折杨柳》曲，古人有折柳送别的习俗","t":"实词","d":["折断柳枝","柳树的枝条"]},{"u":1,"w":"故园","m":"故乡","t":"古今异义","d":["旧花园","破败的园子"]}],"tricky":["闻","柳","洛","笛"],"keyLines":[{"u":1,"hint":"《春夜洛城闻笛》中直接抒发思乡之情的反问句是："},{"u":0,"hint":"写笛声随春风传遍洛阳城的句子是："},{"u":1,"hint":"点明诗人闻笛所听曲调，暗含离别思乡之意的句子是："}],"appr":[{"q":"“折柳”在诗中有什么含义？","a":"“折柳”既指《折杨柳》曲，又因“柳”与“留”谐音，古人折柳送别，故暗含离愁别绪，触动了诗人的思乡之情。"},{"q":"末句为何用反问句？","a":"“何人不起故园情”用反问加强语气，使乡愁由个人扩展到所有听到笛声的人，感情更深沉，也使余味悠长。"}]},{"id":"g7b-p04","volume":"g7b","title":"逢入京使","author":"岑参","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"天宝八载，岑参赴安西从军，途中遇到回长安的使者，托其捎口信报平安而作。","theme":"表现思家怀乡之情与建功立业的豪情，语言质朴而感情真挚。","tags":["思乡","抒怀","边塞"],"units":[{"t":"故园东望路漫漫，双袖龙钟泪不干。","tr":"向东遥望故乡，路途遥远漫长，两袖沾满泪水仍擦不干。","p":0,"r":1},{"t":"马上相逢无纸笔，凭君传语报平安。","tr":"在马上相遇没有纸笔，只能请你捎个口信，说我平安无事。","p":0,"r":1}],"notes":[{"u":0,"w":"故园","m":"故乡","t":"古今异义","d":["旧园子","荒废的庭园"]},{"u":0,"w":"漫漫","m":"形容路途遥远","t":"实词","d":["水势浩大","时间长久"]},{"u":0,"w":"龙钟","m":"沾湿的样子","t":"实词","d":["年老体衰的样子","行动迟缓的样子"]},{"u":1,"w":"凭","m":"托，请","t":"实词","d":["依靠","凭证"]},{"u":1,"w":"传语","m":"捎口信","t":"实词","d":["传话给后人","转述他人的话"]}],"tricky":["袖","龙钟","凭"],"keyLines":[{"u":0,"hint":"《逢入京使》中以泪水不干表现思乡之深的句子是："},{"u":1,"hint":"写诗人托入京使者捎口信报平安的两句是："},{"u":0,"hint":"写诗人东望故乡、路途遥远的句子是："}],"appr":[{"q":"“双袖龙钟泪不干”运用了什么手法？","a":"运用夸张，写泪水多得擦不干，把诗人对家乡亲人的思念之深表现得真切动人。"},{"q":"这首诗的情感有何特点？","a":"诗人既思念亲人，又要为国戍边；全诗不加雕饰，在一次偶然相遇的小场景中写出思乡之情与豪迈之气。"}]},{"id":"g7b-p05","volume":"g7b","title":"晚春","author":"韩愈","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"这是韩愈写暮春景色的小诗，写花草树木在春将归去时竞相开放的情景。","theme":"描绘晚春花草争奇斗艳、杨花榆荚漫天飞舞的景象，表现对春天的珍惜与留恋。","tags":["写景","惜春"],"units":[{"t":"草树知春不久归，百般红紫斗芳菲。","tr":"花草树木知道春天不久就要归去，于是用各种红花紫花争相开放，竞相吐芳。","p":0,"r":1},{"t":"杨花榆荚无才思，惟解漫天作雪飞。","tr":"杨花和榆钱没有艳丽的色彩，只知道漫天飞舞，像雪花一样。","p":0,"r":1}],"notes":[{"u":0,"w":"草树","m":"花草树木","t":"实词","d":["草木丛林","草和树的名称"]},{"u":0,"w":"芳菲","m":"花草盛开，香气浓郁","t":"实词","d":["春天的景致","美好的名声"]},{"u":0,"w":"斗","m":"争奇斗艳","t":"实词","d":["战斗","北斗"]},{"u":1,"w":"榆荚","m":"榆树的种子，俗称榆钱","t":"实词","d":["榆树的叶子","榆树的花"]},{"u":1,"w":"才思","m":"才华和情思","t":"实词","d":["思想感情","才能与智慧"]},{"u":1,"w":"惟解","m":"只知道","t":"实词","d":["只能理解","唯独解开"]}],"tricky":["斗","芳菲","荚"],"keyLines":[{"u":0,"hint":"写百花在春将归去时竞相争艳的句子是："},{"u":1,"hint":"《晚春》中，写杨花榆荚缺乏才思、只会化作漫天飞雪的两句是："},{"u":1,"hint":"《晚春》中以雪比喻柳絮飞舞的句子是："}],"appr":[{"q":"“杨花榆荚无才思，惟解漫天作雪飞”运用了什么手法？","a":"运用拟人，把杨花榆荚写成虽无才思却也努力“作雪飞”，赋予草木人的情态，写出晚春的生机与热闹，构思新奇。"},{"q":"这首诗表达了怎样的感情？","a":"诗人通过草木争春的描写，表达了对春天将逝的珍惜与不舍，也有积极向上的情怀。"}]},{"id":"g7b-p06","volume":"g7b","title":"登幽州台歌","author":"陈子昂","dynasty":"唐","genre":"古体诗（杂言）","kind":"poem","intro":"陈子昂随军北征，登幽州台怀古，因政治抱负难以实现而写下此诗。","theme":"抒发怀才不遇、孤独苦闷的悲慨，以及对宇宙人生的感叹。","tags":["抒怀","怀古","怀才不遇"],"units":[{"t":"前不见古人，后不见来者。","tr":"向前看不见古代的贤君，向后看也看不见未来的明主。","p":0,"r":1},{"t":"念天地之悠悠，独怆然而涕下！","tr":"想到天地的无穷无尽，我独自悲伤，不禁流下眼泪！","p":0,"r":1}],"notes":[{"u":0,"w":"古人","m":"古代礼贤下士的圣君","t":"古今异义","d":["已故的人","古代人物"]},{"u":0,"w":"来者","m":"后世的贤明君主","t":"实词","d":["来到的人","未来的客人"]},{"u":1,"w":"悠悠","m":"无穷无尽","t":"实词","d":["悠闲自在","遥远"]},{"u":1,"w":"怆然","m":"悲伤的样子","t":"实词","d":["惊恐的样子","凄凉清冷"]},{"u":1,"w":"涕","m":"眼泪","t":"古今异义","d":["鼻涕","唾液"]}],"tricky":["悠","怆","涕"],"keyLines":[{"u":0,"hint":"《登幽州台歌》中表现诗人怀才不遇、时间无尽的两句是："},{"u":1,"hint":"写诗人面对天地悠远而孤独悲伤的两句是："},{"u":1,"hint":"最终落脚到诗人流泪悲怆，抒发孤独苦闷的句子是："}],"appr":[{"q":"前两句写出了怎样的时空感受？","a":"“前不见古人，后不见来者”以时间之无限，反衬个人的渺小与孤独，写出知音难觅、生不逢时的感叹。"},{"q":"全诗的结构与情感是怎样的？","a":"前两句写时间之长，后两句写空间之阔，在无限时空的背景下，突出诗人孤独悲怆的形象，情感苍凉悲壮。"}]},{"id":"g7b-p07","volume":"g7b","title":"望岳","author":"杜甫","dynasty":"唐","genre":"五言古诗","kind":"poem","intro":"开元年间，青年杜甫漫游齐赵，来到泰山脚下，望山而作此诗，是他现存最早的诗作之一。","theme":"描绘泰山雄伟高大的气势，抒发诗人不畏艰难、勇攀高峰的雄心壮志。","tags":["写景","抒怀","言志"],"units":[{"t":"岱宗夫如何？齐鲁青未了。","tr":"泰山到底怎么样？青翠的山色横跨齐鲁，连绵不尽。","p":0,"r":1},{"t":"造化钟神秀，阴阳割昏晓。","tr":"大自然把神奇秀丽的景色全聚集在这里，山的南北一明一暗，仿佛被分割成黄昏与早晨。","p":0,"r":1},{"t":"荡胸生曾云，决眦入归鸟。","tr":"层层升起的云气使心胸震荡，睁大眼睛远望归巢的鸟儿隐入山林。","p":0,"r":1},{"t":"会当凌绝顶，一览众山小。","tr":"一定要登上泰山的最高峰，俯视众山，它们都显得那么渺小。","p":0,"r":1}],"notes":[{"u":0,"w":"岱宗","m":"泰山，五岳之首，又称岱山","t":"实词","d":["山东的一座古城","泰山的山神"]},{"u":0,"w":"齐鲁","m":"春秋时的齐国和鲁国，在泰山南北","t":"实词","d":["泰山东西两侧","山东一带的方言"]},{"u":1,"w":"钟","m":"聚集","t":"实词","d":["敲钟","钟表"]},{"u":1,"w":"割","m":"划分","t":"实词","d":["切割","收割"]},{"u":2,"w":"曾","m":"同“层”，重叠","t":"通假","d":["曾经","竟然"]},{"u":2,"w":"决眦","m":"张大眼睛，眼角几乎要裂开","t":"实词","d":["擦拭眼角","眯起眼睛"]},{"u":3,"w":"会当","m":"一定要","t":"实词","d":["应当会","正好遇到"]},{"u":3,"w":"凌","m":"登上","t":"实词","d":["欺侮","冰凌"]}],"tricky":["岱","钟","眦","凌"],"keyLines":[{"u":3,"hint":"《望岳》中表现诗人攀登泰山、俯视群山的雄心壮志的两句是："},{"u":0,"hint":"写泰山山色青翠、绵延齐鲁两地的句子是："},{"u":1,"hint":"写泰山阴阳两面昏晓不同、大自然钟情神秀的两句是："},{"u":2,"hint":"写诗人望见层云生起、归鸟入林的两句是："}],"appr":[{"q":"“阴阳割昏晓”用了什么手法？","a":"用“割”字使山势有了刀削斧劈般的力量，突出泰山高大，山南阳光明亮，山北幽暗，对比鲜明，富有立体感。"},{"q":"“会当凌绝顶，一览众山小”表达了什么？","a":"由望山而生登山之想，表现诗人不怕困难、勇于攀登的进取精神和远大抱负，富有哲理意味。"}]},{"id":"g7b-p08","volume":"g7b","title":"登飞来峰","author":"王安石","dynasty":"北宋","genre":"七言绝句","kind":"poem","intro":"王安石三十岁左右任浙江鄞县知县，归途中登上杭州飞来峰，写下此诗，表现他对变法前景的信心。","theme":"通过登高望远，抒发不畏浮云遮眼、站得高看得远的豪迈情怀和政治抱负。","tags":["说理","抒怀","登临"],"units":[{"t":"飞来山上千寻塔，闻说鸡鸣见日升。","tr":"飞来峰上耸立着高高的塔，听说鸡叫时分就能看见太阳升起。","p":0,"r":1},{"t":"不畏浮云遮望眼，自缘身在最高层。","tr":"不怕浮云遮住我远望的视线，因为我正站在最高处。","p":0,"r":1}],"notes":[{"u":0,"w":"千寻","m":"极言其高，古代八尺为一寻","t":"实词","d":["千里远","千年久"]},{"u":0,"w":"闻说","m":"听说","t":"实词","d":["闻到","传闻"]},{"u":1,"w":"畏","m":"害怕","t":"实词","d":["尊敬","敬佩"]},{"u":1,"w":"缘","m":"因为","t":"实词","d":["沿着","缘分"]},{"u":1,"w":"望眼","m":"视线","t":"实词","d":["望远镜","眼睛的疾病"]}],"tricky":["寻","缘","遮"],"keyLines":[{"u":1,"hint":"《登飞来峰》中表现诗人高瞻远瞩、不惧艰难险阻的两句是："},{"u":0,"hint":"写飞来峰塔高、鸡鸣可见日出的两句是："},{"u":1,"hint":"写站得高才能望得远这一哲理的句子是："}],"appr":[{"q":"“不畏浮云遮望眼”有什么含意？","a":"“浮云”比喻阻碍前进的邪恶势力与困难，句子表明诗人不怕阻碍、胸怀坦荡、对前途充满信心。"},{"q":"这首诗体现了怎样的哲理？","a":"诗人由登高而远望，说明只有站得高才能看得远，不被表象蒙蔽，寓意做人要高瞻远瞩、不畏艰难。"}]},{"id":"g7b-p09","volume":"g7b","title":"游山西村","author":"陆游","dynasty":"南宋","genre":"七言律诗","kind":"poem","intro":"陆游被罢官后闲居家乡山阴，春日游览附近的山西村，写下这首诗，描绘农村风光和淳朴民风。","theme":"写山村的自然风光与淳朴民风，表达诗人对农村生活的热爱和对乡亲的亲切之情。","tags":["写景","记游","哲理"],"units":[{"t":"莫笑农家腊酒浑，丰年留客足鸡豚。","tr":"不要笑农家腊月酿的酒浑浊，丰收年景招待客人饭菜十分丰盛。","p":0,"r":1},{"t":"山重水复疑无路，柳暗花明又一村。","tr":"山峦重叠、河水曲折，正疑惑没有路可走，忽然柳绿花红，眼前又出现一个村庄。","p":0,"r":1},{"t":"箫鼓追随春社近，衣冠简朴古风存。","tr":"吹箫击鼓的声音预示着春社临近，乡亲们衣着简朴，保留着古代的淳朴风气。","p":0,"r":1},{"t":"从今若许闲乘月，拄杖无时夜叩门。","tr":"今后如果允许我闲暇时趁着月色出游，我就拄着拐杖随时来敲你们家的门。","p":0,"r":1}],"notes":[{"u":0,"w":"腊酒","m":"腊月里酿造的酒","t":"实词","d":["腊肉酒","蜡烛下的酒"]},{"u":0,"w":"足鸡豚","m":"备有丰盛的肉食，足，足够","t":"实词","d":["脚边的鸡和猪","需要鸡和猪"]},{"u":1,"w":"山重水复","m":"山峦重叠，水流曲折","t":"实词","d":["山水秀丽","山水相隔遥远"]},{"u":1,"w":"疑","m":"怀疑","t":"古今异义","d":["疑难","担心"]},{"u":1,"w":"柳暗花明","m":"柳色浓绿，花色明艳","t":"实词","d":["柳树昏暗花朵明亮","天色渐暗"]},{"u":2,"w":"春社","m":"古代春耕前祭祀土神的日子","t":"实词","d":["春季的集会","春天的社团"]},{"u":2,"w":"古风","m":"淳朴的古代风气","t":"古今异义","d":["古代诗歌","古老的风尚"]},{"u":3,"w":"叩","m":"敲","t":"实词","d":["磕头","询问"]}],"tricky":["腊","豚","箫","叩"],"keyLines":[{"u":1,"hint":"《游山西村》中蕴含“困境中出现转机”哲理的两句是："},{"u":0,"hint":"写农家以丰盛饭菜热情待客的两句是："},{"u":2,"hint":"写山村春社将近、民风淳朴的两句是："},{"u":3,"hint":"表达诗人对乡村生活的喜爱，愿再来夜访的两句是："}],"appr":[{"q":"“山重水复疑无路，柳暗花明又一村”有何含义？","a":"字面写山水曲折后豁然开朗的景象，也蕴含哲理：在困境中坚持前行，往往会出现新的转机，充满希望。"},{"q":"这首诗反映了怎样的农村风貌？","a":"诗人从农家的丰盛待客、春社的箫鼓、简朴的衣冠，写出了农村丰收、热闹、淳朴的生活，表达了对农村生活的热爱。"}]},{"id":"g7b-p10","volume":"g7b","title":"己亥杂诗（其五）","author":"龚自珍","dynasty":"清","genre":"七言绝句","kind":"poem","intro":"道光十九年龚自珍辞官离京南归，途中写下三百余首《己亥杂诗》，这是其中的第五首。","theme":"借落花喻自己，表明虽辞官离京，仍愿为国家和后人继续奉献的情怀。","tags":["抒怀","哲理","咏物"],"units":[{"t":"浩荡离愁白日斜，吟鞭东指即天涯。","tr":"离别的愁绪浩浩荡荡，夕阳向西斜落，我扬鞭向东，仿佛就走到了天边。","p":0,"r":1},{"t":"落红不是无情物，化作春泥更护花。","tr":"落下的花瓣不是无情的东西，它化作春天的泥土，还能培育新的花朵。","p":0,"r":1}],"notes":[{"u":0,"w":"浩荡","m":"广阔无边，形容愁绪深广","t":"实词","d":["水势壮大","行进的气势"]},{"u":0,"w":"白日斜","m":"夕阳西下","t":"实词","d":["白天过去","太阳高照"]},{"u":0,"w":"吟鞭","m":"诗人的马鞭，边走边吟诗","t":"实词","d":["吟诵的长鞭","鞭打声"]},{"u":0,"w":"天涯","m":"天边，极远的地方","t":"实词","d":["故乡","天空的边界"]},{"u":1,"w":"落红","m":"落花","t":"实词","d":["红色的叶子","红色的夕阳"]},{"u":1,"w":"护花","m":"培育、保护花木","t":"实词","d":["保护花朵不被摘取","欣赏花"]}],"tricky":["浩","荡","吟","涯","泥"],"keyLines":[{"u":1,"hint":"《己亥杂诗》（其五）中，诗人以落花自喻、表明愿继续为国效力的两句是："},{"u":0,"hint":"《己亥杂诗》（其五）中，写离别时愁绪深广、夕阳西斜的句子是："},{"u":1,"hint":"《己亥杂诗》（其五）中，赞美无私奉献精神的诗句是："}],"appr":[{"q":"“落红不是无情物，化作春泥更护花”表达了怎样的思想感情？","a":"诗人以落花自比，说明自己虽离开官场，仍不忘国家和后辈，愿像落花化作春泥那样继续奉献，表现了乐观执着、无私奉献的精神。"},{"q":"前两句中景物描写有什么作用？","a":"“白日斜”“天涯”写出夕阳西下、前路遥远的景象，烘托出离京时愁绪浩荡、感慨万千的心情，又与后两句形成转折，使乐观的志向更显突出。"}]},{"id":"g7b-p11","volume":"g7b","title":"泊秦淮","author":"杜牧","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"杜牧夜泊秦淮河，听到酒家歌女唱着亡国之音《玉树后庭花》，有感而发，写下此诗。","theme":"借秦淮夜景和歌女唱亡国曲，讽刺晚唐权贵醉生梦死，抒发对国家命运的忧虑。","tags":["咏史","讽刺","忧国"],"units":[{"t":"烟笼寒水月笼沙，夜泊秦淮近酒家。","tr":"烟雾笼罩着清冷的河水，月光笼罩着沙滩，夜里我把船停在秦淮河边靠近酒家的地方。","p":0,"r":1},{"t":"商女不知亡国恨，隔江犹唱《后庭花》。","tr":"卖唱的歌女不懂亡国的悲恨，隔着江水还在唱着《玉树后庭花》。","p":0,"r":1}],"notes":[{"u":0,"w":"笼","m":"笼罩","t":"实词","d":["关鸟的笼子","装进笼中"]},{"u":0,"w":"泊","m":"停船靠岸","t":"实词","d":["漂泊","淡泊"]},{"u":0,"w":"秦淮","m":"秦淮河，在今江苏南京","t":"实词","d":["秦朝的淮河","淮河的支流"]},{"u":1,"w":"商女","m":"卖唱的歌女","t":"实词","d":["商人的女儿","经商的女子"]},{"u":1,"w":"后庭花","m":"《玉树后庭花》，陈后主所作乐曲，被视为亡国之音","t":"实词","d":["庭院里的花","后院的花朵"]},{"u":1,"w":"犹","m":"还，仍然","t":"实词","d":["好像","如同"]}],"tricky":["笼","泊","淮","商"],"keyLines":[{"u":0,"hint":"《泊秦淮》中，描写秦淮夜景、烟月交融的句子是："},{"u":1,"hint":"《泊秦淮》中，讽刺歌女不知亡国之恨而醉生梦死的句子是："},{"u":0,"hint":"《泊秦淮》中，点明夜泊地点与环境的句子是："}],"appr":[{"q":"“烟笼寒水月笼沙”有什么表达效果？","a":"运用互文手法，“烟”“月”同时笼罩“水”“沙”，描绘出朦胧清冷的夜景，为全诗定下凄清冷寂的基调，也暗含诗人内心的忧郁。"},{"q":"“商女不知亡国恨，隔江犹唱后庭花”讽刺的对象是谁？","a":"表面写商女不知亡国之恨，实则讽刺沉迷享乐、点唱亡国之音的权贵，借陈后主亡国的历史，警示晚唐统治者，表达诗人对国势危亡的忧虑。"}]},{"id":"g7b-p12","volume":"g7b","title":"贾生","author":"李商隐","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"李商隐借汉文帝召见贾谊的史事，写出对君王不重人才、不问民生的讽刺，兼有怀才不遇的感慨。","theme":"借汉文帝召见贾谊却不问政事、只问鬼神的史实，讽刺君王不重贤才、不恤民生。","tags":["咏史","讽刺","抒怀"],"units":[{"t":"宣室求贤访逐臣，贾生才调更无伦。","tr":"汉文帝在宣室求访被贬的贤臣，贾谊的才华气度无人能比。","p":0,"r":1},{"t":"可怜夜半虚前席，不问苍生问鬼神。","tr":"可惜深夜里文帝空自向前挪动坐席，所问的却不是百姓的疾苦，而是鬼神的事。","p":0,"r":1}],"notes":[{"u":0,"w":"宣室","m":"汉代未央宫前殿的正室","t":"实词","d":["宣布的地方","宣传的大厅"]},{"u":0,"w":"逐臣","m":"被贬谪的大臣，指贾谊","t":"实词","d":["追逐的大臣","驱逐外敌的大臣"]},{"u":0,"w":"才调","m":"才华和气度","t":"实词","d":["调动人才","才艺的格调"]},{"u":0,"w":"无伦","m":"无人能比","t":"实词","d":["没有伦理","不守规矩"]},{"u":1,"w":"虚前席","m":"白白地把座席向前移，指文帝听得入神","t":"实词","d":["前排座位空着","虚伪地向前"]},{"u":1,"w":"苍生","m":"百姓","t":"实词","d":["青色的草木","年老的人"]}],"tricky":["贾","逐","伦","虚","苍"],"keyLines":[{"u":0,"hint":"《贾生》中，写汉文帝求访被贬贤臣、贾谊才华出众的两句是："},{"u":1,"hint":"《贾生》中，直接讽刺君王不关心百姓疾苦的句子是："},{"u":1,"hint":"《贾生》中，写文帝夜里听得入神却问错了问题的句子是："}],"appr":[{"q":"“可怜夜半虚前席，不问苍生问鬼神”运用了什么手法？","a":"运用对比，把“虚前席”的郑重求教与“问鬼神”的荒唐内容对照，并用“可怜”点出讽刺意味，揭示君王并不真正重视人才、关心民生。"},{"q":"这首诗表达了诗人怎样的感情？","a":"诗人表面写汉文帝，实则借古讽今，批评晚唐统治者沉迷神仙而不顾百姓，同时也暗含自己怀才不遇、报国无门的愤懑。"}]},{"id":"g7b-p13","volume":"g7b","title":"过松源晨炊漆公店（其五）","author":"杨万里","dynasty":"南宋","genre":"七言绝句","kind":"poem","intro":"杨万里途经松源，清晨在漆公店做饭，翻山越岭时有感，借行路写出人生哲理。","theme":"借山路难行的体验，说明前进路上困难接连不断，不能被暂时的顺利迷惑。","tags":["哲理","写景","说理"],"units":[{"t":"莫言下岭便无难，赚得行人错喜欢。","tr":"不要说下了山岭就没有困难了，这话骗得行路的人白白欢喜一场。","p":0,"r":1},{"t":"正入万山围子里，一山放出一山拦。","tr":"刚一走进群山围成的圈子里，一座山刚放我过去，另一座山又把我拦住。","p":0,"r":1}],"notes":[{"u":0,"w":"莫言","m":"不要说","t":"实词","d":["默默不说","没有言语"]},{"u":0,"w":"下岭","m":"下山","t":"实词","d":["下降的山岭","山岭下面"]},{"u":0,"w":"赚","m":"骗","t":"实词","d":["挣钱","获得"]},{"u":0,"w":"行人","m":"赶路的人","t":"实词","d":["行走的路人","走路的人群"]},{"u":1,"w":"万山围子","m":"群山环绕的圈子","t":"实词","d":["万座山峰的村子","大山里的孩子"]},{"u":1,"w":"放","m":"放行，让过","t":"实词","d":["放置","释放犯人"]}],"tricky":["赚","岭","拦","围"],"keyLines":[{"u":0,"hint":"《过松源晨炊漆公店》中，诗人提醒行人不要被下岭的轻松所迷惑的句子是："},{"u":1,"hint":"《过松源晨炊漆公店》中，用拟人手法写重重山岭接连阻拦行人的句子是："},{"u":1,"hint":"《过松源晨炊漆公店》中，写诗人进入重重山峦之中的句子是："}],"appr":[{"q":"“一山放出一山拦”运用了什么手法？有何作用？","a":"运用拟人手法，把山写成有意放行又拦截的人，生动写出山路重重、困难不断的情形，也说明前进道路上障碍接连出现。"},{"q":"这首诗说明了什么道理？","a":"借下山后又入群山的行路体验，说明做事不能被暂时的顺利迷惑，对前进路上的困难要有充分准备，坚持不懈才能到达目的地。"}]},{"id":"g7b-p14","volume":"g7b","title":"约客","author":"赵师秀","dynasty":"南宋","genre":"七言绝句","kind":"poem","intro":"赵师秀与友人约定夜间对弈，雨夜里久等客人不来，诗人写下这首小诗。","theme":"通过梅雨时节夜晚等客不来的情景，表现诗人的闲适中的孤寂与淡淡的无聊。","tags":["写景","抒情","叙事"],"units":[{"t":"黄梅时节家家雨，青草池塘处处蛙。","tr":"梅子黄熟的时节，家家户户都笼罩在雨中，长满青草的池塘边处处传来蛙声。","p":0,"r":1},{"t":"有约不来过夜半，闲敲棋子落灯花。","tr":"约好的客人没有来，夜已过半，我无聊地轻轻敲着棋子，震落了灯芯上的灯花。","p":0,"r":1}],"notes":[{"u":0,"w":"黄梅时节","m":"梅子成熟的季节，初夏梅雨时","t":"实词","d":["黄色梅花开放的时候","黄昏时节"]},{"u":0,"w":"家家","m":"每家每户","t":"实词","d":["家庭","亲戚"]},{"u":1,"w":"有约","m":"有约定（的客人）","t":"实词","d":["有约束","有预约的车"]},{"u":1,"w":"过夜半","m":"超过半夜","t":"实词","d":["度过夜晚","夜里过半"]},{"u":1,"w":"闲敲","m":"无聊地轻轻敲打","t":"实词","d":["悠闲地敲门","随意地敲鼓"]},{"u":1,"w":"灯花","m":"灯芯燃烧时结成的花状物","t":"实词","d":["灯上的花纹","花灯"]}],"tricky":["梅","蛙","棋","灯"],"keyLines":[{"u":0,"hint":"《约客》中，描写梅雨季节雨水绵绵、蛙声阵阵的两句是："},{"u":1,"hint":"《约客》中，写诗人等客不来、无聊敲棋的句子是："},{"u":1,"hint":"《约客》中，点明友人失约、夜已深的句子是："}],"appr":[{"q":"《约客》前两句描写了怎样的景物？有什么作用？","a":"写梅雨时节家家下雨、池塘蛙声处处，景物富有江南初夏的特色，同时以蛙声的热闹反衬夜晚的寂静，渲染出等人时的孤寂氛围。"},{"q":"“闲敲棋子落灯花”表现了诗人怎样的心境？","a":"“闲敲”写出诗人等待已久的无聊，“落灯花”写出夜深人静，细微的动作含蓄表现他等客不至的失落和淡淡的孤寂，不写怨而怨自在其中。"}]},{"id":"g7b-w01","volume":"g7b","title":"孙权劝学","author":"司马光","dynasty":"北宋","genre":"史传（编年体）","kind":"prose","intro":"选自《资治通鉴·汉纪》，由司马光依据史料整理而成，记叙吕蒙在孙权劝说下发奋读书、学识大进，连鲁肃也为之惊叹的故事。","theme":"说明读书学习的重要性，赞扬吕蒙勤学上进，也肯定孙权善于劝导。","tags":["叙事","劝学","人物"],"units":[{"t":"初，权谓吕蒙曰：“卿今当涂掌事，不可不学！”","tr":"当初，孙权对吕蒙说：“你现在身当要职，掌管政事，不可以不学习！”","p":0,"r":1},{"t":"蒙辞以军中多务。","tr":"吕蒙以军中事务繁多为由推辞。","p":0,"r":1},{"t":"权曰：“孤岂欲卿治经为博士邪！","tr":"孙权说：“我难道是要你去研究儒家经典、当经学博士吗？","p":0,"r":1},{"t":"但当涉猎，见往事耳。","tr":"只是让你粗略地浏览，了解以往的历史罢了。","p":0,"r":1},{"t":"卿言多务，孰若孤？","tr":"你说事务繁多，哪里比得上我（事务多）呢？","p":0,"r":1},{"t":"孤常读书，自以为大有所益。”","tr":"我常常读书，自己觉得收获很大。”","p":0,"r":1},{"t":"蒙乃始就学。","tr":"吕蒙于是开始学习。","p":0,"r":1},{"t":"及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”","tr":"到了鲁肃路过寻阳时，和吕蒙谈论议事，（鲁肃）十分惊讶地说：“你现在的才干谋略，已不再是当年吴县时的那个阿蒙了！”","p":0,"r":1},{"t":"蒙曰：“士别三日，即更刮目相待，大兄何见事之晚乎！”","tr":"吕蒙说：“读书人分别几天，就应当另眼相看，老兄你怎么看出这一点这么晚呢！”","p":0,"r":1},{"t":"肃遂拜蒙母，结友而别。","tr":"鲁肃于是拜见了吕蒙的母亲，与吕蒙结为朋友后告别。","p":0,"r":1}],"notes":[{"u":0,"w":"当涂","m":"当道，掌握要职","t":"古今异义","d":["在路上","涂抹泥土"]},{"u":0,"w":"卿","m":"你（君对臣的称呼）","t":"实词","d":["官名","爱卿的亲昵称呼（表示亲属）"]},{"u":0,"w":"谓","m":"对……说，告诉","t":"实词","d":["认为","称作"]},{"u":1,"w":"辞","m":"推托","t":"实词","d":["告别","文辞"]},{"u":2,"w":"孤","m":"古代王侯的自称","t":"实词","d":["孤单","孤儿"]},{"u":2,"w":"治经","m":"研究儒家经典","t":"实词","d":["治理国家","医治疾病"]},{"u":2,"w":"博士","m":"古代掌管经学传授的官职","t":"古今异义","d":["学位的最高等级","学识渊博的人"]},{"u":3,"w":"但","m":"只，不过","t":"古今异义","d":["但是（转折）","一定"]},{"u":3,"w":"涉猎","m":"粗略地阅读","t":"古今异义","d":["到野外打猎","广泛参与活动"]},{"u":3,"w":"见","m":"了解（通“现”不作此解）","t":"实词","d":["看见","拜见"]},{"u":4,"w":"孰若","m":"哪里比得上，与……相比怎么样","t":"特殊句式","d":[]},{"u":5,"w":"自以为","m":"自己认为","t":"实词","d":["把自己当作","自己以……为凭据"]},{"u":6,"w":"乃","m":"于是，就","t":"虚词","d":["竟然","才"]},{"u":6,"w":"就学","m":"开始学习","t":"实词","d":["就近上学","去学校"]},{"u":7,"w":"及","m":"到了……的时候","t":"虚词","d":["和，同","赶上，来得及"]},{"u":7,"w":"过","m":"经过","t":"实词","d":["过错","超过"]},{"u":7,"w":"才略","m":"才干和谋略","t":"实词","d":["才能不足","略微有才"]},{"u":7,"w":"非复","m":"不再是","t":"实词","d":["不是重复","并非又一次"]},{"u":8,"w":"刮目","m":"擦拭眼睛，指用新的眼光","t":"实词","d":["刮掉眼皮","瞪大眼睛"]},{"u":8,"w":"见事","m":"认清事物，看出事情","t":"实词","d":["遇事","会见事主"]},{"u":9,"w":"结友","m":"结为朋友","t":"词类活用","d":[]},{"u":9,"w":"拜","m":"拜见，拜访","t":"实词","d":["跪拜行礼","任命官职"]}],"tricky":["涂","涉猎","刮目","寻阳"],"keyLines":[{"u":5,"hint":"孙权劝吕蒙学习时，以自己为例，说明读书对自己大有益处的句子是："},{"u":8,"hint":"吕蒙回答鲁肃，说明人在短时间内可以有很大进步、应以新眼光看待的名句是："},{"u":7,"hint":"鲁肃见吕蒙才略大增，惊叹其变化巨大的句子是："},{"u":3,"hint":"孙权说明自己并非要吕蒙钻研经典，只要他粗略阅读了解历史的句子是："}],"appr":[{"q":"孙权是怎样劝说吕蒙学习的？表现了他怎样的特点？","a":"孙权先以“不可不学”点明要求，再针对吕蒙的借口，说明只需涉猎、不必当博士，又以自己忙而读书为例作比较。劝说层层有据、语气诚恳，表现他善于说服、关心部下、以身作则。"},{"q":"本文是怎样写出吕蒙的变化的？","a":"文章采用侧面描写：不直接写吕蒙学了什么，而通过鲁肃“大惊”的语言和吕蒙“士别三日”的回答，对比他前后的才略，写出他学有所成、自信机敏。"}]},{"id":"g7b-w02","volume":"g7b","title":"卖油翁","author":"欧阳修","dynasty":"北宋","genre":"笔记小说（寓言故事）","kind":"prose","intro":"选自《归田录》，写善射的陈尧咨与卖油老翁之间的一场对话与表演，借酌油的绝技说明熟能生巧的道理。","theme":"通过卖油翁酌油的故事，说明任何技能都是在反复练习中熟练的，不可自矜自傲。","tags":["叙事","说理","寓言"],"units":[{"t":"陈康肃公尧咨善射，当世无双，公亦以此自矜。","tr":"康肃公陈尧咨擅长射箭，当时没有第二个人能和他相比，他也凭这一本领自夸。","p":0,"r":1},{"t":"尝射于家圃，有卖油翁释担而立，睨之，久而不去。","tr":"他曾经在家里的园圃中射箭，有个卖油的老翁放下担子站在一旁，斜着眼看他，很久都不离开。","p":0,"r":1},{"t":"见其发矢十中八九，但微颔之。","tr":"老翁看见他射出十支箭能中八九支，只是微微点点头。","p":0,"r":1},{"t":"康肃问曰：“汝亦知射乎？吾射不亦精乎？”","tr":"陈尧咨问道：“你也懂得射箭吗？我射得不是很精妙吗？”","p":1,"r":1},{"t":"翁曰：“无他，但手熟尔。”","tr":"老翁说：“没有别的奥妙，不过是手熟罢了。”","p":1,"r":1},{"t":"康肃忿然曰：“尔安敢轻吾射！”","tr":"陈尧咨气愤地说：“你怎么敢轻视我的射箭本领！”","p":1,"r":1},{"t":"翁曰：“以我酌油知之。”","tr":"老翁说：“凭我倒油的经验就知道这个道理。”","p":1,"r":1},{"t":"乃取一葫芦置之地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。","tr":"于是取出一个葫芦放在地上，用铜钱盖住葫芦口，慢慢用勺子舀油往里倒，油从钱孔中流进去，而铜钱却没有沾湿。","p":1,"r":1},{"t":"因曰：“我亦无他，惟手熟尔。”","tr":"（老翁）接着说：“我也没有别的奥妙，只不过手熟罢了。”","p":1,"r":1},{"t":"康肃笑而遣之。","tr":"陈尧咨笑着打发他走了。","p":1,"r":1}],"notes":[{"u":0,"w":"善","m":"擅长，善于","t":"实词","d":["善良","友好"]},{"u":0,"w":"当世无双","m":"当时没有第二个人能比得上","t":"实词","d":["世上没有成双的","当代无人结婚"]},{"u":0,"w":"以此自矜","m":"凭这一本领自夸","t":"特殊句式","d":[]},{"u":0,"w":"矜","m":"自夸，自负","t":"实词","d":["怜悯","严肃庄重"]},{"u":1,"w":"尝","m":"曾经","t":"实词","d":["品尝","尝试"]},{"u":1,"w":"圃","m":"园子","t":"实词","d":["菜地以外的农田","养花的盆"]},{"u":1,"w":"释担","m":"放下担子","t":"实词","d":["解除负担","解释担忧"]},{"u":1,"w":"睨","m":"斜着眼看","t":"实词","d":["瞪眼","仔细察看"]},{"u":1,"w":"去","m":"离开","t":"古今异义","d":["前往","除掉"]},{"u":2,"w":"发矢","m":"射箭","t":"实词","d":["发誓","出发"]},{"u":2,"w":"但","m":"只，仅","t":"古今异义","d":["但是","尽管"]},{"u":2,"w":"颔","m":"点头","t":"实词","d":["下巴","低头"]},{"u":3,"w":"汝","m":"你","t":"实词","d":["你们","他"]},{"u":3,"w":"精","m":"精妙，精湛","t":"实词","d":["精神","精确"]},{"u":4,"w":"尔","m":"同“耳”，罢了","t":"通假","d":["你","那样"]},{"u":5,"w":"忿然","m":"气愤的样子","t":"实词","d":["高兴的样子","惊讶的样子"]},{"u":5,"w":"安","m":"怎么","t":"虚词","d":["安全","安稳"]},{"u":5,"w":"轻","m":"轻视","t":"词类活用","d":[]},{"u":6,"w":"酌油","m":"倒油，舀油","t":"实词","d":["喝酒","斟酌油价"]},{"u":7,"w":"覆","m":"盖在上面","t":"实词","d":["翻倒","覆盖全部"]},{"u":7,"w":"徐","m":"慢慢地","t":"实词","d":["姓氏","缓缓走"]},{"u":7,"w":"杓","m":"同“勺”，勺子","t":"通假","d":["北斗星的柄","木桶"]},{"u":7,"w":"沥","m":"（向下）注入，滴","t":"实词","d":["过滤","沥青"]},{"u":8,"w":"惟","m":"只，不过","t":"实词","d":["思考","因为"]},{"u":9,"w":"遣","m":"打发，送走","t":"实词","d":["派遣","责备"]}],"tricky":["矜","睨","颔","杓","沥"],"keyLines":[{"u":0,"hint":"文中交代陈尧咨射术高超、世无敌手的句子是："},{"u":2,"hint":"写卖油翁看到陈尧咨射箭，只是微微点头、不以为然的句子是："},{"u":4,"hint":"卖油翁解释自己不羡慕射技、只道出技能出自熟练的句子是："},{"u":7,"hint":"文中具体描写卖油翁酌油技艺高超的句子是："}],"appr":[{"q":"“自钱孔入，而钱不湿”在文中起什么作用？","a":"这是对卖油翁酌油技艺的具体展示，一钱一孔而油过钱不湿，说明他的功夫来自长期练习，也有力地支持了“无他，但手熟尔”的论断，使道理不言自明。"},{"q":"这个故事给了我们什么启示？","a":"无论射箭还是酌油，高超的技艺都是长期反复练习而熟练的结果，所谓熟能生巧；同时也提醒人们不要因一技之长而骄傲自满，要谦虚。"}]},{"id":"g7b-w03","volume":"g7b","title":"陋室铭","author":"刘禹锡","dynasty":"唐","genre":"铭（骈体）","kind":"prose","intro":"刘禹锡被贬和州后，遭到势利知县刁难，居室一再缩小，他便写下这篇短铭，借赞美陋室表明自己的志趣和节操。","theme":"借陋室不陋，表现作者安贫乐道、洁身自好、不慕荣利的高尚情操。","tags":["托物言志","说理","安贫乐道"],"units":[{"t":"山不在高，有仙则名。","tr":"山不在于高，有神仙居住就会出名。","p":0,"r":1},{"t":"水不在深，有龙则灵。","tr":"水不在于深，有龙潜藏就显得灵异。","p":0,"r":1},{"t":"斯是陋室，惟吾德馨。","tr":"这虽是一间简陋的屋子，只因我（住屋的人）品德高尚，就不觉得简陋了。","p":0,"r":1},{"t":"苔痕上阶绿，草色入帘青。","tr":"苔痕蔓延到台阶上，一片碧绿；草色映入竹帘，满室青葱。","p":0,"r":1},{"t":"谈笑有鸿儒，往来无白丁。","tr":"来这里谈笑的都是博学的人，往来的没有一个无学识的平民。","p":0,"r":1},{"t":"可以调素琴，阅金经。","tr":"可以弹奏不加装饰的琴，阅读佛经。","p":0,"r":1},{"t":"无丝竹之乱耳，无案牍之劳形。","tr":"没有嘈杂的音乐扰乱耳朵，没有官府的公文使身体劳累。","p":0,"r":1},{"t":"南阳诸葛庐，西蜀子云亭。","tr":"（这就如）南阳诸葛亮的草庐，西蜀扬子云的玄亭。","p":0,"r":1},{"t":"孔子云：何陋之有？","tr":"孔子说：“有什么简陋的呢？”","p":0,"r":1}],"notes":[{"u":0,"w":"名","m":"出名，有名","t":"词类活用","d":[]},{"u":1,"w":"灵","m":"灵异，神奇","t":"实词","d":["灵魂","灵巧"]},{"u":2,"w":"斯","m":"这","t":"实词","d":["这样地","斯文"]},{"u":2,"w":"陋室","m":"简陋的屋子","t":"实词","d":["小而狭窄的院子","破旧的学堂"]},{"u":2,"w":"惟","m":"只，只是","t":"虚词","d":["思考","因为"]},{"u":2,"w":"德馨","m":"品德高尚（馨，散布很远的香气）","t":"实词","d":["德行平凡","香气浓郁"]},{"u":3,"w":"上","m":"蔓延到","t":"词类活用","d":[]},{"u":3,"w":"入","m":"映入","t":"词类活用","d":[]},{"u":3,"w":"青","m":"青葱","t":"实词","d":["蓝色","年轻"]},{"u":4,"w":"鸿儒","m":"博学的人","t":"实词","d":["大官","有名的僧人"]},{"u":4,"w":"白丁","m":"平民，没有功名的人","t":"古今异义","d":["白发老人","穿白衣的人"]},{"u":4,"w":"往来","m":"交往","t":"实词","d":["去和回","来往行人"]},{"u":5,"w":"调素琴","m":"弹奏不加装饰的琴","t":"实词","d":["调试琴弦","调节琴音"]},{"u":5,"w":"金经","m":"指佛经","t":"实词","d":["金色的书","贵重的典籍"]},{"u":6,"w":"丝竹","m":"琴瑟、箫管等乐器，这里指音乐","t":"实词","d":["丝线与竹子","竹制器具"]},{"u":6,"w":"乱耳","m":"使耳朵被扰乱","t":"词类活用","d":[]},{"u":6,"w":"案牍","m":"官府的公文","t":"实词","d":["桌案","木牍书信"]},{"u":6,"w":"劳形","m":"使身体劳累","t":"词类活用","d":[]},{"u":7,"w":"南阳","m":"诸葛亮隐居躬耕之地（今湖北襄阳一带说法不一）","t":"实词","d":["诸葛亮的故乡山东","三国的都城"]},{"u":7,"w":"西蜀子云亭","m":"扬雄（字子云）在成都的故居","t":"实词","d":["刘备称帝处","诸葛亮的祭亭"]},{"u":8,"w":"何陋之有","m":"有什么简陋的呢（宾语前置）","t":"特殊句式","d":[]}],"tricky":["馨","鸿儒","案牍","丝竹","诸葛庐"],"keyLines":[{"u":2,"hint":"《陋室铭》中，点明全文主旨、表现居室主人品德高尚的句子是："},{"u":3,"hint":"描写陋室环境清幽、静谧优美的两句是："},{"u":4,"hint":"表现陋室中交往之人皆为博学之士的两句是："},{"u":6,"hint":"表明作者远离世俗喧扰与官场劳累的两句是："},{"u":8,"hint":"文章结尾引用孔子的话，点明全文中心的句子是："}],"appr":[{"q":"文章开头以山水起兴有什么作用？","a":"用山因仙而名、水因龙而灵作比，说明评价事物不在外在的高与深，而在内在的“仙”与“龙”，由此引出陋室因“德馨”而不陋的主旨，起兴自然，又富有说理意味。"},{"q":"“苔痕上阶绿，草色入帘青”用了什么手法？表达了什么？","a":"运用拟人，“上”“入”二字写出苔痕、草色蔓延映入的动态，使景物生动，描绘出环境清幽宁静；也含着作者对陋室的喜爱和安贫自得的心境。"}]},{"id":"g7b-w04","volume":"g7b","title":"爱莲说","author":"周敦颐","dynasty":"北宋","genre":"说（托物言志的杂文）","kind":"prose","intro":"周敦颐是北宋理学家。此文以莲自比，借赞美莲花的高洁，表明作者不慕富贵、洁身自好的品格追求。","theme":"通过对莲的形象与品质的描写，赞美君子高洁正直的品格，批评世人追逐富贵。","tags":["托物言志","说理","君子"],"units":[{"t":"水陆草木之花，可爱者甚蕃。","tr":"水里、陆地上各种草木的花，值得喜爱的非常多。","p":0,"r":1},{"t":"晋陶渊明独爱菊。","tr":"晋代的陶渊明唯独喜爱菊花。","p":0,"r":1},{"t":"自李唐来，世人甚爱牡丹。","tr":"从唐朝以来，世上的人们非常喜爱牡丹。","p":0,"r":1},{"t":"予独爱莲之出淤泥而不染，濯清涟而不妖，","tr":"我唯独喜爱莲花从污泥中长出却不被污染，经清水洗涤却不显得妖媚，","p":0,"r":1},{"t":"中通外直，不蔓不枝，香远益清，亭亭净植，","tr":"（茎）中间贯通，外形挺直，不生藤蔓，不长枝节，香气传得越远越清幽，笔直洁净地立在水中，","p":0,"r":1},{"t":"可远观而不可亵玩焉。","tr":"只能在远处观赏，而不能贴近去玩弄啊。","p":0,"r":1},{"t":"予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。","tr":"我认为：菊花是花中的隐士，牡丹是花中的富贵者，莲花是花中的君子。","p":1,"r":1},{"t":"噫！","tr":"唉！","p":1,"r":1},{"t":"菊之爱，陶后鲜有闻。","tr":"对菊花的喜爱，陶渊明以后很少听到了。","p":1,"r":1},{"t":"莲之爱，同予者何人？","tr":"对莲花的喜爱，和我相同的还有谁呢？","p":1,"r":1},{"t":"牡丹之爱，宜乎众矣！","tr":"对牡丹的喜爱，人当然就很多了！","p":1,"r":1}],"notes":[{"u":0,"w":"可爱者","m":"值得喜爱的","t":"古今异义","d":["讨人喜欢的","可怜的人"]},{"u":0,"w":"蕃","m":"多","t":"实词","d":["茂盛","外族"]},{"u":1,"w":"独","m":"唯独，只","t":"实词","d":["孤独","独立"]},{"u":2,"w":"自李唐来","m":"自从唐朝以来","t":"实词","d":["自从李姓人来","从李唐去"]},{"u":2,"w":"甚","m":"很，非常","t":"实词","d":["超过","什么"]},{"u":3,"w":"予","m":"我","t":"实词","d":["给予","你"]},{"u":3,"w":"之","m":"助词，取消句子独立性，不译","t":"虚词","d":["的","到"]},{"u":3,"w":"淤泥","m":"河湖池沼里积存的污泥","t":"实词","d":["沙土","田间的泥浆"]},{"u":3,"w":"染","m":"沾染（污秽）","t":"实词","d":["染色","传染"]},{"u":3,"w":"濯","m":"洗涤","t":"实词","d":["浇灌","光亮"]},{"u":3,"w":"清涟","m":"清澈的水波","t":"实词","d":["清凉的风","涟漪的花"]},{"u":3,"w":"妖","m":"妖媚，艳丽而不端庄","t":"实词","d":["妖怪","奇异"]},{"u":4,"w":"中通外直","m":"（茎）内空外直","t":"实词","d":["里面通外面直走","中间通畅，外表圆形"]},{"u":4,"w":"蔓","m":"生藤蔓","t":"词类活用","d":[]},{"u":4,"w":"枝","m":"长枝节","t":"词类活用","d":[]},{"u":4,"w":"益","m":"更加","t":"实词","d":["利益","增加"]},{"u":4,"w":"亭亭","m":"高耸直立的样子","t":"实词","d":["静静地","整齐的样子"]},{"u":4,"w":"净植","m":"洁净地立在那里","t":"实词","d":["干净地种植","纯净的植物"]},{"u":5,"w":"亵玩","m":"靠近而玩弄","t":"实词","d":["玩赏","不敬地摆弄"]},{"u":5,"w":"焉","m":"语气助词，相当于“啊”","t":"虚词","d":["哪里","于此"]},{"u":6,"w":"隐逸者","m":"隐士","t":"实词","d":["隐瞒的人","逸乐者"]},{"u":6,"w":"君子","m":"品德高尚的人","t":"古今异义","d":["有官位的人","男子"]},{"u":8,"w":"鲜","m":"少","t":"实词","d":["新鲜","鲜艳"]},{"u":10,"w":"宜乎","m":"当然","t":"实词","d":["适宜","合适吗"]}],"tricky":["蕃","淤","濯","涟","亵","亭亭净植"],"keyLines":[{"u":3,"hint":"《爱莲说》中，表现莲花出身污浊环境却保持洁净、不媚俗的两句是："},{"u":4,"hint":"描写莲的茎干通直、不生枝蔓，香气远播，姿态挺立的句子是："},{"u":5,"hint":"表达莲花高洁，令人只可敬重、不可轻慢亲近的句子是："},{"u":6,"hint":"作者将菊、牡丹、莲分别比作隐士、富贵者、君子的三句是："},{"u":10,"hint":"作者感叹世人追求富贵者众多的句子是："}],"appr":[{"q":"文章为什么要写菊和牡丹？","a":"用菊花（隐逸者）和牡丹（富贵者）作陪衬：菊的清高、牡丹的世俗，都衬托出莲花的君子品格，既避免了孤立写莲，又表达了作者对世风的看法。"},{"q":"作者借莲花表达了怎样的志趣？","a":"借莲“出淤泥而不染”“香远益清”“亭亭净植”等特点，比喻君子洁身自好、正直端庄、不与世俗合流的品格，表明自己不慕富贵、追求高洁的志趣。"}]},{"id":"g7b-w05","volume":"g7b","title":"活板","author":"沈括","dynasty":"北宋","genre":"说明文（笔记）","kind":"prose","intro":"选自《梦溪笔谈》。沈括记录了平民毕昇发明活字印刷术的经过，详细说明了活板的制作、排印和优点，是研究印刷史的重要文献。","theme":"详细介绍毕昇发明的活字印刷工艺及其优点，体现中国古代劳动人民的智慧。","tags":["说明","科技","印刷术"],"units":[{"t":"板印书籍，唐人尚未盛为之。","tr":"用雕版印刷书籍，唐代的人还没有大规模地这样做。","p":0,"r":0},{"t":"自冯瀛王始印五经，已后典籍皆为板本。","tr":"从冯道开始刻印五经，以后的典籍就都是雕版印刷的了。","p":0,"r":0},{"t":"庆历中，有布衣毕昇，又为活板。","tr":"庆历年间，有位平民毕昇，又发明了活字印刷。","p":1,"r":1},{"t":"其法：用胶泥刻字，薄如钱唇，每字为一印，火烧令坚。","tr":"它的方法是：用胶泥刻字，字模薄得像铜钱的边缘，每个字刻成一个字模，用火烧使它坚硬。","p":1,"r":1},{"t":"先设一铁板，其上以松脂、蜡和纸灰之类冒之。","tr":"先设置一块铁板，在它上面用松脂、蜡和纸灰一类的东西覆盖。","p":1,"r":1},{"t":"欲印，则以一铁范置铁板上，乃密布字印，满铁范为一板，持就火炀之，","tr":"想要印刷时，就把一个铁框放在铁板上，然后密密地排满字模，排满一个铁框就成为一块印版，拿到火上烘烤，","p":1,"r":1},{"t":"药稍熔，则以一平板按其面，则字平如砥。","tr":"等铁板上的药剂稍稍熔化，就用一块平板按在字模面上，那么字模就像磨刀石一样平整。","p":1,"r":1},{"t":"若止印三二本，未为简易；若印数十百千本，则极为神速。","tr":"如果只印两三本，不算简便；如果印几十本、几百本乃至上千本，就极其快速。","p":2,"r":0},{"t":"常作二铁板，一板印刷，一板已自布字，此印者才毕，则第二板已具，更互用之，瞬息可就。","tr":"通常制作两块铁板，一块印刷，另一块已经在排字，这块印完，第二块已经准备好，交替使用，一会儿就能完成。","p":2,"r":0},{"t":"每一字皆有数印，如“之”“也”等字，每字有二十余印，以备一板内有重复者。","tr":"每个字都有好几个字模，像“之”“也”等字，每个字有二十多个字模，以备同一块印版内有重复的字。","p":2,"r":0},{"t":"不用，则以纸帖之，每韵为一帖，木格贮之。","tr":"不用时，就用纸条贴上标记，每个韵部做一个标签，用木格存放。","p":2,"r":0},{"t":"有奇字素无备者，旋刻之，以草火烧，瞬息可成。","tr":"遇到平时没有预备的生僻字，随即刻制，用草火烧烤，转眼就能制成。","p":2,"r":0},{"t":"不以木为之者，木理有疏密，沾水则高下不平，兼与药相粘，不可取；","tr":"不用木头刻字模，是因为木头的纹理有疏有密，沾水后就高低不平，而且和药剂粘在一起，取不下来；","p":3,"r":0},{"t":"不若燔土，用讫再火令药熔，以手拂之，其印自落，殊不沾污。","tr":"不如用火烧过的泥土，用完后再烘烤使药剂熔化，用手一抹，字模就自己掉下，完全不会被弄脏。","p":3,"r":0},{"t":"昇死，其印为余群从所得，至今宝藏。","tr":"毕昇死后，他的字模被我的堂兄弟和侄辈得到，至今珍藏着。","p":4,"r":0}],"notes":[{"u":0,"w":"板印","m":"雕版印刷","t":"实词","d":["在木板上印章","印刷厂"]},{"u":0,"w":"盛","m":"大规模地，普遍地","t":"实词","d":["繁盛","盛装"]},{"u":1,"w":"自","m":"从","t":"虚词","d":["自己","自然"]},{"u":1,"w":"已后","m":"以后","t":"通假","d":["已经之后","停止之后"]},{"u":2,"w":"布衣","m":"平民","t":"古今异义","d":["布做的衣服","贫穷的人"]},{"u":2,"w":"为","m":"制作，发明","t":"实词","d":["成为","是"]},{"u":3,"w":"薄如钱唇","m":"薄得像铜钱的边缘","t":"实词","d":["薄得像钱币面","钱币的嘴"]},{"u":3,"w":"令","m":"使","t":"实词","d":["命令","县令"]},{"u":4,"w":"冒","m":"覆盖","t":"实词","d":["冒犯","冒充"]},{"u":5,"w":"范","m":"框子","t":"实词","d":["模范","范围"]},{"u":5,"w":"乃","m":"于是，然后","t":"虚词","d":["竟然","才"]},{"u":5,"w":"炀","m":"烘烤，使熔化","t":"实词","d":["焚烧","炒制"]},{"u":6,"w":"砥","m":"磨刀石","t":"实词","d":["柱子","光滑的石板"]},{"u":7,"w":"止","m":"仅仅","t":"通假","d":["停止","到达"]},{"u":7,"w":"神速","m":"极其迅速","t":"实词","d":["神奇的速度","不平凡的力量"]},{"u":8,"w":"布字","m":"排字","t":"实词","d":["散布文字","布置字迹"]},{"u":8,"w":"具","m":"准备好","t":"实词","d":["具有","工具"]},{"u":8,"w":"更互","m":"交替，轮流","t":"实词","d":["更换","相互改变"]},{"u":8,"w":"就","m":"完成","t":"实词","d":["靠近","就是"]},{"u":9,"w":"备","m":"预备，准备","t":"实词","d":["完备","防备"]},{"u":10,"w":"帖","m":"标签，用纸条标记","t":"词类活用","d":[]},{"u":10,"w":"贮","m":"存放","t":"实词","d":["储存财货","积累"]},{"u":11,"w":"素","m":"平时，向来","t":"实词","d":["白色","朴素"]},{"u":11,"w":"旋","m":"随即，不久","t":"实词","d":["旋转","回旋"]},{"u":12,"w":"兼","m":"并且，而且","t":"实词","d":["同时做两件事","合并"]},{"u":12,"w":"木理","m":"木头的纹理","t":"实词","d":["木头的道理","木工条理"]},{"u":13,"w":"燔","m":"烧","t":"实词","d":["焚毁","烤肉"]},{"u":13,"w":"殊","m":"全然，一点（也不）","t":"实词","d":["特殊","很"]},{"u":14,"w":"群从","m":"堂兄弟及子侄辈","t":"古今异义","d":["一群随从","众人跟从"]},{"u":14,"w":"宝藏","m":"珍藏","t":"古今异义","d":["宝物的库藏","地下的财宝"]}],"tricky":["瀛","胶泥","炀","砥","燔","拂"],"keyLines":[{"u":3,"hint":"《活板》中介绍毕昇制作字模的方法，写出字模厚薄特点的句子是："},{"u":6,"hint":"说明排好的印版用平板压平，字面平整如磨石的句子是："},{"u":8,"hint":"说明用两块铁板交替印刷与排字，效率很高的句子是："},{"u":13,"hint":"解释为什么胶泥比木头更适合做字模的句子是："}],"appr":[{"q":"文章说明活字印刷有哪些步骤？","a":"依次说明制字模（胶泥刻字、火烧）、排版（铁板、铁范、密布字印）、固版（火烘、平板压平）、印刷（两板交替）、字模存放（按韵分类、木格贮存）与遇生僻字补刻，最后拆版（以手拂之，印自落），条理清楚。"},{"q":"文章说明活字印刷的优点用了什么方法？","a":"运用对比：把印数少与印数多相比、胶泥与木料相比，突出活字印刷在速度、效率、字模可重复使用与不沾污等方面的优越，使说明具体可信。"}]},{"id":"g8a-p01","volume":"g8a","title":"野望","author":"王绩","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"王绩隋末唐初隐居东皋，此诗写他傍晚在东皋远望所见，是初唐较早摆脱绮丽诗风、朴素自然的五律。","theme":"写秋日黄昏的山野景色，抒发无所依托的孤独苦闷和对隐逸生活的复杂心情。","tags":["写景","抒怀","隐逸"],"units":[{"t":"东皋薄暮望，徙倚欲何依。","tr":"傍晚时分我站在东皋远远眺望，徘徊不定，不知该依靠何处。","p":0,"r":1},{"t":"树树皆秋色，山山唯落晖。","tr":"每一棵树都染上了秋天的色彩，每一座山都只剩下落日的余晖。","p":0,"r":1},{"t":"牧人驱犊返，猎马带禽归。","tr":"牧人赶着小牛回家，猎人骑着马载着猎物归来。","p":0,"r":1},{"t":"相顾无相识，长歌怀采薇。","tr":"四下相望，没有一个相识的人，只能放声高歌，怀念隐居采薇的古人。","p":0,"r":1}],"notes":[{"u":0,"w":"东皋","m":"水边向阳的高地","t":"实词","d":["东面的山冈","东边的城门"]},{"u":0,"w":"薄暮","m":"傍晚，太阳快落山时","t":"实词","d":["深夜","拂晓"]},{"u":0,"w":"徙倚","m":"徘徊不定","t":"实词","d":["倚靠栏杆","远远眺望"]},{"u":1,"w":"落晖","m":"落日的余光","t":"实词","d":["清晨的阳光","晚归的鸟群"]},{"u":2,"w":"犊","m":"小牛","t":"实词","d":["小羊","小马"]},{"u":2,"w":"禽","m":"猎获的鸟兽","t":"古今异义","d":["家养的鸟类","飞鸟的总称"]},{"u":3,"w":"采薇","m":"借伯夷、叔齐隐居采薇而食的典故，指隐居","t":"实词","d":["采摘药草治病","思念远方亲人"]}],"tricky":["皋","徙","犊","薇"],"keyLines":[{"u":1,"hint":"《野望》中，写傍晚满眼秋色、夕阳映照群山的两句是："},{"u":2,"hint":"诗中以牧人与猎人归家的动态画面衬托诗人孤独的两句是："},{"u":3,"hint":"诗人在山野中无人相识，只能高歌怀念隐士的两句是："}],"appr":[{"q":"“牧人驱犊返，猎马带禽归”在诗中有什么作用？","a":"以牧人、猎人傍晚归家的忙碌场景，反衬诗人独自徘徊、无所归依的孤寂，是以动衬静、以乐景写哀情。"},{"q":"尾联用“采薇”的典故表达了什么感情？","a":"伯夷、叔齐不食周粟、采薇而死，诗人借此表明自己向往隐居、不愿同流合污，同时也流露出怀才不遇、知音难觅的苦闷。"}]},{"id":"g8a-p02","volume":"g8a","title":"黄鹤楼","author":"崔颢","dynasty":"唐","genre":"七言律诗","kind":"poem","intro":"崔颢登武昌黄鹤楼，由传说中仙人乘鹤的故事写起，抒发怀古思乡之情，相传李白读后曾搁笔叹服。","theme":"登楼怀古，面对茫茫烟波，抒发时光空逝的感慨和浓浓的思乡愁绪。","tags":["怀古","思乡","写景"],"units":[{"t":"昔人已乘黄鹤去，此地空余黄鹤楼。","tr":"传说中的仙人早已乘着黄鹤飞走，这里只留下一座空空的黄鹤楼。","p":0,"r":1},{"t":"黄鹤一去不复返，白云千载空悠悠。","tr":"黄鹤一去再也不回来，千百年来只有白云空自飘荡。","p":0,"r":1},{"t":"晴川历历汉阳树，芳草萋萋鹦鹉洲。","tr":"晴朗的江面上，汉阳的树木清清楚楚；鹦鹉洲上芳草长得茂盛。","p":0,"r":1},{"t":"日暮乡关何处是？烟波江上使人愁。","tr":"天色将晚，我的故乡在哪里？江面烟波浩渺，令人愁绪满怀。","p":0,"r":1}],"notes":[{"u":0,"w":"昔人","m":"指传说中乘黄鹤的仙人","t":"实词","d":["古代的诗人","当年的友人"]},{"u":0,"w":"空余","m":"只留下","t":"实词","d":["多余","空闲"]},{"u":1,"w":"悠悠","m":"飘荡、悠远的样子","t":"实词","d":["忧愁的样子","缓慢流淌"]},{"u":2,"w":"历历","m":"清清楚楚、一个个可数的样子","t":"实词","d":["接连不断","历尽沧桑"]},{"u":2,"w":"萋萋","m":"草木茂盛的样子","t":"实词","d":["凄凉冷清","稀稀落落"]},{"u":3,"w":"乡关","m":"故乡","t":"古今异义","d":["家乡的关口","边关要塞"]},{"u":3,"w":"使人愁","m":"使人发愁（使动）","t":"词类活用"}],"tricky":["鹤","悠","萋","鹦鹉","洲","愁"],"keyLines":[{"u":1,"hint":"《黄鹤楼》中，感叹仙人一去不返、只有白云千年飘荡的句子是："},{"u":2,"hint":"描写晴日里汉阳树木清晰、鹦鹉洲芳草茂盛的句子是："},{"u":3,"hint":"诗人因暮色烟波而触动思乡之愁的两句是："}],"appr":[{"q":"前四句怎样由传说写到抒情？","a":"首联用仙人乘鹤的传说引出黄鹤楼，颔联用“一去不复返”“空悠悠”感叹时光流逝、世事茫茫，前四句由虚入实，为后文抒发羁旅乡愁作铺垫。"},{"q":"尾联“日暮乡关何处是？烟波江上使人愁”有何艺术效果？","a":"用设问收束，把暮色、烟波与乡愁融为一体，情景交融，余味悠长，同时与开头的缥缈意境呼应。"}]},{"id":"g8a-p03","volume":"g8a","title":"使至塞上","author":"王维","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"开元年间，王维奉命出使凉州慰问边防将士，途经边塞写下此诗，记叙旅途所见的塞外风光。","theme":"记叙出使边塞的见闻，描绘壮阔雄浑的大漠风光，也流露出孤寂的心境。","tags":["边塞","写景","行旅"],"units":[{"t":"单车欲问边，属国过居延。","tr":"轻车简从要去慰问边关，一路经过居延。","p":0,"r":1},{"t":"征蓬出汉塞，归雁入胡天。","tr":"我像随风飘飞的蓬草走出汉朝边塞，又像北归的大雁飞入胡人的天空。","p":0,"r":1},{"t":"大漠孤烟直，长河落日圆。","tr":"浩瀚的沙漠上一道孤烟笔直升起，蜿蜒的黄河边落日又大又圆。","p":0,"r":1},{"t":"萧关逢候骑，都护在燕然。","tr":"在萧关遇到侦察骑兵，说主帅正在前线燕然山。","p":0,"r":1}],"notes":[{"u":0,"w":"单车","m":"形容轻车简从，随从很少","t":"实词","d":["一辆战车","独自驾车"]},{"u":0,"w":"属国","m":"代指出使的官员（典属国的简称）","t":"实词","d":["附属的藩国","边境的国家"]},{"u":1,"w":"征蓬","m":"随风飘飞的蓬草，诗人自比","t":"实词","d":["远征的士兵","征途上的篷车"]},{"u":1,"w":"归雁","m":"北归的大雁","t":"实词","d":["迷路的大雁","南飞的大雁"]},{"u":2,"w":"孤烟","m":"孤零零的一缕烟（烽烟或炊烟）","t":"实词","d":["孤独的火焰","零星的云雾"]},{"u":3,"w":"候骑","m":"负责侦察的骑兵","t":"实词","d":["候补的骑兵","等待的战马"]},{"u":3,"w":"都护","m":"唐代边疆军政长官的官名","t":"实词","d":["保护都城的官员","护送使者的随从"]}],"tricky":["蓬","塞","萧关","都护","燕然"],"keyLines":[{"u":2,"hint":"《使至塞上》中，描绘大漠风光、被誉为千古名句的两句是："},{"u":1,"hint":"诗人以飘蓬、归雁自比，写出漂泊之感的两句是："},{"u":3,"hint":"写诗人在萧关遇到侦察骑兵、得知主帅在前线的句子是："}],"appr":[{"q":"“大漠孤烟直，长河落日圆”好在哪里？","a":"“直”“圆”二字用词简练，一竖一圆、一线一面，构图开阔而苍凉，把塞外大漠壮美雄浑的景象和诗人内心的孤寂交融在一起。"},{"q":"颔联“征蓬出汉塞，归雁入胡天”表达了怎样的心情？","a":"诗人以蓬草、归雁自喻，写出自己被排挤出朝、漂泊远行的孤寂与感伤，同时也点明了行程由汉地进入塞外。"}]},{"id":"g8a-p04","volume":"g8a","title":"渡荆门送别","author":"李白","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"李白二十五岁左右出蜀远游，乘船经荆门山，将进入楚地，写下此诗告别故乡山水。","theme":"描绘出蜀途中的壮阔山水，表达对故乡的眷恋和初出远游的豪情。","tags":["写景","思乡","送别"],"units":[{"t":"渡远荆门外，来从楚国游。","tr":"我乘船远渡到荆门山之外，来到楚地游览。","p":0,"r":1},{"t":"山随平野尽，江入大荒流。","tr":"山峦随着平坦的原野渐渐消失，江水流入广阔无边的原野。","p":0,"r":1},{"t":"月下飞天镜，云生结海楼。","tr":"月亮映在江中，像从天上飞来的明镜；云彩升起，变幻成海市蜃楼。","p":0,"r":1},{"t":"仍怜故乡水，万里送行舟。","tr":"我仍然爱恋故乡的江水，它不远万里陪伴着我的行船。","p":0,"r":1}],"notes":[{"u":0,"w":"荆门","m":"山名，在今湖北宜都西北长江南岸","t":"实词","d":["荆州的城门","荆棘丛生的山口"]},{"u":0,"w":"楚国","m":"指今湖北、湖南一带的古楚地","t":"实词","d":["楚人的国家","北方的邻国"]},{"u":1,"w":"大荒","m":"广阔无际的原野","t":"实词","d":["荒凉的沙漠","偏远的荒地"]},{"u":2,"w":"天镜","m":"天上的明镜，喻江上明月","t":"实词","d":["天空的镜子","云中的倒影"]},{"u":2,"w":"海楼","m":"海市蜃楼，比喻云彩的奇景","t":"实词","d":["海边的楼阁","出海的楼船"]},{"u":3,"w":"怜","m":"爱，爱怜","t":"古今异义","d":["可怜，同情","怜悯"]},{"u":3,"w":"故乡水","m":"指从蜀地流来的长江水","t":"实词","d":["故乡的小河","故乡的井水"]}],"tricky":["渡","荆","楚","镜","怜"],"keyLines":[{"u":1,"hint":"《渡荆门送别》中，写随着船行山势渐平、江水奔入原野的句子是："},{"u":2,"hint":"以月影和云霞写江上奇景的两句是："},{"u":3,"hint":"表达诗人对故乡依依不舍之情的句子是："}],"appr":[{"q":"“山随平野尽，江入大荒流”描绘了怎样的景象？","a":"随着船只自三峡进入平原，山势渐渐消失、江面渐渐开阔，“随”“入”二字使山水都有动感，展现出空阔雄浑的境界。"},{"q":"尾联为什么说“仍怜故乡水”？","a":"诗人本是送别故乡，却说故乡水“万里送行舟”，把江水人格化，以物写人，含蓄表达对故乡的深情和离别时的依恋。"}]},{"id":"g8a-p05","volume":"g8a","title":"钱塘湖春行","author":"白居易","dynasty":"唐","genre":"七言律诗","kind":"poem","intro":"白居易任杭州刺史时，春日漫游西湖，写下这首描绘早春景色、抒发闲适心情的七律。","theme":"写西湖早春的明媚景色，表达诗人游湖的喜悦和对自然之美的热爱。","tags":["写景","春景","抒情"],"units":[{"t":"孤山寺北贾亭西，水面初平云脚低。","tr":"在孤山寺北面、贾公亭西面，湖水刚刚涨到与岸相平，白云低垂得好像贴着水面。","p":0,"r":1},{"t":"几处早莺争暖树，谁家新燕啄春泥。","tr":"几处向阳的树上，早出的黄莺在争着鸣叫；不知谁家的新燕，正啄泥筑巢。","p":0,"r":1},{"t":"乱花渐欲迷人眼，浅草才能没马蹄。","tr":"繁多的野花渐渐开得让人眼花缭乱，浅浅的春草刚刚能没过马蹄。","p":0,"r":1},{"t":"最爱湖东行不足，绿杨阴里白沙堤。","tr":"最爱湖东这一带，怎么走也走不够，那绿杨荫里的白沙堤。","p":0,"r":1}],"notes":[{"u":0,"w":"水面初平","m":"湖水刚刚涨到与岸齐平","t":"实词","d":["水面刚刚平静","湖面又平又宽"]},{"u":0,"w":"云脚低","m":"云层低垂，似与水面相接","t":"实词","d":["云层很薄","云朵移动很快"]},{"u":1,"w":"暖树","m":"向阳的树","t":"实词","d":["暖和的衣服","春暖花开的树林"]},{"u":1,"w":"啄","m":"鸟用嘴取食或衔物","t":"实词","d":["啼叫","吹动"]},{"u":2,"w":"乱花","m":"纷繁杂乱的春花","t":"实词","d":["凋谢的残花","狂风中的落花"]},{"u":2,"w":"才能","m":"刚刚能够","t":"古今异义","d":["才华和能力","必须才可以"]},{"u":3,"w":"行不足","m":"怎么走也不够","t":"实词","d":["走不动","走不到头"]}],"tricky":["孤","贾","莺","燕","蹄","堤"],"keyLines":[{"u":1,"hint":"《钱塘湖春行》中，描写早莺争树、新燕筑巢的句子是："},{"u":2,"hint":"写春花繁盛、春草初生的两句是："},{"u":3,"hint":"表达诗人对湖东美景流连不已的句子是："}],"appr":[{"q":"“几处”“谁家”两个词有什么妙处？","a":"“几处”“谁家”不确指，写出早莺新燕并非遍地都是，符合早春景物刚刚复苏的特点，同时带有疑问的口吻，显得轻快活泼。"},{"q":"“乱花渐欲迷人眼，浅草才能没马蹄”中哪些词用得好？","a":"“渐欲”“才能”写出花开草长的渐进状态，“乱”“浅”点出早春特点，景物特写细腻准确，表达了诗人对春景的喜爱。"}]},{"id":"g8a-p06","volume":"g8a","title":"庭中有奇树","author":"佚名","dynasty":"汉","genre":"五言古诗（《古诗十九首》）","kind":"poem","intro":"出自汉代《古诗十九首》，作者不详，写一位妇人折花欲赠远方亲人，却又路远难达的相思之情。","theme":"借折花赠远写思妇对远方亲人的深切怀念，感叹离别日久、相思无法寄达。","tags":["思念","抒情","咏物"],"units":[{"t":"庭中有奇树，绿叶发华滋。","tr":"庭院里有一棵奇特的树，绿叶间花开繁盛。","p":0,"r":1},{"t":"攀条折其荣，将以遗所思。","tr":"我攀着枝条，折下一朵花，想把它送给我思念的人。","p":0,"r":1},{"t":"馨香盈怀袖，路远莫致之。","tr":"花香充满了我的怀袖，可是路途遥远，没法送到他那里。","p":0,"r":1},{"t":"此物何足贵，但感别经时。","tr":"这花哪里值得珍贵，只是感叹离别已经很久了。","p":0,"r":1}],"notes":[{"u":0,"w":"奇树","m":"奇特的树，这里指一棵很美的树","t":"实词","d":["珍稀的药树","高大的古树"]},{"u":0,"w":"华","m":"通“花”，花朵","t":"通假","d":["光华","华丽"]},{"u":1,"w":"荣","m":"花","t":"实词","d":["荣耀","茂盛的叶"]},{"u":1,"w":"遗","m":"赠送","t":"实词","d":["遗失","遗留"]},{"u":2,"w":"盈","m":"充满","t":"实词","d":["超过","盈利"]},{"u":2,"w":"致","m":"送达","t":"实词","d":["导致","情致"]},{"u":3,"w":"何足贵","m":"哪里值得珍贵","t":"特殊句式"}],"tricky":["滋","攀","遗","馨","盈","袖"],"keyLines":[{"u":1,"hint":"《庭中有奇树》中，写作者折花想要赠给所思之人的两句是："},{"u":2,"hint":"写花香满怀，却因路远无法送达的两句是："},{"u":3,"hint":"点明折花并非为花珍贵，而是因为久别思念的两句是："}],"appr":[{"q":"全诗是怎样由景入情的？","a":"前四句写庭树繁花、折花欲赠，是由景入事；后四句写路远难致、别久情深，由事入情，起承转合层次分明，情感层层深入。"},{"q":"“此物何足贵，但感别经时”有何表达效果？","a":"先把花的“贵”否定，再点明真正令人珍惜的是离别之久带来的相思，以反问转折，使情感更加突出，余味深长。"}]},{"id":"g8a-p07","volume":"g8a","title":"龟虽寿","author":"曹操","dynasty":"东汉","genre":"乐府诗（四言）","kind":"poem","intro":"建安十二年，曹操北征乌桓得胜归来，写下《步出夏门行》组诗，《龟虽寿》是其中第四章，作于他五十三岁时。","theme":"以神龟、腾蛇、老骥自比，表达老当益壮、积极进取的人生态度和壮心不已的豪情。","tags":["言志","哲理","抒怀"],"units":[{"t":"神龟虽寿，犹有竟时；","tr":"神龟虽然长寿，但也有生命终结的时候；","p":0,"r":1},{"t":"腾蛇乘雾，终为土灰。","tr":"腾蛇虽能乘云驾雾，终究也会化为尘土。","p":0,"r":1},{"t":"老骥伏枥，志在千里；","tr":"年老的千里马伏在马槽边，仍立志奔驰千里；","p":0,"r":1},{"t":"烈士暮年，壮心不已。","tr":"有壮志的人到了晚年，雄心壮志依然不会停止。","p":0,"r":1},{"t":"盈缩之期，不但在天；","tr":"寿命的长短，不只是由上天决定；","p":0,"r":1},{"t":"养怡之福，可得永年。","tr":"只要调养身心保持愉快，就可以延年益寿。","p":0,"r":1},{"t":"幸甚至哉，歌以咏志。","tr":"庆幸得很啊，就用诗歌来表达心志。","p":0,"r":1}],"notes":[{"u":0,"w":"竟","m":"终结，完结","t":"实词","d":["竟然","终于"]},{"u":1,"w":"腾蛇","m":"传说中一种能驾雾飞行的蛇","t":"实词","d":["腾空的蛟龙","奔腾的巨蟒"]},{"u":2,"w":"骥","m":"良马，千里马","t":"实词","d":["骆驼","老牛"]},{"u":2,"w":"枥","m":"马槽","t":"实词","d":["马厩","缰绳"]},{"u":3,"w":"烈士","m":"有雄心壮志的人","t":"古今异义","d":["为国牺牲的人","刚烈的勇士"]},{"u":3,"w":"已","m":"停止","t":"实词","d":["已经","完成"]},{"u":4,"w":"盈缩","m":"指人寿命的长短","t":"实词","d":["财富的多少","身体的胖瘦"]},{"u":5,"w":"怡","m":"愉快，指身心愉快","t":"实词","d":["怡情养性的书画","安静休息"]}],"tricky":["龟","腾","骥","枥","烈","怡"],"keyLines":[{"u":2,"hint":"《龟虽寿》中，表现诗人年老而志向不减的名句是："},{"u":3,"hint":"表达壮志至死不衰、永不停止进取的两句是："},{"u":4,"hint":"强调人的寿命不完全由天命决定、可以靠自己调养的句子是："}],"appr":[{"q":"“老骥伏枥，志在千里；烈士暮年，壮心不已”运用了什么手法？","a":"前句用比喻（以老骥自比），后句直抒胸臆，一比一直，写出诗人虽已年老但志向不衰的豪迈气概，格调昂扬。"},{"q":"全诗体现了怎样的人生态度？","a":"诗人先承认生命有限，进而强调人可以凭意志和调养延年，表现出不信天命、积极进取、老当益壮的态度。"}]},{"id":"g8a-p08","volume":"g8a","title":"赠从弟（其二）","author":"刘桢","dynasty":"东汉","genre":"五言古诗","kind":"poem","intro":"刘桢是“建安七子”之一，《赠从弟》共三首，这是第二首，借松柏的坚贞勉励堂弟砥砺品格。","theme":"借松柏在严寒中挺立不屈，赞美坚贞刚劲的品格，并以此勉励他人。","tags":["咏物","言志","勉励"],"units":[{"t":"亭亭山上松，瑟瑟谷中风。","tr":"山上的松树高耸挺拔，山谷里吹着瑟瑟的风声。","p":0,"r":1},{"t":"风声一何盛，松枝一何劲！","tr":"风声是多么强劲，松枝又是多么刚健！","p":0,"r":1},{"t":"冰霜正惨凄，终岁常端正。","tr":"即使冰霜严酷凄寒，松树一年到头始终端正挺立。","p":0,"r":1},{"t":"岂不罹凝寒？松柏有本性。","tr":"难道松柏没有遭遇严寒吗？不，是它天生有着耐寒的本性。","p":0,"r":1}],"notes":[{"u":0,"w":"亭亭","m":"高耸挺拔的样子","t":"实词","d":["亭子的样子","美好的样子"]},{"u":0,"w":"瑟瑟","m":"形容风声","t":"实词","d":["寒冷发抖的样子","轻轻飘落的样子"]},{"u":1,"w":"一何","m":"多么","t":"实词","d":["第一","为什么"]},{"u":2,"w":"惨凄","m":"凄凉，严酷寒冷","t":"实词","d":["悲惨","凄楚的哭声"]},{"u":2,"w":"终岁","m":"一年到头","t":"实词","d":["晚年","终生"]},{"u":3,"w":"罹","m":"遭受","t":"实词","d":["离开","罗列"]},{"u":3,"w":"凝寒","m":"严寒","t":"实词","d":["凝重的寒意","凝结的冰块"]}],"tricky":["亭","瑟","劲","惨凄","罹","凝"],"keyLines":[{"u":1,"hint":"《赠从弟（其二）》中，用松枝刚劲写出松树不畏狂风的句子是："},{"u":2,"hint":"写松树无论冰霜多么严酷，一年到头始终端正挺立的句子是："},{"u":3,"hint":"以反问点明松柏耐寒是出于天性的两句是："}],"appr":[{"q":"这首诗运用了什么手法？","a":"运用象征和对比：以松柏的刚劲挺拔象征坚贞不屈的品格，用狂风冰霜反衬松树的坚韧，托物言志。"},{"q":"结尾“岂不罹凝寒？松柏有本性”有什么作用？","a":"用反问和回答点明题旨：松柏不是没有遇到严寒，而是凭本性不畏严寒，由物及人，勉励堂弟保持坚贞的品格。"}]},{"id":"g8a-p09","volume":"g8a","title":"梁甫行","author":"曹植","dynasty":"三国·魏","genre":"乐府诗（五言）","kind":"poem","intro":"曹植的乐府诗《梁甫行》，写边海地区百姓的艰苦生活，反映了汉末动荡时代的民间疾苦。","theme":"描写边海百姓栖身荒野、生活困苦的情景，表达对劳动人民的同情。","tags":["乐府","民生","叙事"],"units":[{"t":"八方各异气，千里殊风雨。","tr":"八方的气候各不相同，千里之内风雨也不一样。","p":0,"r":1},{"t":"剧哉边海民，寄身于草野。","tr":"边海的百姓多么艰难啊，只能栖身在荒野之中。","p":0,"r":1},{"t":"妻子象禽兽，行止依林阻。","tr":"妻子儿女像禽兽一样，活动居住只能依靠山林险阻。","p":0,"r":1},{"t":"柴门何萧条，狐兔翔我宇。","tr":"柴门多么冷清破败，狐狸野兔竟在我的房前屋后自在奔跑。","p":0,"r":1}],"notes":[{"u":0,"w":"异气","m":"气候不同","t":"实词","d":["怪异的天气","不同的气质"]},{"u":0,"w":"殊","m":"不同","t":"实词","d":["特别","优秀"]},{"u":1,"w":"剧","m":"艰难，困苦","t":"实词","d":["戏剧","剧烈"]},{"u":1,"w":"草野","m":"荒野，草棚居住的地方","t":"实词","d":["草原","田野的庄稼"]},{"u":2,"w":"妻子","m":"妻子和儿女","t":"古今异义","d":["男子的配偶","妻子的亲人"]},{"u":2,"w":"象","m":"像，类似","t":"通假","d":["大象","形象"]},{"u":3,"w":"翔","m":"这里指自在地奔走","t":"实词","d":["飞翔","盘旋"]},{"u":3,"w":"宇","m":"屋檐，这里指房屋","t":"实词","d":["宇宙","天空"]}],"tricky":["殊","剧","禽","阻","柴","翔"],"keyLines":[{"u":1,"hint":"《梁甫行》中，感叹边海百姓生活艰难、寄居荒野的句子是："},{"u":2,"hint":"写百姓如同禽兽一样依傍山林生活的两句是："},{"u":3,"hint":"以狐兔随意出没的景象写出家园荒凉的句子是："}],"appr":[{"q":"末句“狐兔翔我宇”有什么表达效果？","a":"用狐兔自在出没于屋旁的细节，从侧面烘托住处荒凉冷落、人迹罕至，以物写人，使边海百姓的凄惨处境更加突出。"},{"q":"全诗表现了怎样的感情？","a":"通过描写边海百姓的困苦生活，诗人表达了对底层劳动人民不幸遭遇的深切同情，也折射出动乱年代的社会苦难。"}]},{"id":"g8a-p10","volume":"g8a","title":"饮酒（其五）","author":"陶渊明","dynasty":"东晋","genre":"五言古诗","kind":"poem","intro":"陶渊明辞官归隐田园后，写下《饮酒》组诗二十首，这是第五首，表现他远离尘俗的田园情趣。","theme":"写隐居生活的闲适自得，表达远离官场、回归自然的人生理想。","tags":["田园","哲理","隐逸"],"units":[{"t":"结庐在人境，而无车马喧。","tr":"把房舍建在人世间，却没有车马的喧闹。","p":0,"r":1},{"t
