t":"实词","d":["中间行走","隔开行走"]},{"u":94,"w":"道","m":"取道，经由","t":"词类活用"},{"u":97,"w":"间","m":"从小路","t":"词类活用"},{"u":96,"w":"度","m":"估计","t":"实词","d":["温度","度过"]},{"u":98,"w":"不胜","m":"经受不住","t":"实词","d":["不能取胜","不超过"]},{"u":102,"w":"督过","m":"责备","t":"实词","d":["监督过失","督察过往"]},{"u":105,"w":"竖子","m":"小子（骂人的话）","t":"实词","d":["年轻的奴仆","童子"]},{"u":106,"w":"为之虏","m":"被他俘虏（“为……所”式被动）","t":"特殊句式"},{"u":107,"w":"立诛杀","m":"立即杀掉","t":"实词","d":["站着杀掉","刚刚杀掉"]}],"tricky":["鸿","飨","鲰","戟","瞋","眦","跽","彘","俎","桮"],"keyLines":[{"u":84,"hint":"樊哙劝刘邦不必辞别、迅速离开时说的两句话是："},{"u":71,"hint":"樊哙痛斥项王时，用来形容秦王残暴、杀人用刑毫不手软的句子是："},{"u":62,"hint":"描写樊哙闯入帐中怒视项王的神态，极富冲击力的句子是："},{"u":85,"hint":"樊哙以比喻说明刘邦此刻处境危险的句子是："},{"u":57,"hint":"张良向樊哙说明项庄舞剑真实用意的句子是："}],"appr":[{"q":"鸿门宴上，司马迁怎样通过座次的安排来表现人物关系？","a":"“项王、项伯东向坐；亚父南向坐；沛公北向坐；张良西向侍”，以东向为尊，项羽位居上首，刘邦却只能北向，等同臣子；范增虽称亚父，位次也在刘邦之上，既见项羽的自负，也暗示刘邦处于劣势。"},{"q":"樊哙闯帐一段运用了哪些描写手法？有何作用？","a":"通过动作（带剑拥盾、侧盾撞、覆盾切肉）、神态（瞋目、头发上指、目眦尽裂）和语言（慷慨陈词）的描写，塑造出勇猛而机智的形象，既震慑项羽，又为刘邦脱身赢得时机，推动情节走向高潮。"},{"q":"比较刘邦与项羽的性格特点。","a":"刘邦能屈能伸、善于听取意见、懂得权变；项羽勇猛却骄傲轻敌、优柔寡断、妇人之仁，这些差异在宴会上表现充分，也预示了楚汉争霸的结局。"}]},{"id":"h1b-w06","volume":"h1b","title":"窦娥冤（节选）","author":"关汉卿","dynasty":"元","genre":"杂剧（剧本节选）","kind":"prose","intro":"关汉卿是元杂剧奠基人之一。《窦娥冤》全名《感天动地窦娥冤》，写寡妇窦娥蒙冤被斩的悲剧，教材节选的是第三折，即法场行刑一段。","theme":"借窦娥临刑前的控诉与三桩誓愿，痛斥官府昏聩、世道不公，歌颂弱者的刚烈与抗争。","tags":["戏曲","控诉","批判现实"],"units":[{"t":"（净扮公人鼓三通、锣三下科。刽子磨旗、提刀、押正旦带枷上。刽子云）行动些，行动些，监斩官去法场上多时了！","tr":"（公人敲三通鼓、三下锣。刽子手摇动令旗，提着刀，押着戴枷的窦娥上场。刽子手说）快走快走，监斩官已经在法场上等了很久啦！","p":0,"r":0},{"t":"（正旦唱）【正宫·端正好】没来由犯王法，不提防遭刑宪，叫声屈动地惊天。","tr":"（窦娥唱）我平白无故触犯了王法，没想到竟遭受刑罚，这一声喊冤要震动天地。","p":0,"r":0},{"t":"顷刻间游魂先赴森罗殿，怎不将天地也生埋怨。","tr":"转眼之间我的魂魄就要先去阎王殿了，我怎能不连天地也一并埋怨！","p":0,"r":0},{"t":"【滚绣球】有日月朝暮悬，有鬼神掌着生死权。","tr":"天上有日月早晚高悬，世间有鬼神掌管着生死大权。","p":1,"r":1},{"t":"天地也，只合把清浊分辨，可怎生糊突了盗跖颜渊？","tr":"天地啊，你本该分清善恶是非，为什么竟把盗跖和颜渊都弄得混淆不清？","p":1,"r":1},{"t":"为善的受贫穷更命短，造恶的享富贵又寿延。","tr":"行善的人受穷受苦，还短命；作恶的人享尽富贵，又长寿。","p":1,"r":1},{"t":"天地也，做得个怕硬欺软，却原来也这般顺水推船。","tr":"天地啊，你原来也是欺软怕硬，竟也这样顺着势头随波逐流。","p":1,"r":1},{"t":"地也，你不分好歹何为地？天也，你错勘贤愚枉做天！","tr":"地啊，你分不清好坏，还算什么地？天啊，你错判了贤人和愚人，白白当了天！","p":1,"r":1},{"t":"哎，只落得两泪涟涟。","tr":"唉，我只剩下两行眼泪不断地流淌。","p":1,"r":1},{"t":"（正旦云）窦娥告监斩大人，有一事肯依窦娥，便死而无怨。","tr":"（窦娥说）我要告诉监斩大人，您若肯答应我一件事，我死也没有怨恨。","p":2,"r":0},{"t":"（监斩官云）你有什么事？你说。","tr":"（监斩官说）你有什么事？说吧。","p":2,"r":0},{"t":"（正旦云）要一领净席，等我窦娥站立；","tr":"（窦娥说）我要一张干净的席子，让我窦娥站在上面；","p":2,"r":0},{"t":"又要丈二白练，挂在旗枪上；","tr":"再要一丈二尺长的白绢，挂在旗枪上；","p":2,"r":0},{"t":"若我窦娥委实冤枉，刀过处头落，一腔热血休半点儿沾在地下，都飞在白练上者。","tr":"如果我窦娥确实冤枉，刀落头断的时候，满腔的热血一点也不要沾到地上，要全部飞溅到白绢上。","p":2,"r":0},{"t":"（监斩官云）这个就依你，打什么不紧。","tr":"（监斩官说）这个就依你，不算什么要紧事。","p":2,"r":0},{"t":"（正旦唱）【耍孩儿】不是我窦娥发下这等无头愿，委实的冤情不浅；","tr":"（窦娥唱）不是我窦娥随口发这种没来由的誓愿，实在是我的冤屈太深重；","p":3,"r":0},{"t":"若没些儿灵圣与世人传，也不见得湛湛青天。","tr":"如果不显出一点灵验让世人传说，也就显不出这青天明察秋毫。","p":3,"r":0},{"t":"我不要半星热血红尘洒，都只在八尺旗枪素练悬，","tr":"我不要让半点热血洒在尘世间，要它们都留在八尺旗杆上悬挂的白绢上，","p":3,"r":0},{"t":"等他四下里皆见，这是咱苌弘化碧，望帝啼鹃。","tr":"让四周的人都能看见，这就像苌弘的血化为碧玉、望帝的魂化作杜鹃啼血一样。","p":3,"r":0},{"t":"（正旦再跪科云）大人，如今是三伏天道，若窦娥委实冤枉，身死之后，天降三尺瑞雪，遮掩了窦娥尸首。","tr":"（窦娥再次跪下说）大人，如今正是三伏盛夏，如果我窦娥确实冤枉，我死之后，就让天降三尺厚的瑞雪，盖住我的尸体。","p":3,"r":0},{"t":"（监斩官云）这等三伏天道，你便有冲天的冤情，也召不得一片雪来，可不胡说！","tr":"（监斩官说）这样的三伏天，你就算有冲天的冤屈，也招不来一片雪花，这不是胡说吗！","p":3,"r":0},{"t":"（正旦唱）【二煞】你道是暑气暄，不是那下雪天；岂不闻飞霜六月因邹衍？","tr":"（窦娥唱）你说如今暑气炎热，不是下雪的时节；难道没听说过邹衍含冤，六月里也降了霜吗？","p":3,"r":0},{"t":"若果有一腔怨气喷如火，定要感得六出冰花滚似绵，","tr":"如果我真有满腔怨气像火一样喷发，就一定能感动上天，降下棉絮般翻滚的雪花，","p":3,"r":0},{"t":"免着我尸骸现；要什么素车白马，断送出古陌荒阡！","tr":"遮住我暴露的尸骸；哪里用得着什么白车白马的送葬，把我送到荒野的路上！","p":3,"r":0},{"t":"（正旦再跪科云）大人，我窦娥死的委实冤枉，从今以后，着这楚州亢旱三年。","tr":"（窦娥再次跪下说）大人，我窦娥死得实在冤枉，从今以后，就让这楚州大旱三年。","p":3,"r":0},{"t":"（监斩官云）打嘴！那有这等说话！","tr":"（监斩官说）掌嘴！哪有这样的话！","p":3,"r":0},{"t":"（正旦唱）【一煞】你道是天公不可欺，人心不可怜，","tr":"（窦娥唱）你说上天不可欺骗，人心不值得怜悯，","p":3,"r":0},{"t":"不知皇天也肯从人愿，做甚么三年不见甘霖降！","tr":"可你不知道老天也肯依从人的心愿，不然怎会三年不降一滴甘霖！","p":3,"r":0},{"t":"也只为东海曾经孝妇冤，如今轮到你山阳县。","tr":"也只因当年东海孝妇含冤而死，如今这灾祸轮到了你们山阳县。","p":3,"r":0},{"t":"这都是官吏每无心正法，使百姓有口难言。","tr":"这都是因为官吏们无心依法办事，才使百姓有冤难诉。","p":3,"r":0},{"t":"（刽子做磨旗科，云）怎么这一会儿天色阴了也？（内做风科，云）好冷风也！","tr":"（刽子手摇动令旗，说）怎么一会儿工夫天色阴沉下来了？（幕后作风声，说）好冷的风啊！","p":4,"r":0},{"t":"（正旦唱）【煞尾】浮云为我阴，悲风为我旋，三桩儿誓愿明题遍，","tr":"（窦娥唱）浮云为我遮蔽天空，悲风为我盘旋，三桩誓愿已经明明白白地说遍，","p":4,"r":1},{"t":"（做哭科，云）婆婆也，直等待雪飞六月、亢旱三年呵，","tr":"（哭着说）婆婆啊，等到六月飞雪、大旱三年的时候，","p":4,"r":0},{"t":"（唱）那其间才把你个屈死的冤魂这窦娥显。","tr":"（唱）那时才会显出你这屈死的冤魂窦娥的冤情来。","p":4,"r":1}],"notes":[{"u":1,"w":"刑宪","m":"刑法，法律","t":"实词","d":["宪法","官府的告示"]},{"u":2,"w":"森罗殿","m":"阎王殿，迷信传说中阴间的殿堂","t":"实词","d":["茂密的树林中的宫殿","皇宫"]},{"u":2,"w":"生","m":"硬、偏偏（语助，加强语气）","t":"实词","d":["出生","生动"]},{"u":3,"w":"朝暮","m":"早晚","t":"实词","d":["日夜思念","朝廷与暮年"]},{"u":4,"w":"只合","m":"只应该","t":"实词","d":["只是合上","只有联合"]},{"u":4,"w":"可怎生","m":"为什么，怎么竟","t":"特殊句式","d":[]},{"u":4,"w":"糊突","m":"糊涂，混淆","t":"实词","d":["弄脏","遮蔽"]},{"u":4,"w":"盗跖颜渊","m":"盗跖是传说中的大盗，颜渊是孔子的贤徒，分别代表恶人与善人","t":"实词","d":["两位古代帝王","两位著名的将领"]},{"u":5,"w":"更","m":"又，还","t":"虚词","d":["更改","更加"]},{"u":5,"w":"寿延","m":"寿命长久","t":"实词","d":["延期","推迟死亡"]},{"u":6,"w":"怕硬欺软","m":"畏惧强者、欺负弱者","t":"特殊句式","d":[]},{"u":6,"w":"顺水推船","m":"顺着水势推船，比喻顺着情势行事、不主持公道","t":"实词","d":["帮助他人渡河","划船前行"]},{"u":7,"w":"勘","m":"审察，判断","t":"实词","d":["勘探","校对文字"]},{"u":7,"w":"枉","m":"白白地，徒然","t":"实词","d":["冤屈","弯曲"]},{"u":7,"w":"好歹","m":"好坏，是非","t":"古今异义","d":["无论如何","不管怎样"]},{"u":13,"w":"委实","m":"确实，实在","t":"实词","d":["委托","委婉"]},{"u":13,"w":"者","m":"语气助词，表示祈使语气","t":"虚词","d":[]},{"u":15,"w":"无头愿","m":"没来由的誓愿","t":"实词","d":["没有开头的愿望","虚妄无实现可能的愿望"]},{"u":16,"w":"湛湛","m":"清澈的样子","t":"实词","d":["深沉的样子","宽广的样子"]},{"u":17,"w":"红尘","m":"这里指人世间的尘土","t":"古今异义","d":["红色的灰尘","繁华都市"]},{"u":18,"w":"苌弘化碧","m":"典故：周朝大夫苌弘被冤杀，传说其血三年后化为碧玉，比喻忠臣含冤而死","t":"典故","d":[]},{"u":18,"w":"望帝啼鹃","m":"典故：传说蜀国望帝死后魂化杜鹃，啼声悲切，比喻冤魂怨诉","t":"典故","d":[]},{"u":21,"w":"暄","m":"暖，热","t":"实词","d":["喧闹","明亮"]},{"u":21,"w":"邹衍","m":"战国人，传说他无罪被囚，六月天降霜以示冤屈","t":"典故","d":[]},{"u":22,"w":"六出冰花","m":"雪花（雪花六角）","t":"实词","d":["六朵冰制的花","六月开放的花"]},{"u":23,"w":"古陌荒阡","m":"荒野的田间小路，指荒郊野外的坟地","t":"实词","d":["古老的街道","废弃的城池"]},{"u":24,"w":"亢旱","m":"大旱","t":"实词","d":["高亢干燥","极度干渴"]},{"u":27,"w":"甘霖","m":"及时的好雨","t":"实词","d":["甜美的泉水","春天的露水"]},{"u":28,"w":"东海曾经孝妇冤","m":"典故：汉代东海孝妇被冤杀，郡中大旱三年","t":"典故","d":[]},{"u":29,"w":"每","m":"们（复数后缀）","t":"古今异义","d":["每次","每个"]}],"tricky":["糊突","盗跖","颜渊","涟涟","湛湛","亢旱"],"keyLines":[{"u":3,"hint":"《窦娥冤》中，窦娥质问天地、认为天地本应掌握生死权柄分辨善恶的两句是（上承“有日月朝暮悬”）："},{"u":5,"hint":"窦娥控诉善人受苦短命、恶人富贵长寿的社会现实的句子是："},{"u":7,"hint":"窦娥直接斥责天地不辨贤愚、不配称天称地的句子是："},{"u":31,"hint":"窦娥立下三桩誓愿后，写浮云悲风为之变色以渲染冤情的句子是："}],"appr":[{"q":"【滚绣球】一段对天地发出怒斥，有什么作用？","a":"窦娥把本应主持公道的天地也当作责问对象，指出它们善恶颠倒、欺软怕硬，把个人冤屈上升为对整个黑暗社会秩序的控诉，使感情愈发激愤、强烈，也突出了她的刚烈与反抗精神。"},{"q":"三桩誓愿各自有什么含义？为什么要这样安排？","a":"血溅白练、六月飞雪、亢旱三年依次递进，都是超乎常理的异象，是窦娥冤屈无处可诉时借天地之力发出的抗争。它们带有浪漫主义色彩，既强化悲剧气氛，也表达了作者对人民冤屈必得昭雪的期望。"}]},{"id":"h1b-w07","volume":"h1b","title":"谏逐客书","author":"李斯","dynasty":"秦","genre":"奏议（上书）","kind":"prose","intro":"秦王嬴政因韩国间谍郑国事发，下令驱逐六国来的客卿。身为楚人的李斯也在被逐之列，他上书陈说利害，使秦王收回了成命。","theme":"以史实和事理说明秦国的强大离不开客卿，指出逐客只会资敌亡己，劝秦王广纳天下人才。","tags":["议论","说理","劝谏"],"units":[{"t":"臣闻吏议逐客，窃以为过矣。","tr":"我听说官吏们在商议驱逐客卿，私下认为这样做是错误的。","p":0,"r":0},{"t":"昔缪公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，来丕豹、公孙支于晋。","tr":"从前秦穆公访求贤士，在西边从戎人那里得到由余，在东边从宛地得到百里奚，从宋国迎来蹇叔，又从晋国招来丕豹、公孙支。","p":1,"r":0},{"t":"此五子者，不产于秦，而缪公用之，并国二十，遂霸西戎。","tr":"这五位贤士都不是秦国出生的，可穆公重用了他们，吞并了二十个国家，终于称霸西戎。","p":1,"r":0},{"t":"孝公用商鞅之法，移风易俗，民以殷盛，国以富强，","tr":"秦孝公采用商鞅的变法，改变风气习俗，百姓因此富足兴旺，国家因此富强，","p":2,"r":0},{"t":"百姓乐用，诸侯亲服，获楚、魏之师，举地千里，至今治强。","tr":"百姓乐于为国效力，诸侯亲近顺服，打败楚国、魏国的军队，攻取土地上千里，直到现在都安定强盛。","p":2,"r":0},{"t":"惠王用张仪之计，拔三川之地，西并巴、蜀，北收上郡，南取汉中，","tr":"秦惠王采用张仪的计策，攻下三川地区，向西吞并巴、蜀，向北收取上郡，向南夺取汉中，","p":3,"r":0},{"t":"包九夷，制鄢、郢，东据成皋之险，割膏腴之壤，","tr":"囊括九夷的地盘，控制鄢、郢，向东占据成皋的险要，割取肥沃的土地，","p":3,"r":0},{"t":"遂散六国之从，使之西面事秦，功施到今。","tr":"终于拆散了六国的合纵联盟，让他们向西侍奉秦国，功业一直延续到今天。","p":3,"r":0},{"t":"昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。","tr":"秦昭王得到范雎，废黜穰侯，驱逐华阳君，加强王室，杜绝权贵私门，像蚕吃桑叶那样逐步侵吞诸侯，使秦国成就帝业。","p":4,"r":0},{"t":"此四君者，皆以客之功。","tr":"这四位君主，都是靠客卿的功劳。","p":4,"r":0},{"t":"由此观之，客何负于秦哉！","tr":"由此看来，客卿哪里对不起秦国呢！","p":4,"r":0},{"t":"向使四君却客而不内，疏士而不用，是使国无富利之实，而秦无强大之名也。","tr":"假如当初这四位君主拒绝客卿而不接纳，疏远贤士而不任用，那就会使国家没有富足的实惠，秦国也没有强大的名声了。","p":4,"r":0},{"t":"今陛下致昆山之玉，有随、和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。","tr":"如今陛下搜罗昆山的美玉，拥有随侯珠、和氏璧这样的宝物，佩着明月宝珠，带着太阿宝剑，骑着纤离骏马，竖起翠凤旗，架起鼍皮鼓。","p":5,"r":0},{"t":"此数宝者，秦不生一焉，而陛下说之，何也？","tr":"这几样宝物，秦国一样也不出产，可陛下却喜爱它们，这是为什么呢？","p":5,"r":0},{"t":"必秦国之所生然后可，则是夜光之璧不饰朝廷，犀象之器不为玩好，","tr":"如果一定要秦国出产的才可以用，那么夜光璧就不能装点朝廷，犀角象牙制的器物就不能成为玩赏之物，","p":5,"r":0},{"t":"郑、卫之女不充后宫，而骏良駃騠不实外厩，江南金锡不为用，西蜀丹青不为采。","tr":"郑国、卫国的美女就不能充满后宫，良马駃騠就不能充实宫外的马厩，江南的金锡不能使用，西蜀的丹青颜料也不能用来作彩饰。","p":5,"r":0},{"t":"所以饰后宫、充下陈、娱心意、说耳目者，必出于秦然后可，","tr":"用来装饰后宫、充实侍从行列、愉悦心意、使耳目欢畅的东西，若必须出自秦国才可以，","p":5,"r":0},{"t":"则是宛珠之簪、傅玑之珥、阿缟之衣、锦绣之饰不进于前，而随俗雅化佳冶窈窕赵女不立于侧也。","tr":"那么宛地的珠簪、缀着珠玑的耳饰、齐国阿县的细绢衣裳、锦绣的装饰品就不能进献到面前，而那些合乎时尚、典雅美艳的赵国女子也不能侍立在身旁了。","p":5,"r":0},{"t":"夫击瓮叩缶，弹筝搏髀，而歌呼呜呜快耳者，真秦之声也；","tr":"那敲着瓦瓮瓦缶，弹着秦筝，拍着大腿，呜呜呼唱来取悦耳朵的，才是真正的秦国音乐；","p":5,"r":0},{"t":"郑、卫、桑间，昭、虞、武、象者，异国之乐也。","tr":"而郑、卫之音，桑间之曲，以及《昭》《虞》《武》《象》，都是别国的音乐。","p":5,"r":0},{"t":"今弃击瓮叩缶而就郑、卫，退弹筝而取昭、虞，若是者何也？","tr":"如今却抛开敲瓮叩缶而接受郑、卫之音，不弹秦筝而选取《昭》《虞》，这样做是为什么呢？","p":5,"r":0},{"t":"快意当前，适观而已矣。","tr":"不过是图眼前痛快，适合观赏罢了。","p":5,"r":0},{"t":"今取人则不然。","tr":"如今用人却不是这样。","p":5,"r":0},{"t":"不问可否，不论曲直，非秦者去，为客者逐。","tr":"不问可用不可用，不论是非曲直，不是秦国人的就赶走，是客卿的就驱逐。","p":5,"r":0},{"t":"然则是所重者在乎色乐珠玉，而所轻者在乎人民也。","tr":"这样看来，您所看重的是美色、音乐、珠宝美玉，而所轻视的却是人才百姓。","p":5,"r":0},{"t":"此非所以跨海内、制诸侯之术也。","tr":"这不是用来统一天下、制服诸侯的办法。","p":5,"r":0},{"t":"臣闻地广者粟多，国大者人众，兵强则士勇。","tr":"我听说土地广阔粮食就多，国家庞大人口就众，兵力强盛士卒就勇敢。","p":6,"r":1},{"t":"是以太山不让土壤，故能成其大；河海不择细流，故能就其深；","tr":"所以泰山不拒绝细小的泥土，才能成就它的高大；河海不舍弃细小的溪流，才能成就它的深广；","p":6,"r":1},{"t":"王者不却众庶，故能明其德。","tr":"成就王业的人不拒绝百姓，才能彰明他的德行。","p":6,"r":1},{"t":"是以地无四方，民无异国，四时充美，鬼神降福，此五帝、三王之所以无敌也。","tr":"因此土地不分四方，百姓不分异国，一年四季充实美好，鬼神降下福佑，这就是五帝、三王能天下无敌的原因。","p":6,"r":1},{"t":"今乃弃黔首以资敌国，却宾客以业诸侯，","tr":"如今却抛弃百姓去资助敌国，拒绝宾客去成就诸侯的霸业，","p":6,"r":1},{"t":"使天下之士退而不敢西向，裹足不入秦，此所谓“藉寇兵而赍盗粮”者也。","tr":"使天下的贤士退却而不敢向西，裹足不前不入秦国，这就是人们所说的“借兵器给敌寇，送粮食给盗贼”啊。","p":6,"r":1},{"t":"夫物不产于秦，可宝者多；士不产于秦，而愿忠者众。","tr":"物品不出产于秦国而值得珍视的很多；贤士不出生在秦国而愿意效忠的也很多。","p":7,"r":1},{"t":"今逐客以资敌国，损民以益雠，内自虚而外树怨于诸侯，","tr":"如今驱逐客卿去资助敌国，减损百姓去增益仇敌，使自己内部空虚而对外与诸侯结怨，","p":7,"r":1},{"t":"求国无危，不可得也。","tr":"想要国家没有危险，是不可能的了。","p":7,"r":1}],"notes":[{"u":0,"w":"窃","m":"私下（谦辞）","t":"实词","d":["偷盗","悄悄地"]},{"u":0,"w":"过","m":"错误","t":"实词","d":["经过","超过"]},{"u":1,"w":"来","m":"使……前来，招来","t":"词类活用","d":[]},{"u":2,"w":"霸","m":"称霸","t":"词类活用","d":[]},{"u":2,"w":"并","m":"兼并，吞并","t":"实词","d":["并且","一起"]},{"u":4,"w":"举","m":"攻取，占领","t":"实词","d":["举起","推举"]},{"u":5,"w":"拔","m":"攻占","t":"实词","d":["拔出","提拔"]},{"u":6,"w":"包","m":"囊括，并吞","t":"实词","d":["包裹","包含"]},{"u":7,"w":"从","m":"通“纵”，合纵","t":"通假","d":["跟从","随从"]},{"u":7,"w":"西面","m":"向西（名词作状语）","t":"词类活用","d":[]},{"u":8,"w":"蚕食","m":"像蚕吃桑叶一样逐步侵吞（名词作状语）","t":"词类活用","d":[]},{"u":11,"w":"内","m":"通“纳”，接纳","t":"通假","d":["里面","内部"]},{"u":11,"w":"向使","m":"假如当初","t":"实词","d":["面向使者","朝向"]},{"u":12,"w":"服","m":"佩带","t":"实词","d":["服从","衣服"]},{"u":13,"w":"说","m":"通“悦”，喜爱","t":"通假","d":["说话","学说"]},{"u":15,"w":"实","m":"使……充实","t":"词类活用","d":[]},{"u":23,"w":"去","m":"离开，赶走","t":"古今异义","d":["前往","除去"]},{"u":27,"w":"让","m":"辞却，拒绝","t":"实词","d":["责备","转让"]},{"u":27,"w":"择","m":"舍弃，抛弃","t":"实词","d":["选择","挑选"]},{"u":28,"w":"却","m":"拒绝","t":"实词","d":["退却","反而"]},{"u":30,"w":"黔首","m":"平民百姓","t":"古今异义","d":["黑头发的少年","头戴黑巾的人"]},{"u":30,"w":"资","m":"资助，供给","t":"实词","d":["资本","资质"]},{"u":30,"w":"业","m":"使……成就霸业","t":"词类活用","d":[]},{"u":31,"w":"藉","m":"借给","t":"实词","d":["凭借","枕藉"]},{"u":31,"w":"赍","m":"送给","t":"实词","d":["携带","怀抱"]},{"u":33,"w":"雠","m":"通“仇”，仇敌","t":"通假","d":["校对","报答"]},{"u":24,"w":"所重者在乎色乐珠玉","m":"“者……也”表判断的句式","t":"特殊句式","d":[]}],"tricky":["缪","駃騠","瓮","缶","髀","黔","赍","雠"],"keyLines":[{"u":27,"hint":"李斯用泰山和河海作比，说明包容细小方能成就伟大的两句是："},{"u":31,"hint":"李斯指出逐客等于帮助敌人，所用的比喻性引语是："},{"u":23,"hint":"李斯批评秦王用人时不问是非曲直、只看出身国别的句子是："},{"u":24,"hint":"概括秦王“重物轻人”倾向的句子是："},{"u":34,"hint":"文章结尾指出逐客后果的一句是："}],"appr":[{"q":"第一部分列举四位秦君，作用是什么？","a":"先用穆公、孝公、惠王、昭王借客卿成就霸业的史实作论据，证明客卿对秦国有大功，自然得出“客何负于秦”的结论，有力驳斥逐客之议。"},{"q":"文章为什么大量铺陈珠玉、美女、音乐？有何论证效果？","a":"作者用秦王喜爱外来珍宝美色音乐，与驱逐外来人才形成鲜明对比，指出其“重物轻人”的矛盾，采用类比与对比，说服力强，且委婉不冲撞君主。"},{"q":"“太山不让土壤”几句运用了什么论证方法？","a":"运用比喻论证，以泰山、河海能成其大、成其深，类比君王广纳人才才能成就大业，由物及人，形象说理，并引出逐客等于资敌的危害。"}]},{"id":"h1b-w08","volume":"h1b","title":"与妻书","author":"林觉民","dynasty":"清","genre":"书信","kind":"prose","intro":"1911年广州起义前夕，同盟会会员林觉民在香港写下这封给妻子陈意映的绝笔信，随后参加黄花岗之役，被捕就义。","theme":"以夫妻深情映衬舍小家为天下人的大爱，表达为国牺牲、为众生谋福的崇高襟怀。","tags":["抒情","爱国","书信"],"units":[{"t":"意映卿卿如晤：","tr":"意映亲爱的妻子，见字如面：","p":0,"r":0},{"t":"吾今以此书与汝永别矣！","tr":"我现在用这封信和你永远告别了！","p":0,"r":0},{"t":"吾作此书时，尚是世中一人；汝看此书时，吾已成为阴间一鬼。","tr":"我写这封信的时候，还是人世间的一个人；你读这封信的时候，我已经成了阴间的一个鬼。","p":0,"r":0},{"t":"吾作此书，泪珠和笔墨齐下，不能竟书而欲搁笔，","tr":"我写这封信，泪水和笔墨一起落下，写不完而想放下笔，","p":0,"r":0},{"t":"又恐汝不察吾衷，谓吾忍舍汝而死，谓吾不知汝之不欲吾死也，故遂忍悲为汝言之。","tr":"又担心你不了解我的心意，以为我狠心丢下你去死，以为我不知道你不愿我死，所以还是忍着悲痛为你说一说。","p":0,"r":0},{"t":"吾至爱汝，即此爱汝一念，使吾勇于就死也。","tr":"我极其爱你，正是这爱你的一念，使我有勇气去赴死。","p":1,"r":1},{"t":"吾自遇汝以来，常愿天下有情人都成眷属；","tr":"我自从遇见你以来，常常希望天下有情的人都能结为夫妻；","p":1,"r":1},{"t":"然遍地腥云，满街狼犬，称心快意，几家能够？","tr":"但如今遍地是血腥的乌云，满街是豺狼恶犬，称心如意的人家，能有几家？","p":1,"r":1},{"t":"司马青衫，吾不能学太上之忘情也。","tr":"像白居易那样泪湿青衫，我做不到像至高的圣人那样忘却感情。","p":1,"r":1},{"t":"语云：仁者“老吾老以及人之老，幼吾幼以及人之幼”。","tr":"古话说：仁爱的人，“尊敬自己的长辈，推及尊敬别人的长辈；爱护自己的孩子，推及爱护别人的孩子”。","p":1,"r":1},{"t":"吾充吾爱汝之心，助天下人爱其所爱，所以敢先汝而死，不顾汝也。","tr":"我扩大我爱你的这份心，去帮助天下人爱他们所爱的人，所以才敢于先你而死，不顾及你。","p":1,"r":1},{"t":"汝体吾此心，于啼泣之余，亦以天下人为念，","tr":"你体会我这份心意，在哭泣之后，也把天下人放在心上，","p":1,"r":1},{"t":"当亦乐牺牲吾身与汝身之福利，为天下人谋永福也。","tr":"就应当也乐意牺牲我和你个人的幸福，为天下人谋求永久的幸福。","p":1,"r":1},{"t":"汝其勿悲！","tr":"你不要悲伤！","p":1,"r":1},{"t":"汝忆否？四五年前某夕，吾尝语曰：“与使吾先死也，无宁汝先吾而死。”","tr":"你还记得吗？四五年前的一个晚上，我曾说：“与其让我先死，不如你先我而死。”","p":2,"r":0},{"t":"汝初闻言，颇带怒意，后经吾婉解，遂亦无言。","tr":"你刚听到时很生气，后来经我委婉解释，才不再说什么。","p":2,"r":0},{"t":"吾之意盖谓以汝之弱，必不能禁失吾之悲，吾先死，留苦痛与汝，吾心不忍，故宁请汝先死，吾担悲也。","tr":"我的意思是说，凭你的柔弱，必定承受不了失去我的悲痛；我先死，把痛苦留给你，我心里不忍，所以宁可请你先死，由我来承担悲伤。","p":2,"r":0},{"t":"嗟夫！谁知吾卒先汝而死乎！","tr":"唉！谁知道我终究还是先你而死了呢！","p":2,"r":0},{"t":"吾真真不能忘汝也！","tr":"我实在是忘不了你啊！","p":2,"r":0},{"t":"回忆后街之屋，进门穿廊，入前后厅，又三折，有小厅，厅旁一室，为吾与汝双栖之所。","tr":"回想后街的那座屋子，进门穿过走廊，进入前后厅，再转三个弯，有一间小厅，厅旁一间房，是我和你共同居住的地方。","p":2,"r":0},{"t":"初婚三四个月，适冬之望日前后，窗外疏梅筛月影，依稀掩映；","tr":"新婚三四个月时，正逢冬天的十五前后，窗外稀疏的梅花把月光筛成斑驳的影子，隐隐约约相互掩映；","p":2,"r":0},{"t":"吾与汝并肩携手，低低切切，何事不语？何情不诉？及今思之，空余泪痕。","tr":"我和你并肩携手，低声细语，什么事不说？什么情不诉？到如今想起来，只剩下泪痕了。","p":2,"r":0},{"t":"吾诚愿与汝相守以死，第以今日事势观之，","tr":"我确实愿意和你相守到死，只是就今日的形势来看，","p":3,"r":1},{"t":"天灾可以死，盗贼可以死，列强瓜分之日可以死，奸官污吏虐民之日可以死，","tr":"天灾可以使人死，盗贼可以使人死，列强瓜分中国的日子可以使人死，奸官污吏虐待百姓的日子也可以使人死，","p":3,"r":1},{"t":"吾辈处今日之中国，国中无地无时不可以死。","tr":"我们生活在今天的中国，国内没有哪个地方、哪个时候不可能死去。","p":3,"r":1},{"t":"到那时使吾眼睁睁看汝死，或使汝眼睁睁看我死，吾能之乎？汝能之乎？","tr":"到那时，让我眼睁睁看着你死，或者让你眼睁睁看着我死，我受得了吗？你受得了吗？","p":3,"r":1},{"t":"即可不死，而天下人之死与离散者，不可数计，钟情如我辈者，能忍之乎？","tr":"即使可以不死，可天下人的死亡与离散数也数不清，像我们这样钟情的人，能忍心吗？","p":3,"r":1},{"t":"此吾所以敢率性先汝而死，不顾汝也。","tr":"这就是我敢于径直先你而死、不顾念你的原因。","p":3,"r":1},{"t":"吾今死无余憾，国事成不成自有同志者在。","tr":"我如今死而无憾，国事成功与否，自有志同道合的人在。","p":4,"r":0},{"t":"依新已五岁，转眼成人，汝其善抚之。","tr":"依新已经五岁，转眼就会长大成人，你要好好抚养他。","p":4,"r":0},{"t":"吾平日不信有鬼，而今则又望其真有；","tr":"我平时不相信有鬼，如今却又希望真有鬼；","p":4,"r":0},{"t":"今人又言心电感应有道，吾亦望其言是实，","tr":"现在的人又说心灵感应有它的道理，我也希望这话是真的，","p":4,"r":0},{"t":"则吾之死，吾灵尚依依旁汝，汝不必以无侣悲。","tr":"那么我死之后，我的魂灵还依恋地守在你身旁，你不必因为没有伴侣而悲伤。","p":4,"r":0},{"t":"吾今不能见汝矣！","tr":"我如今不能再见到你了！","p":4,"r":0},{"t":"汝不能舍吾，其时时于梦中得我乎？一恸！","tr":"你舍不得我，大概会常常在梦中见到我吧？痛哭一声！","p":4,"r":0}],"notes":[{"u":3,"w":"竟","m":"完毕，完成","t":"实词","d":["最终","竟然"]},{"u":4,"w":"察","m":"了解，体察","t":"实词","d":["检查","观察"]},{"u":4,"w":"衷","m":"内心","t":"实词","d":["中间","衣服"]},{"u":4,"w":"忍","m":"狠心","t":"实词","d":["忍耐","残忍"]},{"u":5,"w":"就","m":"赴，走向","t":"实词","d":["完成","就是"]},{"u":6,"w":"眷属","m":"夫妻（古义）","t":"古今异义","d":["亲属","家眷"]},{"u":8,"w":"太上","m":"最上等的人，圣人","t":"古今异义","d":["太上皇","至高无上的神"]},{"u":8,"w":"忘情","m":"不为感情所牵动","t":"实词","d":["忘记感情","没有情义"]},{"u":9,"w":"老吾老","m":"前一个“老”：尊敬、敬爱（意动）","t":"词类活用","d":[]},{"u":9,"w":"幼吾幼","m":"前一个“幼”：爱护（意动）","t":"词类活用","d":[]},{"u":10,"w":"充","m":"扩大，推广","t":"实词","d":["充满","充当"]},{"u":10,"w":"爱其所爱","m":"爱他们所爱的人","t":"特殊句式","d":[]},{"u":11,"w":"体","m":"体会","t":"实词","d":["身体","形体"]},{"u":14,"w":"无宁","m":"不如，宁可","t":"实词","d":["没有安宁","不愿意"]},{"u":16,"w":"禁","m":"承受","t":"实词","d":["禁止","禁忌"]},{"u":16,"w":"担悲","m":"承担悲痛","t":"实词","d":["担心悲伤","挑着悲哀"]},{"u":17,"w":"卒","m":"终究，终于","t":"实词","d":["士兵","死亡"]},{"u":20,"w":"望日","m":"农历每月十五","t":"实词","d":["盼望的日子","朔日"]},{"u":22,"w":"第","m":"只是，但","t":"实词","d":["第一","次第"]},{"u":22,"w":"事势","m":"形势","t":"古今异义","d":["事情的权势","世事变化"]},{"u":27,"w":"率性","m":"径直，任性而为","t":"实词","d":["坦率","性情"]},{"u":32,"w":"依依","m":"依恋不舍的样子","t":"实词","d":["隐约的样子","柔弱的样子"]}],"tricky":["卿","晤","搁","衷","憾","恸","眷"],"keyLines":[{"u":5,"hint":"林觉民说明自己之所以勇于赴死，是因为深爱妻子的句子是："},{"u":10,"hint":"表明作者把对妻子的爱推及天下人，因而敢于先妻而死的句子是："},{"u":6,"hint":"《与妻书》中，作者表达希望天下有情人都能结为夫妻的愿望的句子是："},{"u":7,"hint":"概括当时社会黑暗、恶势力横行的句子是："},{"u":25,"hint":"作者设想国家动荡之下夫妻双方都不愿看到对方死去的情形的句子是："}],"appr":[{"q":"“吾至爱汝，即此爱汝一念，使吾勇于就死也”表达了怎样的情感逻辑？","a":"作者把爱妻之情与赴死决心联系起来：正因为深爱，才不愿天下有情人遭受离散死亡，所以勇于就义。个人之爱升华为对天下人的大爱，使情感更厚重。"},{"q":"文中回忆“后街之屋”有什么作用？","a":"细致的生活回忆写出夫妻往日恩爱的温馨，与眼前的诀别形成强烈对比，使“忍舍”的痛苦更突出，也让后文舍小家为大家的抉择更显悲壮感人。"},{"q":"本文语言上有何特点？","a":"文字近文言而情真意切，长短句交错，多用反问、设问（如“吾能之乎？汝能之乎？”），感情由浓而深，既有缠绵悱恻，又有慷慨激昂，极富感染力。"}]},{"id":"h1b-w09","volume":"h1b","title":"促织","author":"蒲松龄","dynasty":"清","genre":"文言短篇小说","kind":"prose","intro":"选自《聊斋志异》。作者借明宣德年间宫廷斗蟋蟀、民间被迫进贡的故事，写一个普通人家的悲欢，揭露封建统治者的荒唐与官吏的贪虐。","theme":"通过成名一家因蟋蟀而家破人亡又因蟋蟀暴富的离奇遭遇，批判统治者玩物扰民，揭露官府对百姓的压榨。","tags":["小说","讽刺","社会批判"],"units":[{"t":"宣德间，宫中尚促织之戏，岁征民间。","tr":"明朝宣德年间，皇宫里盛行斗蟋蟀的游戏，每年向民间征收蟋蟀。","p":0,"r":1},{"t":"此物故非西产；有华阴令欲媚上官，以一头进，","tr":"这东西本来不是陕西出产的；有个华阴县令想讨好上司，献上一只，","p":0,"r":1},{"t":"试使斗而才，因责常供。","tr":"试着让它斗，发现很能斗，于是上司规定要他经常进贡。","p":0,"r":1},{"t":"令以责之里正。","tr":"县令又把这差事摊派给里正。","p":0,"r":1},{"t":"市中游侠儿得佳者笼养之，昂其直，居为奇货。","tr":"街市上的游手好闲之徒得到好蟋蟀就用笼子养着，抬高价钱，当作稀罕货囤积。","p":0,"r":1},{"t":"里胥猾黠，假此科敛丁口，","tr":"里胥狡猾，借这件事向百姓按人头摊派征收，","p":0,"r":1},{"t":"每责一头，辄倾数家之产。","tr":"每征一只，常常要使几户人家倾家荡产。","p":0,"r":1},{"t":"邑有成名者，操童子业，久不售。","tr":"县里有个叫成名的人，是个读书人，长期没考中秀才。","p":1,"r":0},{"t":"为人迂讷，遂为猾胥报充里正役，百计营谋不能脱。","tr":"他为人迂腐不善言辞，于是被狡猾的差役上报充当里正，想尽办法也摆脱不了。","p":1,"r":0},{"t":"不终岁，薄产累尽。","tr":"不到一年，微薄的家产就被耗尽了。","p":1,"r":0},{"t":"会征促织，成不敢敛户口，而又无所赔偿，忧闷欲死。","tr":"正赶上征收蟋蟀，成名不敢向百姓摊派，自己又无力赔补，愁闷得想死。","p":1,"r":0},{"t":"妻曰：“死何益？不如自行搜觅，冀有万一之得。”","tr":"妻子说：“死有什么用？不如自己去寻找，希望能有万分之一的收获。”","p":1,"r":0},{"t":"成然之。早出暮归，提竹筒丝笼，探石寻壁，靡计不施，迄无济。","tr":"成名同意了。他早出晚归，提着竹筒和丝笼，探石洞找墙缝，什么办法都用了，始终没有结果。","p":1,"r":0},{"t":"即捕得三两头，又劣弱不中于款。","tr":"即使捉到两三只，也是低劣瘦弱，不合规格。","p":1,"r":0},{"t":"宰严限追比，旬余，杖至百，","tr":"县官严定期限追缴，十几天里，成名被打了上百板，","p":1,"r":0},{"t":"两股间脓血流离，并虫不能行捉矣。","tr":"两条大腿间脓血淋漓，连捉蟋蟀都走不动了。","p":1,"r":0},{"t":"转侧床头，惟思自尽。","tr":"他在床上翻来覆去，只想自杀。","p":1,"r":0},{"t":"时村中来一驼背巫，能以神卜。","tr":"这时村里来了个驼背女巫，能用神灵占卜。","p":2,"r":0},{"t":"成妻具资诣问。","tr":"成名的妻子备好钱财前去求问。","p":2,"r":0},{"t":"见红女白婆，填塞门户。","tr":"只见年轻妇女和老太太，挤满了门口。","p":2,"r":0},{"t":"入其室，则密室垂帘，帘外设香几。","tr":"进到她的屋里，只见密室挂着帘子，帘外设着香案。","p":2,"r":0},{"t":"问者爇香于鼎，再拜。","tr":"求问的人在香炉里点上香，拜两拜。","p":2,"r":0},{"t":"巫从旁望空代祝，唇吻翕辟，不知何词。","tr":"女巫在旁对着空中替他们祷告，嘴唇一张一合，不知说些什么。","p":2,"r":0},{"t":"各各竦立以听。","tr":"大家都恭敬地站着听。","p":2,"r":0},{"t":"少间，帘内掷一纸出，即道人意中事，无毫发爽。","tr":"一会儿，帘内扔出一张纸，上面正说出求问人心中的事，丝毫不差。","p":2,"r":0},{"t":"成妻纳钱案上，焚拜如前人。","tr":"成名的妻子把钱放在桌上，像前面的人那样烧香跪拜。","p":2,"r":0},{"t":"食顷，帘动，片纸抛落。","tr":"大约一顿饭工夫，帘子动了，一张小纸扔了下来。","p":2,"r":0},{"t":"拾视之，非字而画：中绘殿阁，类兰若；","tr":"捡起来一看，不是字而是画：中间画着殿阁，像寺院；","p":2,"r":0},{"t":"后小山下，怪石乱卧，针针丛棘，青麻头伏焉；","tr":"后面小山下，怪石横七竖八，细小的荆棘丛丛，一只青麻头蟋蟀伏在里面；","p":2,"r":0},{"t":"旁一蟆，若将跃舞。","tr":"旁边有一只蟾蜍，好像要跳起来。","p":2,"r":0},{"t":"展玩不可晓。然睹促织，隐中胸怀，","tr":"她展开细看不明白。但看到画有蟋蟀，暗合心事，","p":2,"r":0},{"t":"折藏之，归以示成。","tr":"便折好收起，回家拿给成名看。","p":2,"r":0},{"t":"成反复自念，得无教我猎虫所耶？","tr":"成名反复思量，莫非是指点我捕捉蟋蟀的地方？","p":3,"r":0},{"t":"细瞻景状，与村东大佛阁真逼似。","tr":"仔细看画上的景物，和村东的大佛阁非常相像。","p":3,"r":0},{"t":"乃强起扶杖，执图诣寺后，有古陵蔚起。","tr":"于是勉强起身拄着拐杖，拿着画到寺后，那里有座古坟高高隆起。","p":3,"r":0},{"t":"循陵而走，见蹲石鳞鳞，俨然类画。","tr":"他沿着古坟走，见蹲伏的石头一层层的，很像画上的样子。","p":3,"r":0},{"t":"遂于蒿莱中侧听徐行，如寻针芥。","tr":"就在野草丛中侧耳细听慢慢走，像寻找针尖草芥一样。","p":3,"r":0},{"t":"而心目耳力俱穷，绝无踪影。","tr":"可是心思、眼力、耳力都用尽了，一点踪影也没有。","p":3,"r":0},{"t":"冥搜未已，一蟆突出。","tr":"他仍在专心搜寻，忽然一只蟾蜍跳出。","p":3,"r":0},{"t":"成骇立，趁赴之，蟆入草间。","tr":"成名吃惊地站住，追过去，蟾蜍跳进草丛。","p":3,"r":0},{"t":"蹑迹披求，见有虫伏棘根，遽扑之，入石穴中。","tr":"他循着踪迹拨开草寻找，见一只虫趴在荆棘根上，急忙扑去，虫钻进石洞。","p":3,"r":0},{"t":"掭以尖草不出；以筒水灌之，始出，状极俊健。","tr":"用尖草拨弄它不出来；用竹筒灌水，才出来，样子非常俊健。","p":3,"r":0},{"t":"逐而得之。审视，巨身修尾，青项金翅。","tr":"追上捉住了它。仔细一看，身体硕大尾巴细长，青脖子金翅膀。","p":3,"r":0},{"t":"大喜，笼归，举家庆贺，虽连城拱璧不啻也。","tr":"他非常高兴，装进笼子带回家，全家庆贺，即使价值连城的大玉璧也比不上。","p":3,"r":0},{"t":"上于盆而养之，蟹白栗黄，备极护爱，","tr":"把它放进盆里养着，喂蟹肉和栗子粉，百般爱护，","p":3,"r":0},{"t":"留待限期，以塞官责。","tr":"留着等到期限，用来应付官府的责令。","p":3,"r":0},{"t":"成有子九岁，窥父不在，窃发盆。","tr":"成名有个九岁的儿子，趁父亲不在，偷偷打开了盆。","p":4,"r":0},{"t":"虫跃掷径出，迅不可捉。","tr":"蟋蟀一跳就蹿出来，快得抓不住。","p":4,"r":0},{"t":"及扑得，已股落腹裂，斯须就毙。","tr":"等扑到手，它已经腿断肚裂，一会儿就死了。","p":4,"r":0},{"t":"儿惧，啼告母。母闻之，面色灰死，","tr":"孩子害怕，哭着告诉母亲。母亲听后，脸色灰白如死，","p":4,"r":0},{"t":"大惊曰：“业根，死期至矣！而翁归，自与汝复算耳！”","tr":"惊慌地说：“孽种，你的死期到了！你父亲回来，再跟你算账！”","p":4,"r":0},{"t":"儿涕而出。","tr":"孩子哭着跑了出去。","p":4,"r":0},{"t":"未几，成归，闻妻言，如被冰雪。","tr":"不久，成名回来，听了妻子的话，如同被冰雪浇身。","p":5,"r":0},{"t":"怒索儿，儿渺然不知所往。","tr":"他怒气冲冲找儿子，儿子杳无踪影，不知去了哪里。","p":5,"r":0},{"t":"既而得其尸于井。因而化怒为悲，抢呼欲绝。","tr":"不久在井里找到了儿子的尸体。他由怒转悲，呼天抢地几乎要昏死过去。","p":5,"r":0},{"t":"夫妻向隅，茅舍无烟，相对默然，不复聊赖。","tr":"夫妻俩面壁而泣，茅屋里不冒炊烟，相对无言，没有一点依靠和生趣。","p":5,"r":0},{"t":"日将暮，取儿藁葬。近抚之，气息惙然。","tr":"天快黑了，他们拿来草席准备埋葬儿子。靠近一摸，还有微弱的气息。","p":5,"r":0},{"t":"喜置榻上，半夜复苏。","tr":"他们高兴地把儿子放到床上，半夜醒了过来。","p":5,"r":0},{"t":"夫妻心稍慰，但儿神气痴木，奄奄思睡。","tr":"夫妻俩心里稍感安慰，只是孩子神情呆滞，气息微弱只想睡。","p":5,"r":0},{"t":"成顾蟋蟀笼虚，则气断声吞，亦不复以儿为念，","tr":"成名看到蟋蟀笼空了，就气息中断、声音咽住，也不再挂念儿子，","p":5,"r":0},{"t":"自昏达曙，目不交睫。","tr":"从黄昏到天亮，眼睛没合过。","p":5,"r":0},{"t":"东曦既驾，僵卧长愁。","tr":"太阳升起，他直挺挺躺着发愁。","p":5,"r":0},{"t":"忽闻门外虫鸣，惊起觇视，虫宛然尚在。","tr":"忽然听到门外有虫鸣，惊起查看，那虫好好地还在。","p":5,"r":0},{"t":"喜而捕之，一鸣辄跃去，行且速。","tr":"他高兴地去捉，它叫一声就跳开，跑得又快。","p":5,"r":0},{"t":"覆之以掌，虚若无物；手裁举，则又超忽而跃。","tr":"用手掌罩住它，掌心空空好像什么也没有；手刚抬起，它又忽地跳走。","p":5,"r":0},{"t":"急趋之，折过墙隅，迷其所往。","tr":"他急忙追，转过墙角，不知它去向。","p":5,"r":0},{"t":"徘徊四顾，见虫伏壁上。审谛之，短小，黑赤色，","tr":"他来回四顾，见一只虫趴在墙壁上。细看，身体短小，黑红色，","p":5,"r":0},{"t":"顿非前物。成以其小，劣之。","tr":"完全不是先前那只。成名因为它小，觉得它不好。","p":5,"r":0},{"t":"惟徘徊瞻顾，寻所逐者。","tr":"只顾来回张望，寻找刚才追的那只。","p":5,"r":0},{"t":"壁上小虫忽跃落襟袖间，视之，","tr":"墙上的小虫忽然跳落到他衣襟袖子上，一看，","p":5,"r":0},{"t":"形若土狗，梅花翅，方首，长胫，意似良。","tr":"样子像土狗，梅花翅，方头，长腿，似乎是只好虫。","p":5,"r":0},{"t":"喜而收之。将献公堂，惴惴恐不当意，","tr":"他高兴地收下。打算献给官府，又担心不合上意，心里忐忑，","p":5,"r":0},{"t":"思试之斗以觇之。","tr":"想先让它斗一斗来试探它的本领。","p":5,"r":0},{"t":"村中少年好事者，驯养一虫，自名“蟹壳青”，","tr":"村里有个爱凑热闹的少年，驯养了一只蟋蟀，自己取名“蟹壳青”，","p":6,"r":0},{"t":"日与子弟角，无不胜。","tr":"每天和同伴们斗，没有不赢的。","p":6,"r":0},{"t":"欲居之以为利，而高其直，亦无售者。","tr":"他想囤着它牟利，抬高价钱，也没人买。","p":6,"r":0},{"t":"径造庐访成，视成所蓄，掩口胡卢而笑。","tr":"他径直到成名家拜访，看到成名养的蟋蟀，捂着嘴笑出声。","p":6,"r":0},{"t":"因出己虫，纳盆中。成视之，庞然修伟，","tr":"于是拿出自己的蟋蟀，放进盆里。成名一看，身躯高大魁梧，","p":6,"r":0},{"t":"自增惭怍，不敢与较。少年固强之。","tr":"自己更加惭愧，不敢和他较量。少年一再硬要比。","p":6,"r":0},{"t":"顾念蓄劣物终无所用，不如拼博一笑，因合纳斗盆。","tr":"成名想到养着劣等的虫终究没用，不如拼着让人一笑，于是一起放进斗盆。","p":6,"r":0},{"t":"小虫伏不动，蠢若木鸡。少年又大笑。","tr":"小虫趴着不动，呆呆的像只木鸡。少年又大笑。","p":6,"r":0},{"t":"试以猪鬣毛，撩拨虫须，仍不动。少年又笑。","tr":"他试着用猪鬃毛拨弄小虫的须，它仍不动。少年又笑。","p":6,"r":0},{"t":"屡撩之，虫暴怒，直奔，遂相腾击，振奋作声。","tr":"多次撩拨后，小虫勃然大怒，直冲过去，于是互相腾跃搏击，振翅发出声响。","p":6,"r":0},{"t":"俄见小虫跃起，张尾伸须，直龁敌领。","tr":"一会儿，只见小虫跃起，张开尾巴伸直须，直咬敌手的脖颈。","p":6,"r":0},{"t":"少年大骇，急解令休止。","tr":"少年大惊，急忙拉开让它们停止。","p":6,"r":0},{"t":"虫翘然矜鸣，似报主知。成大喜。","tr":"小虫昂首得意地鸣叫，好像在报答主人的知遇。成名大喜。","p":6,"r":0},{"t":"方共瞻玩，一鸡瞥来，径进一啄。","tr":"正一起观赏时，一只鸡忽然冲过来，径直上前一啄。","p":7,"r":0},{"t":"成惊呼，幸啄不中，虫跃去尺有咫。","tr":"成名惊叫，幸好没啄中，虫跳开一尺多远。","p":7,"r":0},{"t":"鸡健进，逐逼之，虫已在爪下矣。","tr":"鸡猛然逼近追赶，虫已在鸡爪下了。","p":7,"r":0},{"t":"成仓猝莫知所救，顿足失色。","tr":"成名仓促间不知如何相救，跺脚吓得变了脸色。","p":7,"r":0},{"t":"旋见鸡伸颈摆扑，临视，则虫集鸡冠，力叮不释。","tr":"随即见鸡伸长脖子摆动扑打，走近一看，虫已落在鸡冠上，死死叮住不松口。","p":7,"r":0},{"t":"成益惊喜，掇置笼中。","tr":"成名更加惊喜，捡起放进笼子里。","p":7,"r":0},{"t":"翼日进宰，宰见其小，怒呵成。","tr":"第二天把它献给县官，县官见它小，怒斥成名。","p":8,"r":0},{"t":"成述其异，宰不信。试与他虫斗，虫尽靡。","tr":"成名讲述它的奇异之处，县官不信。试着让它和别的虫斗，别的虫全败了。","p":8,"r":0},{"t":"又试之鸡，果如成言。乃赏成，献诸抚军。","tr":"又拿鸡来试，果然像成名说的。于是赏赐成名，把虫献给巡抚。","p":8,"r":0},{"t":"抚军大悦，以金笼进上，细疏其能。","tr":"巡抚很高兴，用金笼进献皇上，详细上奏它的本领。","p":8,"r":0},{"t":"既入宫中，举天下所贡蝴蝶、螳螂、油利挞、青丝额一切异状，","tr":"它进宫后，把全国进贡的蝴蝶、螳螂、油利挞、青丝额等各种奇异的蟋蟀，","p":8,"r":0},{"t":"遍试之，莫出其右者。","tr":"都拿来比试，没有一只能胜过它。","p":8,"r":0},{"t":"每闻琴瑟之声，则应节而舞。益奇之。","tr":"每当听到琴瑟的声音，它就合着节拍起舞。皇上更觉得神奇。","p":8,"r":0},{"t":"上大嘉悦，诏赐抚臣名马衣缎。","tr":"皇上非常高兴，下诏赏赐巡抚名马和衣料。","p":8,"r":0},{"t":"抚军不忘所自，无何，宰以卓异闻。","tr":"巡抚没忘记这虫的来历，不久，县官因政绩卓异而被上报。","p":8,"r":0},{"t":"宰悦，免成役，又嘱学使，俾入邑庠。","tr":"县官高兴，免了成名的差役，又嘱咐学官，让成名入县学为秀才。","p":8,"r":0},{"t":"后岁余，成子精神复旧，自言：","tr":"一年多后，成名的儿子精神恢复，自己说：","p":8,"r":0},{"t":"“身化促织，轻捷善斗，今始苏耳。”","tr":"“我变成了蟋蟀，轻捷善斗，现在才醒过来。”","p":8,"r":0},{"t":"抚军亦厚赉成。","tr":"巡抚也重重赏赐成名。","p":8,"r":0},{"t":"不数岁，田百顷，楼阁万椽，牛羊蹄躈各千计；","tr":"没几年，成名有了百顷田地，万间楼阁，牛羊各数以千计；","p":8,"r":0},{"t":"一出门，裘马过世家焉。","tr":"一出门，皮袍骏马胜过世家大族。","p":8,"r":0},{"t":"异史氏曰：“天子偶用一物，未必不过此已忘；","tr":"异史氏说：“天子偶尔使用一样东西，未必不是用过就忘了；","p":9,"r":1},{"t":"而奉行者即为定例。","tr":"可是执行的人就把它当作固定的制度。","p":9,"r":1},{"t":"加以官贪吏虐，民日贴妇卖儿，更无休止。","tr":"再加上官吏贪婪暴虐，百姓天天典妻卖子，更没有止境。","p":9,"r":1},{"t":"故天子一跬步皆关民命，不可忽也。","tr":"所以天子的一举一动都关系百姓性命，不可疏忽。","p":9,"r":1},{"t":"独是成氏子以蠹贫，以促织富，裘马扬扬。","tr":"只是成名因为被差役所害而贫穷，因为蟋蟀而富有，穿裘骑马神气十足。","p":9,"r":1},{"t":"当其为里正、受扑责时，岂意其至此哉！","tr":"当他做里正、挨板子时，哪里想到会有今天！","p":9,"r":1},{"t":"天将以酬长厚者，遂使抚臣、令尹，并受促织恩荫。","tr":"上天大概是要报答忠厚的人，竟使巡抚、县令也一同受到蟋蟀的恩惠。","p":9,"r":1},{"t":"闻之：一人飞升，仙及鸡犬。信夫！”","tr":"听说：一人成仙飞升，连鸡狗也沾光。确实如此啊！”","p":9,"r":1}],"notes":[{"u":0,"w":"间","m":"期间","t":"实词","d":["中间","间隔"]},{"u":0,"w":"尚","m":"崇尚，盛行","t":"实词","d":["尚且","还"]},{"u":1,"w":"媚","m":"讨好，巴结","t":"实词","d":["美丽","喜爱"]},{"u":1,"w":"进","m":"进献","t":"实词","d":["前进","进入"]},{"u":2,"w":"才","m":"有才能，指善斗","t":"词类活用"},{"u":2,"w":"责","m":"责令，要求","t":"实词","d":["责备","责任"]},{"u":4,"w":"直","m":"同“值”，价钱","t":"通假","d":["正直","直接"]},{"u":4,"w":"居","m":"囤积","t":"实词","d":["居住","处在"]},{"u":5,"w":"里胥","m":"里中的小吏","t":"实词","d":["乡里的医生","里长"]},{"u":5,"w":"假","m":"借，借助","t":"实词","d":["假的","假期"]},{"u":6,"w":"辄","m":"总是，就","t":"虚词"},{"u":7,"w":"童子业","m":"科举应试的学业","t":"实词","d":["儿童的功课","少年的事业"]},{"u":7,"w":"售","m":"（科举）得中","t":"实词","d":["出售","卖出"]},{"u":8,"w":"迂讷","m":"迂腐而不善言辞","t":"实词","d":["迟钝愚笨","傲慢木讷"]},{"u":8,"w":"为","m":"被","t":"特殊句式"},{"u":12,"w":"然之","m":"认为她说得对","t":"词类活用"},{"u":12,"w":"靡","m":"没有","t":"实词","d":["浪费","奢靡"]},{"u":12,"w":"丝笼","m":"用细丝编成的笼","t":"实词","d":["丝线","丝绸盒子"]},{"u":13,"w":"中","m":"合，符合","t":"实词","d":["中间","射中"]}, ，提出十项具体的自警之道。","theme":"以树根与水源作比，论证国君须积德义、居安思危；并提出“十思”，劝太宗戒奢克欲、纳谏任贤。","tags":["议论","进谏","治国"],"units":[{"t":"臣闻求木之长者，必固其根本；","tr":"我听说想要树木生长得高大的，一定要稳固它的根；","p":0,"r":1},{"t":"欲流之远者，必浚其泉源；","tr":"想要水流得远的，一定要疏通它的源头；","p":0,"r":1},{"t":"思国之安者，必积其德义。","tr":"想要国家安定的，一定要积累自己的德行道义。","p":0,"r":1},{"t":"源不深而望流之远，根不固而求木之长，","tr":"源头不深却盼望水流得远，根不稳固却希望树木长得高，","p":0,"r":1},{"t":"德不厚而思国之安，臣虽下愚，知其不可，而况于明哲乎？","tr":"德行不深厚却想国家安定，我即使很愚笨，也知道不可能，何况是明智的君主呢？","p":0,"r":1},{"t":"人君当神器之重，居域中之大，","tr":"君主承担着帝位的重任，处在天地间最尊贵的位置，","p":0,"r":1},{"t":"将崇极天之峻，永保无疆之休。","tr":"应当推崇高耸入天的功业，永远保有无穷的福祉。","p":0,"r":1},{"t":"不念居安思危，戒奢以俭，","tr":"如果不想着居安思危，用节俭来戒除奢侈，","p":0,"r":1},{"t":"德不处其厚，情不胜其欲，","tr":"德行不处于深厚，感情不能战胜欲望，","p":0,"r":1},{"t":"斯亦伐根以求木茂，塞源而欲流长者也。","tr":"这也就像砍断树根却想要树木茂盛，堵住源头却想要水流长远一样。","p":0,"r":1},{"t":"凡百元首，承天景命，莫不殷忧而道著，功成而德衰。","tr":"所有的君主，承受上天的重大使命，无不在深深忧患时政治昌明，功成之后品德衰退。","p":1,"r":1},{"t":"有善始者实繁，能克终者盖寡。","tr":"有好的开头的确很多，能够坚持到底的大概很少。","p":1,"r":1},{"t":"岂取之易守之难乎？","tr":"难道是夺取天下容易而守住天下难吗？","p":1,"r":1},{"t":"昔取之而有余，今守之而不足，何也？","tr":"过去夺取天下时绰绰有余，如今守住天下却力不从心，为什么呢？","p":1,"r":1},{"t":"夫在殷忧，必竭诚以待下；","tr":"因为在深深忧患时，一定竭尽诚意对待臣民；","p":1,"r":1},{"t":"既得志，则纵情以傲物。","tr":"一旦得志，就放纵情欲而傲视他人。","p":1,"r":1},{"t":"竭诚则吴越为一体，傲物则骨肉为行路。","tr":"竭尽诚意，吴越这样的仇敌也能融为一体；傲视他人，骨肉至亲也成为陌路。","p":1,"r":1},{"t":"虽董之以严刑，振之以威怒，","tr":"即使用严刑督责他们，用威势震慑他们，","p":1,"r":1},{"t":"终苟免而不怀仁，貌恭而不心服。","tr":"他们最终也只是苟且免罪而不感念仁德，表面恭敬而内心不服。","p":1,"r":1},{"t":"怨不在大，可畏惟人；载舟覆舟，所宜深慎。","tr":"怨恨不在大小，可怕的是百姓；水能载舟也能覆舟，应当深深谨慎。","p":1,"r":1},{"t":"奔车朽索，其可忽乎？","tr":"用腐朽的绳索驾驭奔驰的马车，能够疏忽大意吗？","p":1,"r":1},{"t":"君人者，诚能见可欲，则思知足以自戒；","tr":"做君主的人，如果真能看到引起欲望的东西，就想到知足来自我警戒；","p":2,"r":1},{"t":"将有作，则思知止以安人；","tr":"将要兴建什么，就想到适可而止来安定百姓；","p":2,"r":1},{"t":"念高危，则思谦冲而自牧；","tr":"想到处在高位的危险，就想到谦虚柔和来自我修养；","p":2,"r":1},{"t":"惧满溢，则思江海下百川；","tr":"担心骄傲自满，就想到江海能处在百川之下；","p":2,"r":1},{"t":"乐盘游，则思三驱以为度；","tr":"喜欢游猎，就想到一年打猎三次作为限度；","p":2,"r":1},{"t":"忧懈怠，则思慎始而敬终；","tr":"忧虑懈怠，就想到开头谨慎并始终如一；","p":2,"r":1},{"t":"虑壅蔽，则思虚心以纳下；","tr":"担心受蒙蔽，就想到虚心接纳臣下的意见；","p":2,"r":1},{"t":"想谗邪，则思正身以黜恶；","tr":"想到谗佞奸邪，就想到端正自身来罢黜小人；","p":2,"r":1},{"t":"恩所加，则思无因喜以谬赏；","tr":"恩惠施加时，就想到不要因一时高兴而赏赐不当；","p":2,"r":1},{"t":"罚所及，则思无因怒而滥刑。","tr":"刑罚施加时，就想到不要因一时发怒而滥用刑罚。","p":2,"r":1},{"t":"总此十思，宏兹九德。","tr":"总括这十个方面的思虑，发扬那九种美德。","p":2,"r":1},{"t":"简能而任之，择善而从之，","tr":"选拔有才能的人任用他们，挑选好的意见采纳施行，","p":2,"r":1},{"t":"则智者尽其谋，勇者竭其力，","tr":"那么智者能献尽谋略，勇者能竭尽力量，","p":2,"r":1},{"t":"仁者播其惠，信者效其忠。","tr":"仁者能广施恩惠，诚信的人能献出忠心。","p":2,"r":1},{"t":"文武争驰，君臣无事，","tr":"文臣武将争相效力，君臣之间无所忧虑，","p":2,"r":1},{"t":"可以尽豫游之乐，可以养松乔之寿，","tr":"就可以尽情享受游乐，可以颐养如赤松子、王子乔那样的长寿，","p":2,"r":1},{"t":"鸣琴垂拱，不言而化。","tr":"弹着琴，垂衣拱手，不必发号施令天下就得到教化。","p":2,"r":1},{"t":"何必劳神苦思，代下司职，","tr":"何必劳费精神苦苦思虑，代替臣下去管理他们的职事，","p":2,"r":1},{"t":"役聪明之耳目，亏无为之大道哉？","tr":"役使自己聪明的耳目，损害无为而治的大道呢？","p":2,"r":1}],"notes":[{"u":0,"w":"固","m":"使……稳固","t":"词类活用"},{"u":1,"w":"浚","m":"疏通","t":"实词","d":["深","挖掘水井"]},{"u":1,"w":"泉源","m":"源头","t":"实词","d":["泉水与田地","水的来历"]},{"u":2,"w":"积","m":"积累","t":"实词","d":["堆积","面积"]},{"u":4,"w":"思","m":"想，希望","t":"实词","d":["思念","思想"]},{"u":4,"w":"下愚","m":"极愚笨（谦辞）","t":"实词","d":["地位低下的愚人","向下愚弄"]},{"u":5,"w":"当","m":"承担","t":"实词","d":["应当","面对"]},{"u":5,"w":"神器","m":"帝位","t":"典故"},{"u":5,"w":"域中","m":"天地之间","t":"实词","d":["区域之内","国境之内"]},{"u":6,"w":"崇","m":"推崇，增高","t":"实词","d":["崇拜","高尚"]},{"u":6,"w":"休","m":"福祉，美善","t":"实词","d":["休息","停止"]},{"u":7,"w":"戒","m":"戒除","t":"词类活用"},{"u":8,"w":"处","m":"处于","t":"实词","d":["居住","处理"]},{"u":8,"w":"胜","m":"战胜","t":"实词","d":["胜利","优美的"]},{"u":9,"w":"斯","m":"这","t":"虚词"},{"u":10,"w":"凡百","m":"所有，一切","t":"实词","d":["一百","平凡的百姓"]},{"u":10,"w":"景命","m":"大命，重大使命","t":"实词","d":["景色的命运","好的运势"]},{"u":10,"w":"殷忧","m":"深深忧虑","t":"实词","d":["富足而忧愁","忧伤过度"]},{"u":10,"w":"著","m":"显著，彰明","t":"实词","d":["写作","穿着"]},{"u":11,"w":"实繁","m":"确实很多","t":"实词","d":["果实繁盛","事情繁杂"]},{"u":11,"w":"克","m":"能够","t":"实词","d":["战胜","克制"]},{"u":11,"w":"盖","m":"大概","t":"虚词"},{"u":12,"w":"岂","m":"难道（表反问，与句末“乎”呼应）","t":"特殊句式"},{"u":16,"w":"竭","m":"竭尽","t":"实词","d":["干涸","枯竭"]},{"u":15,"w":"傲物","m":"傲视他人","t":"实词","d":["傲慢的东西","高 "谦冲","壅","黜","谬","滥","拱"],"keyLines":[{"u":2,"hint":"文章开头提出中心论点——想让国家安定就必须积累德义的句子是："},{"u":9,"hint":"文中用比喻批评君主不修德而求国安，如同“砍断树根而要树木茂盛、堵住源头而盼水流长远”的句子是："},{"u":11,"hint":"魏征指出历代君主多半有始无终的两句是："},{"u":16,"hint":"文中说明君主对待臣民的态度不同，结果也大不相同的两句是："},{"u":19,"hint":"魏征劝诫君主要深知民心向背重要性的两句是："},{"u":33,"hint":"魏征描述君主任用贤能后，各类人才各尽其用的四句话中，前两句是："}],"appr":[{"q":"文章开头为什么用树木和流水作比喻？","a":"用“固根本才能木长”“浚泉源才能流远”作类比，浅显而形象地说明“积德义才能国安”的道理，由具体到抽象，逻辑清晰，既增强说服力，也便于太宗接受。"},{"q":"“载舟覆舟”“奔车朽索”两个比喻分别表达了什么？","a":"“载舟覆舟”说明人民既能拥戴也能推翻君主，君民关系至关重要；“奔车朽索”以腐绳驾驭奔车喻统治危险，告诫君主要对民心保持畏惧和谨慎。"},{"q":"“十思”的写法有什么特点？","a":"十思采用排比，句式整齐，每句前半写君主可能出现的问题，后半写应有的自警对策，条理分明、语气恳切，兼顾劝谏的力度与委婉。"}]},{"id":"h1b-w11","volume":"h1b","title":"答司马谏议书","author":"王安石","dynasty":"北宋","genre":"书信（议论文）","kind":"prose","intro":"熙宁变法期间，司马光写长信指责新法，王安石以此简短的回信作答，条理分明地驳斥“侵官、生事、征利、拒谏”四项指责。","theme":"针对守旧派的非难，逐条辩驳，申明变法的正当性，表达矢志不移的改革决心。","tags":["议论","变法","书信"],"units":[{"t":"某启：昨日蒙教，窃以为与君实游处相好之日久，","tr":"我王安石禀告：昨天承蒙您赐教，我私下认为我与您交往、相处友好的日子已很长，","p":0,"r":0},{"t":"而议事每不合，所操之术多异故也。","tr":"但议论政事常常意见不合，是因为我们所持的主张大多不同的缘故。","p":0,"r":0},{"t":"虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。","tr":"虽然想硬要多说，终究必定不会被您体察，所以简略地回信，不再一一为自己辩解。","p":0,"r":0},{"t":"重念蒙君实视遇厚，于反复不宜卤莽，","tr":"又想到承蒙您待我深厚，对于书信往复不应草率，","p":0,"r":0},{"t":"故今具道所以，冀君实或见恕也。","tr":"所以现在详细说明缘由，希望您或许能够原谅。","p":0,"r":0},{"t":"盖儒者所争，尤在于名实。","tr":"读书人所争论的，尤其在于名分与实际是否相符。","p":1,"r":1},{"t":"名实已明，而天下之理得矣。","tr":"名实弄清楚了，天下的道理也就明白了。","p":1,"r":1},{"t":"今君实所以见教者，以为侵官、生事、征利、拒谏，","tr":"如今您用来指教我的，是认为我侵夺官权、惹是生非、聚敛财利、拒绝劝谏，","p":1,"r":1},{"t":"以致天下怨谤也。","tr":"因而招致天下人的怨恨和诽谤。","p":1,"r":1},{"t":"某则以为受命于人主，议法度而修之于朝廷，","tr":"我却认为，从皇上那里接受使命，在朝廷上议订法令制度并加以修订，","p":1,"r":1},{"t":"以授之于有司，不为侵官；","tr":"然后交给主管官吏去执行，不算侵夺官权；","p":1,"r":1},{"t":"举先王之政，以兴利除弊，不为生事；","tr":"推行先王的政治措施，用来兴办利事、革除弊端，不算惹是生非；","p":1,"r":1},{"t":"为天下理财，不为征利；","tr":"替天下人管理财政，不算聚敛财利；","p":1,"r":1},{"t":"辟邪说，难壬人，不为拒谏。","tr":"驳斥错误言论，抵制奸佞小人，不算拒绝劝谏。","p":1,"r":1},{"t":"至于怨诽之多，则固前知其如此也。","tr":"至于怨恨诽谤这样多，那本来就预先知道会这样的。","p":1,"r":1},{"t":"人习于苟且非一日，","tr":"人们习惯于得过且过不是一天了，","p":2,"r":1},{"t":"士大夫多以不恤国事、同俗自媚于众为善。","tr":"士大夫大多把不关心国事、附和世俗来讨好众人当作好事。","p":2,"r":1},{"t":"上乃欲变此，而某不量敌之众寡，","tr":"皇上却想改变这种风气，而我不衡量对手的多少，","p":2,"r":1},{"t":"欲出力以助上以抗之，则众何为而不汹汹然？","tr":"想出力帮助皇上来抵制它，那么众人怎么会不吵吵嚷嚷呢？","p":2,"r":1},{"t":"盘庚之迁，胥怨者民也，非特朝廷士大夫而已。","tr":"盘庚迁都时，互相抱怨的是百姓，不只是朝廷的士大夫而已。","p":2,"r":1},{"t":"盘庚不为怨者故改其度，度义而后动，","tr":"盘庚不因为有人怨恨就改变他的计划，是考虑合宜后才行动，","p":2,"r":1},{"t":"是而不见可悔故也。","tr":"认为正确就不见得有什么可后悔的缘故。","p":2,"r":1},{"t":"如君实责我以在位久，未能助上大有为，","tr":"如果您责备我在位已久，却没能帮助皇上大有作为，","p":2,"r":1},{"t":"以膏泽斯民，则某知罪矣；","tr":"来使这些百姓得到恩泽，那我知罪了；","p":2,"r":1},{"t":"如曰今日当一切不事事，守前所为而已，","tr":"如果说今天应该一概不做事，只是死守以前的做法罢了，","p":2,"r":1},{"t":"则非某之所敢知。","tr":"那就不是我所敢领教的了。","p":2,"r":1},{"t":"无由会晤，不任区区向往之至。","tr":"没有机会见面，我心中不胜向往之至。","p":3,"r":0}],"notes":[{"u":0,"w":"蒙","m":"承蒙，受到","t":"实词","d":["蒙蔽","覆盖"]},{"u":0,"w":"窃","m":"私下，谦辞","t":"实词","d":["偷窃","盗取"]},{"u":0,"w":"游处","m":"交往相处","t":"实词","d":["游玩居住","漫游之处"]},{"u":2,"w":"强聒","m":"硬在耳边啰嗦","t":"实词","d":["勉强劝说","强烈喧闹"]},{"u":2,"w":"见","m":"表被动，相当于“被”","t":"虚词"},{"u":3,"w":"卤莽","m":"同“鲁莽”，草率","t":"通假","d":["粗鲁","卤水"]},{"u":4,"w":"具","m":"详细","t":"实词","d":["具备","工具"]},{"u":4,"w":"所以","m":"……的原因","t":"古今异义","d":["表结果的连词","因此"]},{"u":4,"w":"冀","m":"希望","t":"实词","d":["冀州","盼望"]},{"u":5,"w":"盖","m":"发语词，表示论述","t":"虚词"},{"u":5,"w":"名实","m":"名分与实际","t":"实词","d":["名誉与现实","名字与事实"]},{"u":7,"w":"侵官","m":"侵夺官员职权","t":"实词","d":["侵犯官府","官吏侵略"]},{"u":7,"w":"生事","m":"挑起事端","t":"实词","d":["谋生","出生之事"]},{"u":7,"w":"征利","m":"搜刮钱财","t":"实词","d":["征求利益","征战获利"]},{"u":8,"w":"谤","m":"诽谤","t":"实词","d":["批评","谤议"]},{"u":9,"w":"法度","m":"法令制度","t":"古今异义","d":["法律的尺度","法度和气度"]},{"u":10,"w":"有司","m":"主管的官吏","t":"实词","d":["有关部门的司令","有职务的人"]},{"u":11,"w":"举","m":"推行，施行","t":"实词","d":["举起","全"]},{"u":11,"w":"兴","m":"兴办","t":"实词","d":["兴旺","高兴"]},{"u":13,"w":"辟","m":"驳斥","t":"实词","d":["开辟","躲避"]},{"u":13,"w":"难","m":"拒斥，驳难","t":"词类活用"},{"u":13,"w":"壬人","m":"奸佞小人","t":"实词","d":["壬年出生的人","贤能之人"]},{"u":14,"w":"固","m":"本来","t":"实词","d":["坚固","固执"]},{"u":15,"w":"苟且","m":"得过且过","t":"古今异义","d":["不正当","马虎"]},{"u":16,"w":"恤","m":"顾念，忧虑","t":"实词","d":["救济","体恤穷人"]},{"u":16,"w":"同俗","m":"附和世俗","t":"词类活用"},{"u":16,"w":"媚","m":"讨好","t":"实词","d":["美丽","喜欢"]},{"u":17,"w":"量","m":"估量，衡量","t":"实词","d":["容量","度量"]},{"u":18,"w":"上","m":"皇上，指宋神宗","t":"实词","d":["上面","上级"]},{"u":18,"w":"汹汹","m":"喧闹纷扰的样子","t":"实词","d":["凶猛的样子","波涛汹涌"]},{"u":19,"w":"盘庚之迁","m":"商王盘庚迁都于殷，遭到贵族和百姓怨恨","t":"典故"},{"u":19,"w":"胥","m":"相互","t":"实词","d":["全部","小官吏"]},{"u":19,"w":"特","m":"只，仅","t":"实词","d":["特别","特殊"]},{"u":20,"w":"度","m":"计划，法度","t":"实词","d":["程度","度过"]},{"u":20,"w":"度","m":"考虑，揣度","t":"实词","d":["法度","温度"]},{"u":21,"w":"是","m":"认为正确","t":"词类活用"},{"u":22,"w":"责","m":"责备","t":"实词","d":["责任","求取"]},{"u":23,"w":"膏泽","m":"使……得到恩泽","t":"词类活用"},{"u":23,"w":"知罪","m":"认罪","t":"古今异义","d":["知道罪过的人","懂得法律"]},{"u":24,"w":"事事","m":"做事（前一“事”为动词）","t":"词类活用"},{"u":25,"w":"非某之所敢知","m":"判断句式，不是我所敢领教的","t":"特殊句式"},{"u":26,"w":"区区","m":"自己的谦称，微小的心意","t":"实词","d":["数量很少","地点狭小"]},{"u":26,"w":"不任","m":"不胜","t":"实词","d":["不用","不能担任"]}],"tricky":["启","聒","卤莽","膏泽","汹汹","盘庚","辟","壬"],"keyLines":[{"u":5,"hint":"王安石提出论辩的前提，认为读书人争论的关键在于名与实的句子是："},{"u":9,"hint":"王安石反驳“侵官”指责，论述自己变法合法合规的句子是（含“议法度”）："},{"u":13,"hint":"王安石反驳“拒谏”的指责，说明自己抵制谬论、拒斥奸佞并非拒谏的句子是："},{"u":20,"hint":"文中以盘庚迁都为例，表明自己不因遭怨而改变主张的句子是："},{"u":15,"hint":"王安石指出变法遭到非议是因为众人习惯得过且过的句子是："}],"appr":[{"q":"文章是怎样逐层反驳对方四项指责的？","a":"先抓住“名实”这个关键，提出判断标准；再把四项罪名一一对应辩驳，每驳一项都先陈述事实，再点明“不为某某”；最后从遭怨的原因谈到坚持变法的决心，层次分明，有理有据。"},{"q":"文章引用盘庚迁都的事例有什么作用？","a":"盘庚迁都曾遭到贵族和百姓一致怨恨，但他认为自己的做法正确而不动摇。作者借此类比，表明改革必然遇到阻力，自己也将坚持正确主张，增强了论辩的历史厚重感和说服力。"},{"q":"这封信的语言风格有何特点？","a":"语言简洁峻切，不拐弯抹角；开头结尾保持礼貌，中间则立场鲜明，针锋相对，既尊重对方又毫不退让，体现了政治家的刚毅与自信。"}]},{"id":"h1b-w12","volume":"h1b","title":"阿房宫赋","author":"杜牧","dynasty":"唐","genre":"赋（文赋）","kind":"prose","intro":"唐敬宗大兴土木、生活奢靡，杜牧有感而作此赋，借秦朝因奢侈而灭亡的往事，向当朝统治者发出警示。","theme":"描写阿房宫的宏丽奢华，总结秦亡教训：统治者骄奢暴虐、不爱其民，必致灭亡，后人当以此为鉴。","tags":["咏史","讽喻","议论"],"units":[{"t":"六王毕，四海一；蜀山兀，阿房出。","tr":"六国诸侯灭亡了，天下统一了；蜀地的山光秃了，阿房宫出现了。","p":0,"r":1},{"t":"覆压三百余里，隔离天日。","tr":"宫殿覆盖了三百多里地面，遮天蔽日。","p":0,"r":1},{"t":"骊山北构而西折，直走咸阳。","tr":"它从骊山北面起建，向西折转，一直通到咸阳。","p":0,"r":1},{"t":"二川溶溶，流入宫墙。","tr":"渭水和樊川水势浩大，缓缓流进宫墙。","p":0,"r":1},{"t":"五步一楼，十步一阁；","tr":"五步一座楼，十步一座阁；","p":0,"r":1},{"t":"廊腰缦回，檐牙高啄；","tr":"走廊像腰带一样曲折回环，屋檐像鸟嘴一样高高翘起；","p":0,"r":1},{"t":"各抱地势，钩心斗角。","tr":"各处建筑依傍地势，彼此勾连、斗争向背，精巧工致。","p":0,"r":1},{"t":"盘盘焉，囷囷焉，蜂房水涡，","tr":"楼阁盘旋曲折，像蜂房，像水涡，","p":0,"r":1},{"t":"矗不知其几千万落！","tr":"高高耸立，不知有几千万座！","p":0,"r":1},{"t":"长桥卧波，未云何龙？","tr":"长桥横卧水上，没有云怎么会有龙？","p":0,"r":1},{"t":"复道行空，不霁何虹？","tr":"天桥凌空而过，没有雨过天晴怎么会出彩虹？","p":0,"r":1},{"t":"高低冥迷，不知西东。","tr":"房屋高低错落，迷迷糊糊，分不清西和东。","p":0,"r":1},{"t":"歌台暖响，春光融融；","tr":"歌台上乐声温暖，像春光般融和；","p":0,"r":1},{"t":"舞殿冷袖，风雨凄凄。","tr":"舞殿中衣袖生寒，如风雨凄凉。","p":0,"r":1},{"t":"一日之内，一宫之间，而气候不齐。","tr":"一天之内，一座宫殿之中，气候竟如此不一样。","p":0,"r":1},{"t":"妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦，","tr":"六国的宫妃、侍女和王子王孙，离开楼阁，走下殿堂，乘辇来到秦国，","p":1,"r":1},{"t":"朝歌夜弦，为秦宫人。","tr":"早晨唱歌，晚上奏乐，成为秦宫中的人。","p":1,"r":1},{"t":"明星荧荧，开妆镜也；","tr":"星星闪烁，是宫女们打开了梳妆的镜子；","p":1,"r":1},{"t":"绿云扰扰，梳晓鬟也；","tr":"乌云纷乱，是她们在早晨梳理发髻；","p":1,"r":1},{"t":"渭流涨腻，弃脂水也；","tr":"渭水涨起一层油腻，是她们倒掉的胭脂水；","p":1,"r":1},{"t":"烟斜雾横，焚椒兰也。","tr":"烟雾缭绕，是她们在焚烧椒兰香料。","p":1,"r":1},{"t":"雷霆乍惊，宫车过也；","tr":"雷声突然响起，是宫车驶过；","p":1,"r":1},{"t":"辘辘远听，杳不知其所之也。","tr":"车声辘辘渐渐远去，缥缈不知去向何处。","p":1,"r":1},{"t":"一肌一容，尽态极妍，","tr":"一寸肌肤，一副容颜，都极尽娇媚美丽之态，","p":1,"r":1},{"t":"缦立远视，而望幸焉；","tr":"久久站立远远观望，盼望皇帝临幸；","p":1,"r":1},{"t":"有不见者，三十六年。","tr":"有的宫女竟三十六年都没能见到皇帝。","p":1,"r":1},{"t":"燕赵之收藏，韩魏之经营，齐楚之精英，","tr":"燕、赵收藏的，韩、魏经营的，齐、楚的精华，","p":2,"r":1},{"t":"几世几年，剽掠其人，倚叠如山。","tr":"几代几年，从百姓手里掠夺来，堆积得像山一样。","p":2,"r":1},{"t":"一旦不能有，输来其间。","tr":"一旦不能占有，都运到阿房宫里来。","p":2,"r":1},{"t":"鼎铛玉石，金块珠砾，","tr":"宝鼎当作铁锅，美玉当作石头，黄金当作土块，珍珠当作石子，","p":2,"r":1},{"t":"弃掷逦迤，秦人视之，亦不甚惜。","tr":"随意丢弃，连绵不断，秦人看见它们，也并不觉得可惜。","p":2,"r":1},{"t":"嗟乎！一人之心，千万人之心也。","tr":"唉！一个人的心意，也是千万人的心意。","p":3,"r":1},{"t":"秦爱纷奢，人亦念其家，","tr":"秦统治者喜爱豪华奢侈，别人也顾念自己的家，","p":3,"r":1},{"t":"奈何取之尽锱铢，用之如泥沙？","tr":"为什么搜刮时连一锱一铢都不放过，挥霍时却像泥沙一样？","p":3,"r":1},{"t":"使负栋之柱，多于南亩之农夫；","tr":"使承担栋梁的柱子，比田里的农夫还多；","p":3,"r":1},{"t":"架梁之椽，多于机上之工女；","tr":"架在梁上的椽子，比织机上的织女还多；","p":3,"r":1},{"t":"钉头磷磷，多于在庾之粟粒；","tr":"梁柱上的钉头闪闪发光，比粮仓里的粮食颗粒还多；","p":3,"r":1},{"t":"瓦缝参差，多于周身之帛缕；","tr":"屋顶瓦缝参差不齐，比人们身上的丝缕还多；","p":3,"r":1},{"t":"直栏横槛，多于九土之城郭；","tr":"直直横横的栏杆，比九州的城郭还多；","p":3,"r":1},{"t":"管弦呕哑，多于市人之言语。","tr":"管弦乐声嘈杂，比街市上人的说话声还多。","p":3,"r":1},{"t":"使天下之人，不敢言而敢怒。","tr":"使天下的人，敢怒而不敢言。","p":3,"r":1},{"t":"独夫之心，日益骄固。","tr":"那独夫的心，一天比一天骄横顽固。","p":3,"r":1},{"t":"戍卒叫，函谷举，楚人一炬，可怜焦土！","tr":"戍卒一声呼喊，函谷关被攻占，楚人一把大火，可惜阿房宫成了焦土！","p":3,"r":1},{"t":"呜呼！灭六国者六国也，非秦也。","tr":"唉！灭亡六国的是六国自己，不是秦国。","p":4,"r":1},{"t":"族秦者秦也，非天下也。","tr":"灭掉秦族的是秦自己，不是天下人。","p":4,"r":1},{"t":"嗟乎！使六国各爱其人，则足以拒秦；","tr":"唉！假使六国各自爱护本国的人民，就足以抵抗秦国；","p":4,"r":1},{"t":"使秦复爱六国之人，则递三世可至万世而为君，","tr":"假使秦国再爱护六国的人民，那么皇位可以由三世传到万世而做君主，","p":4,"r":1},{"t":"谁得而族灭也？","tr":"谁能灭掉他的宗族呢？","p":4,"r":1},{"t":"秦人不暇自哀，而后人哀之；","tr":"秦人来不及哀叹自己，而后人替他们哀叹；","p":4,"r":1},{"t":"后人哀之而不鉴之，亦使后人而复哀后人也。","tr":"后人哀叹却不以此为鉴，也会让更后的人再来哀叹后人。","p":4,"r":1}],"notes":[{"u":0,"w":"毕","m":"完结，指灭亡","t":"实词","d":["完毕","全部"]},{"u":0,"w":"兀","m":"山秃，光秃","t":"实词","d":["高耸","突然"]},{"u":1,"w":"覆压","m":"覆盖，遮盖","t":"实词","d":["倾覆压制","翻转压迫"]},{"u":1,"w":"隔离","m":"遮挡，隔断","t":"古今异义","d":["使分开防止传染","孤立"]},{"u":2,"w":"构","m":"构筑，起建","t":"实词","d":["结构","构思"]},{"u":2,"w":"走","m":"趋向，通往","t":"古今异义","d":["行走","离开"]},{"u":3,"w":"溶溶","m":"水盛而缓流的样子","t":"实词","d":["融化的样子","混合的样子"]},{"u":5,"w":"缦","m":"萦绕，曲折","t":"实词","d":["怠慢","没有花纹的丝织品"]},{"u":5,"w":"廊腰","m":"连接楼阁的走廊像人的腰，曲折回环","t":"实词","d":["走廊中央","走廊的腰带"]},{"u":5,"w":"檐牙","m":"屋檐边突出如牙的部分","t":"实词","d":["屋檐下的牙齿","檐角的瓦片"]},{"u":6,"w":"钩心斗角","m":"各处建筑精巧工致，彼此勾连呼应（今多指用心计互相排挤）","t":"古今异义","d":["比喻用尽心机相互猜忌","形容角落交错"]},{"u":7,"w":"囷囷","m":"曲折回旋的样子","t":"实词","d":["粮仓的样子","圆形的样子"]},{"u":8,"w":"落","m":"座，处","t":"实词","d":["落下","衰落"]},{"u":9,"w":"卧","m":"横卧","t":"词类活用"},{"u":10,"w":"复道","m":"楼阁之间架空的通道","t":"实词","d":["重复的路","来回行走的路"]},{"u":10,"w":"霁","m":"雨后转晴","t":"实词","d":["云雾","雷雨"]},{"u":11,"w":"冥迷","m":"迷茫分辨不清","t":"实词","d":["昏暗而迷信","黑暗而神秘"]},{"u":12,"w":"暖","m":"使……温暖
