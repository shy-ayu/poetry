":"复","m":"又，再","t":"实词","d":["恢复","重复"]},{"u":46,"w":"递","m":"依次传递","t":"实词","d":["送达","邮递"]},{"u":47,"w":"谁得而族灭也","m":"宾语前置：谁能灭掉他的宗族呢？","t":"特殊句式"},{"u":48,"w":"暇","m":"空闲","t":"实词","d":["假期","暇满"]},{"u":49,"w":"鉴","m":"借鉴，吸取教训","t":"实词","d":["镜子","鉴定"]}],"tricky":["兀","囷","逦","迤","妍","锱","庾","槛","呕哑","焦土"],"keyLines":[{"u":0,"hint":"《阿房宫赋》开篇，以两组对举短句交代秦统一天下、阿房宫兴建的句子是："},{"u":9,"hint":"作者用比喻与反问，描绘长桥、复道如龙似虹的两句是（写长桥一句）："},{"u":12,"hint":"写阿房宫内一日之内、一宫之间气候不同的句子是（歌台舞殿对举）："},{"u":40,"hint":"文中说明统治者的奢靡使百姓“敢怒不敢言”的句子是："},{"u":43,"hint":"作者总结秦亡之因，强调灭亡来自自身而非外部的两句是："},{"u":49,"hint":"文末告诫后人必须以史为鉴，否则又将被后人哀叹的句子是："}],"appr":[{"q":"文章第三、四段的排比与对比有什么作用？","a":"“使负栋之柱，多于南亩之农夫”等六个排比句，把宫室建筑之多与农夫、工女、粟粒、帛缕、城郭、言语相比，极言秦统治者的穷奢极欲与对民力的消耗，对比强烈，愤激而有力。"},{"q":"文章为什么写“秦人不暇自哀，而后人哀之”？","a":"这句由秦的灭亡推及后世，指出历史教训的价值，告诫当朝统治者不要重蹈覆辙；一“哀”一“鉴”，把咏史转为讽今，使全文的主旨落在现实警示上。"},{"q":"本文是怎样把描写、叙事与议论结合起来的？","a":"前两段铺陈阿房宫的壮丽及宫人的生活，第三段写掠夺财富的奢侈，第四段转入议论，抓住“爱”与“怨”深入分析，最后总结成败。前文的描写为后文的议论提供依据，铺叙越盛，批判越有力。"}]},{"id":"h1b-w13","volume":"h1b","title":"六国论","author":"苏洵","dynasty":"北宋","genre":"政论文（论说文）","kind":"prose","intro":"北宋仁宗时期，苏洵有感于朝廷对辽和西夏屈辱纳贡的政策，借评说六国灭亡的原因来讽谏当朝，属借古讽今的史论。","theme":"六国灭亡的根源在于贿赂秦国、自弱其力，以此警示北宋不可重蹈覆辙。","tags":["议论","史论","借古讽今"],"units":[{"t":"六国破灭，非兵不利，战不善，弊在赂秦。","tr":"六国灭亡，不是因为兵器不锋利，仗打得不好，祸根在于拿土地贿赂秦国。","p":0,"r":1},{"t":"赂秦而力亏，破灭之道也。","tr":"贿赂秦国使自己的实力亏损，这就是走向灭亡的道路。","p":0,"r":1},{"t":"或曰：六国互丧，率赂秦邪？","tr":"有人说：六国接连灭亡，难道都是因为贿赂秦国吗？","p":1,"r":1},{"t":"曰：不赂者以赂者丧。","tr":"回答说：没有贿赂秦国的国家，因为贿赂秦国的国家而灭亡。","p":1,"r":1},{"t":"盖失强援，不能独完。","tr":"因为失去了强有力的援助，就不能独自保全。","p":1,"r":1},{"t":"故曰：弊在赂秦也。","tr":"所以说：祸根在于贿赂秦国。","p":1,"r":1},{"t":"秦以攻取之外，小则获邑，大则得城。","tr":"秦国除了用武力攻取之外，（靠受贿）小的收获城邑，大的得到城池。","p":2,"r":1},{"t":"较秦之所得，与战胜而得者，其实百倍；","tr":"比较秦国受贿得到的土地与战胜得到的土地，实际上多出百倍；","p":2,"r":1},{"t":"诸侯之所亡，与战败而亡者，其实亦百倍。","tr":"诸侯因贿赂丧失的土地与战败丧失的土地，实际上也多出百倍。","p":2,"r":1},{"t":"则秦之所大欲，诸侯之所大患，固不在战矣。","tr":"那么秦国最想要的，诸侯最担忧的，本来就不在于打仗了。","p":2,"r":1},{"t":"思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。","tr":"想想他们的祖辈父辈，冒着霜露，披荆斩棘，才拥有这一点点土地。","p":2,"r":1},{"t":"子孙视之不甚惜，举以予人，如弃草芥。","tr":"子孙看待这些土地并不怎么爱惜，整块拿去送人，就像丢掉小草一样。","p":2,"r":1},{"t":"今日割五城，明日割十城，然后得一夕安寝。","tr":"今天割让五座城，明天割让十座城，这样才换得一夜安稳的睡眠。","p":2,"r":1},{"t":"起视四境，而秦兵又至矣。","tr":"起床一看四周边境，秦国的军队又打来了。","p":2,"r":1},{"t":"然则诸侯之地有限，暴秦之欲无厌，","tr":"这样看来，诸侯的土地是有限的，暴虐的秦国的欲望却没有满足的时候，","p":2,"r":1},{"t":"奉之弥繁，侵之愈急。","tr":"送给它的越多，它侵犯得越厉害。","p":2,"r":1},{"t":"故不战而强弱胜负已判矣。","tr":"所以不必交战，强弱胜负就已经分晓了。","p":2,"r":1},{"t":"至于颠覆，理固宜然。","tr":"到了灭亡的地步，道理上本来就该如此。","p":2,"r":1},{"t":"古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”","tr":"古人说：“拿土地侍奉秦国，就像抱着柴草去救火，柴草不烧完，火就不会熄灭。”","p":2,"r":1},{"t":"此言得之。","tr":"这话说得对啊。","p":2,"r":1},{"t":"齐人未尝赂秦，终继五国迁灭，何哉？","tr":"齐国人不曾贿赂秦国，最终也跟着五国被灭亡，这是为什么呢？","p":3,"r":0},{"t":"与嬴而不助五国也。","tr":"因为它亲附秦国而不援助其他五国。","p":3,"r":0},{"t":"五国既丧，齐亦不免矣。","tr":"五国已经灭亡，齐国也就不能幸免了。","p":3,"r":0},{"t":"燕赵之君，始有远略，能守其土，义不赂秦。","tr":"燕国、赵国的国君，起初有长远的谋略，能守住自己的国土，坚持道义不贿赂秦国。","p":3,"r":0},{"t":"是故燕虽小国而后亡，斯用兵之效也。","tr":"所以燕国虽然是小国却灭亡得较晚，这是善于用兵抵抗的效果。","p":3,"r":0},{"t":"至丹以荆卿为计，始速祸焉。","tr":"等到燕太子丹把派荆轲行刺当作对策，才招来了灭亡的祸患。","p":3,"r":0},{"t":"赵尝五战于秦，二败而三胜。","tr":"赵国曾和秦国打了五次仗，两次失败而三次获胜。","p":3,"r":0},{"t":"后秦击赵者再，李牧连却之。","tr":"后来秦国两次攻打赵国，李牧接连打退了秦军。","p":3,"r":0},{"t":"洎牧以谗诛，邯郸为郡，惜其用武而不终也。","tr":"等到李牧因谗言被杀，邯郸成为秦的郡，可惜赵国用武力抵抗却没能坚持到底。","p":3,"r":0},{"t":"且燕赵处秦革灭殆尽之际，可谓智力孤危，","tr":"况且燕国、赵国处在秦国几乎把诸侯消灭殆尽的时候，可以说智谋和力量都孤立危急，","p":3,"r":0},{"t":"战败而亡，诚不得已。","tr":"战败而灭亡，确实是出于不得已。","p":3,"r":0},{"t":"向使三国各爱其地，齐人勿附于秦，","tr":"假使韩、魏、楚三国各自爱惜自己的土地，齐国人不依附秦国，","p":3,"r":0},{"t":"刺客不行，良将犹在，","tr":"燕国刺客不去行刺，赵国良将还活着，","p":3,"r":0},{"t":"则胜负之数，存亡之理，当与秦相较，或未易量。","tr":"那么胜负的命数，存亡的道理，如果与秦国较量，或许还不容易估量。","p":3,"r":0},{"t":"呜呼！以赂秦之地封天下之谋臣，","tr":"唉！如果拿贿赂秦国的土地去封赏天下的谋臣，","p":4,"r":0},{"t":"以事秦之心礼天下之奇才，并力西向，","tr":"用侍奉秦国的心意去礼待天下的奇才，齐心协力向西抗秦，","p":4,"r":0},{"t":"则吾恐秦人食之不得下咽也。","tr":"那么我担心秦国人连饭都咽不下去了。","p":4,"r":0},{"t":"悲夫！有如此之势，而为秦人积威之所劫，","tr":"可悲啊！有这样的形势，却被秦国积久的威势所胁迫，","p":4,"r":0},{"t":"日削月割，以趋于亡。","tr":"一天天、一月月地被割削，从而走向灭亡。","p":4,"r":0},{"t":"为国者无使为积威之所劫哉！","tr":"治理国家的人不要被积久的威势所胁迫啊！","p":4,"r":0},{"t":"夫六国与秦皆诸侯，其势弱于秦，","tr":"六国和秦国都是诸侯，它们的形势比秦国弱，","p":5,"r":0},{"t":"而犹有可以不赂而胜之之势。","tr":"却仍有不贿赂秦国而战胜它的可能。","p":5,"r":0},{"t":"苟以天下之大，而从六国破亡之故事，","tr":"如果凭着整个天下这么大，却重蹈六国灭亡的旧事，","p":5,"r":0},{"t":"是又在六国下矣。","tr":"这就又在六国之下了。","p":5,"r":0}],"notes":[{"u":0,"w":"弊","m":"弊病，祸根","t":"实词","d":["疲惫","欺骗"]},{"u":0,"w":"赂","m":"用财物（土地）贿赂","t":"词类活用"},{"u":1,"w":"亏","m":"亏损，削弱","t":"实词","d":["亏欠","缺少"]},{"u":2,"w":"丧","m":"丧失，灭亡","t":"实词","d":["去世","悲痛"]},{"u":2,"w":"率","m":"都，全","t":"实词","d":["率领","大致"]},{"u":2,"w":"邪","m":"表疑问的语气词，相当于“吗”","t":"虚词"},{"u":4,"w":"盖","m":"表推断原因的语气词，“大概是因为”","t":"虚词"},{"u":4,"w":"完","m":"保全","t":"实词","d":["完整","完成"]},{"u":3,"w":"以","m":"因为，由于","t":"虚词"},{"u":6,"w":"邑","m":"城邑","t":"实词","d":["村庄","都城"]},{"u":7,"w":"较","m":"比较","t":"实词","d":["较量","较为"]},{"u":7,"w":"其实","m":"那实际（数量）","t":"古今异义","d":["表示转折，实际上","真实情况"]},{"u":10,"w":"厥","m":"其，他们的","t":"实词","d":["石头","跌倒"]},{"u":10,"w":"祖父","m":"祖辈和父辈","t":"古今异义","d":["爷爷","父亲的父亲"]},{"u":10,"w":"暴","m":"暴露，冒着","t":"实词","d":["凶暴","突然"]},{"u":10,"w":"以","m":"来，用来（表目的）","t":"虚词"},{"u":11,"w":"举","m":"全，整个","t":"实词","d":["举起","推举"]},{"u":11,"w":"草芥","m":"小草，比喻微不足道的东西","t":"实词","d":["草药","草药种子"]},{"u":12,"w":"然后","m":"这样以后","t":"古今异义","d":["表示承接的连词","之后"]},{"u":13,"w":"四境","m":"四周边境","t":"实词","d":["四个国家","四方的人"]},{"u":14,"w":"厌","m":"满足","t":"实词","d":["讨厌","厌倦"]},{"u":15,"w":"奉","m":"奉送，献给","t":"实词","d":["奉养","接受"]},{"u":15,"w":"弥","m":"更加，越","t":"实词","d":["满","弥补"]},{"u":16,"w":"判","m":"分辨，确定","t":"实词","d":["判决","分开"]},{"u":18,"w":"薪","m":"柴草","t":"实词","d":["薪水","工资"]},{"u":19,"w":"得之","m":"对了，得当","t":"特殊句式"},{"u":20,"w":"迁灭","m":"灭亡","t":"实词","d":["迁徙灭亡","被迁移"]},{"u":21,"w":"与嬴","m":"亲附秦国","t":"实词","d":["给予嬴姓","参与嬴政"]},{"u":23,"w":"远略","m":"长远的谋略","t":"实词","d":["远征","远方的领地"]},{"u":23,"w":"义","m":"坚持道义","t":"词类活用"},{"u":24,"w":"效","m":"效果，成效","t":"实词","d":["效法","效力"]},{"u":25,"w":"速","m":"招致","t":"实词","d":["迅速","速度"]},{"u":28,"w":"洎","m":"等到","t":"实词","d":["浸润","泪水"]},{"u":28,"w":"以谗诛","m":"因谗言被杀","t":"特殊句式"},{"u":28,"w":"为郡","m":"变成（秦的）郡","t":"词类活用"},{"u":29,"w":"智力","m":"智谋和力量","t":"古今异义","d":["智商水平","学习能力"]},{"u":31,"w":"向使","m":"假使","t":"实词","d":["先前派遣","面向"]},{"u":33,"w":"当","m":"应当，倘若","t":"实词","d":["正当","抵挡"]},{"u":33,"w":"或","m":"也许","t":"实词","d":["有人","或者"]},{"u":35,"w":"向","m":"朝向","t":"词类活用"},{"u":36,"w":"食","m":"吃，用作动词的“饭”","t":"实词","d":["食物","喂养"]},{"u":37,"w":"为秦人积威之所劫","m":"“为……所”表被动，被","t":"特殊句式"},{"u":38,"w":"日","m":"每天，名词作状语","t":"词类活用"},{"u":42,"w":"苟","m":"如果","t":"实词","d":["苟且","随便"]},{"u":42,"w":"从","m":"跟随，重蹈","t":"实词","d":["从来","仆从"]}],"tricky":["赂","弥","厌","薪","洎","邯郸"],"keyLines":[{"u":0,"hint":"文章开篇提出中心论点的句子是："},{"u":1,"hint":"说明赂秦导致国力亏损、走向灭亡的句子是："},{"u":18,"hint":"文中用比喻说明割地事秦不可能止住秦国野心的名句是："},{"u":12,"hint":"形容六国君主不断割地求得片刻安稳的句子是："},{"u":36,"hint":"文中假设六国团结用人、秦国将陷入窘境的句子是："},{"u":39,"hint":"作者对当朝统治者发出的警示句是："}],"appr":[{"q":"文章是怎样围绕“赂秦”展开论证的？","a":"先提出“弊在赂秦”的中心论点；再分析赂秦者因割地而力亏，不赂者因失援而亡；接着以齐、燕、赵为例作反面和正面对比；最后借古讽今，告诫当朝不要重蹈覆辙。"},{"q":"“以地事秦，犹抱薪救火，薪不尽，火不灭”运用了什么手法？","a":"运用比喻论证，把割地比作抱柴救火，形象说明土地越割秦国欲望越大、危机越深的道理，增强了说服力。"},{"q":"本文“借古讽今”体现在哪里？","a":"作者表面评六国，实际针对北宋对辽、西夏岁币求和的政策，结尾“苟以天下之大，而从六国破亡之故事”正点明讽谏现实的用意。"}]},{"id":"h2a-p01","volume":"h2a","title":"无衣","author":"《诗经》","dynasty":"先秦","genre":"诗经·秦风","kind":"poem","intro":"出自《诗经·秦风》，是秦地军中流传的战歌，表现将士在大敌当前时同仇敌忾、互相扶助的豪情。","theme":"以重章叠唱抒写秦军将士团结互助、共赴国难的昂扬斗志。","tags":["战争","团结","豪情"],"units":[{"t":"岂曰无衣？与子同袍。","tr":"谁说你没有衣穿？我愿和你共穿一件战袍。","p":0,"r":1},{"t":"王于兴师，修我戈矛，与子同仇！","tr":"君王下令出兵作战，修整好我们的戈和矛，我与你同样仇视敌人！","p":0,"r":1},{"t":"岂曰无衣？与子同泽。","tr":"谁说你没有衣穿？我愿和你共穿一件内衣。","p":1,"r":1},{"t":"王于兴师，修我矛戟，与子偕作！","tr":"君王下令出兵作战，修整好我们的矛和戟，我与你一同奋起行动！","p":1,"r":1},{"t":"岂曰无衣？与子同裳。","tr":"谁说你没有衣穿？我愿和你共穿一条战裙。","p":2,"r":1},{"t":"王于兴师，修我甲兵，与子偕行！","tr":"君王下令出兵作战，修整好我们的铠甲和兵器，我与你一同奔赴前线！","p":2,"r":1}],"notes":[{"u":0,"w":"袍","m":"长衣，战袍","t":"实词","d":["被子","披风"]},{"u":1,"w":"同仇","m":"共同对付仇敌","t":"实词","d":["结下同样的仇怨","同样的仇人"]},{"u":1,"w":"戈矛","m":"两种长柄兵器","t":"实词","d":["盾牌和弓箭","战车和战鼓"]},{"u":2,"w":"泽","m":"通“襗”，贴身的内衣","t":"通假","d":["恩泽，恩惠","水边的沼泽"]},{"u":3,"w":"偕作","m":"一同起身行动","t":"实词","d":["一起劳作","一起创作"]},{"u":4,"w":"裳","m":"下身穿的战裙","t":"实词","d":["上身的短衣","华美的礼服"]},{"u":5,"w":"甲兵","m":"铠甲和兵器","t":"实词","d":["身穿铠甲的士兵","军队的将领"]},{"u":5,"w":"偕行","m":"一同前往","t":"实词","d":["并排行走","同时撤退"]}],"tricky":["袍","泽","戈","矛","戟","裳"],"keyLines":[{"u":1,"hint":"《无衣》中，表现战士们面对共同的敌人、同仇敌忾的诗句是："},{"u":0,"hint":"《无衣》中，以反问开篇、表现战友之间同甘共苦的两句是："},{"u":5,"hint":"《无衣》末章中，表示整修好铠甲兵器、与战友一同奔赴前线的诗句是："}],"appr":[{"q":"《无衣》三章采用了什么表现手法？有什么效果？","a":"采用重章叠唱，各章句式基本相同，仅替换“袍、泽、裳”“戈矛、矛戟、甲兵”及“同仇、偕作、偕行”等词，层层推进，由共同对敌到共同行动再到共同出征，节奏激昂，增强了气势。"},{"q":"“岂曰无衣？与子同袍”以反问开头有何作用？","a":"以反问起句，语气豪迈而亲切，不言缺衣而言愿与战友共用，显示将士间患难与共的情谊，也为后文同仇、偕作、偕行的团结精神作了铺垫。"}]},{"id":"h2a-p02","volume":"h2a","title":"春江花月夜","author":"张若虚","dynasty":"唐","genre":"七言歌行（乐府旧题）","kind":"poem","intro":"张若虚为初唐诗人，《春江花月夜》原是乐府旧题，此篇以江月为中心，把写景、哲思与离情融为一体，有“孤篇横绝全唐”之誉。","theme":"借春江月夜之景，抒发对宇宙人生的哲理思索与游子思妇的离愁别绪。","tags":["写景","哲思","离愁"],"units":[{"t":"春江潮水连海平，海上明月共潮生。","tr":"春天的江水与大海连成一片，一轮明月随着潮水从海上升起。","p":0,"r":1},{"t":"滟滟随波千万里，何处春江无月明！","tr":"月光随波涛闪动，流向千万里之外，哪一处春江不沐浴在明月的光辉里！","p":0,"r":1},{"t":"江流宛转绕芳甸，月照花林皆似霰。","tr":"江水曲折地绕过开满花草的原野，月光照着花林，仿佛撒满了雪粒。","p":1,"r":1},{"t":"空里流霜不觉飞，汀上白沙看不见。","tr":"月光如霜在空中流动，却不觉它在飞，江边白沙与月色相融，难以分辨。","p":1,"r":1},{"t":"江天一色无纤尘，皎皎空中孤月轮。","tr":"江水与天空同为一色，没有一点灰尘，空中只悬着一轮皎洁的孤月。","p":2,"r":1},{"t":"江畔何人初见月？江月何年初照人？","tr":"江边是什么人最先看见月亮？江上的月亮又是哪一年最初照耀世人？","p":2,"r":1},{"t":"人生代代无穷已，江月年年望相似。","tr":"人类一代代地繁衍不绝，江上的明月年年望去都相似。","p":3,"r":1},{"t":"不知江月待何人，但见长江送流水。","tr":"不知江月是在等待什么人，只看见长江不断地把流水送向远方。","p":3,"r":1},{"t":"白云一片去悠悠，青枫浦上不胜愁。","tr":"一片白云缓缓飘去，青枫浦上的人不胜愁苦。","p":4,"r":1},{"t":"谁家今夜扁舟子？何处相思明月楼？","tr":"今夜是谁家的游子驾着小船漂泊？又是谁在明月映照的楼上相思？","p":4,"r":1},{"t":"可怜楼上月徘徊，应照离人妆镜台。","tr":"可叹那楼上的月光来回徘徊，应当正照着思妇的梳妆台。","p":5,"r":1},{"t":"玉户帘中卷不去，捣衣砧上拂还来。","tr":"月光照进华美的门帘，卷也卷不走；落在捣衣石上，拂去了又照回来。","p":5,"r":1},{"t":"此时相望不相闻，愿逐月华流照君。","tr":"此时两人隔着遥远相望却听不到彼此，我愿随着月光流去照在你身上。","p":6,"r":1},{"t":"鸿雁长飞光不度，鱼龙潜跃水成文。","tr":"鸿雁不停地飞，也飞不出月光的范围；鱼龙跳跃，只在水面激起波纹。","p":6,"r":1},{"t":"昨夜闲潭梦落花，可怜春半不还家。","tr":"昨夜梦见幽静水潭边花瓣飘落，可叹春天过半我仍不能回家。","p":7,"r":1},{"t":"江水流春去欲尽，江潭落月复西斜。","tr":"江水带着春光流走，春天将要过完；水潭上的月亮又向西斜落。","p":7,"r":1},{"t":"斜月沉沉藏海雾，碣石潇湘无限路。","tr":"西斜的月亮渐渐沉入海雾之中，从碣石到潇湘，路途遥远没有尽头。","p":8,"r":1},{"t":"不知乘月几人归，落月摇情满江树。","tr":"不知有几人能趁着月色回到家乡，只有落月的余晖摇动离情，洒满江边树林。","p":8,"r":1}],"notes":[{"u":1,"w":"滟滟","m":"月光随波闪动的样子","t":"实词","d":["江水浩荡奔流的样子","月色朦胧的样子"]},{"u":2,"w":"芳甸","m":"花草繁茂的原野","t":"实词","d":["芬芳的小路","散发香气的宫殿"]},{"u":2,"w":"霰","m":"小冰粒，雪粒","t":"实词","d":["晨雾","露珠"]},{"u":3,"w":"汀","m":"水边平地","t":"实词","d":["水中小岛","渡口"]},{"u":6,"w":"穷已","m":"穷尽，终止","t":"实词","d":["贫穷而已","穷困潦倒"]},{"u":8,"w":"悠悠","m":"飘荡悠远的样子","t":"实词","d":["忧愁的样子","闲适的样子"]},{"u":9,"w":"扁舟子","m":"漂泊在外的游子","t":"实词","d":["小船上的船夫","隐居江湖的渔翁"]},{"u":10,"w":"离人","m":"此指思念远人的思妇","t":"古今异义","d":["离别的人，远行的游子","离开家乡的人"]},{"u":10,"w":"可怜","m":"可爱，可叹（此指值得怜惜）","t":"古今异义","d":["令人同情","可以怜悯的穷人"]},{"u":11,"w":"砧","m":"捣衣石","t":"实词","d":["磨墨的石砚","垫东西的木板"]},{"u":12,"w":"月华","m":"月光","t":"实词","d":["月亮的美称","月宫的华丽景象"]},{"u":13,"w":"文","m":"通“纹”，波纹","t":"通假","d":["文章","文采"]},{"u":16,"w":"碣石潇湘","m":"碣石在北方，潇湘在南方，泛指天各一方","t":"典故","d":[]}],"tricky":["滟","霰","汀","皎","砧","碣","潇"],"keyLines":[{"u":0,"hint":"《春江花月夜》中，描写春江潮水涨平、明月随潮升起的开篇两句是："},{"u":5,"hint":"诗人由江月引发对宇宙起源与人类历史的追问，提出的两个问句是："},{"u":6,"hint":"感叹个体生命有限而江月永恒的两句是："},{"u":12,"hint":"思妇希望追随月光去照耀远方的丈夫，表达这一愿望的两句是："},{"u":17,"hint":"全诗结尾，以落月余晖笼罩江树来收束离情的两句是："}],"appr":[{"q":"“江畔何人初见月？江月何年初照人？”在全诗中起什么作用？","a":"这两个问句由眼前江月引向对宇宙与人生的追问，是全诗由写景转入哲思的转折点，也为下文感叹人生短暂、江月长存和离愁别绪的抒发拓开了深远的境界。"},{"q":"“玉户帘中卷不去，捣衣砧上拂还来”表现了什么？运用了什么手法？","a":"运用拟人和对偶，写月光无法卷去、拂去，实际是写思妇心中的思念挥之不去，借月光的缠绵烘托出离人的愁绪，含蓄而深婉。"},{"q":"全诗结构上有什么特点？","a":"全诗以“春、江、花、月、夜”为线索，由月出写到月落；先写景，再转哲理思索，后写游子思妇的相思，景、理、情交融，每四句一换韵，层次分明，起伏有致。"}]},{"id":"h2a-p03","volume":"h2a","title":"将进酒","author":"李白","dynasty":"唐","genre":"七言歌行（乐府旧题）","kind":"poem","intro":"《将进酒》是汉乐府旧题，意为“请饮酒”。李白离开长安后，与友人岑勋、元丹丘宴饮，借酒抒发胸中的愤懑与豪情。","theme":"借酒浇愁，既慨叹人生短暂，又抒发怀才不遇的愤懑和豪放自信。","tags":["饮酒","抒怀","豪放"],"units":[{"t":"君不见黄河之水天上来，奔流到海不复回。","tr":"你没看见吗？黄河之水从天上奔腾而来，流入大海再也不会回头。","p":0,"r":1},{"t":"君不见高堂明镜悲白发，朝如青丝暮成雪。","tr":"你没看见吗？高堂明镜中人们为白发而悲叹，早晨还是青丝，傍晚就变成雪白。","p":0,"r":1},{"t":"人生得意须尽欢，莫使金樽空对月。","tr":"人生得意时就应尽情欢乐，不要让金杯空对着明月。","p":1,"r":1},{"t":"天生我材必有用，千金散尽还复来。","tr":"上天生下我这个人必定有用处，千金花光了还会再得到。","p":1,"r":1},{"t":"烹羊宰牛且为乐，会须一饮三百杯。","tr":"煮羊宰牛姑且尽情享乐，应当痛饮三百杯。","p":1,"r":1},{"t":"岑夫子，丹丘生，将进酒，杯莫停。","tr":"岑夫子啊，丹丘生啊，请喝酒吧，杯子不要停下。","p":2,"r":1},{"t":"与君歌一曲，请君为我倾耳听。","tr":"我为你们唱一支歌，请你们侧着耳朵听我唱。","p":2,"r":1},{"t":"钟鼓馔玉不足贵，但愿长醉不愿醒。","tr":"钟鸣鼎食的富贵生活不值得珍视，只希望长久沉醉而不愿清醒。","p":2,"r":1},{"t":"古来圣贤皆寂寞，惟有饮者留其名。","tr":"自古以来圣贤之人都被冷落寂寞，只有喝酒的人才留下了名声。","p":2,"r":1},{"t":"陈王昔时宴平乐，斗酒十千恣欢谑。","tr":"当年陈思王曹植在平乐观设宴，一斗酒值十千钱也尽情欢笑玩乐。","p":3,"r":1},{"t":"主人何为言少钱，径须沽取对君酌。","tr":"主人为什么说钱不多呢？只管去买酒来与你们对饮。","p":3,"r":1},{"t":"五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。","tr":"名贵的五花马，价值千金的皮袍，叫侍儿拿去换美酒来，让我与你们一起消解这万古的忧愁。","p":3,"r":1}],"notes":[{"u":0,"w":"君不见","m":"乐府诗常用的提示语，意为“你难道没看见”","t":"特殊句式","d":[]},{"u":1,"w":"青丝","m":"喻黑发","t":"实词","d":["青色的丝线","柔软的柳条"]},{"u":1,"w":"高堂","m":"高大的厅堂","t":"古今异义","d":["父母","朝廷"]},{"u":2,"w":"须","m":"应当","t":"实词","d":["须要等待","胡须"]},{"u":2,"w":"樽","m":"盛酒的器具","t":"实词","d":["酒席","酒量"]},{"u":4,"w":"会须","m":"应当","t":"实词","d":["能够","一定会等待"]},{"u":7,"w":"钟鼓馔玉","m":"指富贵人家奏乐饮宴、食物精美如玉","t":"典故","d":[]},{"u":8,"w":"圣贤","m":"圣人和贤人","t":"实词","d":["圣明的君主","贤惠的妻子"]},{"u":9,"w":"陈王","m":"指曹植，曾被封为陈王","t":"典故","d":[]},{"u":9,"w":"恣","m":"放纵，无拘束","t":"实词","d":["姿态","嘲讽"]},{"u":10,"w":"径须","m":"只管，干脆","t":"实词","d":["必须走小路","径直等候"]},{"u":10,"w":"沽","m":"买（酒）","t":"实词","d":["卖（酒）","酿造"]},{"u":11,"w":"将出","m":"拿出","t":"实词","d":["将要出门","将领出征"]}],"tricky":["樽","岑","馔","谑","沽","裘","斗"],"keyLines":[{"u":0,"hint":"《将进酒》开篇以黄河奔流入海一去不返，比喻时光流逝的两句是："},{"u":3,"hint":"表现李白自信才华必被任用、对前途乐观的名句是："},{"u":8,"hint":"以愤激之语表达怀才不遇、认为圣贤皆被冷落的两句是："},{"u":1,"hint":"以朝暮之间青丝变白发，感叹人生短暂的两句是："},{"u":11,"hint":"《将进酒》结尾处，诗人豪迈地呼人拿宝马名裘去换酒、以消解忧愁的句子是："}],"appr":[{"q":"“君不见黄河之水天上来，奔流到海不复回”运用了什么手法？有何作用？","a":"运用夸张和比喻，写黄河自天而降、一去不返，既有雄浑壮阔的气势，又以流水不返比喻时光易逝，为下文感叹人生短暂奠定基调。"},{"q":"诗中“千金散尽还复来”“与尔同销万古愁”体现了诗人怎样的情感？","a":"前句显示诗人的豪迈洒脱与自信，后句以“万古愁”写出积郁已久的深沉愤慨，豪放之中夹杂着怀才不遇的悲凉，情感大起大落，极具感染力。"},{"q":"这首诗在语言和节奏上有什么特点？","a":"句式长短错落，多用“君不见”和三字短句，节奏奔放；大量使用夸张和数字（千金、三百杯、万古愁），气势磅礴，体现了李白诗歌豪放飘逸的风格。"}]},{"id":"h2a-p04","volume":"h2a","title":"江城子·乙卯正月二十日夜记梦","author":"苏轼","dynasty":"北宋","genre":"词（悼亡词）","kind":"poem","intro":"熙宁八年，苏轼在密州任上，夜里梦见去世十年的发妻王弗，醒来后写下这首悼亡词。","theme":"通过记梦，抒写对亡妻深切不忘的思念与自己仕途奔波的凄凉。","tags":["悼亡","思念","梦境"],"units":[{"t":"十年生死两茫茫，不思量，自难忘。","tr":"生死相隔已有十年，彼此都渺茫无音，即使不去想念，也自然难以忘怀。","p":0,"r":1},{"t":"千里孤坟，无处话凄凉。","tr":"你的孤坟远在千里之外，我无处向你倾诉心中的凄凉。","p":0,"r":1},{"t":"纵使相逢应不识，尘满面，鬓如霜。","tr":"纵然相逢，你也该认不出我了：我满面风尘，两鬓已如白霜。","p":0,"r":1},{"t":"夜来幽梦忽还乡，小轩窗，正梳妆。","tr":"昨夜在幽深的梦中忽然回到故乡，在小屋窗前，你正在梳妆。","p":1,"r":1},{"t":"相顾无言，惟有泪千行。","tr":"我们互相对望，无话可说，只有泪水纵横流淌。","p":1,"r":1},{"t":"料得年年肠断处，明月夜，短松冈。","tr":"料想你年年为我痛断肝肠的地方，是那明月照耀的夜晚，长着矮松的山冈。","p":1,"r":1}],"notes":[{"u":0,"w":"茫茫","m":"渺茫，模糊不清","t":"实词","d":["广阔无边","忙碌不停"]},{"u":0,"w":"思量","m":"思念，想念","t":"实词","d":["掂量，衡量","考虑，谋划"]},{"u":1,"w":"千里孤坟","m":"王弗葬于四川眉山，苏轼在山东密州，相距遥远","t":"典故","d":[]},{"u":2,"w":"尘满面","m":"满脸风尘，形容饱经奔波沧桑","t":"实词","d":["脸上落满灰尘","满面羞愧"]},{"u":3,"w":"幽梦","m":"隐约、幽深的梦境","t":"实词","d":["美好的梦想","可怕的噩梦"]},{"u":3,"w":"轩窗","m":"小屋的窗户","t":"实词","d":["高大的车窗","敞开的长廊"]},{"u":4,"w":"相顾","m":"互相对视","t":"实词","d":["互相照应","回头看望"]},{"u":5,"w":"料得","m":"料想","t":"实词","d":["得到估量","预先安排"]},{"u":5,"w":"短松冈","m":"种着矮小松树的山冈，指亡妻墓地","t":"实词","d":["短小的松林小路","松树被砍短的山坡"]}],"tricky":["茫","鬓","轩","梳","妆","冈"],"keyLines":[{"u":0,"hint":"苏轼《江城子》开篇，写与亡妻生死相隔十年、思念难以忘怀的句子是："},{"u":2,"hint":"词人设想亡妻与自己重逢时，会因自己衰老憔悴而认不出，表达这一想象的句子是："},{"u":4,"hint":"梦中与亡妻相见，千言万语化作无声泪水的两句是："},{"u":5,"hint":"词的结尾，词人想象亡妻年年思念断肠之处的三句是："}],"appr":[{"q":"上下阕在内容和写法上有什么不同？","a":"上阕写现实，抒写十年生死的相思和自己的沧桑；下阕写梦境，写梦中重逢和梦醒后设想亡妻的孤寂。虚实结合，由现实到梦境再回到现实，情感层层加深。"},{"q":"“相顾无言，惟有泪千行”为什么感人？","a":"梦中久别重逢，本有千言万语却一句也说不出，只有泪水倾泻。用白描写“无言”，反而更见悲痛的深沉，把十年积压的思念和凄凉都寄于无声之泪。"},{"q":"结尾“明月夜，短松冈”营造了怎样的意境？","a":"以清冷的月夜、荒凉的松冈两个意象，勾勒出亡妻孤坟的凄清景象，借想象中的景物含蓄地写出对亡妻的怜惜与思念，余味深长。"}]},{"id":"h2a-w01","volume":"h2a","title":"论语十二章","author":"孔子及其弟子","dynasty":"先秦","genre":"语录体","kind":"prose","intro":"《论语》是记录孔子及其弟子言行的语录，由孔门弟子及再传弟子编纂，是儒家的核心经典。本篇选取其中谈论仁、礼、君子修养与治学的章节。","theme":"围绕“仁”与“礼”，阐述君子的修养方法、治学态度与处世原则。","tags":["儒家","修身","说理"],"units":[{"t":"子曰：“人而不仁，如礼何？","tr":"孔子说：“一个人如果没有仁德，他怎么对待礼呢？","p":0,"r":1},{"t":"人而不仁，如乐何？”","tr":"一个人如果没有仁德，他怎么对待乐呢？”","p":0,"r":1},{"t":"子曰：“质胜文则野，文胜质则史。","tr":"孔子说：“质朴多于文采就显得粗野，文采多于质朴就显得虚浮。","p":1,"r":1},{"t":"文质彬彬，然后君子。”","tr":"文采与质朴配合恰当，这才是君子。”","p":1,"r":1},{"t":"子曰：“君子食无求饱，居无求安，","tr":"孔子说：“君子吃饭不追求饱足，居住不追求安逸，","p":2,"r":1},{"t":"敏于事而慎于言，就有道而正焉，可谓好学也已。”","tr":"做事勤勉敏捷而说话谨慎，向有道德学问的人请教并匡正自己，这样就可以说是好学了。”","p":2,"r":1},{"t":"子曰：“君子喻于义，小人喻于利。”","tr":"孔子说：“君子懂得的是道义，小人懂得的是利益。”","p":3,"r":1},{"t":"曾子曰：“士不可以不弘毅，任重而道远。","tr":"曾子说：“士不可以不志向远大、意志坚毅，因为责任重大而路途遥远。","p":4,"r":1},{"t":"仁以为己任，不亦重乎？死而后已，不亦远乎？”","tr":"把实现仁作为自己的责任，不也很沉重吗？到死才停止，不也很遥远吗？”","p":4,"r":1},{"t":"子曰：“譬如为山，未成一篑，止，吾止也；","tr":"孔子说：“譬如堆土成山，只差一筐土就完成了，停下来，那是我自己停止的；","p":5,"r":1},{"t":"譬如平地，虽覆一篑，进，吾往也。”","tr":"又譬如在平地上堆土，虽然刚倒下一筐土，继续前进，那是我自己要前进的。”","p":5,"r":1},{"t":"子曰：“小子何莫学夫《诗》？《诗》，可以兴，可以观，可以群，可以怨。","tr":"孔子说：“弟子们为什么不学《诗》呢？《诗》可以激发情志，可以观察社会，可以结交朋友，可以抒发怨愤。","p":6,"r":1},{"t":"迩之事父，远之事君；多识于鸟兽草木之名。”","tr":"近可以侍奉父母，远可以侍奉君主；还能多认识鸟兽草木的名称。”","p":6,"r":1},{"t":"颜渊问仁。子曰：“克己复礼为仁。","tr":"颜渊问什么是仁。孔子说：“约束自己，使言行合于礼，就是仁。","p":7,"r":1},{"t":"一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？”","tr":"一旦做到这样，天下人都会称许你有仁德。实行仁全靠自己，难道还靠别人吗？”","p":7,"r":1},{"t":"颜渊曰：“请问其目。”","tr":"颜渊说：“请问具体的条目。”","p":7,"r":1},{"t":"子曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”","tr":"孔子说：“不合礼的不看，不合礼的不听，不合礼的不说，不合礼的不做。”","p":7,"r":1},{"t":"颜渊曰：“回虽不敏，请事斯语矣。”","tr":"颜渊说：“我虽然不聪敏，也要照着这些话去做。”","p":7,"r":1},{"t":"仲弓问仁。子曰：“出门如见大宾，使民如承大祭。","tr":"仲弓问什么是仁。孔子说：“出门如同去见贵宾，役使百姓如同承办大祭。","p":8,"r":1},{"t":"己所不欲，勿施于人。在邦无怨，在家无怨。”","tr":"自己不愿意的，不要强加给别人。在诸侯国中没有怨恨，在卿大夫家中也没有怨恨。”","p":8,"r":1},{"t":"仲弓曰：“雍虽不敏，请事斯语矣。”","tr":"仲弓说：“我虽然不聪敏，也要照着这些话去做。”","p":8,"r":1}],"notes":[{"u":0,"w":"如礼何","m":"“如……何”表示“把……怎么样”，这里指怎样对待礼","t":"特殊句式","d":[]},{"u":2,"w":"质","m":"质朴，内在的朴实品质","t":"实词","d":["质量","抵押"]},{"u":2,"w":"文","m":"文采，外在的修饰","t":"实词","d":["文章","文字"]},{"u":2,"w":"野","m":"粗野，鄙陋","t":"实词","d":["野外，郊野","野生，未驯化"]},{"u":2,"w":"史","m":"虚浮，华而不实","t":"实词","d":["历史记载","史官"]},{"u":3,"w":"彬彬","m":"文质兼备、配合适当的样子","t":"实词","d":["举止斯文有礼","人数众多的样子"]},{"u":5,"w":"就","m":"靠近，接近","t":"实词","d":["完成，成就","就是，便"]},{"u":5,"w":"正","m":"匡正，端正","t":"实词","d":["正直","正在"]},{"u":5,"w":"也已","m":"语气助词连用，相当于“了”","t":"虚词","d":[]},{"u":6,"w":"喻","m":"懂得，明白","t":"实词","d":["比喻","告知，晓谕"]},{"u":7,"w":"弘毅","m":"志向远大，意志坚毅","t":"实词","d":["宽宏大度","刚愎自用"]},{"u":8,"w":"已","m":"停止，完结","t":"实词","d":["已经","罢了"]},{"u":9,"w":"篑","m":"盛土的竹筐","t":"实词","d":["土堆","铁锹"]},{"u":10,"w":"覆","m":"倾倒","t":"实词","d":["覆盖","翻转，颠覆"]},{"u":11,"w":"小子","m":"弟子们，学生们","t":"古今异义","d":["小孩子","对晚辈的谦称"]},{"u":11,"w":"兴","m":"激发联想和感情","t":"实词","d":["兴盛","兴起，起床"]},{"u":11,"w":"群","m":"合群，结交朋友，相互切磋","t":"实词","d":["成群，聚集成群","众多"]},{"u":12,"w":"迩","m":"近","t":"实词","d":["远，遥远","浅近的话"]},{"u":12,"w":"事","m":"侍奉","t":"实词","d":["事情","从事，做事"]},{"u":13,"w":"克己","m":"约束自己","t":"实词","d":["战胜别人","节省开支"]},{"u":14,"w":"由人乎哉","m":"难道靠别人吗（反问句，“由”是“依靠”）","t":"特殊句式","d":[]},{"u":15,"w":"目","m":"条目，细则","t":"实词","d":["眼睛","目录"]},{"u":17,"w":"事","m":"从事，践行","t":"实词","d":["侍奉","事情"]},{"u":18,"w":"承","m":"承办，举行","t":"实词","d":["继承","接受，承受"]},{"u":19,"w":"施","m":"施加，强加","t":"实词","d":["施舍，给予","实施，推行"]}],"tricky":["篑","彬","毅","迩","克","弘"],"keyLines":[{"u":3,"hint":"孔子认为，君子应当文采与质朴恰当配合，表达这一观点的句子是："},{"u":6,"hint":"孔子用来区分君子与小人在价值取向上的差异的句子是："},{"u":8,"hint":"曾子认为士人以仁为己任，因此任务沉重、道路遥远，说明这一点的两句是："},{"u":14,"hint":"孔子强调实行仁德要靠自己，不能靠别人的句子是："},{"u":19,"hint":"孔子回答仲弓问仁，提出的推己及人、不将自己不愿意的事强加于人的句子是："},{"u":16,"hint":"孔子告诉颜渊，用来约束视听言动的四条具体规范是："}],"appr":[{"q":"“譬如为山，未成一篑，止，吾止也”告诉我们什么道理？","a":"用堆土成山的比喻说明，做事成败取决于自己：功亏一篑是自己停下的，继续前进也是自己的选择，强调持之以恒、自觉努力，不可半途而废。"},{"q":"“克己复礼为仁”和“己所不欲，勿施于人”在内容上有什么关联？","a":"两者都是孔子对“仁”的阐释：前者强调约束自己、使言行合于礼，侧重个人修养；后者强调推己及人、将心比心，侧重处理人际关系，合起来体现仁既要内修自身，又要关爱他人。"},{"q":"“质胜文则野，文胜质则史”蕴含了怎样的审美和修养观念？","a":"它主张内在品质与外在文采要协调统一，偏于任何一方都不理想；只有文质兼备，才是理想的君子，体现了儒家中庸、均衡的修养观。"}]},{"id":"h2a-w02","volume":"h2a","title":"大学之道","author":"《礼记》","dynasty":"先秦","genre":"论说文","kind":"prose","intro":"《大学》原是《礼记》中的一篇，后被宋代学者朱熹列为“四书”之一。本文是其开篇，提出了儒家修身治国的纲领和步骤。","theme":"提出“三纲领”“八条目”，指出修身是齐家、治国、平天下的根本。","tags":["儒家","修身","说理"],"units":[{"t":"大学之道，在明明德，在亲民，在止于至善。","tr":"大学的宗旨，在于彰明光明的德行，在于亲近民众，在于达到最完善的境界。","p":0,"r":1},{"t":"知止而后有定，定而后能静，静而后能安，","tr":"知道要达到的境界，然后志向才能坚定；志向坚定，然后心才能静下来；心静，然后才能安稳；","p":0,"r":1},{"t":"安而后能虑，虑而后能得。","tr":"安稳，然后才能思虑周详；思虑周详，然后才能有所收获。","p":0,"r":1},{"t":"物有本末，事有终始，知所先后，则近道矣。","tr":"万物有根本和枝末，事情有开始和终结，明白了先后次序，就接近大道了。","p":0,"r":1},{"t":"古之欲明明德于天下者，先治其国；","tr":"古代想要在天下彰明光明德行的人，先要治理好自己的国家；","p":1,"r":1},{"t":"欲治其国者，先齐其家；欲齐其家者，先修其身；","tr":"想要治理好国家的人，先要管理好自己的家族；想要管理好家族的人，先要修养自身品德；","p":1,"r":1},{"t":"欲修其身者，先正其心；欲正其心者，先诚其意；","tr":"想要修养自身品德的人，先要端正自己的心思；想要端正心思的人，先要使意念真诚；","p":1,"r":1},{"t":"欲诚其意者，先致其知；致知在格物。","tr":"想要使意念真诚的人，先要获得知识；获得知识的途径在于推究事物的道理。","p":1,"r":1},{"t":"物格而后知至，知至而后意诚，意诚而后心正，","tr":"推究事物的道理，然后才能获得知识；获得知识，然后意念才真诚；意念真诚，然后心思才端正；","p":1,"r":1},{"t":"心正而后身修，身修而后家齐，","tr":"心思端正，然后品德才得到修养；品德得到修养，然后家族才能管理好；","p":1,"r":1},{"t":"家齐而后国治，国治而后天下平。","tr":"家族管理好，然后国家才能治理好；国家治理好，然后天下才能太平。","p":1,"r":1},{"t":"自天子以至于庶人，壹是皆以修身为本。","tr":"从天子到平民百姓，一律都以修养自身品德为根本。","p":2,"r":1},{"t":"其本乱而末治者否矣，其所厚者薄，","tr":"根本被搞乱了而枝末却能治理好，这是不可能的；对于该重视的反而轻视，","p":2,"r":1},{"t":"而其所薄者厚，未之有也！","tr":"而对于该轻视的反而重视，这样的事是从来没有过的！","p":2,"r":1},{"t":"此谓知本，此谓知之至也。","tr":"这就叫做懂得根本，这就叫做认识达到了极点。","p":2,"r":1}],"notes":[{"u":0,"w":"明明德","m":"第一个“明”是使动用法，意为“彰明”；“明德”指光明的德行","t":"词类活用","d":[]},{"u":0,"w":"止","m":"达到并停留","t":"实词","d":["停止，终止","只，仅仅"]},{"u":0,"w":"至善","m":"最完善的境界","t":"实词","d":["极好的人","最善良的心"]},{"u":1,"w":"定","m":"志向坚定","t":"实词","d":["规定，确定","平定，安定"]},{"u":2,"w":"虑","m":"思虑周详","t":"实词","d":["忧虑，担心","谋划"]},{"u":2,"w":"得","m":"有所收获，达到目的","t":"实词","d":["得到赏赐","能够"]},{"u":3,"w":"近道","m":"接近于“道”（事物的规律）","t":"实词","d":["走近路","靠近大路"]},{"u":4,"w":"明明德于天下","m":"介词结构“于天下”后置，即“于天下明明德”","t":"特殊句式","d":[]},{"u":5,"w":"齐","m":"整治，管理好","t":"实词","d":["整齐","相等"]},{"u":6,"w":"正","m":"使……端正（使动用法）","t":"词类活用","d":[]},{"u":6,"w":"诚","m":"使……真诚（使动用法）","t":"词类活用","d":[]},{"u":7,"w":"致知","m":"获得知识","t":"实词","d":["极尽智慧","送达消息"]},{"u":7,"w":"格物","m":"推究事物的道理","t":"实词","d":["改变事物的性质","测量物体"]},{"u":8,"w":"格","m":"推究，穷究","t":"实词","d":["规格，标准","击打"]},{"u":11,"w":"壹是","m":"一概，一律","t":"实词","d":["只有一个正确","唯一的是非"]},{"u":11,"w":"庶人","m":"平民百姓","t":"古今异义","d":["众人，普通人","没有官职的读书人"]},{"u":12,"w":"否","m":"不，不可能","t":"实词","d":["是否","否定，拒绝"]},{"u":13,"w":"未之有也","m":"宾语前置句，即“未有之也”，意为“没有过这样的事”","t":"特殊句式","d":[]}],"tricky":["诚","格","庶","壹","否","虑"],"keyLines":[{"u":0,"hint":"《大学之道》中概括大学宗旨的“三纲领”是："},{"u":3,"hint":"表明明白事物先后次序就接近事理规律的句子是："},{"u":10,"hint":"“八条目”的最后两个层次，即从治理国家到使天下太平的句子是："},{"u":11,"hint":"文中强调无论天子还是庶民，都应以修身为根本的句子是："},{"u":13,"hint":"文中指出重视与轻视颠倒，是不可能把事情做好的两句是："}],"appr":[{"q":"“三纲领”与“八条目”各指什么？二者的关系如何？","a":"三纲领指明明德、亲民、止于至善，是总目标；八条目指格物、致知、诚意、正心、修身、齐家、治国、平天下，是实现目标的具体步骤。二者一纲一目，由内及外，逐层递进。"},{"q":"本文论证中运用了哪些写法？有什么效果？","a":"运用顶真（上句结尾即下句开头）和逆推、顺推结合的方式，把条目环环相扣，逻辑严密、节奏分明，突出修身是根本，增强了说服力。"},{"q":"为什么说“修身”是八条目的核心？","a":"格物、致知、诚意、正心都是个人内在的修养，是修身的基础；齐家、治国、平天下则是修身的外在延伸和实践。因此修身承前启后，是整个体系的枢纽。"}]},{"id":"h2a-w03","volume":"h2a","title":"人皆有不忍人之心","author":"孟子","dynasty":"战国","genre":"论说文","kind":"prose","intro":"选自《孟子·公孙丑上》。孟子主张性善，本文以“乍见孺子将入于井”为例，论证人人都有恻隐等“四端”，并说明应当把它们扩充发展。","theme":"论证人性本善，说明应扩充“四端”，行仁政、保天下。","tags":["儒家","性善","说理"],"units":[{"t":"孟子曰：“人皆有不忍人之心。","tr":"孟子说：“每个人都有不忍心别人受苦的心。","p":0,"r":1},{"t":"先王有不忍人之心，斯有不忍人之政矣。","tr":"古代的圣王有不忍心别人受苦的心，于是就有了不忍心别人受苦的政治。","p":0,"r":1},{"t":"以不忍人之心，行不忍人之政，治天下可运之掌上。","tr":"用不忍人之心去推行不忍人之政，治理天下就像在手掌上转动东西一样容易。","p":0,"r":1},{"t":"所以谓人皆有不忍人之心者，","tr":"我说每个人都有不忍人之心的原因，","p":0,"r":1},{"t":"今人乍见孺子将入于井，皆有怵惕恻隐之心。","tr":"是因为现在有人突然看见一个小孩要掉进井里，都会产生惊惧同情的心理。","p":0,"r":1},{"t":"非所以内交于孺子之父母也，非所以要誉于乡党朋友也，","tr":"这并不是想借此与孩子的父母结交，也不是想在乡邻朋友中博取名誉，","p":0,"r":1},{"t":"非恶其声而然也。","tr":"也不是因为厌恶孩子的哭声才这样。","p":0,"r":1},{"t":"由是观之，无恻隐之心，非人也；","tr":"由此看来，没有同情之心，不是人；","p":1,"r":1},{"t":"无羞恶之心，非人也；无辞让之心，非人也；","tr":"没有羞耻憎恶之心，不是人；没有谦让之心，不是人；","p":1,"r":1},{"t":"无是非之心，非人也。","tr":"没有是非之心，不是人。","p":1,"r":1},{"t":"恻隐之心，仁之端也；羞恶之心，义之端也；","tr":"同情之心是仁的开端；羞耻憎恶之心是义的开端；","p":1,"r":1},{"t":"辞让之心，礼之端也；是非之心，智之端也。","tr":"谦让之心是礼的开端；是非之心是智的开端。","p":1,"r":1},{"t":"人之有是四端也，犹其有四体也。","tr":"人有这四种开端，就像他有四肢一样。","p":1,"r":1},{"t":"有是四端而自谓不能者，自贼者也；","tr":"有这四种开端却自称做不到的人，是自己害自己的人；","p":1,"r":1},{"t":"谓其君不能者，贼其君者也。","tr":"说自己的君主做不到的人，是害自己君主的人。","p":1,"r":1},{"t":"凡有四端于我者，知皆扩而充之矣，","tr":"凡是自己身上有这四种开端的人，知道把它们都扩大充实起来，","p":1,"r":1},{"t":"若火之始然，泉之始达。","tr":"就像火刚刚燃烧，泉水刚刚涌出。","p":1,"r":1},{"t":"苟能充之，足以保四海；","tr":"如果能够扩充它们，就足以安定天下；","p":1,"r":1},{"t":"苟不能充之，不足以事父母。”","tr":"如果不能扩充它们，就连侍奉父母也做不到。”","p":1,"r":1}],"notes":[{"u":0,"w":"不忍人之心","m":"对别人的痛苦不忍心的同情心","t":"实词","d":["不能容忍别人的心思","不愿忍受痛苦的心"]},{"u":1,"w":"斯","m":"就，于是","t":"虚词","d":[]},{"u":2,"w":"运之掌上","m":"在手掌上转动，形容容易","t":"实词","d":["在手掌上运送","靠手掌的力量运转"]},{"u":3,"w":"所以","m":"……的原因","t":"古今异义","d":["表示因果关系的连词","用来……的办法"]},{"u":4,"w":"乍","m":"突然，忽然","t":"实词","d":["刚刚，起初","偶尔"]},{"u":4,"w":"孺子","m":"小孩","t":"实词","d":["年轻的学生","晚辈"]},{"u":4,"w":"怵惕","m":"惊惧，警惕","t":"实词","d":["忧伤","惭愧"]},{"u":4,"w":"恻隐","m":"同情，怜悯","t":"实词","d":["隐藏的悲伤","暗中担心"]},{"u":5,"w":"内交","m":"“内”通“纳”，结交","t":"通假","d":["向内心交托","内部往来"]},{"u":5,"w":"要誉","m":"“要”通“邀”，博取名誉","t":"通假","d":["需要名誉","重要的名声"]},{"u":5,"w":"乡党","m":"乡里，乡邻","t":"实词","d":["同乡的政党","同族的亲属"]},{"u":6,"w":"恶","m":"厌恶（wù）","t":"实词","d":["凶恶，邪恶","坏，不好"]},{"u":10,"w":"端","m":"开端，萌芽","t":"实词","d":["端正","末端，边缘"]},{"u":12,"w":"四体","m":"四肢","t":"古今异义","d":["四种文体","整个身体"]},{"u":13,"w":"贼","m":"伤害，败坏","t":"实词","d":["小偷，盗贼","凶恶的人"]},{"u":14,"w":"贼其君","m":"“贼”是名词作动词，意为“害”","t":"词类活用","d":[]},{"u":15,"w":"扩而充之","m":"扩大并充实它","t":"实词","d":["放大后装满它","开拓并填满它"]},{"u":16,"w":"然","m":"通“燃”，燃烧","t":"通假","d":["这样，如此","然而"]},{"u":17,"w":"苟","m":"如果，假如","t":"虚词","d":[]},{"u":18,"w":"事","m":"侍奉","t":"实词","d":["事情","从事"]}],"tricky":["怵","惕","恻","孺","乍","贼"],"keyLines":[{"u":4,"hint":"孟子举例说明人皆有同情之心，即人们突然看到小孩将要掉进井里时的心理反应是："},{"u":10,"hint":"孟子提出的“四端”中，说明恻隐之心与羞恶之心分别是仁、义的开端的句子是："},{"u":12,"hint":"孟子用来比喻“四端”之于人的重要性，说人有四端就像有四肢一样的句子是："},{"u":16,"hint":"孟子用来比喻四端刚开始发展、需要扩充的两句是："},{"u":18,"hint":"孟子说明如果不扩充善端，后果是连基本的孝道也做不到的句子是："}],"appr":[{"q":"孟子为什么要举“乍见孺子将入于井”的例子？","a":"这一情境突然、紧迫，人不会有功利考虑，仍会产生怵惕恻隐之心，由此可见同情心是人人天生具有的，有力地证明了“人皆有不忍人之心”的论点。"},{"q":"文中“若火之始然，泉之始达”有什么表达效果？","a":"运用比喻，把初生的善端比作刚燃的火、刚涌的泉，形象说明它虽微小却有蓬勃生长的潜力，只要扩充就能壮大，使抽象的道理生动易懂。"},{"q":"本文的论证思路是怎样的？","a":"先提出论点“人皆有不忍人之心”，再举孺子入井的事例证明，进而归纳出四端，最后强调要扩而充之，说明其对保四海、事父母的重要作用，层层推进，条理清晰。"}]},{"id":"h2a-w04","volume":"h2a","title":"老子四章","author":"老子","dynasty":"春秋","genre":"哲理散文（道家经典）","kind":"prose","intro":"《老子》又称《道德经》，是道家学派的代表著作。本篇选取第十一章、第二十四章、第三十三章、第六十四章（节选），分别论述有无相生、自矜之害、自知自胜与防微杜渐。","theme":"以辩证的眼光阐述“有无相生”“知足自胜”“慎始慎终”等处世与为政之道。","tags":["道家","哲理","说理"],"units":[{"t":"三十辐共一毂，当其无，有车之用。","tr":"三十根车辐汇集到一个车毂上，正因为中间是空的，才有车的作用。","p":0,"r":1},{"t":"埏埴以为器，当其无，有器之用。","tr":"揉和陶土制成器皿，正因为中间是空的，才有器皿的作用。","p":0,"r":1},{"t":"凿户牖以为室，当其无，有室之用。","tr":"开凿门窗建成房屋，正因为中间是空的，才有房屋的作用。","p":0,"r":1},{"t":"故有之以为利，无之以为用。","tr":"所以“有”给人便利，“无”发挥作用。","p":0,"r":1},{"t":"企者不立；跨者不行；自见者不明；自是者不彰；","tr":"踮起脚跟的人站不稳；迈大步的人走不远；自我显示的人不显明；自以为是的人不昭彰；","p":1,"r":1},{"t":"自伐者无功；自矜者不长。","tr":"自我夸耀的人没有功劳；自高自大的人不能长久。","p":1,"r":1},{"t":"其在道也，曰：余食赘形。物或恶之，故有道者不处。","tr":"这些行为从“道”的角度看，叫做剩饭和多余的赘瘤，人们大都厌恶它，所以有道的人不这样做。","p":1,"r":1},{"t":"知人者智，自知者明。胜人者有力，自胜者强。","tr":"了解别人的人是智慧的，了解自己的人才是明白；战胜别人的人有力量，战胜自己的人才是真正强大。","p":2,"r":1},{"t":"知足者富。强行者有志。不失其所者久。死而不亡者寿。","tr":"知足的人富有；坚持努力的人有志向；不丧失根基的人能长久；身死而精神不朽的人才是长寿。","p":2,"r":1},{"t":"其安易持，其未兆易谋；其脆易泮，其微易散。","tr":"局面安定时容易保持，事情没有征兆时容易谋划；东西脆弱时容易消解，细微时容易消散。","p":3,"r":1},{"t":"为之于未有，治之于未乱。","tr":"要在事情尚未发生时处理，在祸乱尚未形成时治理。","p":3,"r":1},{"t":"合抱之木，生于毫末；九层之台，起于累土；","tr":"合抱的大树，是从细小的萌芽长成的；九层的高台，是从一筐筐泥土筑起的；","p":3,"r":1},{"t":"千里之行，始于足下。","tr":"千里的路程，是从脚下第一步开始的。","p":3,"r":1},{"t":"为者败之，执者失之。","tr":"强作妄为的人会失败，执意把持的人会失去。","p":3,"r":1},{"t":"是以圣人无为故无败，无执故无失。","tr":"因此圣人不妄为，所以不会失败；不执着，所以不会有所失去。","p":3,"r":1},{"t":"民之从事，常于几成而败之。","tr":"人们做事，常常在接近成功时失败。","p":3,"r":1},{"t":"慎终如始，则无败事。","tr":"事情快完成时仍像开始时那样谨慎，就不会有失败的事了。","p":3,"r":1},{"t":"是以圣人欲不欲，不贵难得之货；","tr":"因此圣人追求别人不追求的，不看重难以得到的财货；","p":3,"r":1},{"t":"学不学，复众人之所过，以辅万物之自然而不敢为。","tr":"学习别人不愿学的，补救众人所犯的过失，以此辅助万物自然发展而不敢妄加干预。","p":3,"r":1}],"notes":[{"u":0,"w":"毂","m":"车轮中心插轴的圆木","t":"实词","d":["车轮的外框","车厢"]},{"u":1,"w":"埏埴","m":"揉和黏土（制陶）","t":"实词","d":["开凿石头","烧制砖瓦"]},{"u":2,"w":"户牖","m":"门窗","t":"实词","d":["门户和墙壁","屋顶和梁柱"]},{"u":3,"w":"利","m":"便利，便利的条件","t":"实词","d":["利益，利润","锋利"]},{"u":4,"w":"企","m":"踮起脚跟","t":"实词","d":["企图，打算","企业，经营"]},{"u":4,"w":"见","m":"通“现”，显示，表现","t":"通假","d":["看见","拜见"]},{"u":4,"w":"彰","m":"显明，昭著","t":"实词","d":["彰显他人","表彰"]},{"u":5,"w":"伐","m":"夸耀","t":"实词","d":["砍伐","讨伐"]},{"u":5,"w":"矜","m":"自高自大","t":"实词","d":["怜悯","拘谨"]},{"u":6,"w":"赘形","m":"多余的、使人厌恶的东西（赘瘤）","t":"实词","d":["华丽的外形","身体的形态"]},{"u":6,"w":"处","m":"居，采取（这种做法）","t":"实词","d":["处理","相处"]},{"u":7,"w":"明","m":"明白，有自知之明","t":"实词","d":["光明，明亮","聪明"]},{"u":8,"w":"强行","m":"坚持不懈地努力","t":"实词","d":["强迫行事","强势地行走"]},{"u":9,"w":"兆","m":"迹象，征兆","t":"实词","d":["数量单位","预兆好运"]},{"u":9,"w":"泮","m":"消解，破裂","t":"实词","d":["学校","水边"]},{"u":11,"w":"毫末","m":"细小的萌芽","t":"实词","d":["极小的数量","微弱的力量"]},{"u":11,"w":"累土","m":"一筐筐堆起来的土","t":"实词","d":["累积的疲劳","劳累的泥土"]},{"u":15,"w":"几","m":"接近，几乎","t":"实词","d":["几个","多少"]},{"u":17,"w":"欲不欲","m":"追求别人所不追求的（前一个“欲”是动词，后一个是名词）","t":"特殊句式","d":[]},{"u":18,"w":"复","m":"补救，挽回","t":"实词","d":["重复","恢复，回来"]}],"tricky":["辐","毂","埏","牖","矜","毫"],"keyLines":[{"u":3,"hint":"《老子》十一章用车、器、室三个例子，总结“有”与“无”关系的结论是："},{"u":7,"hint":"《老子》三十三章中，强调认识自己才是真正明白、战胜自己才是真正强大的两句是："},{"u":11,"hint":"《老子》六十四章中，以大树、高台为喻，说明大事物都由细微处积累而成的两句是："},{"u":12,"hint":"《老子》六十四章中，说明远大目标须从脚下起步的句子是："},{"u":15,"hint":"《老子》六十四章中，指出人们做事常在接近完成时失败的句子是："},{"u":16,"hint":"《老子》六十四章中，告诫人们做事要始终保持谨慎的句子是："}],"appr":[{"q":"第十一章为什么用车、器、室为例说明“有之以为利，无之以为用”？","a":"三者都是实体与空虚相结合：车毂、陶器、房屋的实体提供了条件，而中间空的部分才使它们有实际用途。借日常事物说明“有”与“无”相互依存，强调“无”的重要作用。"},{"q":"“合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下”运用了什么手法？表达了什么道理？","a":"运用排比和比喻，用大树、高台、远行三个形象说明大事由小事积累而成，告诫人们要重视细微之处、从基础做起、脚踏实地。"},{"q":"第三十三章中“知人者智，自知者明”体现了老子怎样的价值取向？","a":"老子把了解别人与了解自己、战胜别人与战胜自己对举，认为向内认识并克服自我比向外认识与战胜他人更为可贵，体现了崇尚自省、重视内在修养的思想。"}]},{"id":"h2a-w05","volume":"h2a","title":"五石之瓠","author":"庄子","dynasty":"战国","genre":"寓言（论说文）","kind":"prose","intro":"选自《庄子·逍遥游》。惠子嫌大葫芦无用而将其砸碎，庄子借“不龟手之药”的故事，说明同一事物因用法不同而作用各异。","theme":"通过寓言说明事物的价值取决于使用者的见识，要打破成见、善于用大。","tags":["道家","寓言","说理"],"units":[{"t":"惠子谓庄子曰：“魏王贻我大瓠之种，","tr":"惠子对庄子说：“魏王送给我大葫芦的种子，","p":0,"r":1},{"t":"我树之成而实五石。","tr":"我把它种下，结出的果实能容纳五石。","p":0,"r":1},{"t":"以盛水浆，其坚不能自举也。","tr":"用来盛水浆，它的坚固程度却承受不住，自己拿不起来。","p":0,"r":1},{"t":"剖之以为瓢，则瓠落无所容。","tr":"剖开它做瓢，又平浅宽大，没有什么东西能容下它。","p":0,"r":1},{"t":"非不呺然大也，吾为其无用而掊之。”","tr":"不是它不够空阔硕大，我因为它没有用处而把它砸碎了。”","p":0,"r":1},{"t":"庄子曰：“夫子固拙于用大矣。","tr":"庄子说：“先生本来就不善于使用大的东西啊。","p":1,"r":1},{"t":"宋人有善为不龟手之药者，世世以洴澼絖为事。","tr":"宋国有个人擅长配制防止手冻裂的药，世世代代以漂洗丝絮为业。","p":1,"r":0},{"t":"客闻之，请买其方百金。","tr":"有位客人听说了，请求用百金买他的药方。","p":1,"r":0},{"t":"聚族而谋曰：‘我世世为洴澼絖，不过数金；","tr":"这个人召集全族人商量说：‘我们世世代代漂洗丝絮，收入不过几金；","p":1,"r":0},{"t":"今一朝而鬻技百金，请与之。’","tr":"现在一下子卖出技术就得百金，请允许把药方给他。’","p":1,"r":0},{"t":"客得之，以说吴王。","tr":"客人得到药方，用它去游说吴王。","p":1,"r":0},{"t":"越有难，吴王使之将。","tr":"越国侵犯吴国，吴王派他统率军队。","p":1,"r":0},{"t":"冬，与越人水战，大败越人，裂地而封之。","tr":"冬天，他同越军进行水战，大败越军，吴王划出土地封赏他。","p":1,"r":0},{"t":"能不龟手一也，或以封，或不免于洴澼絖，","tr":"能使手不冻裂是同一种药，有人靠它得到封赏，有人却免不了漂洗丝絮，","p":1,"r":1},{"t":"则所用之异也。","tr":"这是因为用法不同啊。","p":1,"r":1},{"t":"今子有五石之瓠，何不虑以为大樽而浮乎江湖，","tr":"如今你有能容五石的大葫芦，为什么不考虑把它系在身上当作腰舟，漂浮在江湖之上，","p":1,"r":1},{"t":"而忧其瓠落无所容？","tr":"却担忧它平浅宽大没有东西能容下它呢？","p":1,"r":1},{"t":"则夫子犹有蓬之心也夫！”","tr":"看来先生的心还是被蓬草堵塞着，不通达啊！”","p":1,"r":1}],"notes":[{"u":0,"w":"贻","m":"赠送","t":"实词","d":["遗留，留下","贻误"]},{"u":1,"w":"树","m":"种植","t":"实词","d":["树木","树立"]},{"u":1,"w":"实","m":"容纳，装下","t":"实词","d":["果实，结果","充实，真实"]},{"u":2,"w":"举","m":"拿起，举起","t":"实词","d":["推举，选拔","全，皆"]},{"u":3,"w":"瓠落","m":"平浅而宽大的样子","t":"实词","d":["葫芦掉落","空洞的声音"]},{"u":4,"w":"呺然","m":"空虚、硕大的样子","t":"实词","d":["喧闹的样子","愤怒的样子"]},{"u":4,"w":"掊","m":"砸破，击碎","t":"实词","d":["挖土","抛弃"]},{"u":5,"w":"固","m":"本来，确实","t":"虚词","d":[]},{"u":5,"w":"拙于用大","m":"不善于使用大的东西（“拙于”是“在……方面笨拙”）","t":"特殊句式","d":[]},{"u":6,"w":"龟","m":"通“皲”，皮肤冻裂","t":"通假","d":["乌龟","占卜"]},{"u":6,"w":"洴澼絖","m":"在水中漂洗丝絮","t":"实词","d":["在河边洗衣服","染制丝绸"]},{"u":7,"w":"方","m":"药方，配方","t":"古今异义","d":["方形","方向"]},{"u":9,"w":"鬻","m":"卖","t":"实词","d":["煮粥","买"]},{"u":10,"w":"说","m":"游说（shuì）","t":"实词","d":["说话","高兴，喜悦"]},{"u":11,"w":"难","m":"发难，侵犯","t":"实词","d":["困难","灾难"]},{"u":11,"w":"将","m":"统率军队，任将领","t":"词类活用","d":[]},{"u":12,"w":"裂地","m":"划分出土地","t":"实词","d":["土地裂开","撕裂大地"]},{"u":15,"w":"虑","m":"用绳子系结，缚","t":"实词","d":["思虑，考虑","忧虑"]},{"u":15,"w":"樽","m":"腰舟，系在身上浮水的工具","t":"实词","d":["酒杯","大船"]},{"u":17,"w":"蓬之心","m":"被蓬草堵塞不通的心，喻见识狭窄","t":"典故","d":[]}],"tricky":["瓠","呺","掊","龟","洴","澼","絖","鬻","樽"],"keyLines":[{"u":4,"hint":"惠子因大葫芦无用而把它砸碎，他说明原因的句子是："},{"u":5,"hint":"庄子批评惠子不善于使用大的东西的句子是："},{"u":13,"hint":"庄子用宋人药方的故事总结，同样的药方因用法不同而结果不同，说明这一点的句子是："},{"u":15,"hint":"庄子给惠子出的主意，是把大葫芦当作腰舟浮游江湖，原句是："},{"u":17,"hint":"庄子最后批评惠子见识狭隘、思想不通达的句子是："}],"appr":[{"q":"庄子讲“不龟手之药”的故事有什么用意？","a":"同一种药方，宋人只用于漂洗丝絮，客人却用它助吴王打赢水战而获封赏，说明事物的价值因使用者的眼界不同而不同，借此批评惠子只见大瓠“无用”，不懂得转换角度发现其大用。"},{"q":"“则夫子犹有蓬之心也夫”表达了庄子怎样的态度？","a":"以蓬草堵塞比喻惠子心思狭隘、不通达，语气中带有调侃和批评，也点明了全篇主旨：局限于成见，就看不到事物的大用。"},{"q":"这则寓言在结构和写法上有何特点？","a":"采用对话形式，先由惠子提出问题，再由庄子用故事作类比，最后给出建议并点评，层层推进；寓理于事，形象生动，体现庄子汪洋恣肆、想象奇妙的风格。"}]},{"id":"h2a-w06","volume":"h2a","title":"兼爱","author":"墨子","dynasty":"战国","genre":"论说文","kind":"prose","intro":"选自《墨子·兼爱上》。墨子认为天下大乱源于人们互不相爱，主张“兼相爱”，即平等地爱一切人，以此消除争夺与战乱。","theme":"论证天下之乱起于“不相爱”，提出“兼相爱”才能使天下大治。","tags":["墨家","说理","治乱"],"units":[{"t":"圣人以治天下为事者也，必知乱之所自起，焉能治之；","tr":"圣人把治理天下当作自己的事业，一定要知道祸乱从哪里产生，才能治理它；","p":0,"r":1},{"t":"不知乱之所自起，则弗能治。","tr":"不知道祸乱从哪里产生，就不能治理。","p":0,"r":1},{"t":"譬之如医之攻人之疾者然，必知疾之所自起，焉能攻之；","tr":"这就像医生给人治病一样，一定要知道病从哪里来，才能治好它；","p":0,"r":1},{"t":"不知疾之所自起，则弗能攻。","tr":"不知道病因，就不能医治。","p":0,"r":1},{"t":"治乱者何独不然？必知乱之所自起，焉能治之；","tr":"治理祸乱的人难道不也是这样吗？一定要知道祸乱的起因，才能治理它；","p":0,"r":1},{"t":"不知乱之所自起，则弗能治。","tr":"不知道祸乱的起因，就不能治理。","p":0,"r":1},{"t":"圣人以治天下为事者也，不可不察乱之所自起。","tr":"圣人把治理天下当作自己的事业，不能不考察祸乱产生的原因。","p":1,"r":0},{"t":"当察乱何自起？起不相爱。","tr":"试考察祸乱从哪里产生？产生于人们不相爱。","p":1,"r":0},{"t":"臣子之不孝君父，所谓乱也。","tr":"臣子和儿子不孝敬君主和父亲，这就是所说的乱。","p":1,"r":0},{"t":"子自爱，不爱父，故亏父而自利；","tr":"儿子只爱自己，不爱父亲，所以损害父亲来使自己得利；","p":1,"r":0},{"t":"弟自爱，不爱兄，故亏兄而自利；","tr":"弟弟只爱自己，不爱哥哥，所以损害哥哥来使自己得利；","p":1,"r":0},{"t":"臣自爱，不爱君，故亏君而自利，此所谓乱也。","tr":"臣子只爱自己，不爱君主，所以损害君主来使自己得利，这就是所说的乱。","p":1,"r":0},{"t":"虽父之不慈子，兄之不慈弟，君之不慈臣，此亦天下之所谓乱也。","tr":"即使是父亲不慈爱儿子，哥哥不慈爱弟弟，君主不慈爱臣子，这也是天下所说的乱。","p":1,"r":0},{"t":"父自爱也，不爱子，故亏子而自利；","tr":"父亲只爱自己，不爱儿子，所以损害儿子来使自己得利；","p":1,"r":0},{"t":"兄自爱也，不爱弟，故亏弟而自利；","tr":"哥哥只爱自己，不爱弟弟，所以损害弟弟来使自己得利；","p":1,"r":0},{"t":"君自爱也，不爱臣，故亏臣而自利。","tr":"君主只爱自己，不爱臣子，所以损害臣子来使自己得利。","p":1,"r":0},{"t":"是何也？皆起不相爱。","tr":"这是为什么呢？都产生于不相爱。","p":1,"r":0},{"t":"虽至天下之为盗贼者亦然。","tr":"即使到了天下做盗贼的人，也是这样。","p":2,"r":0},{"t":"盗爱其室，不爱其异室，故窃异室以利其室；","tr":"盗贼只爱自己的家，不爱别人的家，所以偷别人家的东西来使自己家得利；","p":2,"r":0},{"t":"贼爱其身，不爱人，故贼人以利其身。","tr":"贼人只爱自己，不爱别人，所以伤害别人来使自己得利。","p":2,"r":0},{"t":"此何也？皆起不相爱。","tr":"这是为什么呢？都产生于不相爱。","p":2,"r":0},{"t":"虽至大夫之相乱家，诸侯之相攻国者，亦然。","tr":"即使到了大夫之间互相扰乱对方的封地，诸侯之间互相攻打对方的国家，也是这样。","p":3,"r":0},{"t":"大夫各爱其家，不爱异家，故乱异家以利其家；","tr":"大夫各自爱自己的封地，不爱别人的封地，所以扰乱别人的封地来使自己得利；","p":3,"r":0},{"t":"诸侯各爱其国，不爱异国，故攻异国以利其国。","tr":"诸侯各自爱自己的国家，不爱别国，所以攻打别国来使自己的国家得利。","p":3,"r":0},{"t":"天下之乱物，具此而已矣。","tr":"天下的祸乱之事，全都在这里了。","p":3,"r":0},{"t":"察此何自起？皆起不相爱。","tr":"考察这些从哪里产生？都产生于不相爱。","p":3,"r":0},{"t":"若使天下兼相爱，爱人若爱其身，犹有不孝者乎？","tr":"假如天下人都彼此相爱，爱别人就像爱自己一样，还会有不孝的人吗？","p":4,"r":0},{"t":"视父兄与君若其身，恶施不孝？","tr":"看待父亲、兄长与君主像看待自己一样，怎么会有不孝的行为？","p":4,"r":0},{"t":"犹有不慈者乎？视弟子与臣若其身，恶施不慈？","tr":"还会有不慈爱的人吗？看待弟弟、儿子与臣子像看待自己一样，怎么会有不慈爱的行为？","p":4,"r":0},{"t":"故不孝不慈亡有。","tr":"所以不孝、不慈就没有了。","p":4,"r":0},{"t":"犹有盗贼乎？视人之室若其室，谁窃？","tr":"还会有盗贼吗？看待别人的家像自己的家，谁会去偷？","p":4,"r":0},{"t":"视人身若其身，谁贼？故盗贼亡有。","tr":"看待别人像自己，谁会去伤害？所以盗贼就没有了。","p":4,"r":0},{"t":"犹有大夫之相乱家、诸侯之相攻国者乎？","tr":"还会有大夫互相扰乱封地、诸侯互相攻打国家的事吗？","p":4,"r":0},{"t":"视人家若其家，谁乱？视人国若其国，谁攻？","tr":"看待别人的封地像自己的封地，谁会去扰乱？看待别国像自己的国家，谁会去攻打？","p":4,"r":0},{"t":"故大夫之相乱家、诸侯之相攻国者亡有。","tr":"所以大夫互相扰乱封地、诸侯互相攻打国家的事就没有了。","p":4,"r":0},{"t":"若使天下兼相爱，国与国不相攻，家与家不相乱，","tr":"假如天下人都彼此相爱，国与国不互相攻打，家与家不互相扰乱，","p":5,"r":1},{"t":"盗贼无有，君臣父子皆能孝慈，若此则天下治。","tr":"没有盗贼，君臣父子都能做到孝敬慈爱，像这样天下就太平了。","p":5,"r":1},{"t":"故圣人以治天下为事者，恶得不禁恶而劝爱？","tr":"所以把治理天下当作事业的圣人，怎么能不禁止憎恶而鼓励相爱呢？","p":5,"r":1},{"t":"故天下兼相爱则治，交相恶则乱。","tr":"所以天下人互相兼爱就太平，互相憎恶就混乱。","p":5,"r":1},{"t":"故子墨子曰“不可以不劝爱人”者，此也。","tr":"所以墨子先生说“不可以不劝人相爱”，就是这个道理。","p":5,"r":1}],"notes":[{"u":0,"w":"以治天下为事","m":"把治理天下当作自己的事业（“以……为……”）","t":"特殊句式","d":[]},{"u":0,"w":"焉","m":"才，乃","t":"虚词","d":[]},{"u":1,"w":"弗","m":"不","t":"实词","d":["不能够","没有"]},{"u":2,"w":"攻","m":"治疗，医治","t":"古今异义","d":["进攻，攻打","批评，指责"]},{"u":2,"w":"譬","m":"比方，比喻","t":"实词","d":["譬如，例如","斥责"]},{"u":4,"w":"何独不然","m":"难道唯独不是这样吗（反问）","t":"特殊句式","d":[]},{"u":6,"w":"察","m":"考察，弄清","t":"实词","d":["警察","觉察，发觉"]},{"u":7,"w":"当","m":"通“尝”，试，试着","t":"通假","d":["应当","正当，承担"]},{"u":7,"w":"何自起","m":"从哪里产生（宾语前置）","t":"特殊句式","d":[]},{"u":9,"w":"亏","m":"损害","t":"实词","d":["亏损，欠缺","亏待"]},{"u":12,"w":"慈","m":"慈爱","t":"实词","d":["慈祥","仁慈"]},{"u":18,"w":"室","m":"家，家庭","t":"古今异义","d":["房间","妻子"]},{"u":19,"w":"贼","m":"伤害，残害（名词作动词）","t":"词类活用","d":[]},{"u":21,"w":"乱家","m":"扰乱别人的封地（“乱”为使动用法）","t":"词类活用","d":[]},{"u":24,"w":"具","m":"完备，全都","t":"实词","d":["具备条件","器具"]},{"u":26,"w":"兼相爱","m":"不分亲疏，普遍地互相爱护","t":"实词","d":["同时爱几个人","兼顾爱和恨"]},{"u":27,"w":"恶","m":"怎么（wū，疑问代词）","t":"实词","d":["憎恶（wù）","凶恶（è）"]},{"u":29,"w":"亡","m":"通“无”，没有","t":"通假","d":["逃亡","灭亡"]},{"u":37,"w":"劝","m":"鼓励，勉励","t":"实词","d":["劝说，规劝","劝阻"]},{"u":38,"w":"交相恶","m":"互相憎恶","t":"实词","d":["交往时互相厌恶","彼此凶恶"]},{"u":39,"w":"子墨子","m":"墨子的弟子对墨子的尊称，即“墨子先生”","t":"古今异义","d":["儿子墨子","孔子之子"]}],"tricky":["亏","窃","贼","劝","慈","譬"],"keyLines":[{"u":0,"hint":"墨子认为圣人治理天下，必须先弄清祸乱起因，他提出的前提句是："},{"u":7,"hint":"墨子指出天下祸乱的根源，一句话概括为："},{"u":18,"hint":"墨子说盗贼只爱自己的家，所以偷别人家来使自己家得利的句子是："},{"u":38,"hint":"文末总结相爱与治乱关系的两句是："},{"u":36,"hint":"墨子设想天下人兼相爱后，社会将是国与国不攻、家与家不乱的句子是："}],"appr":[{"q":"文章开头为什么用医生治病作比？","a":"用医生必先知病因才能治病作类比，说明治理天下的人必须先找出祸乱的根源，使“知乱之所自起”这一前提自然而有说服力，也引出下文对乱源“不相爱”的分析。"},{"q":"文章在结构和论证上有什么特点？","a":"先立前提，再由分析乱源（不相爱）转入列举：子臣、父兄君、盗贼、大夫诸侯，层层推及，最后提出“兼相爱”的方案并用反问加以论证，结论明确，逻辑严密。"},{"q":"文中反复出现的“皆起不相爱”有何作用？","a":"它是全文的核心论断，每一类祸乱之后都以此句收束，形成强烈的重复和呼应，强化了“不相爱”是乱之根源的论点，也使结构整齐、节奏鲜明。"}]},{"id":"h2b-p01","volume":"h2b","title":"燕歌行并序","author":"高适","dynasty":"唐","genre":"乐府诗（七言歌行）","kind":"poem","intro":"开元二十六年，高适遇到一位随军出塞归来的人，读了他的《燕歌行》，有感于边地征戍之事而写下此和作，借汉写唐，反映边塞战争的苦与悲。","theme":"歌颂战士的忠勇，揭露将帅骄逸轻敌、苦乐不均，抒发对征人思妇的同情与对良将的渴望。","tags":["边塞","战争","同情","讽刺"],"units":[{"t":"开元二十六年，客有从御史大夫张公出塞而还者，作《燕歌行》以示适。","tr":"开元二十六年，有位客人跟随御史大夫张公出塞后回来，写了一首《燕歌行》给我看。","p":0,"r":0},{"t":"感征戍之事，因而和焉。","tr":"我有感于边地征战戍守的事情，于是依其意作了这首和诗。","p":0,"r":0},{"t":"汉家烟尘在东北，汉将辞家破残贼。","tr":"汉朝（实指唐朝）东北边境烽烟又起，将军辞别家园去讨伐残暴的敌人。","p":1,"r":1},{"t":"男儿本自重横行，天子非常赐颜色。","tr":"男儿本来就看重驰骋疆场，天子又格外赏赐他荣耀的恩宠。","p":1,"r":1},{"t":"摐金伐鼓下榆关，旌旆逶迤碣石间。","tr":"敲着钲、擂着鼓开出榆关，旗帜连绵不断地飘扬在碣石山一带。","p":2,"r":1},{"t":"校尉羽书飞瀚海，单于猎火照狼山。","tr":"校尉的紧急文书飞传过大沙漠，敌方首领的猎火映红了狼山。","p":2,"r":1},{"t":"山川萧条极边土，胡骑凭陵杂风雨。","tr":"山河一片萧条，直到边地尽头，敌人的骑兵挟着风雨般的气势凶猛逼来。","p":3,"r":1},{"t":"战士军前半死生，美人帐下犹歌舞。","tr":"战士在阵前一半战死一半生还，将军帐中的美人还在歌舞取乐。","p":3,"r":1},{"t":"大漠穷秋塞草衰，孤城落日斗兵稀。","tr":"大漠中深秋草木枯衰，孤城里夕阳西下，拼杀的兵士越来越少。","p":3,"r":1},{"t":"身当恩遇恒轻敌，力尽关山未解围。","tr":"将军自恃受到皇恩而常常轻视敌人，直到精疲力竭也没能解除关山之围。","p":3,"r":1},{"t":"铁衣远戍辛勤久，玉箸应啼别离后。","tr":"披着铁甲远戍边疆，辛苦已久；家中妻子自分别以后想必泪流不止。","p":4,"r":1},{"t":"少妇城南欲断肠，征人蓟北空回首。","tr":"少妇在城南愁得肝肠欲断，征人在蓟北徒然回望故乡。","p":4,"r":1},{"t":"边庭飘飖那可度，绝域苍茫更何有。","tr":"边地动荡不安，怎能飞渡回去；荒远的绝域一片苍茫，还有什么指望。","p":5,"r":1},{"t":"杀气三时作阵云，寒声一夜传刁斗。","tr":"战场上的杀气整日凝成阵阵乌云，寒夜里刁斗的声响彻夜传递。","p":5,"r":1},{"t":"相看白刃血纷纷，死节从来岂顾勋。","tr":"眼看着白刃相交，鲜血纷飞，为节义而死的人从来不是为了功勋。","p":5,"r":1},{"t":"君不见沙场征战苦，至今犹忆李将军。","tr":"您没看见战场上征战多么艰苦吗？直到今天人们还怀念李广将军。","p":5,"r":1}],"notes":[{"u":2,"w":"汉家","m":"借汉指唐","t":"典故"},{"u":3,"w":"颜色","m":"脸色，引申为恩宠和荣耀","t":"古今异义","d":["容貌色彩","神情气色"]},{"u":3,"w":"横行","m":"纵横驰骋、无所阻挡","t":"实词","d":["蛮横行事","横着行走"]},{"u":4,"w":"摐","m":"撞击，敲击","t":"实词","d":["拖拽","丛生"]},{"u":4,"w":"金","m":"钲一类的金属响器","t":"实词","d":["黄金","金属钱币"]},{"u":4,"w":"逶迤","m":"曲折连绵的样子","t":"实词","d":["缓慢下垂","整齐有序"]},{"u":6,"w":"凭陵","m":"仗势侵犯","t":"实词","d":["登高凭吊","依靠山陵"]},{"u":7,"w":"半死生","m":"一半战死，一半活着","t":"特殊句式"},{"u":9,"w":"恒","m":"常常","t":"实词","d":["永恒","坚定"]},{"u":10,"w":"铁衣","m":"铠甲，借指战士","t":"实词","d":["铁制的衣服","生锈的衣物"]},{"u":10,"w":"玉箸","m":"玉筷，比喻思妇的眼泪","t":"典故"},{"u":13,"w":"三时","m":"早、午、晚，即整天","t":"实词","d":["三个季节","三个时辰"]},{"u":13,"w":"刁斗","m":"军中白天煮饭、夜间敲击巡更的铜器","t":"实词","d":["刀斗","斗笠"]},{"u":15,"w":"李将军","m":"汉代名将李广，爱护士卒，此处借指体恤士兵的良将","t":"典故"}],"tricky":["摐","榆","逶","迤","箸","刁"],"keyLines":[{"u":3,"hint":"诗中表现将士渴望建功立业又受到天子恩宠的两句是："},{"u":7,"hint":"通过苦乐悬殊的对比，批判将领骄奢享乐的两句是："},{"u":9,"hint":"指出主将自恃受宠而轻敌，以致战败受困的两句是："},{"u":11,"hint":"以对偶写思妇与征人两地相思的两句是："},{"u":15,"hint":"诗歌结尾借历史名将表达对良将的怀念的两句是："}],"appr":[{"q":"“战士军前半死生，美人帐下犹歌舞”运用了什么手法？有何作用？","a":"运用对比，把前线战士浴血牺牲与帐中将军歌舞宴乐并置，强烈揭露了军中苦乐不均、将帅腐败，批判意味鲜明。"},{"q":"诗末为什么提到“李将军”？","a":"李广爱护士卒、与士兵同甘共苦。诗人借他反衬当时将领的骄奢无能，寄托对良将的渴望，也使全诗在悲壮中见出深沉的反思。"},{"q":"这首诗在情感上有怎样的变化？","a":"开篇写出征的豪迈，继而写战事艰难、将帅失职，再写征人思妇的哀怨，最后归于对良将的呼唤，由昂扬转为悲慨，情感层层深入。"}]},{"id":"h2b-p02","volume":"h2b","title":"李凭箜篌引","author":"李贺","dynasty":"唐","genre":"乐府诗（七言古体）","kind":"poem","intro":"李贺以奇崛的想象和浓烈的色彩，描写乐工李凭弹奏箜篌的美妙乐声，是唐诗中摹写音乐的名篇。","theme":"通过神话想象与奇异意象，极写箜篌乐声的感人至深、惊天动地。","tags":["音乐","想象","神话"],"units":[{"t":"吴丝蜀桐张高秋，空山凝云颓不流。","tr":"用吴地的丝弦、蜀地的桐木制成的箜篌在高秋时节弹响，空山中的云被凝住，缓缓下垂不再流动。","p":0,"r":1},{"t":"江娥啼竹素女愁，李凭中国弹箜篌。","tr":"湘水女神在竹上洒泪，素女也为之忧愁，李凭正在国都里弹奏箜篌。","p":0,"r":1},{"t":"昆山玉碎凤凰叫，芙蓉泣露香兰笑。","tr":"乐声时而如昆山美玉碎裂，如凤凰鸣叫；时而如荷花带露哭泣，如香兰含笑绽放。","p":0,"r":1},{"t":"十二门前融冷光，二十三丝动紫皇。","tr":"长安城十二座门前的寒光被乐声融化，二十三根琴弦的声音惊动了天帝。","p":0,"r":1},{"t":"女娲炼石补天处，石破天惊逗秋雨。","tr":"乐声冲到女娲炼石补天的地方，巨石被震破，天空受惊，引来了绵绵秋雨。","p":0,"r":1},{"t":"梦入神山教神妪，老鱼跳波瘦蛟舞。","tr":"乐声引人梦入神山，仿佛教给神妪弹奏，老鱼在波浪中跳跃，瘦蛟也翩翩起舞。","p":0,"r":1},{"t":"吴质不眠倚桂树，露脚斜飞湿寒兔。","tr":"吴刚听得忘了睡眠，倚着桂树不动，露珠斜飞下来，打湿了月宫的玉兔。","p":0,"r":1}],"notes":[{"u":0,"w":"张","m":"张设，这里指弹奏","t":"实词","d":["张开","扩大"]},{"u":0,"w":"吴丝蜀桐","m":"吴地的丝、蜀地的桐木，指制作箜篌的上好材料","t":"实词","d":["吴国的蚕和蜀国的树","吴蜀两地的歌者"]},{"u":0,"w":"颓","m":"向下坠，垂下","t":"实词","d":["衰败","倒塌"]},{"u":1,"w":"江娥","m":"湘水女神，相传娥皇、女英泪洒斑竹","t":"典故"},{"u":1,"w":"素女","m":"传说中善于鼓瑟的神女","t":"典故"},{"u":1,"w":"中国","m":"国都之中，指京城长安","t":"古今异义","d":["中华人民共和国","中原地区"]},{"u":2,"w":"昆山","m":"昆仑山，传说产美玉","t":"实词","d":["昆明的山","昆仑的泉水"]},{"u":3,"w":"紫皇","m":"天帝，道教中的最高神","t":"典故"},{"u":4,"w":"女娲炼石补天","m":"神话：女娲炼五色石补好破裂的天","t":"典故"},{"u":4,"w":"逗","m":"引来，招惹","t":"实词","d":["停留","逗乐"]},{"u":5,"w":"神妪","m":"传说中擅长弹奏箜篌的女仙，即成夫人","t":"典故"},{"u":6,"w":"吴质","m":"即吴刚，神话中月宫里砍桂树的人","t":"典故"},{"u":6,"w":"露脚","m":"垂落的露珠","t":"实词","d":["露出脚掌","晨光渐亮"]}],"tricky":["箜篌","颓","妪","蛟","桂"],"keyLines":[{"u":2,"hint":"用玉碎、凤鸣、露泣、兰笑比喻乐声变化多端的两句是："},{"u":4,"hint":"以神话想象极写乐声震撼天地的两句是："},{"u":5,"hint":"写乐声感动水中生物的两句是："},{"u":6,"hint":"最后借月宫神话写乐声余韵，使人忘倦的两句是："}],"appr":[{"q":"诗人是怎样表现无形的音乐的？","a":"诗人用玉碎凤鸣、露泣兰笑等通感式比喻写声音本身，又用云凝、江娥落泪、石破天惊、鱼蛟起舞等听者的反应从侧面烘托，把抽象的音乐写得可感可触。"},{"q":"“石破天惊逗秋雨”好在哪里？","a":"把乐声推向高潮：乐声高亢到震裂补天之石、惊动天空，引来秋雨。想象奇特夸张，突出了乐声穿透天地的巨大力量。"},{"q":"这首诗体现了李贺怎样的诗风？","a":"诗风奇诡瑰丽，擅用神话和冷艳意象，想象大胆，造语新奇，富有浪漫色彩。"}]},{"id":"h2b-p03","volume":"h2b","title":"锦瑟","author":"李商隐","dynasty":"唐","genre":"七言律诗","kind":"poem","intro":"李商隐晚年追忆平生而作，以锦瑟起兴，借多个典故与意象写情，意旨朦胧，历来有悼亡、自伤身世等多种解读。","theme":"借锦瑟引发对华年往事的追忆，抒发人生如梦、情难追回的怅惘。","tags":["怀古伤今","象征","典故"],"units":[{"t":"锦瑟无端五十弦，一弦一柱思华年。","tr":"锦瑟没来由地有五十根弦，每一根弦、每一个柱，都引起我对青春岁月的思念。","p":0,"r":1},{"t":"庄生晓梦迷蝴蝶，望帝春心托杜鹃。","tr":"庄周在清晨的梦里迷惑于蝴蝶，望帝把春日般的哀怨之心寄托给杜鹃。","p":0,"r":1},{"t":"沧海月明珠有泪，蓝田日暖玉生烟。","tr":"沧海月明之夜，鲛人的泪化为珍珠；蓝田日暖之时，美玉升起缥缈的轻烟。","p":0,"r":1},{"t":"此情可待成追忆，只是当时已惘然。","tr":"这样的情怀哪里要等到今天才成为追忆，只是当时就已经怅惘迷茫了。","p":0,"r":1}],"notes":[{"u":0,"w":"无端","m":"没来由，无缘无故","t":"实词","d":["没有尽头","没有端正"]},{"u":0,"w":"华年","m":"美好的青春年华","t":"实词","d":["华丽的年岁","中年时光"]},{"u":1,"w":"庄生晓梦迷蝴蝶","m":"用庄周梦蝶的典故，写人生如梦、真幻难辨","t":"典故"},{"u":1,"w":"望帝","m":"传说中古蜀国国君杜宇，死后魂化杜鹃","t":"典故"},{"u":2,"w":"珠有泪","m":"传说鲛人泣泪成珠","t":"典故"},{"u":2,"w":"蓝田","m":"地名，盛产美玉","t":"实词","d":["蓝色的田野","田园"]},{"u":3,"w":"可待","m":"岂待，哪里要等到","t":"古今异义","d":["可以等待","值得期待"]},{"u":3,"w":"惘然","m":"迷茫失意的样子","t":"实词","d":["愤怒","若有所失地等待"]}],"tricky":["瑟","蝶","鹃","蓝","惘"],"keyLines":[{"u":0,"hint":"以锦瑟起兴，引出对往昔岁月的追思的两句是："},{"u":1,"hint":"诗中借庄周梦蝶、杜鹃啼血的典故抒写迷离与哀怨的两句是："},{"u":2,"hint":"以珠泪、玉烟营造朦胧凄美意境的两句是："},{"u":3,"hint":"诗的结尾点明当时就已怅惘、情感难以追回的两句是："}],"appr":[{"q":"颔联和颈联用了哪些典故？表达什么？","a":"颔联用庄周梦蝶、望帝化鹃，颈联用鲛人泣珠、蓝田玉烟，借这些迷离奇幻的意象表达人生如梦、情感哀怨难言的怅惘。"},{"q":"“此情可待成追忆，只是当时已惘然”好在哪里？","a":"用一问一转的结构写出情感的深度：不但今日追忆时伤感，当时身在其中就已迷茫失意，使惆怅层层加深，余味无穷。"},{"q":"这首诗在表现手法上有什么特点？","a":"以锦瑟起兴，全诗用典、象征和比兴，意象华美而朦胧，感情凄婉含蓄，是李商隐诗风的代表。"}]},{"id":"h2b-p04","volume":"h2b","title":"书愤","author":"陆游","dynasty":"南宋","genre":"七言律诗","kind":"poem","intro":"淳熙十三年，陆游罢官闲居山阴，回顾早年抗金经历，感慨壮志难酬、年华老去，写下此诗。","theme":"回忆抗金壮举，抒发壮志未酬、岁月蹉跎的悲愤，并以诸葛亮自勉。","tags":["爱国","抒怀","怀古"],"units":[{"t":"早岁那知世事艰，中原北望气如山。","tr":"年轻时哪里知道世事艰难，向北遥望中原，豪气如山一样高大。","p":0,"r":1},{"t":"楼船夜雪瓜洲渡，铁马秋风大散关。","tr":"雪夜里，战船驻守在瓜洲渡口；秋风中，铁骑奔驰在大散关前。","p":0,"r":1},{"t":"塞上长城空自许，镜中衰鬓已先斑。","tr":"我曾以塞上长城自许，如今却成空话；对镜一看，衰老的鬓发已先斑白。","p":0,"r":1},{"t":"出师一表真名世，千载谁堪伯仲间！","tr":"诸葛亮的《出师表》真是名垂当世，千百年来谁能与他相提并论？","p":0,"r":1}],"notes":[{"u":0,"w":"那","m":"哪里，怎么","t":"实词","d":["那个","那边"]},{"u":0,"w":"北望","m":"向北遥望","t":"词类活用"},{"u":1,"w":"楼船","m":"古代的大型战船","t":"实词","d":["楼阁般的客船","装有楼房的游船"]},{"u":1,"w":"铁马","m":"披着铁甲的战马，借指精锐骑兵","t":"实词","d":["铁制的马","铁锈色的马"]},{"u":2,"w":"塞上长城","m":"南朝名将檀道济自比的比喻，喻指国家的屏障","t":"典故"},{"u":2,"w":"空","m":"白白地","t":"实词","d":["天空","空虚"]},{"u":2,"w":"先","m":"提前","t":"实词","d":["先前","首先"]},{"u":3,"w":"名世","m":"名闻当世，闻名于世","t":"实词","d":["世人命名","知名于后世"]}],"tricky":["瓜","洲","斑","伯","仲"],"keyLines":[{"u":0,"hint":"写诗人年轻时对世事艰难缺乏认识、满怀豪情的句子是："},{"u":1,"hint":"以两处战场名胜写抗金壮景，不用动词的两句是："},{"u":2,"hint":"表达自己曾以国家柱石自许，如今壮志成空的句子是："},{"u":3,"hint":"诗人借赞扬诸葛亮，表达自己有志报国的两句是："}],"appr":[{"q":"颔联“楼船夜雪瓜洲渡，铁马秋风大散关”有什么特点？","a":"连用六个名词性意象并列，无一动词，却展现出水陆战场的壮阔画面，雪夜与秋风、楼船与铁马相映，有力地表现了当年抗金的豪情与气势。"},{"q":"颈联表达了怎样的感情？","a":"“空自许”与“已先斑”形成对比，既有壮志落空的愤懑，也有年华老去的悲叹，由昔日雄心转向眼前失落，感情沉痛。"},{"q":"尾联为什么要提到《出师表》？","a":"诗人借诸葛亮“鞠躬尽瘁”的精神自勉，也暗示自己想北伐而不得，进一步强调报国志向未减，同时含有对朝廷的失望。"}]},{"id":"h2b-w01","volume":"h2b","title":"屈原列传（节选）","author":"司马迁","dynasty":"西汉","genre":"传记（史传）","kind":"prose","intro":"选自《史记·屈原贾生列传》，司马迁为屈原立传，叙述其遭谗被疏、楚国衰败，以及自沉汨罗的经过，并给予高度评价。","theme":"记述屈原忠而被谤、忧愤作《离骚》以至殉国的经历，赞颂其高洁品格与爱国精神。","tags":["史传","爱国","忠奸对比"],"units":[{"t":"屈原者，名平，楚之同姓也。","tr":"屈原，名平，和楚王同属一个宗族。","p":0,"r":0},{"t":"为楚怀王左徒。","tr":"他担任楚怀王的左徒。","p":0,"r":0},{"t":"博闻强志，明于治乱，娴于辞令。","tr":"他见闻广博，记忆力强，通晓治乱的道理，熟悉外交辞令。","p":0,"r":0},{"t":"入则与王图议国事，以出号令；","tr":"在朝内就和怀王商议国家大事，发布号令；","p":0,"r":0},{"t":"出则接遇宾客，应对诸侯。","tr":"在朝外就接待宾客，应酬诸侯。","p":0,"r":0},{"t":"王甚任之。","tr":"怀王非常信任他。","p":0,"r":0},{"t":"上官大夫与之同列，争宠而心害其能。","tr":"上官大夫和他地位相同，因争宠而内心嫉妒他的才能。","p":1,"r":0},{"t":"怀王使屈原造为宪令，屈平属草稿未定。","tr":"怀王让屈原制定国家法令，屈原起草尚未定稿。","p":1,"r":0},{"t":"上官大夫见而欲夺之，屈平不与，","tr":"上官大夫看见后想强行夺取，屈原不肯给他，","p":1,"r":0},{"t":"因谗之曰：“王使屈平为令，众莫不知，","tr":"于是他进谗言说：“大王让屈平制定法令，没有人不知道，","p":1,"r":0},{"t":"每一令出，平伐其功，曰以为‘非我莫能为’也。”","tr":"每一条法令发出，屈平就夸耀自己的功劳，说‘除了我，没有人能制定’。”","p":1,"r":0},{"t":"王怒而疏屈平。","tr":"怀王发怒，因而疏远了屈原。","p":1,"r":0},{"t":"屈平疾王听之不聪也，谗谄之蔽明也，","tr":"屈原痛恨怀王听信不明、谗言谄媚遮蔽了明察，","p":2,"r":1},{"t":"邪曲之害公也，方正之不容也，","tr":"邪恶不正的小人损害公道，品行端正的人不被容纳，","p":2,"r":1},{"t":"故忧愁幽思而作《离骚》。","tr":"所以他忧愁深思而创作了《离骚》。","p":2,"r":1},{"t":"“离骚”者，犹离忧也。","tr":"“离骚”，就是遭遇忧愁的意思。","p":2,"r":1},{"t":"夫天者，人之始也；父母者，人之本也。","tr":"天是人类的开始，父母是人的根本。","p":2,"r":1},{"t":"人穷则反本，故劳苦倦极，未尝不呼天也；","tr":"人处境窘迫就会追念根本，所以劳苦疲倦到极点，没有不呼喊上天的；","p":2,"r":1},{"t":"疾痛惨怛，未尝不呼父母也。","tr":"病痛悲伤到极点，没有不呼喊父母的。","p":2,"r":1},{"t":"屈平正道直行，竭忠尽智以事其君，","tr":"屈原行为正直，竭尽忠诚和智慧来侍奉他的君主，","p":2,"r":1},{"t":"谗人间之，可谓穷矣。","tr":"谗佞小人离间他，可以说是处境窘迫了。","p":2,"r":1},{"t":"信而见疑，忠而被谤，能无怨乎？","tr":"诚信却被怀疑，忠诚却被诽谤，能没有怨愤吗？","p":2,"r":1},{"t":"屈平之作《离骚》，盖自怨生也。","tr":"屈原创作《离骚》，大概是由怨愤引发的吧。","p":2,"r":1},{"t":"《国风》好色而不淫，《小雅》怨诽而不乱。","tr":"《国风》写爱情而不过度，《小雅》有怨刺而不作乱。","p":2,"r":1},{"t":"若《离骚》者，可谓兼之矣。","tr":"像《离骚》这样的作品，可以说兼有这两种长处了。","p":2,"r":1},{"t":"上称帝喾，下道齐桓，中述汤武，以刺世事。","tr":"上称颂帝喾，下称道齐桓公，中间叙述商汤周武，用来讽刺时事。","p":2,"r":1},{"t":"明道德之广崇，治乱之条贯，靡不毕见。","tr":"阐明道德的广大崇高，治乱兴衰的条理，无不完全显现。","p":2,"r":1},{"t":"其文约，其辞微，其志洁，其行廉。","tr":"他的文笔简约，言辞含蓄，志趣高洁，行为廉正。","p":2,"r":1},{"t":"其称文小而其指极大，举类迩而见义远。","tr":"文中所举事例虽小，旨趣却极大；列举的事物浅近，表达的意义深远。","p":2,"r":1},{"t":"其志洁，故其称物芳；其行廉，故死而不容。","tr":"他志趣高洁，所以文中用物芬芳；行为廉正，所以至死不为世所容。","p":2,"r":1},{"t":"自疏濯淖污泥之中，蝉蜕于浊秽，","tr":"他主动远离污泥浊水，像蝉脱壳一样摆脱污浊，","p":2,"r":1},{"t":"以浮游尘埃之外，不获世之滋垢，","tr":"浮游在尘世之外，不沾染世俗的污垢，","p":2,"r":1},{"t":"皭然泥而不滓者也。","tr":"他洁白如玉，处在污泥中而不被染黑。","p":2,"r":1},{"t":"推此志也，虽与日月争光可也。","tr":"推究他的志向，即使说他与日月争辉也是可以的。","p":2,"r":1},{"t":"屈原既绌，其后秦欲伐齐，","tr":"屈原被罢黜以后，秦国想攻打齐国，","p":3,"r":0},{"t":"齐与楚从亲，惠王患之，","tr":"齐国与楚国合纵相亲，秦惠王对此担忧，","p":3,"r":0},{"t":"乃令张仪详去秦，厚币委质事楚，","tr":"就让张仪假装离开秦国，带着厚礼向楚国献礼表示臣服，","p":3,"r":0},{"t":"曰：“秦甚憎齐，齐与楚从亲，","tr":"说：“秦国非常憎恨齐国，齐国与楚国合纵相亲，","p":3,"r":0},{"t":"楚诚能绝齐，秦愿献商於之地六百里。”","tr":"楚国如果真能和齐国断交，秦国愿意献上商於一带六百里的土地。”","p":3,"r":0},{"t":"楚怀王贪而信张仪，遂绝齐，","tr":"楚怀王贪心而相信张仪，于是与齐国断交，","p":3,"r":0},{"t":"使使如秦受地。","tr":"派使者到秦国接受土地。","p":3,"r":0},{"t":"张仪诈之曰：“仪与王约六里，不闻六百里。”","tr":"张仪欺骗他们说：“我和楚王约定的是六里，没听说过六百里。”","p":3,"r":0},{"t":"楚使怒去，归告怀王。","tr":"楚国使者愤怒地离去，回来报告怀王。","p":3,"r":0},{"t":"怀王怒，大兴师伐秦。","tr":"怀王大怒，大规模出兵攻打秦国。","p":3,"r":0},{"t":"秦发兵击之，大破楚师于丹、淅，","tr":"秦国出兵迎击，在丹水、淅水一带大败楚军，","p":3,"r":0},{"t":"斩首八万，虏楚将屈匄，遂取楚之汉中地。","tr":"斩杀八万人，俘虏楚将屈匄，于是夺取了楚国的汉中地区。","p":3,"r":0},{"t":"怀王乃悉发国中兵以深入击秦，战于蓝田。","tr":"怀王于是调动全国兵力深入攻打秦国，在蓝田交战。","p":3,"r":0},{"t":"魏闻之，袭楚至邓。","tr":"魏国听说后，偷袭楚国，一直打到邓地。","p":3,"r":0},{"t":"楚兵惧，自秦归。","tr":"楚军惊恐，从秦国撤回。","p":3,"r":0},{"t":"而齐竟怒不救楚，楚大困。","tr":"而齐国始终因愤怒不救援楚国，楚国处境十分困窘。","p":3,"r":0},{"t":"明年，秦割汉中地与楚以和。","tr":"第二年，秦国割让汉中土地给楚国来求和。","p":4,"r":0},{"t":"楚王曰：“不愿得地，愿得张仪而甘心焉。”","tr":"楚王说：“我不想要土地，只想得到张仪才甘心。”","p":4,"r":0},{"t":"张仪闻，乃曰：“以一仪而当汉中地，","tr":"张仪听说后，就说：“用我一个张仪抵当汉中土地，","p":4,"r":0},{"t":"臣请往如楚。”","tr":"请让我前往楚国。”","p":4,"r":0},{"t":"如楚，又因厚币用事者臣靳尚，","tr":"到了楚国，又用厚礼贿赂当权的大臣靳尚，","p":4,"r":0},{"t":"而设诡辩于怀王之宠姬郑袖。","tr":"并向怀王的宠姬郑袖编造诡诈之辞。","p":4,"r":0},{"t":"怀王竟听郑袖，复释去张仪。","tr":"怀王竟听信郑袖，又放走了张仪。","p":4,"r":0},{"t":"是时屈原既疏，不复在位，","tr":"这时屈原已被疏远，不再担任要职，","p":4,"r":0},{"t":"使于齐，顾反，谏怀王曰：“何不杀张仪？”","tr":"出使齐国，回来后，劝谏怀王说：“为什么不杀张仪？”","p":4,"r":0},{"t":"怀王悔，追张仪不及。","tr":"怀王后悔，派人追赶张仪已来不及。","p":4,"r":0},{"t":"其后诸侯共击楚，大破之，杀其将唐眛。","tr":"此后诸侯联合攻打楚国，大败楚军，杀了楚将唐眛。","p":4,"r":0},{"t":"时秦昭王与楚婚，欲与怀王会。","tr":"当时秦昭王与楚国通婚，想与怀王会面。","p":5,"r":0},{"t":"怀王欲行，屈平曰：“秦，虎狼之国，不可信，","tr":"怀王想去，屈原说：“秦国是虎狼一样的国家，不可信任，","p":5,"r":0},{"t":"不如毋行。”","tr":"不如不去。”","p":5,"r":0},{"t":"怀王稚子子兰劝王行：“奈何绝秦欢！”","tr":"怀王的小儿子子兰劝怀王去：“怎么能断绝秦国的欢心！”","p":5,"r":0},{"t":"怀王卒行。","tr":"怀王终于前往。","p":5,"r":0},{"t":"入武关，秦伏兵绝其后，","tr":"一进武关，秦国伏兵切断了他的后路，","p":5,"r":0},{"t":"因留怀王，以求割地。","tr":"于是扣留怀王，来要求割地。","p":5,"r":0},{"t":"怀王怒，不听。","tr":"怀王愤怒，不答应。","p":5,"r":0},{"t":"亡走赵，赵不内。","tr":"逃到赵国，赵国不接纳。","p":5,"r":0},{"t":"复之秦，竟死于秦而归葬。","tr":"又被带回秦国，最终死在秦国，遗体运回安葬。","p":5,"r":0},{"t":"长子顷襄王立，以其弟子兰为令尹。","tr":"长子顷襄王即位，任用他的弟弟子兰为令尹。","p":6,"r":0},{"t":"楚人既咎子兰以劝怀王入秦而不反也。","tr":"楚国人都责怪子兰因为劝怀王入秦而使怀王没能回来。","p":6,"r":0},{"t":"屈平既嫉之，虽放流，眷顾楚国，","tr":"屈原也怨恨他，虽然被放逐，仍眷恋楚国，","p":6,"r":0},{"t":"系心怀王，不忘欲反，","tr":"心里挂念怀王，不忘想回朝，","p":6,"r":0},{"t":"冀幸君之一悟，俗之一改也。","tr":"希望君主有一天醒悟，习俗有一天改变。","p":6,"r":0},{"t":"其存君兴国而欲反覆之，一篇之中三致志焉。","tr":"他想保存君主、振兴国家并扭转局面，一篇文章里多次表达这种心志。","p":6,"r":0},{"t":"然终无可奈何，故不可以反，","tr":"然而终究无可奈何，所以不能回朝，","p":6,"r":0},{"t":"卒以此见怀王之终不悟也。","tr":"最终从这件事可以看出怀王始终不会醒悟。","p":6,"r":0},{"t":"人君无愚、智、贤、不肖，","tr":"君主不论愚笨、聪明、贤能、不贤，","p":7,"r":0},{"t":"莫不欲求忠以自为，举贤以自佐；","tr":"没有不想求得忠臣替自己办事，选拔贤才辅助自己的；","p":7,"r":0},{"t":"然亡国破家相随属，","tr":"然而亡国破家的事一件接一件，","p":7,"r":0},{"t":"而圣君治国累世而不见者，","tr":"而圣明君主治理国家数代都不曾出现，","p":7,"r":0},{"t":"其所谓忠者不忠，而所谓贤者不贤也。","tr":"是因为他们所认为的忠臣并不忠，所认为的贤臣并不贤。","p":7,"r":0},{"t":"怀王以不知忠臣之分，","tr":"怀王因为不能辨别忠臣的职分，","p":7,"r":0},{"t":"故内惑于郑袖，外欺于张仪，","tr":"所以在内被郑袖迷惑，在外被张仪欺骗，","p":7,"r":0},{"t":"疏屈平而信上官大夫、令尹子兰。","tr":"疏远屈原而信任上官大夫和令尹子兰。","p":7,"r":0},{"t":"兵挫地削，亡其六郡，","tr":"军队被击败，土地被削减，丧失了六个郡，","p":7,"r":0},{"t":"身客死于秦，为天下笑。","tr":"自己客死在秦国，被天下人耻笑。","p":7,"r":0},{"t":"此不知人之祸也。","tr":"这是不会识别人才所招致的祸害。","p":7,"r":0},{"t":"《易》曰：“井渫不食，为我心恻，可以汲。","tr":"《易经》说：“井淘干净了没有人来喝水，让我心里难过，可以来汲水。","p":7,"r":0},{"t":"王明，并受其福。”","tr":"君王贤明，大家都能享福。”","p":7,"r":0},{"t":"王之不明，岂足福哉！","tr":"君王不贤明，哪里值得享福呢！","p":7,"r":0},{"t":"令尹子兰闻之大怒，","tr":"令尹子兰听说这件事后非常愤怒，","p":8,"r":0},{"t":"卒使上官大夫短屈原于顷襄王，","tr":"终于让上官大夫在顷襄王面前诋毁屈原，","p":8,"r":0},{"t":"顷襄王怒而迁之。","tr":"顷襄王发怒，把屈原放逐了。","p":8,"r":0},{"t":"屈原至于江滨，被发行吟泽畔，","tr":"屈原来到江边，披散着头发在水泽边边走边吟唱，","p":9,"r":0},{"t":"颜色憔悴，形容枯槁。","tr":"面容憔悴，形体干瘦。","p":9,"r":0},{"t":"渔父见而问之曰：“子非三闾大夫欤？","tr":"渔父见到后问他：“您不是三闾大夫吗？","p":9,"r":0},{"t":"何故而至此？”","tr":"为什么落到这个地步？”","p":9,"r":0},{"t":"屈原曰：“举世混浊而我独清，","tr":"屈原说：“整个世间都浑浊，只有我清白，","p":9,"r":0},{"t":"众人皆醉而我独醒，是以见放。”","tr":"所有人都沉醉，只有我清醒，因此被放逐。”","p":9,"r":0},{"t":"渔父曰：“夫圣人者，不凝滞于物而能与世推移。","tr":"渔父说：“圣人不拘泥执着于外物，而能随着世道变化。","p":9,"r":0},{"t":"举世混浊，何不随其流而扬其波？","tr":"整个世间都浑浊，为什么不随着波浪推波助澜？","p":9,"r":0},{"t":"众人皆醉，何不餔其糟而啜其醨？","tr":"所有人都沉醉，为什么不吃点酒糟、喝点薄酒？","p":9,"r":0},{"t":"何故怀瑾握瑜而自令见放为？”","tr":"为什么怀抱美玉却让自己被放逐呢？”","p":9,"r":0},{"t":"屈原曰：“吾闻之，新沐者必弹冠，","tr":"屈原说：“我听说，刚洗过头的人一定要弹去帽上灰尘，","p":9,"r":0},{"t":"新浴者必振衣，","tr":"刚洗过澡的人一定要抖掉衣上尘土，","p":9,"r":0},{"t":"人又谁能以身之察察，受物之汶汶者乎！","tr":"谁能让洁净的身体去承受外物的污染呢！","p":9,"r":0},{"t":"宁赴常流而葬乎江鱼腹中耳，","tr":"我宁愿投入江水，葬身鱼腹之中，","p":9,"r":0},{"t":"又安能以皓皓之白而蒙世俗之温蠖乎！”","tr":"又怎能让洁白的品质蒙受世俗的尘埃呢！”","p":9,"r":0},{"t":"乃作《怀沙》之赋，其辞曰：","tr":"于是他作了《怀沙》赋，赋辞（此处节略）说：","p":10,"r":0},{"t":"于是怀石遂自投汨罗以死。","tr":"于是他抱着石头，投汨罗江自尽。","p":10,"r":0},{"t":"屈原既死之后，楚有宋玉、唐勒、景差之徒者，","tr":"屈原死后，楚国有宋玉、唐勒、景差这些人，","p":10,"r":0},{"t":"皆好辞而以赋见称；","tr":"都爱好文辞并以辞赋著称；","p":10,"r":0},{"t":"然皆祖屈原之从容辞令，终莫敢直谏。","tr":"但都只效法屈原的委婉辞令，始终没有人敢直言劝谏。","p":10,"r":0},{"t":"其后楚日以削，数十年竟为秦所灭。","tr":"此后楚国一天天被削弱，几十年后终于被秦国灭亡。","p":10,"r":0}],"notes":[{"u":0,"w":"同姓","m":"同宗族（楚王与屈原同为芈姓）","t":"古今异义","d":["同一姓氏","同样性别"]},{"u":1,"w":"左徒","m":"楚国官职名，职位次于令尹","t":"实词","d":["左边的徒弟","左侧步行的人"]},{"u":2,"w":"志","m":"记忆","t":"通假","d":["志向","记载"]},{"u":2,"w":"娴","m":"熟悉，熟练","t":"实词","d":["文静","闲暇"]},{"u":3,"w":"图议","m":"谋划商议","t":"实词","d":["绘制图案","图谋反对"]},{"u":6,"w":"害","m":"嫉妒","t":"实词","d":["伤害","灾祸"]},{"u":7,"w":"造为","m":"创制，制定","t":"实词","d":["制造成为","建造"]},{"u":7,"w":"属","m":"撰写，起草","t":"实词","d":["属于","类别"]},{"u":8,"w":"与","m":"给予","t":"实词","d":["参与","和"]},{"u":9,"w":"谗","m":"说坏话诽谤","t":"词类活用"},{"u":10,"w":"伐","m":"夸耀","t":"实词","d":["砍伐","攻打"]},{"u":11,"w":"疏","m":"疏远","t":"词类活用"},{"u":12,"w":"疾","m":"痛恨","t":"实词","d":["疾病","快速"]},{"u":12,"w":"聪","m":"听觉灵敏，引申为明辨是非","t":"实
