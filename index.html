":"问君何能尔？心远地自偏。","tr":"问我为什么能这样？只要内心远离世俗，所处之地自然就偏僻了。","p":0,"r":1},{"t":"采菊东篱下，悠然见南山。","tr":"在东篱下采摘菊花，悠闲地抬头，远处的南山映入眼帘。","p":0,"r":1},{"t":"山气日夕佳，飞鸟相与还。","tr":"傍晚时山间云气美好，飞鸟结着伴儿归来。","p":0,"r":1},{"t":"此中有真意，欲辨已忘言。","tr":"这景象里蕴含着人生的真谛，想要说明，却已经不知该怎样表达了。","p":0,"r":1}],"notes":[{"u":0,"w":"结庐","m":"建造房屋居住","t":"实词","d":["编结草庐","修缮旧屋"]},{"u":0,"w":"人境","m":"人世间，人烟聚集的地方","t":"实词","d":["人的处境","边境"]},{"u":1,"w":"尔","m":"如此，这样","t":"实词","d":["你","而已"]},{"u":1,"w":"偏","m":"偏僻","t":"实词","d":["偏向","偏离"]},{"u":2,"w":"悠然","m":"闲适自得的样子","t":"实词","d":["遥远的样子","缓慢的样子"]},{"u":3,"w":"日夕","m":"傍晚","t":"古今异义","d":["日夜","白天与夜晚"]},{"u":3,"w":"相与","m":"相伴，结伴","t":"实词","d":["互相给予","相互交往"]},{"u":4,"w":"真意","m":"人生的真谛","t":"实词","d":["真实的心意","真正的意愿"]}],"tricky":["庐","喧","篱","悠","辨"],"keyLines":[{"u":2,"hint":"《饮酒（其五）》中，写诗人悠然自得、与南山相对的千古名句是："},{"u":1,"hint":"表明只要内心远离世俗，身处闹市也能清静的两句是："},{"u":4,"hint":"表达诗人领悟人生真谛、却难以言说的两句是："}],"appr":[{"q":"“心远地自偏”蕴含着怎样的道理？","a":"地方是否清静不取决于环境，而取决于人的心境。诗人心志高远，不慕荣利，所以身在人境也如在偏僻之地，表现了超脱世俗的品格。"},{"q":"“采菊东篱下，悠然见南山”为何成为名句？","a":"“见”字写出诗人无意间抬头所见，自然而不刻意，动作与景物浑然融合，表现了物我两忘的悠闲心境和淡远的田园意境。"}]},{"id":"g8a-p11","volume":"g8a","title":"春望","author":"杜甫","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"安史之乱中，杜甫身陷沦陷的长安，春天望见残破的国都，写下这首沉痛的五律。","theme":"写春日长安的荒凉破败，抒发忧国伤时、思念亲人的深沉感情。","tags":["忧国","思家","写景"],"units":[{"t":"国破山河在，城春草木深。","tr":"国家破碎，只有山河依旧；长安城里春天来了，草木却长得茂密。","p":0,"r":1},{"t":"感时花溅泪，恨别鸟惊心。","tr":"感伤时局，见花也不禁落泪；怨恨离别，听鸟鸣也心惊。","p":0,"r":1},{"t":"烽火连三月，家书抵万金。","tr":"战火接连不断已经三个月，一封家信价值万两黄金。","p":0,"r":1},{"t":"白头搔更短，浑欲不胜簪。","tr":"愁得频频搔头，白发越来越稀少，简直要插不住簪子了。","p":0,"r":1}],"notes":[{"u":0,"w":"国","m":"国都，指长安","t":"古今异义","d":["国家","故乡"]},{"u":1,"w":"感时","m":"感伤时局","t":"实词","d":["感觉时间","感叹时光"]},{"u":1,"w":"溅泪","m":"流泪","t":"实词","d":["泪水溅出","洒泪告别"]},{"u":2,"w":"烽火","m":"指战火，战争","t":"实词","d":["报警的火光","篝火"]},{"u":2,"w":"抵","m":"相当于，值","t":"实词","d":["抵达","抵抗"]},{"u":3,"w":"浑","m":"简直","t":"实词","d":["浑浊","全部"]},{"u":3,"w":"胜","m":"经受，禁得起","t":"实词","d":["胜利","超过"]},{"u":3,"w":"簪","m":"古代用来束发固冠的长针","t":"实词","d":["发带","发冠"]}],"tricky":["溅","烽","抵","搔","簪","胜"],"keyLines":[{"u":0,"hint":"《春望》中，写国都沦陷、山河依旧而草木丛生的两句是："},{"u":1,"hint":"以花鸟写感时恨别之情的两句是："},{"u":2,"hint":"表达战乱中对家人音信的极度渴盼的两句是："}],"appr":[{"q":"“感时花溅泪，恨别鸟惊心”有哪两种理解？","a":"一种理解为诗人把感情移给花鸟——见花落泪、闻鸟惊心；另一种是花鸟拟人，含泪、惊心。无论哪种，都以乐景写哀情，使感伤更深。"},{"q":"“白头搔更短，浑欲不胜簪”表现了什么？","a":"通过白发稀少、连簪子也插不住的细节，表现诗人因忧国思家而愁苦憔悴，把无形的愁绪具体化，感人至深。"}]},{"id":"g8a-p12","volume":"g8a","title":"雁门太守行","author":"李贺","dynasty":"唐","genre":"七言乐府诗","kind":"poem","intro":"李贺借乐府旧题《雁门太守行》，描写边塞将士守城、夜战的场面，色彩浓烈、想象奇特。","theme":"描绘边塞战争的紧张惨烈，赞颂将士誓死报国的决心。","tags":["边塞","战争","报国"],"units":[{"t":"黑云压城城欲摧，甲光向日金鳞开。","tr":"乌云像要压垮城墙，铠甲迎着日光闪出金色的鳞片般的光芒。","p":0,"r":1},{"t":"角声满天秋色里，塞上燕脂凝夜紫。","tr":"号角声响彻秋日的天空，边塞上的血迹在夜色中凝成暗紫色。","p":0,"r":1},{"t":"半卷红旗临易水，霜重鼓寒声不起。","tr":"红旗半卷，大军逼近易水，天寒霜重，战鼓声沉闷不响。","p":0,"r":1},{"t":"报君黄金台上意，提携玉龙为君死。","tr":"为报答君王的赏识之恩，将士提着宝剑决心为国战死。","p":0,"r":1}],"notes":[{"u":0,"w":"摧","m":"毁坏，崩塌","t":"实词","d":["推开","摧残"]},{"u":0,"w":"甲光","m":"铠甲迎日反射的光","t":"实词","d":["盔甲的光泽","月光"]},{"u":0,"w":"金鳞","m":"金色的鱼鳞，形容铠甲","t":"实词","d":["金色的鱼","金色的云"]},{"u":1,"w":"燕脂","m":"即胭脂，这里指暮色中的血迹","t":"实词","d":["燕子的羽毛","红色的炊烟"]},{"u":2,"w":"易水","m":"河名，在今河北易县","t":"实词","d":["容易渡过的河","黄河的支流"]},{"u":3,"w":"黄金台","m":"燕昭王所筑的招贤台","t":"实词","d":["金色的高台","黄金堆成的宝库"]},{"u":3,"w":"玉龙","m":"宝剑","t":"实词","d":["龙形玉器","白色的龙旗"]}],"tricky":["摧","鳞","燕脂","霜","携","龙"],"keyLines":[{"u":0,"hint":"《雁门太守行》中，描写敌军压境、守军铠甲闪光的句子是："},{"u":2,"hint":"写边塞天寒霜重、战鼓声低沉的句子是："},{"u":3,"hint":"表现将士以死报国的决心的两句是："}],"appr":[{"q":"首联“黑云压城城欲摧，甲光向日金鳞开”有何妙处？","a":"用“黑云”写敌军压境的紧张气氛，用“金鳞”写守军铠甲闪耀，一暗一明、一压一开，对比强烈，渲染出战前危急又不失壮气的氛围。"},{"q":"这首诗的色彩运用有什么特点？","a":"诗中黑、金、红、紫等浓烈颜色交织，画面斑驳，既渲染战场的悲壮惨烈，又烘托出将士的坚毅，形成奇崛瑰丽的风格。"}]},{"id":"g8a-p13","volume":"g8a","title":"赤壁","author":"杜牧","dynasty":"唐","genre":"七言绝句","kind":"poem","intro":"杜牧在黄州、池州等地任职时，经过赤壁古战场，因拾得断戟而咏史，借三国往事发表议论。","theme":"借赤壁之战的偶然胜负议论历史，含蓄抒发自己怀才不遇的感慨。","tags":["咏史","议论","怀古"],"units":[{"t":"折戟沉沙铁未销，自将磨洗认前朝。","tr":"一支折断的戟沉在沙里，铁还没有锈蚀，我自己磨洗后认出是前朝遗物。","p":0,"r":1},{"t":"东风不与周郎便，铜雀春深锁二乔。","tr":"假如东风不给周瑜方便，结局恐怕是曹操获胜，二乔被关进铜雀台里。","p":0,"r":1}],"notes":[{"u":0,"w":"戟","m":"古代的一种兵器","t":"实词","d":["长剑","盾牌"]},{"u":0,"w":"销","m":"销蚀，消失","t":"实词","d":["销售","熔化"]},{"u":0,"w":"前朝","m":"前代，这里指三国时的东吴","t":"实词","d":["前一个朝代的皇帝","朝廷前面"]},{"u":0,"w":"认","m":"辨认","t":"实词","d":["承认","认识"]},{"u":1,"w":"与","m":"给","t":"实词","d":["和","参与"]},{"u":1,"w":"便","m":"方便，便利","t":"实词","d":["就","便宜"]},{"u":1,"w":"铜雀","m":"曹操所建的铜雀台","t":"实词","d":["铜铸的雀鸟","铜制的酒器"]},{"u":1,"w":"锁二乔","m":"把二乔锁在铜雀台，指吴国被灭","t":"实词","d":["关起两位美人","保护二乔"]}],"tricky":["戟","销","磨洗","铜雀","乔"],"keyLines":[{"u":0,"hint":"《赤壁》中，从沙中断戟引出怀古情思的句子是："},{"u":1,"hint":"用假设推想赤壁之战如果失败、东吴将遭亡国的句子是："}],"appr":[{"q":"“东风不与周郎便，铜雀春深锁二乔”运用了什么手法？","a":"运用假设和虚写，不直写东吴败亡，而以二乔被锁铜雀台暗示，含蓄而有深意，表达了对历史偶然性的感叹。"},{"q":"这首诗体现了诗人怎样的情怀？","a":"诗人托物咏史，感叹周瑜借东风而成功，暗含自己怀才不遇、缺乏机遇的不平，兼有对国家命运的关切。"}]},{"id":"g8a-p14","volume":"g8a","title":"渔家傲（天接云涛连晓雾）","author":"李清照","dynasty":"宋","genre":"词","kind":"poem","intro":"这是李清照现存词中少有的浪漫豪放之作，借梦游天宫的幻想，抒写对现实的不满和对理想的追求。","theme":"写梦中与天帝对话、乘风飞往仙山，表达对自由理想境界的向往和对现实的失望。","tags":["浪漫","理想","抒怀"],"units":[{"t":"天接云涛连晓雾，星河欲转千帆舞。","tr":"天空与云涛相连，又连着拂晓的雾气；银河转动，像千万条船在舞动风帆。","p":0,"r":1},{"t":"仿佛梦魂归帝所，闻天语，殷勤问我归何处。","tr":"恍惚间梦魂来到天帝居处，听见天帝说话，还殷切地问我要去哪里。","p":0,"r":1},{"t":"我报路长嗟日暮，学诗谩有惊人句。","tr":"我回答说路途遥远，感叹天色已晚，学作诗歌，白白有了惊人的好句。","p":1,"r":1},{"t":"九万里风鹏正举。","tr":"大鹏正乘着九万里长风高高飞起。","p":1,"r":1},{"t":"风休住，蓬舟吹取三山去！","tr":"风啊不要停，把我的小船一直吹到海上三座仙山去！","p":1,"r":1}],"notes":[{"u":0,"w":"云涛","m":"像波涛一样翻涌的云","t":"实词","d":["天上的洪水","云中的雷声"]},{"u":0,"w":"星河","m":"银河","t":"实词","d":["星星和江河","河中的倒影"]},{"u":1,"w":"帝所","m":"天帝居住的地方","t":"实词","d":["帝王的宫殿","皇帝的驻地"]},{"u":1,"w":"殷勤","m":"情意恳切","t":"古今异义","d":["对人热情周到","献殷勤"]},{"u":2,"w":"报","m":"回答","t":"实词","d":["报答","报告"]},{"u":2,"w":"谩","m":"空，徒然","t":"实词","d":["轻慢","傲慢"]},{"u":3,"w":"九万里风鹏","m":"用《庄子·逍遥游》大鹏乘风飞九万里的典故","t":"实词","d":["九万里长的大风","大鹏的翅膀"]},{"u":4,"w":"蓬舟","m":"像蓬草一样轻快的小船","t":"实词","d":["蓬草编的舟","篷布覆盖的船"]},{"u":4,"w":"三山","m":"传说中海上的蓬莱、方丈、瀛洲三座仙山","t":"实词","d":["三座山峰","故乡的山"]}],"tricky":["涛","帆","殷勤","嗟","谩","鹏","蓬舟"],"keyLines":[{"u":0,"hint":"《渔家傲》中，描绘天空、云涛、晓雾连成一片的句子是："},{"u":3,"hint":"用大鹏高飞的典故表现词人奋发向上心志的句子是："},{"u":4,"hint":"表达词人希望风力助自己飞往仙山、摆脱现实的句子是："}],"appr":[{"q":"这首词体现了怎样的艺术构思？","a":"词人借梦境展开浪漫想象：先写天海迷茫的景象，再写与天帝对话，最后写乘风远去，以梦游的方式倾诉对现实的不满和对理想的追求。"},{"q":"“九万里风鹏正举”有什么作用？","a":"用《庄子》大鹏乘风而起的典故，把词人的向往具体为大鹏高飞的壮阔意象，使词的气势由梦境的迷茫转向豪放高扬。"}]},{"id":"g8a-p15","volume":"g8a","title":"浣溪沙（一曲新词酒一杯）","author":"晏殊","dynasty":"宋","genre":"词","kind":"poem","intro":"晏殊的这首小令，借暮春景象写对时光流逝的感伤，其中“无可奈何花落去，似曾相识燕归来”最负盛名。","theme":"在伤春惜时中融入对时光流逝、美好难留的感慨，带有淡淡的惆怅和哲理意味。","tags":["伤春","惜时","哲理"],"units":[{"t":"一曲新词酒一杯，去年天气旧亭台。","tr":"听一曲新词，饮一杯美酒，天气和亭台都和去年一样。","p":0,"r":1},{"t":"夕阳西下几时回？","tr":"夕阳西下，什么时候才能再回来？","p":0,"r":1},{"t":"无可奈何花落去，似曾相识燕归来。","tr":"花儿凋落，无可奈何；似曾相识的燕子又飞回来了。","p":1,"r":1},{"t":"小园香径独徘徊。","tr":"我独自在小园里落满花香的小路上徘徊。","p":1,"r":1}],"notes":[{"u":0,"w":"一曲","m":"一首","t":"实词","d":["一段","一次"]},{"u":0,"w":"新词","m":"刚写成的词","t":"实词","d":["新鲜的词语","新词汇"]},{"u":0,"w":"旧亭台","m":"熟悉的旧亭台，与去年一样","t":"实词","d":["破旧的亭台","古老的建筑"]},{"u":1,"w":"几时回","m":"什么时候才能回来","t":"实词","d":["几点回家","回到哪里"]},{"u":2,"w":"无可奈何","m":"没有办法","t":"古今异义","d":["不顾一切","无所谓"]},{"u":2,"w":"似曾相识","m":"好像曾经见过","t":"实词","d":["似乎不认识","相互认识"]},{"u":3,"w":"香径","m":"落满花瓣、散发花香的小路","t":"实词","d":["香气浓郁的小店","花园的围墙"]},{"u":3,"w":"徘徊","m":"来回走动","t":"实词","d":["犹豫不前","迷路"]}],"tricky":["徊","亭台","奈何","相识","徘徊"],"keyLines":[{"u":2,"hint":"《浣溪沙》中，对仗工整、暗含时光流逝与美好重现之意的名句是："},{"u":1,"hint":"以夕阳西下的疑问表达对时光难留的惋惜的句子是："},{"u":3,"hint":"以独自徘徊作结，抒写孤寂惆怅的句子是："}],"appr":[{"q":"“无可奈何花落去，似曾相识燕归来”为何传诵千古？","a":"上句写花落春去的无奈，下句写燕归的欣慰，两句对仗工整，一失一得，既写景又含哲理，表达了对美好事物消逝的惋惜与新生可期的慰藉。"},{"q":"全词的情感是怎样变化的？","a":"上片追忆去年，由酒词旧景引出对夕阳时光的叹问；下片由花落燕归转入独自徘徊，伤春惜时之情渐渐加深，余味悠长。"}]},{"id":"g8a-p16","volume":"g8a","title":"采桑子（轻舟短棹西湖好）","author":"欧阳修","dynasty":"宋","genre":"词","kind":"poem","intro":"欧阳修晚年退居颍州，爱颍州西湖风景，写下《采桑子》组词十首，这是其中第一首。","theme":"描绘西湖春景的清丽恬静，表现词人悠闲自适的心境和对自然的喜爱。","tags":["写景","闲适","西湖"],"units":[{"t":"轻舟短棹西湖好，绿水逶迤。","tr":"驾着轻舟、划着短桨游西湖，景色真好，绿水曲折绵延。","p":0,"r":1},{"t":"芳草长堤，隐隐笙歌处处随。","tr":"长堤上芳草青青，隐隐约约的笙歌声一路相随。","p":0,"r":1},{"t":"无风水面琉璃滑，不觉船移。","tr":"无风的湖面像琉璃一样光滑，不觉得船在移动。","p":1,"r":1},{"t":"微动涟漪，惊起沙禽掠岸飞。","tr":"水面泛起微微波纹，惊动了沙洲上的水鸟，掠着岸边飞起。","p":1,"r":1}],"notes":[{"u":0,"w":"棹","m":"船桨","t":"实词","d":["小船","渔网"]},{"u":0,"w":"逶迤","m":"曲折绵延的样子","t":"实词","d":["缓缓流淌","清澈见底"]},{"u":1,"w":"芳草","m":"芳香的青草","t":"实词","d":["芳香的花朵","美好的庄稼"]},{"u":1,"w":"隐隐","m":"隐约，不分明","t":"实词","d":["隐藏起来","悄悄地"]},{"u":2,"w":"琉璃","m":"这里形容水面光滑透明","t":"实词","d":["一种宝石","碎玻璃"]},{"u":3,"w":"涟漪","m":"细小的水波","t":"实词","d":["漩涡","浪花"]},{"u":3,"w":"沙禽","m":"沙洲上的水鸟","t":"实词","d":["沙漠中的飞禽","沙子里的虫"]},{"u":3,"w":"掠","m":"轻快地擦过","t":"实词","d":["抢夺","拨动"]}],"tricky":["棹","逶迤","笙","琉璃","涟漪","掠"],"keyLines":[{"u":2,"hint":"《采桑子》中，写湖面平静如镜、船行不觉的句子是："},{"u":3,"hint":"以水鸟惊飞写出微波荡漾的句子是："},{"u":1,"hint":"从听觉角度写笙歌随行的句子是："}],"appr":[{"q":"下片“无风水面琉璃滑，不觉船移”有什么妙处？","a":"以琉璃比喻平静明净的湖面，又用“不觉船移”写出船行平稳、舟中人沉醉的闲适，写静中有动，细腻传神。"},{"q":"结尾“惊起沙禽掠岸飞”起到什么作用？","a":"以动写静：微波一动、水鸟惊飞，打破宁静，又反衬出此前湖面的静谧，画面生动，意境空灵。"}]},{"id":"g8a-p17","volume":"g8a","title":"相见欢（金陵城上西楼）","author":"朱敦儒","dynasty":"宋","genre":"词","kind":"poem","intro":"朱敦儒经历靖康之变，南渡后登金陵城西楼，面对沉沦的故土，写下这首悲怆的词。","theme":"登楼远望，抒发家国沦丧的悲痛和渴望收复中原的爱国情怀。","tags":["爱国","登临","抒怀"],"units":[{"t":"金陵城上西楼，倚清秋。","tr":"我登上金陵城的西楼，倚栏望着清冷的秋色。","p":0,"r":1},{"t":"万里夕阳垂地大江流。","tr":"万里长江滚滚东流，夕阳低垂在天边。","p":0,"r":1},{"t":"中原乱，簪缨散，几时收？","tr":"中原大乱，官员士人流离四散，什么时候才能收复？","p":1,"r":1},{"t":"试倩悲风吹泪过扬州。","tr":"请悲凉的秋风把我的眼泪吹到扬州前线吧。","p":1,"r":1}],"notes":[{"u":0,"w":"倚","m":"靠着","t":"实词","d":["倚仗","偏"]},{"u":0,"w":"清秋","m":"清冷的秋天","t":"实词","d":["清澈的秋水","秋天的早晨"]},{"u":1,"w":"垂地","m":"落到地平线上，低垂","t":"实词","d":["垂落在地","接近地面的树枝"]},{"u":2,"w":"中原","m":"指黄河中下游地区，当时被金占领","t":"实词","d":["中间的平原","国家的内地"]},{"u":2,"w":"簪缨","m":"古代官员的冠饰，这里指达官贵人","t":"实词","d":["簪子和帽带","发髻"]},{"u":2,"w":"收","m":"收复","t":"实词","d":["收获","收藏"]},{"u":3,"w":"倩","m":"请，央求","t":"实词","d":["美好","美丽的"]},{"u":3,"w":"悲风","m":"凄凉的秋风","t":"实词","d":["悲伤的话语","哀怨的歌声"]}],"tricky":["金陵","簪缨","倩","扬州"],"keyLines":[{"u":1,"hint":"《相见欢》中，描绘登楼所见夕阳与大江的壮阔景象的句子是："},{"u":2,"hint":"表达对中原沦陷、士人流散的忧愤，并发出何时收复之问的是："},{"u":3,"hint":"想请悲风把自己的泪水吹到抗金前线扬州的句子是："}],"appr":[{"q":"上片的写景有什么作用？","a":"“万里夕阳垂地大江流”境界雄阔而苍凉，夕阳象征国运衰微，大江东流暗含时光不返、故土难归，为下片抒发亡国之痛作铺垫。"},{"q":"下片的抒情有何特点？","a":"连用“乱”“散”两个短句和一个设问，直抒家国之痛；末句“试倩悲风”把无形的悲风写成可托之物，想象奇特，表现出对前线的深切挂念和强烈的爱国情感。"}]},{"id":"g8a-p18","volume":"g8a","title":"如梦令（常记溪亭日暮）","author":"李清照","dynasty":"宋","genre":"词","kind":"poem","intro":"这是李清照早年的小令，回忆一次溪亭游玩、醉归误入藕花丛的往事，天真活泼。","theme":"追忆少女时代游玩的欢快情景，表现词人的天真情趣和对自然的热爱。","tags":["追忆","写景","闲适"],"units":[{"t":"常记溪亭日暮，沉醉不知归路。","tr":"常常想起那个黄昏在溪边亭子玩乐，尽兴沉醉，竟然不知回家的路。","p":0,"r":1},{"t":"兴尽晚回舟，误入藕花深处。","tr":"玩够了，天色已晚才划船回去，却不小心划进荷花丛深处。","p":0,"r":1},{"t":"争渡，争渡，惊起一滩鸥鹭。","tr":"怎样才能划出去呀，奋力划啊，惊起了一滩栖息的鸥鹭。","p":0,"r":1}],"notes":[{"u":0,"w":"溪亭","m":"溪边的亭子","t":"实词","d":["小溪的亭台","溪水的尽头"]},{"u":0,"w":"日暮","m":"黄昏，太阳落山时","t":"实词","d":["每天傍晚","日落以后"]},{"u":0,"w":"沉醉","m":"沉迷于美景之中，不是真的酒醉（亦含酒意）","t":"实词","d":["昏睡","酩酊大醉"]},{"u":1,"w":"兴尽","m":"游兴满足","t":"实词","d":["兴致消失","兴建完成"]},{"u":1,"w":"误入","m":"不小心进入","t":"实词","d":["错误地进入","故意进入"]},{"u":1,"w":"藕花","m":"荷花","t":"实词","d":["莲藕的根须","白色的野花"]},{"u":2,"w":"争渡","m":"奋力把船划出去（一说“怎渡”）","t":"实词","d":["争夺渡口","争着过河"]},{"u":2,"w":"鸥鹭","m":"水鸟，鸥和鹭","t":"实词","d":["鸳鸯","大雁"]}],"tricky":["溪亭","沉醉","藕","争渡","鸥鹭"],"keyLines":[{"u":0,"hint":"《如梦令》中，写词人在溪亭玩得忘记回家路的句子是："},{"u":1,"hint":"写兴尽回舟、不料划进荷花深处的句子是："},{"u":2,"hint":"以惊起鸥鹭的动态场景作结的句子是："}],"appr":[{"q":"“争渡，争渡”重复有什么好处？","a":"叠用“争渡”写出划船声、慌乱急切的心情，节奏急促，将少女天真活泼、手忙脚乱的神态传神地表现出来。"},{"q":"这首词的结尾为什么耐人寻味？","a":"结尾不写人，只写“惊起一滩鸥鹭”，以景结情，留给读者想象的空间，画面灵动，言有尽而意无穷。"}]},{"id":"g8a-w01","volume":"g8a","title":"三峡","author":"郦道元","dynasty":"北魏","genre":"山水散文（节选自《水经注》）","kind":"prose","intro":"郦道元是北魏地理学家，为《水经》作注写成《水经注》。本文节选其中《江水》一段，按夏、春冬、秋的顺序，写出长江三峡的山水之貌。","theme":"描绘三峡山势连绵、江水迅疾和四季各异的景致，表达对祖国山河的赞美与喜爱。","tags":["写景","山水","说明"],"units":[{"t":"自三峡七百里中，两岸连山，略无阙处。","tr":"在三峡长达七百里的地段里，两岸都是连绵不断的高山，几乎没有一点中断的地方。","p":0,"r":1},{"t":"重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。","tr":"层层叠叠的山岩像屏障一样，遮住了天空和太阳；若不是正午和半夜，就看不到太阳和月亮。","p":0,"r":1},{"t":"至于夏水襄陵，沿溯阻绝。","tr":"到了夏天江水漫上山丘的时候，上行和下行的船只都被阻断了。","p":1,"r":1},{"t":"或王命急宣，有时朝发白帝，暮到江陵，","tr":"有时遇到朝廷命令要紧急传达，就只需早晨从白帝城出发，傍晚便到达江陵，","p":1,"r":1},{"t":"其间千二百里，虽乘奔御风，不以疾也。","tr":"这中间相隔一千二百里，即使骑着飞奔的快马、驾着疾风，也不如它快。","p":1,"r":1},{"t":"春冬之时，则素湍绿潭，回清倒影。","tr":"到了春天和冬天，就能看到白色的急流和碧绿的深潭，回旋的清波里倒映着各种景物。","p":2,"r":1},{"t":"绝巘多生怪柏，悬泉瀑布，飞漱其间，","tr":"极高的山峰上生长着许多形态奇特的柏树，山峰间有悬挂的泉水和瀑布，在其中飞流冲荡，","p":2,"r":1},{"t":"清荣峻茂，良多趣味。","tr":"水清，树茂，山高，草盛，实在有很多乐趣。","p":2,"r":1},{"t":"每至晴初霜旦，林寒涧肃，常有高猿长啸，","tr":"每逢初晴的日子或下霜的清晨，树林和山涧清凉寂静，常常有高处的猿猴拉长声音啼叫，","p":3,"r":1},{"t":"属引凄异，空谷传响，哀转久绝。","tr":"叫声连续不断，凄厉悲凉，空荡的山谷里传来回声，哀婉回旋，很久才消失。","p":3,"r":1},{"t":"故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳。”","tr":"所以渔民唱道：“巴东三峡中巫峡最长，猿猴叫几声就使人泪湿衣裳。”","p":3,"r":1}],"notes":[{"u":0,"w":"自","m":"在","t":"实词","d":["从","自己"]},{"u":0,"w":"略","m":"完全，一点也","t":"实词","d":["大致","简略"]},{"u":0,"w":"阙","m":"通“缺”，中断的地方","t":"通假","d":["宫门前的楼观","过错"]},{"u":1,"w":"嶂","m":"像屏障一样的山峰","t":"实词","d":["山谷","山洞"]},{"u":1,"w":"隐","m":"遮蔽","t":"实词","d":["隐居","隐藏"]},{"u":1,"w":"自非","m":"如果不是","t":"实词","d":["自从不是","本来不是"]},{"u":1,"w":"亭午","m":"正午","t":"实词","d":["亭子里的正午","午后"]},{"u":1,"w":"曦","m":"日光，这里指太阳","t":"实词","d":["清晨","晚霞"]},{"u":2,"w":"襄陵","m":"漫上山丘（襄：上；陵：大土山）","t":"实词","d":["帮助陵墓","驾驭山陵"]},{"u":2,"w":"沿溯","m":"顺流而下和逆流而上","t":"实词","d":["沿着河岸溯源","沿途停泊"]},{"u":3,"w":"或","m":"有时","t":"古今异义","d":["或者","也许"]},{"u":3,"w":"王命","m":"帝王的命令","t":"实词","d":["国王的名字","君王的寿命"]},{"u":4,"w":"奔","m":"飞奔的快马","t":"词类活用"},{"u":4,"w":"御","m":"驾着，驾驭","t":"实词","d":["抵挡","统治"]},{"u":4,"w":"不以疾也","m":"不如它快（以：如，比得上）","t":"特殊句式"},{"u":5,"w":"素湍","m":"白色的急流","t":"实词","d":["朴素的水潭","白色的瀑布"]},{"u":5,"w":"回清","m":"回旋的清波","t":"实词","d":["回归清静","返回清澈处"]},{"u":6,"w":"绝巘","m":"极高的山峰","t":"实词","d":["陡峭的悬崖洞穴","断绝的山路"]},{"u":6,"w":"飞漱","m":"飞流冲荡","t":"实词","d":["飞扬着漱洗","飞溅作响"]},{"u":7,"w":"良","m":"实在，很","t":"实词","d":["善良","优良"]},{"u":7,"w":"清荣峻茂","m":"水清、树荣、山高、草盛（四字依次说明水、树、山、草）","t":"特殊句式"},{"u":8,"w":"肃","m":"清凉而寂静","t":"实词","d":["严肃","恭敬"]},{"u":8,"w":"长啸","m":"拉长声音啼叫","t":"实词","d":["长久地吹口哨","高声歌唱"]},{"u":9,"w":"属引","m":"连续不断","t":"实词","d":["属于牵引","聚集牵拉"]},{"u":9,"w":"绝","m":"消失","t":"实词","d":["断绝","极其"]},{"u":10,"w":"故","m":"所以","t":"古今异义","d":["原因","旧的"]},{"u":10,"w":"沾","m":"打湿","t":"实词","d":["沾染","沾光"]}],"tricky":["嶂","曦","湍","巘","漱","裳"],"keyLines":[{"u":1,"hint":"《三峡》中，写出两岸山峰重重叠叠、遮住天空和日月的句子是："},{"u":3,"hint":"《三峡》中，以白帝、江陵两地的往返，侧面写出夏季江水湍急的句子是："},{"u":5,"hint":"《三峡》中，描写春冬季节江水白浪翻涌、潭水碧绿、倒映山影的句子是："},{"u":9,"hint":"《三峡》中，描写猿鸣声凄厉悲凉、在空山里久久回荡的句子是："},{"u":10,"hint":"《三峡》结尾引用渔歌，渲染秋日三峡凄清气氛的句子是："}],"appr":[{"q":"第二段写夏天的江水，为什么要写“朝发白帝，暮到江陵”？","a":"这是侧面描写：用一日千二百里的行程，对比“虽乘奔御风，不以疾也”，突出夏季江水来势凶猛、流速极快，比直接写水势更具体生动。"},{"q":"全文写三峡景物，是怎样安排的？有什么特点？","a":"先总写山，再按夏、春冬、秋的顺序写水与四季之景。既抓住山连绵、水迅急的整体特征，又写出各季的不同风貌，动静结合、视听兼备，层次分明。"},{"q":"结尾引用渔歌有什么作用？","a":"渔歌以“泪沾裳”的哀感，从人的感受上印证了前文猿啼凄异的氛围，加深了秋景的凄清，同时使文章语言富有民间生活气息，余味悠长。"}]},{"id":"g8a-w02","volume":"g8a","title":"答谢中书书","author":"陶弘景","dynasty":"南朝梁","genre":"书信（山水小品）","kind":"prose","intro":"陶弘景隐居句容茅山，仍受朝廷敬重。这是他写给友人谢中书（谢微）的一封短信，用寥寥数语勾勒江南山水之美。","theme":"描绘江南山水四时俱美的景色，抒发对山水的热爱和知音难觅的感慨。","tags":["写景","山水","抒怀"],"units":[{"t":"山川之美，古来共谈。","tr":"山水景色的美丽，自古以来就是人们共同谈论赞赏的。","p":0,"r":1},{"t":"高峰入云，清流见底。","tr":"高耸的山峰直插云端，清澈的溪流可以看到水底。","p":0,"r":1},{"t":"两岸石壁，五色交辉。","tr":"两岸的石壁，五彩的颜色相互辉映。","p":0,"r":1},{"t":"青林翠竹，四时俱备。","tr":"青葱的树林，翠绿的竹子，四季都有。","p":0,"r":1},{"t":"晓雾将歇，猿鸟乱鸣；","tr":"清晨的薄雾将要消散时，猿啼鸟叫此起彼伏；","p":0,"r":1},{"t":"夕日欲颓，沉鳞竞跃。","tr":"傍晚太阳快要落山时，潜游水中的鱼儿争相跳出水面。","p":0,"r":1},{"t":"实是欲界之仙都。","tr":"这里实在是人间的仙境啊。","p":0,"r":1},{"t":"自康乐以来，未复有能与其奇者。","tr":"自从谢灵运以来，就再也没有人能够欣赏这里的奇丽景色了。","p":0,"r":1}],"notes":[{"u":0,"w":"共谈","m":"共同欣赏、谈论","t":"实词","d":["共同商议","一起聊天"]},{"u":0,"w":"之","m":"助词，用在主谓之间，取消句子独立性","t":"虚词"},{"u":1,"w":"见","m":"看到（同“现”，显露）","t":"实词","d":["拜见","意见"]},{"u":2,"w":"交辉","m":"交相辉映","t":"实词","d":["交换光彩","互相遮蔽"]},{"u":3,"w":"四时","m":"四季","t":"古今异义","d":["四点钟","四个时辰"]},{"u":3,"w":"俱","m":"都","t":"实词","d":["一起行走","完备"]},{"u":4,"w":"晓","m":"早晨","t":"实词","d":["知道","明白"]},{"u":4,"w":"歇","m":"消散，消失","t":"实词","d":["休息","停歇"]},{"u":4,"w":"乱鸣","m":"此起彼伏地鸣叫","t":"实词","d":["杂乱嘈杂地鸣叫","惊慌地鸣叫"]},{"u":5,"w":"颓","m":"坠落","t":"实词","d":["衰败","倒塌"]},{"u":5,"w":"沉鳞","m":"潜游在水中的鱼（以鳞代鱼）","t":"实词","d":["沉入水底的鳞片","水底的石头"]},{"u":5,"w":"竞","m":"争着","t":"实词","d":["竞赛","终究"]},{"u":6,"w":"实","m":"确实，实在","t":"实词","d":["果实","充实"]},{"u":6,"w":"欲界","m":"人间","t":"实词","d":["欲望的边界","仙人的世界"]},{"u":6,"w":"仙都","m":"仙人居住的地方，仙境","t":"实词","d":["仙人的都城","神仙的花园"]},{"u":7,"w":"康乐","m":"指南朝宋山水诗人谢灵运，他曾袭封康乐公","t":"实词","d":["健康快乐","安宁欢乐"]},{"u":7,"w":"与","m":"参与，这里指欣赏","t":"实词","d":["给予","和"]},{"u":7,"w":"奇","m":"奇妙的景色（形容词作名词）","t":"词类活用"}],"tricky":["颓","鳞","竞","歇","猿","辉"],"keyLines":[{"u":1,"hint":"《答谢中书书》中，写山高水清的句子是："},{"u":2,"hint":"《答谢中书书》中，写两岸石壁色彩绚丽、相互映衬的句子是："},{"u":4,"hint":"《答谢中书书》中，描写清晨猿鸟齐鸣、雾气渐散的句子是："},{"u":5,"hint":"《答谢中书书》中，描写傍晚落日欲沉、鱼儿跳跃的句子是："},{"u":6,"hint":"《答谢中书书》中，作者直接赞美这里山水如仙境的句子是："}],"appr":[{"q":"文中“猿鸟乱鸣”“沉鳞竞跃”写景有什么特点？","a":"一静一动、有声有色：晨雾与夕阳是背景，猿鸟之声和鱼跃之态是动态，把山水写得富有生机，同时由早到晚展现了时间推移，使景色立体丰满。"},{"q":"结尾“自康乐以来，未复有能与其奇者”表达了作者怎样的情感？","a":"作者以谢灵运作比，自负能欣赏山水之奇，又隐含知音难觅的感慨；既表达了对山水的痴爱，也流露出隐逸清高的情怀。"}]},{"id":"g8a-w03","volume":"g8a","title":"记承天寺夜游","author":"苏轼","dynasty":"北宋","genre":"小品文（游记）","kind":"prose","intro":"元丰六年（1083），苏轼被贬黄州已近四年。一个月夜，他难以入眠，到承天寺与同样被贬的张怀民同游，写下这篇短文。","theme":"记叙月夜与友人漫步的情景，抒发贬谪的落寞和旷达的情怀。","tags":["写景","抒怀","叙事"],"units":[{"t":"元丰六年十月十二日夜，解衣欲睡，","tr":"元丰六年十月十二日的夜里，我脱了衣服正要睡觉，","p":0,"r":1},{"t":"月色入户，欣然起行。","tr":"看见月光照进门来，高兴地起身出去散步。","p":0,"r":1},{"t":"念无与为乐者，遂至承天寺寻张怀民。","tr":"想到没有可以一起游乐的人，便前往承天寺去找张怀民。","p":0,"r":1},{"t":"怀民亦未寝，相与步于中庭。","tr":"怀民也还没有睡，我们便一同在庭院中散步。","p":0,"r":1},{"t":"庭下如积水空明，水中藻、荇交横，盖竹柏影也。","tr":"庭院中月光如积水般澄澈透明，水里水草交错纵横，原来是竹子和柏树的影子。","p":0,"r":1},{"t":"何夜无月？何处无竹柏？","tr":"哪一夜没有月亮？哪里没有竹子和柏树？","p":0,"r":1},{"t":"但少闲人如吾两人者耳。","tr":"只是缺少像我们两个这样清闲的人罢了。","p":0,"r":1}],"notes":[{"u":0,"w":"解衣","m":"脱下衣服","t":"实词","d":["解开衣扣","洗衣服"]},{"u":0,"w":"欲","m":"想要，打算","t":"实词","d":["欲望","贪求"]},{"u":1,"w":"户","m":"门","t":"古今异义","d":["窗户","人家"]},{"u":1,"w":"欣然","m":"高兴的样子","t":"实词","d":["勉强的样子","欣慰地感叹"]},{"u":2,"w":"念","m":"考虑，想到","t":"实词","d":["思念","诵读"]},{"u":2,"w":"无与为乐者","m":"没有可以一起游乐的人（省略“与之”）","t":"特殊句式"},{"u":2,"w":"遂","m":"于是，就","t":"实词","d":["顺利","成功"]},{"u":2,"w":"寻","m":"寻找","t":"实词","d":["不久","八尺长"]},{"u":3,"w":"寝","m":"睡觉","t":"实词","d":["寝室","躺卧休养"]},{"u":3,"w":"相与","m":"一起，共同","t":"实词","d":["互相给予","相互交往"]},{"u":3,"w":"中庭","m":"庭院中","t":"实词","d":["中间的朝廷","庭院的中央厅堂"]},{"u":4,"w":"空明","m":"清澈透明","t":"实词","d":["空虚明亮","空旷明朗"]},{"u":4,"w":"藻、荇","m":"水草，荇是一种水生植物","t":"实词","d":["文采，辞藻","浮萍"]},{"u":4,"w":"交横","m":"交错纵横","t":"实词","d":["交替横行","互相阻拦"]},{"u":4,"w":"盖","m":"原来是，大概是（表推测）","t":"虚词"},{"u":6,"w":"但","m":"只是","t":"古今异义","d":["但是","仅仅是否"]},{"u":6,"w":"闲人","m":"清闲的人，这里指有闲情雅致欣赏美景的人","t":"古今异义","d":["没有事做的无关人员","游手好闲的人"]},{"u":6,"w":"耳","m":"语气词，罢了","t":"虚词"}],"tricky":["寝","荇","藻","遂","庭","盖"],"keyLines":[{"u":4,"hint":"《记承天寺夜游》中，用比喻写月光清澈、竹柏影子交错的句子是："},{"u":5,"hint":"《记承天寺夜游》中，以反问表达月夜美景随处可见，暗含自己贬谪感慨的句子是："},{"u":6,"hint":"《记承天寺夜游》中，作者自嘲又自得，说明只有闲适之人才能欣赏月夜之美的句子是："},{"u":2,"hint":"《记承天寺夜游》中，写作者因无人同乐而前往友人处的句子是："}],"appr":[{"q":"“庭下如积水空明，水中藻、荇交横，盖竹柏影也”妙在何处？","a":"先用比喻写月光如积水澄澈，再把竹柏影子比作水中藻荇，最后以“盖”点破。以虚写实，笔法空灵，写出月色的清冷透明，也有一种恍惚惊喜之感。"},{"q":"结尾“但少闲人如吾两人者耳”表达了作者怎样的情感？","a":"“闲人”既指有闲情赏月的人，又含被贬后无事可做的自嘲。作者在失意中仍能欣赏美景，流露出旷达乐观的心境，也夹杂着内心难言的苦闷。"}]},{"id":"g8a-w04","volume":"g8a","title":"与朱元思书","author":"吴均","dynasty":"南朝梁","genre":"书信（山水小品）","kind":"prose","intro":"吴均是南朝梁的文学家。这封信是他写给友人朱元思的，记述乘船从富阳到桐庐沿富春江所见的山水风光。","theme":"描绘富春江奇山异水的壮美景色，表达对自然山水的热爱和对追名逐利的鄙薄。","tags":["写景","山水","抒怀"],"units":[{"t":"风烟俱净，天山共色。","tr":"风消烟散，天空和山峰呈现同样的颜色。","p":0,"r":1},{"t":"从流飘荡，任意东西。","tr":"我乘船顺着江流漂荡，或东或西，随意而行。","p":0,"r":1},{"t":"自富阳至桐庐一百许里，奇山异水，天下独绝。","tr":"从富阳到桐庐，大约一百里，奇异的山水，是天下独一无二的。","p":0,"r":1},{"t":"水皆缥碧，千丈见底。","tr":"江水都是青白色，即使深达千丈也能看到水底。","p":1,"r":1},{"t":"游鱼细石，直视无碍。","tr":"游动的鱼和细小的石子，可以一直看得清清楚楚，毫无阻碍。","p":1,"r":1},{"t":"急湍甚箭，猛浪若奔。","tr":"湍急的水流比箭还快，凶猛的浪头像奔腾的骏马。","p":1,"r":1},{"t":"夹岸高山，皆生寒树，负势竞上，","tr":"江两岸的高山上，都长着让人感到寒意的树，山峰凭借山势争相向上，","p":2,"r":1},{"t":"互相轩邈，争高直指，千百成峰。","tr":"这些山互相比着往高处远处伸展，争着向上笔直地指向天空，形成无数座山峰。","p":2,"r":1},{"t":"泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。","tr":"泉水冲击岩石，发出清脆的响声；美丽的鸟儿互相应和着鸣叫，声音和谐悦耳。","p":2,"r":1},{"t":"蝉则千转不穷，猿则百叫无绝。","tr":"蝉长久地鸣叫不停，猿猴也不断地啼叫。","p":2,"r":1},{"t":"鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。","tr":"那些像鹰一样飞向高空、一心追求名利的人，看到这些山峰，就会平息热衷功名的心；那些忙于治理世务的人，看到这些山谷，就会流连忘返。","p":2,"r":1},{"t":"横柯上蔽，在昼犹昏；疏条交映，有时见日。","tr":"横斜的树枝在上方遮蔽，白天也像黄昏一样昏暗；稀疏的枝条互相掩映，有时能看见阳光。","p":2,"r":1}],"notes":[{"u":0,"w":"俱","m":"都","t":"实词","d":["一起","完备"]},{"u":0,"w":"共色","m":"颜色相同","t":"实词","d":["共同着色","一起增色"]},{"u":1,"w":"从","m":"顺着","t":"实词","d":["跟随","从事"]},{"u":1,"w":"任","m":"任凭，随意","t":"实词","d":["担任","任命"]},{"u":2,"w":"许","m":"大约，表示约数","t":"古今异义","d":["允许","赞许"]},{"u":2,"w":"绝","m":"独一无二","t":"实词","d":["断绝","极其"]},{"u":3,"w":"缥碧","m":"青白色","t":"实词","d":["飘动的绿色","碧绿色的玉石"]},{"u":4,"w":"直视","m":"一直看下去","t":"实词","d":["正面看","目不转睛"]},{"u":5,"w":"湍","m":"急流的水","t":"实词","d":["漩涡","瀑布"]},{"u":5,"w":"甚","m":"胜过，超过","t":"实词","d":["很","严重"]},{"u":5,"w":"奔","m":"飞奔的马","t":"词类活用"},{"u":6,"w":"夹岸","m":"夹江的两岸","t":"实词","d":["夹在岸边","两岸紧挨"]},{"u":6,"w":"负势","m":"凭借山势","t":"实词","d":["背负重压","违背形势"]},{"u":7,"w":"轩邈","m":"向高处和远处伸展（轩：向高处伸；邈：远）","t":"实词","d":["轩昂遥远","高大的车子与远方"]},{"u":8,"w":"激","m":"冲击","t":"实词","d":["激动","激励"]},{"u":8,"w":"泠泠","m":"形容水声清越","t":"实词","d":["寒冷的样子","冷清的样子"]},{"u":8,"w":"嘤嘤","m":"鸟类和鸣的声音","t":"实词","d":["小声哭泣声","蚊虫嗡嗡声"]},{"u":9,"w":"转","m":"通“啭”，鸣叫","t":"通假","d":["旋转","转移"]},{"u":9,"w":"穷","m":"尽，停止","t":"实词","d":["贫穷","研究"]},{"u":10,"w":"鸢","m":"老鹰","t":"实词","d":["风筝","鸟巢"]},{"u":10,"w":"戾","m":"到达","t":"实词","d":["暴戾","违背"]},{"u":10,"w":"经纶世务","m":"治理世间事务（这里指官场中人）","t":"实词","d":["编织世上的丝线","经营商业事务"]},{"u":10,"w":"窥","m":"看","t":"实词","d":["偷看","探测"]},{"u":10,"w":"反","m":"通“返”，返回","t":"通假","d":["反对","反而"]},{"u":11,"w":"横柯","m":"横斜的树枝","t":"实词","d":["横着的斧柄","弯曲的树根"]},{"u":11,"w":"疏条","m":"稀疏的枝条","t":"实词","d":["疏通的条文","稀疏的小路"]}],"tricky":["缥","湍","轩邈","嘤","鸢","戾","窥","柯"],"keyLines":[{"u":2,"hint":"《与朱元思书》中，总写富春江从富阳到桐庐一段山水举世无双的句子是："},{"u":3,"hint":"《与朱元思书》中，写江水清澈见底的句子是："},{"u":5,"hint":"《与朱元思书》中，用比喻写江水湍急的句子是："},{"u":7,"hint":"《与朱元思书》中，写群山争相向上、峰峦无数的句子是："},{"u":10,"hint":"《与朱元思书》中，借山水景色表达对追名逐利者讽刺、对官场中人劝诫的句子是："},{"u":11,"hint":"《与朱元思书》中，写树木枝叶繁茂、遮天蔽日的句子是："}],"appr":[{"q":"“急湍甚箭，猛浪若奔”运用了什么修辞？有何效果？","a":"运用比喻和夸张，以飞箭、奔马比喻江水之急、浪头之猛，既写出流速和气势，又使抽象的水势变得可感，突出富春江雄奇的一面。"},{"q":"“鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反”表达了作者怎样的思想？","a":"借山水之美使热衷名利、忙于政务的人平静下来，批评了追逐名利的世俗风气，也表达了作者以山水为乐、避世隐逸的情趣。"},{"q":"文章写山和写水有什么不同？","a":"写水重在清澈与湍急，由静到动；写山重在高峻、竞上与林木幽深。景物既有动态又有声响，由水到山，由视觉到听觉，写出富春江的“奇”与“异”。"}]},{"id":"g8a-w05","volume":"g8a","title":"得道多助，失道寡助","author":"孟子及其弟子","dynasty":"战国","genre":"论说文（节选自《孟子·公孙丑下》）","kind":"prose","intro":"选自《孟子》，是孟子针对诸侯争战、重视武力的现实，提出“仁政”主张的一段论述。","theme":"通过层层比较论证“天时不如地利，地利不如人和”，强调得民心者才能取得胜利。","tags":["议论","说理","仁政"],"units":[{"t":"天时不如地利，地利不如人和。","tr":"有利于作战的天气时令，比不上有利的地理形势；有利的地理形势，又比不上人心的团结一致。","p":0,"r":1},{"t":"三里之城，七里之郭，环而攻之而不胜。","tr":"一座方圆三里的内城，七里的外城，四面包围着攻打它，却不能取胜。","p":0,"r":1},{"t":"夫环而攻之，必有得天时者矣，","tr":"既然四面包围着攻打，必定是遇到了有利的天时，","p":0,"r":1},{"t":"然而不胜者，是天时不如地利也。","tr":"然而不能取胜，这是因为天时比不上地利。","p":0,"r":1},{"t":"城非不高也，池非不深也，兵革非不坚利也，","tr":"城墙并不是不高，护城河并不是不深，兵器甲胄并不是不坚固锐利，","p":0,"r":1},{"t":"米粟非不多也，委而去之，是地利不如人和也。","tr":"粮食并不是不多，可是守城的人还是弃城逃走了，这是因为地利比不上人和。","p":0,"r":1},{"t":"故曰：域民不以封疆之界，固国不以山溪之险，","tr":"所以说：使百姓定居不迁移，不能靠划定疆界；巩固国防，不能靠山川的险要；","p":0,"r":1},{"t":"威天下不以兵革之利。","tr":"震慑天下，不能靠武器装备的锐利。","p":0,"r":1},{"t":"得道者多助，失道者寡助。","tr":"施行仁政的人，帮助他的人就多；不施行仁政的人，帮助他的人就少。","p":0,"r":1},{"t":"寡助之至，亲戚畔之；多助之至，天下顺之。","tr":"帮助的人少到极点，连亲戚都会背叛他；帮助的人多到极点，天下人都会归顺他。","p":0,"r":1},{"t":"以天下之所顺，攻亲戚之所畔，","tr":"凭着天下人都归顺的条件，去攻打连亲戚都背叛的人，","p":0,"r":1},{"t":"故君子有不战，战必胜矣。","tr":"所以施行仁政的君子不战则已，一战就一定取胜。","p":0,"r":1}],"notes":[{"u":0,"w":"天时","m":"指有利于作战的天气、时令","t":"实词","d":["上天赐予的时间","天气预报"]},{"u":0,"w":"地利","m":"指有利于作战的地理形势","t":"实词","d":["土地的利益","山川的收益"]},{"u":0,"w":"人和","m":"指作战中的人心所向、上下团结","t":"实词","d":["人际关系和睦","人民安定"]},{"u":1,"w":"郭","m":"外城","t":"实词","d":["城郭","村落"]},{"u":1,"w":"环","m":"包围（名词作动词）","t":"词类活用"},{"u":2,"w":"夫","m":"发语词，无实义","t":"虚词"},{"u":3,"w":"是","m":"这","t":"古今异义","d":["正确","判断词“是”"]},{"u":4,"w":"池","m":"护城河","t":"古今异义","d":["池塘","水池"]},{"u":4,"w":"兵革","m":"兵器和甲胄，泛指武器装备","t":"古今异义","d":["战争","士兵与皮革"]},{"u":5,"w":"委","m":"放弃","t":"实词","d":["委托","委屈"]},{"u":5,"w":"去","m":"离开","t":"古今异义","d":["前往","过去"]},{"u":6,"w":"域","m":"界限，这里指限制（名词作动词）","t":"词类活用"},{"u":6,"w":"固","m":"使……巩固（形容词作动词）","t":"词类活用"},{"u":7,"w":"威","m":"震慑，使……畏服","t":"词类活用"},{"u":8,"w":"寡","m":"少","t":"实词","d":["寡妇","孤独"]},{"u":9,"w":"亲戚","m":"内外亲属，泛指亲人","t":"古今异义","d":["亲近的朋友","有血缘关系的远亲"]},{"u":9,"w":"畔","m":"通“叛”，背叛","t":"通假","d":["田地的边界","岸边"]},{"u":9,"w":"顺","m":"归顺，顺从","t":"实词","d":["顺利","依顺着"]},{"u":11,"w":"君子","m":"这里指施行仁政的人","t":"古今异义","d":["品德高尚的人","有学问的人"]}],"tricky":["郭","粟","委","畔","域","溪"],"keyLines":[{"u":0,"hint":"《得道多助，失道寡助》中，孟子提出的中心论点是："},{"u":4,"hint":"《得道多助，失道寡助》中，说明城池本身条件很好、不缺防守条件的句子是："},{"u":6,"hint":"《得道多助，失道寡助》中，说明使百姓安定、巩固国家都不能依赖地理险阻的句子是："},{"u":8,"hint":"《得道多助，失道寡助》中，概括“仁政”得失与支持者多少关系的句子是："},{"u":11,"hint":"《得道多助，失道寡助》中，得出行仁政者必然取胜结论的句子是："}],"appr":[{"q":"文章是怎样一步步论证中心论点的？","a":"先提出“天时不如地利，地利不如人和”，再用两个攻城的事例，分别说明天时不如地利、地利不如人和；然后由此推出“得道多助，失道寡助”，最后得出君子必胜的结论，层层推进。"},{"q":"第二、三层中“非不……也”的连用有什么作用？","a":"连续用双重否定列举城高池深、兵坚粮足等优越条件，句式整齐，气势强烈，反衬“委而去之”的结局，突出人心向背才是决定胜负的关键。"}]},{"id":"g8a-w06","volume":"g8a","title":"富贵不能淫","author":"孟子及其弟子","dynasty":"战国","genre":"论说文（节选自《孟子·滕文公下》）","kind":"prose","intro":"选自《孟子》。纵横家景春推崇公孙衍、张仪，孟子借此批驳，提出自己心中的“大丈夫”标准。","theme":"批驳以权势威慑诸侯的“大丈夫”，提出“富贵不能淫，贫贱不能移，威武不能屈”的人格标准。","tags":["议论","说理","修身"],"units":[{"t":"景春曰：“公孙衍、张仪岂不诚大丈夫哉？","tr":"景春说：“公孙衍、张仪难道不是真正的大丈夫吗？","p":0,"r":0},{"t":"一怒而诸侯惧，安居而天下熄。”","tr":"他们一发怒，诸侯就害怕；他们安静下来，天下就太平无事。”","p":0,"r":0},{"t":"孟子曰：“是焉得为大丈夫乎？","tr":"孟子说：“这怎么能算大丈夫呢？","p":1,"r":0},{"t":"子未学礼乎？丈夫之冠也，父命之；","tr":"你没有学过礼吗？男子举行成人礼时，父亲训导他；","p":1,"r":0},{"t":"女子之嫁也，母命之，往送之门，戒之曰：","tr":"女子出嫁时，母亲训导她，送她到门口，告诫她说：","p":1,"r":0},{"t":"‘往之女家，必敬必戒，无违夫子！’","tr":"‘到了你的夫家，一定要恭敬谨慎，不要违背丈夫！’","p":1,"r":0},{"t":"以顺为正者，妾妇之道也。","tr":"把顺从当作准则的，是妇人的行为准则。","p":1,"r":1},{"t":"居天下之广居，立天下之正位，行天下之大道；","tr":"住在天下最宽广的住宅里，站在天下最正确的位置上，走在天下最光明的大道上；","p":1,"r":1},{"t":"得志，与民由之；不得志，独行其道。","tr":"得志时，同百姓一起沿着正道前进；不得志时，也独自坚守自己的原则。","p":1,"r":1},{"t":"富贵不能淫，贫贱不能移，威武不能屈。","tr":"富贵不能迷惑他的心，贫贱不能改变他的志向，权势武力不能使他屈服。","p":1,"r":1},{"t":"此之谓大丈夫。”","tr":"这样才称得上大丈夫。”","p":1,"r":1}],"notes":[{"u":0,"w":"诚","m":"真正，确实","t":"实词","d":["诚实","诚恳"]},{"u":0,"w":"岂","m":"难道（表反问）","t":"虚词"},{"u":1,"w":"惧","m":"使……害怕（使动用法）","t":"词类活用"},{"u":1,"w":"安居","m":"安静下来，不发怒","t":"古今异义","d":["安稳地居住","安置住所"]},{"u":1,"w":"熄","m":"平息，指战火平息","t":"实词","d":["熄灭火焰","停止呼吸"]},{"u":2,"w":"焉","m":"怎么","t":"虚词"},{"u":2,"w":"为","m":"算作，称得上","t":"实词","d":["做","替"]},{"u":3,"w":"冠","m":"行加冠礼（名词作动词）","t":"词类活用"},{"u":3,"w":"命","m":"教导，训诫","t":"实词","d":["命令","命运"]},{"u":4,"w":"戒","m":"告诫，叮嘱","t":"实词","d":["戒备","戒除"]},{"u":5,"w":"女","m":"通“汝”，你","t":"通假","d":["女儿","年轻女子"]},{"u":5,"w":"夫子","m":"丈夫","t":"古今异义","d":["对孔子的尊称","老师"]},{"u":5,"w":"违","m":"违背","t":"实词","d":["离开","错误"]},{"u":6,"w":"妾妇","m":"妇女，旧时妇人的通称","t":"实词","d":["小妾与妻子","年轻的媳妇"]},{"u":7,"w":"广居","m":"宽广的住宅，喻指“仁”","t":"实词","d":["广阔的居民区","宽大的房屋"]},{"u":8,"w":"由","m":"遵循，沿着","t":"实词","d":["经过","由于"]},{"u":8,"w":"得志","m":"实现抱负，得到任用","t":"古今异义","d":["骄傲自得","得到一时的满足"]},{"u":9,"w":"淫","m":"使……惑乱（使动用法）","t":"词类活用"},{"u":9,"w":"移","m":"使……改变（使动用法）","t":"词类活用"},{"u":9,"w":"屈","m":"使……屈服（使动用法）","t":"词类活用"},{"u":10,"w":"此之谓大丈夫","m":"这就叫做大丈夫（宾语前置，“之”为宾语前置的标志）","t":"特殊句式"}],"tricky":["熄","淫","屈","冠","戒","妾"],"keyLines":[{"u":7,"hint":"《富贵不能淫》中，孟子用“居”“立”“行”三个排比句描绘大丈夫的立足之处、立场和道路的句子是："},{"u":8,"hint":"《富贵不能淫》中，说明大丈夫无论得志还是不得志都坚守正道的句子是："},{"u":9,"hint":"《富贵不能淫》中，体现孟子关于“大丈夫”人格标准的三句话是："},{"u":6,"hint":"《富贵不能淫》中，孟子指出公孙衍、张仪之流只是顺从权势的人的句子是："}],"appr":[{"q":"孟子是怎样批驳景春的观点的？","a":"孟子先以“丈夫之冠”“女子之嫁”的礼仪为喻，指出公孙衍、张仪靠顺从君主取势，不过是“妾妇之道”；再正面提出大丈夫的立身准则，由破到立，形成鲜明对比。"},{"q":"“居天下之广居，立天下之正位，行天下之大道”运用了什么手法？有何作用？","a":"运用排比，用三个相同句式分别比喻仁、礼、义，气势充沛，层层强化，使“大丈夫”的人格形象鲜明有力，也增强了论述的说服力。"}]},{"id":"g8a-w07","volume":"g8a","title":"生于忧患，死于安乐","author":"孟子","dynasty":"战国","genre":"论说文（节选自《孟子·告子下》）","kind":"prose","intro":"选自《孟子·告子下》。孟子先列举六位贤人由困境中崛起的事例，再由个人推及国家，得出“生于忧患而死于安乐”的结论。","theme":"说明艰苦磨难能造就人才、忧患意识使人和国家生存，安逸享乐则会导致衰亡。","tags":["议论","说理","励志"],"units":[{"t":"舜发于畎亩之中，傅说举于版筑之间，","tr":"舜是从田间耕作中被起用的，傅说是从筑墙的劳作中被提拔的，","p":0,"r":1},{"t":"胶鬲举于鱼盐之中，管夷吾举于士，","tr":"胶鬲是从贩卖鱼盐的生意中被举用的，管夷吾是从狱官手中被释放后任用的，","p":0,"r":1},{"t":"孙叔敖举于海，百里奚举于市。","tr":"孙叔敖是从海滨隐居中被起用的，百里奚是从集市上被赎出后任用的。","p":0,"r":1},{"t":"故天将降大任于是人也，必先苦其心志，","tr":"所以上天要把重大的使命交给某个人，一定先使他的内心痛苦，","p":0,"r":1},{"t":"劳其筋骨，饿其体肤，空乏其身，","tr":"使他的筋骨劳累，使他的肌肤饥饿，使他的身子穷困，","p":0,"r":1},{"t":"行拂乱其所为，所以动心忍性，曾益其所不能。","tr":"使他每做一事总是不顺，这样来触动他的心意，磨炼他的性情，增加他所欠缺的才能。","p":0,"r":1},{"t":"人恒过，然后能改；困于心，衡于虑，而后作；","tr":"一个人常常犯错，然后才能改正；内心困苦，思虑阻塞，然后才能奋发；","p":1,"r":1},{"t":"征于色，发于声，而后喻。","tr":"愁苦表现在脸色上，吐露在声音里，然后才能被人了解。","p":1,"r":1},{"t":"入则无法家拂士，出则无敌国外患者，","tr":"一个国家，在国内如果没有坚守法度的世臣和辅佐君主的贤士，在国外如果没有敌对的国家和外来的祸患，","p":1,"r":1},{"t":"国恒亡，然后知生于忧患而死于安乐也。","tr":"这样的国家往往会灭亡。这时才明白忧愁祸患使人生存，安逸享乐使人灭亡的道理。","p":1,"r":1}],"notes":[{"u":0,"w":"发","m":"兴起，指被任用","t":"实词","d":["出发","发射"]},{"u":0,"w":"畎亩","m":"田地，田间","t":"实词","d":["沟渠水道","山间小路"]},{"u":0,"w":"举","m":"被选拔，被任用","t":"实词","d":["举起","全部"]},{"u":0,"w":"版筑","m":"古代筑墙用的夹板和杵，这里指筑墙的劳作","t":"实词","d":["刻印书版","建造房屋"]},{"u":1,"w":"士","m":"狱官","t":"实词","d":["读书人","战士"]},{"u":1,"w":"鱼盐","m":"贩卖鱼和盐的生意","t":"实词","d":["腌鱼","海边的盐场"]},{"u":2,"w":"海","m":"海滨","t":"实词","d":["大海","宽广"]},{"u":3,"w":"是","m":"这","t":"古今异义","d":["正确","表判断的词"]},{"u":3,"w":"苦","m":"使……痛苦（使动用法）","t":"词类活用"},{"u":3,"w":"任","m":"责任，使命","t":"实词","d":["任命","任凭"]},{"u":4,"w":"劳","m":"使……劳累（使动用法）","t":"词类活用"},{"u":4,"w":"饿","m":"使……饥饿（使动用法）","t":"词类活用"},{"u":4,"w":"空乏","m":"使……穷困缺乏（使动用法）","t":"词类活用"},{"u":5,"w":"拂","m":"违背，不顺","t":"实词","d":["轻轻擦过","拂拭"]},{"u":5,"w":"所以","m":"用来……的办法（凭借此）","t":"古今异义","d":["表示结果的连词","因此"]},{"u":5,"w":"动心忍性","m":"使内心惊动、使性情坚韧（使动用法）","t":"词类活用"},{"u":5,"w":"曾","m":"同“增”，增加","t":"通假","d":["曾经","竟然"]},{"u":6,"w":"恒","m":"常常","t":"实词","d":["永久","恒心"]},{"u":6,"w":"衡","m":"同“横”，梗塞，不顺","t":"通假","d":["衡量","平衡"]},{"u":6,"w":"作","m":"奋起，有所作为","t":"实词","d":["制作","写作"]},{"u":7,"w":"征","m":"表现，显露","t":"实词","d":["征召","远行"]},{"u":7,"w":"喻","m":"明白，了解","t":"实词","d":["比喻","晓谕"]},{"u":8,"w":"入","m":"在国内","t":"实词","d":["进入","收入"]},{"u":8,"w":"法家","m":"有法度的世臣","t":"古今异义","d":["先秦主张法治的学派","执法的官员"]},{"u":8,"w":"拂士","m":"“拂”同“弼”，辅佐君主的贤士","t":"通假","d":["拂逆君意的人","掸去灰尘的人"]},{"u":8,"w":"敌国外患","m":"敌对的国家和外来的祸患","t":"古今异义","d":["外国入侵者","国内外的灾祸"]},{"u":9,"w":"生","m":"生存（形容词用作动词）","t":"词类活用"},{"u":9,"w":"死","m":"灭亡（形容词用作动词）","t":"词类活用"}],"tricky":["畎","傅说","胶鬲","拂","衡","喻"],"keyLines":[{"u":3,"hint":"《生于忧患，死于安乐》中，提出“上天要把重任交给某人，必先使其经受磨炼”这一观点的句子是："},{"u":5,"hint":"表明艰苦磨难能够激励人的意志、增长才干的三句是："},{"u":6,"hint":"说明人犯了错误才能改正、内心困苦才能奋发的句子是："},{"u":9,"hint":"全文的中心论点（总结句）是："}],"appr":[{"q":"文章开头列举六位历史人物，在结构和论证上有什么作用？","a":"六人都出身卑微、历经磨难后才成就大业，采用举例论证，事实有力；这些事例由个别到一般，引出“天将降大任”的普遍道理，为后文论述作铺垫。"},{"q":"第二段如何由个人谈到国家？这样写有何好处？","a":"先说个人只有经历困窘才能改过奋发，再说国家若无内部贤臣、外部压力就会灭亡，由个人推及国家，由小到大层层深入，最终得出结论，论证更全面，也更有说服力。"},{"q":"“生于忧患，死于安乐”对今天的我们有什么启示？","a":"它提醒我们要有居安思危的意识，不畏艰难困苦，把挫折当作磨砺意志、增长才干的机会；同时不能贪图安逸，否则个人和集体都会走向衰败。"}]},{"id":"g8a-w08","volume":"g8a","title":"愚公移山","author":"列子（及其后学）","dynasty":"战国","genre":"寓言（选自《列子·汤问》）","kind":"prose","intro":"选自《列子·汤问》。故事讲年近九十的愚公不畏艰难，决心带子孙搬走挡路的太行、王屋二山，最后感动天帝。","theme":"通过愚公与智叟的对比，赞扬不畏艰难、持之以恒的精神，说明只要坚持就能战胜困难。","tags":["寓言","叙事","励志"],"units":[{"t":"太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。","tr":"太行、王屋两座大山，周围七百里，高七八千丈，原本坐落在冀州的南面、黄河北岸的北面。","p":0,"r":1},{"t":"北山愚公者，年且九十，面山而居。","tr":"北山下有个叫愚公的人，年纪快九十了，住在山的正对面。","p":1,"r":1},{"t":"惩山北之塞，出入之迂也，聚室而谋曰：","tr":"他苦于山北面的阻塞，出入都要绕远路，就召集全家人商量说：","p":1,"r":1},{"t":"“吾与汝毕力平险，指通豫南，达于汉阴，可乎？”","tr":"“我和你们一起尽力铲平险峻的大山，使道路一直通到豫州的南面，到达汉水南岸，可以吗？”","p":1,"r":1},{"t":"杂然相许。","tr":"大家纷纷表示赞成。","p":1,"r":1},{"t":"其妻献疑曰：“以君之力，曾不能损魁父之丘，如太行、王屋何？","tr":"他的妻子提出疑问说：“凭你的力气，连魁父那样的小土丘都削不平，能把太行、王屋怎么样呢？","p":1,"r":1},{"t":"且焉置土石？”","tr":"再说，挖出来的土块石头往哪里放呢？”","p":1,"r":1},{"t":"杂曰：“投诸渤海之尾，隐土之北。”","tr":"大家说：“扔到渤海边上，隐土的北面。”","p":1,"r":1},{"t":"遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。","tr":"于是愚公带领子孙中能挑担子的三个人，凿石头、挖泥土，用箕畚运到渤海边上。","p":2,"r":1},{"t":"邻人京城氏之孀妻有遗男，始龀，跳往助之。","tr":"邻居京城氏的寡妇有个遗腹子，刚到换牙的年纪，蹦蹦跳跳地去帮忙。","p":2,"r":1},{"t":"寒暑易节，始一反焉。","tr":"冬夏换了一个季节，才往返一趟。","p":2,"r":1},{"t":"河曲智叟笑而止之曰：“甚矣，汝之不惠！","tr":"河曲的智叟笑着劝阻他，说：“你太不聪明了！","p":3,"r":1},{"t":"以残年余力，曾不能毁山之一毛，其如土石何？”","tr":"凭你这剩下的岁月和余力，连山上的一根草都毁不掉，又能把土块石头怎么样呢？”","p":3,"r":1},{"t":"北山愚公长息曰：“汝心之固，固不可彻，曾不若孀妻弱子。","tr":"北山愚公长叹一声说：“你的思想顽固到了不可开窍的地步，还不如寡妇和小孩呢。","p":3,"r":1},{"t":"虽我之死，有子存焉；子又生孙，孙又生子；","tr":"即使我死了，还有儿子在；儿子又生孙子，孙子又生儿子；","p":3,"r":1},{"t":"子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？”","tr":"儿子又有儿子，儿子又有孙子；子子孙孙无穷无尽，可山却不会再增高，还愁什么挖不平呢？”","p":3,"r":1},{"t":"河曲智叟亡以应。","tr":"河曲智叟无话可答。","p":3,"r":1},{"t":"操蛇之神闻之，惧其不已也，告之于帝。","tr":"手里握着蛇的山神听说了这件事，怕他不停地挖下去，就向天帝报告。","p":4,"r":1},{"t":"帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。","tr":"天帝被愚公的诚心感动，命令夸娥氏的两个儿子背走两座山，一座放在朔方的东面，一座放在雍州的南面。","p":4,"r":1},{"t":"自此，冀之南，汉之阴，无陇断焉。","tr":"从此，冀州的南部直到汉水南岸，再也没有高山阻隔了。","p":4,"r":1}],"notes":[{"u":0,"w":"方","m":"方圆，周围","t":"实词","d":["方形","正在"]},{"u":0,"w":"仞","m":"古代长度单位（周代八尺，一说七尺）","t":"实词","d":["坚韧","一种山名"]},{"u":0,"w":"河阳","m":"黄河北岸（山南水北为阳）","t":"古今异义","d":["黄河的南岸","河南的阳城"]},{"u":1,"w":"且","m":"将近，将要","t":"实词","d":["而且","暂且"]},{"u":1,"w":"面","m":"面对着（名词作状语或动词）","t":"词类活用"},{"u":2,"w":"惩","m":"苦于，被……所苦","t":"实词","d":["惩罚","警戒"]},{"u":2,"w":"塞","m":"阻塞，不通","t":"实词","d":["边塞","堵住缝隙"]},{"u":2,"w":"迂","m":"曲折，绕远","t":"实词","d":["迂腐","拖延"]},{"u":2,"w":"聚室","m":"集合全家人","t":"实词","d":["聚集在房间里","聚会"]},{"u":3,"w":"毕力","m":"竭尽全力","t":"实词","d":["结束工作","完成任务"]},{"u":3,"w":"指通","m":"一直通到","t":"实词","d":["指点通晓","用手指向"]},{"u":3,"w":"汉阴","m":"汉水南岸（水南为阴）","t":"古今异义","d":["汉水北岸","汉朝的阴山"]},{"u":4,"w":"杂然","m":"纷纷地，七嘴八舌地","t":"实词","d":["混杂不清地","乱糟糟地"]},{"u":5,"w":"曾不能","m":"连……都不能","t":"实词","d":["曾经不能","从来不能"]},{"u":5,"w":"损","m":"削减，减少","t":"实词","d":["损坏","伤害"]},{"u":5,"w":"如太行、王屋何","m":"能把太行、王屋怎么样呢（“如……何”表示无可奈何的固定格式）","t":"特殊句式","d":[]},{"u":6,"w":"焉","m":"哪里（疑问代词）","t":"虚词"},{"u":7,"w":"诸","m":"“之于”的合音","t":"虚词"},{"u":8,"w":"荷","m":"挑，担","t":"实词","d":["荷花","负担责任"]},{"u":8,"w":"叩","m":"敲击，这里指凿","t":"实词","d":["叩拜","询问"]},{"u":9,"w":"孀妻","m":"寡妇","t":"古今异义","d":["年轻的妻子","妻子"]},{"u":9,"w":"始龀","m":"刚到换牙的年龄（七八岁）","t":"实词","d":["刚刚开始读书","刚学会走路"]},{"u":10,"w":"易节","m":"更换季节","t":"实词","d":["改变节操","改变节日"]},{"u":10,"w":"反","m":"同“返”，往返","t":"通假","d":["反对","相反"]},{"u":11,"w":"惠","m":"同“慧”，聪明","t":"通假","d":["恩惠","仁爱"]},{"u":12,"w":"残年余力","m":"所剩不多的岁月和力气","t":"实词","d":["不幸的晚年","多余的力气"]},{"u":13,"w":"彻","m":"通达，想得通","t":"实词","d":["彻底","撤除"]},{"u":13,"w":"固","m":"顽固，固执","t":"实词","d":["坚固","本来"]},{"u":14,"w":"存","m":"存活，活着","t":"实词","d":["保存","存在"]},{"u":15,"w":"匮","m":"穷尽","t":"实词","d":["缺乏","贫穷"]},{"u":15,"w":"何苦而不平","m":"还愁什么山不平呢（“何苦而”表反问）","t":"特殊句式","d":[]},{"u":16,"w":"亡","m":"同“无”，没有","t":"通假","d":["逃亡","灭亡"]},{"u":17,"w":"已","m":"停止","t":"实词","d":["已经","完成"]},{"u":18,"w":"厝","m":"放置","t":"实词","d":["磨刀石","错误"]},{"u":19,"w":"陇断","m":"“陇”同“垄”，高地；陇断指高地阻隔","t":"通假","d":["陇山断裂","甘肃的断崖"]}],"tricky":["仞","惩","迂","孀","龀","箕畚","匮","厝"],"keyLines":[{"u":1,"hint":"《愚公移山》中交代愚公年纪与居住位置的句子是："},{"u":15,"hint":"愚公驳斥智叟，说明子孙繁衍无穷、而山不会增高的句子是："},{"u":13,"hint":"愚公批评智叟思想顽固、连孤儿寡妇都不如的句子是："},{"u":11,"hint":"智叟嘲笑愚公不聪明的话是："},{"u":18,"hint":"神话式结局中，天帝被愚公感动后采取行动的句子是："}],"appr":[{"q":"智叟与愚公的形象形成怎样的对比？作者的用意是什么？","a":"智叟自以为聪明，只看眼前、不肯行动，实则短视；愚公看似愚笨，却目光长远、意志坚定。作者以“智”反衬“愚”、以“愚”显真智，赞美坚持不懈的精神。"},{"q":"结尾写天帝派神背走大山，有什么作用？","a":"这是带神话色彩的情节，既表现愚公的诚心感天动地，使故事圆满，也寄托了古代劳动人民战胜自然的愿望，并突出主旨。"},{"q":"愚公说服众人、驳斥智叟时用了怎样的论证思路？","a":"他先以“我死有子”推出子孙无穷，再对比“山不加增”，指出人力可无限累积而山体不会增长，因此必有挖平之日，逻辑严密，富有说服力。"}]},{"id":"g8a-w09","volume":"g8a","title":"周亚夫军细柳","author":"司马迁","dynasty":"西汉","genre":"史传（选自《史记·绛侯周勃世家》）","kind":"prose","intro":"选自《史记·绛侯周勃世家》。汉文帝亲自劳军，在霸上、棘门畅行无阻，到细柳营却被拒于门外，由此显出周亚夫治军严明。","theme":"通过文帝劳军的见闻，对比衬托出周亚夫治军严整、忠于职守、不卑不亢的将军风范，也写出文帝的明智大度。","tags":["史传","叙事","人物"],"units":[{"t":"文帝之后六年，匈奴大入边。","tr":"汉文帝后元六年，匈奴大举侵入边境。","p":0,"r":0},{"t":"乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；","tr":"朝廷于是任命宗正刘礼为将军，驻军霸上；任命祝兹侯徐厉为将军，驻军棘门；","p":0,"r":0},{"t":"以河内守亚夫为将军，军细柳：以备胡。","tr":"任命河内郡太守周亚夫为将军，驻军细柳：用来防备匈奴。","p":0,"r":0},{"t":"上自劳军。","tr":"皇帝亲自去慰劳军队。","p":1,"r":1},{"t":"至霸上及棘门军，直驰入，将以下骑送迎。","tr":"到了霸上和棘门的军营，车驾径直驰入，将军及其部下都骑马迎送。","p":1,"r":1},{"t":"已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。","tr":"不久来到细柳军营，只见将士都披着铠甲，兵器锋利，弓弩拉满。","p":1,"r":1},{"t":"天子先驱至，不得入。","tr":"天子的先导卫队到了，却不能进入。","p":1,"r":1},{"t":"先驱曰：“天子且至！”","tr":"先导说：“天子马上就到！”","p":1,"r":1},{"t":"军门都尉曰：“将军令曰：‘军中闻将军令，不闻天子之诏。’”","tr":"守营门的都尉说：“将军有令：‘军中只听将军的命令，不听天子的诏令。’”","p":1,"r":1},{"t":"居无何，上至，又不得入。","tr":"过了不久，皇上到了，又不能进入。","p":1,"r":1},{"t":"于是上乃使使持节诏将军：“吾欲入劳军。”","tr":"于是皇上就派使者拿着符节通知将军：“我要进营慰劳军队。”","p":1,"r":1},{"t":"亚夫乃传言开壁门。","tr":"周亚夫这才传令打开营门。","p":1,"r":1},{"t":"壁门士吏谓从属车骑曰：“将军约，军中不得驱驰。”","tr":"营门的军官对随从的车骑说：“将军有规定，军营中不许策马奔驰。”","p":1,"r":1},{"t":"于是天子乃按辔徐行。","tr":"于是天子也只好拉住缰绳，缓缓前行。","p":1,"r":1},{"t":"至营，将军亚夫持兵揖曰：“介胄之士不拜，请以军礼见。”","tr":"到了营中，将军周亚夫手持兵器作揖说：“身披甲胄的将士不行跪拜礼，请允许我用军礼拜见。”","p":1,"r":1},{"t":"天子为动，改容式车。","tr":"天子被感动了，神色变得庄重，俯身扶着车前的横木致敬。","p":1,"r":1},{"t":"使人称谢：“皇帝敬劳将军。”","tr":"并派人致意说：“皇帝敬重地慰劳将军。”","p":1,"r":1},{"t":"成礼而去。","tr":"完成了劳军的礼仪就离开了。","p":1,"r":1},{"t":"既出军门，群臣皆惊。","tr":"出了军营的大门，群臣都很惊讶。","p":2,"r":1},{"t":"文帝曰：“嗟乎，此真将军矣！","tr":"文帝感叹说：“啊，这才是真正的将军啊！","p":2,"r":1},{"t":"曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。","tr":"先前霸上、棘门的军队，简直像儿戏一样，那里的将领本来就可以通过偷袭而被俘虏。","p":2,"r":1},{"t":"至于亚夫，可得而犯邪！”","tr":"至于周亚夫，又怎么能被冒犯呢！”","p":2,"r":1},{"t":"称善者久之。","tr":"称赞了很久。","p":2,"r":1}],"notes":[{"u":0,"w":"边","m":"边境","t":"实词","d":["旁边","边缘"]},{"u":1,"w":"军","m":"驻军，驻扎（名词作动词）","t":"词类活用"},{"u":1,"w":"乃","m":"于是，就","t":"虚词"},{"u":2,"w":"备","m":"防备","t":"实词","d":["准备","具备"]},{"u":2,"w":"胡","m":"指匈奴","t":"实词","d":["胡须","胡乱"]},{"u":3,"w":"劳","m":"慰劳","t":"实词","d":["劳累","功劳"]},{"u":4,"w":"驰","m":"驱车疾行","t":"实词","d":["驰名","向往"]},{"u":4,"w":"将","m":"将军，主将","t":"实词","d":["将要","带领"]},{"u":4,"w":"送迎","m":"送行和迎接","t":"实词","d":["欢送","迎接新人"]},{"u":5,"w":"已而","m":"不久，随后","t":"古今异义","d":["已经而且","停止了"]},{"u":5,"w":"之","m":"到，往","t":"实词","d":["的","他"]},{"u":5,"w":"被","m":"同“披”，穿着","t":"通假","d":["遭受","覆盖"]},{"u":5,"w":"锐","m":"使……锋利，指磨得锋利（形容词作动词）","t":"词类活用"},{"u":5,"w":"彀","m":"拉满弓弩","t":"实词","d":["幼鸟","牢笼"]},{"u":6,"w":"先驱","m":"先导的卫队","t":"古今异义","d":["先行的开拓者","最早的人"]},{"u":7,"w":"且","m":"将要，马上","t":"实词","d":["并且","暂且"]},{"u":8,"w":"诏","m":"皇帝的命令","t":"实词","d":["告诫","报告"]},{"u":9,"w":"居无何","m":"过了不久","t":"实词","d":["住在没有什么的地方","停留不久"]},{"u":10,"w":"使使持节","m":"派使者拿着符节（第一个“使”是派遣，第二个“使”是使者）","t":"一词多义"},{"u":10,"w":"节","m":"符节，皇帝使者的凭证","t":"实词","d":["节日","节操"]},{"u":11,"w":"传言","m":"传令","t":"古今异义","d":["流传的话","传说"]},{"u":12,"w":"约","m":"规定，约束","t":"实词","d":["约定","大约"]},{"u":13,"w":"按辔","m":"拉住缰绳","t":"实词","d":["按住马鞍","按照命令"]},{"u":14,"w":"介胄","m":"铠甲和头盔，指身披甲胄","t":"实词","d":["介绍","胄子"]},{"u":14,"w":"揖","m":"拱手行礼","t":"实词","d":["迎接","作揖叩头"]},{"u":15,"w":"式","m":"同“轼”，车前横木，这里指俯身扶轼致敬（名词作动词）","t":"通假","d":["样式","式子"]},{"u":15,"w":"为动","m":"被感动","t":"特殊句式","d":[]},{"u":20,"w":"曩者","m":"先前，从前","t":"实词","d":["囊中之物","未来"]},{"u":20,"w":"固","m":"本来，当然","t":"实词","d":["坚固","顽固"]},{"u":20,"w":"袭","m":"偷袭","t":"实词","d":["沿袭","穿着"]},{"u":21,"w":"犯","m":"冒犯，侵犯","t":"实词","d":["犯罪","违犯法令"]},{"u":22,"w":"称善","m":"称赞，叫好","t":"实词","d":["称重","良善"]}],"tricky":["曩","彀","辔","胄","揖","壁"],"keyLines":[{"u":8,"hint":"《周亚夫军细柳》中，守营都尉转述将军军令、表明军中只服从将军的句子是："},{"u":12,"hint":"营门军官告诫天子随从不得在营中奔驰的话是："},{"u":14,"hint":"周亚夫面见皇帝时，以甲胄在身为由要求行军礼的话是："},{"u":19,"hint":"文帝离开细柳营后，由衷赞叹周亚夫的句子是："},{"u":20,"hint":"文帝用来反衬霸上、棘门军纪松弛的句子是："}],"appr":[{"q":"文章如何通过对比刻画周亚夫的形象？","a":"先写霸上、棘门军“直驰入”、将官骑马送迎，再写细柳营戒备森严、拒天子于门外，两相对照，反衬出周亚夫治军严整、不徇私情、忠于职守的真将军形象。"},{"q":"汉文帝的表现说明了什么？","a":"他被拒后不怒反敬，按辔徐行、改容式车，事后称赞亚夫，表现出文帝识大体、明事理、尊重忠诚能干之将，也从侧面衬托了周亚夫。"},{"q":"“军中闻将军令，不闻天子之诏”体现了什么？","a":"这句军令强调军营中令行禁止、只服从主帅，突出周亚夫严明的纪律与独立的军事指挥权，也是细柳营军容整肃的集中体现。"}]},{"id":"g8b-p01","volume":"g8b","title":"关雎","author":"佚名","dynasty":"先秦","genre":"诗经（国风·周南）","kind":"poem","intro":"《关雎》是《诗经》开篇第一首，出自《周南》，多被看作一首描写君子追求淑女的恋歌，先秦时在民间传唱。","theme":"以雎鸠和鸣起兴，写男子对美好女子热烈而真挚的追求与思念。","tags":["爱情","起兴","民歌"],"units":[{"t":"关关雎鸠，在河之洲。","tr":"雎鸠鸟关关地和声鸣叫，栖息在河中的沙洲上。","p":0,"r":1},{"t":"窈窕淑女，君子好逑。","tr":"文静美好的姑娘，正是君子的好配偶。","p":0,"r":1},{"t":"参差荇菜，左右流之。","tr":"长短不齐的荇菜，在左右两边顺水去捞取。","p":1,"r":1},{"t":"窈窕淑女，寤寐求之。","tr":"文静美好的姑娘，日日夜夜都想追求她。","p":1,"r":1},{"t":"求之不得，寤寐思服。","tr":"追求而得不到，日夜都在思念她。","p":1,"r":1},{"t":"悠哉悠哉，辗转反侧。","tr":"思绪绵长啊绵长，翻来覆去难以入睡。","p":1,"r":1},{"t":"参差荇菜，左右采之。","tr":"长短不齐的荇菜，在左右两边采摘它。","p":2,"r":1},{"t":"窈窕淑女，琴瑟友之。","tr":"文静美好的姑娘，弹起琴瑟来亲近她。","p":2,"r":1},{"t":"参差荇菜，左右芼之。","tr":"长短不齐的荇菜，在左右两边挑选它。","p":2,"r":1},{"t":"窈窕淑女，钟鼓乐之。","tr":"文静美好的姑娘，敲钟击鼓使她欢乐。","p":2,"r":1}],"notes":[{"u":0,"w":"雎鸠","m":"一种水鸟，据说雌雄情意专一","t":"实词","d":["一种猛禽","一种候鸟，秋来春去"]},{"u":0,"w":"洲","m":"水中的陆地，沙洲","t":"实词","d":["行政区划的州","水边的高地"]},{"u":1,"w":"窈窕","m":"文静而美好的样子","t":"实词","d":["身材苗条纤细","幽深寂静"]},{"u":1,"w":"好逑","m":"好配偶","t":"实词","d":["喜欢追求","好朋友"]},{"u":2,"w":"荇菜","m":"一种可食用的水草","t":"实词","d":["一种香草","一种竹类植物"]},{"u":2,"w":"流","m":"顺着水流捞取（求取）","t":"实词","d":["流动，流淌","流放"]},{"u":3,"w":"寤寐","m":"醒时和睡时，指日夜","t":"实词","d":["做梦","睡眠不安"]},{"u":4,"w":"服","m":"思念","t":"实词","d":["服从","穿戴"]},{"u":5,"w":"辗转反侧","m":"翻来覆去不能入睡","t":"实词","d":["四处奔走","反复思考"]},{"u":8,"w":"芼","m":"挑选，择取","t":"实词","d":["拔除","煮熟"]}],"tricky":["雎","窈窕","寤寐","荇","辗转反侧","芼"],"keyLines":[{"u":1,"hint":"《关雎》中，写君子认为那位美好的女子是理想配偶的句子是："},{"u":5,"hint":"《关雎》中，描写男子因思念而夜不能寐的句子是："},{"u":0,"hint":"《关雎》以水鸟和鸣起兴，开篇两句是："},{"u":7,"hint":"《关雎》中，表现男子设想用音乐亲近心上人的句子是："}],"appr":[{"q":"诗的开头“关关雎鸠，在河之洲”运用了什么手法？有什么作用？","a":"运用“兴”的手法，先写雎鸠相对和鸣，由此引出对淑女的追求。既交代了河边的环境，又以鸟的成双成对暗示爱情主题，起到渲染气氛、引出下文的作用。"},{"q":"全诗在表现手法与语言上有什么特点？","a":"重章叠唱，各章只换几个字，如“流”“采”“芼”，层层推进；又多用双声叠韵词如“窈窕”“参差”“辗转”，读来音韵回环，增强了抒情的节奏感与感染力。"},{"q":"诗中男子的情感经历了怎样的变化？","a":"先是见到淑女而倾慕，继而求之不得，日夜思念、辗转难眠，最后想象以琴瑟、钟鼓亲近并取悦她，由苦恋转为对美满结合的美好憧憬。"}]},{"id":"g8b-p02","volume":"g8b","title":"蒹葭","author":"佚名","dynasty":"先秦","genre":"诗经（国风·秦风）","kind":"poem","intro":"《蒹葭》出自《诗经·秦风》，是一首流传于秦地的民歌，描写深秋水边追寻心中所慕之人而不得的情景。","theme":"借秋水芦苇的清冷意境，抒写对意中人可望而不可即的追寻与怅惘。","tags":["怀人","写景","民歌"],"units":[{"t":"蒹葭苍苍，白露为霜。","tr":"芦苇青青一片，白露凝结成霜。","p":0,"r":1},{"t":"所谓伊人，在水一方。","tr":"我所思念的那个人，就在河水的那一边。","p":0,"r":1},{"t":"溯洄从之，道阻且长。","tr":"逆流而上去追寻她，道路艰险又漫长。","p":0,"r":1},{"t":"溯游从之，宛在水中央。","tr":"顺流而下去追寻她，她仿佛就在水的中央。","p":0,"r":1},{"t":"蒹葭萋萋，白露未晞。","tr":"芦苇茂盛繁密，白露还没有晒干。","p":1,"r":1},{"t":"所谓伊人，在水之湄。","tr":"我所思念的那个人，在河水的岸边。","p":1,"r":1},{"t":"溯洄从之，道阻且跻。","tr":"逆流而上去追寻她，道路艰险而且陡升。","p":1,"r":1},{"t":"溯游从之，宛在水中坻。","tr":"顺流而下去追寻她，她仿佛就在水中的高地上。","p":1,"r":1},{"t":"蒹葭采采，白露未已。","tr":"芦苇鲜明繁盛，白露还没有完全消失。","p":2,"r":1},{"t":"所谓伊人，在水之涘。","tr":"我所思念的那个人，在河水的岸边。","p":2,"r":1},{"t":"溯洄从之，道阻且右。","tr":"逆流而上去追寻她，道路艰险而且迂曲。","p":2,"r":1},{"t":"溯游从之，宛在水中沚。","tr":"顺流而下去追寻她，她仿佛就在水中的小洲上。","p":2,"r":1}],"notes":[{"u":0,"w":"蒹葭","m":"芦苇","t":"实词","d":["蒹是菱角，葭是荷叶","一种水鸟"]},{"u":0,"w":"苍苍","m":"茂盛的样子，青色","t":"实词","d":["苍老的样子","寒冷的样子"]},{"u":1,"w":"伊人","m":"那个人，指所思慕的人","t":"实词","d":["美丽的女子","隐居的人"]},{"u":1,"w":"一方","m":"那一边，另一侧","t":"实词","d":["一个地方","一个方向的远处"]},{"u":2,"w":"溯洄","m":"逆流而上","t":"实词","d":["顺流而下","回旋游动"]},{"u":2,"w":"阻","m":"艰险，难走","t":"实词","d":["阻拦，拦住","阻隔"]},{"u":3,"w":"宛","m":"仿佛，好像","t":"实词","d":["弯曲","宛转"]},{"u":4,"w":"晞","m":"干，晒干","t":"实词","d":["稀少","天亮"]},{"u":5,"w":"湄","m":"水草交接之处，岸边","t":"实词","d":["水中的沙洲","水流湍急处"]},{"u":7,"w":"坻","m":"水中的小块高地","t":"实词","d":["堤坝","池塘"]}],"tricky":["蒹葭","溯洄","晞","湄","跻","涘","沚"],"keyLines":[{"u":0,"hint":"《蒹葭》中描写深秋清晨河边景物、渲染凄清氛围的开篇两句是："},{"u":1,"hint":"《蒹葭》中点明诗人所追寻之人所在方位的句子是："},{"u":2,"hint":"《蒹葭》中写逆流而上追寻伊人，道路艰险漫长的句子是："},{"u":3,"hint":"《蒹葭》中写顺流而下追寻，伊人仿佛在水中央的句子是："}],"appr":[{"q":"诗歌开头“蒹葭苍苍，白露为霜”有什么作用？","a":"写出深秋清晨河岸苍茫清冷的景象，既交代时间、环境，又烘托出追寻者的惆怅与伤感，营造出朦胧飘渺的意境，为全诗定下情感基调，属于以景起兴。"},{"q":"“伊人”形象有什么特点？这样写有什么好处？","a":"伊人始终在“水一方”“水中央”，可望而不可即，若隐若现。这种朦胧写法使其成为一种美好而难以企及的象征，增添了诗歌的含蓄与想象空间。"},{"q":"这首诗在结构和语言上有什么特色？","a":"全诗三章，重章叠唱，只更换少数字词，如“苍苍”“萋萋”“采采”，形成回环往复的韵律，又在反复中推进追寻的情感，节奏舒缓，情味悠长。"}]},{"id":"g8b-p03","volume":"g8b","title":"式微","author":"佚名","dynasty":"先秦","genre":"诗经（国风·邶风）","kind":"poem","intro":"《式微》出自《诗经·邶风》，一般认为是服劳役者在日暮时分发出的怨叹，也有说法是劝人归家之词。","theme":"以日暮催归起兴，表达劳役者对繁重劳役的怨愤和对归家的渴望。","tags":["怨愤","劳役","民歌"],"units":[{"t":"式微，式微，胡不归？","tr":"天黑了啊天黑了，为什么还不回家？","p":0,"r":1},{"t":"微君之故，胡为乎中露？","tr":"若不是为了君主的缘故，何必在露水中劳苦？","p":0,"r":1},{"t":"式微，式微，胡不归？","tr":"天黑了啊天黑了，为什么还不回家？","p":1,"r":1},{"t":"微君之躬，胡为乎泥中？","tr":"若不是为了君主的身体，何必在泥浆中辛苦？","p":1,"r":1}],"notes":[{"u":0,"w":"式微","m":"天黑了；式为语助词，微指昏暗","t":"实词","d":["国势衰微","细小微弱"]},{"u":0,"w":"胡","m":"为什么","t":"实词","d":["胡人","随意胡乱"]},{"u":1,"w":"微","m":"如果不是，若非","t":"实词","d":["微小","细微"]},{"u":1,"w":"中露","m":"即“露中”，在露水中","t":"特殊句式","d":[]},{"u":1,"w":"故","m":"缘故，事由","t":"实词","d":["旧的，陈旧","故意"]},{"u":3,"w":"躬","m":"身体，自身","t":"实词","d":["弯腰鞠躬","亲自去做"]}],"tricky":["式微","胡","躬","泥"],"keyLines":[{"u":0,"hint":"《式微》中，以反复追问的方式表达天黑了仍不能归家的怨愤的句子是："},{"u":1,"hint":"《式微》中，表明自己在露水中劳作是为了君主的句子是："},{"u":3,"hint":"《式微》中，表明自己在泥水里辛苦是为君主身体而不得不做的句子是："}],"appr":[{"q":"诗中“式微，式微，胡不归”重复出现，有什么作用？","a":"叠句反复，用设问的口吻一再发问，将日暮不得归家的焦急与怨愤层层推进，使感情更强烈，又形成回环急促的节奏，强化了诗歌的感染力。"},{"q":"“胡为乎中露”“胡为乎泥中”表现了怎样的情感？","a":"两句以反问表达，既写出劳役者在露水泥泞中劳作的艰辛，又含蓄地流露出对统治者的不满，言辞婉转而怨意深沉。"}]},{"id":"g8b-p04","volume":"g8b","title":"子衿","author":"佚名","dynasty":"先秦","genre":"诗经（国风·郑风）","kind":"poem","intro":"《子衿》出自《诗经·郑风》，写一位女子在城楼上等候心上人而久久不见的思念与嗔怪。","theme":"通过女子等候情人的心理描写，表现热恋中人度日如年的思念之情。","tags":["爱情","思念","民歌"],"units":[{"t":"青青子衿，悠悠我心。","tr":"青青的是你的衣领，悠长的是我的思念。","p":0,"r":1},{"t":"纵我不往，子宁不嗣音？","tr":"纵然我没有去找你，你难道就不寄来音信？","p":0,"r":1},{"t":"青青子佩，悠悠我思。","tr":"青青的是你的佩带，悠长的是我的情思。","p":1,"r":1},{"t":"纵我不往，子宁不来？","tr":"纵然我没有去找你，你难道就不能来见我？","p":1,"r":1},{"t":"挑兮达兮，在城阙兮。","tr":"来来回回地张望徘徊，在这城楼之上。","p":2,"r":1},{"t":"一日不见，如三月兮！","tr":"一天没有见到你，就好像隔了三个月啊！","p":2,"r":1}],"notes":[{"u":0,"w":"子衿","m":"你的衣领；子指对方，衿是衣领","t":"实词","d":["你的衣襟","你的衣袖"]},{"u":0,"w":"悠悠","m":"绵长不尽的样子","t":"实词","d":["悠闲自在的样子","遥远的样子"]},{"u":1,"w":"宁","m":"难道，岂","t":"虚词","d":[]},{"u":1,"w":"嗣音","m":"寄来音信，传音讯","t":"实词","d":["继承声名","回复歌声"]},{"u":2,"w":"佩","m":"系在衣带上的玉饰","t":"实词","d":["佩服，敬佩","佩剑"]},{"u":4,"w":"挑兮达兮","m":"独自来回走动张望的样子","t":"实词","d":["挑选通达","轻佻放纵的样子"]},{"u":4,"w":"城阙","m":"城门两边的高台楼观","t":"实词","d":["城墙的缺口","宫殿"]}],"tricky":["衿","嗣","佩","挑","阙"],"keyLines":[{"u":5,"hint":"《子衿》中，以夸张的语气写出女子思念之深、度日如年的句子是："},{"u":1,"hint":"《子衿》中，女子嗔怪对方为何不寄来音信的句子是："},{"u":4,"hint":"《子衿》中，描写女子在城楼上来回张望等待的句子是："},{"u":0,"hint":"《子衿》开头借对方衣着起笔，抒发自己思念之情的两句是："}],"appr":[{"q":"“一日不见，如三月兮”运用了什么手法？表达了什么感情？","a":"运用夸张的手法，把一天的分别说成像三个月那样漫长，生动写出女子等不到恋人时焦灼难耐的心情，表现了思念之深、感情之炽热。"},{"q":"诗中女子形象有什么特点？","a":"她既思念情人，又带着嗔怪与埋怨，质问“子宁不来”，大胆直率；在城楼上来回徘徊，细腻地表现出内心的焦急，形象真实而生动。"}]},{"id":"g8b-p05","volume":"g8b","title":"送杜少府之任蜀州","author":"王勃","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"王勃在长安送友人杜少府赴蜀州任职，写下此诗。诗一改送别诗悲伤缠绵的格调，意境开阔，情调乐观。","theme":"劝慰友人不必在离别时悲伤，表达真挚深厚、不受空间阻隔的友情。","tags":["送别","友情","励志"],"units":[{"t":"城阙辅三秦，风烟望五津。","tr":"三秦之地护卫着长安城，你要去的蜀地在风烟迷茫中遥遥可望。","p":0,"r":1},{"t":"与君离别意，同是宦游人。","tr":"与你分别时的心情，我们都是远离家乡出外做官的人。","p":0,"r":1},{"t":"海内存知己，天涯若比邻。","tr":"四海之内只要有知心朋友，即使远在天边也像邻居一样近。","p":0,"r":1},{"t":"无为在歧路，儿女共沾巾。","tr":"不要在分手的路口，像小儿女那样悲伤流泪沾湿衣巾。","p":0,"r":1}],"notes":[{"u":0,"w":"城阙","m":"指都城长安","t":"实词","d":["城门的楼观","城墙缺口"]},{"u":0,"w":"辅","m":"护卫，拱卫","t":"实词","d":["辅助，帮助","辅导"]},{"u":0,"w":"三秦","m":"指长安周围的关中地区","t":"实词","d":["秦朝的三位皇帝","秦地的三座城池"]},{"u":0,"w":"五津","m":"指岷江上的五个渡口，泛指蜀川","t":"实词","d":["五个码头集市","五条河流"]},{"u":1,"w":"宦游","m":"外出做官","t":"实词","d":["四处游览","官场交际"]},{"u":2,"w":"比邻","m":"近邻，邻居","t":"古今异义","d":["相互比较","比较接近"]},{"u":3,"w":"无为","m":"不要，不必","t":"古今异义","d":["无所作为","道家的顺应自然"]},{"u":3,"w":"歧路","m":"岔路，分手之处","t":"实词","d":["错误的道路","崎岖山路"]},{"u":3,"w":"沾巾","m":"泪水沾湿衣巾","t":"实词","d":["擦拭汗水","披戴头巾"]}],"tricky":["阙","辅","秦","津","宦","歧"],"keyLines":[{"u":2,"hint":"《送杜少府之任蜀州》中，表现友情不受空间限制、千古传诵的名句是："},{"u":3,"hint":"《送杜少府之任蜀州》中，劝慰友人不要在分别时像小儿女一样悲伤的两句是："},{"u":1,"hint":"《送杜少府之任蜀州》中，说明诗人与友人同为远离家乡做官的人，因而同怀离情的句子是："},{"u":0,"hint":"《送杜少府之任蜀州》中，点明送别地和友人去处的首联是："}],"appr":[{"q":"“海内存知己，天涯若比邻”为何成为名句？","a":"它以豁达的胸怀、开阔的视野，说明真挚的友情可以超越空间距离，一扫离别的伤感，语言质朴而境界高远，给人以安慰和鼓舞，所以流传千古。"},{"q":"这首诗与一般送别诗相比有什么特点？","a":"一般送别诗多写缠绵悲苦，此诗却以乐观积极的语调劝慰友人，尾联不作儿女之态，情调昂扬，格局宏大，体现了诗人开阔的胸襟与唐初诗风的清新刚健。"},{"q":"首联在全诗中有什么作用？","a":"首联写长安的雄壮形势与蜀地的遥远迷茫，点出送别的地点和友人的去向，对仗工整，境界开阔，隐含着送别之情，也为后文的劝慰作了铺垫。"}]},{"id":"g8b-p06","volume":"g8b","title":"望洞庭湖赠张丞相","author":"孟浩然","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"孟浩然未能入仕，路过洞庭湖时，写诗赠给时任宰相的张九龄，借景抒怀，希望得到引荐。","theme":"前写洞庭湖壮阔景象，后借临渊羡鱼委婉表达希望出仕、求人引荐的心愿。","tags":["写景","干谒","抒怀"],"units":[{"t":"八月湖水平，涵虚混太清。","tr":"八月湖水上涨，几乎与岸齐平，水天相接，混为一体。","p":0,"r":1},{"t":"气蒸云梦泽，波撼岳阳城。","tr":"水汽蒸腾笼罩着云梦泽，波涛汹涌似乎摇撼着岳阳城。","p":0,"r":1},{"t":"欲济无舟楫，端居耻圣明。","tr":"想渡湖却没有船和桨，闲居在这清明盛世令我感到惭愧。","p":1,"r":1},{"t":"坐观垂钓者，徒有羡鱼情。","tr":"坐着看那些垂钓的人，只能白白羡慕他们得鱼。","p":1,"r":1}],"notes":[{"u":0,"w":"平","m":"与岸齐平","t":"实词","d":["平静","平坦"]},{"u":0,"w":"涵虚","m":"包含天空的倒影","t":"实词","d":["内心谦虚","空无所有"]},{"u":0,"w":"太清","m":"天空","t":"实词","d":["清澈的湖水","道教仙境"]},{"u":1,"w":"撼","m":"摇动，撼动","t":"实词","d":["感动","拍打"]},{"u":2,"w":"济","m":"渡过","t":"实词","d":["救济，帮助","成功"]},{"u":2,"w":"端居","m":"闲居，无所事事地居住","t":"实词","d":["端正地坐着","居住在正中"]},{"u":2,"w":"舟楫","m":"船和桨，比喻引荐之人","t":"实词","d":["小舟","渡口"]},{"u":3,"w":"徒","m":"只能，徒然","t":"实词","d":["徒弟","步行"]}],"tricky":["涵虚","撼","楫","垂钓","羡"],"keyLines":[{"u":1,"hint":"《望洞庭湖赠张丞相》中，描写洞庭湖水汽蒸腾、波涛汹涌的气势的句子是："},{"u":3,"hint":"《望洞庭湖赠张丞相》中，诗人以临渊羡鱼委婉表达希望出仕的句子是："},{"u":0,"hint":"《望洞庭湖赠张丞相》中，描写八月湖水涨满、水天相接的句子是："},{"u":2,"hint":"《望洞庭湖赠张丞相》中，诗人表示想出仕却没有门路，闲居感到羞愧的句子是："}],"appr":[{"q":"“气蒸云梦泽，波撼岳阳城”好在哪里？","a":"“蒸”“撼”两个动词用得有力，写出洞庭湖水汽蒸腾、波涛撼城的磅礴气势，把湖的广阔和动态都写活了，也暗含诗人不甘寂寞的政治抱负。"},{"q":"后四句如何表达诗人的心愿？","a":"诗人以“欲济无舟楫”比喻想出仕而无人引荐，以“垂钓者”暗指在位者，“羡鱼情”表达渴望被任用的心意，用比喻委婉含蓄，不失身份又见真情。"}]},{"id":"g8b-p07","volume":"g8b","title":"石壕吏","author":"杜甫","dynasty":"唐","genre":"新题乐府（五言古诗）","kind":"poem","intro":"乾元二年，杜甫由洛阳返华州途中，夜宿石壕村，亲眼看见官吏深夜抓丁，据此写成“三吏”之一，是现实主义的叙事名篇。","theme":"通过官吏夜捉人、老妇应役的经过，揭露战乱中兵役的残酷，表达对百姓苦难的深切同情。","tags":["叙事","忧民","现实主义"],"units":[{"t":"暮投石壕村，有吏夜捉人。","tr":"傍晚投宿在石壕村，有差役趁夜来抓人。","p":0,"r":1},{"t":"老翁逾墙走，老妇出门看。","tr":"老翁翻过墙头逃走了，老妇人出门应付查看。","p":0,"r":1},{"t":"吏呼一何怒！妇啼一何苦！","tr":"差役的呼喝多么凶狠啊！老妇的哭啼多么悲苦啊！","p":0,"r":1},{"t":"听妇前致词：三男邺城戍。","tr":"我听见老妇走上前去说话：三个儿子都到邺城去守卫了。","p":0,"r":1},{"t":"一男附书至，二男新战死。","tr":"其中一个儿子捎信回来，说另外两个儿子刚刚战死。","p":0,"r":1},{"t":"存者且偷生，死者长已矣！","tr":"活着的人暂且苟活一天，死去的人就永远完了！","p":0,"r":1},{"t":"室中更无人，惟有乳下孙。","tr":"家里再没有别的男人了，只有一个还在吃奶的孙子。","p":0,"r":1},{"t":"有孙母未去，出入无完裙。","tr":"因为有孙子，他的母亲还没有离开，可进出连一条完整的裙子都没有。","p":0,"r":1},{"t":"老妪力虽衰，请从吏夜归。","tr":"老妇我虽然气力衰弱，请让我跟您连夜回营去。","p":0,"r":1},{"t":"急应河阳役，犹得备晨炊。","tr":"赶快去应付河阳的差事，还来得及为军队准备早饭。","p":0,"r":1},{"t":"夜久语声绝，如闻泣幽咽。","tr":"夜深了，说话声消失了，隐约听到低微断续的哭泣声。","p":0,"r":1},{"t":"天明登前途，独与老翁别。","tr":"天亮后我继续赶路，只能同那位老翁告别。","p":0,"r":1}],"notes":[{"u":0,"w":"投","m":"投宿","t":"实词","d":["投奔","投掷"]},{"u":0,"w":"捉","m":"抓（壮丁）","t":"实词","d":["捕捉野兽","握住"]},{"u":1,"w":"逾","m":"越过，翻过","t":"实词","d":["超过","更加"]},{"u":1,"w":"走","m":"跑，逃跑","t":"古今异义","d":["步行","离开"]},{"u":2,"w":"一何","m":"多么","t":"实词","d":["一个什么","为什么"]},{"u":3,"w":"致词","m":"说话","t":"实词","d":["致辞答谢","写文章"]},{"u":3,"w":"戍","m":"防守，守边","t":"实词","d":["征收","运送"]},{"u":4,"w":"附书","m":"捎信","t":"实词","d":["附上书籍","依附文书"]},{"u":5,"w":"偷生","m":"苟且活着","t":"古今异义","d":["偷偷出生","逃命"]},{"u":6,"w":"乳下孙","m":"还在吃奶的孙子","t":"实词","d":["乳母的孙子","出生不久的外孙"]},{"u":8,"w":"老妪","m":"老妇人（自称）","t":"实词","d":["老翁的妻子","邻家老妇"]},{"u":9,"w":"河阳役","m":"河阳（今河南孟州）的兵役","t":"实词","d":["河阳的劳役工钱","河阳的官差"]}],"tricky":["壕","逾","戍","妪","咽"],"keyLines":[{"u":2,"hint":"《石壕吏》中，用对比和感叹写出官吏凶狠、老妇悲苦的两句是："},{"u":5,"hint":"老妇诉说两个儿子战死后，表达“活者苟且、死者永别”悲痛的两句是："},{"u":7,"hint":"《石壕吏》中，写出家中贫困到极点、儿媳连一条完整裙子都没有的句子是："},{"u":11,"hint":"诗的结尾，写诗人天亮后只能与老翁告别的两句是："}],"appr":[{"q":"这首诗有什么叙事特点？","a":"全诗只记叙而不直接议论，以“吏呼”“妇啼”的对比开头，老妇的陈述层层递进，最后“夜久语声绝”以不写之写收束，把对统治者的批判和对百姓的同情寓于故事之中。"},{"q":"“吏呼一何怒！妇啼一何苦！”有什么表达效果？","a":"用一“怒”一“苦”对举，两句都以“一何”感叹，凶暴蛮横的差役与哀苦无告的老妇形成强烈反差，概括全篇矛盾，也流露出诗人的爱憎。"},{"q":"诗中为什么说“独与老翁别”？","a":"老妇已被抓走，诗人天明离去时只能同逃回来的老翁话别，一个“独”字写出老翁孤身一人的凄凉，含蓄地表现战争给百姓带来的家破人散之苦。"}]},{"id":"g8b-p08","volume":"g8b","title":"茅屋为秋风所破歌","author":"杜甫","dynasty":"唐","genre":"七言歌行（古体诗）","kind":"poem","intro":"上元二年八月，杜甫在成都浣花溪畔的草堂被狂风掀去屋顶茅草，又逢连夜大雨，诗人由自身遭遇联想到天下寒士，写下此诗。","theme":"叙述茅屋被秋风所破的遭遇，由己及人，抒发忧国忧民、渴望天下寒士俱欢颜的博大胸怀。","tags":["叙事","抒情","忧民"],"units":[{"t":"八月秋高风怒号，卷我屋上三重茅。","tr":"八月秋深，狂风怒吼，卷走了我屋顶上好几层茅草。","p":0,"r":1},{"t":"茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。","tr":"茅草乱飞，越过浣花溪，散落在江对岸；飞得高的缠挂在高高的树梢上，飞得低的飘飘悠悠落进低洼的水塘。","p":0,"r":1},{"t":"南村群童欺我老无力，忍能对面为盗贼。","tr":"南村的一群孩子欺负我年老没有力气，竟忍心当着我的面做起“贼”来。","p":1,"r":1},{"t":"公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。","tr":"他们公然抱着茅草跑进竹林里，我喊得嘴唇发焦、口舌发干也喊不住，只得拄着拐杖回来独自叹息。","p":1,"r":1},{"t":"俄顷风定云墨色，秋天漠漠向昏黑。","tr":"一会儿风停了，天上乌云黑如墨，深秋的天空阴沉迷蒙，渐渐暗了下来。","p":2,"r":1},{"t":"布衾多年冷似铁，娇儿恶卧踏里裂。","tr":"盖了多年的布被又冷又硬像铁板，孩子睡相不好，把被里子都蹬破了。","p":2,"r":1},{"t":"床头屋漏无干处，雨脚如麻未断绝。","tr":"屋顶漏雨，床头没有一块干的地方，密密的雨点像麻线一样不断落下。","p":2,"r":1},{"t":"自经丧乱少睡眠，长夜沾湿何由彻！","tr":"自从安史之乱以来我很少睡个安稳觉，漫长的雨夜浑身湿透，怎么才能熬到天亮！","p":2,"r":1},{"t":"安得广厦千万间，大庇天下寒士俱欢颜！","tr":"怎样才能得到千万间高大宽敞的房子，庇护天下贫寒的读书人，让他们都笑逐颜开！","p":3,"r":1},{"t":"风雨不动安如山。","tr":"那房子在风雨中也不为所动，稳稳当当如同山岳。","p":3,"r":1},{"t":"呜呼！","tr":"唉！","p":3,"r":1},{"t":"何时眼前突兀见此屋，吾庐独破受冻死亦足！","tr":"什么时候眼前能突然出现这样高耸的房屋，即使只有我的茅屋被吹破、我一人受冻而死，也心满意足！","p":3,"r":1}],"notes":[{"u":0,"w":"怒号","m":"大声吼叫","t":"实词","d":["愤怒地呼喊","发出号令"]},{"u":0,"w":"三重茅","m":"几层茅草（“三”表多）","t":"实词","d":["三种茅草","第三层茅草"]},{"u":1,"w":"罥","m":"缠绕，挂","t":"实词","d":["遮蔽","折断"]},{"u":1,"w":"塘坳","m":"低洼积水的地方","t":"实词","d":["池塘边的土坡","山间的凹地"]},{"u":2,"w":"忍能","m":"怎么忍心，竟忍心","t":"实词","d":["能够忍耐","忍着不能"]},{"u":3,"w":"唇焦口燥","m":"嘴唇发焦、口舌干燥（形容喊得很久）","t":"实词","d":["因生病而口渴","天气太干燥"]},{"u":4,"w":"漠漠","m":"阴沉迷蒙的样子","t":"实词","d":["寂静无声的样子","广阔空旷的样子"]},{"u":5,"w":"恶卧","m":"睡相不好","t":"实词","d":["厌恶躺着","凶恶地躺卧"]},{"u":6,"w":"雨脚如麻","m":"密集不断的雨点像麻线","t":"实词","d":["雨势急促","雨点落在脚边"]},{"u":7,"w":"丧乱","m":"指安史之乱","t":"实词","d":["丧失家人","丧事和混乱"]},{"u":7,"w":"何由彻","m":"怎么才能熬到天亮","t":"特殊句式","d":[]},{"u":8,"w":"庇","m":"遮蔽，庇护","t":"实词","d":["保佑","遮挡"]},{"u":11,"w":"突兀","m":"高耸的样子","t":"实词","d":["突然出现","不平稳"]}],"tricky":["罥","坳","衾","彻","庇","兀"],"keyLines":[{"u":8,"hint":"杜甫在《茅屋为秋风所破歌》中，表达希望天下寒士都能有安身之所的两句是："},{"u":11,"hint":"诗人表示只要天下寒士有屋可住，自己愿意独自受冻而死也心甘的两句是："},{"u":6,"hint":"写茅屋漏雨、床头无处躲避、雨点密集不断的两句是："},{"u":5,"hint":"诗中以“铁”作比，写布被年久冰冷坚硬的句子是："}],"appr":[{"q":"全诗的感情是怎样变化的？","a":"先叙风卷茅、群童抢茅，写出愁苦无奈；再写夜雨漏屋、长夜难熬，愁苦加深；最后由己及人，生出“安得广厦千万间”的宏愿，由个人之悲升华为忧国忧民的博大情怀。"},{"q":"“安得广厦千万间，大庇天下寒士俱欢颜”有何意义？","a":"诗人身处困境，想到的却是天下寒士，宁愿自己受冻也要让众人有屋可居，体现了推己及人、关心民生的崇高精神，是全诗的点睛之笔。"},{"q":"诗中用了哪些写法？","a":"叙事、描写、抒情相结合；“冷似铁”“雨脚如麻”用比喻，形象写出贫苦；结尾运用想象和反问，使情感由实入虚，境界升华。"}]},{"id":"g8b-p09","volume":"g8b","title":"卖炭翁","author":"白居易","dynasty":"唐","genre":"新乐府诗（七言）","kind":"poem","intro":"这是白居易《新乐府》五十首中的一首，原题下有注“苦宫市也”，针对中唐宫廷派宦官到市场低价强买货物的“宫市”弊政而作。","theme":"通过卖炭老人被宫使强夺一车炭的遭遇，揭露“宫市”的掠夺本质，同情劳动人民。","tags":["叙事","讽喻","同情民生"],"units":[{"t":"卖炭翁，伐薪烧炭南山中。","tr":"有位卖炭的老翁，在终南山里砍柴烧炭。","p":0,"r":1},{"t":"满面尘灰烟火色，两鬓苍苍十指黑。","tr":"他满脸尘土灰烬，显出烟熏火燎的颜色，两鬓花白，十个手指都被熏得乌黑。","p":0,"r":1},{"t":"卖炭得钱何所营？身上衣裳口中食。","tr":"卖炭得来的钱做什么用呢？买身上穿的衣裳和口中吃的食物。","p":0,"r":1},{"t":"可怜身上衣正单，心忧炭贱愿天寒。","tr":"可怜他身上衣服正单薄，却担心炭价低贱，盼望天气更冷。","p":0,"r":1},{"t":"夜来城外一尺雪，晓驾炭车辗冰辙。","tr":"夜里城外下了一尺厚的雪，清晨他驾着炭车碾着冰冻的车辙赶路。","p":0,"r":1},{"t":"牛困人饥日已高，市南门外泥中歇。","tr":"牛累了，人饿了，太阳已升得很高，他们在集市南门外的泥地里歇息。","p":0,"r":1},{"t":"翩翩两骑来是谁？黄衣使者白衫儿。","tr":"轻快地跑来两个骑马的人是谁？是穿黄衣的宫中使者和穿白衫的随从。","p":0,"r":1},{"t":"手把文书口称敕，回车叱牛牵向北。","tr":"他们手拿文书，嘴里说是皇帝的命令，吆喝着牛，把车拉转向北朝宫中去。","p":0,"r":1},{"t":"一车炭，千余斤，宫使驱将惜不得。","tr":"一车炭，有一千多斤，宫使硬要赶走，老翁虽然舍不得也没有办法。","p":0,"r":1},{"t":"半匹红纱一丈绫，系向牛头充炭直。","tr":"他们把半匹红纱和一丈绫挂在牛头上，就算是抵付炭的价钱。","p":0,"r":1}],"notes":[{"u":0,"w":"薪","m":"柴火","t":"实词","d":["薪水","木材"]},{"u":1,"w":"苍苍","m":"（头发）灰白","t":"实词","d":["青黑色","茂盛的样子"]},{"u":2,"w":"何所营","m":"做什么用，用来谋求什么","t":"特殊句式","d":[]},{"u":2,"w":"营","m":"谋求，经营（生计）","t":"实词","d":["营垒","建造"]},{"u":3,"w":"可怜","m":"值得怜悯","t":"古今异义","d":["可爱","令人羡慕"]},{"u":3,"w":"炭贱愿天寒","m":"担心炭价低而希望天更冷","t":"特殊句式","d":[]},{"u":4,"w":"晓","m":"清晨","t":"实词","d":["知道","明白"]},{"u":4,"w":"辗","m":"（车轮）碾压","t":"实词","d":["转动","翻转"]},{"u":6,"w":"翩翩","m":"轻快的样子","t":"实词","d":["飘动的样子","文雅的样子"]},{"u":7,"w":"敕","m":"皇帝的命令","t":"实词","d":["官府的告示","任命官员的文书"]},{"u":8,"w":"将","m":"助词，用在动词后（驱将：赶着）","t":"虚词","d":[]},{"u":9,"w":"直","m":"同“值”，价值，价钱","t":"通假","d":["径直","正直"]}],"tricky":["薪","鬓","辗","辙","敕","绫"],"keyLines":[{"u":3,"hint":"诗中写卖炭翁衣着单薄却盼望天气更冷，表现其矛盾心理的句子是："},{"u":1,"hint":"描写卖炭翁外貌、突出其长年烧炭劳苦的两句是："},{"u":9,"hint":"诗的结尾，写宫使以少量红纱和绫抵作炭价的两句是："},{"u":6,"hint":"写宫中使者骑马突然出现的两句是："}],"appr":[{"q":"“心忧炭贱愿天寒”表现了卖炭翁怎样的心理？","a":"老翁衣单，本应盼暖，却因怕炭卖不出好价钱而希望天更冷，这种矛盾的心理细腻地写出了他生活的窘迫，也为后面被掠夺的悲剧增添了力度。"},{"q":"诗的结尾为什么不作评论？","a":"全诗用白描叙事，结尾只写“半匹红纱一丈绫”抵炭价，不再发表议论，却使人感到掠夺的蛮横和老翁的无助，含蓄而有力地批判了宫市弊政。"},{"q":"这首诗在写法上有什么特点？","a":"选取典型事件，细节生动，如“手把文书口称敕”刻画宫使嘴脸；通过人物外貌、心理、动作描写，使人物形象鲜明；对比强烈，寓讽刺于叙事之中。"}]},{"id":"g8b-p10","volume":"g8b","title":"题破山寺后禅院","author":"常建","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"常建是盛唐山水田园诗人，此诗写清晨游览破山寺（在今江苏常熟虞山）后院禅房所见所感，是他的代表作。","theme":"描绘古寺清晨的幽静景致，抒发超脱尘俗、寄情山水与佛理的心境。","tags":["写景","山水","抒怀"],"units":[{"t":"清晨入古寺，初日照高林。","tr":"清晨走进古老的寺院，朝阳刚刚照亮高处的树林。","p":0,"r":1},{"t":"曲径通幽处，禅房花木深。","tr":"弯曲的小路通向幽静的深处，僧人的禅房掩映在繁茂的花木之中。","p":0,"r":1},{"t":"山光悦鸟性，潭影空人心。","tr":"山间明媚的景色使鸟儿欢悦，清澈的潭水倒影使人心中的杂念消除。","p":0,"r":1},{"t":"万籁此都寂，但余钟磬音。","tr":"此时周围各种声音都归于寂静，只剩下钟磬的余音在回荡。","p":0,"r":1}],"notes":[{"u":0,"w":"初日","m":"刚升起的太阳","t":"实词","d":["第一天","夕阳"]},{"u":1,"w":"曲径","m":"弯曲的小路","t":"实词","d":["捷径","直通的路"]},{"u":1,"w":"禅房","m":"僧人住的房屋","t":"实词","d":["讲经的大殿","寺院的藏经阁"]},{"u":2,"w":"悦","m":"使……欢悦","t":"词类活用","d":[]},{"u":2,"w":"空","m":"使……空明，净化","t":"词类活用","d":[]},{"u":3,"w":"万籁","m":"各种声响","t":"实词","d":["万般乐曲","众多箫管"]},{"u":3,"w":"但","m":"只，仅","t":"古今异义","d":["但是","不过"]},{"u":3,"w":"余","m":"留下，剩下","t":"实词","d":["我","多余"]}],"tricky":["径","幽","禅","潭","籁","磬"],"keyLines":[{"u":1,"hint":"描写通向寺院深处的小径曲折幽静、禅房被花木掩映的两句是："},{"u":2,"hint":"诗人以拟人手法写山光使鸟欢悦、潭水使人心空明的两句是："},{"u":3,"hint":"以钟磬声反衬寺院万籁俱寂的两句是："}],"appr":[{"q":"“山光悦鸟性，潭影空人心”中“悦”“空”二字好在哪里？","a":"“悦”字赋予鸟儿人的情感，写出山光明媚的生机；“空”字写潭影澄澈使人心中杂念尽消，两字都是使动用法，物与我交融，意境空灵。"},{"q":"尾联“万籁此都寂，但余钟磬音”运用了什么手法？","a":"运用以动衬静的手法：万籁俱寂中钟磬声悠悠回荡，反而更显出山寺的幽深静谧，也暗示诗人超脱尘世的心境。"}]},{"id":"g8b-p11","volume":"g8b","title":"送友人","author":"李白","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"这是李白送别友人时所作的一首五言律诗，诗人在城郊为友人饯行，借山水景物与自然意象，写出送别的深情。","theme":"以明丽的山水之景与飘零的浮云、落日作比，抒发依依惜别的真挚友情。","tags":["送别","友情","写景"],"units":[{"t":"青山横北郭，白水绕东城。","tr":"青翠的山峦横卧在城的北面，明亮的流水环绕着城的东边。","p":0,"r":1},{"t":"此地一为别，孤蓬万里征。","tr":"在此地一旦分别，你就像孤零零的蓬草，随风飘向万里之外远行。","p":0,"r":1},{"t":"浮云游子意，落日故人情。","tr":"飘浮的白云像游子漂泊不定的心意，缓缓落下的夕阳如老友依依不舍的情谊。","p":0,"r":1},{"t":"挥手自兹去，萧萧班马鸣。","tr":"挥手告别，从此远去，那载人离去的马也萧萧长鸣，似不忍分离。","p":0,"r":1}],"notes":[{"u":0,"w":"郭","m":"外城","t":"实词","d":["城门","村庄"]},{"u":1,"w":"一为别","m":"一旦分别","t":"实词","d":["一次别离","为了离别"]},{"u":1,"w":"孤蓬","m":"孤零零的蓬草，喻漂泊的友人","t":"实词","d":["孤独的小船","孤立的草屋"]},{"u":1,"w":"征","m":"远行","t":"实词","d":["征战","征召"]},{"u":2,"w":"游子","m":"离家远游的人","t":"实词","d":["流浪的孩子","游览的人"]},{"u":2,"w":"故人","m":"老朋友（指诗人自己）","t":"古今异义","d":["死去的人","旧时的家人"]},{"u":3,"w":"自兹","m":"从此","t":"实词","d":["自己","这里"]},{"u":3,"w":"班马","m":"离群的马","t":"实词","d":["斑纹马","拉车的马"]}],"tricky":["郭","蓬","征","兹","萧","班"],"keyLines":[{"u":0,"hint":"诗中以青山、白水描绘送别环境，一横一绕的两句是："},{"u":2,"hint":"以浮云比友人漂泊、以落日比自己惜别之情的两句是："},{"u":3,"hint":"以马鸣衬托离别气氛、表达依依惜别的两句是："}],"appr":[{"q":"颔联“浮云游子意，落日故人情”有何妙处？","a":"以浮云喻游子飘泊不定，以落日喻故人依恋不舍，比喻新颖，对仗工整，借景写情，使抽象的离情变得可感，含蓄而深厚。"},{"q":"尾联“萧萧班马鸣”表达了什么情感？","a":"借马的嘶鸣写离别：连马也仿佛通人情，不忍离群，以动衬情，使诗人与友人依依惜别的心情更为深切。"}]},{"id":"g8b-p12","volume":"g8b","title":"卜算子·黄州定慧院寓居作","author":"苏轼","dynasty":"北宋","genre":"词","kind":"poem","intro":"元丰年间，苏轼因“乌台诗案”被贬黄州，寓居定慧院，在孤寂的月夜写下此词，借孤鸿抒写贬谪中的幽独心境。","theme":"借月夜孤鸿的形象，写出作者被贬后孤高自许、不肯随俗的幽独情怀。","tags":["咏物","抒怀","贬谪"],"units":[{"t":"缺月挂疏桐，漏断人初静。","tr":"残月挂在稀疏的梧桐枝头，夜深时水漏已尽，人声刚刚静下来。","p":0,"r":1},{"t":"谁见幽人独往来，缥缈孤鸿影。","tr":"谁看见幽居的人独自往来徘徊？仿佛那隐隐约约的孤雁身影。","p":0,"r":1},{"t":"惊起却回头，有恨无人省。","tr":"孤鸿忽然受惊飞起，又回头张望，心中的幽恨却没有人能理解。","p":1,"r":1},{"t":"拣尽寒枝不肯栖，寂寞沙洲冷。","tr":"它挑遍了寒冷的树枝也不肯栖息，宁愿落在寂寞冰冷的沙洲上。","p":1,"r":1}],"notes":[{"u":0,"w":"缺月","m":"残月","t":"实词","d":["圆月","新月初升"]},{"u":0,"w":"漏断","m":"指夜深，漏壶中的水滴尽","t":"实词","d":["屋顶漏雨停止","钟声中断"]},{"u":1,"w":"幽人","m":"幽居的人，常指隐士或失意者","t":"实词","d":["幽灵","沉默的人"]},{"u":1,"w":"缥缈","m":"隐隐约约、若有若无的样子","t":"实词","d":["轻盈飘动的样子","高远空旷的样子"]},{"u":2,"w":"省","m":"理解，明白","t":"实词","d":["节省","探望"]},{"u":3,"w":"拣","m":"挑选","t":"实词","d":["拾取","检查"]},{"u":3,"w":"寒枝","m":"寒冷的树枝","t":"实词","d":["枯萎的枝条","冬天的梅枝"]}],"tricky":["疏","桐","漏","缥缈","拣","洲"],"keyLines":[{"u":0,"hint":"苏轼《卜算子》上阕开头，描写夜深人静、残月挂在稀疏梧桐之上的两句是："},{"u":3,"hint":"词中以孤鸿不肯栖息寒枝、宁守寂寞，象征词人孤高品格的两句是："},{"u":2,"hint":"写孤鸿惊起回头、满怀幽恨却无人理解的两句是："}],"appr":[{"q":"这首词上下阕是怎样写的？","a":"上阕写月夜，由景到人，人与孤鸿叠合；下阕专写孤鸿，惊起回头、拣尽寒枝而不栖，实际是写词人自己，人鸟交融，咏物与抒怀合一。"},{"q":"“拣尽寒枝不肯栖，寂寞沙洲冷”表现了词人怎样的品格？","a":"孤鸿宁可栖于寂寞冰冷的沙洲，也不肯随意栖在寒枝上，象征词人孤高自许、不肯同流合污的品格，也透露出贬谪后的孤独与清高。"}]},{"id":"g8b-p13","volume":"g8b","title":"卜算子·咏梅","author":"陆游","dynasty":"南宋","genre":"词","kind":"poem","intro":"陆游一生力主抗金，屡遭排挤。他借咏梅寄托自己的遭际与志节，这首词写梅花在风雨中孤寂开放、零落成泥而香如故。","theme":"借梅花处境的孤苦与高洁，表达自己不与群芳争宠、坚守节操的品格。","tags":["咏物","言志","高洁"],"units":[{"t":"驿外断桥边，寂寞开无主。","tr":"驿站之外、断桥旁边，梅花孤独地开放，无人过问。","p":0,"r":1},{"t":"已是黄昏独自愁，更著风和雨。","tr":"黄昏时分，她已独自愁苦，偏偏又遭受风吹雨打。","p":0,"r":1},{"t":"无意苦争春，一任群芳妒。","tr":"她无心费尽心思与百花争春，任凭众花嫉妒。","p":1,"r":1},{"t":"零落成泥碾作尘，只有香如故。","tr":"即使花瓣凋落，被碾成尘土，依然保留着一缕清香。","p":1,"r":1}],"notes":[{"u":0,"w":"驿","m":"驿站，古代传递文书者歇脚的地方","t":"实词","d":["渡口","旅店"]},{"u":0,"w":"无主","m":"无人过问、没有人欣赏","t":"实词","d":["没有主人","没有主见"]},{"u":1,"w":"著","m":"同“着”，加上，遭受","t":"通假","d":["显著","写作"]},{"u":2,"w":"苦","m":"竭力，苦苦地","t":"实词","d":["痛苦","辛苦"]},{"u":2,"w":"妒","m":"嫉妒","t":"实词","d":["羡慕","仇恨"]},{"u":3,"w":"零落","m":"凋谢，飘零","t":"实词","d":["稀稀落落","衰败"]},{"u":3,"w":"如故","m":"像原来一样","t":"实词","d":["像从前的朋友","没有变化的故事"]}],"tricky":["驿","寂寞","著","妒","碾"],"keyLines":[{"u":2,"hint":"词中表现梅花不愿与百花争艳、不怕群芳嫉妒的两句是："},{"u":3,"hint":"表现梅花即使凋零成泥、仍然保持清香的两句是："},{"u":1,"hint":"写梅花黄昏孤愁、又遭风雨摧残的两句是："}],"appr":[{"q":"这首词运用了什么手法？","a":"运用托物言志，以梅花自喻：上阕写梅所处环境的孤寂和风雨摧残，实写词人壮志难酬的遭遇；下阕写梅的品格，表达坚守节操的志向。"},{"q":"“零落成泥碾作尘，只有香如故”有什么含义？","a":"写梅花即使被摧残成泥尘，清香依旧，象征诗人纵遭打击，高洁的志节和爱国之心始终不变，是全词的点睛之笔。"}]},{"id":"g8b-w01","volume":"g8b","title":"桃花源记","author":"陶渊明","dynasty":"东晋","genre":"记叙文（散文）","kind":"prose","intro":"本文是《桃花源诗》的序言，作者借武陵渔人误入桃花源的经历，描绘了一个没有战乱、没有剥削的理想社会。","theme":"通过描写桃花源的安宁和乐，表达对美好生活的向往和对现实黑暗的不满。","tags":["叙事","理想社会","田园"],"units":[{"t":"晋太元中，武陵人捕鱼为业。","tr":"东晋太元年间，武陵郡有个人以捕鱼为生。","p":0,"r":1},{"t":"缘溪行，忘路之远近。","tr":"他顺着溪水划船，忘记了路程的远近。","p":0,"r":1},{"t":"忽逢桃花林，夹岸数百步，中无杂树，","tr":"忽然遇到一片桃花林，夹着溪水两岸有几百步长，中间没有别的树，","p":0,"r":1},{"t":"芳草鲜美，落英缤纷。","tr":"花草鲜嫩美丽，落花纷纷飘洒。","p":0,"r":1},{"t":"渔人甚异之，复前行，欲穷其林。","tr":"渔人对此感到非常诧异，又往前行船，想走到林子的尽头。","p":0,"r":1},{"t":"林尽水源，便得一山，山有小口，仿佛若有光。","tr":"桃林在溪水发源的地方就到了尽头，他便看见一座山，山上有个小洞口，隐隐约约好像有光亮。","p":1,"r":1},{"t":"便舍船，从口入。","tr":"于是他离开船，从洞口走了进去。","p":1,"r":1},{"t":"初极狭，才通人。","tr":"起初洞口非常狭窄，仅能容一个人通过。","p":1,"r":1},{"t":"复行数十步，豁然开朗。","tr":"又走了几十步，眼前突然变得开阔明亮了。","p":1,"r":1},{"t":"土地平旷，屋舍俨然，有良田、美池、桑竹之属。","tr":"土地平坦宽广，房屋整整齐齐，有肥沃的田地、美丽的池塘、桑树竹林之类。","p":1,"r":1},{"t":"阡陌交通，鸡犬相闻。","tr":"田间小路纵横交错，鸡鸣狗叫的声音处处可以听到。","p":1,"r":1},{"t":"其中往来种作，男女衣着，悉如外人。","tr":"人们在田野里来来往往耕种劳作，男女的穿戴，都跟桃花源外面的人一样。","p":1,"r":1},{"t":"黄发垂髫，并怡然自乐。","tr":"老人和小孩，都安适愉快，自得其乐。","p":1,"r":1},{"t":"见渔人，乃大惊，问所从来。","tr":"他们看见渔人，非常惊讶，问他从哪里来。","p":2,"r":1},{"t":"具答之。","tr":"渔人详细地回答了他们。","p":2,"r":1},{"t":"便要还家，设酒杀鸡作食。","tr":"村里人就邀请他到自己家里去，摆酒杀鸡做饭招待他。","p":2,"r":1},{"t":"村中闻有此人，咸来问讯。","tr":"村里的人听说来了这么一个人，都来打听消息。","p":2,"r":1},{"t":"自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。","tr":"他们自己说祖先为躲避秦时的战乱，带领妻子儿女和同乡人来到这个与世隔绝的地方，不再出去，于是同外面的人断绝了来往。","p":2,"r":1},{"t":"问今是何世，乃不知有汉，无论魏晋。","tr":"他们问现在是什么朝代，竟然不知道有过汉朝，更不用说魏朝和晋朝了。","p":2,"r":1},{"t":"此人一一为具言所闻，皆叹惋。","tr":"渔人把自己知道的事一一详尽地告诉他们，听完以后，他们都感叹惋惜。","p":2,"r":1},{"t":"余人各复延至其家，皆出酒食。","tr":"其余的人又各自把渔人请到自己家中，都拿出酒饭来款待他。","p":2,"r":1},{"t":"停数日，辞去。","tr":"渔人停留了几天，告辞离开。","p":2,"r":1},{"t":"此中人语云：“不足为外人道也。”","tr":"村里的人对他说：“这里的情况不值得对外面的人说啊。”","p":2,"r":1},{"t":"既出，得其船，便扶向路，处处志之。","tr":"渔人出来以后，找到他的船，就沿着原来的路回去，处处做了标记。","p":3,"r":1},{"t":"及郡下，诣太守，说如此。","tr":"到了郡城，拜见太守，说了这番经历。","p":3,"r":1},{"t":"太守即遣人随其往，寻向所志，遂迷，不复得路。","tr":"太守立即派人跟着他前往，寻找先前做的标记，结果迷了路，再也找不到通往桃花源的路了。","p":3,"r":1},{"t":"南阳刘子骥，高尚士也，闻之，欣然规往。","tr":"南阳的刘子骥，是个志向高洁的隐士，听到这件事，高兴地计划前往。","p":4,"r":1},{"t":"未果，寻病终，后遂无问津者。","tr":"没有实现，不久就病死了，此后就再也没有探访桃花源路径的人了。","p":4,"r":1}],"notes":[{"u":0,"w":"太元","m":"东晋孝武帝的年号（376—396）","t":"实词","d":["晋朝的开国年号","大元帅的称号"]},{"u":0,"w":"为业","m":"以……为职业","t":"实词","d":["做功业","成为学业"]},{"u":1,"w":"缘","m":"沿着，顺着","t":"实词","d":["缘分","因为"]},{"u":2,"w":"夹岸","m":"溪水两岸","t":"实词","d":["挟持河岸","靠近岸边"]},{"u":3,"w":"芳草鲜美","m":"芳香的青草鲜嫩美丽","t":"古今异义","d":["香草鲜艳漂亮","味道鲜美"]},{"u":4,"w":"异","m":"对……感到诧异","t":"词类活用","d":[]},{"u":4,"w":"穷","m":"走到尽头","t":"词类活用","d":[]},{"u":5,"w":"仿佛","m":"隐隐约约，好像","t":"实词","d":["相似","模仿"]},{"u":6,"w":"舍","m":"舍弃，离开（船）","t":"实词","d":["房舍","施舍"]},{"u":7,"w":"才","m":"仅仅，刚刚","t":"实词","d":["才能","才华"]},{"u":8,"w":"豁然开朗","m":"（视野）突然开阔明亮","t":"实词","d":["心情忽然舒畅","道理忽然明白"]},{"u":9,"w":"俨然","m":"整齐的样子","t":"实词","d":["庄重严肃的样子","完全如同"]},{"u":9,"w":"属","m":"类","t":"实词","d":["隶属","连接"]},{"u":10,"w":"阡陌","m":"田间小路（南北为阡，东西为陌）","t":"古今异义","d":["陌生人","街市"]},{"u":10,"w":"交通","m":"交错相通","t":"古今异义","d":["往来运输","沟通联络"]},{"u":11,"w":"外人","m":"桃花源以外的世人","t":"古今异义","d":["陌生人","不是亲属的人"]},{"u":12,"w":"黄发垂髫","m":"指老人和小孩","t":"实词","d":["黄头发和长辫子","年轻人和孩童"]},{"u":12,"w":"怡然","m":"愉快的样子","t":"实词","d":["安静的样子","骄傲的样子"]},{"u":14,"w":"具","m":"详细，一一","t":"实词","d":["具备","工具"]},{"u":15,"w":"要","m":"同“邀”，邀请","t":"通假","d":["需要","要求"]},{"u":16,"w":"咸","m":"全，都","t":"实词","d":["味咸","和谐"]},{"u":17,"w":"妻子","m":"妻子和儿女","t":"古今异义","d":["男子的配偶","妻室"]},{"u":17,"w":"绝境","m":"与世隔绝的地方","t":"古今异义","d":["没有出路的困境","最危险的处境"]},{"u":18,"w":"无论","m":"更不用说","t":"古今异义","d":["不管","不必谈论"]},{"u":19,"w":"叹惋","m":"感叹惋惜","t":"实词","d":["叹息悲伤","惊叹佩服"]},{"u":20,"w":"延","m":"邀请","t":"实词","d":["延长","延续"]},{"u":23,"w":"扶","m":"沿着，顺着","t":"实词","d":["用手扶住","帮助"]},{"u":23,"w":"志","m":"做标记","t":"词类活用","d":[]},{"u":24,"w":"诣","m":"拜见，到……去","t":"实词","d":["诘问","劝告"]},{"u":25,"w":"遂迷","m":"于是迷了路","t":"实词","d":["完成使命","愿望实现"]},{"u":26,"w":"规往","m":"计划前往","t":"实词","d":["规劝前往","按规矩前往"]},{"u":27,"w":"未果","m":"没有实现","t":"实词","d":["没有结果实","没有结局"]},{"u":27,"w":"问津","m":"探访渡口，这里指寻访路径","t":"实词","d":["询问渡口位置","打听消息"]},{"u":7,"w":"初极狭","m":"省略句，主语“山口”省略","t":"特殊句式","d":[]}],"tricky":["缤纷","俨","阡陌","髫","怡","诣","骥","津"],"keyLines":[{"u":3,"hint":"《桃花源记》中描写桃花林景色优美的两句是："},{"u":10,"hint":"桃花源中田间小路交错、鸡鸣狗吠相互应和的两句是："},{"u":12,"hint":"概括桃花源中老人和孩子都安适愉快的句子是："},{"u":17,"hint":"桃花源中人自述先辈为何来到此地并与外界隔绝的句子是："},{"u":18,"hint":"写桃花源中人不知汉魏晋朝代更替、与世隔绝的句子是："}],"appr":[{"q":"桃花源是怎样一个社会？作者为什么要写它？","a":"桃花源土地肥沃、屋舍整齐、人人劳作、自得其乐，没有战乱和剥削，淳朴平等。作者借此寄托对理想社会的向往，也反衬当时现实社会的黑暗。"},{"q":"文章最后写渔人再寻无路、刘子骥未果，有什么用意？","a":"两次“寻不得”使桃花源蒙上神秘色彩，说明这样的理想社会在现实中无法实现，只存在于作者的理想中，增加了文章的余味。"},{"q":"本文在结构和写法上有什么特点？","a":"以武陵渔人的行踪为线索，经过发现桃源、入桃源、出桃源、再寻桃源，叙事曲折；写景叙事结合，用对比衬托、虚实结合，使桃花源既真实又带有理想色彩。"}]},{"id":"g8b-w02","volume":"g8b","title":"小石潭记","author":"柳宗元","dynasty":"唐","genre":"游记（山水游记）","kind":"prose","intro":"柳宗元因参与永贞革新被贬永州，借山水排遣内心的愤懑。本文是“永州八记”之四，描绘小石潭的幽美景致和作者凄清的心境。","theme":"描写小石潭的形胜与幽静环境，抒发作者贬谪之中孤寂凄凉的心情。","tags":["游记","写景","借景抒情"],"units":[{"t":"从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。","tr":"从小丘向西走一百二十来步，隔着竹林，听见水声，好像玉佩玉环相碰发出的声音，心里很高兴。","p":0,"r":1},{"t":"伐竹取道，下见小潭，水尤清冽。","tr":"砍倒竹子开出一条道路，走下去看见一个小潭，潭水格外清凉。","p":0,"r":1},{"t":"全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。","tr":"潭以整块石头为底，靠近岸边，石底有的部分翻卷出水面，成为水中高地、小岛、不平的岩石和岩崖。","p":0,"r":1},{"t":"青树翠蔓，蒙络摇缀，参差披拂。","tr":"青翠的树木、碧绿的藤蔓，覆盖缠绕，摇曳下垂，参差不齐，随风飘拂。","p":0,"r":1},{"t":"潭中鱼可百许头，皆若空游无所依，","tr":"潭中的鱼大约有一百来条，都好像在空中游动，没有什么依靠，","p":1,"r":1},{"t":"日光下澈，影布石上，","tr":"阳光直照到潭底，鱼的影子映在石头上，","p":1,"r":1},{"t":"佁然不动，俶尔远逝，往来翕忽，似与游者相乐。","tr":"呆呆地一动不动，忽然间又向远处游去，来来往往，轻快敏捷，好像和游人互相嬉戏取乐。","p":1,"r":1},{"t":"潭西南而望，斗折蛇行，明灭可见。","tr":"向小石潭的西南方望去，溪身像北斗七星那样曲折，像蛇爬行那样蜿蜒，时隐时现。","p":2,"r":1},{"t":"其岸势犬牙差互，不可知其源。","tr":"两岸的地势像狗的牙齿那样参差交错，不能知道溪水的源头在哪里。","p":2,"r":1},{"t":"坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。","tr":"坐在潭边，四面竹林树木环绕，寂静空旷，不见人影，使人心神凄凉，寒气透骨，幽静深远，满是忧伤。","p":3,"r":1},{"t":"以其境过清，不可久居，乃记之而去。","tr":"因为这里的环境太过凄清，不能长久停留，于是记下这里的景色就离开了。","p":3,"r":1},{"t":"同游者：吴武陵，龚古，余弟宗玄。","tr":"同去游玩的人有：吴武陵、龚古，我的堂弟宗玄。","p":4,"r":0},{"t":"隶而从者，崔氏二小生：曰恕己，曰奉壹。","tr":"跟随同去的，有姓崔的两个年轻人：一个叫恕己，一个叫奉壹。","p":4,"r":0}],"notes":[{"u":0,"w":"篁竹","m":"竹林","t":"实词","d":["竹篱笆","竹子做的乐器"]},{"u":0,"w":"如鸣珮环","m":"好像玉佩玉环相碰作响","t":"实词","d":["如同鸣叫的鸟群","好像佩戴环饰"]},{"u":0,"w":"乐","m":"以……为乐，感到高兴","t":"词类活用","d":[]},{"u":1,"w":"伐","m":"砍伐","t":"实词","d":["讨伐","夸耀"]},{"u":1,"w":"清冽","m":"水清而凉","t":"实词","d":["清澈见底","冰冷刺骨"]},{"u":2,"w":"全石以为底","m":"以整块石头作为潭底（状语后置/宾语前置）","t":"特殊句式","d":[]},{"u":2,"w":"卷石底以出","m":"石底有些部分翻卷出来","t":"实词","d":["把石头卷走","卷起石头出来"]},{"u":2,"w":"坻","m":"水中的高地","t":"实词","d":["堤岸","沙洲"]},{"u":2,"w":"嵁","m":"不平的岩石","t":"实词","d":["高耸的山峰","崖壁"]},{"u":3,"w":"蒙络摇缀","m":"覆盖缠绕、摇曳下垂","t":"实词","d":["蒙蔽缠绕","牵连点缀"]},{"u":3,"w":"披拂","m":"随风飘动","t":"实词","d":["披散垂落","拂去尘埃"]},{"u":4,"w":"可","m":"大约","t":"实词","d":["可以","许可"]},{"u":4,"w":"许","m":"左右，上下","t":"实词","d":["允许","称许"]},{"u":5,"w":"澈","m":"照透","t":"实词","d":["清澈","明亮"]},{"u":6,"w":"佁然","m":"呆呆的样子","t":"实词","d":["安稳的样子","胆怯的样子"]},{"u":6,"w":"翕忽","m":"轻快敏捷","t":"实词","d":["忽然合上","迅速消失"]},{"u":7,"w":"斗折蛇行","m":"像北斗七星那样曲折，像蛇那样蜿蜒","t":"词类活用","d":[]},{"u":8,"w":"犬牙差互","m":"像狗牙那样互相交错","t":"词类活用","d":[]},{"u":9,"w":"寂寥","m":"寂静空旷","t":"实词","d":["孤独寂寞","冷清萧条"]},{"u":9,"w":"悄怆","m":"忧伤的样子","t":"实词","d":["悄悄地悲伤","安静而凄凉"]},{"u":9,"w":"凄神寒骨","m":"使心神凄凉、使骨头寒冷","t":"词类活用","d":[]},{"u":10,"w":"以","m":"因为","t":"虚词","d":[]},{"u":10,"w":"居","m":"停留","t":"实词","d":["居住","占据"]},{"u":10,"w":"乃","m":"于是，就","t":"虚词","d":[]},{"u":12,"w":"隶","m":"跟随","t":"实词","d":["奴隶","隶书"]}],"tricky":["篁","珮","坻","屿","嵁","佁","俶","翕","寂寥","悄怆"],"keyLines":[{"u":0,"hint":"《小石潭记》中，写作者隔着竹林听到水声，如佩环相击而心生欢喜的句子是："},{"u":4,"hint":"以“空游”写出潭水清澈、游鱼如在空中的句子是："},{"u":6,"hint":"描写游鱼静止、忽然远逝、往来轻快，仿佛与游人嬉戏的句子是："},{"u":7,"hint":"描写溪流曲折蜿蜒、忽隐忽现的句子是："},{"u":9,"hint":"写出作者坐在潭边感到凄清幽深的感受的句子是："}],"appr":[{"q":"作者怎样写出潭水的清澈？","a":"不直接写水，而写鱼“皆若空游无所依”“影布石上”，以鱼影和石影侧面烘托水的透明，运用了侧面描写。"},{"q":"文章结尾的“凄神寒骨，悄怆幽邃”体现了什么情感？","a":"写景由喜转忧，环境的幽清触动了作者被贬后的孤独凄凉，借景抒情，抒发了贬谪生活的忧伤和不平。"},{"q":"作者游览的顺序及写景特点是什么？","a":"按“发现小潭—潭石—潭水游鱼—溪流—环境—记游”的游踪行文，移步换景，既有形、声、色的描绘，也有动静结合，层次清晰。"}]},{"id":"g8b-w03","volume":"g8b","title":"核舟记","author":"魏学洢","dynasty":"明","genre":"说明文（杂记）","kind":"prose","intro":"魏学洢为明末文人，本文记述民间艺人王叔远雕刻的一只桃核小船，逐一描摹船上的人物、器物和题字，赞叹微雕工艺的神奇。","theme":"细致说明核舟的构造与雕刻内容，赞美王叔远精湛的技艺和我国古代民间艺术的高超成就。","tags":["说明","工艺","赞美"],"units":[{"t":"明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，","tr":"明朝有一位手艺奇巧的人叫王叔远，他能用直径只有一寸的木头，雕刻出宫殿房屋、器具用品、人物形象，","p":0,"r":1},{"t":"以至鸟兽、木石，罔不因势象形，各具情态。","tr":"乃至飞禽走兽、树木山石，没有一样不是顺着木料原来的样子刻成相应的形状，各自具有不同的神态。","p":0,"r":1},{"t":"尝贻余核舟一，盖大苏泛赤壁云。","tr":"他曾经送给我一只用桃核刻成的小船，刻的是苏东坡泛舟游赤壁的情景。","p":0,"r":1},{"t":"舟首尾长约八分有奇，高可二黍许。","tr":"船从头到尾约长八分多一点，高度大约有两个黍粒那么高。","p":1,"r":0},{"t":"中轩敞者为舱，箬篷覆之。","tr":"中间高起而宽敞的部分是船舱，用箬竹叶做的船篷盖在上面。","p":1,"r":0},{"t":"旁开小窗，左右各四，共八扇。","tr":"船舱两侧开着小窗，左右各有四扇，一共八扇。","p":1,"r":0},{"t":"启窗而观，雕栏相望焉。","tr":"推开窗户来看，雕花的栏杆左右相对。","p":1,"r":0},{"t":"闭之，则右刻“山高月小，水落石出”，左刻“清风徐来，水波不兴”，石青糁之。","tr":"关上窗户，就看见右边刻着“山高月小，水落石出”，左边刻着“清风徐来，水波不兴”，刻字的凹痕里用石青涂染。","p":1,"r":0},{"t":"船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。","tr":"船头坐着三个人，中间戴高帽子、胡须很多的是苏东坡，佛印坐在右边，黄鲁直坐在左边。","p":2,"r":1},{"t":"苏、黄共阅一手卷。","tr":"苏东坡和黄鲁直一同观看一幅书画手卷。","p":2,"r":0},{"t":"东坡右手执卷端，左手抚鲁直背。","tr":"苏东坡右手拿着手卷的右端，左手轻抚着黄鲁直的后背。","p":2,"r":0},{"t":"鲁直左手执卷末，右手指卷，如有所语。","tr":"黄鲁直左手拿着手卷的左端，右手指向画卷，好像在说着什么。","p":2,"r":0},{"t":"东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。","tr":"苏东坡露出右脚，黄鲁直露出左脚，两人各自微微侧身，他们互相靠近的两只膝盖，都隐藏在手卷下面的衣褶里。","p":2,"r":0},{"t":"佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。","tr":"佛印极像弥勒佛，敞开衣襟露出胸脯，抬起头向上看，神情与苏东坡、黄鲁直不相类。","p":2,"r":0},{"t":"卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之，珠可历历数也。","tr":"他平放着右膝，弯曲右臂撑在船上，竖起左膝，左臂挂着一串念珠靠在左膝上，念珠的颗数清清楚楚可以数出来。","p":2,"r":0},{"t":"舟尾横卧一楫。","tr":"船尾横放着一支船桨。","p":3,"r":0},{"t":"楫左右舟子各一人。","tr":"船桨的左右两边各有一个撑船的人。","p":3,"r":0},{"t":"居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。","tr":"在右边的那个人梳着椎形发髻，仰着脸，左手靠着一根横木，右手扳着右脚，好像在大声呼叫的样子。","p":3,"r":0},{"t":"居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。","tr":"在左边的那个人右手拿着蒲葵扇，左手摸着炉子，炉上放着茶壶，他目光端正地盯着炉子，神色平静，好像在专心倾听茶水烧开的声音。","p":3,"r":0},{"t":"其船背稍夷，则题名其上，文曰“天启壬戌秋日，虞山王毅叔远甫刻”，","tr":"船的背部略微平坦，就在上面题了名，文字是“天启壬戌秋日，虞山王毅叔远甫刻”，","p":4,"r":0},{"t":"细若蚊足，钩画了了，其色墨。","tr":"字细小得像蚊子的脚，但每一笔每一画都清清楚楚，字的颜色是黑的。","p":4,"r":0},{"t":"又用篆章一，文曰“初平山人”，其色丹。","tr":"又刻了一方篆文印章，文字是“初平山人”，字的颜色是红的。","p":4,"r":0},{"t":"通计一舟，为人五；为窗八；","tr":"总计这一条小船，刻有五个人，八扇窗；","p":5,"r":0},{"t":"为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；","tr":"刻有船篷、船桨、炉子、茶壶、手卷、念珠各一件；","p":5,"r":0},{"t":"对联、题名并篆文，为字共三十有四。","tr":"对联、题名和篆文，刻的字一共有三十四个。","p":5,"r":0},{"t":"而计其长曾不盈寸。","tr":"可是算起它的长度，竟然还不满一寸。","p":5,"r":1},{"t":"盖简桃核修狭者为之。","tr":"原来是挑选了桃核中长而窄的一枚来雕成的。","p":5,"r":1},{"t":"嘻，技亦灵怪矣哉！","tr":"啊，这技艺真是神奇巧妙极了！","p":5,"r":1}],"notes":[{"u":0,"w":"奇巧","m":"奇特精巧","t":"实词","d":["奇怪而狡猾","稀奇古怪"]},{"u":0,"w":"径寸","m":"直径一寸","t":"实词","d":["小路一寸长","半径一寸"]},{"u":0,"w":"曰","m":"叫做","t":"实词","d":["说道","认为"]},{"u":1,"w":"罔","m":"无，没有","t":"实词","d":["欺骗，蒙蔽","网罗，捕捉"]},{"u":1,"w":"象","m":"模拟，刻成……的样子（名词作动词）","t":"词类活用","d":[]},{"u":2,"w":"尝","m":"曾经","t":"实词","d":["品尝","尝试"]},{"u":2,"w":"贻","m":"赠送","t":"实词","d":["遗留，留下","耽误"]},{"u":2,"w":"盖","m":"大概是，原来是（表推测的语气词）","t":"虚词","d":[]},{"u":3,"w":"有奇","m":"有余，零头","t":"实词","d":["有奇异之处","有奇数"]},{"u":3,"w":"可","m":"大约","t":"实词","d":["可以，能够","值得"]},{"u":7,"w":"糁","m":"涂染，涂抹","t":"实词","d":["散落","掺杂混合"]},{"u":8,"w":"峨冠","m":"戴高高的帽子（名词作动词）","t":"词类活用","d":[]},{"u":8,"w":"居","m":"坐，处于","t":"实词","d":["居住","停留"]},{"u":12,"w":"现","m":"露出","t":"实词","d":["出现","现在"]},{"u":12,"w":"相比","m":"紧靠，挨着","t":"古今异义","d":["互相比较","互相较量"]},{"u":13,"w":"绝类","m":"极像","t":"实词","d":["绝对不同","断绝了种类"]},{"u":13,"w":"矫首","m":"抬起头","t":"实词","d":["纠正头部","低下头"]},{"u":14,"w":"诎","m":"通“屈”，弯曲","t":"通假","d":["伸直","缩短"]},{"u":14,"w":"历历","m":"清清楚楚的样子","t":"实词","d":["先后经历","连续不断"]},{"u":17,"w":"椎髻","m":"梳着椎形发髻（名词作动词）","t":"词类活用","d":[]},{"u":17,"w":"衡","m":"通“横”，横着的","t":"通假","d":["秤杆","衡量"]},{"u":17,"w":"趾","m":"脚","t":"古今异义","d":["脚趾","膝盖"]},{"u":18,"w":"视端容寂","m":"目光端正，神色平静","t":"特殊句式","d":[]},{"u":19,"w":"稍夷","m":"略微平坦","t":"实词","d":["稍微消失","稍微平整地铲除"]},{"u":20,"w":"了了","m":"清清楚楚","t":"实词","d":["完结结束","聪明机灵"]},{"u":24,"w":"有","m":"通“又”，用在整数和零数之间","t":"通假","d":["拥有","存在"]},{"u":25,"w":"曾","m":"竟，简直","t":"实词","d":["曾经","增加"]},{"u":26,"w":"简","m":"挑选","t":"实词","d":["简单","书简"]},{"u":26,"w":"修狭","m":"长而窄","t":"实词","d":["修理使之狭窄","修长而宽阔"]},{"u":27,"w":"亦","m":"竟然，真是（表程度）","t":"虚词","d":[]}],"tricky":["髯","诎","糁","箬","髻","楫"],"keyLines":[{"u":25,"hint":"《核舟记》中，写出这只核舟整体极其小巧、长度还不到一寸的句子是："},{"u":27,"hint":"《核舟记》结尾，作者发出对王叔远技艺赞叹的句子是："},{"u":2,"hint":"文中点明核舟雕刻内容是苏东坡游赤壁的句子是："},{"u":7,"hint":"核舟舱窗外两侧所刻、出自苏轼《赤壁赋》的文字是："}],"appr":[{"q":"本文是按什么顺序介绍核舟的？运用了哪些说明方法？","a":"先总说王叔远的技艺，再按空间顺序由中间的舱、船头、船尾到船背逐层介绍，最后总括全舟、赞叹技艺。文中运用列数字、打比方（细若蚊足）、引用等方法，使说明准确生动。"},{"q":"作者描写船头三个人物时，是怎样突出他们特点的？","a":"抓住各人的外貌、动作与神态：苏东坡峨冠多髯、佛印袒胸露乳、鲁直指卷似语，又通过手足姿势的细节显出相互关系，使三人神情各异、形象逼真，也衬托出雕刻技艺的精妙。"}]},{"id":"g8b-w04","volume":"g8b","title":"北冥有鱼","author":"庄子","dynasty":"战国","genre":"寓言（道家散文）","kind":"prose","intro":"选自《庄子·逍遥游》开篇，庄子以奇特想象描绘鲲化为鹏、南徙高飞的壮阔画面，引出对“逍遥”的思考。","theme":"通过鲲鹏变化和南徙的奇景，说明万物的活动都要有所凭借，表达追求精神绝对自由的思想。","tags":["寓言","想象","说理"],"units":[{"t":"北冥有鱼，其名为鲲。","tr":"北海里有一条鱼，它的名字叫鲲。","p":0,"r":1},{"t":"鲲之大，不知其几千里也；","tr":"鲲的身躯庞大，不知道有几千里长；","p":0,"r":1},{"t":"化而为鸟，其名为鹏。","tr":"它变化成鸟，名字叫鹏。","p":0,"r":1},{"t":"鹏之背，不知其几千里也；","tr":"鹏的脊背，不知道有几千里宽；","p":0,"r":1},{"t":"怒而飞，其翼若垂天之云。","tr":"它奋力振翅而飞，那展开的翅膀好像挂在天边的云。","p":0,"r":1},{"t":"是鸟也，海运则将徙于南冥。","tr":"这只鸟啊，等到海水涌动、大风刮起的时候，就要迁往南海。","p":0,"r":1},{"t":"南冥者，天池也。","tr":"南海，就是一个天然的大水池。","p":0,"r":1},{"t":"《齐谐》者，志怪者也。","tr":"《齐谐》是一部专门记载怪异事情的书。","p":1,"r":1},{"t":"《谐》之言曰：","tr":"《谐》书里说：","p":1,"r":1},{"t":"“鹏之徙于南冥也，水击三千里，","tr":"“鹏迁往南海的时候，翅膀拍击水面，激起三千里的浪花，","p":1,"r":1},{"t":"抟扶摇而上者九万里，去以六月息者也。”","tr":"借着旋风盘旋直上九万里的高空，乘着六月的大风离开。”","p":1,"r":1},{"t":"野马也，尘埃也，生物之以息相吹也。","tr":"那游动的雾气，飞扬的尘埃，都是生物用气息相互吹拂的结果。","p":1,"r":1},{"t":"天之苍苍，其正色邪？","tr":"天色苍青，难道是它真正的颜色吗？","p":1,"r":1},{"t":"其远而无所至极邪？","tr":"还是因为它高远得没有尽头呢？","p":1,"r":1},{"t":"其视下也，亦若是则已矣。","tr":"鹏从高空往下看，也不过像这样罢了。","p":1,"r":1}],"notes":[{"u":0,"w":"冥","m":"通“溟”，海","t":"通假","d":["黑暗","幽深"]},{"u":1,"w":"几","m":"多少","t":"实词","d":["几乎","桌几"]},{"u":2,"w":"化","m":"变化","t":"实词","d":["化学","融化"]},{"u":4,"w":"怒","m":"奋起（用力）","t":"实词","d":["愤怒","恼怒"]},{"u":4,"w":"垂","m":"通“陲”，边际","t":"通假","d":["下垂","流传后世"]},{"u":5,"w":"海运","m":"海水涌动，海上刮起大风","t":"实词","d":["海上运输","海洋的气运"]},{"u":5,"w":"徙","m":"迁移","t":"实词","d":["步行","徒然"]},{"u":7,"w":"志","m":"记载","t":"实词","d":["志向","标记"]},{"u":7,"w":"怪","m":"怪异之事","t":"词类活用","d":[]},{"u":10,"w":"抟","m":"盘旋而上","t":"实词","d":["捏聚成团","拍打"]},{"u":10,"w":"扶摇","m":"旋风，自下而上的暴风","t":"实词","d":["摇动扶持","轻柔摇摆"]},{"u":10,"w":"去","m":"离开","t":"古今异义","d":["前往","过去"]},{"u":10,"w":"息","m":"风","t":"实词","d":["休息","停止"]},{"u":11,"w":"野马","m":"山野间浮动的雾气","t":"古今异义","d":["野生的马","奔跑的骏马"]},{"u":11,"w":"以息相吹","m":"用气息互相吹拂","t":"特殊句式","d":[]},{"u":12,"w":"苍苍","m":"深蓝色","t":"实词","d":["茂盛的样子","灰白色"]},{"u":12,"w":"邪","m":"通“耶”，表疑问的语气词","t":"通假","d":["邪恶","不正当"]},{"u":13,"w":"所至极","m":"尽头","t":"实词","d":["所到达的极限处","极端的地方"]},{"u":14,"w":"若是","m":"像这样","t":"实词","d":["如果是","好像是"]},{"u":14,"w":"已矣","m":"罢了","t":"虚词","d":[]}],"tricky":["鲲","鹏","徙","抟","谐","邪"],"keyLines":[{"u":4,"hint":"《北冥有鱼》中，形容鹏奋飞时翅膀如同悬在天边的云的句子是："},{"u":10,"hint":"《北冥有鱼》中，借《齐谐》所记，写鹏借旋风盘旋直上高空、乘六月大风离去的句子是："},{"u":12,"hint":"庄子以设问推想天空青苍之色是否为其本色的句子是："},{"u":14,"hint":"文章最后，设想鹏从高空俯视大地，所见与人间仰望天空相似的句子是："}],"appr":[{"q":"文章开头写鲲、鹏的巨大，运用了什么手法？有什么作用？","a":"运用夸张和想象，用“不知其几千里”“若垂天之云”写出鲲鹏的庞大，营造奇特壮阔的意境，激发读者想象，也为后文论述“有所凭借”作铺垫。"},{"q":"“其视下也，亦若是则已矣”一句有何深意？","a":"鹏在高空俯视，所见与人在地面仰望天空一样，揭示了视野高下的相对性，暗示事物的认识受所处位置限制，体现庄子超越局限、追求精神自由的思想。"}]},{"id":"g8b-w05","volume":"g8b","title":"庄子与惠子游于濠梁之上","author":"庄子","dynasty":"战国","genre":"寓言（哲理对话）","kind":"prose","intro":"选自《庄子·秋水》，写庄子与好友惠子在濠水桥上，围绕“鱼是否快乐”展开一场机智的辩论。","theme":"借“鱼之乐”之辩，表现庄子万物与我为一的物我交融观念，也体现两人辩论各有所据的思维差异。","tags":["寓言","辩论","哲理"],"units":[{"t":"庄子与惠子游于濠梁之上。","tr":"庄子和惠子一起在濠水的桥上游玩。","p":0,"r":1},{"t":"庄子曰：“鲦鱼出游从容，是鱼之乐也。”","tr":"庄子说：“鲦鱼在水里悠闲自在地游来游去，这就是鱼的快乐啊。”","p":0,"r":1},{"t":"惠子曰：“子非鱼，安知鱼之乐？”","tr":"惠子说：“你不是鱼，怎么知道鱼的快乐？”","p":0,"r":1},{"t":"庄子曰：“子非我，安知我不知鱼之乐？”","tr":"庄子说：“你不是我，怎么知道我不知道鱼的快乐？”","p":0,"r":1},{"t":"惠子曰：“我非子，固不知子矣；","tr":"惠子说：“我不是你，本来就不知道你的想法；","p":0,"r":1},{"t":"子固非鱼也，子之不知鱼之乐，全矣！”","tr":"你本来就不是鱼，你不知道鱼的快乐，这是完全可以肯定的！”","p":0,"r":1},{"t":"庄子曰：“请循其本。","tr":"庄子说：“请回到我们最初的话题。","p":0,"r":1},{"t":"子曰‘汝安知鱼乐’云者，既已知吾知之而问我，我知之濠上也。”","tr":"你说‘你怎么知道鱼快乐’这句话，说明你已经知道我知道鱼快乐才来问我；我是在濠水桥上知道的。”","p":0,"r":1}],"notes":[{"u":0,"w":"濠梁","m":"濠水上的桥","t":"实词","d":["濠水的堤岸","护城河边的房梁"]},{"u":1,"w":"鲦鱼","m":"白条鱼","t":"实词","d":["小鲤鱼","泥鳅"]},{"u":1,"w":"从容","m":"悠闲自得","t":"古今异义","d":["镇定不慌张","时间宽裕"]},{"u":2,"w":"安","m":"怎么，哪里","t":"虚词","d":[]},{"u":2,"w":"子","m":"你（对对方的尊称）","t":"实词","d":["儿子","先生"]},{"u":4,"w":"固","m":"本来，当然","t":"实词","d":["坚固","固执"]},{"u":5,"w":"全","m":"完全，确定无疑","t":"实词","d":["保全","完整"]},{"u":6,"w":"循","m":"追溯，顺着","t":"实词","d":["遵循","循环往复"]},{"u":6,"w":"本","m":"本源，最初的话题","t":"实词","d":["树根","书本"]},{"u":7,"w":"汝","m":"你","t":"实词","d":["汝水","你们"]},{"u":7,"w":"云者","m":"这样说的话（助词，表语气）","t":"虚词","d":[]},{"u":7,"w":"既已","m":"已经","t":"实词","d":["既然如此","已经结束"]},{"u":7,"w":"我知之濠上也","m":"省略句，“于濠上”提前，意为“我是在濠上知道的”","t":"特殊句式","d":[]},{"u":3,"w":"非","m":"不是（判断否定）","t":"特殊句式","d":[]},{"u":1,"w":"出游","m":"游出来，游动","t":"实词","d":["外出旅游","出门远行"]},{"u":1,"w":"是","m":"这（指示代词）","t":"实词","d":["表判断的“是”","正确"]},{"u":3,"w":"安知","m":"怎么知道（反问）","t":"特殊句式","d":[]},{"u":5,"w":"之","m":"助词，取消句子独立性","t":"虚词","d":[]}],"tricky":["濠","鲦","循","汝"],"keyLines":[{"u":1,"hint":"庄子在濠梁上观鱼，认为鱼悠闲自在、很快乐的话是："},{"u":2,"hint":"惠子用来反驳庄子“鱼之乐”说法的话是："},{"u":5,"hint":"惠子用逻辑推理，认定庄子不可能知道鱼之乐的句子是："},{"u":7,"hint":"庄子最后巧妙回答“我是怎么知道鱼之乐”的句子是："}],"appr":[{"q":"庄子与惠子的辩论各自依据什么？","a":"惠子从逻辑出发，认为“子非鱼，安知鱼之乐”，注重事实判断；庄子从物我交融的审美体验出发，凭自己在濠上的感受推知鱼之乐，体现出诗意的哲学思维。"},{"q":"庄子最后一句话巧妙在哪里？","a":"他抓住惠子问话中的“安知”，把它理解为“从哪里知道”，以此回答“我在濠水之上知道”，转换了概念，既化解了对方的诘难，也显出庄子的机智与洒脱。"}]},{"id":"g8b-w06","volume":"g8b","title":"虽有嘉肴","author":"《礼记》","dynasty":"西汉","genre":"论说文（语录体）","kind":"prose","intro":"选自《礼记·学记》，是我国古代教育理论的经典篇章。文章以美味佳肴作比，阐明教与学的关系。","theme":"以“嘉肴”设喻，说明只有实践才能知道不足，教与学是相互促进、共同提高的。","tags":["说理","教育","议论"],"units":[{"t":"虽有嘉肴，弗食，不知其旨也；","tr":"即使有美味的菜肴，不去品尝，就不知道它味道的鲜美；","p":0,"r":1},{"t":"虽有至道，弗学，不知其善也。","tr":"即使有最好的道理，不去学习，就不知道它的好处。","p":0,"r":1},{"t":"是故学然后知不足，教然后知困。","tr":"所以学习之后才知道自己有不足，教导别人之后才知道自己有困惑不通之处。","p":0,"r":1},{"t":"知不足，然后能自反也；","tr":"知道自己不足，然后才能反省自己；","p":0,"r":1},{"t":"知困，然后能自强也。","tr":"知道自己困惑，然后才能督促自己奋发进取。","p":0,"r":1},{"t":"故曰：教学相长也。","tr":"所以说：教和学是互相促进的。","p":0,"r":1},{"t":"《兑命》曰：“学学半”，其此之谓乎？","tr":"《兑命》说：“教人是学习的一半”，大概说的就是这个道理吧？","p":0,"r":1}],"notes":[{"u":0,"w":"虽","m":"即使，纵然","t":"实词","d":["虽然","只是"]},{"u":0,"w":"嘉肴","m":"美味的菜肴","t":"实词","d":["美好的佳酿","丰盛的筵席"]},{"u":0,"w":"弗","m":"不","t":"实词","d":["不要","没有"]},{"u":0,"w":"旨","m":"味美","t":"实词","d":["旨意","意义"]},{"u":1,"w":"至道","m":"最好的道理","t":"实词
