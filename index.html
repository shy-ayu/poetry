媒。","tr":"不是我故意拖延婚期，是你没有请到好媒人。","p":0,"r":1},{"t":"将子无怒，秋以为期。","tr":"请你不要生气，就把秋天定为婚期吧。","p":0,"r":1},{"t":"乘彼垝垣，以望复关。","tr":"我登上那段残破的土墙，眺望复关的方向。","p":1,"r":1},{"t":"不见复关，泣涕涟涟。","tr":"看不见复关，眼泪不停地流下来。","p":1,"r":1},{"t":"既见复关，载笑载言。","tr":"终于看见了复关，又说又笑。","p":1,"r":1},{"t":"尔卜尔筮，体无咎言。","tr":"你用龟甲占卜，又用蓍草占筮，卦象都没有不吉利的话。","p":1,"r":1},{"t":"以尔车来，以我贿迁。","tr":"你赶着车来，把我的嫁妆搬走成婚。","p":1,"r":1},{"t":"桑之未落，其叶沃若。","tr":"桑树叶还没有掉落时，叶子鲜嫩润泽。","p":2,"r":1},{"t":"于嗟鸠兮，无食桑葚！","tr":"唉，斑鸠啊，不要贪吃桑葚！","p":2,"r":1},{"t":"于嗟女兮，无与士耽！","tr":"唉，姑娘们啊，不要和男子沉溺于爱情！","p":2,"r":1},{"t":"士之耽兮，犹可说也。","tr":"男子沉溺于爱情，还能够摆脱。","p":2,"r":1},{"t":"女之耽兮，不可说也。","tr":"女子沉溺于爱情，就无法摆脱了。","p":2,"r":1},{"t":"桑之落矣，其黄而陨。","tr":"桑叶枯落的时候，叶子发黄飘零。","p":3,"r":1},{"t":"自我徂尔，三岁食贫。","tr":"自从我嫁到你家，多年来过着贫苦的日子。","p":3,"r":1},{"t":"淇水汤汤，渐车帷裳。","tr":"淇水波涛滚滚，浸湿了车上的帷幔。","p":3,"r":1},{"t":"女也不爽，士贰其行。","tr":"我这个女子没有差错，是你这个男子变了心。","p":3,"r":1},{"t":"士也罔极，二三其德。","tr":"你这个男子行为没有准则，在感情上三心二意。","p":3,"r":1},{"t":"三岁为妇，靡室劳矣；","tr":"多年来做你的妻子，家里的活没有不干的；","p":4,"r":1},{"t":"夙兴夜寐，靡有朝矣。","tr":"早起晚睡，没有一天不是这样。","p":4,"r":1},{"t":"言既遂矣，至于暴矣。","tr":"你的心愿已经满足，就对我粗暴起来。","p":4,"r":1},{"t":"兄弟不知，咥其笑矣。","tr":"兄弟们不了解我的处境，只是讥笑我。","p":4,"r":1},{"t":"静言思之，躬自悼矣。","tr":"静下心来细细想想，只能独自伤心。","p":4,"r":1},{"t":"及尔偕老，老使我怨。","tr":"当初说好同你白头到老，如今老去只让我怨恨。","p":5,"r":1},{"t":"淇则有岸，隰则有泮。","tr":"淇水还有岸，低湿的地方还有边。","p":5,"r":1},{"t":"总角之宴，言笑晏晏。","tr":"少年时在一起欢聚，说说笑笑多么融洽。","p":5,"r":1},{"t":"信誓旦旦，不思其反。","tr":"当时的誓言恳切分明，没想到你会违背。","p":5,"r":1},{"t":"反是不思，亦已焉哉！","tr":"既然违背誓言我不再去想，那就算了吧！","p":5,"r":1}],"notes":[{"u":0,"w":"氓","m":"民，这里指那个男子","t":"实词","d":["流氓","官吏"]},{"u":0,"w":"贸","m":"交易，交换","t":"实词","d":["贸然","买卖货物的店铺"]},{"u":3,"w":"愆期","m":"拖延婚期","t":"实词","d":["错过约定的时辰","提前日期"]},{"u":4,"w":"将","m":"愿，请","t":"实词","d":["将要","带领"]},{"u":5,"w":"垝垣","m":"倒塌残破的土墙","t":"实词","d":["高大的城墙","围起的院墙"]},{"u":8,"w":"体","m":"卦兆，卦象","t":"实词","d":["身体","体例"]},{"u":9,"w":"贿","m":"财物，这里指嫁妆","t":"古今异义","d":["贿赂","礼金"]},{"u":14,"w":"说","m":"通“脱”，摆脱，解脱","t":"通假","d":["言说，说明","喜悦"]},{"u":16,"w":"徂","m":"往，这里指出嫁到","t":"实词","d":["返回","死亡"]},{"u":18,"w":"贰","m":"过错，变心，不专一","t":"实词","d":["数目二","副职"]},{"u":24,"w":"躬自悼","m":"独自伤心","t":"实词","d":["亲自吊唁","弯腰致意"]},{"u":27,"w":"总角","m":"古代儿童把头发扎成两个小髻，指童年","t":"典故","d":[]}],"tricky":["蚩","愆","垝","葚","咥","隰"],"keyLines":[{"u":4,"hint":"《氓》中，女子请男子不要发怒，并把婚期定在秋天的两句是："},{"u":14,"hint":"《氓》中，说明男女在爱情中处境不平等的两句是："},{"u":16,"hint":"《氓》中，女子写自己嫁过去后多年过着贫苦生活的句子是："},{"u":20,"hint":"《氓》中，女子写自己婚后操持家务、不分昼夜辛劳的两句是："},{"u":28,"hint":"《氓》中，女子写男子背弃当初恳切誓言的句子是："},{"u":29,"hint":"《氓》结尾，女子表示不再顾念旧情、决然了断的句子是："}],"appr":[{"q":"第三章“桑之未落，其叶沃若”和第四章“桑之落矣，其黄而陨”在写法上有什么作用？","a":"这是“比兴”：用桑叶由鲜嫩润泽到枯黄飘落，比喻女子由青春貌美到容颜衰老、遭丈夫厌弃，两章对照，暗示爱情由盛转衰，也使叙事带有抒情色彩。"},{"q":"这首诗的叙事结构有什么特点？","a":"全诗按时间顺序，从恋爱、成婚、受虐一直写到被弃、决绝，层次清楚；叙述中穿插回忆与议论，又用对比（昔日温柔与今日暴戾）突出男子的负心，女主人公形象真实鲜明。"},{"q":"结尾“反是不思，亦已焉哉”表现了女主人公怎样的性格？","a":"她先是痛苦追忆，最后却不再沉溺往事，明确表示就此了断，体现出清醒、刚强而果决的性格，也使全诗在悲怨之中有了力量。"}]},{"id":"h2c-p02","volume":"h2c","title":"离骚（节选）","author":"屈原","dynasty":"战国","genre":"楚辞（骚体诗）","kind":"poem","intro":"屈原遭谗被疏、放逐之后所作的长篇政治抒情诗，是楚辞的代表作。节选部分抒写他遭受打击仍坚守高洁理想、九死不悔的心志。","theme":"抒写诗人忧民忧国、遭谗被疏的愤懑，以及不肯同流合污、坚持理想的决心。","tags":["言志","抒怀","忧国忧民"],"units":[{"t":"长太息以掩涕兮，哀民生之多艰。","tr":"我长长叹息擦拭眼泪，哀怜百姓生活多么艰难。","p":0,"r":1},{"t":"余虽好修姱以鞿羁兮，謇朝谇而夕替。","tr":"我虽爱好美德又自我约束，早上进谏到晚上就遭废弃。","p":0,"r":1},{"t":"既替余以蕙纕兮，又申之以揽茝。","tr":"他们废黜我，只因我佩着蕙草做的带子，又加上我采集了白芷。","p":0,"r":1},{"t":"亦余心之所善兮，虽九死其犹未悔。","tr":"这也是我内心所爱好的，就算死多少次我也不后悔。","p":0,"r":1},{"t":"怨灵修之浩荡兮，终不察夫民心。","tr":"我怨恨君王荒唐放纵，始终不体察人民的心意。","p":0,"r":1},{"t":"众女嫉余之蛾眉兮，谣诼谓余以善淫。","tr":"众女子嫉妒我的美丽眉毛，造谣诽谤说我善于淫邪。","p":0,"r":1},{"t":"固时俗之工巧兮，偭规矩而改错。","tr":"时俗本来就善于投机取巧，违背规矩而随意改变措施。","p":0,"r":1},{"t":"背绳墨以追曲兮，竞周容以为度。","tr":"背弃准绳去迎合邪曲，竞相以苟且迎合为准则。","p":0,"r":1},{"t":"忳郁邑余侘傺兮，吾独穷困乎此时也。","tr":"我忧闷烦乱失意怅惘，唯独我在这时处境困窘。","p":0,"r":1},{"t":"宁溘死以流亡兮，余不忍为此态也。","tr":"我宁愿突然死去随流水而去，也不忍心做出这种丑态。","p":1,"r":1},{"t":"鸷鸟之不群兮，自前世而固然。","tr":"鹰隼不与凡鸟合群，从古以来就是这样。","p":1,"r":1},{"t":"何方圜之能周兮，夫孰异道而相安？","tr":"方的和圆的怎么能够吻合，志趣不同的人哪能相安无事？","p":1,"r":1},{"t":"屈心而抑志兮，忍尤而攘诟。","tr":"我委屈心意压抑情志，忍受责难承担耻辱。","p":1,"r":1},{"t":"伏清白以死直兮，固前圣之所厚。","tr":"保持清白而为正直死去，本来就是前代圣贤所推崇的。","p":1,"r":1},{"t":"悔相道之不察兮，延伫乎吾将反。","tr":"我后悔当初没有看清道路，久久伫立后打算返回。","p":2,"r":1},{"t":"回朕车以复路兮，及行迷之未远。","tr":"调转我的车回到原路，趁着迷路还不算太远。","p":2,"r":1},{"t":"步余马于兰皋兮，驰椒丘且焉止息。","tr":"让我的马在长兰草的水边漫步，奔向长椒的山丘暂且歇息。","p":2,"r":1},{"t":"进不入以离尤兮，退将复修吾初服。","tr":"进身朝廷不被接纳反遭罪过，退隐就重新整理我当初的衣服。","p":2,"r":1},{"t":"制芰荷以为衣兮，集芙蓉以为裳。","tr":"剪裁菱叶荷叶做上衣，采集荷花做下裳。","p":2,"r":1},{"t":"不吾知其亦已兮，苟余情其信芳。","tr":"没有人了解我也就算了，只要我的情操确实芬芳。","p":2,"r":1},{"t":"高余冠之岌岌兮，长余佩之陆离。","tr":"我把帽子加得高高的，把佩饰接得长长的，光彩闪耀。","p":3,"r":1},{"t":"芳与泽其杂糅兮，唯昭质其犹未亏。","tr":"芳香与润泽交织在一起，只有我光明的本质依然没有亏损。","p":3,"r":1},{"t":"忽反顾以游目兮，将往观乎四荒。","tr":"我忽然回头放眼远望，打算去观览四方遥远的地方。","p":3,"r":1},{"t":"佩缤纷其繁饰兮，芳菲菲其弥章。","tr":"佩饰缤纷而又繁多，芳香浓郁更加显著。","p":3,"r":1},{"t":"民生各有所乐兮，余独好修以为常。","tr":"人生各有各的爱好，我唯独爱好修洁，并把它当作常规。","p":3,"r":1},{"t":"虽体解吾犹未变兮，岂余心之可惩？","tr":"即使肢解我的身体我也不会改变，我的心怎么会因受惩罚而屈服？","p":3,"r":1}],"notes":[{"u":0,"w":"太息","m":"叹息","t":"实词","d":["大声呼喊","休息"]},{"u":0,"w":"民生","m":"人民的生活","t":"古今异义","d":["国计民生中的民生问题","人民的生命"]},{"u":1,"w":"修姱","m":"美好的品德，美好","t":"实词","d":["修饰容貌","长久美丽"]},{"u":1,"w":"鞿羁","m":"马缰绳和笼头，这里比喻约束自己","t":"词类活用","d":[]},{"u":1,"w":"替","m":"废弃，贬黜","t":"实词","d":["替代","更换"]},{"u":2,"w":"申","m":"重复，加上","t":"实词","d":["申明","伸展"]},{"u":4,"w":"灵修","m":"指楚王，对君主的美称","t":"典故","d":[]},{"u":5,"w":"蛾眉","m":"美丽的眉毛，比喻美好的品德才能","t":"典故","d":[]},{"u":5,"w":"谣诼","m":"造谣诽谤","t":"实词","d":["歌谣与祝祷","雕刻文字"]},{"u":6,"w":"偭","m":"违背","t":"实词","d":["面向","偏斜"]},{"u":8,"w":"侘傺","m":"失意而精神恍惚的样子","t":"实词","d":["自夸傲慢的样子","孤独畏缩的样子"]},{"u":9,"w":"溘死","m":"突然死去","t":"实词","d":["慢慢病死","为国而死"]},{"u":11,"w":"何方圜之能周兮","m":"宾语前置，即“何能周方圜”","t":"特殊句式","d":[]},{"u":13,"w":"伏清白以死直兮","m":"“以”表目的，为保持清白、耿直而死","t":"虚词","d":[]},{"u":14,"w":"相道","m":"观察道路","t":"实词","d":["互相引导","辅佐治国"]},{"u":17,"w":"离尤","m":"遭受罪过（“离”同“罹”，遭遇）","t":"通假","d":["离开过错","分离怨恨"]},{"u":24,"w":"好修","m":"爱好修洁","t":"实词","d":["喜欢修理","喜爱学习"]},{"u":25,"w":"惩","m":"因受创伤而戒止，这里指屈服","t":"实词","d":["惩罚","惩治"]}],"tricky":["鞿","謇","谇","茝","诼","偭","忳","侘傺","溘","鸷","岌"],"keyLines":[{"u":0,"hint":"《离骚》中，诗人表达对人民苦难深切同情的两句是："},{"u":3,"hint":"《离骚》中，诗人表明为追求理想即便多次死亡也不后悔的两句是："},{"u":5,"hint":"《离骚》中，诗人写自己遭人嫉妒、被诬陷的两句是："},{"u":9,"hint":"《离骚》中，诗人表示宁愿死去也不愿同流合污的两句是："},{"u":11,"hint":"《离骚》中，诗人以方圆不能吻合比喻志趣不同难以相容的两句是："},{"u":25,"hint":"《离骚》中，诗人表示即使被肢解也绝不改变志向的两句是："}],"appr":[{"q":"“制芰荷以为衣兮，集芙蓉以为裳”运用了什么手法？表达了什么？","a":"运用比喻象征：以芰荷、芙蓉做衣裳，象征诗人品格高洁、不与世俗同流合污；退隐之后依然保持修洁，体现出不改初衷的志向。"},{"q":"“虽九死其犹未悔”“虽体解吾犹未变兮”表现了诗人怎样的精神？","a":"两句语气递进，一个写“九死”，一个写“体解”，表明诗人为理想不惜付出生命，体现了坚贞不屈、执着追求的精神。"},{"q":"这段节选中“鸷鸟之不群”一句用的是什么手法？","a":"运用比兴象征，以鹰隼不与凡鸟合群，比喻自己志行高洁、不与世俗小人苟合，同时也暗含孤独之感，增强了诗句的形象性。"}]},{"id":"h2c-p03","volume":"h2c","title":"孔雀东南飞并序","author":"无名氏","dynasty":"东汉末年","genre":"乐府诗（叙事长诗）","kind":"poem","intro":"汉乐府叙事诗，最早见于南朝徐陵编的《玉台新咏》，题为《古诗为焦仲卿妻作》。诗叙东汉末年焦仲卿、刘兰芝夫妇被迫分离，双双殉情的故事，与《木兰诗》并称“乐府双璧”。","theme":"通过焦刘夫妇的爱情悲剧，控诉封建家长制和礼教对青年婚姻自由的摧残，歌颂忠贞不渝的爱情。","tags":["叙事","婚恋","批判礼教"],"units":[{"t":"汉末建安中，庐江府小吏焦仲卿妻刘氏，为仲卿母所遣，自誓不嫁。","tr":"东汉末年建安年间，庐江郡府里的小官焦仲卿的妻子刘氏，被仲卿的母亲赶回娘家，她发誓不再改嫁。","p":0,"r":0},{"t":"其家逼之，乃投水而死。仲卿闻之，亦自缢于庭树。","tr":"她的娘家逼她再嫁，她便投水自尽。仲卿听说后，也在庭院的树上自缢身亡。","p":0,"r":0},{"t":"时人伤之，为诗云尔。","tr":"当时的人为此悲伤，就写了这首诗。","p":0,"r":0},{"t":"孔雀东南飞，五里一徘徊。","tr":"孔雀向东南飞去，飞出五里就盘旋徘徊一次。","p":1,"r":1},{"t":"“十三能织素，十四学裁衣，十五弹箜篌，十六诵诗书。","tr":"我十三岁就能织出白绢，十四岁学会裁剪衣裳，十五岁会弹箜篌，十六岁能诵读诗书。","p":1,"r":1},{"t":"十七为君妇，心中常苦悲。","tr":"十七岁做了你的妻子，心里常常辛酸悲苦。","p":1,"r":1},{"t":"君既为府吏，守节情不移。","tr":"你既然在府里当小官，就忠于职守，对我的情意也不变。","p":1,"r":1},{"t":"贱妾留空房，相见常日稀。","tr":"我独自留守空房，我们相见的日子总是很少。","p":1,"r":1},{"t":"鸡鸣入机织，夜夜不得息。","tr":"鸡一叫我就上机织布，夜夜都得不到休息。","p":1,"r":1},{"t":"三日断五匹，大人故嫌迟。","tr":"三天织成五匹布，婆婆还故意嫌我织得慢。","p":1,"r":1},{"t":"非为织作迟，君家妇难为！","tr":"其实不是我织得慢，是你家的媳妇难当啊！","p":1,"r":1},{"t":"妾不堪驱使，徒留无所施，便可白公姥，及时相遣归。”","tr":"我受不了这样的使唤，留在这里也没有用处，你可以禀告婆婆，趁早把我送回娘家。","p":1,"r":1},{"t":"府吏得闻之，堂上启阿母：","tr":"焦仲卿听了这话，到堂上禀告母亲：","p":2,"r":0},{"t":"“儿已薄禄相，幸复得此妇，结发同枕席，黄泉共为友。","tr":"儿子本来就是福薄命微的人，幸而娶了这样的媳妇，结发做夫妻，同床共枕，死后也要在黄泉做伴。","p":2,"r":0},{"t":"共事二三年，始尔未为久，女行无偏斜，何意致不厚？”","tr":"一起生活才两三年，刚刚开始不算长久，她的品行没有偏差，为什么您对她不满意呢？","p":2,"r":0},{"t":"阿母谓府吏：“何乃太区区！","tr":"母亲对仲卿说：“你怎么这样愚拙固执！","p":3,"r":0},{"t":"此妇无礼节，举动自专由。","tr":"这个媳妇不懂礼节，一举一动都自作主张。","p":3,"r":0},{"t":"吾意久怀忿，汝岂得自由！","tr":"我心里早就怀着怒气，你哪能由着自己的性子！","p":3,"r":0},{"t":"东家有贤女，自名秦罗敷，可怜体无比，阿母为汝求。","tr":"东邻有位贤惠的姑娘，名叫秦罗敷，身姿可爱，无人可比，我替你去求娶她。","p":3,"r":0},{"t":"便可速遣之，遣去慎莫留！”","tr":"你就赶快把她休了，休了之后千万别留她！”","p":3,"r":0},{"t":"府吏长跪告：“伏惟启阿母，今若遣此妇，终老不复取！”","tr":"仲卿挺直身子跪着说：“恭敬地禀告母亲，如今要是休了这个媳妇，我到老也不再娶！”","p":3,"r":0},{"t":"阿母得闻之，槌床便大怒：","tr":"母亲听了，捶着坐榻大发雷霆：","p":3,"r":0},{"t":"“小子无所畏，何敢助妇语！吾已失恩义，会不相从许！”","tr":"“小子毫无顾忌，怎敢替媳妇说话！我对她早已恩断义绝，决不会依从你！”","p":3,"r":0},{"t":"府吏默无声，再拜还入户，","tr":"仲卿默默无声，拜了两拜，退回自己房里，","p":4,"r":0},{"t":"举言谓新妇，哽咽不能语：","tr":"开口对妻子说话，却哽咽得说不出话：","p":4,"r":0},{"t":"“我自不驱卿，逼迫有阿母。卿但暂还家，吾今且报府。","tr":"“我本不想赶你走，是母亲逼迫。你只管先回娘家，我现在暂且回府里办公。","p":4,"r":0},{"t":"不久当归还，还必相迎取。以此下心意，慎勿违吾语。”","tr":"不久我就回来，回来一定接你。请你因此放宽心意，千万不要违背我的话。”","p":4,"r":0},{"t":"新妇谓府吏：“勿复重纷纭。","tr":"妻子对仲卿说：“不要再反复纷扰了。","p":5,"r":0},{"t":"往昔初阳岁，谢家来贵门。奉事循公姥，进止敢自专？","tr":"从前冬末春初的时节，我离开娘家来到你家。侍奉公婆依从他们的意思，行动哪敢自作主张？","p":5,"r":0},{"t":"昼夜勤作息，伶俜萦苦辛。谓言无罪过，供养卒大恩，","tr":"日夜勤劳操作，孤单一人，苦辛缠身。以为没有过错，能终身奉养公婆来报答大恩，","p":5,"r":0},{"t":"仍更被驱遣，何言复来还！","tr":"却仍然被赶走，还说什么回来的话呢！","p":5,"r":0},{"t":"妾有绣腰襦，葳蕤自生光；红罗复斗帐，四角垂香囊；","tr":"我有绣花的短袄，华美光彩自然闪耀；有红罗做的双层斗帐，四角挂着香囊；","p":5,"r":0},{"t":"箱帘六七十，绿碧青丝绳，物物各自异，种种在其中。","tr":"六七十只箱笼，系着绿色青色的丝绳，样样东西各不相同，种种物品都在其中。","p":5,"r":0},{"t":"人贱物亦鄙，不足迎后人，留待作遗施，于今无会因。","tr":"人卑贱，东西也粗陋，不配留给后来的新人，留着送人吧，从今往后再没有相见的机会了。","p":5,"r":0},{"t":"时时为安慰，久久莫相忘！”","tr":"时时拿它们宽慰自己，长久不要把我忘记！”","p":5,"r":0},{"t":"鸡鸣外欲曙，新妇起严妆。","tr":"鸡叫了，天快要亮，新娘起身精心梳妆。","p":6,"r":1},{"t":"著我绣夹裙，事事四五通。","tr":"穿上我的绣花夹裙，每件饰物都反复整理了四五遍。","p":6,"r":1},{"t":"足下蹑丝履，头上玳瑁光。","tr":"脚上穿着丝鞋，头上的玳瑁发饰闪闪发光。","p":6,"r":1},{"t":"腰若流纨素，耳著明月珰。","tr":"腰间束着白绢，像流动的水波，耳朵上戴着明月般的珠耳坠。","p":6,"r":1},{"t":"指如削葱根，口如含朱丹。","tr":"手指像削尖的葱根一样白嫩，嘴唇像含着朱砂一样红润。","p":6,"r":1},{"t":"纤纤作细步，精妙世无双。","tr":"迈着轻盈的小步，姿态精致美妙，世上无双。","p":6,"r":1},{"t":"上堂拜阿母，阿母怒不止。","tr":"她走上厅堂拜别婆婆，婆婆怒气不消。","p":7,"r":0},{"t":"“昔作女儿时，生小出野里，本自无教训，兼愧贵家子。","tr":"“我当年做姑娘时，生在乡野之间，本来就缺少教养，又愧对你们这样的贵家子弟。","p":7,"r":0},{"t":"受母钱帛多，不堪母驱使。今日还家去，念母劳家里。”","tr":"受了您不少钱财，实在不能再胜任您的使唤。今天回娘家，惦念您在家操劳。”","p":7,"r":0},{"t":"却与小姑别，泪落连珠子：","tr":"退下来与小姑告别，眼泪像断线珠子一样落下：","p":7,"r":0},{"t":"“新妇初来时，小姑始扶床，今日被驱遣，小姑如我长。","tr":"“我刚嫁来时，小姑才扶着床学走路，今天我被赶走，小姑已经长得和我一样高了。","p":7,"r":0},{"t":"勤心养公姥，好自相扶将。初七及下九，嬉戏莫相忘。”","tr":"你要用心奉养公婆，好好自我扶持。每月初七和十九的游乐日，玩耍时别忘了我。”","p":7,"r":0},{"t":"出门登车去，涕落百余行。","tr":"出门登上车离去，眼泪落了上百行。","p":7,"r":0},{"t":"府吏马在前，新妇车在后，隐隐何甸甸，俱会大道口。","tr":"仲卿骑马走在前面，妻子的车跟在后面，车声隐隐隆隆，二人在大路口会合。","p":8,"r":1},{"t":"下马入车中，低头共耳语：","tr":"仲卿下马钻进车里，低下头与妻子贴耳细语：","p":8,"r":1},{"t":"“誓不相隔卿，且暂还家去。吾今且赴府，不久当还归，誓天不相负！”","tr":"“我发誓不会与你分离，你先暂时回娘家。我现在先去府里，不久就回来，对天发誓不负你！”","p":8,"r":1},{"t":"新妇谓府吏：“感君区区怀！君既若见录，不久望君来。","tr":"妻子对仲卿说：“感激你这片诚挚的心意！你既然这样记挂我，我就盼着你不久来接。","p":8,"r":1},{"t":"君当作磐石，妾当作蒲苇，蒲苇纫如丝，磐石无转移。","tr":"你应当像大石头，我就像蒲草芦苇，蒲苇柔韧如丝，磐石不会移动。","p":8,"r":1},{"t":"我有亲父兄，性行暴如雷，恐不任我意，逆以煎我怀。”","tr":"我有亲哥哥，脾气暴躁如雷，恐怕他不会依我的心意，我预先想到这些就心焦如煎。”","p":8,"r":1},{"t":"举手长劳劳，二情同依依。","tr":"抬起手来久久惆怅，两人心中都依依不舍。","p":8,"r":1},{"t":"入门上家堂，进退无颜仪。阿母大拊掌，不图子自归：","tr":"进了家门走上厅堂，进退之间无脸面可言。母亲拍着手掌，想不到女儿自己回来了：","p":9,"r":0},{"t":"“十三教汝织，十四能裁衣，十五弹箜篌，十六知礼仪，","tr":"“十三岁教你织布，十四岁你会裁衣，十五岁弹箜篌，十六岁懂得礼仪，","p":9,"r":0},{"t":"十七遣汝嫁，谓言无誓违。汝今何罪过，不迎而自归？”","tr":"十七岁送你出嫁，以为不会有什么差错。你如今犯了什么过错，没人来接就自己回来了？”","p":9,"r":0},{"t":"兰芝惭阿母：“儿实无罪过。”阿母大悲摧。","tr":"兰芝对母亲感到惭愧：“女儿确实没有过错。”母亲十分悲痛。","p":9,"r":0},{"t":"还家十余日，县令遣媒来。","tr":"回家十几天，县令派媒人上门来。","p":10,"r":0},{"t":"云有第三郎，窈窕世无双，年始十八九，便言多令才。","tr":"说有位三公子，姿态美好，世间无双，年纪刚十八九岁，口才很好又很有才华。","p":10,"r":0},{"t":"阿母谓阿女：“汝可去应之。”","tr":"母亲对女儿说：“你可以答应这门亲事。”","p":10,"r":0},{"t":"阿女含泪答：“兰芝初还时，府吏见叮咛，结誓不别离。","tr":"女儿含着眼泪回答：“兰芝刚回来时，仲卿再三叮嘱，发誓不分离。","p":10,"r":0},{"t":"今日违情义，恐此事非奇。自可断来信，徐徐更谓之。”","tr":"今天如果违背情义，恐怕这件事不妥当。还是回绝来人，以后慢慢再说。”","p":10,"r":0},{"t":"阿母白媒人：“贫贱有此女，始适还家门。","tr":"母亲对媒人说：“我家贫贱，有这么个女儿，刚出嫁又回了家门。","p":10,"r":0},{"t":"不堪吏人妇，岂合令郎君？幸可广问讯，不得便相许。”","tr":"连小吏的妻子都当不好，哪里配得上贵公子？请你多多打听别家，我不能马上答应。”","p":10,"r":0},{"t":"媒人去数日，寻遣丞请还。","tr":"媒人走后几天，县令又派县丞来请她回话。","p":11,"r":0},{"t":"说有兰家女，承籍有宦官。云有第五郎，娇逸未有婚。","tr":"说有位兰家的姑娘，门第出身官宦人家。说太守有位五公子，风流俊逸还未婚配。","p":11,"r":0},{"t":"遣丞为媒人，主簿通语言。","tr":"派县丞做媒人，主簿传话沟通。","p":11,"r":0},{"t":"直说“太守家，有此令郎君，既欲结大义，故遣来贵门。”","tr":"直说：“太守家里有这样一位公子，想与你家结亲，所以派我们来贵府。”","p":11,"r":0},{"t":"阿母谢媒人：“女子先有誓，老姥岂敢言！”","tr":"母亲辞谢媒人：“女儿先前已有誓言，我这老妇人怎敢开口答应！”","p":11,"r":0},{"t":"阿兄得闻之，怅然心中烦。","tr":"哥哥听说了，心里怅惘烦闷。","p":12,"r":0},{"t":"举言谓阿妹：“作计何不量！先嫁得府吏，后嫁得郎君，","tr":"他对妹妹说：“你打算盘怎么这样不考虑！先嫁了小吏，后嫁的是公子，","p":12,"r":0},{"t":"否泰如天地，足以荣汝身。不嫁义郎体，其往欲何云？”","tr":"好坏相差像天和地，足以使你光耀。不嫁这样的好人，将来你打算怎么办？”","p":12,"r":0},{"t":"兰芝仰头答：“理实如兄言。谢家事夫婿，中道还兄门。","tr":"兰芝抬头回答：“道理确实像哥哥说的那样。我离开娘家去侍奉丈夫，中途又回到哥哥门下。","p":12,"r":0},{"t":"处分适兄意，那得自任专！虽与府吏要，渠会永无缘。","tr":"怎么处置都顺从哥哥的心意，哪能自作主张！虽然跟仲卿有过约定，但和他终究没有缘分了。","p":12,"r":0},{"t":"登即相许和，便可作婚姻。”","tr":"马上答应下来，就可以办婚事。”","p":12,"r":0},{"t":"媒人下床去，诺诺复尔尔。","tr":"媒人从坐榻上起身，连声说“是是，好好”。","p":13,"r":0},{"t":"还部白府君：“下官奉使命，言谈大有缘。”","tr":"回到郡府禀告太守：“下官奉命办事，谈得很有缘分。”","p":13,"r":0},{"t":"府君得闻之，心中大欢喜。","tr":"太守听了，心里非常高兴。","p":13,"r":0},{"t":"视历复开书，便利此月内，六合正相应。","tr":"翻看历书又打开占书，这个月内正好吉利，六合相应。","p":13,"r":0},{"t":"“良吉三十日，今已二十七，卿可去成婚。”","tr":"“吉日是三十日，今天已是二十七，你可以去办婚事了。”","p":13,"r":0},{"t":"交语速装束，络绎如浮云。","tr":"互相传话赶快置办，人来人往像浮云一样络绎不绝。","p":13,"r":0},{"t":"青雀白鹄舫，四角龙子幡，婀娜随风转。","tr":"船上画着青雀白鹄，四角挂着绣龙的旗幡，随风袅袅飘转。","p":13,"r":0},{"t":"金车玉作轮，踯躅青骢马，流苏金镂鞍。","tr":"金装的车子玉做车轮，青白毛的骏马缓缓行走，马鞍上垂着流苏、镂着金饰。","p":13,"r":0},{"t":"赍钱三百万，皆用青丝穿，杂彩三百匹，交广市鲑珍。","tr":"带着三百万聘钱，都用青丝串着，三百匹各色丝绸，又从交州广州买来海味珍馐。","p":13,"r":0},{"t":"从人四五百，郁郁登郡门。","tr":"随从有四五百人，浩浩荡荡地聚到郡府门前。","p":13,"r":0},{"t":"阿母谓阿女：“适得府君书，明日来迎汝，何不作衣裳？莫令事不举！”","tr":"母亲对女儿说：“刚收到太守的信，明天就来接你，你怎么不做嫁衣？别让婚事办不成！”","p":14,"r":0},{"t":"阿女默无声，手巾掩口啼，泪落便如泻。","tr":"女儿默不作声，用手巾捂着嘴哭，眼泪像泉水涌流。","p":14,"r":0},{"t":"移我琉璃榻，出置前窗下。","tr":"她把自己的琉璃榻搬出来，放到前窗下面。","p":14,"r":0},{"t":"左手持刀尺，右手执绫罗。","tr":"左手拿着剪刀和尺，右手拿着绫罗。","p":14,"r":0},{"t":"朝成绣夹裙，晚成单罗衫。","tr":"早上做成绣花夹裙，晚上做成薄罗单衫。","p":14,"r":0},{"t":"晻晻日欲暝，愁思出门啼。","tr":"天色昏暗，太阳快落山了，她愁思满怀，走出门去哭泣。","p":14,"r":0},{"t":"府吏闻此变，因求假暂归。","tr":"仲卿听说了这个变故，就请假暂时回家。","p":15,"r":0},{"t":"未至二三里，摧藏马悲哀。","tr":"离兰芝家还有二三里，他的马悲伤哀鸣。","p":15,"r":0},{"t":"新妇识马声，蹑履相逢迎。","tr":"兰芝听出了马的叫声，趿着鞋出来迎接。","p":15,"r":0},{"t":"怅然遥相望，知是故人来。","tr":"她怅然远望，知道是旧日的爱人来了。","p":15,"r":0},{"t":"举手拍马鞍，嗟叹使心伤：","tr":"她抬手拍着马鞍，叹息得让人心伤：","p":15,"r":0},{"t":"“自君别我后，人事不可量。果不如先愿，又非君所详。","tr":"“自从你和我分别以后，世事难以预料。结果不能如先前的愿望，这又不是你能详知的。","p":15,"r":0},{"t":"我有亲父母，逼迫兼弟兄，以我应他人，君还何所望！”","tr":"我有亲生父母，又有兄长逼迫，要我嫁给别人，你回来还指望什么！”","p":15,"r":0},{"t":"府吏谓新妇：“贺卿得高迁！","tr":"仲卿对她说：“祝贺你高升了！","p":15,"r":0},{"t":"磐石方且厚，可以卒千年；蒲苇一时纫，便作旦夕间。","tr":"磐石方正又厚重，可以保持千年；蒲苇只是一时柔韧，转眼就会折断。","p":15,"r":0},{"t":"卿当日胜贵，吾独向黄泉！”","tr":"你将一天比一天显贵，我却独自走向黄泉！”","p":15,"r":0},{"t":"新妇谓府吏：“何意出此言！","tr":"兰芝对仲卿说：“你怎么说出这样的话！","p":15,"r":0},{"t":"同是被逼迫，君尔妾亦然。黄泉下相见，勿违今日言！”","tr":"同样都是被人逼迫，你是这样，我也是这样。黄泉之下再相见，不要违背今天的话！”","p":15,"r":0},{"t":"执手分道去，各各还家门。","tr":"两人握手告别，各自回家。","p":15,"r":0},{"t":"生人作死别，恨恨那可论？念与世间辞，千万不复全！","tr":"活着的人却像死别，怨恨哪里说得尽？想到就要告别人世，千万种心思都无法保全！","p":15,"r":0},{"t":"府吏还家去，上堂拜阿母：","tr":"仲卿回到家里，走上厅堂拜见母亲：","p":16,"r":0},{"t":"“今日大风寒，寒风摧树木，严霜结庭兰。","tr":"“今天风大天寒，寒风摧折树木，严霜冻坏了庭院里的兰花。","p":16,"r":0},{"t":"儿今日冥冥，令母在后单。故作不良计，勿复怨鬼神！","tr":"儿子今天要走向黑暗，让母亲日后孤单。我故意做出不好的打算，请不要怨恨鬼神！","p":16,"r":0},{"t":"命如南山石，四体康且直！”","tr":"祝愿母亲寿命像南山石一样长久，身体健康硬朗！”","p":16,"r":0},{"t":"阿母得闻之，零泪应声落：","tr":"母亲听了，眼泪随着话音落下：","p":16,"r":0},{"t":"“汝是大家子，仕宦于台阁。慎勿为妇死，贵贱情何薄！","tr":"“你是大家子弟，在官府中做官。千万别为一个妇人去死，贵与贱之间的情分何必那样看重！","p":16,"r":0},{"t":"东家有贤女，窈窕艳城郭，阿母为汝求，便复在旦夕。”","tr":"东邻有位贤惠的女子，容貌美好，艳压全城，我替你去求娶，很快就能办成。”","p":16,"r":0},{"t":"府吏再拜还，长叹空房中，作计乃尔立。","tr":"仲卿拜了两拜退回房，在空房里长叹，主意就这样定了。","p":16,"r":0},{"t":"转头向户里，渐见愁煎迫。","tr":"他转头望向屋里，渐渐觉得愁苦逼迫。","p":16,"r":0},{"t":"其日牛马嘶，新妇入青庐。","tr":"那天牛马嘶叫，新娘走进青布搭成的喜帐。","p":17,"r":0},{"t":"奄奄黄昏后，寂寂人定初。","tr":"黄昏之后天色昏暗，夜深人静时刚入定。","p":17,"r":0},{"t":"“我命绝今日，魂去尸长留！”","tr":"“我的性命今天终结，魂魄离去，尸体长留人间！”","p":17,"r":0},{"t":"揽裙脱丝履，举身赴清池。","tr":"她提起裙子脱下丝鞋，纵身跳进清水池塘。","p":17,"r":0},{"t":"府吏闻此事，心知长别离，","tr":"仲卿听说了这件事，心里明白与她永远分离了，","p":17,"r":0},{"t":"徘徊庭树下，自挂东南枝。","tr":"在庭院的树下徘徊，就把自己挂在东南的树枝上。","p":17,"r":0},{"t":"两家求合葬，合葬华山傍。","tr":"两家请求把他们合葬，合葬在华山旁边。","p":18,"r":1},{"t":"东西植松柏，左右种梧桐。","tr":"东西两边种上松柏，左右两侧栽上梧桐。","p":18,"r":1},{"t":"枝枝相覆盖，叶叶相交通。","tr":"枝条互相覆盖，叶子互相交错相通。","p":18,"r":1},{"t":"中有双飞鸟，自名为鸳鸯，","tr":"树中有一对飞鸟，自称是鸳鸯，","p":18,"r":1},{"t":"仰头相向鸣，夜夜达五更。","tr":"它们抬头相对鸣叫，夜夜叫到五更天。","p":18,"r":1},{"t":"行人驻足听，寡妇起彷徨。","tr":"路人停下脚步倾听，寡妇听了起身徘徊难眠。","p":18,"r":1},{"t":"多谢后世人，戒之慎勿忘！","tr":"郑重告诉后世的人，要引以为戒，千万不要忘记！","p":18,"r":1}],"notes":[{"u":0,"w":"为仲卿母所遣","m":"“为……所……”表被动，被仲卿母亲遣送","t":"特殊句式"},{"u":4,"w":"素","m":"白色生绢","t":"实词","d":["朴素","颜色单一"]},{"u":4,"w":"箜篌","m":"古代的一种弦乐器","t":"实词","d":["一种管乐器","一种打击乐器"]},{"u":5,"w":"君","m":"你，对丈夫的称呼","t":"实词","d":["君主","品德高尚的人"]},{"u":6,"w":"守节","m":"坚守职守","t":"古今异义","d":["古代女子为亡夫不再嫁","保持名节"]},{"u":9,"w":"大人","m":"对长辈的称呼，这里指婆婆","t":"古今异义","d":["成年人","官位高的人"]},{"u":11,"w":"公姥","m":"公公和婆婆","t":"实词","d":["官员和老妇","祖父和外祖母"]},{"u":13,"w":"结发","m":"束发，古代男女成年时把头发束起，指刚成年就成婚","t":"古今异义","d":["梳理头发","头发扎成发髻"]},{"u":15,"w":"区区","m":"愚拙，固执（后文“感君区区怀”则指诚挚的心意）","t":"一词多义"},{"u":20,"w":"取","m":"通“娶”，娶妻","t":"通假","d":["拿取","获取"]},{"u":22,"w":"会","m":"终究，一定","t":"实词","d":["会合","领会"]},{"u":19,"w":"遣","m":"休弃，送回娘家","t":"实词","d":["派遣","发送"]},{"u":28,"w":"初阳岁","m":"冬末春初的时节","t":"典故"},{"u":28,"w":"谢家","m":"辞别娘家","t":"实词","d":["感谢家人","向家人道歉"]},{"u":29,"w":"伶俜","m":"孤独的样子","t":"实词","d":["身材纤细","行走缓慢"]},{"u":31,"w":"葳蕤","m":"华美繁盛的样子","t":"实词","d":["低垂下坠","柔软细密"]},{"u":35,"w":"严妆","m":"精心梳妆","t":"实词","d":["严肃的装束","严寒时的穿戴"]},{"u":46,"w":"扶将","m":"扶持，照顾","t":"实词","d":["将领","将要"]},{"u":46,"w":"下九","m":"古代妇女聚会游乐的日子，指每月十九","t":"典故"},{"u":52,"w":"磐石","m":"厚重而方正的大石头","t":"实词","d":["磨刀的石头","坚硬的矿石"]},{"u":52,"w":"纫","m":"同“韧”，柔软而有韧性","t":"通假","d":["缝纫","穿线"]},{"u":55,"w":"拊掌","m":"拍手","t":"实词","d":["抚摸手掌","合掌致敬"]},{"u":55,"w":"不图","m":"想不到","t":"古今异义","d":["不去画图","不贪图"]},{"u":60,"w":"令才","m":"美好的才能","t":"实词","d":["命令之才","法令人才"]},{"u":73,"w":"否泰","m":"否（pǐ）和泰，《周易》中的两个卦名，分别指坏运与好运","t":"典故"},{"u":75,"w":"要","m":"同“约”，约定","t":"通假","d":["需要","要求"]},{"u":75,"w":"渠","m":"他","t":"实词","d":["水渠","他们"]},{"u":116,"w":"青庐","m":"用青布搭成的举行婚礼的篷帐","t":"典故"},{"u":117,"w":"人定","m":"夜深人静之时","t":"实词","d":["人们安定下来","人心稳定"]},{"u":94,"w":"摧藏","m":"悲伤，伤痛","t":"实词","d":["摧毁收藏","隐藏起来"]},{"u":26,"w":"下心意","m":"使心意放松，宽心（“下”为使动用法）","t":"词类活用"}],"tricky":["箜篌","蒲苇","磐石","伶俜","葳蕤","鸳鸯","玳瑁","踯躅"],"keyLines":[{"u":4,"hint":"《孔雀东南飞》中，刘兰芝自述少女时代多才多艺的四句是："},{"u":8,"hint":"《孔雀东南飞》中，写兰芝日夜辛勤织作、得不到休息的两句是："},{"u":52,"hint":"《孔雀东南飞》中，兰芝以物作比，表示坚贞爱情的四句是："},{"u":38,"hint":"《孔雀东南飞》中，以比喻手法描写兰芝腰肢、耳饰精美的两句是："},{"u":39,"hint":"《孔雀东南飞》中，以比喻描写兰芝手指与嘴唇的两句是："},{"u":122,"hint":"《孔雀东南飞》中，交代焦刘二人死后合葬之处的两句是："},{"u":124,"hint":"《孔雀东南飞》结尾，以松柏梧桐象征二人爱情永不分离的两句是："},{"u":128,"hint":"《孔雀东南飞》结尾，作者告诫后世人的两句是："}],"appr":[{"q":"诗中兰芝在被遣前后的“妆”与“别”如何体现人物性格？","a":"兰芝被遣时从容梳妆、精心打扮，辞别婆婆和小姑时礼数周全，表现出她自尊、坚强、知礼又重情的性格；外表的从容与内心的悲痛形成反差，更显动人。"},{"q":"“君当作磐石，妾当作蒲苇”用了什么手法？表达了什么感情？","a":"运用比喻，磐石坚固不移，蒲苇柔韧如丝，二者相互映衬，表达夫妻互相坚守、爱情坚贞的愿望；同时暗含兰芝对前途的忧虑，使抒情含蓄深沉。"},{"q":"结尾部分写松柏梧桐和鸳鸯，有什么作用？","a":"以松柏、梧桐枝叶交错，鸳鸯夜夜悲鸣，象征二人死后爱情不灭，带有浪漫主义色彩；既给悲剧添一抹亮色，也寄托了人们对美好爱情的向往，并引出“戒之慎勿忘”的劝诫。"}]},{"id":"h2c-p04","title":"蜀道难","author":"李白","dynasty":"唐","genre":"乐府旧题（七言歌行）","intro":"李白沿用乐府旧题创作的歌行，约作于初入长安之后。诗人以奇崛的想象和夸张，描绘蜀道的高峻险绝。","theme":"极力渲染蜀道的艰险雄奇，抒发对山川壮美的惊叹，并寄寓对蜀地形势险要、易生祸乱的忧虑。","tags":["写景","抒怀","咏叹"],"volume":"h2c","kind":"poem","units":[{"t":"噫吁嚱，危乎高哉！","tr":"唉呀呀，多么高峻险要啊！","p":0,"r":1},{"t":"蜀道之难，难于上青天！","tr":"蜀道的艰难，比登上青天还要难！","p":0,"r":1},{"t":"蚕丛及鱼凫，开国何茫然！","tr":"蚕丛和鱼凫两位古蜀王，开国的事迹多么渺茫难考！","p":1,"r":1},{"t":"尔来四万八千岁，不与秦塞通人烟。","tr":"从那时以来经历了四万八千年，蜀地与秦地的边关一直没有人烟往来。","p":1,"r":1},{"t":"西当太白有鸟道，可以横绝峨眉巅。","tr":"西边正对太白山，只有鸟儿能飞过的小道，可以横越峨眉山的顶峰。","p":1,"r":1},{"t":"地崩山摧壮士死，然后天梯石栈相钩连。","tr":"山崩地裂，壮士们接连死去，之后才有了天梯般的山路和石头栈道相互连接。","p":1,"r":1},{"t":"上有六龙回日之高标，下有冲波逆折之回川。","tr":"上面有六条龙拉着太阳车也要绕道回转的高峰，下面有波浪冲击、漩涡倒流的曲折河流。","p":2,"r":1},{"t":"黄鹤之飞尚不得过，猿猱欲度愁攀援。","tr":"黄鹤飞都难以飞过去，猿猴想要越过也愁于无处攀爬。","p":2,"r":1},{"t":"青泥何盘盘，百步九折萦岩峦。","tr":"青泥岭是多么曲折盘绕，走一百步要转九个弯，绕着山岩峰峦。","p":2,"r":1},{"t":"扪参历井仰胁息，以手抚膺坐长叹。","tr":"伸手可摸到参星，经过井宿，仰头屏住呼吸，用手抚着胸口坐下长叹。","p":2,"r":1},{"t":"问君西游何时还？畏途巉岩不可攀。","tr":"请问你西游蜀地什么时候回来？那可怕的路途险峻陡峭，难以攀登。","p":3,"r":1},{"t":"但见悲鸟号古木，雄飞雌从绕林间。","tr":"只看见悲鸣的鸟儿在古树上啼叫，雄鸟飞，雌鸟跟，在林间盘旋。","p":3,"r":1},{"t":"又闻子规啼夜月，愁空山。","tr":"又听见杜鹃在月夜里啼叫，哀愁的声音回荡在空寂的山里。","p":3,"r":1},{"t":"蜀道之难，难于上青天，使人听此凋朱颜！","tr":"蜀道的艰难，比登上青天还要难，让人听了这话就吓得容颜失色！","p":3,"r":1},{"t":"连峰去天不盈尺，枯松倒挂倚绝壁。","tr":"连绵的山峰离天不到一尺，枯松倒挂在悬崖绝壁上。","p":3,"r":1},{"t":"飞湍瀑流争喧豗，砯崖转石万壑雷。","tr":"飞奔的急流和瀑布争相喧闹，水击山崖，翻滚着石头，万道山谷里雷声轰鸣。","p":3,"r":1},{"t":"其险也如此，嗟尔远道之人胡为乎来哉！","tr":"蜀道的险要就是这样，唉，你这远道而来的人为什么要来呢！","p":3,"r":1},{"t":"剑阁峥嵘而崔嵬，一夫当关，万夫莫开。","tr":"剑阁高峻巍峨，一个人守住关口，一万个人也攻不开。","p":4,"r":1},{"t":"所守或匪亲，化为狼与豺。","tr":"把守关口的人如果不是可靠的亲信，就可能变成豺狼作乱。","p":4,"r":1},{"t":"朝避猛虎，夕避长蛇，磨牙吮血，杀人如麻。","tr":"早晨要躲避猛虎，晚上要躲避长蛇，它们磨着牙齿吸着人血，杀人像割麻一样多。","p":4,"r":1},{"t":"锦城虽云乐，不如早还家。","tr":"锦官城虽然说是快乐的地方，还不如早点回家。","p":4,"r":1},{"t":"蜀道之难，难于上青天，侧身西望长咨嗟！","tr":"蜀道的艰难，比登上青天还要难，我侧着身子向西远望，不住地长叹！","p":4,"r":1}],"notes":[{"u":0,"w":"噫吁嚱","m":"惊叹声，表示惊异与赞叹","t":"实词","d":["悲伤叹息声","呼喊声"]},{"u":3,"w":"尔来","m":"从那时以来","t":"古今异义","d":["你来","近来"]},{"u":4,"w":"横绝","m":"横越，横渡","t":"实词","d":["横向断绝","横加阻拦"]},{"u":5,"w":"钩连","m":"连接，勾连","t":"实词","d":["弯曲缠绕","钩住拉扯"]},{"u":6,"w":"回川","m":"有漩涡的河流","t":"实词","d":["返回的河流","弯曲的山川"]},{"u":9,"w":"扪参历井","m":"摸到参星、经过井宿（夸张）","t":"典故"},{"u":10,"w":"巉岩","m":"高峻陡峭的山岩","t":"实词","d":["险要的关口","深邃的山谷"]},{"u":13,"w":"凋朱颜","m":"使红润的容颜凋零失色，“凋”为使动用法","t":"词类活用"},{"u":15,"w":"喧豗","m":"喧闹声","t":"实词","d":["飞溅的水花","回荡的余声"]},{"u":15,"w":"砯崖","m":"水撞击山崖发出的声音","t":"实词","d":["石头滚落","水雾弥漫"]},{"u":21,"w":"咨嗟","m":"叹息","t":"实词","d":["商议","称赞"]},{"u":18,"w":"所守或匪亲","m":"“匪”同“非”，不是","t":"通假","d":["非常","盗匪"]}],"tricky":["蚕","凫","猱","巉","豗","砯","嵬"],"keyLines":[{"u":1,"hint":"《蜀道难》中，直接抒发对蜀道艰险惊叹的诗句是："},{"u":2,"hint":"《蜀道难》中，诗人写蜀地开国年代久远、事迹渺茫的诗句是："},{"u":5,"hint":"《蜀道难》中，写开辟蜀道的艰难、付出牺牲的两句是："},{"u":7,"hint":"《蜀道难》中，以飞禽走兽难以逾越来衬托山势高险的两句是："},{"u":14,"hint":"《蜀道难》中，写山峰高耸入云、枯松倒挂的两句是："},{"u":17,"hint":"《蜀道难》中，写剑阁地势险要、易守难攻的三句是："}],"appr":[{"q":"全诗反复咏叹“蜀道之难，难于上青天”，有什么作用？","a":"这一句三次出现，既是诗眼，又起到分层和回环的作用：每次出现都伴随对蜀道不同角度的描写，使情感层层加深，节奏回环往复，强化了惊叹的气势。"},{"q":"诗中“黄鹤之飞尚不得过，猿猱欲度愁攀援”运用了什么手法？","a":"运用夸张和衬托，用善飞的黄鹤、善攀的猿猴都难以通过，从侧面写出山势高峻，比正面描写更有想象力，也更显蜀道的险绝。"},{"q":"诗歌在句式和语言上有什么特点？","a":"诗中长短句错落，三言到十一言不等，散文式句法和骈句交替；多用夸张、神话传说和拟人、设问，语言奔放雄奇，充分体现李白浪漫主义的风格。"}]},{"id":"h2c-p05","title":"蜀相","author":"杜甫","dynasty":"唐","genre":"七言律诗","intro":"唐肃宗上元元年，杜甫在成都，游览城外的诸葛亮祠堂，凭吊这位蜀汉丞相，写下这首咏史怀古诗。","theme":"赞颂诸葛亮的雄才大略和忠诚，惋惜他壮志未酬身先死，同时寄托诗人自己忧国忧时的情怀。","tags":["咏史","怀古","抒怀"],"volume":"h2c","kind":"poem","units":[{"t":"丞相祠堂何处寻？锦官城外柏森森。","tr":"要寻找丞相的祠堂在哪里呢？就在锦官城外，那里柏树茂密森然。","p":0,"r":1},{"t":"映阶碧草自春色，隔叶黄鹂空好音。","tr":"台阶上碧草映衬，自己显出一派春色，树叶间的黄鹂徒然唱着动听的歌。","p":0,"r":1},{"t":"三顾频烦天下计，两朝开济老臣心。","tr":"为了平定天下的大计，刘备多次拜访；他辅佐两代君主，开创基业、济助危难，一片老臣的忠心。","p":0,"r":1},{"t":"出师未捷身先死，长使英雄泪满襟。","tr":"出兵作战还没取胜他却先去世了，这使后来的英雄们常常泪湿衣襟。","p":0,"r":1}],"notes":[{"u":0,"w":"锦官城","m":"成都的别称","t":"典故"},{"u":0,"w":"森森","m":"树木茂盛繁密的样子","t":"实词","d":["阴森可怕的样子","庄严肃穆的样子"]},{"u":1,"w":"自","m":"自顾自地，徒然","t":"实词","d":["自己","从"]},{"u":1,"w":"空","m":"徒然，白白地","t":"实词","d":["天空","空虚"]},{"u":2,"w":"三顾","m":"指刘备三次拜访诸葛亮","t":"典故"},{"u":2,"w":"频烦","m":"频繁地烦劳，多次拜访","t":"实词","d":["频繁烦恼","频繁发愁"]},{"u":2,"w":"天下计","m":"统一天下的大计","t":"实词","d":["天下的计策","天下人的计谋"]},{"u":2,"w":"两朝","m":"指蜀汉先主刘备和后主刘禅两代","t":"古今异义","d":["两个朝代","两个官职"]},{"u":2,"w":"开济","m":"开创基业、匡济危难","t":"实词","d":["开拓济渡","开通水路"]}],"tricky":["祠","柏","黄鹂","频","襟"],"keyLines":[{"u":2,"hint":"《蜀相》中，概括诸葛亮出山辅佐刘备、谋划天下大计的两句是："},{"u":3,"hint":"《蜀相》中，惋惜诸葛亮壮志未酬、表达后世英雄共同悲慨的两句是："},{"u":1,"hint":"《蜀相》中，以春景写祠堂冷清、含惋惜之情的两句是："}],"appr":[{"q":"颔联“映阶碧草自春色，隔叶黄鹂空好音”用了什么手法？表达了什么感情？","a":"以乐景写哀情：碧草、黄鹂本是春日美景，但“自”“空”二字写出它们无人欣赏，反衬祠堂的冷落，寄托了对诸葛亮的敬仰和对其身后寂寞的感慨。"},{"q":"“出师未捷身先死，长使英雄泪满襟”为何感人？","a":"这两句既是对诸葛亮壮志未酬的惋惜，也融入杜甫自己忧国忧时、怀才不遇的感慨，“英雄”不仅指古人，也包括诗人自己，所以格外沉痛，常被后人引用。"}]},{"id":"h2c-p06","title":"望海潮·东南形胜","author":"柳永","dynasty":"北宋","genre":"词（长调）","intro":"柳永作的词，用来赠给杭州的地方长官（一说孙何）。词中铺陈杭州的形胜与繁华，是宋词中描写都市风貌的名篇。","theme":"极写杭州山水的秀美和城市的富庶繁华，既是对地方长官的颂扬，也体现了太平盛世的景象。","tags":["写景","咏物","都市风光"],"volume":"h2c","kind":"poem","units":[{"t":"东南形胜，三吴都会，钱塘自古繁华。","tr":"杭州位于东南，地势优越，是三吴的都会，钱塘从古以来就很繁华。","p":0,"r":1},{"t":"烟柳画桥，风帘翠幕，参差十万人家。","tr":"烟雾般的垂柳，彩绘的桥梁，挡风的帘子和青绿的帷幕，高低错落，约有十万户人家。","p":0,"r":1},{"t":"云树绕堤沙，怒涛卷霜雪，天堑无涯。","tr":"高耸如云的树木环绕着沙堤，汹涌的怒涛卷起霜雪般的浪花，钱塘江像天然的壕沟，浩渺无边。","p":0,"r":1},{"t":"市列珠玑，户盈罗绮，竞豪奢。","tr":"市场上陈列着珍珠宝玉，家家户户都储满了绫罗绸缎，人们竞相比富斗奢。","p":0,"r":1},{"t":"重湖叠巘清嘉。","tr":"里湖、外湖和重重叠叠的山峰，清秀美好。","p":1,"r":1},{"t":"有三秋桂子，十里荷花。","tr":"有秋天飘香的桂花，有十里盛开的荷花。","p":1,"r":1},{"t":"羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。","tr":"晴天里羌笛悠扬，夜晚里采菱的歌声飘荡，钓鱼的老人和采莲的姑娘都欢乐嬉笑。","p":1,"r":1},{"t":"千骑拥高牙，乘醉听箫鼓，吟赏烟霞。","tr":"成千的骑兵簇拥着高高的牙旗，长官乘着酒兴听着箫鼓，吟诗赏玩山水景色。","p":1,"r":1},{"t":"异日图将好景，归去凤池夸。","tr":"将来把这美好的景色画下来，回到朝廷向人夸耀。","p":1,"r":1}],"notes":[{"u":0,"w":"形胜","m":"地理位置优越，地势险要","t":"古今异义","d":["形状优美","形象出众"]},{"u":0,"w":"三吴","m":"指吴兴、吴郡、会稽（说法不一），泛指苏州、杭州一带","t":"典故"},{"u":1,"w":"参差","m":"高低错落，大小不齐","t":"实词","d":["几乎相同","杂乱无章"]},{"u":2,"w":"天堑","m":"天然的壕沟，这里指钱塘江","t":"实词","d":["高大的城墙","深邃的峡谷"]},{"u":3,"w":"珠玑","m":"珠宝，泛指珍宝","t":"实词","d":["珍珠和玉器","金银铜钱"]},{"u":3,"w":"罗绮","m":"丝绸织品","t":"实词","d":["绫罗锦被","彩色画卷"]},{"u":4,"w":"巘","m":"山峰，山岭","t":"实词","d":["山谷","水边"]},{"u":6,"w":"羌管","m":"羌笛","t":"实词","d":["管理羌人","官府的乐器"]},{"u":7,"w":"高牙","m":"高高的牙旗，指仪仗，代指地方长官","t":"典故"},{"u":8,"w":"凤池","m":"凤凰池，指中书省，代指朝廷","t":"典故"}],"tricky":["珠玑","罗绮","叠巘","羌","凤池"],"keyLines":[{"u":1,"hint":"《望海潮》中，描写杭州街巷景色秀丽、住宅众多的两句（或三句）是："},{"u":2,"hint":"《望海潮》中，描写钱塘江潮水汹涌、江面辽阔的三句是："},{"u":3,"hint":"《望海潮》中，描写杭州市场繁荣、人民生活富裕奢华的句子是："},{"u":5,"hint":"《望海潮》中，描写西湖秋桂夏荷的两句是："},{"u":6,"hint":"《望海潮》中，描写西湖上人们昼夜欢乐、安居乐业的句子是："}],"appr":[{"q":"上阕如何由大到小写出杭州的繁华？","a":"先从“东南形胜，三吴都会”概括地理位置和地位，再写柳、桥、帘、幕、十万人家，接着写江潮的壮阔，最后以市场珠宝、家户绸缎写富庶，由宏观到具体，层层铺展。"},{"q":"下阕写西湖景色，表现了词人怎样的情感？","a":"下阕写湖山秀美、桂子荷花，又写人们笙歌嬉游，并以长官的游赏作结，表达了对杭州美景的赞美和对太平景象的歌颂，兼有向长官献词的意味。"}]},{"id":"h2c-p07","title":"扬州慢·淮左名都","author":"姜夔","dynasty":"南宋","genre":"词（自度曲）","intro":"淳熙三年冬至，姜夔路过扬州，见金兵南侵后的城池荒凉破败，感慨今昔，自度此曲。","theme":"借扬州在战争劫掠之后的荒凉萧条，抒发对昔日繁华的追怀与对国事的感伤。","tags":["怀古","伤今","抒怀"],"volume":"h2c","kind":"poem","units":[{"t":"淳熙丙申至日，予过维扬。夜雪初霁，荠麦弥望。","tr":"淳熙三年冬至那天，我路过扬州。夜里的雪刚停，放眼望去满是荠菜和野麦。","p":0,"r":0},{"t":"入其城则四顾萧条，寒水自碧，暮色渐起，戍角悲吟。","tr":"进入城中，只见四周一片萧条，冰冷的河水独自泛着碧色，暮色渐渐降临，守城的号角声悲凉地响起。","p":0,"r":0},{"t":"予怀怆然，感慨今昔，因自度此曲。","tr":"我心里悲伤，感慨今昔变迁，于是自己创作了这支曲子。","p":0,"r":0},{"t":"千岩老人以为有《黍离》之悲也。","tr":"千岩老人认为这首词有《黍离》那样的亡国之悲。","p":0,"r":0},{"t":"淮左名都，竹西佳处，解鞍少驻初程。","tr":"扬州是淮河东面的著名都会，竹西亭是风景优美的地方，我解下马鞍在这里稍作停留，这是旅程的开端。","p":1,"r":1},{"t":"过春风十里，尽荠麦青青。","tr":"走过当年春风中繁华的十里长街，如今满眼都是青青的荠菜和野麦。","p":1,"r":1},{"t":"自胡马窥江去后，废池乔木，犹厌言兵。","tr":"自从金兵窥伺长江、大举南下之后，荒废的池台和老树，似乎都厌恶谈起战争。","p":1,"r":1},{"t":"渐黄昏，清角吹寒，都在空城。","tr":"天渐渐黄昏，凄清的号角吹出寒意，声音在空荡荡的城中回响。","p":1,"r":1},{"t":"杜郎俊赏，算而今重到须惊。","tr":"杜牧是很会欣赏的人，估计他如今重来，也一定会感到惊讶。","p":2,"r":1},{"t":"纵豆蔻词工，青楼梦好，难赋深情。","tr":"即便他的豆蔻词写得工巧，青楼梦做得美好，也难以抒写此刻的深情。","p":2,"r":1},{"t":"二十四桥仍在，波心荡、冷月无声。","tr":"二十四桥依然还在，桥下的水波荡漾，冷月的影子在水中无声晃动。","p":2,"r":1},{"t":"念桥边红药，年年知为谁生！","tr":"想起桥边的芍药，年年盛开，不知是为谁而生！","p":2,"r":1}],"notes":[{"u":0,"w":"至日","m":"冬至这一天","t":"古今异义","d":["到达的日子","最好的日子"]},{"u":0,"w":"维扬","m":"扬州的别称","t":"典故"},{"u":0,"w":"霁","m":"雨雪停止，天放晴","t":"实词","d":["下雨","云雾弥漫"]},{"u":0,"w":"弥望","m":"满眼，放眼望去全是","t":"实词","d":["远远眺望","隐约看见"]},{"u":1,"w":"戍角","m":"军营中的号角","t":"实词","d":["边塞的山角","守卫的兵器"]},{"u":3,"w":"黍离","m":"《诗经·王风》篇名，后用来表示对故国沦亡的悲叹","t":"典故"},{"u":6,"w":"胡马窥江","m":"指金兵南侵，窥视长江一带","t":"典故"},{"u":8,"w":"杜郎","m":"指杜牧","t":"典故"},{"u":9,"w":"豆蔻","m":"杜牧曾以“豆蔻梢头二月初”形容少女，这里借指杜牧的词句","t":"典故"},{"u":10,"w":"二十四桥","m":"扬州的桥名（也有说法指二十四座桥）","t":"典故"},{"u":11,"w":"红药","m":"红芍药","t":"实词","d":["红色的药材","红花草"]}],"tricky":["荠麦","怆","豆蔻","窥","红药"],"keyLines":[{"u":5,"hint":"《扬州慢》中，以“荠麦青青”今昔对比，写繁华扬州变得荒凉的两句是："},{"u":6,"hint":"《扬州慢》中，用拟人手法，写战争创伤使废池乔木都厌恶谈兵的三句是："},{"u":7,"hint":"《扬州慢》上阕结尾，以声音写空城荒凉的三句是："},{"u":10,"hint":"《扬州慢》中，以冷月、水波营造凄清气氛的两句是："},{"u":11,"hint":"《扬州慢》结尾，以物喻情、表达无人欣赏的感伤的两句是："}],"appr":[{"q":"“废池乔木，犹厌言兵”用了什么手法？有什么表达效果？","a":"运用拟人手法，写荒废的池台、古老的大树都厌恶谈论战争，从侧面表现金兵南侵给扬州造成的深重创伤，以物写人，含蓄而沉痛。"},{"q":"词的结尾“念桥边红药，年年知为谁生”表达了什么？","a":"以红药自开自落、无人欣赏，反衬扬州城的荒凉与无人问津，抒发对昔日繁华的追念、对国破家残的伤感，以问句收束，余味深长。"},{"q":"这首词在写法上有哪些特点？","a":"上阕写眼前所见，用“春风十里”“荠麦青青”今昔对比；下阕借杜牧的诗句想象和感叹；写景以冷色调的景物营造清冷气氛，借景抒情，含蓄深沉。"}]},{"id":"h2c-p08","title":"拟行路难·其四","author":"鲍照","dynasty":"南朝宋","genre":"乐府（七言歌行）","intro":"鲍照出身寒门，仕途坎坷。他模仿乐府旧题《行路难》写了十八首，这是其中的第四首，抒发寒士在门阀制度下怀才不遇的悲愤。","theme":"借水流东西南北各异，说人生命运各有不同，感叹世路艰难，而满腔愤懑只能强忍不言。","tags":["抒怀","怀才不遇","人生感慨"],"volume":"h2c","kind":"poem","units":[{"t":"泻水置平地，各自东西南北流。","tr":"把水倒在平地上，它们各自向东西南北流去。","p":0,"r":1},{"t":"人生亦有命，安能行叹复坐愁？","tr":"人生也各有命运，怎能整天走着叹息、坐着发愁？","p":0,"r":1},{"t":"酌酒以自宽，举杯断绝歌路难。","tr":"斟酒来宽慰自己，举起酒杯，就停止唱《行路难》吧。","p":0,"r":1},{"t":"心非木石岂无感？吞声踯躅不敢言。","tr":"心不是木头石头，怎能没有感触？只能强忍声音，徘徊不前，不敢说出口。","p":0,"r":1}],"notes":[{"u":0,"w":"泻","m":"倾倒，倒出","t":"实词","d":["流淌","泄漏"]},{"u":0,"w":"置","m":"放置，安放","t":"实词","d":["设置","建立"]},{"u":1,"w":"安能","m":"怎么能","t":"古今异义","d":["安全的能力","安定能干"]},{"u":2,"w":"酌酒","m":"斟酒","t":"实词","d":["饮酒","酿酒"]},{"u":2,"w":"自宽","m":"自己宽慰自己","t":"实词","d":["自己放宽要求","自己变宽"]},{"u":2,"w":"断绝","m":"停止，不再唱","t":"实词","d":["隔绝","灭绝"]},{"u":3,"w":"吞声","m":"不敢出声，把话咽下","t":"实词","d":["吞咽声音","发不出声音"]},{"u":3,"w":"踯躅","m":"徘徊不前","t":"实词","d":["高兴地跳跃","慢慢行走"]}],"tricky":["泻","踯躅","酌","吞"],"keyLines":[{"u":0,"hint":"《拟行路难（其四）》中，以水流方向各异比喻人的命运各不相同的两句是："},{"u":1,"hint":"《拟行路难（其四）》中，诗人劝慰自己不要整日愁叹的两句是："},{"u":3,"hint":"《拟行路难（其四）》中，以反问表达内心悲愤、却只能隐忍的两句是："}],"appr":[{"q":"开头“泻水置平地，各自东西南北流”用了什么手法？","a":"运用比兴，借水倒在地上四散而流，比喻人的出身和命运各不相同，引出下文对命运的感叹，形象自然，含有对门阀等级制度不公的不平。"},{"q":"“心非木石岂无感？吞声踯躅不敢言。”表达了怎样的情感？","a":"以反问强调人有感情，不能无动于衷，又写“吞声”“不敢言”，表现出诗人满腹悲愤却无处倾诉的压抑，感情由故作旷达转为沉痛，余味悠长。"}]},{"id":"h2c-p09","title":"客至","author":"杜甫","dynasty":"唐","genre":"七言律诗","intro":"唐肃宗上元二年，杜甫居住在成都浣花溪草堂，县令崔明府来访，诗人写下此诗（原题下注“喜崔明府相过”）。","theme":"通过迎客、待客的细节，表现诗人对客人的热情真挚和乡居生活的淳朴，流露出欣喜之情。","tags":["生活","抒怀","待客"],"volume":"h2c","kind":"poem","units":[{"t":"舍南舍北皆春水，但见群鸥日日来。","tr":"我家屋子的南面北面都是春天涨起的江水，只见成群的鸥鸟每天飞来。","p":0,"r":1},{"t":"花径不曾缘客扫，蓬门今始为君开。","tr":"长满落花的小路从来没有为客人打扫过，今天才为你敞开这简陋的门。","p":0,"r":1},{"t":"盘飧市远无兼味，樽酒家贫只旧醅。","tr":"离集市远，盘中没有多样的菜肴，家里贫穷，杯中只有陈年的旧酒。","p":1,"r":1},{"t":"肯与邻翁相对饮，隔篱呼取尽余杯。","tr":"如果你愿意和邻家老翁一起对饮，我就隔着篱笆招呼他，把剩下的酒喝尽。","p":1,"r":1}],"notes":[{"u":0,"w":"舍","m":"指居住的房子，这里指草堂","t":"实词","d":["舍弃","客舍"]},{"u":1,"w":"缘","m":"因为","t":"实词","d":["沿着","缘分"]},{"u":1,"w":"蓬门","m":"用蓬草编的门，指贫寒人家的门","t":"实词","d":["蓬松的门","旅店的门"]},{"u":2,"w":"盘飧","m":"盘中的饭菜","t":"实词","d":["盘子和筷子","盘中的水果"]},{"u":2,"w":"兼味","m":"多样的菜肴","t":"实词","d":["两种味道","味道浓厚"]},{"u":2,"w":"旧醅","m":"未过滤的陈酒","t":"实词","d":["刚酿的新酒","剩下的残酒"]},{"u":3,"w":"呼取","m":"招呼，“取”是助词，表动作","t":"虚词"}],"tricky":["鸥","蓬","飧","樽","醅"],"keyLines":[{"u":1,"hint":"《客至》中，以今昔对比表现诗人迎客的诚意、欢迎客人到来的两句是："},{"u":2,"hint":"《客至》中，诗人自谦待客饭菜不丰盛、酒也不好的两句是："},{"u":3,"hint":"《客至》中，表现诗人与客人不拘形迹、邀邻翁共饮的热情的两句是："},{"u":0,"hint":"《客至》中，写草堂周围环境清幽、春水环绕的诗句是："}],"appr":[{"q":"“花径不曾缘客扫，蓬门今始为君开”用了什么手法？","a":"运用对比和对偶，“不曾”与“今始”形成对照，说明平时无人来访，今天为你特意打扫、敞开柴门，写出客人到来的欣喜与诗人对客人的敬重。"},{"q":"尾联“肯与邻翁相对饮，隔篱呼取尽余杯”有什么妙处？","a":"诗人用一句询问客人，再写隔篱呼邻，生活气息浓，写出主客相处的融洽和乡居生活的淳朴，也表现了杜甫待人真挚、热情好客的性格，结尾自然而有情趣。"}]},{"id":"h2c-p10","title":"登快阁","author":"黄庭坚","dynasty":"北宋","genre":"七言律诗","intro":"黄庭坚任吉州太和县知县时，傍晚登上县东的快阁，凭栏远望，写下此诗，抒发对官场的厌倦和对归隐的向往。","theme":"写登阁所见的开阔秋景，并抒发知音难觅的感慨、厌倦仕途、向往归隐江湖的情怀。","tags":["写景","抒怀","归隐"],"volume":"h2c","kind":"poem","units":[{"t":"痴儿了却公家事，快阁东西倚晚晴。","tr":"我这个痴儿了结了官府里的公事，傍晚在快阁的东西两侧倚着栏杆，享受放晴的天气。","p":0,"r":1},{"t":"落木千山天远大，澄江一道月分明。","tr":"树叶落尽，千山显露，天空显得辽远广大；澄净的江水一道奔流，月光显得分外明亮。","p":0,"r":1},{"t":"朱弦已为佳人绝，青眼聊因美酒横。","tr":"弦琴已经因为知音不在而不再弹奏，我也只能凭美酒来表示欢喜。","p":1,"r":1},{"t":"万里归船弄长笛，此心吾与白鸥盟。","tr":"想乘着万里归去的船吹着长笛，我的这颗心已与白鸥立下盟约。","p":1,"r":1}],"notes":[{"u":0,"w":"痴儿","m":"自嘲语，意为呆子（《晋书》“了官事，痴儿”的典故）","t":"典故"},{"u":0,"w":"了却","m":"办完，了结","t":"实词","d":["完全退却","明白地拒绝"]},{"u":0,"w":"公家事","m":"官府的事务","t":"古今异义","d":["国家大事","公共事业"]},{"u":1,"w":"落木","m":"落叶","t":"实词","d":["树木倒下","死去的木头"]},{"u":1,"w":"澄江","m":"清澈的江水","t":"实词","d":["静止的江","宽阔的江"]},{"u":2,"w":"朱弦","m":"红色的琴弦，指琴","t":"实词","d":["红色的绳子","红色的弓弦"]},{"u":2,"w":"佳人","m":"这里指知音（伯牙绝弦的典故）","t":"古今异义","d":["美丽的女子","有才华的人"]},{"u":2,"w":"青眼","m":"用正眼看人，表示喜爱、重视（阮籍的典故）","t":"典故"},{"u":3,"w":"白鸥盟","m":"与白鸥结盟，意为归隐江湖","t":"典故"}],"tricky":["痴","澄","朱弦","横","盟"],"keyLines":[{"u":1,"hint":"《登快阁》中，描写秋日登高所见、落叶满山、天空辽阔、江月分明的两句是："},{"u":2,"hint":"《登快阁》中，借伯牙摔琴的典故，感叹知音难觅的句子是："},{"u":3,"hint":"《登快阁》中，表达诗人想要退隐、与白鸥为友的两句是："}],"appr":[{"q":"颔联“落木千山天远大，澄江一道月分明”好在哪里？","a":"用“千山”“一道”、“远大”“分明”构成对仗，景象开阔，意境清朗，既有空间的辽阔感，又有清冷明澈之美，也暗示诗人超脱尘俗的心境。"},{"q":"尾联表达了诗人怎样的情怀？","a":"尾联想象乘船归去、横笛弄月，并以“与白鸥盟”表达归隐之志，反映出诗人对官场的厌倦和对自由闲适生活的向往，语言洒脱，余韵悠长。"}]},{"id":"h2c-p11","title":"临安春雨初霁","author":"陆游","dynasty":"南宋","genre":"七言律诗","intro":"淳熙十三年，陆游被朝廷召回京城临安，等候皇帝召见，在寓所写下这首诗，抒写客居京华的闲愁与无奈。","theme":"借春雨初晴的京城生活，写出对世味淡薄、仕途无聊的感慨，以及想早日回乡的心情。","tags":["抒怀","写景","思归"],"volume":"h2c","kind":"poem","units":[{"t":"世味年来薄似纱，谁令骑马客京华？","tr":"近年来我对世情的兴味淡薄得像一层纱，是谁让我骑着马来京城做客呢？","p":0,"r":1},{"t":"小楼一夜听春雨，深巷明朝卖杏花。","tr":"在小楼上整夜听着春雨淅沥，明天早晨深巷里就会有人叫卖杏花。","p":0,"r":1},{"t":"矮纸斜行闲作草，晴窗细乳戏分茶。","tr":"在短纸上斜着一行行随意写些草书，在晴朗的窗前泡着细白的茶沫，随意玩玩分茶。","p":1,"r":1},{"t":"素衣莫起风尘叹，犹及清明可到家。","tr":"不要因为白衣被风尘染黑而叹息，趁着清明节之前还来得及回到家乡。","p":1,"r":1}],"notes":[{"u":0,"w":"世味","m":"对世情的兴味，人情世态","t":"实词","d":["人世间的味道","世人的口味"]},{"u":0,"w":"客京华","m":"客居京城（“客”为名词作动词）","t":"词类活用"},{"u":0,"w":"令","m":"让，使","t":"实词","d":["命令","美好"]},{"u":2,"w":"矮纸","m":"短纸","t":"实词","d":["粗糙的纸","低矮的纸张"]},{"u":2,"w":"草","m":"草书","t":"实词","d":["杂草","草稿"]},{"u":2,"w":"细乳","m":"茶汤表面细密的白色泡沫","t":"实词","d":["细小的乳汁","稀薄的牛奶"]},{"u":2,"w":"分茶","m":"宋代的一种茶艺，用沸水冲茶，使茶汤出现图案","t":"典故"},{"u":3,"w":"素衣","m":"白衣，这里指自己的衣服","t":"实词","d":["丧服","朴素的衣服"]},{"u":3,"w":"风尘","m":"旅途中的风沙和尘土，比喻世俗的污浊","t":"古今异义","d":["风沙和灰尘","歌妓的生活"]}],"tricky":["纱","杏","矮","尘"],"keyLines":[{"u":0,"hint":"《临安春雨初霁》中，诗人感慨世情淡薄、对仕途兴味索然的句子是："},{"u":1,"hint":"《临安春雨初霁》中，以听雨和卖花的细节，生动描绘江南春天情景的两句是："},{"u":2,"hint":"《临安春雨初霁》中，诗人以写字、品茶打发时光，暗含无聊情绪的两句是："},{"u":3,"hint":"《临安春雨初霁》中，诗人劝慰自己不要为官场污浊而叹息、还可以赶在清明前回家的两句是："}],"appr":[{"q":"“小楼一夜听春雨，深巷明朝卖杏花”为什么成为名句？","a":"这两句以“听雨”“卖花”写春天，用听觉想象出雨后的清新、花市的繁闹，笔触细腻、意境清新，语言明丽，又暗含诗人客居无聊、心绪静而不宁的感受。"},{"q":"颈联“闲作草”“戏分茶”表现了诗人怎样的心情？","a":"“闲”“戏”二字写出诗人在京城无所事事、借写字品茶消磨时光，表面闲适，实际是壮志难酬的苦闷与无奈。"}]}];

const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let RNG = Math.random;
const rnd = n => Math.floor(RNG()*n);
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let USE_CUSTOM = true;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const uniq = a => [...new Set(a)];
const pad = n => String(n).padStart(2,'0');
const dstr = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return dstr(d); };
const diffDays = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/864e5);
const today = () => dstr();
const strip = s => s.replace(/[\s，。、；：！？“”‘’《》（）()「」『』…—·,.;:!?'"]/g, '');

function dataKey(email){ return 'shici.data.' + (email || '__guest__'); }

const users = () => Store.get('shici.users', {});
const saveUsers = u => Store.set('shici.users', u);

async function hashPw(pw, salt){
  try {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:enc.encode(salt), iterations:60000, hash:'SHA-256'}, key, 256);
    return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,'0')).join('');
  } catch(e){
    let h = 5381; const s = salt + pw; for (let i=0;i<s.length;i++) h = ((h<<5)+h) ^ s.charCodeAt(i);
    return 'x' + (h>>>0).toString(16);
  }
}
const randSalt = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

const Auth = {
  async register(email, username, pw){
    email = email.trim().toLowerCase();
    if (!validEmail(email)) throw '请输入有效的邮箱地址';
    username = (username || '').trim() || email.split('@')[0];
    if (pw.length < 6) throw '密码至少 6 位';
    const u = users();
    if (u[email]) throw '该邮箱已注册，请直接登录';
    const salt = randSalt();
    u[email] = { email, username: username.trim(), salt, hash: await hashPw(pw, salt), avatar:'', created: today() };
    saveUsers(u);
    // 把游客期间的进度带入新账户
    const guest = Store.get(dataKey(null));
    if (guest) Store.set(dataKey(email), guest);
    await Auth.login(email, pw);
  },
  async login(email, pw){
    email = email.trim().toLowerCase();
    const u = users()[email];
    if (!u) throw '账号不存在';
    if (u.hash !== await hashPw(pw, u.salt)) throw '密码不正确';
    Store.set('shici.session', email);
    Session.user = u; Session.data = loadData(email);
  },
  logout(){ saveData(); Store.del('shici.session'); Session.user = null; Session.data = loadData(null); },
  restore(){
    const email = Store.get('shici.session');
    const u = email && users()[email];
    Session.user = u || null; Session.data = loadData(u ? u.email : null);
  },
  updateProfile(patch){ const us = users(); Object.assign(us[Session.user.email], patch); saveUsers(us); Session.user = us[Session.user.email]; },
  async changePassword(oldPw, newPw){
    if (newPw.length < 6) throw '新密码至少 6 位';
    const us = users(), u = us[Session.user.email];
    if (u.hash !== await hashPw(oldPw, u.salt)) throw '当前密码不正确';
    u.salt = randSalt(); u.hash = await hashPw(newPw, u.salt); saveUsers(us); Session.user = u;
  },
  async changeEmail(newEmail, pw){
    newEmail = newEmail.trim().toLowerCase();
    if (!validEmail(newEmail)) throw '邮箱格式不正确';
    const us = users(), old = Session.user.email, u = us[old];
    if (newEmail === old) return;
    if (us[newEmail]) throw '该邮箱已被注册';
    if (u.hash !== await hashPw(pw, u.salt)) throw '密码不正确';
    saveData(); delete us[old]; u.email = newEmail; us[newEmail] = u; saveUsers(us);
    Store.set(dataKey(newEmail), Session.data); Store.del(dataKey(old)); Store.set('shici.session', newEmail); Session.user = u;
  },
  deleteAccount(){ const us = users(); delete us[Session.user.email]; saveUsers(us); Store.del(dataKey(Session.user.email)); Store.del('shici.session'); Session.user=null; Session.data = loadData(null); }
};

/* --- 学习进度 / 复习（间隔重复） --- */
function prog(id){ return Session.data.progress[id]; }
function ensureProg(id){
  const P = Session.data.progress;
  if (!P[id]) P[id] = { box:0, due:null, first:today(), last:null, reps:0, lapses:0, scores:[], studied:false };
  return P[id];
}
function statusOf(id){
  const p = prog(id);
  if (!p || !p.studied) return {k:'new', t:'未学'};
  if (p.box >= 6) return {k:'mastered', t:'已掌握'};
  if (p.box >= 3) return {k:'review', t:'复习中'};
  return {k:'learning', t:'学习中'};
}
function isDue(id){ const p = prog(id); return !!(p && p.studied && p.due && p.due <= today()); }
function dueList(){ return allPieces().filter(p => isDue(p.id)).sort((a,b) => prog(a.id).due.localeCompare(prog(b.id).due)); }

function dayLog(d=today()){
  const L = Session.data.log;
  if (!L[d]) L[d] = { q:0, ok:0, sec:0, pieces:[], acts:[] };
  return L[d];
}
function addActivity(pieceId, act, ok, total){
  const l = dayLog();
  l.q += total; l.ok += ok;
  if (pieceId && !l.pieces.includes(pieceId)) l.pieces.push(pieceId);
  l.acts.push({ id:pieceId, act, ok, n:total, t:new Date().toTimeString().slice(0,5) });
  saveData();
}
/* 学习/练习结束后更新该篇的间隔复习：score∈[0,1] */
function applyReview(id, score, act){
  const p = ensureProg(id);
  p.studied = true; p.reps++; p.last = today();
  p.scores.push({ d:today(), s:Math.round(score*100), a:act });
  if (p.scores.length > 60) p.scores.shift();
  if (p.box === 0) p.box = score >= 0.6 ? 1 : 1;
  else if (score >= 0.85) p.box = Math.min(BOX_DAYS.length-1, p.box+1);
  else if (score < 0.6){ p.box = Math.max(1, p.box-2); p.lapses++; }
  p.due = addDays(today(), BOX_DAYS[p.box]);
  saveData();
}
function recordWrong(pieceId, u, kind){
  const key = pieceId + '#' + u + '#' + kind;
  const w = Session.data.wrong;
  w[key] = w[key] || { id:pieceId, u, kind, n:0, last:null };
  w[key].n++; w[key].last = today();
}
function clearWrong(pieceId, u, kind){
  const key = pieceId + '#' + u + '#' + kind; const w = Session.data.wrong;
  if (w[key]){ w[key].n--; if (w[key].n <= 0) delete w[key]; }
}
function streak(){
  const L = Session.data.log; let s = 0, d = today();
  if (!(L[d] && L[d].q+L[d].sec > 0)) d = addDays(d, -1);
  while (L[d] && (L[d].q > 0 || L[d].sec > 60)){ s++; d = addDays(d, -1); }
  return s;
}
function totals(){
  const L = Session.data.log; let q=0, ok=0, sec=0, days=0, pts=0;
  for (const d in L){ q+=L[d].q; ok+=L[d].ok; sec+=L[d].sec; pts+=(L[d].pts||0); if (L[d].q || L[d].sec>60) days++; }
  return { q, ok, sec, days, pts };
}
/* 用时统计：页面可见时每 10 秒累计 */
function startTimer(){

  Session.minutesTick = setInterval(() => {
    if (document.hidden || !Session.data) return;

}

/* ===== quiz: 题目生成 + 答题引擎 ===== */
const TYPE_NAMES = { mcq:'选择题', type:'默写', fill:'填空', order:'排序', self:'赏析' };
const reciteUnits = p => p.units.map((x,i)=>({...x,i})).filter(x => x.r !== 0);

function otherPieces(p, kind){ return allPieces().filter(x => x.id !== p.id && (!kind || x.kind === kind)); }

/* —— 解析题 —— */
function genWord(p){
  const out = [];
  for (const n of p.notes || []){
    let d = n.d && n.d.length >= 2 ? n.d : pick(uniq(otherPieces(p).flatMap(o => (o.notes||[]).map(x => x.m)).filter(m => m && m !== n.m)), 2);
    if (d.length < 2 || n.t === '典故') continue;
    const opts = shuffle([n.m, d[0], d[1]]);
    out.push({ type:'mcq', piece:p.id, u:n.u, kind:'word', cat:'字词释义',
      prompt:`《${esc(p.title)}》中，“${esc(p.units[n.u].t)}”一句里，加点词 <b class="hl">${esc(n.w)}</b> 的意思是？`,
      options:opts, ans:opts.indexOf(n.m), explain:`${n.w}：${n.m}（${n.t}）` });
  }
  return out;
}
function genTrans(p){
  const out = [];
  const pool = p.units.filter(u => u.tr);
  if (pool.length < 2) return out;
  for (let i=0;i<p.units.length;i++){
    const u = p.units[i]; if (!u.tr) continue;
    let wrong = shuffle(pool.filter(x => x !== u).map(x => x.tr));
    if (wrong.length < 3) wrong = wrong.concat(pick(otherPieces(p).flatMap(o => o.units.filter(x=>x.tr).map(x=>x.tr)), 3));
    wrong = uniq(wrong).slice(0,3); if (wrong.length < 3) continue;
    const opts = shuffle([u.tr, ...wrong]);
    out.push({ type:'mcq', piece:p.id, u:i, kind:'trans', cat:'句子翻译',
      prompt:`《${esc(p.title)}》中，“${esc(u.t)}”的正确翻译是？`, options:opts, ans:opts.indexOf(u.tr), explain:`译文：${u.tr}` });
  }
  return out;
}
function genMeta(p){
  const out = [];
  const authors = uniq(otherPieces(p).map(o => o.author).filter(a => a && a !== p.author));
  if (authors.length >= 3){
    const opts = shuffle([p.author, ...pick(authors,3)]);
    out.push({ type:'mcq', piece:p.id, u:-1, kind:'author', cat:'文学常识', prompt:`《${esc(p.title)}》的作者是？`, options:opts, ans:opts.indexOf(p.author), explain:`${p.dynasty}·${p.author}` });
  }
  const themes = uniq(otherPieces(p, p.kind).map(o => o.theme).filter(t => t && t !== p.theme));
  if (p.theme && themes.length >= 3){
    const opts = shuffle([p.theme, ...pick(themes,3)]);
    out.push({ type:'mcq', piece:p.id, u:-1, kind:'theme', cat:'主旨情感', prompt:`下列对《${esc(p.title)}》主旨或情感的概括，最恰当的是？`, options:opts, ans:opts.indexOf(p.theme), explain:p.theme });
  }
  return out;
}
function genAppr(p){
  return (p.appr || []).map((a,i) => ({ type:'self', piece:p.id, u:-1-i, kind:'appr', cat:'赏析题', prompt:`《${esc(p.title)}》：${esc(a.q)}`, reference:a.a }));
}
/* —— 背诵题 —— */
function genDict(p){
  const out = [], R = reciteUnits(p);
  R.forEach(x => {
    const c = clauses(x.t);
    if (c.length >= 2){
      out.push({ type:'type', piece:p.id, u:x.i, kind:'dict', cat:'默写',
        prompt:`《${esc(p.title)}》默写：“<b>${esc(c[0])}</b>”的后文是：`, answer:c.slice(1).join(''), full:x.t, tricky:p.tricky });
    } else {
      const prev = x.i > 0 ? p.units[x.i-1].t : null;
      out.push({ type:'type', piece:p.id, u:x.i, kind:'dict', cat:'默写',
        prompt: prev ? `《${esc(p.title)}》默写：“<b>${esc(prev)}</b>”的下一句是：` : `《${esc(p.title)}》（${esc(p.author)}）第一句是：`,
        answer:x.t, full:x.t, tricky:p.tricky });
    }
  });
  return out;
}
function genKey(p){
  return (p.keyLines || []).map(k => ({ type:'type', piece:p.id, u:k.u, kind:'key', cat:'理解性默写',
    prompt:`《${esc(p.title)}》理解性默写：${esc(k.hint)}`, answer:p.units[k.u].t, full:p.units[k.u].t, tricky:p.tricky }));
}
function genFill(p){
  const out = [], R = reciteUnits(p);
  R.forEach(x => {
    const chars = [...x.t]; const isC = c => /[一-鿿]/.test(c);
    const idxs = chars.map((c,i)=>i).filter(i => isC(chars[i]));
    if (idxs.length < 4) return;
    const trick = idxs.filter(i => (p.tricky||[]).includes(chars[i]));
    const n = Math.min(Math.max(1, Math.round(idxs.length/6)), 3);
    const mask = new Set(shuffle(trick).slice(0,n));
    shuffle(idxs).forEach(i => { if (mask.size < n) mask.add(i); });
    out.push({ type:'fill', piece:p.id, u:x.i, kind:'fill', cat:'填空', chars, mask:[...mask].sort((a,b)=>a-b),
      prompt:`《${esc(p.title)}》补全诗文（在空格里填入缺的字）：`, full:x.t });
  });
  return out;
}
function genOrder(p){
  const R = reciteUnits(p); const out = [];
  if (R.length < 3) return out;
  for (let s = 0; s + 3 <= R.length && out.length < 3; s += Math.max(3, Math.floor(R.length/3))){
    const seg = R.slice(s, s + Math.min(4, R.length - s)); if (seg.length < 3) break;
    out.push({ type:'order', piece:p.id, u:seg[0].i, kind:'order', cat:'句序排列', prompt:`《${esc(p.title)}》把下面的句子按原文顺序排好：`, items:shuffle(seg.map(x => x.t)), correct:seg.map(x => x.t) });
  }
  return out;
}
const GENS = { word:genWord, trans:genTrans, meta:genMeta, appr:genAppr, dict:genDict, key:genKey, fill:genFill, order:genOrder };
const QSETS = {
  analyze: { name:'解析题', gens:['word','trans','meta','appr'] },
  recite:  { name:'背诵题', gens:['dict','key','fill','order'] },
  mixed:   { name:'综合', gens:['word','trans','dict','key','fill','order','meta'] },
};
function buildQuestions(pieces, set, count, seed){
  if (seed != null){ const old = RNG; RNG = mulberry(seed); try { return buildQuestions(pieces, set, count); } finally { RNG = old; } }
  const gens = Array.isArray(set) ? set : QSETS[set].gens;
  let qs = [];
  pieces.forEach(p => gens.forEach(g => { try { qs = qs.concat(GENS[g](p)); } catch(e){ console.warn(e); } }));
  qs = shuffle(qs);
  return count ? qs.slice(0, count) : qs;
}

/* —— 默写比对：对齐后标出错字 —— */
function alignDiff(user, ans){
  const a = [...strip(user)], b = [...strip(ans)];
  const n = a.length, m = b.length;
  const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i=1;i<=n;i++) for (let j=1;j<=m;j++) dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const hit = new Array(m).fill(false); let i=n, j=m;
  while (i>0 && j>0){ if (a[i-1]===b[j-1]){ hit[j-1]=true; i--; j--; } else if (dp[i-1][j] >= dp[i][j-1]) i--; else j--; }
  return { b, hit, same: a.join('')===b.join('') };
}
function diffHtml(user, ans){
  const d = alignDiff(user, ans);
  return d.b.map((c,k) => `<span class="${d.hit[k]?'ok':'bad'}">${esc(c)}</span>`).join('');
}

/* —— 答题引擎 —— */
function runQuiz(root, questions, opts={}){
  clearInterval(root._timer);
  const state = { i:0, res:[], startedAt:Date.now(), pts:0, combo:0, qStart:Date.now(), over:false };
  const mode = opts.mode || 'free', limit = opts.limit || 0;
  const elapsed = () => Math.round((Date.now() - state.startedAt)/1000);
  const fmt = s => `${Math.floor(s/60)}:${pad(s%60)}`;
  const tick = () => { const el = $('#qt', root); if (!el) return; const s = elapsed();
    if (mode === 'countdown'){ const left = Math.max(0, limit - s); el.textContent = '⏱ ' + fmt(left); if (!left && !state.over) { toast('时间到'); finish(); } }
    else if (mode !== 'free' || true) el.textContent = '⏱ ' + fmt(s); };
  root._timer = setInterval(tick, 500);
  const total = questions.length;
  if (!total){ root.innerHTML = `<div class="empty">没有可用的题目。换个范围试试，或先学习篇目。</div>`; return; }
  function show(){
    if (state.i >= total) return finish();
    const q = questions[state.i];
    root.innerHTML = `
      <div class="quiz-head"><span class="chip">${esc(q.cat)}</span><span class="muted">${state.i+1} / ${total}</span><span class="muted" id="qt"></span><span class="muted" id="qs">⭐ ${state.pts}</span>
        <div class="bar"><i style="width:${state.i/total*100}%"></i></div></div>
      <div class="q-prompt">${q.prompt}</div><div class="q-body"></div><div class="q-fb"></div><div class="q-actions"></div>`;
    const body = $('.q-body', root), fb = $('.q-fb', root), act = $('.q-actions', root);
    state.qStart = Date.now(); tick();
    let done = false;
    const wrongable = x => x.kind !== 'author' && x.kind !== 'theme';
    const calcPts = (x, ok, sec, combo) => !ok ? 0 : ((x.type === 'mcq' ? 10 : 15) + (sec < 8 ? 5 : sec < 15 ? 2 : 0) + Math.min(5, combo));
    const complete = (ok, html) => {
      if (done) return; done = true;
      const sec = Math.round((Date.now() - state.qStart)/1000);
      state.combo = ok ? state.combo + 1 : 0;
      const rec = { q, ok, sec, pts:calcPts(q, ok, sec, state.combo - 1) };
      state.res.push(rec); state.pts += rec.pts;
      if (wrongable(q)) ok ? clearWrong(q.piece, q.u, q.kind) : recordWrong(q.piece, q.u, q.kind);
      saveData(); $('#qs', root).textContent = '⭐ ' + state.pts;
      fb.innerHTML = `<div class="fb ${ok?'good':'badfb'}"><b>${ok?'✓ 正确':'✗ 再记一记'}</b>${html||''}</div>`;
      act.innerHTML = `<button class="btn primary" id="next">${state.i+1>=total?'查看结果':'下一题'} →</button><button class="btn ghost" id="flag">${ok ? '⚑ 我不太熟，加入错题本' : '✓ 其实我答对了（系统判错了）'}</button>`;
      const nb = $('#next', root); nb.focus(); nb.onclick = () => { state.i++; show(); };
      $('#flag', root).onclick = e => {
        state.pts -= rec.pts;
        rec.ok = !rec.ok; rec.pts = calcPts(q, rec.ok, rec.sec, 0); state.pts += rec.pts;
        if (wrongable(q)) rec.ok ? clearWrong(q.piece, q.u, q.kind) : recordWrong(q.piece, q.u, q.kind);
        saveData(); $('#qs', root).textContent = '⭐ ' + state.pts;
        const f = $('.fb', root); f.className = 'fb ' + (rec.ok ? 'good' : 'badfb'); $('b', f).textContent = rec.ok ? '✓ 已改为答对' : '✗ 已加入错题本';
        e.target.remove(); toast(rec.ok ? '已改为答对，并从错题本移除' : '已加入错题本');
      };
    };
    if (q.type === 'mcq'){
      body.innerHTML = q.options.map((o,k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span>${esc(o)}</button>`).join('');
      $$('.opt', body).forEach(b => b.onclick = () => {
        if (done) return; const k = +b.dataset.k;
        $$('.opt', body).forEach((x,j) => { x.disabled = true; if (j===q.ans) x.classList.add('right'); });
        if (k !== q.ans) b.classList.add('wrong');
        complete(k === q.ans, `<div class="explain">${esc(q.explain||'')}</div>`);
      });
    } else if (q.type === 'type'){
      body.innerHTML = `<textarea class="ans" rows="2" placeholder="在这里默写（标点可省略）" autofocus></textarea>
        <div class="row"><button class="btn" id="hint">提示首字</button><button class="btn primary" id="chk">提交</button><button class="btn ghost" id="giveup">不会</button></div>`;
      const ta = $('textarea', body); ta.focus();
      $('#hint', body).onclick = () => { ta.placeholder = '首字：' + strip(q.answer)[0] + '…（共 ' + strip(q.answer).length + ' 字）'; };
      const check = giveup => {
        const val = giveup ? '' : ta.value; ta.disabled = true;
        const d = alignDiff(val, q.answer);
        const wrongChars = d.b.filter((c,k)=>!d.hit[k]);
        const tip = wrongChars.length && q.tricky ? wrongChars.filter(c => q.tricky.includes(c)).map(c => `“${c}”是易错字`).join('，') : '';
        complete(d.same, `<div class="diff">${diffHtml(val, q.answer)}</div><div class="explain">原文：${esc(q.full)}${tip?'<br>'+esc(tip):''}</div>`);
      };
      $('#chk', body).onclick = () => check(false); $('#giveup', body).onclick = () => check(true);
      ta.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(!done) check(false); } });
    } else if (q.type === 'fill'){
      let html = ''; q.chars.forEach((c,k) => { html += q.mask.includes(k) ? `<input class="blank" maxlength="1" data-k="${k}" aria-label="空格">` : `<span class="ch">${esc(c)}</span>`; });
      body.innerHTML = `<div class="fill">${html}</div><div class="row"><button class="btn primary" id="chk">提交</button><button class="btn ghost" id="giveup">不会</button></div>`;
      const ins = $$('.blank', body); ins[0] && ins[0].focus();
      ins.forEach((inp,ix) => inp.addEventListener('input', () => { if (inp.value && ins[ix+1]) ins[ix+1].focus(); }));
      const check = giveup => {
        let ok = true;
        ins.forEach(inp => { const right = q.chars[+inp.dataset.k]; const good = !giveup && inp.value.trim() === right; if (!good) ok = false; inp.classList.add(good?'right':'wrong'); inp.disabled = true; if (!good) inp.value = right; });
        complete(ok, `<div class="explain">原文：${esc(q.full)}</div>`);
      };
      $('#chk', body).onclick = () => check(false); $('#giveup', body).onclick = () => check(true);
      body.addEventListener('keydown', e => { if (e.key==='Enter' && !done) check(false); });
    } else if (q.type === 'order'){
      let chosen = [];
      const draw = () => {
        body.innerHTML = `<div class="order-chosen">${chosen.map(c => `<span class="chip big">${esc(c)}</span>`).join('') || '<span class="muted">依次点击下面的句子</span>'}</div>
          <div class="order-pool">${q.items.map((it,k) => `<button class="opt ${chosen.includes(it)?'used':''}" data-k="${k}" ${chosen.includes(it)?'disabled':''}>${esc(it)}</button>`).join('')}</div>
          <div class="row"><button class="btn" id="reset">重选</button><button class="btn primary" id="chk" ${chosen.length<q.items.length?'disabled':''}>提交</button></div>`;
        $$('.opt', body).forEach(b => b.onclick = () => { chosen.push(q.items[+b.dataset.k]); draw(); });
        $('#reset', body).onclick = () => { chosen = []; draw(); };
        $('#chk', body).onclick = () => { const ok = chosen.join('|') === q.correct.join('|'); $$('button', body).forEach(b => b.disabled = true); complete(ok, `<div class="explain">正确顺序：<br>${q.correct.map(esc).join('<br>')}</div>`); };
      };
      draw();
    } else if (q.type === 'self'){
      body.innerHTML = `<textarea class="ans" rows="3" placeholder="先自己写一写你的答案…"></textarea><div class="row"><button class="btn primary" id="show">查看参考答案</button></div>`;
      $('#show', body).onclick = () => {
        body.innerHTML += `<div class="ref"><b>参考答案</b><br>${esc(q.reference)}</div><div class="row"><span class="muted">对照一下，你答得怎么样？</span><button class="btn" id="g1">基本答对</button><button class="btn" id="g0">没答好</button></div>`;
        $('#show', body).remove();
        $('#g1', body).onclick = () => complete(true, ''); $('#g0', body).onclick = () => complete(false, '');
      };
    }
  }
  function finish(){
    if (state.over) return; state.over = true; clearInterval(root._timer);
    const answered = state.res; const ok = answered.filter(r => r.ok).length, n = answered.length, sec = elapsed();
    const byPiece = {};
    answered.forEach(r => { const id = r.q.piece; (byPiece[id] = byPiece[id] || {ok:0,n:0}).n++; if (r.ok) byPiece[id].ok++; });
    Object.entries(byPiece).forEach(([id, s]) => { addActivity(id, opts.act || 'quiz', s.ok, s.n); if (opts.srs !== false && s.n >= 2) applyReview(id, s.ok / s.n, opts.act || 'quiz'); });
    Session.data.points = (Session.data.points || 0) + state.pts; dayLog().pts = (dayLog().pts || 0) + state.pts;
    saveData();
    const wrong = answered.filter(r => !r.ok);
    const pct = n ? Math.round(ok/n*100) : 0;
    const summary = { ok, n, sec, pts:state.pts, pct };
    root.innerHTML = `<div class="result"><div class="score-ring" style="--p:${pct}"><b>${pct}%</b></div>
      <h2>${ok} / ${n} 题正确 · 用时 ${fmt(sec)} · 本次积分 +${state.pts}</h2><p class="muted">总积分 ${Session.data.points} · 已记录到今天的学习日志${opts.srs!==false?'，并更新了复习计划':''}${wrong.length?'；答错的题已自动加入错题本':''}</p>
      ${opts.resultExtra ? opts.resultExtra(summary) : ''}
      ${wrong.length ? `<h3>需要加强</h3><ul class="wrong-list">${wrong.map(r => `<li><span class="chip">${esc(r.q.cat)}</span> ${r.q.prompt}${r.q.answer?`<div class="diff">${esc(r.q.answer)}</div>`:''}</li>`).join('')}</ul>` : '<p class="big-ok">全部答对，太棒了！🎉</p>'}
      <div class="row">${opts.noAgain?'':'<button class="btn primary" id="again">再来一组</button>'}<a class="btn" href="#/progress">查看进度</a><a class="btn" href="#/wrong">错题本</a>${opts.backHref?`<a class="btn ghost" href="${opts.backHref}">返回</a>`:''}</div></div>`;
    const ag = $('#again', root); if (ag) ag.onclick = () => opts.again ? opts.again() : location.reload();
    renderHeader(); opts.onFinish && opts.onFinish(summary);
  }
  show();
}

function markNotes(unit, notes){
  const flags = new Array(unit.t.length).fill(-1);
  notes.forEach((n,k) => { const s = unit.t.indexOf(n.w); if (s >= 0 && flags.slice(s, s+n.w.length).every(f => f < 0)) for (let j=s;j<s+n.w.length;j++) flags[j] = k; });
  let html = '', k = 0; const t = [...unit.t];
  while (k < t.length){
    if (flags[k] >= 0){ const id = flags[k]; let e = k; while (e < t.length && flags[e] === id) e++; const n = notes[id];
      html += `<mark title="${esc(n.m)}（${esc(n.t)}）">${esc(t.slice(k,e).join(''))}</mark>`; k = e; }
    else { html += esc(t[k]); k++; }
  }
  return html;
}
const Speaker = { q:[], playing:false, paused:false,
  play(list){ this.stop(true); this.q = (Array.isArray(list) ? list : [list]).map(t => t.replace(/[“”‘’]/g,'')); this.playing = true; this.paused = false; this.bar(); this.next(); },
  next(){ if (!this.playing) return; if (!this.q.length){ this.stop(); return; }
    try { const u = new SpeechSynthesisUtterance(this.q.shift()); u.lang = 'zh-CN'; u.rate = .8; u.onend = () => { if (this.playing && !this.paused) this.next(); }; u.onerror = () => { if (this.playing && !this.paused) this.next(); }; speechSynthesis.speak(u); }
    catch(e){ this.stop(); toast('当前浏览器不支持朗读'); } },
  pause(){ this.paused = true; try { speechSynthesis.cancel(); } catch(e){} this.bar(); },        // 取消当前句，保留队列
  resume(){ if (!this.paused) return; this.paused = false; this.bar(); this.next(); },
  stop(silent){ this.playing = false; this.paused = false; this.q = []; try { speechSynthesis.cancel(); } catch(e){} if (!silent) this.bar(); },
  bar(){ let b = $('#speakBar'); if (!this.playing){ if (b) b.remove(); return; }
    if (!b){ b = document.createElement('div'); b.id = 'speakBar'; document.body.appendChild(b); }
    b.innerHTML = `<span>🔊 ${this.paused ? '已暂停' : '正在朗读…'}</span>${this.paused ? '<button id="spR">▶ 继续</button>' : '<button id="spP">⏸ 暂停</button>'}<button id="spS">⏹ 停止</button>`;
    const r = $('#spR', b), p = $('#spP', b); if (r) r.onclick = () => this.resume(); if (p) p.onclick = () => this.pause(); $('#spS', b).onclick = () => this.stop(); } };

function pieceRecite(p, box){

      if (lv === 2) return (p.tricky||[]).includes(c) || ((k*7 + i*3) % 4 === 0) ? '<span class="gap">＿</span>' : esc(c);
      if (lv === 3){ const cl = clauses(t); let pos = 0; for (const x of cl){ if (k < pos + x.length) return k === pos ? esc(c) : '<span class="gap">＿</span>'; pos += x.length; } }
      return '<span class="gap">＿</span>';
    }).join('');
  };
  const draw = () => {
    box.innerHTML = `<div class="row"><b>难度</b>${[[1,'① 看全文'],[2,'② 挖关键字'],[3,'③ 只看首字'],[4,'④ 全隐藏']].map(([k,v]) => `<button class="btn ${k===level?'primary':''}" data-l="${k}">${v}</button>`).join('')}</div>

        ${revealed.has(x.i) && !rating[x.i] ? `<div class="rate"><button data-v="good">记得</button><button data-v="mid">模糊</button><button data-v="bad">忘了</button></div>` : ''}${revealed.has(x.i) && x.tr ? `<div class="tr">${esc(x.tr)}</div>` : ''}</div>`).join('')}</div>
      <div class="row"><span class="muted">已评 ${Object.keys(rating).length} / ${R.length} 句</span><button class="btn primary" id="finish" ${Object.keys(rating).length?'':'disabled'}>完成本轮背诵</button></div>`;
    $$('[data-l]', box).forEach(b => b.onclick = () => { level = +b.dataset.l; Store.set('shici.level', level); revealed.clear(); Object.keys(rating).forEach(k => delete rating[k]); draw(); });

function pkCard(x){
  const ch = x.ch, left = ch.exp - Date.now(), used = x.tries.length, best = x.tries.length ? Math.max(...x.tries.map(t => t.score)) : null;
  const myName = Session.user ? Session.user.username : '游客';
  const board = x.board.concat(x.tries.length ? [{ name:myName + '（我）', ok:x.tries.reduce((a,t)=>t.score>a.score?t:a).ok, n:ch.n, sec:x.tries.reduce((a,t)=>t.score>a.score?t:a).sec, score:best }] : []).sort((a,b) => b.score - a.score);
  const bestTry = x.tries.length ? x.tries.reduce((a,t) => t.score > a.score ? t : a) : null;
  const code = bestTry ? b64e({ cid:ch.id, name:myName, ok:bestTry.ok, n:ch.n, sec:bestTry.sec, score:bestTry.score }) : '';
  return `<div class="card"><div class="row"><b>挑战 ${ch.id}</b><span class="chip">发起：${esc(ch.host)}</span><span class="chip">${ch.n} 题</span><span class="muted">${left > 0 ? `剩余 ${Math.floor(left/36e5)} 小时` : '已结束'} · 已用 ${used}/2 次</span>
      ${left > 0 && used < 2 ? `<button class="btn primary" data-play="${ch.id}">开始答题</button>` : ''}</div>
    ${bestTry ? `<p>我的最好成绩：${bestTry.ok}/${ch.n} 对，用时 ${bestTry.sec} 秒，得分 <b>${bestTry.score}</b></p><label class="col">我的成绩码（发给发起人）<textarea class="ans" rows="2" readonly onclick="this.select()">${code}</textarea></label>` : ''}
    ${x.host ? `<label class="col">粘贴同学的成绩码（可多条，空格/换行分隔）<textarea id="res-${ch.id}" class="ans" rows="2"></textarea></label><button class="btn" data-addres="${ch.id}">添加到排行榜</button>` : ''}
    ${board.length ? `<table class="notes"><tr><th>名次</th><th>选手</th><th>答对</th><th>用时</th><th>得分</th></tr>${board.map((r,i) => `<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(r.name)}</td><td>${r.ok}/${r.n||ch.n}</td><td>${r.sec}s</td><td><b>${r.score}</b></td></tr>`).join('')}</table>` : ''}</div>`;
}
function playPK(id){
  const x = Session.data.pk[id], ch = x.ch;
  if (x.tries.length >= 2) return toast('2 次机会已用完'); if (ch.exp < Date.now()) return toast('挑战已结束');
  if (!confirm(`开始第 ${x.tries.length+1} 次答题？共 ${ch.n} 题，计时开始后不可暂停，且会消耗 1 次机会。`)) return;
  const qs = pkQuestions(ch); const root = $('#qroot'); root.scrollIntoView({behavior:'smooth'});
  x.tries.push({ pending:true, ok:0, sec:0, score:0 }); saveData();      // 先占用次数，防止中途刷新重来
  runQuiz(root, qs, { act:'pk', srs:false, mode:'timed', noAgain:true, onFinish:s => { x.tries[x.tries.length-1] = { ok:s.ok, sec:s.sec, score:pkScore(s.ok, ch.n, s.sec) }; saveData(); } , resultExtra:s => `<p class="big-ok">PK 得分：${pkScore(s.ok, ch.n, s.sec)}（已记录，返回「PK 挑战」查看成绩码）</p>` });
}

      const m = ps.filter(p => statusOf(p.id).k === 'mastered').length, r = ps.filter(p => ['review','learning'].includes(statusOf(p.id).k)).length;

        <div class="chips">${ps.map(p => `<a href="#/piece/${p.id}" class="st st-${statusOf(p.id).k}" title="${esc(p.title)}">${esc(p.title.replace(/（.*/,''))}</a>`).join('')}</div></div>`; }).join('') || '<div class="empty">暂无数据</div>';

function weakList(){

}
function lineChart(days, vals){

}

  $('#prefForm').onsubmit = e => { e.preventDefault(); Object.assign(S, { grade:$('#sGrade').value, goalQ:+$('#sQ').value||20, goalMin:+$('#sMin').value||15, focus:$('#sFocus').value, targetDate:$('#sDate').value, goalNote:$('#sNote').value.trim() }); saveData(); renderHeader(); toast('偏好已保存'); };
  $('#pwForm').onsubmit = async e => { e.preventDefault(); try { await Auth.changePassword($('#pwOld').value, $('#pwNew').value); toast('密码已更新'); e.target.reset(); } catch(err){ toast(String(err.message||err)); } };
  $('#exp').onclick = () => { const blob = new Blob([JSON.stringify({ v:1, user:{ username:u.username, avatar:u.avatar }, data:Session.data }, null, 1)], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `shici-backup-${today()}.json`; a.click(); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const j = JSON.parse(rd.result); if (!j.data) throw 0; Session.data = Object.assign(newData(), j.data); saveData(); toast('已导入'); renderHeader(); viewAccount(); } catch(err){ toast('文件格式不正确'); } }; rd.readAsText(f); };
  $('#lo').onclick = () => { Auth.logout(); renderHeader(); go('#/home'); };
  $('#del').onclick = () => { if (confirm('确定删除账号和所有学习数据？此操作无法恢复。')){ Auth.deleteAccount(); renderHeader(); go('#/home'); } };
}

/* —— 兼容沙盒预览：不依赖浏览器原生表单提交 —— */
function submitForm(f){ if (!f || !f.onsubmit) return; if (f.checkValidity && !f.checkValidity()){ f.reportValidity && f.reportValidity(); return; } f.onsubmit({ preventDefault(){}, target:f }); }
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('form button'); if (b && (!b.type || b.type === 'submit')){ e.preventDefault(); submitForm(b.closest('form')); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('form input')){ e.preventDefault(); submitForm(e.target.closest('form')); } });

/* ===== main: 路由与启动 ===== */
function route(){
  const parts = (HASH || '#/home').replace(/^#\/?/, '').split('/');
  const [r, a, b] = parts;
  window.scrollTo(0, 0); Speaker.stop();
  renderHeader();
  try {
    if (r === 'library') viewLibrary();
    else if (r === 'piece') viewPiece(decodeURIComponent(a||''), b || 'learn');
    else if (r === 'practice') viewPractice();
    else if (r === 'review') viewReview();
    else if (r === 'progress') viewProgress(a || 'overview');
    else if (r === 'wrong') viewWrong();
    else if (r === 'pk') viewPK();
    else if (r === 'account') viewAccount();
    else viewHome();
  } catch(e){ console.error(e); app().innerHTML = `<div class="empty">页面出错了：${esc(e.message)}</div>`; }
}
Auth.restore();
startTimer();
route();


</script>
