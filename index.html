","d":["最短的路","极深的道行"]},{"u":1,"w":"善","m":"好处，美好","t":"实词","d":["善良","擅长"]},{"u":2,"w":"是故","m":"因此，所以","t":"实词","d":["这个缘故","这样的事"]},{"u":2,"w":"困","m":"理解不了，不通","t":"实词","d":["困倦","围困"]},{"u":3,"w":"自反","m":"自我反省","t":"实词","d":["自己违背","自己反对"]},{"u":4,"w":"自强","m":"自我勉励，督促自己进步","t":"实词","d":["自己强大","自己强迫"]},{"u":5,"w":"相长","m":"互相促进","t":"实词","d":["互相生长","彼此增长年岁"]},{"u":6,"w":"学学半","m":"第一个“学”通“敩”，教；教人是学习的一半","t":"通假","d":["学习只学一半","半价学习"]},{"u":6,"w":"其此之谓乎","m":"大概说的就是这个道理吧（宾语前置）","t":"特殊句式","d":[]},{"u":2,"w":"然后","m":"这样以后","t":"古今异义","d":["在那之后","接着"]}],"tricky":["肴","旨","弗","兑","困"],"keyLines":[{"u":5,"hint":"《虽有嘉肴》中，概括教与学关系的核心论断是："},{"u":2,"hint":"文章指出学与教各自使人认识到什么的句子是："},{"u":1,"hint":"与“虽有嘉肴，弗食，不知其旨也”相对，以道理作比的句子是："},{"u":4,"hint":"意思是认识到自己困惑后才能自我勉励的句子是："}],"appr":[{"q":"文章开头为什么先写“嘉肴”？","a":"用品尝佳肴才知其味来类比学习至道才知其善，把抽象道理转化为生活常识，浅显易懂，具有很强的说服力，自然引出后文教学相长的论点。"},{"q":"“教学相长”的含义是什么？","a":"学习使人发现自己不足，教导使人发现自己困惑，两者都促使人反省并进步，所以教和学是互相促进、共同提高的关系。"}]},{"id":"g8b-w07","volume":"g8b","title":"大道之行也","author":"《礼记》","dynasty":"西汉","genre":"论说文（政论）","kind":"prose","intro":"选自《礼记·礼运》，托孔子之言描绘儒家理想的“大同”社会图景。","theme":"描绘天下为公、人人各得其所、社会安定和谐的大同世界，寄托儒家的社会理想。","tags":["议论","理想社会","儒家"],"units":[{"t":"大道之行也，天下为公。","tr":"大道施行的时候，天下是为天下人所共有的。","p":0,"r":1},{"t":"选贤与能，讲信修睦。","tr":"选拔有德行的人和有才能的人来管理，讲求诚信，培养和睦。","p":0,"r":1},{"t":"故人不独亲其亲，不独子其子，","tr":"所以人们不只是敬爱自己的父母，不只是抚爱自己的子女，","p":0,"r":1},{"t":"使老有所终，壮有所用，幼有所长，","tr":"要让老年人能够安享晚年，壮年人有可用武之地，儿童能够健康成长，","p":0,"r":1},{"t":"矜、寡、孤、独、废疾者皆有所养，","tr":"鳏夫、寡妇、孤儿、无子女的老人、残疾的人都能得到供养，","p":0,"r":1},{"t":"男有分，女有归。","tr":"男子有职分，女子有归宿。","p":0,"r":1},{"t":"货恶其弃于地也，不必藏于己；","tr":"对财物，人们憎恨把它丢弃在地上的浪费，却不一定要藏到自己家里；","p":0,"r":1},{"t":"力恶其不出于身也，不必为己。","tr":"对于气力，人们憎恨不使出来，却不一定是为了自己。","p":0,"r":1},{"t":"是故谋闭而不兴，盗窃乱贼而不作，","tr":"因此奸邪的计谋被杜绝而不会兴起，偷盗抢窃和作乱害人的事也不会发生，","p":0,"r":1},{"t":"故外户而不闭。","tr":"所以外面的大门都不用关上。","p":0,"r":1},{"t":"是谓大同。","tr":"这就叫做大同社会。","p":0,"r":1}],"notes":[{"u":0,"w":"行","m":"施行，实行","t":"实词","d":["行走","品行"]},{"u":0,"w":"为公","m":"为天下人所共有","t":"实词","d":["做公职","公平无私"]},{"u":1,"w":"贤","m":"有德行的人","t":"实词","d":["贤惠","贤明的君主"]},{"u":1,"w":"与","m":"通“举”，推举，选拔","t":"通假","d":["给予","和，同"]},{"u":1,"w":"修睦","m":"培养和睦","t":"实词","d":["修理和睦的房屋","修补关系"]},{"u":2,"w":"亲其亲","m":"第一个“亲”是意动用法，以……为亲；第二个“亲”指父母","t":"词类活用","d":[]},{"u":2,"w":"子其子","m":"第一个“子”意动用法，以……为子；第二个指子女","t":"词类活用","d":[]},{"u":3,"w":"终","m":"终老，善终","t":"实词","d":["终点","完结"]},{"u":3,"w":"壮","m":"壮年人","t":"实词","d":["强壮","壮大"]},{"u":3,"w":"长","m":"成长","t":"实词","d":["长久","年长"]},{"u":4,"w":"矜","m":"通“鳏”，老而无妻的人","t":"通假","d":["怜悯","自大"]},{"u":4,"w":"废疾","m":"残疾","t":"实词","d":["废除疾病","疾病缠身"]},{"u":5,"w":"分","m":"职分，职务","t":"实词","d":["分开","成分"]},{"u":5,"w":"归","m":"女子出嫁","t":"实词","d":["回家","归还"]},{"u":6,"w":"恶","m":"厌恶，憎恨","t":"实词","d":["邪恶","凶恶"]},{"u":8,"w":"谋","m":"奸邪的计谋","t":"实词","d":["谋划","商议"]},{"u":8,"w":"兴","m":"兴起，发生","t":"实词","d":["兴盛","兴趣"]},{"u":8,"w":"作","m":"兴起，发生","t":"实词","d":["制作","写作"]},{"u":9,"w":"外户","m":"外门，大门","t":"实词","d":["外面的人家","外面的窗户"]},{"u":9,"w":"闭","m":"关闭","t":"实词","d":["闭塞","闭幕"]}],"tricky":["矜","寡","睦","疾","贼","闭"],"keyLines":[{"u":0,"hint":"《大道之行也》中，概括大同社会根本特征（天下归公）的句子是："},{"u":1,"hint":"文中说明大同社会选拔人才、讲求诚信和睦的句子是："},{"u":3,"hint":"写大同社会中老、壮、幼各得其所的三句是："},{"u":9,"hint":"体现大同社会治安良好、夜不闭户的句子是："}],"appr":[{"q":"文章描绘的“大同”社会有哪些基本特征？","a":"天下为公，选贤任能，讲信修睦；人人敬爱他人亲人，老幼鳏寡孤独皆有所养；人各尽其力，不为私利；社会安定，盗贼不生，门户不闭。"},{"q":"“货恶其弃于地也，不必藏于己”表现了怎样的思想？","a":"既反对浪费，也反对据为私有，主张财物为公共所用，人人尽力而不计私利，反映了大同社会摒弃私心、崇尚公共道德的理想。"}]},{"id":"g8b-w08","volume":"g8b","title":"马说","author":"韩愈","dynasty":"唐","genre":"杂说（寓言性议论文）","kind":"prose","intro":"韩愈怀才不遇，仕途坎坷，借千里马不遇伯乐的遭遇，抒发人才被埋没的愤慨。“说”是一种议论文体。","theme":"借千里马的遭遇，批判统治者不识人才、埋没人才，抒发怀才不遇的愤懑。","tags":["议论","咏物言志","人才"],"units":[{"t":"世有伯乐，然后有千里马。","tr":"世上先有了伯乐，然后才有千里马。","p":0,"r":1},{"t":"千里马常有，而伯乐不常有。","tr":"千里马经常有，可是伯乐却不常有。","p":0,"r":1},{"t":"故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。","tr":"所以即使有名贵的马，也只是辱没在仆役的手里，和普通的马一起死在马厩中，不能以千里马著称。","p":0,"r":1},{"t":"马之千里者，一食或尽粟一石。","tr":"日行千里的马，吃一顿有时能吃完一石粮食。","p":1,"r":1},{"t":"食马者不知其能千里而食也。","tr":"喂马的人不知道它有日行千里的能力而像对待普通马一样喂养它。","p":1,"r":1},{"t":"是马也，虽有千里之能，食不饱，力不足，才美不外见，","tr":"这样的马，即使有日行千里的能力，却吃不饱，力气不足，才能和美好的素质不能显露在外，","p":1,"r":1},{"t":"且欲与常马等不可得，安求其能千里也？","tr":"想要和普通的马一样尚且办不到，怎么能要求它日行千里呢？","p":1,"r":1},{"t":"策之不以其道，食之不能尽其材，鸣之而不能通其意，","tr":"驱使它不按照正确的方法，喂养它又不能使它充分发挥才能，听它嘶鸣却不能理解它的意思，","p":2,"r":1},{"t":"执策而临之，曰：“天下无马！”","tr":"拿着鞭子面对它，说：“天下没有千里马！”","p":2,"r":1},{"t":"呜呼！其真无马邪？其真不知马也！","tr":"唉！难道真的没有千里马吗？恐怕是真的不认识千里马啊！","p":2,"r":1}],"notes":[{"u":0,"w":"伯乐","m":"春秋时善于相马的人，这里比喻善于发现人才的人","t":"实词","d":["良马的名字","驯马的奴隶"]},{"u":2,"w":"祗","m":"通“只”，仅仅","t":"通假","d":["恭敬","适合"]},{"u":2,"w":"辱","m":"辱没，埋没","t":"实词","d":["耻辱","侮辱"]},{"u":2,"w":"骈","m":"两马并驾，这里指并列、一同","t":"实词","d":["相连的骨头","成对的花纹"]},{"u":2,"w":"槽枥","m":"喂牲口的槽，马棚","t":"实词","d":["关押牲畜的牢笼","战场"]},{"u":2,"w":"称","m":"称道，著称","t":"实词","d":["称呼","称量"]},{"u":3,"w":"一食","m":"吃一顿","t":"实词","d":["一种食物","一次食物"]},{"u":3,"w":"或","m":"有时","t":"古今异义","d":["或者","有人"]},{"u":3,"w":"粟","m":"小米，泛指粮食","t":"实词","d":["大米","麦子"]},{"u":4,"w":"食","m":"通“饲”，喂养","t":"通假","d":["吃饭","食物"]},{"u":5,"w":"见","m":"通“现”，显现，表现","t":"通假","d":["看见","拜见"]},{"u":6,"w":"等","m":"相等，相同","t":"实词","d":["等待","等级"]},{"u":6,"w":"安","m":"怎么，哪里","t":"虚词","d":[]},{"u":6,"w":"且","m":"尚且","t":"虚词","d":[]},{"u":7,"w":"策","m":"用鞭子打，驱使（名词作动词）","t":"词类活用","d":[]},{"u":7,"w":"道","m":"正确的方法","t":"实词","d":["道路","道理"]},{"u":7,"w":"材","m":"通“才”，才能","t":"通假","d":["木材","材料"]},{"u":7,"w":"通其意","m":"通晓它的意思","t":"实词","d":["沟通思想","传达它的意图"]},{"u":8,"w":"策","m":"马鞭","t":"实词","d":["谋略","策划"]},{"u":8,"w":"临","m":"面对","t":"实词","d":["来到","降临"]},{"u":9,"w":"邪","m":"通“耶”，表疑问的语气词","t":"通假","d":["邪恶","不正"]},{"u":9,"w":"其真无马邪","m":"难道真的没有千里马吗（反问句式）","t":"特殊句式","d":[]}],"tricky":["祗","骈","枥","粟","策","邪"],"keyLines":[{"u":1,"hint":"《马说》中，表明千里马常有而识马者难得、揭示全文中心的句子是："},{"u":0,"hint":"《马说》开篇指出伯乐与千里马关系的句子是："},{"u":2,"hint":"写千里马被辱没、埋没于普通马之中的悲惨遭遇的句子是："},{"u":6,"hint":"写千里马连与普通马一样的待遇都得不到、更别说发挥才能的句子是："},{"u":9,"hint":"文章结尾，作者感叹统治者根本不识人才的句子是："}],"appr":[{"q":"“世有伯乐，然后有千里马”一句在文中有何作用？","a":"这是全文的立论：千里马的才能能否被发现，关键取决于识才的人。它为下文批判食马者不识马铺垫，把批判对象指向不能识才用才的统治者。"},{"q":"文章结尾的反问句表达了怎样的感情？","a":"“其真无马邪？其真不知马也！”以反问和感叹收束，明确指出不是缺少人才而是不识人才，既含对统治者的讽刺，也抒发作者怀才不遇的悲愤。"}]},{"id":"g9a-p01","volume":"g9a","title":"行路难（其一）","author":"李白","dynasty":"唐","genre":"乐府诗（七言歌行）","kind":"poem","intro":"天宝年间，李白被排挤出长安，友人设宴送行，他心中苦闷而作此诗，是《行路难》三首中最著名的一首。","theme":"抒写仕途受阻的苦闷与迷惘，又表达对前途仍抱信心的豪迈乐观。","tags":["抒怀","言志","仕途"],"units":[{"t":"金樽清酒斗十千，玉盘珍羞直万钱。","tr":"金杯里盛着清醇的美酒，一斗价值十千；玉盘中摆满珍贵的菜肴，价值万钱。","p":0,"r":1},{"t":"停杯投箸不能食，拔剑四顾心茫然。","tr":"可我却放下酒杯，扔下筷子，吃不下饭；拔出宝剑环顾四周，心中一片茫然。","p":0,"r":1},{"t":"欲渡黄河冰塞川，将登太行雪满山。","tr":"想渡过黄河，冰雪却堵塞了河道；想攀登太行山，漫天大雪又封满了山岭。","p":0,"r":1},{"t":"闲来垂钓碧溪上，忽复乘舟梦日边。","tr":"想起当年姜太公闲坐碧溪边垂钓，伊尹梦见乘船经过日边，后来都得到重用。","p":0,"r":1},{"t":"行路难，行路难，多歧路，今安在？","tr":"世路艰难啊，世路艰难，岔路这么多，我该走的路如今在哪里？","p":0,"r":1},{"t":"长风破浪会有时，直挂云帆济沧海。","tr":"相信总会有乘长风破巨浪的那一天，到那时我要高高挂起云帆，横渡茫茫大海。","p":0,"r":1}],"notes":[{"u":0,"w":"樽","m":"古代盛酒的器具","t":"实词","d":["盛饭的碗","古代的酒杯盖"]},{"u":0,"w":"羞","m":"同“馐”，美味的食物","t":"通假","d":["羞愧","进献"]},{"u":0,"w":"直","m":"同“值”，价值","t":"通假","d":["径直","笔直"]},{"u":1,"w":"箸","m":"筷子","t":"实词","d":["勺子","酒杯"]},{"u":1,"w":"茫然","m":"心中空虚迷惘、无所适从","t":"实词","d":["精神恍惚","毫不在乎"]},{"u":2,"w":"塞","m":"堵塞","t":"实词","d":["边塞","关隘"]},{"u":4,"w":"歧路","m":"岔路","t":"实词","d":["险路","归路"]},{"u":5,"w":"济","m":"渡过","t":"实词","d":["救济","帮助"]}],"tricky":["樽","羞","箸","歧"],"keyLines":[{"u":5,"hint":"诗人在苦闷之后仍坚信理想终会实现，表达乐观自信的两句是："},{"u":2,"hint":"以“冰塞”“雪满”象征人生道路上重重阻碍的两句是："},{"u":3,"hint":"诗人借姜太公、伊尹的典故，表达自己仍盼有朝一日得到重用的两句是："},{"u":4,"hint":"诗人感叹世路艰难、前路难觅的句子是："}],"appr":[{"q":"“欲渡黄河冰塞川，将登太行雪满山”有何表达效果？","a":"以眼前难以渡越的黄河、难以攀登的太行象征仕途上的重重险阻，形象地写出诗人理想受挫、前路受阻的苦闷。"},{"q":"全诗的感情有怎样的变化？","a":"由开头“停杯投箸”“心茫然”的苦闷，到“行路难”的慨叹，再到结尾“长风破浪”的振起，情绪跌宕起伏，终以乐观自信收束，体现李白豪放而执着的个性。"}]},{"id":"g9a-p02","volume":"g9a","title":"酬乐天扬州初逢席上见赠","author":"刘禹锡","dynasty":"唐","genre":"七言律诗","kind":"poem","intro":"刘禹锡被贬二十三年后回到洛阳，途经扬州与白居易相遇，白居易席上赠诗，他作此诗酬答。","theme":"感叹贬谪岁月漫长、人事变迁，同时表现乐观豁达、积极进取的胸襟。","tags":["酬赠","抒怀","哲理"],"units":[{"t":"巴山楚水凄凉地，二十三年弃置身。","tr":"在巴山楚水这些荒凉偏远的地方，我这个被朝廷抛弃的人度过了二十三年。","p":0,"r":1},{"t":"怀旧空吟闻笛赋，到乡翻似烂柯人。","tr":"怀念故友，只能徒然吟诵《闻笛赋》；回到故乡，反倒像烂柯的王质，恍如隔世。","p":0,"r":1},{"t":"沉舟侧畔千帆过，病树前头万木春。","tr":"沉船旁边有千万只船帆驶过，枯病的树前面有万千树木正值春天。","p":0,"r":1},{"t":"今日听君歌一曲，暂凭杯酒长精神。","tr":"今天听了你为我吟唱的诗篇，姑且借这杯酒来振作精神。","p":0,"r":1}],"notes":[{"u":0,"w":"弃置","m":"抛弃，指被贬谪","t":"实词","d":["放弃职守","搁置不用的物品"]},{"u":1,"w":"闻笛赋","m":"指向秀怀念亡友嵇康、吕安所写的《思旧赋》","t":"实词","d":["吹笛的赋体乐曲","听笛声作的诗"]},{"u":1,"w":"翻","m":"反而","t":"实词","d":["翻转","翻译"]},{"u":1,"w":"烂柯人","m":"典出王质入山观棋，斧柄烂尽，归来人事已非","t":"实词","d":["砍柴的樵夫","腐朽无用的人"]},{"u":2,"w":"侧畔","m":"旁边","t":"实词","d":["背后","上游"]},{"u":3,"w":"长","m":"增长，振作","t":"实词","d":["长久","擅长"]}],"tricky":["巴","弃","柯","帆"],"keyLines":[{"u":2,"hint":"诗人以新旧事物更替的形象比喻，表现豁达乐观胸襟的名句是："},{"u":0,"hint":"诗人概括自己被贬地点荒凉、时间漫长的两句是："},{"u":1,"hint":"诗人用典表达对亡友的怀念和归来后恍如隔世之感的两句是："},{"u":3,"hint":"诗人表示要借酒振作精神、重新奋发的两句是："}],"appr":[{"q":"“沉舟侧畔千帆过，病树前头万木春”蕴含怎样的哲理和情感？","a":"以沉舟、病树自喻，以千帆、万木比喻蓬勃的新事物，说明新事物必将取代旧事物，表现诗人不因个人失意而消沉的豁达胸怀。"},{"q":"颔联用了哪两个典故？有什么作用？","a":"用向秀作《思旧赋》和王质烂柯的典故，既写出对亡友的怀念，又写出久谪归来、人事全非的怅惘，暗示被贬时间之长。"}]},{"id":"g9a-p03","volume":"g9a","title":"水调歌头·明月几时有","author":"苏轼","dynasty":"北宋","genre":"词","kind":"poem","intro":"熙宁九年中秋，苏轼在密州，与弟弟苏辙已七年未见，对月饮酒到天亮，写下这首词。","theme":"借中秋明月抒写对弟弟的思念，并在人生哲理的思考中表现旷达乐观的胸怀。","tags":["中秋","思亲","哲理"],"units":[{"t":"丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。","tr":"丙辰年的中秋节，我高兴地饮酒直到天亮，喝得大醉，写下这首词，同时怀念弟弟子由。","p":0,"r":0},{"t":"明月几时有？把酒问青天。","tr":"明月是从什么时候开始有的？我端着酒杯向青天发问。","p":1,"r":1},{"t":"不知天上宫阙，今夕是何年。","tr":"不知道天上的宫殿里，今晚是哪一年。","p":1,"r":1},{"t":"我欲乘风归去，又恐琼楼玉宇，高处不胜寒。","tr":"我想乘着清风回到天上，又怕那美玉砌成的楼宇太高，承受不住寒冷。","p":1,"r":1},{"t":"起舞弄清影，何似在人间。","tr":"起身舞蹈，玩赏着月下清影，这哪里比得上留在人间呢。","p":1,"r":1},{"t":"转朱阁，低绮户，照无眠。","tr":"月光转过朱红的楼阁，低低地照进雕花的窗户，照着无法入睡的人。","p":2,"r":1},{"t":"不应有恨，何事长向别时圆？","tr":"月亮不该对人有什么怨恨吧，为什么偏偏在人们离别时才圆呢？","p":2,"r":1},{"t":"人有悲欢离合，月有阴晴圆缺，此事古难全。","tr":"人有悲欢离合，月有阴晴圆缺，这种事自古以来就难以圆满。","p":2,"r":1},{"t":"但愿人长久，千里共婵娟。","tr":"只希望亲人能平安长久，即使相隔千里，也能共赏这美好的月光。","p":2,"r":1}],"notes":[{"u":0,"w":"达旦","m":"到天亮","t":"实词","d":["到黄昏","通宵不眠"]},{"u":0,"w":"子由","m":"苏轼的弟弟苏辙的字","t":"实词","d":["苏轼的朋友","苏轼的儿子"]},{"u":2,"w":"宫阙","m":"宫殿","t":"实词","d":["城门","皇宫的围墙"]},{"u":3,"w":"不胜","m":"承受不了","t":"实词","d":["胜过","不能战胜"]},{"u":4,"w":"弄","m":"玩赏，摆弄","t":"实词","d":["戏弄","弄堂"]},{"u":4,"w":"何似","m":"哪里比得上","t":"实词","d":["为什么像","像什么"]},{"u":5,"w":"无眠","m":"指不眠之人","t":"词类活用"},{"u":6,"w":"长","m":"总是","t":"实词","d":["长久","生长"]},{"u":8,"w":"婵娟","m":"指月光，月亮","t":"实词","d":["美丽的女子","嫦娥的侍女"]}],"tricky":["阙","琼","绮","婵","娟"],"keyLines":[{"u":8,"hint":"词人对天下离别的亲人送上美好祝愿的句子是："},{"u":7,"hint":"词人以月的圆缺类比人生聚散，说明世事难以圆满的句子是："},{"u":3,"hint":"表现词人既向往天上又留恋人间的矛盾心情的句子是："},{"u":1,"hint":"词的开篇，以设问和举杯问天的方式发端的两句是："},{"u":4,"hint":"词人最终选择热爱人间生活的句子是："}],"appr":[{"q":"上阕表现了词人怎样的心理矛盾？","a":"词人幻想乘风飞上天宫，又担心高处寒冷难耐，最后觉得月下起舞不如留在人间，反映了出世与入世的矛盾，最终倾向热爱人间生活。"},{"q":"结尾“但愿人长久，千里共婵娟”表达了怎样的感情？","a":"由个人对弟弟的思念升华到对所有离别亲人的美好祝愿，把对亲人的思念化作旷达的情怀，意境开阔而温暖。"}]},{"id":"g9a-p04","volume":"g9a","title":"月夜忆舍弟","author":"杜甫","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"安史之乱期间，杜甫流落秦州，见边地秋景而思念战乱中离散的弟弟们，写下此诗。","theme":"借边塞秋夜的凄清，抒发对离散兄弟的牵挂和对战乱的忧伤。","tags":["思乡","怀亲","战乱"],"units":[{"t":"戍鼓断人行，边秋一雁声。","tr":"戍楼上的鼓声响起，隔断了行人往来；边塞的秋天里只有一只孤雁在哀鸣。","p":0,"r":1},{"t":"露从今夜白，月是故乡明。","tr":"从今夜起就进入白露节气，天上的月亮还是故乡的最明亮。","p":0,"r":1},{"t":"有弟皆分散，无家问死生。","tr":"我有几个弟弟，却都离散在各处，没有家可以打听他们的生死。","p":0,"r":1},{"t":"寄书长不达，况乃未休兵。","tr":"寄去的书信常常送不到，何况战争还没有停止。","p":0,"r":1}],"notes":[{"u":0,"w":"戍鼓","m":"戍楼上的鼓声，指边防的更鼓","t":"实词","d":["战场上的战鼓","报警的鼓声"]},{"u":0,"w":"断","m":"隔绝，使中断","t":"实词","d":["断裂","判断"]},{"u":0,"w":"边秋","m":"边塞的秋天","t":"实词","d":["秋天的边界","深秋"]},{"u":1,"w":"露从今夜白","m":"从今夜起进入白露节气","t":"特殊句式"},{"u":2,"w":"无家","m":"没有家可以问讯（家园已毁、兄弟离散）","t":"实词","d":["没有家人","不成家"]},{"u":3,"w":"长","m":"一直，总是","t":"实词","d":["长久","首领"]},{"u":3,"w":"况乃","m":"何况","t":"虚词"}],"tricky":["戍","鼓","况","乃"],"keyLines":[{"u":1,"hint":"诗人把故乡之月看得最明亮，表达思乡之情的名句是："},{"u":0,"hint":"诗人以戍鼓声和孤雁声渲染边塞凄清悲凉的两句是："},{"u":2,"hint":"诗人写兄弟离散、音信全无的两句是："},{"u":3,"hint":"诗人写战乱使家书难以送达的两句是："}],"appr":[{"q":"“露从今夜白，月是故乡明”好在哪里？","a":"“露”“月”提前、“白”“明”殿后，采用倒装；“月是故乡明”是心理错觉，月亮本无差别，但因思乡而觉故乡月更明，写出了深沉的乡情。"},{"q":"这首诗怎样做到情景交融？","a":"前两联写戍鼓、孤雁、白露、明月，营造凄清的氛围；后两联抒发对弟弟们的忧念，前面的景物都带着诗人的离愁，使情与景融为一体。"}]},{"id":"g9a-p05","volume":"g9a","title":"长沙过贾谊宅","author":"刘长卿","dynasty":"唐","genre":"七言律诗","kind":"poem","intro":"刘长卿曾遭贬谪，途经长沙，凭吊西汉被贬于此的贾谊故宅，借以抒发自己的不平。","theme":"凭吊贾谊的不幸遭遇，同时寄托自己遭贬的悲愤和失意。","tags":["咏史","凭吊","抒怀"],"units":[{"t":"三年谪宦此栖迟，万古惟留楚客悲。","tr":"你被贬官在此居住了三年，留给后世的只有楚地迁客的千古悲哀。","p":0,"r":1},{"t":"秋草独寻人去后，寒林空见日斜时。","tr":"我在秋草萋萋中独自寻觅你离去之后的遗迹，只见寒林里夕阳西斜。","p":0,"r":1},{"t":"汉文有道恩犹薄，湘水无情吊岂知？","tr":"汉文帝算是有道明君，对你的恩情仍然淡薄；湘水无情，又怎知我对你的凭吊之意？","p":0,"r":1},{"t":"寂寂江山摇落处，怜君何事到天涯！","tr":"在这寂静冷落、草木凋零的江山里，我同情你为何要漂泊到天涯！","p":0,"r":1}],"notes":[{"u":0,"w":"谪宦","m":"被贬官","t":"实词","d":["宦官","官职的任命"]},{"u":0,"w":"栖迟","m":"停留，居留","t":"实词","d":["迟到","栖息于树枝"]},{"u":0,"w":"楚客","m":"指被贬到楚地的贾谊","t":"实词","d":["楚国的客人","来自楚地的商人"]},{"u":1,"w":"空","m":"徒然，白白地","t":"实词","d":["天空","空虚"]},{"u":2,"w":"吊","m":"凭吊，祭奠","t":"实词","d":["悬挂","慰问"]},{"u":3,"w":"摇落","m":"草木凋零","t":"实词","d":["摇晃坠落","摇动"]},{"u":3,"w":"怜","m":"同情，哀怜","t":"实词","d":["爱慕","可爱"]}],"tricky":["谪","栖","寂","怜"],"keyLines":[{"u":3,"hint":"诗人感叹贾谊被贬、漂泊天涯，同时流露自伤的句子是："},{"u":2,"hint":"诗人认为汉文帝虽称有道却对贾谊恩情淡薄的两句是："},{"u":1,"hint":"诗人写在秋草寒林中独自寻访贾谊遗迹的情景的两句是："},{"u":0,"hint":"诗人概括贾谊被贬居住三年而留下千古悲慨的两句是："}],"appr":[{"q":"“秋草独寻人去后，寒林空见日斜时”如何渲染气氛？","a":"用秋草、寒林、斜阳等萧瑟意象，配合“独寻”“空见”，营造出冷寂凄凉的氛围，烘托凭吊时的悲伤心情。"},{"q":"诗人为何在凭吊贾谊时写下“怜君何事到天涯”？","a":"诗人同情贾谊无罪遭贬，也联想到自己同样被贬南方的处境，借他人的遭遇抒发自己的失意，哀人也自哀。"}]},{"id":"g9a-p06","volume":"g9a","title":"左迁至蓝关示侄孙湘","author":"韩愈","dynasty":"唐","genre":"七言律诗","kind":"poem","intro":"唐宪宗迎佛骨，韩愈上书劝谏，被贬潮州，途经蓝关时侄孙韩湘赶来相送，他写此诗留别。","theme":"表达因忠被贬的愤懑、坚持除弊的决心以及前途未卜的悲怆。","tags":["抒怀","贬谪","叙事"],"units":[{"t":"一封朝奏九重天，夕贬潮州路八千。","tr":"早晨我向朝廷上了一封奏章，晚上就被贬到八千里外的潮州。","p":0,"r":1},{"t":"欲为圣明除弊事，肯将衰朽惜残年！","tr":"本想为圣明的君主除去弊政，难道会因为年老体衰而顾惜残余的生命！","p":0,"r":1},{"t":"云横秦岭家何在？雪拥蓝关马不前。","tr":"阴云横亘在秦岭上，我的家在哪里？大雪拥塞了蓝关，马也停步不前。","p":0,"r":1},{"t":"知汝远来应有意，好收吾骨瘴江边。","tr":"我知道你远道而来一定有所用意，正好到瘴气弥漫的江边收殓我的尸骨。","p":0,"r":1}],"notes":[{"u":0,"w":"九重天","m":"指皇帝所居的朝廷","t":"实词","d":["九层高的天空","天界"]},{"u":1,"w":"弊事","m":"有害的事，弊政","t":"实词","d":["欺诈之事","疲惫之事"]},{"u":1,"w":"肯","m":"岂肯，怎肯","t":"虚词"},{"u":1,"w":"衰朽","m":"衰老无用，指年老体衰","t":"实词","d":["腐朽","衰败的国家"]},{"u":2,"w":"横","m":"横亘，遮蔽","t":"实词","d":["蛮横","横向"]},{"u":2,"w":"拥","m":"阻塞，拥堵","t":"实词","d":["拥抱","拥有"]},{"u":3,"w":"汝","m":"你","t":"实词","d":["汝水","这"]},{"u":3,"w":"瘴江","m":"南方有瘴气的江水","t":"实词","d":["瘴气弥漫的湖泊","江中的暗礁"]}],"tricky":["潮","弊","朽","拥","瘴"],"keyLines":[{"u":1,"hint":"诗人表明为国除弊、不顾个人安危的决心的两句是："},{"u":2,"hint":"诗人以秦岭云横、蓝关雪拥之景，写出前途渺茫、处境艰难的两句是："},{"u":0,"hint":"诗人概括早晨上书、晚上被贬的两句是："},{"u":3,"hint":"诗人叮嘱侄孙，预想自己死于贬所，表现悲壮心情的两句是："}],"appr":[{"q":"“云横秦岭家何在？雪拥蓝关马不前”有什么作用？","a":"通过云、雪、秦岭、蓝关的壮阔而阴沉的景象，既点明贬途地点，又以“家何在”“马不前”写出前途未卜的愁苦，情景交融。"},{"q":"诗中表现了诗人怎样的情感？","a":"既有因忠被贬的愤懑，又有不惜残年、坚持除弊的刚直，同时因被贬远地而悲凉，并流露对亲人的深情。"}]},{"id":"g9a-p07","volume":"g9a","title":"商山早行","author":"温庭筠","dynasty":"唐","genre":"五言律诗","kind":"poem","intro":"温庭筠羁旅奔波，清晨从商山出发赶路，见早行景色而思念家乡，写下此诗。","theme":"通过早行途中所见的景物，抒发游子羁旅的愁苦和思乡之情。","tags":["羁旅","思乡","写景"],"units":[{"t":"晨起动征铎，客行悲故乡。","tr":"清晨起来，远行车马的铃铎已响动，旅途中的我不禁怀念起故乡。","p":0,"r":1},{"t":"鸡声茅店月，人迹板桥霜。","tr":"鸡鸣声里，茅草店上挂着残月；木板桥上的白霜，已印着行人的足迹。","p":0,"r":1},{"t":"槲叶落山路，枳花明驿墙。","tr":"槲树的叶子落满了山路，白色的枳花照亮了驿站的泥墙。","p":0,"r":1},{"t":"因思杜陵梦，凫雁满回塘。","tr":"因此想起昨夜梦见了杜陵，梦里野鸭和大雁正游满曲折的池塘。","p":0,"r":1}],"notes":[{"u":0,"w":"征铎","m":"远行车马所挂的铃铛","t":"实词","d":["出征的战鼓","行人的拐杖"]},{"u":0,"w":"动","m":"响动，震动","t":"实词","d":["行动","感动"]},{"u":0,"w":"悲故乡","m":"因思念而悲伤，怀念故乡","t":"实词","d":["悲叹故乡败落","为故乡悲壮"]},{"u":1,"w":"茅店","m":"用茅草盖顶的旅店","t":"实词","d":["茅草堆","茅屋顶"]},{"u":2,"w":"槲","m":"一种落叶乔木","t":"实词","d":["柳树","桂花树"]},{"u":2,"w":"明","m":"照亮，使明亮","t":"词类活用"},{"u":3,"w":"杜陵","m":"在长安附近，诗人的家乡所在","t":"实词","d":["杜甫的故居","帝王的陵墓"]},{"u":3,"w":"回塘","m":"曲折的池塘","t":"实词","d":["回家的堤岸","往返的水路"]}],"tricky":["铎","槲","枳","驿","凫","塘"],"keyLines":[{"u":1,"hint":"全用名词意象组合、描绘出早行景色的千古名句是："},{"u":3,"hint":"诗人写梦中想起家乡春景的两句是："},{"u":0,"hint":"诗人点明清晨出发、触动思乡之情的两句是："},{"u":2,"hint":"诗人写山路落叶、驿墙花开的早行景物的两句是："}],"appr":[{"q":"“鸡声茅店月，人迹板桥霜”有什么艺术特色？","a":"全句由六个名词意象并置，不用动词，却写尽早行的清冷和孤寂，既点出“早”，又暗含行人羁旅的辛苦，被誉为千古名句。"},{"q":"尾联为何写梦中的凫雁满塘？","a":"以梦中家乡的温暖春景，与眼前清冷的旅途形成对比，反衬诗人的羁旅之苦和思乡之情。"}]},{"id":"g9a-p08","volume":"g9a","title":"咸阳城东楼","author":"许浑","dynasty":"唐","genre":"七言律诗","kind":"poem","intro":"许浑登上咸阳城东楼，面对秦汉故都，联想唐王朝日渐衰败的局势，写下此诗。","theme":"借登楼所见的秋景和历史遗迹，抒发对国势衰颓的忧虑与兴亡之感。","tags":["怀古","忧国","登临"],"units":[{"t":"一上高城万里愁，蒹葭杨柳似汀洲。","tr":"一登上高高的城楼，便涌起万里般的愁思；眼前的芦苇杨柳，像江南的水边平地。","p":0,"r":1},{"t":"溪云初起日沉阁，山雨欲来风满楼。","tr":"溪上云彩刚刚升起，太阳已沉到寺阁后面；山雨将要来临，风先吹满了城楼。","p":0,"r":1},{"t":"鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。","tr":"傍晚时分，鸟雀落进秦苑杂草丛中；秋天里，蝉在汉宫枯黄的树叶间鸣叫。","p":0,"r":1},{"t":"行人莫问当年事，故国东来渭水流。","tr":"过往的行人不要打听当年的旧事，只有渭水一如既往地从故都向东流去。","p":0,"r":1}],"notes":[{"u":0,"w":"蒹葭","m":"芦苇","t":"实词","d":["芦花","荷叶"]},{"u":0,"w":"汀洲","m":"水中小块陆地，水边平地","t":"实词","d":["水中之舟","小岛上的村落"]},{"u":1,"w":"沉阁","m":"落到寺阁后面","t":"实词","d":["沉没于楼阁","寺阁的倒影"]},{"u":1,"w":"山雨欲来风满楼","m":"比喻重大事件发生前的紧张气氛","t":"特殊句式"},{"u":2,"w":"绿芜","m":"丛生的杂草","t":"实词","d":["绿色的庭院","碧绿的草地"]},{"u":2,"w":"秦苑","m":"秦代的宫苑","t":"实词","d":["秦国的苑囿官员","秦朝的花园里的人"]},{"u":3,"w":"故国","m":"指故都，旧都","t":"古今异义","d":["祖国","故乡"]}],"tricky":["蒹","葭","汀","芜","渭"],"keyLines":[{"u":1,"hint":"诗人以自然景象暗示时局将有重大变故的名句是："},{"u":3,"hint":"诗人劝行人不要追问往事，以渭水东流寄托兴亡感慨的两句是："},{"u":2,"hint":"诗人以鸟、蝉点缀秦苑汉宫，渲染荒凉的两句是："},{"u":0,"hint":"诗人写登楼后顿生万里愁思的句子是："}],"appr":[{"q":"“山雨欲来风满楼”好在哪里？","a":"以将雨先风的自然景象，暗示一场重大危机即将来临，既写景，又预兆国势动荡，成为后世常用来比喻紧张局势的名句。"},{"q":"这首诗怎样抒发感情？","a":"颔联以景起势，颈联借秦苑汉宫的荒凉写兴亡，尾联以渭水东流写历史无情，借登楼怀古抒发对国家前途的忧虑，景中含情。"}]},{"id":"g9a-p09","volume":"g9a","title":"无题（相见时难别亦难）","author":"李商隐","dynasty":"唐","genre":"七言律诗","kind":"poem","intro":"这是李商隐的爱情诗，写别后相思的深情，以委婉缠绵的笔法表达坚贞不渝的情意。","theme":"抒写离别相思之苦与至死不渝的坚贞爱情。","tags":["爱情","相思","抒情"],"units":[{"t":"相见时难别亦难，东风无力百花残。","tr":"相见本已很难，离别时更是难舍难分，东风无力，百花凋残。","p":0,"r":1},{"t":"春蚕到死丝方尽，蜡炬成灰泪始干。","tr":"春蚕到死才吐完丝，蜡烛燃成灰烬，烛泪才会流干。","p":0,"r":1},{"t":"晓镜但愁云鬓改，夜吟应觉月光寒。","tr":"清晨对镜，只愁乌黑的鬓发变白；夜晚吟诗，想必会觉得月光清冷。","p":0,"r":1},{"t":"蓬山此去无多路，青鸟殷勤为探看。","tr":"蓬莱山离这里并不算远，愿青鸟殷勤地替我去探望她。","p":0,"r":1}],"notes":[{"u":0,"w":"东风无力","m":"暮春时节东风衰微","t":"实词","d":["东风迟缓","东风已吹尽"]},{"u":1,"w":"丝","m":"谐音“思”，双关相思","t":"实词","d":["蚕丝织成的布","细线"]},{"u":1,"w":"泪","m":"指蜡烛燃烧时流下的蜡油，象征相思之泪","t":"实词","d":["哭泣","露水"]},{"u":2,"w":"晓镜","m":"清晨对镜梳妆","t":"实词","d":["明亮的镜子","晨曦"]},{"u":2,"w":"云鬓","m":"女子如云般的鬓发","t":"实词","d":["云雾般的山峦","云彩"]},{"u":3,"w":"蓬山","m":"蓬莱山，传说中的仙山，喻对方居处","t":"实词","d":["高山","仙人居住的蓬莱岛上的草"]},{"u":3,"w":"青鸟","m":"传说中西王母的使者，代指传信的使者","t":"实词","d":["青色的小鸟","鸟类的统称"]},{"u":3,"w":"殷勤","m":"情意恳切","t":"实词","d":["热心周到","辛勤劳作"]}],"tricky":["蚕","炬","鬓","蓬","殷"],"keyLines":[{"u":1,"hint":"诗人以春蚕、蜡烛为喻，表达至死不渝的爱情的名句是："},{"u":0,"hint":"诗人写离别之难和暮春景象的两句是："},{"u":2,"hint":"诗人想象对方清晨对镜忧愁、夜里吟诗感寒的两句是："},{"u":3,"hint":"诗人希望青鸟传信、探望所思之人的两句是："}],"appr":[{"q":"“春蚕到死丝方尽，蜡炬成灰泪始干”运用了什么手法？","a":"运用比喻和双关：“丝”谐“思”，“泪”既指蜡泪又指相思之泪，写出相思至死方休的痴情与执着。"},{"q":"尾联表达了怎样的情感？","a":"以“无多路”写距离不远，却又希望借青鸟传信，写出想相见又无法相见的惆怅与期盼，为全诗留下余韵。"}]},{"id":"g9a-p10","volume":"g9a","title":"行香子·树绕村庄","author":"秦观","dynasty":"北宋","genre":"词","kind":"poem","intro":"秦观写春日田园的一首小词，以清新质朴的笔调描绘乡村春光。","theme":"描绘春天田园的明媚景象，表现词人闲适愉悦的心境。","tags":["写景","春景","田园"],"units":[{"t":"树绕村庄，水满陂塘；","tr":"绿树环绕着村庄，春水涨满了池塘；","p":0,"r":1},{"t":"倚东风，豪兴徜徉；","tr":"迎着东风，兴致高昂地漫步闲游；","p":0,"r":1},{"t":"小园几许，收尽春光。","tr":"小小的园子虽不大，却把春光都收进来了。","p":0,"r":1},{"t":"有桃花红，李花白，菜花黄。","tr":"有红红的桃花，白白的李花，黄黄的菜花。","p":0,"r":1},{"t":"远远围墙，隐隐茅堂；","tr":"远处有一圈围墙，隐约可见几间茅屋；","p":1,"r":1},{"t":"飐青旗，流水桥旁。","tr":"小桥流水旁，青色酒旗在风中飘动。","p":1,"r":1},{"t":"偶然乘兴，步过东冈。","tr":"偶然有了兴致，信步走过东面的山冈。","p":1,"r":1},{"t":"正莺儿啼，燕儿舞，蝶儿忙。","tr":"正是黄莺啼叫、燕子飞舞、蝴蝶忙碌的时节。","p":1,"r":1}],"notes":[{"u":0,"w":"陂塘","m":"池塘","t":"实词","d":["堤坝","山坡下的田地"]},{"u":1,"w":"倚","m":"凭借，迎着","t":"实词","d":["倚靠","依赖"]},{"u":1,"w":"徜徉","m":"闲游自在地行走","t":"实词","d":["徘徊犹豫","漫无目的地漂泊"]},{"u":2,"w":"几许","m":"多少，这里指不多","t":"古今异义","d":["几个","几多时间"]},{"u":5,"w":"飐","m":"风吹颤动","t":"实词","d":["悬挂","飞扬跋扈"]},{"u":5,"w":"青旗","m":"酒旗，旧时酒店的招牌旗","t":"实词","d":["青色的军旗","青色的旌旗仪仗"]},{"u":6,"w":"东冈","m":"东边的山冈","t":"实词","d":["东方的山脉","东面的田埂"]}],"tricky":["陂","徜","徉","飐","冈"],"keyLines":[{"u":3,"hint":"词人用桃花、李花、菜花的不同颜色描绘春天景色的句子是："},{"u":7,"hint":"词人以莺、燕、蝶的活动描写春光热闹的句子是："},{"u":2,"hint":"词人称赞小园虽小却包含了整个春天的句子是："},{"u":0,"hint":"词人描绘绿树环绕村庄、春水涨满池塘的句子是："}],"appr":[{"q":"上片和下片分别写了什么？有何不同？","a":"上片以树、水、小园和红白黄的春花，写近处静态的景色；下片写远处的围墙、茅堂、酒旗和啼鸣飞舞的莺燕蝶，由静到动，更显春意盎然。"},{"q":"词中的色彩描写有什么作用？","a":"“红”“白”“黄”“青”等色彩，使画面明丽鲜艳，突出春天的生机和田园的美好，表现词人愉快的心情。"}]},{"id":"g9a-p11","volume":"g9a","title":"丑奴儿·书博山道中壁","author":"辛弃疾","dynasty":"南宋","genre":"词","kind":"poem","intro":"辛弃疾被排挤闲居江西带湖，往来博山道中，在寺壁上题写此词，抒发壮志难酬的苦闷。","theme":"通过少年与如今对愁的不同感受，表达壮志难酬、有苦难言的忧愤。","tags":["抒怀","忧愤","对比"],"units":[{"t":"少年不识愁滋味，爱上层楼。","tr":"年少时不懂得忧愁的滋味，喜欢登上高楼眺望。","p":0,"r":1},{"t":"爱上层楼，为赋新词强说愁。","tr":"喜欢登上高楼，为了写新词而勉强说愁。","p":0,"r":1},{"t":"而今识尽愁滋味，欲说还休。","tr":"如今尝尽了忧愁的滋味，想说却又不说了。","p":1,"r":1},{"t":"欲说还休，却道“天凉好个秋”！","tr":"想说又不说，却说一句“天气凉了，好一个秋天啊”！","p":1,"r":1}],"notes":[{"u":0,"w":"不识","m":"不懂得，没有体会到","t":"实词","d":["不认识","不愿意认识"]},{"u":0,"w":"层楼","m":"高楼","t":"实词","d":["楼房的一层","多层的台阶"]},{"u":1,"w":"赋","m":"创作（诗词）","t":"实词","d":["赋税","赋予"]},{"u":1,"w":"强","m":"勉强","t":"实词","d":["强大","强迫"]},{"u":2,"w":"识尽","m":"尝尽，深知","t":"实词","d":["认遍","识别完毕"]},{"u":2,"w":"还休","m":"却又停止","t":"实词","d":["还要休息","归来休养"]},{"u":3,"w":"却道","m":"却说","t":"实词","d":["退却的道路","却是说道"]}],"tricky":["愁","赋","强","休","滋"],"keyLines":[{"u":3,"hint":"词人想说愁苦却说不出，转而谈天气的句子是："},{"u":0,"hint":"词人写少年时不懂忧愁的滋味、喜欢登楼的句子是："},{"u":2,"hint":"词人写如今尝尽忧愁滋味的句子是："},{"u":1,"hint":"词人写少年为写新词而勉强说愁的句子是："}],"appr":[{"q":"上下片的“愁”有什么不同？","a":"上片的“愁”是少年不知愁、为作词而强说的轻愁，下片是饱经世事后无法言说的深愁，对比之下突出如今愁苦的深重。"},{"q":"结尾“却道‘天凉好个秋’”有什么作用？","a":"以轻描淡写的话掩盖满腹愁苦，言浅意深，表现词人有苦难言、不便明说的郁闷，含蓄而耐人寻味。"}]},{"id":"g9a-w01","volume":"g9a","title":"岳阳楼记","author":"范仲淹","dynasty":"北宋","genre":"散文（楼记，记叙兼议论）","kind":"prose","intro":"庆历六年，范仲淹应被贬巴陵的好友滕子京之请，为重修岳阳楼写下此记。当时作者自己也因庆历新政失败被贬邓州，文章借景抒怀，抒发心系天下的志向。","theme":"通过描写岳阳楼的览物之情，阐发“不以物喜，不以己悲”的古仁人之心，表达先忧后乐的政治抱负。","tags":["记游","写景","议论","抒怀"],"units":[{"t":"庆历四年春，滕子京谪守巴陵郡。","tr":"庆历四年的春天，滕子京被降职到巴陵郡做太守。","p":0,"r":1},{"t":"越明年，政通人和，百废具兴，","tr":"到了第二年，政事顺利，百姓和乐，各种荒废的事业都兴办起来了，","p":0,"r":1},{"t":"乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，","tr":"于是重新修建岳阳楼，扩大它原有的规模，把唐代名家和当代人的诗文刻在楼上，","p":0,"r":1},{"t":"属予作文以记之。","tr":"嘱托我写一篇文章来记述这件事。","p":0,"r":1},{"t":"予观夫巴陵胜状，在洞庭一湖。","tr":"我看那巴陵郡的美好景色，全在洞庭湖上。","p":1,"r":1},{"t":"衔远山，吞长江，浩浩汤汤，横无际涯，","tr":"它衔着远处的山峦，吞纳着长江的流水，水势浩大，宽阔无边，","p":1,"r":1},{"t":"朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。","tr":"早晨阳光明媚，傍晚阴云密布，景象千变万化，这就是岳阳楼的雄伟景观，前人的记述已经很详尽了。","p":1,"r":1},{"t":"然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？","tr":"那么，北边通到巫峡，南边直达潇水、湘水，被贬的官员和诗人，大多在此聚会，他们看到景物而生的感情，恐怕会有所不同吧？","p":1,"r":1},{"t":"若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空，","tr":"像那阴雨连绵，一连几个月不放晴，寒风怒吼，浑浊的浪头直冲天空，","p":2,"r":1},{"t":"日星隐曜，山岳潜形，商旅不行，樯倾楫摧，","tr":"太阳和星星隐藏了光辉，山岳隐没了形体，商人和旅客无法通行，桅杆倒下，船桨折断，","p":2,"r":1},{"t":"薄暮冥冥，虎啸猿啼。","tr":"傍晚天色昏暗，虎在长啸，猿在悲啼。","p":2,"r":1},{"t":"登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。","tr":"这时登上这座楼，就会产生远离京城、怀念家乡、担心谗言、害怕讥讽的心情，满眼萧条冷落，感慨万分而悲伤了。","p":2,"r":1},{"t":"至若春和景明，波澜不惊，上下天光，一碧万顷，","tr":"至于春风和暖、阳光明媚的时候，湖面平静没有波涛，天色湖光上下相连，一片碧绿，广阔无际，","p":3,"r":1},{"t":"沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。","tr":"沙洲上的鸥鸟时而飞翔时而停歇，美丽的鱼儿游来游去，岸边的香草和小洲上的兰花，草木茂盛，一片青翠。","p":3,"r":1},{"t":"而或长烟一空，皓月千里，浮光跃金，静影沉璧，","tr":"有时大片烟雾完全消散，皎洁的月光洒向千里，浮动的光闪着金色，静静的月影像沉入水中的玉璧，","p":3,"r":1},{"t":"渔歌互答，此乐何极！","tr":"渔夫的歌声此唱彼和，这种乐趣哪里有穷尽！","p":3,"r":1},{"t":"登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。","tr":"这时登上这座楼，就会心胸开阔，精神愉快，光荣和屈辱一并忘却，端着酒杯迎着微风，喜气洋洋。","p":3,"r":1},{"t":"嗟夫！予尝求古仁人之心，或异二者之为，何哉？","tr":"唉！我曾经探求过古时品德高尚的人的心思，他们或许不同于以上两种表现，这是为什么呢？","p":4,"r":1},{"t":"不以物喜，不以己悲；","tr":"他们不因外物的好坏和自己的得失而或喜或悲；","p":4,"r":1},{"t":"居庙堂之高则忧其民，处江湖之远则忧其君。","tr":"身居朝廷高位就为百姓担忧，处在僻远的江湖就为君王担忧。","p":4,"r":1},{"t":"是进亦忧，退亦忧。","tr":"这样，进入朝廷做官也忧虑，退居江湖也忧虑。","p":4,"r":1},{"t":"然则何时而乐耶？","tr":"既然如此，那他们什么时候才快乐呢？","p":4,"r":1},{"t":"其必曰“先天下之忧而忧，后天下之乐而乐”乎！","tr":"他们一定会说：“在天下人忧愁之前先忧愁，在天下人快乐之后才快乐”吧！","p":4,"r":1},{"t":"噫！微斯人，吾谁与归？","tr":"唉！如果没有这样的人，我同谁一道呢？","p":4,"r":1},{"t":"时六年九月十五日。","tr":"写于庆历六年九月十五日。","p":4,"r":0}],"notes":[{"u":0,"w":"谪守","m":"贬官去做地方长官","t":"实词","d":["遭受指责而守卫","被贬后看守"]},{"u":1,"w":"越","m":"到了（某年）","t":"实词","d":["越过","超出"]},{"u":1,"w":"具","m":"通“俱”，全，都","t":"通假","d":["具备","工具"]},{"u":1,"w":"百废","m":"各种荒废的事业","t":"实词","d":["百般废弛","上百件废品"]},{"u":2,"w":"乃","m":"于是","t":"虚词","d":[]},{"u":2,"w":"旧制","m":"原有的规模","t":"实词","d":["旧的制度","旧的法令"]},{"u":3,"w":"属","m":"通“嘱”，嘱托","t":"通假","d":["隶属","类别"]},{"u":4,"w":"胜状","m":"美好的景色","t":"实词","d":["胜利的状态","优胜的形状"]},{"u":5,"w":"衔","m":"含，连接","t":"实词","d":["用嘴叼着","怀恨"]},{"u":5,"w":"浩浩汤汤","m":"水势浩大、水流奔腾的样子（汤读shāng）","t":"实词","d":["热水翻滚的样子","汤汁浓稠的样子"]},{"u":6,"w":"备","m":"详尽，完备","t":"实词","d":["准备","防备"]},{"u":6,"w":"大观","m":"雄伟壮阔的景象","t":"实词","d":["全面观察","盛大的观赏"]},{"u":7,"w":"然则","m":"那么","t":"古今异义","d":["既然这样","但是却"]},{"u":7,"w":"迁客骚人","m":"被贬谪的官员和诗人","t":"古今异义","d":["迁居的客人与烦扰的人","搬迁的旅人和忧郁的人"]},{"u":7,"w":"得无","m":"恐怕……吧，能不……吗","t":"特殊句式","d":[]},{"u":8,"w":"若夫","m":"至于，像那（用于句首引起下文）","t":"虚词","d":[]},{"u":8,"w":"开","m":"放晴，天晴","t":"实词","d":["打开","开始"]},{"u":9,"w":"曜","m":"光辉，日光","t":"实词","d":["照耀","星期"]},{"u":9,"w":"潜形","m":"隐没形体","t":"实词","d":["潜水的形状","潜在的形象"]},{"u":9,"w":"樯","m":"桅杆","t":"实词","d":["围墙","船帆"]},{"u":10,"w":"薄暮","m":"傍晚，日落时","t":"实词","d":["薄薄的暮色","稀薄的云"]},{"u":11,"w":"去国","m":"离开国都（京城）","t":"古今异义","d":["离开祖国","出国"]},{"u":11,"w":"感极","m":"感慨到极点","t":"实词","d":["感觉到顶点","感动至深"]},{"u":12,"w":"景","m":"日光","t":"古今异义","d":["风景","景象"]},{"u":12,"w":"一碧万顷","m":"一片碧绿，广阔无际","t":"实词","d":["一块碧玉有万顷大","一座碧绿的湖"]},{"u":13,"w":"锦鳞","m":"美丽的鱼（借代）","t":"实词","d":["锦绣的鱼鳞","金色的龙鳞"]},{"u":13,"w":"游泳","m":"（鱼）游来游去","t":"古今异义","d":["人在水中游","水中比赛"]},{"u":13,"w":"郁郁","m":"（草木）茂盛的样子","t":"实词","d":["忧愁不快的样子","香气浓郁"]},{"u":14,"w":"而或","m":"有时","t":"古今异义","d":["而且或许","并且有人"]},{"u":14,"w":"浮光跃金","m":"浮动的光像跳跃的金子","t":"实词","d":["漂浮的光芒掉落黄金","上浮的光让金子跳跃"]},{"u":16,"w":"偕","m":"一同，一起","t":"实词","d":["并存","互相"]},{"u":17,"w":"或异二者之为","m":"或许不同于（前两种）人的表现（省略句式、状语后置）","t":"特殊句式","d":[]},{"u":18,"w":"以","m":"因为","t":"一词多义","d":["用","认为"]},{"u":19,"w":"庙堂","m":"朝廷","t":"实词","d":["寺庙的殿堂","祖庙"]},{"u":19,"w":"江湖","m":"指僻远的民间、地方","t":"古今异义","d":["江河湖海","走江湖的人"]},{"u":22,"w":"先","m":"在……之前（名词作状语）","t":"词类活用","d":[]},{"u":23,"w":"微","m":"如果没有","t":"实词","d":["细微","小"]},{"u":23,"w":"吾谁与归","m":"我同谁一起呢（宾语前置）","t":"特殊句式","d":[]}],"tricky":["谪","樯","楫","汀","皓","谗"],"keyLines":[{"u":22,"hint":"《岳阳楼记》中，表现作者忧国忧民、先人后己的崇高政治抱负的千古名句是："},{"u":18,"hint":"古仁人面对外物的好坏与个人的得失，所持的态度是："},{"u":19,"hint":"《岳阳楼记》中，写无论处于朝廷还是民间都心系民与君的句子是："},{"u":6,"hint":"概括洞庭湖风光变化多端、景象万千的句子是："},{"u":14,"hint":"描写洞庭湖月夜景色，波光如金、月影如璧的句子是："},{"u":5,"hint":"写洞庭湖连山、纳江，水势浩荡无边的句子是："}],"appr":[{"q":"文章写“悲”“喜”两种览物之情，各用了怎样的景物与心情？","a":"悲情写阴雨连绵、浊浪排空、虎啸猿啼的萧索之景，引出去国怀乡、忧谗畏讥；喜情写春和景明、碧波鸥鹭、皓月渔歌之景，引出心旷神怡、宠辱偕忘。两者形成鲜明对比。"},{"q":"“先天下之忧而忧，后天下之乐而乐”表达了怎样的思想？","a":"表达了作者以天下为己任、把国家和百姓放在首位的政治抱负，也是对“古仁人之心”的概括，体现了超越个人得失的博大胸怀和强烈的忧患意识，成为后世志士的精神旗帜。"},{"q":"全文结构上是怎样由记叙转入议论的？","a":"先交代重修岳阳楼的缘由，再写洞庭大观，然后以“览物之情，得无异乎”过渡，分写悲喜两种览物之情，最后以“嗟夫”转入议论，提出古仁人之心，借景抒怀，层层推进。"}]},{"id":"g9a-w02","volume":"g9a","title":"醉翁亭记","author":"欧阳修","dynasty":"北宋","genre":"散文（游记，亭记）","kind":"prose","intro":"欧阳修因支持庆历新政遭贬，出任滁州太守。本文写于滁州，记述醉翁亭周边的山水之美与太守同游宴饮的情景，寄寓贬谪中的旷达与政治理想。","theme":"通过描写滁州山水之美和与民同乐的游宴之景，表达作者寄情山水、与民同乐的情怀，含有政治失意的郁闷。","tags":["游记","写景","抒怀","与民同乐"],"units":[{"t":"环滁皆山也。","tr":"环绕滁州城的都是山。","p":0,"r":1},{"t":"其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。","tr":"它西南面的几座山峰，树林和山谷特别优美，远远望去树木茂盛、幽深秀丽的，就是琅琊山。","p":0,"r":1},{"t":"山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。","tr":"沿着山路走六七里，渐渐听到潺潺的水声，从两座山峰之间飞泻出来的，是酿泉。","p":0,"r":1},{"t":"峰回路转，有亭翼然临于泉上者，醉翁亭也。","tr":"山势回环，路也跟着拐弯，有一座亭子像鸟张开翅膀一样高踞在泉水之上的，就是醉翁亭。","p":0,"r":1},{"t":"作亭者谁？山之僧智仙也。","tr":"建造这座亭子的是谁？是山中的和尚智仙。","p":0,"r":1},{"t":"名之者谁？太守自谓也。","tr":"给它取名的是谁？是太守用自己的别号来命名的。","p":0,"r":1},{"t":"太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。","tr":"太守和宾客来这里饮酒，喝一点就醉，而且年纪又最大，所以给自己取号叫“醉翁”。","p":0,"r":1},{"t":"醉翁之意不在酒，在乎山水之间也。","tr":"醉翁的心意不在于喝酒，而在于山水之间。","p":0,"r":1},{"t":"山水之乐，得之心而寓之酒也。","tr":"欣赏山水的乐趣，是领会在心里而寄托在酒上的。","p":0,"r":1},{"t":"若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。","tr":"太阳出来，林中雾气散开；烟云聚拢，山谷就昏暗了；明暗交替变化，这就是山中的早晨和傍晚。","p":1,"r":1},{"t":"野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。","tr":"野花开放散发清幽的香气，好树枝叶繁盛形成浓阴，秋天风高霜洁，冬天水位下降石头显露，这就是山中的四季。","p":1,"r":1},{"t":"朝而往，暮而归，四时之景不同，而乐亦无穷也。","tr":"早晨上山，傍晚回来，四季景色各不相同，乐趣也是无穷无尽的。","p":1,"r":1},{"t":"至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。","tr":"至于背着东西的人在路上歌唱，走路的人在树下休息，前面的人呼喊，后面的人应答，老人弯腰走路，小孩被牵着走，来来往往络绎不绝，这是滁州人在出游。","p":2,"r":1},{"t":"临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。","tr":"到溪边钓鱼，溪水深而鱼儿肥美；用酿泉的水酿酒，泉水香甜酒水清冽；野味野菜，杂乱地摆在面前，这是太守在宴请宾客。","p":2,"r":1},{"t":"宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。","tr":"宴席上畅饮的乐趣，不在音乐，投壶的人投中了，下棋的人赢了，酒杯酒筹交错，人们或起或坐大声说笑，这是宾客们在欢乐。","p":2,"r":1},{"t":"苍颜白发，颓然乎其间者，太守醉也。","tr":"面容苍老，头发花白，醉醺醺地坐在人群中间的，是太守喝醉了。","p":2,"r":1},{"t":"已而夕阳在山，人影散乱，太守归而宾客从也。","tr":"不久太阳落到山头，人影散乱，是太守回去、宾客跟随着。","p":3,"r":1},{"t":"树林阴翳，鸣声上下，游人去而禽鸟乐也。","tr":"树林枝叶茂密成荫，鸟鸣声上下相应，是游人离去后禽鸟在欢乐。","p":3,"r":1},{"t":"然而禽鸟知山林之乐，而不知人之乐；","tr":"然而鸟儿只知道山林中的快乐，却不知道人们的快乐；","p":3,"r":1},{"t":"人知从太守游而乐，而不知太守之乐其乐也。","tr":"人们只知道跟着太守游玩而快乐，却不知道太守是以他们的快乐为快乐。","p":3,"r":1},{"t":"醉能同其乐，醒能述以文者，太守也。","tr":"喝醉了能和大家一同欢乐，醒来能用文章记述这件乐事的，是太守。","p":3,"r":1},{"t":"太守谓谁？庐陵欧阳修也。","tr":"太守是谁呢？是庐陵的欧阳修。","p":3,"r":1}],"notes":[{"u":0,"w":"环","m":"环绕","t":"实词","d":["圆环","环境"]},{"u":1,"w":"蔚然","m":"草木茂盛的样子","t":"实词","d":["花色艳丽的样子","壮观的样子"]},{"u":1,"w":"深秀","m":"幽深秀丽","t":"实词","d":["深厚优秀","深邃茂密"]},{"u":2,"w":"潺潺","m":"流水声","t":"实词","d":["水波荡漾的样子","雨声"]},{"u":2,"w":"泻","m":"（水）喷涌而出，倾泻","t":"实词","d":["腹泻","流淌渐缓"]},{"u":3,"w":"峰回路转","m":"山势回环，道路转弯","t":"实词","d":["山峰返回原路","路上转盘"]},{"u":3,"w":"翼然","m":"像鸟张开翅膀一样","t":"实词","d":["翅膀整齐的样子","轻盈欲飞的样子"]},{"u":3,"w":"临","m":"居高处面对，靠近","t":"实词","d":["来到","面临"]},{"u":4,"w":"作","m":"建造","t":"实词","d":["写作","兴起"]},{"u":5,"w":"名","m":"命名（名词作动词）","t":"词类活用","d":[]},{"u":5,"w":"谓","m":"命名，称呼","t":"实词","d":["说","认为"]},{"u":6,"w":"辄","m":"就，总是","t":"实词","d":["立刻","常常"]},{"u":6,"w":"号","m":"取别号（名词作动词）","t":"词类活用","d":[]},{"u":6,"w":"年又最高","m":"年纪又最大","t":"实词","d":["年龄又最小","地位又最高"]},{"u":7,"w":"意","m":"情趣，心意","t":"实词","d":["意思","意外"]},{"u":8,"w":"寓","m":"寄托","t":"实词","d":["居住","寓言"]},{"u":9,"w":"林霏","m":"树林中的雾气","t":"实词","d":["林间的小雨","树林中的暗影"]},{"u":9,"w":"暝","m":"昏暗","t":"实词","d":["闭眼","夜晚"]},{"u":9,"w":"晦明","m":"昏暗和明亮","t":"实词","d":["昏沉和清醒","阴天晴天"]},{"u":10,"w":"秀","m":"（草木）开花结果，繁荣（形容词作动词）","t":"词类活用","d":[]},{"u":10,"w":"繁阴","m":"浓密的绿荫","t":"实词","d":["繁忙的阴云","频繁变阴"]},{"u":11,"w":"朝而往","m":"早晨前往（朝，早晨）","t":"实词","d":["朝着前往","朝廷出发"]},{"u":12,"w":"伛偻","m":"腰背弯曲的人，指老人","t":"实词","d":["驼背的小孩","弯腰行礼的人"]},{"u":12,"w":"提携","m":"被搀扶着走的人，指小孩","t":"实词","d":["提拔扶持","携带物品"]},{"u":13,"w":"渔","m":"捕鱼（名词作动词）","t":"词类活用","d":[]},{"u":13,"w":"洌","m":"清澈","t":"实词","d":["寒冷","浓烈"]},{"u":13,"w":"山肴野蔌","m":"野味和野菜","t":"实词","d":["山里的酒菜野花","野生的竹笋"]},{"u":13,"w":"杂然","m":"错杂的样子","t":"实词","d":["混乱的样子","杂乱无章"]},{"u":14,"w":"宴酣","m":"宴饮尽兴","t":"实词","d":["宴会结束","宴席丰盛"]},{"u":14,"w":"射","m":"投壶（一种游戏）","t":"实词","d":["射箭","发射"]},{"u":14,"w":"觥筹交错","m":"酒杯和酒筹错杂","t":"实词","d":["酒杯互相碰撞","筹码交换"]},{"u":15,"w":"颓然","m":"醉倒的样子","t":"实词","d":["衰败的样子","沮丧的样子"]},{"u":16,"w":"已而","m":"不久，过了一会儿","t":"古今异义","d":["而已","已经"]},{"u":17,"w":"阴翳","m":"枝叶茂密成荫","t":"实词","d":["阴暗遮蔽","昏暗的云"]},{"u":19,"w":"乐其乐","m":"以……的快乐为快乐（意动用法）","t":"词类活用","d":[]},{"u":20,"w":"述","m":"记述","t":"实词","d":["叙述故事","阐述道理"]},{"u":3,"w":"有亭翼然临于泉上者","m":"“者”字结构，后置定语","t":"特殊句式","d":[]}],"tricky":["琅","琊","蔚","潺","觥","翳"],"keyLines":[{"u":7,"hint":"《醉翁亭记》中，点明作者真正情趣不在饮酒而在山水的句子是："},{"u":8,"hint":"说明作者领会山水之乐并寄托于酒的句子是："},{"u":9,"hint":"写山间早晚景色变化的句子是："},{"u":11,"hint":"总结山中早晚出游、四季景色不同而乐趣无穷的句子是："},{"u":19,"hint":"表明太守以百姓之乐为乐的句子是："}],"appr":[{"q":"“醉翁之意不在酒，在乎山水之间也”蕴含了作者怎样的思想感情？","a":"表面写饮酒，实则寄情山水；作者被贬滁州，借山水排遣内心的苦闷，同时也显示出他自适旷达的胸怀，这句话是全文的主旨，也是全文感情的发端。"},{"q":"文章末段为什么写“禽鸟之乐”“人之乐”“太守之乐”？有什么作用？","a":"通过禽鸟、游人、太守三层欢乐层层递进，突出太守的快乐在于与民同乐，在于让百姓安乐的政治理想，揭示出作者“乐其乐”的深层含义，使文章主旨升华。"},{"q":"全文多用“也”字句式，有什么表达效果？","a":"二十一句中大量以“也”收尾，形成舒缓的节奏与轻松悠闲的语调，将作者陶醉山水、闲适而旷达的心情自然传达出来，体现了骈散结合的语言魅力。"}]},{"id":"g9a-w03","volume":"g9a","title":"湖心亭看雪","author":"张岱","dynasty":"明","genre":"小品文（散文）","kind":"prose","intro":"选自张岱《陶庵梦忆》。明亡后张岱隐居山中，追忆往昔，此文记崇祯五年他夜游西湖湖心亭赏雪的经历。","theme":"描绘西湖雪景的空灵静寂，写与金陵客的偶遇，抒发作者孤高自赏的情怀和人生渺茫的感慨、故国之思。","tags":["小品文","写景","抒怀","故国之思"],"units":[{"t":"崇祯五年十二月，余住西湖。","tr":"崇祯五年十二月，我住在西湖边。","p":0,"r":0},{"t":"大雪三日，湖中人鸟声俱绝。","tr":"大雪接连下了三天，湖中的行人、飞鸟的声音全都消失了。","p":0,"r":0},{"t":"是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。","tr":"这天晚上八点左右，我撑着一叶小舟，穿着毛皮衣，带着火炉，独自前往湖心亭看雪。","p":0,"r":1},{"t":"雾凇沆砀，天与云与山与水，上下一白，","tr":"湖上冰花弥漫，天与云、与山、与水，上下一片白色，","p":0,"r":1},{"t":"湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。","tr":"湖面上的影子，只有一道长堤的痕迹，湖心亭的一点轮廓，和我的一叶小舟，以及舟中的两三粒人影罢了。","p":0,"r":1},{"t":"到亭上，有两人铺毡对坐，一童子烧酒炉正沸。","tr":"到了亭子上，看见有两个人铺着毡子相对而坐，一个童子正把酒炉烧得滚沸。","p":1,"r":0},{"t":"见余，大喜曰：“湖中焉得更有此人！”","tr":"他们看见我，非常高兴地说：“湖中哪里想到还会有您这样的人！”","p":1,"r":0},{"t":"拉余同饮。","tr":"拉着我一起喝酒。","p":1,"r":0},{"t":"余强饮三大白而别。","tr":"我尽力喝了三大杯酒，然后告别。","p":1,"r":0},{"t":"问其姓氏，是金陵人，客此。","tr":"问他们的姓氏，知道是南京人，在此地客居。","p":1,"r":0},{"t":"及下船，舟子喃喃曰：“莫说相公痴，更有痴似相公者！”","tr":"等到下船的时候，船夫喃喃地说：“不要说相公您痴，还有像相公您一样痴的人！”","p":1,"r":1}],"notes":[{"u":0,"w":"崇祯","m":"明思宗年号","t":"实词","d":["明神宗年号","明熹宗年号"]},{"u":1,"w":"俱","m":"都，全","t":"实词","d":["一同","陪同"]},{"u":1,"w":"绝","m":"消失，断绝","t":"实词","d":["极，最","拒绝"]},{"u":2,"w":"更定","m":"指初更时分（晚上八点左右）","t":"实词","d":["更改确定","更加安定"]},{"u":2,"w":"拏","m":"撑（船）","t":"实词","d":["拿取","牵拉"]},{"u":2,"w":"拥","m":"围着，裹着","t":"实词","d":["拥抱","拥有"]},{"u":2,"w":"毳衣","m":"用鸟兽细毛制成的衣服","t":"实词","d":["粗布衣服","丝织的衣服"]},{"u":3,"w":"雾凇","m":"水汽凝结在树枝上的冰花","t":"实词","d":["雾气和松树","雾中的冰雪"]},{"u":3,"w":"沆砀","m":"白气弥漫的样子","t":"实词","d":["水面平静的样子","雪花飞舞的样子"]},{"u":3,"w":"上下一白","m":"上下一片白色","t":"实词","d":["上面和下面不一样","上下合为一体"]},{"u":4,"w":"一痕","m":"一道痕迹（数词+名词，名词作量词）","t":"词类活用","d":[]},{"u":4,"w":"一芥","m":"一根小草，形容船小","t":"词类活用","d":[]},{"u":4,"w":"惟","m":"只有","t":"实词","d":["思考","唯一"]},{"u":4,"w":"而已","m":"罢了","t":"虚词","d":[]},{"u":5,"w":"铺毡","m":"铺着毛毡","t":"实词","d":["铺设毡房","展开毡帽"]},{"u":6,"w":"焉得","m":"哪里能够，怎能","t":"实词","d":["怎么得到","于是得到"]},{"u":8,"w":"强","m":"尽力，勉强","t":"实词","d":["强壮","强迫"]},{"u":8,"w":"白","m":"酒杯","t":"实词","d":["白色","空白"]},{"u":9,"w":"客此","m":"客居于此（名词作动词）","t":"词类活用","d":[]},{"u":10,"w":"及","m":"等到","t":"实词","d":["赶上","以及"]},{"u":10,"w":"舟子","m":"船夫","t":"古今异义","d":["船上的孩子","乘船的人"]},{"u":10,"w":"相公","m":"对读书人的尊称","t":"古今异义","d":["宰相","丈夫"]}],"tricky":["毳","凇","沆","砀","拏","喃"],"keyLines":[{"u":3,"hint":"《湖心亭看雪》中，写天地间白茫茫一片、浑然一体的句子是："},{"u":4,"hint":"文中用“一痕”“一点”“一芥”“两三粒”写景物渺小的句子是："},{"u":10,"hint":"舟子以“痴”称赞作者与金陵客同样痴迷西湖雪景的话是："},{"u":1,"hint":"写大雪下的西湖一片寂静、人迹鸟声断绝的句子是："}],"appr":[{"q":"第一段写景中数量词“一痕”“一点”“一芥”“两三粒”有什么妙处？","a":"用白描手法，以极小的量词写长堤、亭子、小舟和人，突出雪后西湖空旷浩大，人在天地间渺小，营造出空灵寂静的意境，也流露作者孤独超然的心境。"},{"q":"作者为何写与金陵客相遇，并以舟子的话作结？","a":"写金陵客见作者而惊喜，说明有同样雅趣的知音难得；舟子称两人“痴”，既点出作者对雪景的痴迷，也含有对人生渺茫、知音难遇的感叹，更暗含不与世俗同流的清高与故国之思。"}]},{"id":"g9b-p01","volume":"g9b","title":"渔家傲·秋思","author":"范仲淹","dynasty":"北宋","genre":"词","kind":"poem","intro":"范仲淹任陕西经略副使，镇守西北边塞抵御西夏，面对边地秋景与戍边生活，写下这首被称为边塞词开山之作的作品。","theme":"描绘边塞秋日的荒凉肃杀，抒发将士思乡与功业未成的矛盾心情，也体现保家卫国的责任感。","tags":["边塞","思乡","爱国"],"units":[{"t":"塞下秋来风景异，衡阳雁去无留意。","tr":"边塞的秋天一到，景物与江南大不相同，大雁飞往衡阳，一点也没有留恋的意思。","p":0,"r":1},{"t":"四面边声连角起，千嶂里，长烟落日孤城闭。","tr":"四面八方传来边地的各种声响，连同号角声一起响起；在重重山峰之间，暮烟升腾、夕阳西下，一座孤城早早关上了城门。","p":0,"r":1},{"t":"浊酒一杯家万里，燕然未勒归无计。","tr":"端起一杯浊酒，想到家乡远在万里之外；功业未成，没有刻石燕然山，也就无法打算回去。","p":1,"r":1},{"t":"羌管悠悠霜满地，人不寐，将军白发征夫泪。","tr":"羌笛声悠长不断，寒霜洒满大地；人们难以入睡，将军愁白了头发，戍边的士兵也流下思乡的眼泪。","p":1,"r":1}],"notes":[{"u":0,"w":"塞下","m":"边塞地区","t":"实词","d":["要塞之下","堵住下面"]},{"u":0,"w":"衡阳雁去","m":"传说大雁秋季南飞到衡阳回雁峰为止","t":"实词","d":["雁群向衡阳迁来","衡阳城中的大雁"]},{"u":1,"w":"边声","m":"边塞特有的声音，如风声、马嘶、号角等","t":"实词","d":["边境上的呼喊声","边民的歌声"]},{"u":1,"w":"嶂","m":"像屏障一样的山峰","t":"实词","d":["山间小路","山顶积雪"]},{"u":2,"w":"燕然未勒","m":"用东汉窦宪击败匈奴、刻石燕然山记功的典故，指尚未立功","t":"实词","d":["燕然山没有被开垦","燕子没有回巢"]},{"u":2,"w":"无计","m":"没有办法、没有打算","t":"实词","d":["不计较得失","没有计谋"]},{"u":3,"w":"羌管","m":"羌笛","t":"实词","d":["羌族的管理者","笙箫之类乐器"]},{"u":3,"w":"寐","m":"睡着","t":"实词","d":["做梦","躺下"]}],"tricky":["衡","嶂","勒","寐"],"keyLines":[{"u":0,"hint":"《渔家傲·秋思》中，点明边塞秋景与内地不同、并以大雁南归衬托边地荒凉的句子是："},{"u":1,"hint":"描写边塞傍晚孤城紧闭、烟霞落日的凄清画面的句子是："},{"u":2,"hint":"表现将士功业未成、有家难归的两句是："},{"u":3,"hint":"写将士彻夜难眠、满怀愁苦的句子是："}],"appr":[{"q":"上阕“千嶂里，长烟落日孤城闭”描绘了怎样的景象？有何作用？","a":"以重重山峰、长烟落日、紧闭孤城勾勒出一幅荒凉萧瑟的边塞图景，渲染出孤寂紧张的氛围，既表现边防形势严峻，也为下阕抒写思乡之情铺垫。"},{"q":"下阕表达了将士怎样的复杂情感？","a":"既有思念家乡、远隔万里的愁苦，又有边患未平、功业未就不能归去的无奈；“将军白发征夫泪”把保家卫国的壮志与久戍思归的悲凉交织在一起。"}]},{"id":"g9b-p02","volume":"g9b","title":"江城子·密州出猎","author":"苏轼","dynasty":"北宋","genre":"词","kind":"poem","intro":"宋神宗熙宁八年，苏轼任密州知州，一次外出打猎，有感而作此词。它突破婉约词风，开创豪放一派。","theme":"借出猎的壮观场面，抒发杀敌报国的雄心壮志和渴望被朝廷重用的心情。","tags":["豪放","爱国","言志"],"units":[{"t":"老夫聊发少年狂，左牵黄，右擎苍，","tr":"我姑且抒发一回少年人的狂放，左手牵着黄狗，右臂托着苍鹰，","p":0,"r":1},{"t":"锦帽貂裘，千骑卷平冈。","tr":"头戴锦帽、身穿貂裘，带领上千名骑兵席卷过平坦的山冈。","p":0,"r":1},{"t":"为报倾城随太守，亲射虎，看孙郎。","tr":"为了报答全城百姓跟随我出猎的盛情，我要像孙权那样亲自射杀猛虎，让大家看看。","p":0,"r":1},{"t":"酒酣胸胆尚开张。","tr":"酒喝得畅快，胸襟开阔，胆气豪壮。","p":1,"r":1},{"t":"鬓微霜，又何妨！","tr":"鬓发微微有些花白，那又有什么关系！","p":1,"r":1},{"t":"持节云中，何日遣冯唐？","tr":"朝廷什么时候才会派人手持符节去云中，像汉文帝派冯唐赦免魏尚那样重新起用我呢？","p":1,"r":1},{"t":"会挽雕弓如满月，西北望，射天狼。","tr":"到那时我定会拉开雕花大弓，像满月一样，向西北瞄准，射落天狼星。","p":1,"r":1}],"notes":[{"u":0,"w":"聊","m":"姑且，暂且","t":"实词","d":["依赖","闲谈"]},{"u":0,"w":"擎","m":"托举，用手向上托","t":"实词","d":["牵引","握持"]},{"u":1,"w":"卷","m":"像风卷一样席卷而过","t":"词类活用","d":[]},{"u":1,"w":"平冈","m":"平坦的山冈","t":"实词","d":["平静的江岸","平原上的城堡"]},{"u":2,"w":"倾城","m":"全城的人","t":"古今异义","d":["形容女子极其美貌","使城池倾覆"]},{"u":2,"w":"孙郎","m":"指孙权，他曾亲自骑马射虎","t":"实词","d":["姓孙的年轻人","孙武"]},{"u":3,"w":"酣","m":"尽兴，畅快","t":"实词","d":["醉倒","疲倦"]},{"u":3,"w":"开张","m":"开阔，舒展","t":"古今异义","d":["营业开始","张开弓弦"]},{"u":5,"w":"节","m":"符节，朝廷授予使者的凭证","t":"实词","d":["节日","节操"]},{"u":6,"w":"天狼","m":"星名，古人认为主侵掠，这里喻指侵犯边境的西夏","t":"实词","d":["一种凶猛的野兽","传说中的神犬"]}],"tricky":["聊","擎","貂","裘","酣","遣"],"keyLines":[{"u":0,"hint":"《江城子·密州出猎》中，表现词人出猎时少年般狂放豪情的句子是："},{"u":2,"hint":"词人为酬答全城百姓而决心亲自射虎，并以孙权自比的句子是："},{"u":5,"hint":"词人借典故表达希望朝廷信任、重新起用自己的两句是："},{"u":6,"hint":"词的结尾，表达抗击西夏、保卫边疆决心的三句是："}],"appr":[{"q":"“会挽雕弓如满月，西北望，射天狼”运用了什么手法？表达了什么情感？","a":"运用比喻和象征，以满月形容弓开之圆，以“射天狼”象征抗击西夏等外敌，气势雄健，表达了词人渴望为国杀敌、建功立业的豪情壮志。"},{"q":"上阕如何刻画“狂”态？","a":"通过“左牵黄，右擎苍”“锦帽貂裘”“千骑卷平冈”的描写，写出出猎的声势和装束；再以“亲射虎，看孙郎”直抒豪情，使一个豪迈奔放的太守形象跃然纸上。"}]},{"id":"g9b-p03","volume":"g9b","title":"破阵子·为陈同甫赋壮词以寄之","author":"辛弃疾","dynasty":"南宋","genre":"词","kind":"poem","intro":"辛弃疾曾率义军抗金，后被投闲置散。他在闲居时写词寄给志同道合的友人陈亮，回忆军旅生涯，抒写壮志。","theme":"追忆当年抗金部队的雄壮军容与自己的沙场生涯，抒发壮志难酬、英雄迟暮的悲愤。","tags":["豪放","爱国","怀才不遇"],"units":[{"t":"醉里挑灯看剑，梦回吹角连营。","tr":"醉梦中还挑亮油灯端详宝剑，梦醒时只听见各营接连响起号角声。","p":0,"r":1},{"t":"八百里分麾下炙，五十弦翻塞外声。","tr":"把烤熟的牛肉分给部下享用，让各种乐器奏起悲壮激昂的军乐。","p":0,"r":1},{"t":"沙场秋点兵。","tr":"这是秋天的战场上检阅士兵。","p":0,"r":1},{"t":"马作的卢飞快，弓如霹雳弦惊。","tr":"战马像的卢马一样飞快奔驰，弓弦发出霹雳般的巨响令人震惊。","p":1,"r":1},{"t":"了却君王天下事，赢得生前身后名。","tr":"完成替君王收复失地、统一天下的大业，换来生前死后的美名。","p":1,"r":1},{"t":"可怜白发生！","tr":"可惜头发已经白了，一切都成空想！","p":1,"r":1}],"notes":[{"u":0,"w":"挑灯","m":"拨动灯芯使灯更亮","t":"实词","d":["提着灯笼","吹灭灯火"]},{"u":0,"w":"吹角连营","m":"各个军营接连响起号角声","t":"实词","d":["号角吹遍整个城市","吹着号角连接起营帐"]},{"u":1,"w":"麾下","m":"部下","t":"实词","d":["军旗下面","将军的帐篷"]},{"u":1,"w":"炙","m":"烤熟的肉","t":"实词","d":["炙热","祭祀"]},{"u":1,"w":"五十弦","m":"泛指各种乐器（原指瑟）","t":"实词","d":["五十根弓弦","五十位乐手"]},{"u":1,"w":"翻","m":"演奏","t":"实词","d":["翻越","翻译"]},{"u":3,"w":"的卢","m":"一种烈性快马","t":"实词","d":["一种猛禽","一种宝剑"]},{"u":3,"w":"霹雳","m":"响声很大的雷","t":"实词","d":["闪电","山崩"]},{"u":4,"w":"了却","m":"完成，了结","t":"实词","d":["了解","放弃"]}],"tricky":["麾","炙","霹","雳","赢"],"keyLines":[{"u":0,"hint":"《破阵子》中，描写词人醉中仍不忘宝剑、梦中仍闻军营号角的两句是："},{"u":3,"hint":"用比喻形容战马奔驰迅疾、弓弦声响震耳的句子是："},{"u":4,"hint":"表达词人收复中原、建立功名的理想的两句是："},{"u":5,"hint":"词的结尾，笔锋一转，感叹理想破灭、年华老去的句子是："}],"appr":[{"q":"全词在结构上有什么特点？","a":"前九句写梦境，渲染雄壮的军营生活和奋勇杀敌的场面，气势昂扬；末句陡然转入现实，“可怜白发生”写壮志成空，形成强烈反差，使悲愤之情更显深沉。"},{"q":"“马作的卢飞快，弓如霹雳弦惊”有什么艺术效果？","a":"运用比喻，把马奔驰之快、弓弦声响之猛写得有声有色，动感强烈，表现出战斗的紧张激烈和将士的英勇豪迈。"}]},{"id":"g9b-p04","volume":"g9b","title":"满江红·小住京华","author":"秋瑾","dynasty":"清","genre":"词","kind":"poem","intro":"秋瑾是清末女革命家，1904年中秋前后在北京小住时写下此词，不久后东渡日本留学，投身革命。","theme":"抒发不甘做传统闺阁女子、渴望投身革命救国的英雄情怀，以及知音难觅的苦闷。","tags":["爱国","言志","豪放"],"units":[{"t":"小住京华，早又是中秋佳节。","tr":"我在京城小住，转眼又到了中秋佳节。","p":0,"r":1},{"t":"为篱下黄花开遍，秋容如拭。","tr":"篱笆下的菊花已经开遍，秋天的景色明净得像刚擦拭过一样。","p":0,"r":1},{"t":"四面歌残终破楚，八年风味徒思浙。","tr":"四面楚歌渐渐消歇，我终于像汉军破楚那样冲破了家庭的牢笼；只是空想着在浙江度过的那八年生活滋味。","p":0,"r":1},{"t":"苦将侬强派作蛾眉，殊未屑！","tr":"他们苦苦地硬要把我当作柔弱的女子，我实在不屑一顾！","p":0,"r":1},{"t":"身不得，男儿列；心却比，男儿烈。","tr":"我的身子虽然不能列入男子的行列，但我的心比男儿还要刚烈。","p":1,"r":1},{"t":"算平生肝胆，因人常热。","tr":"算起来，我一生满腔热血，总是为别人而热忱。","p":1,"r":1},{"t":"俗子胸襟谁识我？","tr":"那些庸俗之辈，胸襟狭小，谁能了解我？","p":1,"r":1},{"t":"英雄末路当磨折。","tr":"英雄走投无路时，本就该经受磨难挫折。","p":1,"r":1},{"t":"莽红尘何处觅知音？青衫湿！","tr":"在这茫茫尘世上，哪里能找到知音？我的衣衫被泪水打湿了！","p":1,"r":1}],"notes":[{"u":0,"w":"京华","m":"京城，指北京","t":"实词","d":["京剧的精华","繁华的都市"]},{"u":1,"w":"黄花","m":"菊花","t":"实词","d":["油菜花","枯萎的花"]},{"u":1,"w":"拭","m":"擦拭","t":"实词","d":["试探","装饰"]},{"u":2,"w":"歌残","m":"歌声将尽，用“四面楚歌”典故","t":"实词","d":["残缺的歌词","凄凉的歌声"]},{"u":2,"w":"徒","m":"徒然，白白地","t":"实词","d":["徒弟","步行"]},{"u":3,"w":"侬","m":"我（吴方言）","t":"实词","d":["你","他人"]},{"u":3,"w":"蛾眉","m":"代指女子","t":"实词","d":["弯弯的月亮","细长的眉毛"]},{"u":3,"w":"殊","m":"很，极","t":"实词","d":["特殊","不同"]},{"u":3,"w":"屑","m":"认为值得（多用于否定）","t":"实词","d":["碎末","琐碎"]},{"u":8,"w":"莽","m":"茫茫，辽阔","t":"实词","d":["粗鲁","杂草"]},{"u":8,"w":"青衫","m":"青色衣衫","t":"实词","d":["官服","学生制服"]}],"tricky":["篱","拭","侬","蛾","屑","莽"],"keyLines":[{"u":4,"hint":"表现秋瑾虽为女子，却自认比男儿更刚强的两句是："},{"u":3,"hint":"表达词人对世俗强加给女子的角色极为鄙视的句子是："},{"u":8,"hint":"抒发知音难觅、悲愤落泪的句子是："},{"u":1,"hint":"描写京城中秋时节，菊花满篱、秋色澄明的句子是："}],"appr":[{"q":"“身不得，男儿列；心却比，男儿烈”表达了什么？","a":"运用对比，指出自己虽是女子之身，志气和心性却比男子更刚烈，反映出词人冲破封建束缚、争取男女平等和投身救国的坚定意志。"},{"q":"下阕在情感上有怎样的变化？","a":"先以“心却比男儿烈”表现豪情，再写世人不识，慨叹“英雄末路”“何处觅知音”，最后以“青衫湿”收束，由豪壮转为悲愤苦闷，显示出革命者的孤独与执着。"}]},{"id":"g9b-p05","volume":"g9b","title":"定风波·莫听穿林打叶声","author":"苏轼","dynasty":"北宋","genre":"词","kind":"poem","intro":"元丰五年，苏轼因“乌台诗案”被贬黄州。春日去沙湖途中遇雨，同行者狼狈，他却从容前行，雨过天晴后写下此词。","theme":"借途中遇雨一事，表现词人不畏风雨、超然旷达的人生态度。","tags":["旷达","说理","人生"],"units":[{"t":"三月七日，沙湖道中遇雨。","tr":"三月七日，在去沙湖的路上遇到了下雨。","p":0,"r":0},{"t":"雨具先去，同行皆狼狈，余独不觉。","tr":"带雨具的人先走了，同行的人都觉得狼狈不堪，只有我不觉得。","p":0,"r":0},{"t":"已而遂晴，故作此词。","tr":"过了一会儿天晴了，所以写了这首词。","p":0,"r":0},{"t":"莫听穿林打叶声，何妨吟啸且徐行。","tr":"不要去理会雨点穿过树林、敲打树叶的声音，何妨一边吟咏长啸一边悠然慢行。","p":1,"r":1},{"t":"竹杖芒鞋轻胜马，谁怕？","tr":"拄着竹杖、穿着草鞋，比骑马还轻快，有什么可怕的？","p":1,"r":1},{"t":"一蓑烟雨任平生。","tr":"披一件蓑衣，任凭风雨度过一生。","p":1,"r":1},{"t":"料峭春风吹酒醒，微冷，山头斜照却相迎。","tr":"春风微寒，吹醒了我的酒意，身上微微觉得冷，但山头的斜阳却迎面而来。","p":2,"r":1},{"t":"回首向来萧瑟处，归去，也无风雨也无晴。","tr":"回头看看刚才遇到风雨的地方，回去吧，那里不管是风雨还是天晴，对我都没有什么分别了。","p":2,"r":1}],"notes":[{"u":1,"w":"狼狈","m":"困顿窘迫的样子","t":"实词","d":["一种凶猛的野兽","惊慌失措地逃跑"]},{"u":1,"w":"觉","m":"感觉，觉察","t":"实词","d":["睡醒","觉悟"]},{"u":2,"w":"已而","m":"不久，一会儿","t":"实词","d":["已经","停止"]},{"u":3,"w":"吟啸","m":"吟咏长啸","t":"实词","d":["哀叹哭泣","放声大笑"]},{"u":3,"w":"徐行","m":"慢慢地走","t":"实词","d":["缓缓行驶","向前疾行"]},{"u":4,"w":"芒鞋","m":"草鞋","t":"实词","d":["麦芒编的帽子","笨重的鞋"]},{"u":5,"w":"一蓑烟雨","m":"披着蓑衣在烟雨中","t":"实词","d":["一件雨衣","满山烟云"]},{"u":6,"w":"料峭","m":"形容春寒","t":"实词","d":["山势陡峭","寒风凛冽的冬天"]},{"u":7,"w":"萧瑟","m":"指风雨吹打树叶的声音","t":"实词","d":["荒凉冷落","衰败凋零"]}],"tricky":["蓑","芒","峭","狈","萧"],"keyLines":[{"u":3,"hint":"《定风波》中，表达词人不为风雨所动、从容自若的两句是："},{"u":5,"hint":"表现词人对仕途风雨淡然处之、愿度此一生的句子是："},{"u":7,"hint":"词的结尾，体现词人超脱得失、风雨晴明皆无所谓的人生态度的句子是："},{"u":6,"hint":"写雨后春风微寒、斜阳迎面的句子是："}],"appr":[{"q":"“一蓑烟雨任平生”有什么深层含义？","a":"既是写雨中披蓑漫步，更以风雨象征人生的坎坷和政治上的打击，“任平生”表明词人愿以淡然的心境面对一生的风雨，体现旷达坚毅的人生态度。"},{"q":"结句“也无风雨也无晴”表达了怎样的人生感悟？","a":"风雨与晴明在词人眼里已无分别，说明他超越了得失荣辱，达到宠辱不惊、内心平静的境界；这是对前文“何妨吟啸且徐行”的升华。"}]},{"id":"g9b-p06","volume":"g9b","title":"临江仙·夜登小阁，忆洛中旧游","author":"陈与义","dynasty":"南宋","genre":"词","kind":"poem","intro":"陈与义早年在洛阳度过安逸的岁月，北宋灭亡后辗转南逃。晚年隐居时夜登小阁，回想洛阳旧游，写下这首感怀词。","theme":"追忆昔日洛中游乐，感慨国破家亡、世事沧桑，把今古之悲寄于渔唱之中。","tags":["怀旧","感慨","家国"],"units":[{"t":"忆昔午桥桥上饮，坐中多是豪英。","tr":"回想当年在午桥之上饮酒，同席的大多是英雄豪杰。","p":0,"r":1},{"t":"长沟流月去无声。","tr":"月光映在长长的河沟里，随着流水悄悄逝去。","p":0,"r":1},{"t":"杏花疏影里，吹笛到天明。","tr":"在杏花稀疏的影子里吹着笛子，一直吹到天亮。","p":0,"r":1},{"t":"二十余年如一梦，此身虽在堪惊。","tr":"二十多年的光阴就像一场梦，我这个人虽然还活着，回想起来却令人心惊。","p":1,"r":1},{"t":"闲登小阁看新晴。","tr":"闲来无事，登上小楼观赏雨后初晴的景色。","p":1,"r":1},{"t":"古今多少事，渔唱起三更。","tr":"古往今来多少兴亡之事，都化作半夜里渔人的歌唱。","p":1,"r":1}],"notes":[{"u":0,"w":"午桥","m":"洛阳城南的桥名，当年游宴胜地","t":"实词","d":["正午时分的桥","一座军事要塞"]},{"u":0,"w":"豪英","m":"英雄豪杰","t":"实词","d":["富贵人家","英俊少年"]},{"u":1,"w":"长沟","m":"长长的水沟，指流水","t":"实词","d":["绵长的山谷","护城的沟壑"]},{"u":2,"w":"疏影","m":"稀疏的影子","t":"实词","d":["朦胧的月影","飘落的花影"]},{"u":3,"w":"堪惊","m":"令人惊叹、惊心","t":"实词","d":["值得夸耀","能够受惊"]},{"u":4,"w":"新晴","m":"雨后刚刚放晴","t":"实词","d":["初春时节","崭新的晴天美景"]},{"u":5,"w":"渔唱","m":"渔人的歌唱","t":"实词","d":["渔船上的号子","歌唱打渔的事"]},{"u":5,"w":"三更","m":"半夜（约夜间十一点至一点）","t":"实词","d":["三个时辰","黎明时分"]}],"tricky":["忆","午","疏","堪","渔"],"keyLines":[{"u":2,"hint":"《临江仙》中，写词人当年与友人在花影下通宵吹笛、尽情游乐的句子是："},{"u":3,"hint":"词人感叹二十多年光阴如梦、回想起来心有余悸的句子是："},{"u":5,"hint":"把古今兴亡之事全部寄托在半夜渔歌之中的结句是："}],"appr":[{"q":"上下片在内容和情感上有何对照？","a":"上片回忆洛中旧游，写豪英聚饮、月影笛声，意境清朗而欢快；下片回到现实，以“一梦”“堪惊”写国破家亡后的惊悸与沧桑。今昔对比，更显家国之痛。"},{"q":"结尾“古今多少事，渔唱起三更”有什么表达效果？","a":"词人不直说悲愤，而把古今兴亡之事都融进深夜渔唱之中，由悲慨转为旷达，含蓄而深沉，余味悠长。"}]},{"id":"g9b-p07","volume":"g9b","title":"太常引·建康中秋夜为吕叔潜赋","author":"辛弃疾","dynasty":"南宋","genre":"词","kind":"poem","intro":"淳熙元年中秋，辛弃疾在建康任职，为友人吕叔潜写下此词。词人借月夜神话传说，抒发壮志难酬的苦闷与收复山河的愿望。","theme":"借中秋赏月的奇想，表达壮志未酬的愤懑和扫除阴霾、收复河山的理想。","tags":["中秋","抒怀","爱国"],"units":[{"t":"一轮秋影转金波，飞镜又重磨。","tr":"一轮秋月缓缓移动，洒下金色的光波，天上的明镜像是又被重新磨亮了。","p":0,"r":1},{"t":"把酒问姮娥：被白发、欺人奈何？","tr":"举起酒杯问月中的嫦娥：白发一天天爬上头来欺负人，该怎么办呢？","p":0,"r":1},{"t":"乘风好去，长空万里，直下看山河。","tr":"我想乘着长风飞去，越过万里长空，从高处俯瞰祖国的大好河山。","p":1,"r":1},{"t":"斫去桂婆娑，人道是，清光更多。","tr":"砍掉月中那婆娑摇曳的桂树，人们说，这样月亮的清辉会更多地洒向人间。","p":1,"r":1}],"notes":[{"u":0,"w":"金波","m":"金色的月光，比喻月光如水波","t":"实词","d":["金色的海浪","秋天的稻浪"]},{"u":0,"w":"飞镜","m":"飞升的明镜，指月亮","t":"实词","d":["会飞的镜子","天上的太阳"]},{"u":1,"w":"姮娥","m":"嫦娥，神话中的月中仙子","t":"实词","d":["美丽的少女","月宫中的侍女"]},{"u":1,"w":"奈何","m":"怎么办","t":"实词","d":["为何","无可奈何地离去"]},{"u":2,"w":"乘风","m":"驾着长风","t":"实词","d":["顺着风向","趁着风势出战"]},{"u":3,"w":"斫","m":"砍","t":"实词","d":["斟酌","雕刻"]},{"u":3,"w":"婆娑","m":"枝叶纷披、摇曳的样子","t":"实词","d":["舞蹈的姿态","光影斑驳"]}],"tricky":["姮","斫","婆娑","磨"],"keyLines":[{"u":1,"hint":"词人把酒向月中仙子发问，感叹白发欺人的句子是："},{"u":2,"hint":"表现词人想象乘风飞上高空、俯瞰祖国山河的句子是："},{"u":3,"hint":"词人幻想砍掉月中桂树，让人间获得更多清光的句子是："}],"appr":[{"q":"“斫去桂婆娑，人道是，清光更多”运用了什么手法？表达了怎样的思想？","a":"运用神话想象，把砍桂树的奇想与现实相联系，以“清光更多”象征扫除奸佞、给人间带来光明，表达了词人收复河山、除去障碍的壮志和政治理想。"},{"q":"“被白发、欺人奈何”表达了词人怎样的心情？","a":"词人眼见岁月流逝、白发渐生而功业未成，故向月问责，以诙谐的口吻写出壮志难酬、英雄迟暮的深沉愤懑。"}]},{"id":"g9b-p08","volume":"g9b","title":"浣溪沙","author":"纳兰性德","dynasty":"清","genre":"词","kind":"poem","intro":"康熙年间，纳兰性德随驾出巡塞外，途经荒凉的古关旧垒，触景生情，写下这首边塞词。","theme":"描写塞外深秋的荒凉景象，抒发对古今征战的感慨和内心的怅惘幽恨。","tags":["边塞","写景","抒怀"],"units":[{"t":"身向云山那畔行，北风吹断马嘶声，深秋远塞若为情！","tr":"我向着云雾缭绕的山的那一边前行，北风吹断了马的嘶鸣声，深秋时节身在遥远的边塞，心情该怎样呢！","p":0,"r":1},{"t":"一抹晚烟荒戍垒，半竿斜日旧关城。","tr":"一缕暮烟笼罩着荒废的营垒，半竿高的斜阳挂在古老的关城上。","p":1,"r":1},{"t":"古今幽恨几时平！","tr":"古往今来的幽深愁恨，什么时候才能平息呢！","p":1,"r":1}],"notes":[{"u":0,"w":"那畔","m":"那边，指山的另一边","t":"实词","d":["河岸","田边"]},{"u":0,"w":"吹断","m":"（北风）吹得声音中断","t":"实词","d":["吹倒折断","吹得很久"]},{"u":0,"w":"若为情","m":"何以为情，心情怎么样","t":"实词","d":["像有感情","如果动情"]},{"u":1,"w":"一抹","m":"一缕，一片（形容轻淡的烟）","t":"实词","d":["擦拭一下","一次涂抹"]},{"u":1,"w":"戍垒","m":"戍守边防的营垒","t":"实词","d":["守城的士兵","坍塌的城墙"]},{"u":2,"w":"幽恨","m":"深藏心底的愁恨","t":"实词","d":["幽静的遗憾","对敌人的仇恨"]}],"tricky":["畔","嘶","垒","戍","幽"],"keyLines":[{"u":1,"hint":"《浣溪沙》中，描写暮烟笼罩废弃营垒、斜阳挂在旧关城上的两句是："},{"u":2,"hint":"全词点明主旨、抒发古今幽恨的句子是："},{"u":0,"hint":"《浣溪沙》中用声音烘托塞外凄凉气氛的句子是："}],"appr":[{"q":"下片“一抹晚烟荒戍垒，半竿斜日旧关城”运用了什么手法？有何作用？","a":"运用白描和意象叠加，选取晚烟、荒垒、斜日、旧关等景物，勾勒出苍凉荒寂的边塞图景，既写眼前景，也暗含历史兴亡之感，为结句抒情蓄势。"},{"q":"全词怎样做到情景交融？","a":"上片以行路、北风、马嘶写景并发问“若为情”，下片继续写荒垒斜阳，最后以“古今幽恨几时平”点明情感，景中含情，结尾把眼前之景升华为对古今的感慨。"}]},{"id":"g9b-w01","volume":"g9b","title":"鱼我所欲也","author":"孟子","dynasty":"先秦","genre":"论说文","kind":"prose","intro":"选自《孟子·告子上》，是孟子以性善论为根基，讨论生死与义利关系的名篇，用鱼与熊掌设喻，引出“舍生取义”的主张。","theme":"论证“义”比生命更可贵，主张在二者不可兼得时舍生取义，并强调不可丧失本心。","tags":["说理","议论","义利观"],"units":[{"t":"鱼，我所欲也；熊掌，亦我所欲也。","tr":"鱼是我喜爱的；熊掌也是我喜爱的。","p":0,"r":1},{"t":"二者不可得兼，舍鱼而取熊掌者也。","tr":"两样东西不能同时得到的话，我就舍弃鱼而选取熊掌。","p":0,"r":1},{"t":"生，亦我所欲也；义，亦我所欲也。","tr":"生命是我所珍爱的；道义也是我所珍爱的。","p":0,"r":1},{"t":"二者不可得兼，舍生而取义者也。","tr":"两样东西不能同时得到的话，我就舍弃生命而选取道义。","p":0,"r":1},{"t":"生亦我所欲，所欲有甚于生者，故不为苟得也；","tr":"生命固然是我想要的，但我想要的还有比生命更重要的东西，所以我不愿苟且偷生；","p":0,"r":1},{"t":"死亦我所恶，所恶有甚于死者，故患有所不辟也。","tr":"死亡固然是我厌恶的，但我厌恶的还有比死亡更严重的事，所以有些祸患我不躲避。","p":0,"r":1},{"t":"如使人之所欲莫甚于生，则凡可以得生者何不用也？","tr":"假如人们想要的东西没有比生命更重要的，那么凡是能够用来求得生存的手段，哪有不采用的呢？","p":0,"r":1},{"t":"使人之所恶莫甚于死者，则凡可以辟患者何不为也？","tr":"假如人们厌恶的东西没有比死亡更严重的，那么凡是能够用来躲避祸患的事，哪有不去做的呢？","p":0,"r":1},{"t":"由是则生而有不用也，由是则可以辟患而有不为也。","tr":"照这样，有些办法本可以保全性命，却有人不肯采用；有些做法本可以躲避祸患，却有人不肯去做。","p":0,"r":1},{"t":"是故所欲有甚于生者，所恶有甚于死者。","tr":"由此可见，人们所想要的有比生命更重要的，所厌恶的有比死亡更严重的。","p":0,"r":1},{"t":"非独贤者有是心也，人皆有之，贤者能勿丧耳。","tr":"不只是贤人有这种心，人人都有，只不过贤人能够不丧失它罢了。","p":0,"r":1},{"t":"一箪食，一豆羹，得之则生，弗得则死。","tr":"一小筐饭，一碗汤，得到就能活下去，得不到就要饿死。","p":1,"r":1},{"t":"呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。","tr":"若是呵斥着递给别人，过路的饥民也不肯接受；若是用脚踢着给人，乞丐也不屑于要。","p":1,"r":1},{"t":"万钟则不辩礼义而受之，万钟于我何加焉！","tr":"可是面对优厚的俸禄，有人不辨是否合乎礼义就接受了，这万钟俸禄对我有什么益处呢！","p":1,"r":1},{"t":"为宫室之美、妻妾之奉、所识穷乏者得我与？","tr":"是为了住宅的华美、妻妾的侍奉、所认识的穷人感激我吗？","p":1,"r":1},{"t":"乡为身死而不受，今为宫室之美为之；","tr":"先前宁可身死也不接受（嗟来之食），如今却为了住宅的华美而接受了它；","p":1,"r":1},{"t":"乡为身死而不受，今为妻妾之奉为之；","tr":"先前宁可身死也不接受，如今却为了妻妾的侍奉而接受了它；","p":1,"r":1},{"t":"乡为身死而不受，今为所识穷乏者得我而为之；","tr":"先前宁可身死也不接受，如今却为了让所认识的穷人感激我而接受了它；","p":1,"r":1},{"t":"是亦不可以已乎？此之谓失其本心。","tr":"这种做法难道不可以停止吗？这就叫作丧失了人所固有的本性。","p":1,"r":1}],"notes":[{"u":0,"w":"所欲","m":"所喜爱、所想要的","t":"实词","d":["所欲望的坏事","想要避开的东西"]},{"u":1,"w":"得兼","m":"同时得到","t":"实词","d":["兼并他人","得到兼职"]},{"u":1,"w":"者","m":"……的（做法），助词，表停顿并提示判断","t":"虚词"},{"u":4,"w":"故","m":"所以","t":"实词","d":["旧的、原来的","缘故"]},{"u":4,"w":"苟得","m":"苟且取得（指苟且偷生）","t":"实词","d":["随便得到好处","意外获得"]},{"u":5,"w":"恶","m":"厌恶，憎恨","t":"实词","d":["凶恶","丑恶"]},{"u":5,"w":"患","m":"祸患，灾难","t":"实词","d":["担忧","疾病"]},{"u":5,"w":"辟","m":"通“避”，躲避","t":"通假","d":["开辟","邪僻"]},{"u":6,"w":"如使","m":"假如，假使","t":"实词","d":["好像让","如同派遣"]},{"u":6,"w":"何不用也","m":"有什么手段不可使用呢（宾语前置）","t":"特殊句式"},{"u":8,"w":"由是","m":"用这种办法（由，采用）","t":"实词","d":["因为这个缘故","从这里经过"]},{"u":10,"w":"勿丧","m":"不丧失","t":"实词","d":["不办丧事","不逃亡"]},{"u":11,"w":"箪","m":"古代盛饭的圆形竹器","t":"实词","d":["盛酒的陶器","吃饭的筷子"]},{"u":11,"w":"豆","m":"古代盛食物的器皿","t":"实词","d":["豆类作物","计量单位"]},{"u":12,"w":"呼尔","m":"呵斥着（的样子）","t":"实词","d":["大声呼唤你","招呼过来"]},{"u":12,"w":"蹴","m":"用脚踢","t":"实词","d":["跳跃","踩踏着前行"]},{"u":12,"w":"不屑","m":"认为不值得（接受）","t":"实词","d":["不整洁","不坚持"]},{"u":13,"w":"辩","m":"通“辨”，辨别","t":"通假","d":["辩论","争辩"]},{"u":13,"w":"万钟","m":"优厚的俸禄（钟，量器）","t":"实词","d":["一万座钟","巨大的财富"]},{"u":14,"w":"得我","m":"感激我（得，通“德”，感恩）","t":"通假","d":["得到我","了解我"]},{"u":15,"w":"乡","m":"通“向”，从前，先前","t":"通假","d":["乡村","方向"]},{"u":18,"w":"已","m":"停止","t":"实词","d":["已经","完毕"]},{"u":18,"w":"本心","m":"天性中固有的羞恶之心","t":"古今异义","d":["最初的心愿","真心实意"]}],"tricky":["熊掌","舍","箪","蹴","辟","钟"],"keyLines":[{"u":3,"hint":"《鱼我所欲也》中，孟子表明在生命与道义不可兼得时，宁取道义的句子是："},{"u":4,"hint":"孟子说，因为有比生命更看重的东西，所以不愿苟且偷生的句子是："},{"u":10,"hint":"孟子认为不只贤者有羞恶之心，人人皆有，只是贤者能保持的句子是："},{"u":12,"hint":"孟子举例说明人有尊严，即使饥饿者也拒绝被侮辱性施舍的句子是："},{"u":18,"hint":"孟子对那些为外在利益而放弃“义”的行为作出的总评是："}],"appr":[{"q":"文章开头为什么用鱼和熊掌来作比喻？","a":"先以人人易懂的取舍引出论题，由浅入深，再类比到生与义的抉择：熊掌比鱼更珍贵，义比生更珍贵，使“舍生取义”的结论显得自然而有说服力。"},{"q":"第二段写“一箪食，一豆羹”有什么作用？","a":"用饥饿将死之人宁拒嗟来之食的事实作论据，说明人皆有羞恶之本心，为后文批评见利忘义者作对比铺垫，使道理具体可感。"},{"q":"“乡为身死而不受，今为宫室之美为之”运用了什么写法？有何效果？","a":"运用排比和今昔对比，连用三个“乡……今……”，揭示有人为享乐、私利而放弃原则的行为，语气层层加强，批判有力。"}]},{"id":"g9b-w02","volume":"g9b","title":"唐雎不辱使命","author":"刘向（编订）","dynasty":"西汉","genre":"史传（国别体）","kind":"prose","intro":"选自《战国策·魏策四》。秦王以易地为名欲吞并安陵，安陵君派唐雎出使秦国，唐雎以死相拼，迫使秦王屈服，保全了国家。","theme":"歌颂唐雎不畏强暴、敢于斗争的爱国精神和机智勇敢，揭露秦王的骄横狡诈。","tags":["叙事","爱国","史传"],"units":[{"t":"秦王使人谓安陵君曰：“寡人欲以五百里之地易安陵，安陵君其许寡人！”","tr":"秦王派人对安陵君说：“我想用方圆五百里的土地交换安陵，安陵君一定要答应我！”","p":0,"r":0},{"t":"安陵君曰：“大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！”","tr":"安陵君说：“大王施加恩惠，用大的换小的，这很好；虽然如此，但我从先王那里继承了封地，愿意始终守住它，不敢交换！”","p":0,"r":0},{"t":"秦王不说。","tr":"秦王很不高兴。","p":0,"r":0},{"t":"安陵君因使唐雎使于秦。","tr":"安陵君于是派唐雎出使秦国。","p":0,"r":0},{"t":"秦王谓唐雎曰：“寡人以五百里之地易安陵，安陵君不听寡人，何也？","tr":"秦王对唐雎说：“我拿五百里的土地交换安陵，安陵君却不听从我，为什么呢？","p":1,"r":0},{"t":"且秦灭韩亡魏，而君以五十里之地存者，以君为长者，故不错意也。","tr":"况且秦国灭掉了韩国、魏国，可安陵君凭着五十里的地方存留下来，是因为我把他看作忠厚的长者，所以不打他的主意。","p":1,"r":0},{"t":"今吾以十倍之地，请广于君，而君逆寡人者，轻寡人与？”","tr":"现在我拿十倍的土地，请求扩大安陵君的封地，他却违背我的心意，这是看不起我吗？”","p":1,"r":0},{"t":"唐雎对曰：“否，非若是也。","tr":"唐雎回答说：“不，不是这样的。","p":1,"r":0},{"t":"安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？”","tr":"安陵君从先王那里接受封地而守护它，即使方圆千里也不敢交换，难道只是五百里吗？”","p":1,"r":0},{"t":"秦王怫然怒，谓唐雎曰：“公亦尝闻天子之怒乎？”","tr":"秦王勃然大怒，对唐雎说：“您也曾听说过天子发怒的情景吗？”","p":2,"r":0},{"t":"唐雎对曰：“臣未尝闻也。”","tr":"唐雎回答说：“我没有听说过。”","p":2,"r":0},{"t":"秦王曰：“天子之怒，伏尸百万，流血千里。”","tr":"秦王说：“天子发怒，倒下的尸体有百万，鲜血流淌千里。”","p":2,"r":0},{"t":"唐雎曰：“大王尝闻布衣之怒乎？”","tr":"唐雎说：“大王曾听说过平民发怒吗？”","p":2,"r":1},{"t":"秦王曰：“布衣之怒，亦免冠徒跣，以头抢地耳。”","tr":"秦王说：“平民发怒，不过是摘掉帽子，光着脚，用头撞地罢了。”","p":2,"r":1},{"t":"唐雎曰：“此庸夫之怒也，非士之怒也。","tr":"唐雎说：“这是庸人的发怒，不是有胆识之士的发怒。","p":2,"r":1},{"t":"夫专诸之刺王僚也，彗星袭月；","tr":"当年专诸刺杀吴王僚的时候，彗星的尾巴扫过月亮；","p":2,"r":1},{"t":"聂政之刺韩傀也，白虹贯日；","tr":"聂政刺杀韩傀的时候，一道白色长虹贯穿太阳；","p":2,"r":1},{"t":"要离之刺庆忌也，仓鹰击于殿上。","tr":"要离刺杀庆忌的时候，苍鹰在宫殿上扑击。","p":2,"r":1},{"t":"此三子者，皆布衣之士也，怀怒未发，休祲降于天，与臣而将四矣。","tr":"这三个人，都是平民中的有志之士，心中的愤怒还没发作，上天就降下了吉凶的征兆，加上我，将成为四个人了。","p":2,"r":1},{"t":"若士必怒，伏尸二人，流血五步，天下缟素，今日是也。”","tr":"如果有胆识的人一定要发怒，那就是两具尸体倒下，鲜血溅出五步之内，天下的人都要穿白色的丧服，今天就是这样的时刻了。”","p":2,"r":1},{"t":"挺剑而起。","tr":"（他）拔剑出鞘，起身而立。","p":2,"r":1},{"t":"秦王色挠，长跪而谢之曰：“先生坐！何至于此！","tr":"秦王脸色变得惊惶，直起身跪着向唐雎道歉说：“先生请坐！何至于到这种地步！","p":3,"r":1},{"t":"寡人谕矣：夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。”","tr":"我明白了：韩国、魏国灭亡了，可安陵凭着五十里的地方得以保存，只是因为有先生您啊！”","p":3,"r":1}],"notes":[{"u":0,"w":"易","m":"交换","t":"实词","d":["容易","改变"]},{"u":0,"w":"其","m":"表祈使语气，一定、可要","t":"虚词"},{"u":1,"w":"加惠","m":"施加恩惠","t":"实词","d":["增加智慧","给予赏赐"]},{"u":1,"w":"虽然","m":"虽然这样（即使这样）","t":"古今异义","d":["表示让步的连词，后接转折","尽管如此却没有关系"]},{"u":2,"w":"说","m":"通“悦”，高兴","t":"通假","d":["说话","劝说"]},{"u":3,"w":"使","m":"派遣（前）/出使（后）","t":"一词多义"},{"u":5,"w":"错意","m":"放在心上，在意（错，通“措”）","t":"通假","d":["弄错意思","有所用意"]},{"u":5,"w":"长者","m":"忠厚的人（有德行的人）","t":"古今异义","d":["年纪大的人","辈分高的长辈"]},{"u":5,"w":"亡","m":"使……灭亡（使动用法）","t":"词类活用"},{"u":6,"w":"广","m":"使……扩大（使动用法）","t":"词类活用"},{"u":6,"w":"逆","m":"违背，不顺从","t":"实词","d":["迎接","倒着"]},{"u":6,"w":"轻","m":"轻视，看不起（意动用法）","t":"词类活用"},{"u":8,"w":"岂直","m":"难道只是","t":"实词","d":["难道正直","难道径直"]},{"u":9,"w":"怫然","m":"盛怒的样子","t":"实词","d":["高兴的样子","惊恐的样子"]},{"u":9,"w":"公","m":"您（对人的尊称）","t":"古今异义","d":["公家、国家","公正无私"]},{"u":11,"w":"伏尸","m":"倒伏的尸体","t":"实词","d":["埋伏的刺客","藏匿尸体"]},{"u":12,"w":"布衣","m":"平民","t":"古今异义","d":["布做的衣服","贫穷的书生"]},{"u":13,"w":"免冠徒跣","m":"摘掉帽子，光着脚","t":"实词","d":["免去官职，徒步行走","脱去鞋子，徒手搏斗"]},{"u":13,"w":"抢地","m":"撞地","t":"实词","d":["抢夺土地","抢占地盘"]},{"u":14,"w":"庸夫","m":"平庸无能之人","t":"实词","d":["雇工","愚昧的农夫"]},{"u":15,"w":"彗星袭月","m":"彗星的尾部扫过月亮（古人视为异象）","t":"实词","d":["流星撞击月亮","彗星遮住月亮"]},{"u":17,"w":"仓鹰","m":"苍鹰（仓，通“苍”）","t":"通假","d":["仓库里的鹰","凶猛的猎鹰"]},{"u":18,"w":"休祲","m":"吉凶的征兆（休，吉祥；祲，不祥）","t":"实词","d":["休息的地方","祈福的仪式"]},{"u":19,"w":"缟素","m":"白色丧服，这里指穿丧服（名词作动词）","t":"词类活用"},{"u":19,"w":"天下缟素","m":"天下人都穿丧服（意动，为之服丧）","t":"特殊句式"},{"u":21,"w":"色挠","m":"脸色屈服（惊慌变色）","t":"实词","d":["颜色变浅","神色高傲"]},{"u":21,"w":"长跪","m":"直身而跪，表示敬意","t":"实词","d":["长久跪着","跪得很深"]},{"u":22,"w":"谕","m":"明白，懂得","t":"实词","d":["告诉","晓喻别人"]},{"u":22,"w":"徒以","m":"只是因为","t":"实词","d":["白白地凭借","徒步凭借"]}],"tricky":["怫","跣","彗","傀","祲","缟"],"keyLines":[{"u":8,"hint":"唐雎说明安陵君守护先王封地的决心，即使千里之地也不愿交换的句子是："},{"u":19,"hint":"唐雎以死相拼，描述自己一怒的后果的句子是："},{"u":17,"hint":"唐雎列举要离刺杀庆忌时出现的天象异兆的句子是："},{"u":22,"hint":"秦王屈服后，道出安陵得以保全真正原因的句子是："},{"u":13,"hint":"秦王轻蔑地描述“布衣之怒”的句子是："}],"appr":[{"q":"唐雎列举专诸、聂政、要离三个例子，作用是什么？","a":"用三位刺客行刺时的天象异兆作类比，说明“士之怒”非同寻常，把秦王的“天子之怒”压了下去，同时暗示自己将拼死一搏，造成强大的震慑。"},{"q":"秦王前倨后恭的变化说明了什么？","a":"秦王先是恃强凌弱、咄咄逼人，被唐雎的气势逼到生死关头便“色挠”“长跪而谢”，揭示了他色厉内荏、欺软怕硬的本质，也反衬出唐雎的大义凛然。"},{"q":"唐雎的形象有哪些特点？","a":"他临危不惧、有勇有谋：先据理驳斥，次以“士之怒”针锋相对，最后拔剑相逼，既不卑不亢又果敢，体现了维护国家尊严的爱国精神。"}]},{"id":"h1a-p01","volume":"h1a","title":"芣苢","author":"《诗经》","dynasty":"先秦","genre":"诗经（周南·国风）","kind":"poem","intro":"出自《诗经·周南》，是先秦时期妇女采摘芣苢（一般认为是车前草）时随劳动节奏吟唱的民歌，三章只换动词，重章叠句。","theme":"通过采摘动作的层层变化，表现劳动场面的轻快与劳动者的欢愉。","tags":["劳动","民歌","叙事"],"units":[{"t":"采采芣苢，薄言采之。","tr":"芣苢茂盛又繁多，姑且来把它采下。","p":0,"r":1},{"t":"采采芣苢，薄言有之。","tr":"芣苢茂盛又繁多，姑且把它采得手中。","p":0,"r":1},{"t":"采采芣苢，薄言掇之。","tr":"芣苢茂盛又繁多，姑且一株株拾取它。","p":1,"r":1},{"t":"采采芣苢，薄言捋之。","tr":"芣苢茂盛又繁多，姑且顺着茎把子粒捋下。","p":1,"r":1},{"t":"采采芣苢，薄言袺之。","tr":"芣苢茂盛又繁多，姑且提起衣襟兜住它。","p":2,"r":1},{"t":"采采芣苢，薄言襭之。","tr":"芣苢茂盛又繁多，姑且把衣襟扎在腰带上兜着它。","p":2,"r":1}],"notes":[{"u":0,"w":"采采","m":"茂盛繁多的样子（一说“采了又采”）","t":"实词","d":["颜色鲜艳光彩","采摘的动作"]},{"u":0,"w":"芣苢","m":"一种野草，一般认为是车前草","t":"实词","d":["一种香草兰草","一种水生荷花"]},{"u":0,"w":"薄言","m":"语助词，“薄”“言”均无实义，带有“姑且”的语气","t":"虚词"},{"u":1,"w":"有","m":"取得，得到","t":"实词","d":["拥有财富","存在"]},{"u":2,"w":"掇","m":"拾取","t":"实词","d":["折断","捧起"]},{"u":3,"w":"捋","m":"用手握着茎顺势抹下来","t":"实词","d":["用手抚摸胡须","拔起连根"]},{"u":4,"w":"袺","m":"手提着衣襟兜东西","t":"实词","d":["把衣襟系在头上","整理衣裳"]},{"u":5,"w":"襭","m":"把衣襟掖在腰带间兜东西","t":"实词","d":["用篮子盛放","撕开衣襟"]}],"tricky":["芣","苢","掇","捋","袺","襭"],"keyLines":[{"u":2,"hint":"《芣苢》中，表示用手一株一株拾取芣苢的诗句是："},{"u":3,"hint":"《芣苢》中，表示用手顺茎捋取芣苢子粒的诗句是："},{"u":5,"hint":"《芣苢》全诗最后一句，写采得很多、把衣襟掖在腰带上兜着的是："}],"appr":[{"q":"《芣苢》在结构上有什么特点？有何效果？","a":"全诗三章，每章只更换一个动词（采、有、掇、捋、袺、襭），属于重章叠句。反复回环，形成轻快的节奏，让人仿佛听见采摘时的歌声。"},{"q":"诗中动词的变化表现了怎样的劳动过程？","a":"从“采”“有”到“掇”“捋”，再到“袺”“襭”，由开始采摘、拾取、捋下，到最后满兜而归，展现了采摘由少到多的全过程，也透出劳动者的欢快心情。"}]},{"id":"h1a-p02","volume":"h1a","title":"插秧歌","author":"杨万里","dynasty":"南宋","genre":"七言古诗","kind":"poem","intro":"杨万里是南宋诗人，诗风活泼自然，号“诚斋体”。此诗描绘春雨中农家全家插秧的忙碌场景，语言通俗清新。","theme":"描写农家雨中抢插秧苗的紧张劳动，表现农民的勤劳与辛苦。","tags":["田园","叙事","劳动"],"units":[{"t":"田夫抛秧田妇接，小儿拔秧大儿插。","tr":"农夫把秧苗抛出，农妇接住，小儿子拔秧，大儿子插秧。","p":0,"r":1},{"t":"笠是兜鍪蓑是甲，雨从头上湿到胛。","tr":"斗笠当作头盔，蓑衣当作铠甲，雨水从头顶一直淋湿到肩胛。","p":0,"r":1},{"t":"唤渠朝餐歇半霎，低头折腰只不答。","tr":"叫他们吃早饭、歇一会儿，他们只顾低头弯腰干活，不作回答。","p":0,"r":1},{"t":"秧根未牢莳未匝，照管鹅儿与雏鸭。","tr":"秧根还没扎牢，秧也没有插遍，还请你看好家里的鹅儿和小鸭，别让它们糟蹋。","p":0,"r":1}],"notes":[{"u":1,"w":"兜鍪","m":"古代作战时戴的头盔","t":"实词","d":["战士的盾牌","古代的帽子"]},{"u":1,"w":"甲","m":"铠甲","t":"实词","d":["天干第一位","指甲"]},{"u":1,"w":"胛","m":"肩胛，肩膀","t":"实词","d":["手臂","后背"]},{"u":2,"w":"渠","m":"他（们）","t":"实词","d":["水沟","你"]},{"u":2,"w":"半霎","m":"片刻，一会儿","t":"实词","d":["半个时辰","半夜"]},{"u":3,"w":"莳","m":"移栽，插秧","t":"实词","d":["种植花草","收割"]},{"u":3,"w":"匝","m":"遍，满","t":"实词","d":["环绕一圈","整齐"]}],"tricky":["秧","笠","兜鍪","蓑","胛","莳","匝"],"keyLines":[{"u":1,"hint":"《插秧歌》中，用比喻写农夫雨中劳作装备和被雨淋湿情景的两句是："},{"u":0,"hint":"《插秧歌》中，写全家人分工协作插秧的两句是："},{"u":2,"hint":"《插秧歌》中，写农民埋头劳动、顾不上吃饭回话的两句是："}],"appr":[{"q":"“笠是兜鍪蓑是甲”运用了什么修辞手法？有什么效果？","a":"运用比喻，把斗笠比作头盔，把蓑衣比作铠甲，写出农民雨中抢插秧苗如同上战场般紧张，形象生动，也含着对劳动者的敬意。"},{"q":"这首诗在描写手法和语言上有什么特点？","a":"诗中用白描写出分工、冒雨、不答、叮嘱几个镜头，层次分明；语言口语化、通俗明快，富有生活气息，体现了“诚斋体”活泼自然的风格。"}]},{"id":"h1a-p03","volume":"h1a","title":"短歌行","author":"曹操","dynasty":"东汉","genre":"乐府诗（四言）","kind":"poem","intro":"曹操是东汉末年的政治家、诗人。《短歌行》是他借乐府旧题写下的作品，在宴会上抒发求贤若渴的心情和统一天下的志向。","theme":"感叹人生短暂，表达求贤若渴的迫切心情和建功立业、统一天下的抱负。","tags":["求贤","抒怀","言志"],"units":[{"t":"对酒当歌，人生几何！","tr":"面对美酒应当放声高歌，人生究竟有多长！","p":0,"r":1},{"t":"譬如朝露，去日苦多。","tr":"好比早晨的露水，逝去的日子实在太多。","p":0,"r":1},{"t":"慨当以慷，忧思难忘。","tr":"席间歌声激昂慷慨，心中的忧思难以忘怀。","p":0,"r":1},{"t":"何以解忧？唯有杜康。","tr":"用什么来排解忧愁呢？只有美酒了。","p":0,"r":1},{"t":"青青子衿，悠悠我心。","tr":"穿青色衣领的贤士啊，我对你们的思念悠长不断。","p":1,"r":1},{"t":"但为君故，沉吟至今。","tr":"只是因为你们的缘故，我低声吟诵到今天。","p":1,"r":1},{"t":"呦呦鹿鸣，食野之苹。","tr":"鹿儿呦呦地鸣叫，在原野上吃着艾蒿。","p":1,"r":1},{"t":"我有嘉宾，鼓瑟吹笙。","tr":"我有尊贵的宾客，为他们弹瑟吹笙。","p":1,"r":1},{"t":"明明如月，何时可掇？","tr":"贤才像明月一样高悬，什么时候才能摘取到呢？","p":2,"r":1},{"t":"忧从中来，不可断绝。","tr":"忧愁从心中涌出，没有办法断绝。","p":2,"r":1},{"t":"越陌度阡，枉用相存。","tr":"你们远道跨越田间小路前来，屈尊探望我。","p":2,"r":1},{"t":"契阔谈讌，心念旧恩。","tr":"久别重逢，欢宴畅谈，心中感念昔日的情谊。","p":2,"r":1},{"t":"月明星稀，乌鹊南飞。","tr":"月光明亮星星稀疏，乌鹊向南飞去。","p":3,"r":1},{"t":"绕树三匝，何枝可依？","tr":"绕着树飞了好几圈，哪根树枝可以栖息呢？","p":3,"r":1},{"t":"山不厌高，海不厌深。","tr":"山不嫌土石多而高，海不嫌水多而深。","p":3,"r":1},{"t":"周公吐哺，天下归心。","tr":"周公为接待贤士吐出口中食物，因此天下人心归附。","p":3,"r":1}],"notes":[{"u":0,"w":"当","m":"应当（一说“对着”）","t":"实词","d":["担当","正在"]},{"u":1,"w":"去日","m":"已经过去的日子","t":"实词","d":["离开的日子","将来的日子"]},{"u":2,"w":"慨当以慷","m":"宴会上的歌声激昂慷慨","t":"实词","d":["感慨万千","愤恨不平"]},{"u":3,"w":"杜康","m":"相传最早造酒的人，这里代指酒","t":"实词","d":["古代的乐官","一种粮食"]},{"u":4,"w":"子衿","m":"青色的衣领，借指贤才","t":"实词","d":["情人","官服的带子"]},{"u":5,"w":"沉吟","m":"低声吟诵，在思索中念叨","t":"实词","d":["沉默不语","犹豫不决"]},{"u":8,"w":"掇","m":"摘取，拾取","t":"实词","d":["折断","捧起"]},{"u":10,"w":"枉用相存","m":"屈驾来探望问候","t":"特殊句式","d":[]},{"u":11,"w":"契阔","m":"久别重逢（一说勤苦）","t":"实词","d":["感情深厚","路途遥远"]},{"u":13,"w":"匝","m":"周，圈","t":"实词","d":["满，遍","整齐"]},{"u":15,"w":"吐哺","m":"吐出口中咀嚼的食物，形容礼待贤才","t":"实词","d":["呕吐","喂养幼鸟"]}],"tricky":["慨","慷","杜康","衿","呦","苹","掇","陌","阡","枉","契阔","谈讌","匝","哺"],"keyLines":[{"u":1,"hint":"《短歌行》中，诗人把人生比作朝露、感叹时光易逝的两句是："},{"u":3,"hint":"《短歌行》中，表达诗人只有借酒解忧的两句是："},{"u":8,"hint":"《短歌行》中，以明月比喻贤才难以得到的两句是："},{"u":14,"hint":"《短歌行》中，诗人表示要像山海一样广纳人才的两句是："},{"u":15,"hint":"《短歌行》中，借周公礼贤下士典故，表达争取天下人才的志向的两句是："}],"appr":[{"q":"“月明星稀，乌鹊南飞。绕树三匝，何枝可依？”有什么含义？","a":"用乌鹊绕树无枝可栖，比喻当时人才没有明主可依、徘徊不定的处境，也暗示曹操招揽他们的诚意，是借景寓意、含蓄委婉的写法。"},{"q":"诗中多处引用《诗经》的句子，有什么作用？","a":"“青青子衿”“呦呦鹿鸣”分别化用《郑风》和《小雅》，借以表达对贤才的思慕和以礼相待的诚意，既典雅含蓄，又使感情更深沉。"},{"q":"全诗的情感是怎样发展的？","a":"先感叹人生短暂、忧思难解，再转到思慕贤才、以礼相待，继而写贤才难得、徘徊无依，最后以周公自比，表明广纳贤才、统一天下的壮志，情感由低沉转为昂扬。"}]},{"id":"h1a-p04","volume":"h1a","title":"归园田居（其一）","author":"陶渊明","dynasty":"东晋","genre":"五言古诗","kind":"poem","intro":"陶渊明辞去彭泽县令后归隐田园，写下《归园田居》组诗五首（一说六首），此为第一首，回顾仕途、描绘田园生活。","theme":"表达对官场的厌恶和对自然田园生活的热爱，庆幸重获自由。","tags":["田园","归隐","抒怀"],"units":[{"t":"少无适俗韵，性本爱丘山。","tr":"我年轻时就没有迎合世俗的情调，生性本来就爱好山野。","p":0,"r":1},{"t":"误落尘网中，一去三十年。","tr":"错误地陷入尘世的罗网，一晃离开田园三十年。","p":0,"r":1},{"t":"羁鸟恋旧林，池鱼思故渊。","tr":"笼中的鸟留恋原来的树林，池里的鱼思念从前的深潭。","p":0,"r":1},{"t":"开荒南野际，守拙归园田。","tr":"到南边的原野开垦荒地，保持愚拙本性回到田园。","p":0,"r":1},{"t":"方宅十余亩，草屋八九间。","tr":"宅子四周有十几亩地，草屋有八九间。","p":1,"r":1},{"t":"榆柳荫后檐，桃李罗堂前。","tr":"榆树柳树遮蔽着后檐，桃树李树排列在堂前。","p":1,"r":1},{"t":"暧暧远人村，依依墟里烟。","tr":"远处的村落朦胧不清，村里的炊烟轻轻飘升。","p":1,"r":1},{"t":"狗吠深巷中，鸡鸣桑树颠。","tr":"深深的小巷里传来狗叫，桑树顶上有鸡在啼鸣。","p":1,"r":1},{"t":"户庭无尘杂，虚室有余闲。","tr":"门庭里没有世俗的杂事，空静的屋子里有的是闲暇。","p":2,"r":1},{"t":"久在樊笼里，复得返自然。","tr":"长久被困在笼子里，如今又能回归自然。","p":2,"r":1}],"notes":[{"u":0,"w":"韵","m":"气质，情调","t":"实词","d":["声韵","韵味风度"]},{"u":1,"w":"尘网","m":"指世俗官场的束缚","t":"实词","d":["蒙尘的蛛网","战乱的纷扰"]},{"u":2,"w":"羁鸟","m":"被束缚在笼中的鸟","t":"实词","d":["迷路的鸟","受伤的鸟"]},{"u":3,"w":"守拙","m":"坚持愚拙的本性，不随世俗取巧","t":"实词","d":["守住拙劣的手艺","遵守规矩"]},{"u":4,"w":"方宅","m":"宅子周围","t":"实词","d":["方形的住宅","房屋的方向"]},{"u":5,"w":"荫","m":"遮蔽，覆盖","t":"词类活用","d":["庇护","树阴的凉"]},{"u":5,"w":"罗","m":"排列，罗列","t":"实词","d":["张网捕捉","一种丝织品"]},{"u":6,"w":"暧暧","m":"昏暗不明的样子","t":"实词","d":["温暖的样子","光明灿烂的样子"]},{"u":8,"w":"虚室","m":"空寂的屋子","t":"实词","d":["破败的房屋","无人居住的房子"]},{"u":9,"w":"樊笼","m":"关鸟兽的笼子，喻官场","t":"实词","d":["篱笆围成的院子","牢房"]}],"tricky":["韵","羁","渊","拙","榆","荫","暧","墟","颠","樊"],"keyLines":[{"u":2,"hint":"《归园田居（其一）》中，以羁鸟、池鱼思念旧林故渊，比喻诗人向往自由田园的两句是："},{"u":1,"hint":"《归园田居（其一）》中，诗人将官场生涯喻为“尘网”并感叹时间之久的两句是："},{"u":7,"hint":"《归园田居（其一）》中，以狗吠鸡鸣写出农村宁静气氛的两句是："},{"u":9,"hint":"《归园田居（其一）》的结句，表达诗人摆脱官场束缚后喜悦心情的是："}],"appr":[{"q":"诗中“尘网”“樊笼”与“田园”“自然”形成怎样的对比？","a":"“尘网”“樊笼”比喻拘束人的官场，“田园”“自然”是诗人向往的自由天地。两组意象鲜明对照，突出了诗人厌恶官场、回归田园后的轻松喜悦。"},{"q":"“榆柳荫后檐”至“鸡鸣桑树颠”这几句在写景上有什么特点？","a":"采用白描手法，以榆柳、桃李、远村、炊烟、狗吠、鸡鸣等寻常景物组成一幅宁静恬淡的田园图，视觉和听觉结合，语言质朴自然，显出诗人的闲适心境。"}]},{"id":"h1a-p05","volume":"h1a","title":"梦游天姥吟留别","author":"李白","dynasty":"唐","genre":"七言古诗（歌行）","kind":"poem","intro":"天宝年间李白离开长安，东游吴越前写下此诗留赠友人。诗中借梦游天姥山，抒写对自由的向往和对权贵的蔑视。","theme":"借梦中仙境的奇幻与梦醒后的失落，表达追求自由、蔑视权贵的傲岸精神。","tags":["游仙","抒怀","浪漫主义"],"units":[{"t":"海客谈瀛洲，烟涛微茫信难求；","tr":"航海的人谈起瀛洲，烟波浩渺，确实难以寻求；","p":0,"r":1},{"t":"越人语天姥，云霞明灭或可睹。","tr":"越地的人说起天姥山，云霞忽明忽暗，或许还能看见。","p":0,"r":1},{"t":"天姥连天向天横，势拔五岳掩赤城。","tr":"天姥山高耸入天，横亘天际，气势超过五岳，遮盖了赤城山。","p":0,"r":1},{"t":"天台四万八千丈，对此欲倒东南倾。","tr":"天台山虽高四万八千丈，面对天姥山也仿佛要向东南倾倒。","p":0,"r":1},{"t":"我欲因之梦吴越，一夜飞度镜湖月。","tr":"我想凭借这些传说梦游吴越，一夜之间飞渡过月光下的镜湖。","p":1,"r":1},{"t":"湖月照我影，送我至剡溪。","tr":"湖上的月光映照着我的身影，送我到了剡溪。","p":1,"r":1},{"t":"谢公宿处今尚在，渌水荡漾清猿啼。","tr":"谢灵运当年住过的地方如今还在，碧水荡漾，猿声清越。","p":1,"r":1},{"t":"脚著谢公屐，身登青云梯。","tr":"我脚穿谢公那样的木屐，登上高入青云的山路。","p":1,"r":1},{"t":"半壁见海日，空中闻天鸡。","tr":"到半山腰就看见海上日出，空中传来天鸡的鸣叫。","p":1,"r":1},{"t":"千岩万转路不定，迷花倚石忽已暝。","tr":"山岩重重，山路曲折不定，我迷恋花丛、倚着岩石，不觉天色已暗。","p":1,"r":1},{"t":"熊咆龙吟殷岩泉，栗深林兮惊层巅。","tr":"熊吼龙吟震动着岩间泉水，深林战栗，层层山峰也被惊动。","p":1,"r":1},{"t":"云青青兮欲雨，水澹澹兮生烟。","tr":"乌云沉沉像要下雨，水波荡漾，水面升起烟雾。","p":1,"r":1},{"t":"列缺霹雳，丘峦崩摧。","tr":"电光闪闪，雷声轰鸣，山峦仿佛崩塌。","p":1,"r":1},{"t":"洞天石扉，訇然中开。","tr":"仙府洞天的石门，轰然从中间打开。","p":1,"r":1},{"t":"青冥浩荡不见底，日月照耀金银台。","tr":"青天浩渺深不见底，日月的光辉映照着金银筑成的楼台。","p":2,"r":1},{"t":"霓为衣兮风为马，云之君兮纷纷而来下。","tr":"神仙以彩虹为衣、以风为马，云中的神仙纷纷降临。","p":2,"r":1},{"t":"虎鼓瑟兮鸾回车，仙之人兮列如麻。","tr":"老虎弹瑟，鸾鸟拉车，仙人排列得像麻秆一样密。","p":2,"r":1},{"t":"忽魂悸以魄动，恍惊起而长嗟。","tr":"忽然心惊魂动，猛地惊醒而长长叹息。","p":2,"r":1},{"t":"惟觉时之枕席，失向来之烟霞。","tr":"醒来只看见身下的枕席，刚才的烟霞美景都消失了。","p":2,"r":1},{"t":"世间行乐亦如此，古来万事东流水。","tr":"人间的欢乐也像梦一样容易消逝，自古万事如同东流的水。","p":3,"r":1},{"t":"别君去兮何时还？且放白鹿青崖间，须行即骑访名山。","tr":"告别诸位远去，何时回来？暂且把白鹿放养在青山崖间，要走时就骑着它去访名山。","p":3,"r":1},{"t":"安能摧眉折腰事权贵，使我不得开心颜！","tr":"我怎能低头弯腰去侍奉权贵，使自己不能舒心开颜！","p":3,"r":1}],"notes":[{"u":0,"w":"瀛洲","m":"传说中的海上三神山之一","t":"实词","d":["江南的地名","西域的国名"]},{"u":0,"w":"信","m":"确实，的确","t":"实词","d":["书信","相信"]},{"u":1,"w":"语","m":"说，谈起","t":"词类活用","d":["语言","告诉"]},{"u":2,"w":"拔","m":"超出","t":"实词","d":["拔取","攻占"]},{"u":2,"w":"掩","m":"遮盖，压倒","t":"实词","d":["关闭","乘人不备"]},{"u":3,"w":"倾","m":"倾斜，倒向","t":"实词","d":["倾倒","倾尽"]},{"u":4,"w":"因","m":"依据，凭借","t":"实词","d":["因为","沿袭"]},{"u":4,"w":"度","m":"通“渡”，飞越","t":"通假","d":["温度","程度"]},{"u":7,"w":"著","m":"穿","t":"实词","d":["显著","写作"]},{"u":8,"w":"半壁","m":"半山腰","t":"古今异义","d":["半边墙壁","半面江山"]},{"u":9,"w":"暝","m":"昏暗，天黑","t":"实词","d":["闭眼","清晨"]},{"u":10,"w":"殷","m":"震动（作动词）","t":"词类活用","d":["深红色","富足"]},{"u":10,"w":"栗","m":"使……战栗（使动）","t":"词类活用","d":["栗子","坚实"]},{"u":12,"w":"列缺","m":"闪电","t":"实词","d":["缺口","星宿名"]},{"u":13,"w":"訇然","m":"巨大的响声","t":"实词","d":["迅速的样子","愤怒的样子"]},{"u":14,"w":"青冥","m":"青天","t":"实词","d":["幽暗的山谷","深海"]},{"u":17,"w":"长嗟","m":"长叹","t":"实词","d":["长久歌唱","高声呼喊"]},{"u":21,"w":"摧眉折腰","m":"低头弯腰，形容卑躬屈膝","t":"实词","d":["皱眉弯腰","催促行礼"]},{"u":21,"w":"事","m":"侍奉，服侍","t":"词类活用","d":["事情","职业"]}],"tricky":["瀛","涛","姥","赤城","镜","剡","渌","屐","暝","殷","訇","霓","鸾","悸","嗟","崖"],"keyLines":[{"u":2,"hint":"《梦游天姥吟留别》中，极写天姥山高大雄伟、气势压倒群山的两句是："},{"u":4,"hint":"《梦游天姥吟留别》中，写诗人梦中一夜飞越镜湖的两句是："},{"u":7,"hint":"《梦游天姥吟留别》中，写诗人梦中穿上谢灵运那样的木屐登山的两句是："},{"u":19,"hint":"《梦游天姥吟留别》中，诗人由梦醒联想到人间欢乐如梦、万事易逝的两句是："},{"u":21,"hint":"《梦游天姥吟留别》中，全诗点明主旨、表现诗人傲岸不屈的两句是："}],"appr":[{"q":"全诗在结构上是怎样安排的？","a":"先由传说引出天姥，再写梦游天姥：入山、遇险、见仙境，随后梦醒怅然，最后从梦境落到现实，归结到“安能摧眉折腰事权贵”的主旨，层层推进，梦与现实对照鲜明。"},{"q":"诗中梦境描写有什么艺术特色？","a":"诗人运用想象、夸张和铺陈，从月夜清幽到雷电轰鸣，再到仙府盛景，场面忽静忽动、色彩绚烂；句式长短错落，富于变化，充分体现了李白浪漫主义的风格。"},{"q":"“世间行乐亦如此，古来万事东流水”表达了怎样的情感？","a":"从梦境消散联想到人间欢乐的短暂和万事如水流逝，流露出诗人对现实功名富贵的看轻和失望，为结尾蔑视权贵、追求自由的呼喊作了铺垫。"}]},{"id":"h1a-p06","volume":"h1a","title":"登高","author":"杜甫","dynasty":"唐","genre":"七言律诗","kind":"poem","intro":"大历二年（767年）秋，杜甫在夔州重阳登高，面对萧瑟秋景，抒写漂泊多年、年老多病的悲苦，被誉为七律中的佳作。","theme":"借登高所见的萧瑟秋景，抒发诗人漂泊异乡、年老多病、壮志难酬的悲愁。","tags":["登高","悲秋","抒怀"],"units":[{"t":"风急天高猿啸哀，渚清沙白鸟飞回。","tr":"风急天高，猿猴的啸声显得凄哀；水中小洲清澈，沙滩洁白，鸟儿盘旋飞回。","p":0,"r":1},{"t":"无边落木萧萧下，不尽长江滚滚来。","tr":"无边无际的树叶萧萧飘落，奔流不尽的长江滚滚而来。","p":0,"r":1},{"t":"万里悲秋常作客，百年多病独登台。","tr":"我远离故乡万里，常年漂泊，在悲凉的秋天作客；一生多病，今天独自登上高台。","p":1,"r":1},{"t":"艰难苦恨繁霜鬓，潦倒新停浊酒杯。","tr":"艰难困苦使我痛恨白发日渐增多，穷困潦倒又使我刚刚戒掉了酒。","p":1,"r":1}],"notes":[{"u":0,"w":"渚","m":"水中的小块陆地","t":"实词","d":["水边的岸","水中的船"]},{"u":0,"w":"回","m":"盘旋","t":"实词","d":["返回","回答"]},{"u":1,"w":"落木","m":"落下的树叶","t":"实词","d":["倒下的树木","朽木"]},{"u":1,"w":"萧萧","m":"风吹落叶的声音","t":"实词","d":["冷清寂寞的样子","马叫声"]},{"u":2,"w":"作客","m":"漂泊在外，寄居他乡","t":"实词","d":["做客访友","接待客人"]},{"u":2,"w":"百年","m":"犹言一生，指暮年","t":"古今异义","d":["一百年","很长的历史"]},{"u":3,"w":"繁霜鬓","m":"白发增多，如鬓上添霜","t":"实词","d":["繁盛的霜雪","浓密的鬓发"]},{"u":3,"w":"潦倒","m":"衰颓失意","t":"实词","d":["行为散漫","倒下"]},{"u":3,"w":"新停","m":"刚刚停止（饮酒）","t":"实词","d":["新近设置","刚刚停放"]}],"tricky":["渚","啸","萧","艰","繁","鬓","潦","浊"],"keyLines":[{"u":1,"hint":"《登高》中，描写落叶纷飞、长江奔涌，视野开阔、气象雄浑的两句是："},{"u":2,"hint":"《登高》中，概括诗人漂泊异乡、多病独登高台的两句是："},{"u":3,"hint":"《登高》中，诗人表达国难家愁、白发增多、因病断酒的两句是："},{"u":0,"hint":"《登高》中，写登高所见之景，从猿声、江渚、沙鸟入笔的两句是："}],"appr":[{"q":"“无边落木萧萧下，不尽长江滚滚来”有什么艺术特点？","a":"上句写落叶，下句写长江，一个由上而下，一个由远而近，既有声音又有动势，境界开阔雄浑；同时时间和生命的流逝暗含其中，寄托了诗人的深沉悲慨。"},{"q":"颈联“万里悲秋常作客，百年多病独登台”蕴含了哪些悲情？","a":"短短两句包含了多层悲愁：漂泊万里、秋天悲凉、常年作客、一生多病、孤身登台，将身世之悲、羁旅之愁、暮年之苦融为一体，情感沉郁。"},{"q":"这首诗是如何做到情景交融的？","a":"前两联写景，以猿哀、落木、江水等渲染苍凉萧瑟之气，后两联直抒悲情，由景入情，情又反过来染上景色，使景物都带着诗人的愁绪，浑然一体。"}]},{"id":"h1a-p07","volume":"h1a","title":"琵琶行并序","author":"白居易","dynasty":"唐","genre":"七言歌行（叙事长诗）","kind":"poem","intro":"元和十年白居易被贬为九江郡司马，次年秋在湓浦口送客，偶遇一位长安琵琶女，听其弹奏与身世，联想到自身遭遇，写下这首叙事长诗。","theme":"通过描写琵琶女高超的技艺和不幸的身世，抒发诗人被贬的失意，表达“同是天涯沦落人”的同情与共鸣。","tags":["叙事","抒怀","音乐描写"],"units":[{"t":"元和十年，予左迁九江郡司马。","tr":"元和十年，我被降职为九江郡司马。","p":0,"r":0},{"t":"明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。","tr":"第二年秋天，我在湓浦口送客，听到船中夜里有人弹琵琶，听那声音，清脆响亮，带有京城的韵味。","p":0,"r":0},{"t":"问其人，本长安倡女，尝学琵琶于穆、曹二善才；年长色衰，委身为贾人妇。","tr":"询问弹奏的人，原来是长安的歌女，曾向穆、曹两位琵琶名手学艺；后来年老色衰，嫁给商人做妻子。","p":0,"r":0},{"t":"遂命酒，使快弹数曲。","tr":"于是我叫人摆酒，请她痛快地弹几支曲子。","p":0,"r":0},{"t":"曲罢悯然。","tr":"曲子弹完，她神情忧伤。","p":0,"r":0},{"t":"自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。","tr":"她自己讲述年轻时的欢乐往事，如今漂泊潦倒、容颜憔悴，辗转流落于江湖之间。","p":0,"r":0},{"t":"予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。","tr":"我离京外任已两年，一向安然自适，被这个人的话打动，这天晚上才开始感到被贬谪的悲伤。","p":0,"r":0},{"t":"因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。","tr":"于是写成这首长诗，作歌赠给她，共六百一十六字，题名叫《琵琶行》。","p":0,"r":0},{"t":"浔阳江头夜送客，枫叶荻花秋瑟瑟。","tr":"夜晚在浔阳江边送客，枫叶荻花在秋风中沙沙作响。","p":1,"r":1},{"t":"主人下马客在船，举酒欲饮无管弦。","tr":"我下马来到客人的船上，举起酒杯想饮，却没有音乐助兴。","p":1,"r":1},{"t":"醉不成欢惨将别，别时茫茫江浸月。","tr":"喝醉了也没有欢乐，反倒因即将分别而凄惨，分别时茫茫江水浸着一轮明月。","p":1,"r":1},{"t":"忽闻水上琵琶声，主人忘归客不发。","tr":"忽然听到水面上传来琵琶声，我忘了回去，客人也不开船。","p":1,"r":1},{"t":"寻声暗问弹者谁？琵琶声停欲语迟。","tr":"循着声音低声询问弹琵琶的是谁，琵琶声停了，对方想回答却又迟疑。","p":1,"r":1},{"t":"移船相近邀相见，添酒回灯重开宴。","tr":"我们把船靠近，邀她相见，添上酒、重新点上灯，再次摆开宴席。","p":1,"r":1},{"t":"千呼万唤始出来，犹抱琵琶半遮面。","tr":"千呼万唤她才出来，仍抱着琵琶遮住半边脸。","p":1,"r":1},{"t":"转轴拨弦三两声，未成曲调先有情。","tr":"她转动弦轴、拨弄琴弦试了几声，还没成曲调就已含深情。","p":1,"r":1},{"t":"弦弦掩抑声声思，似诉平生不得志。","tr":"每根弦都压抑着，每个声音都含着思绪，好像在诉说一生的不得志。","p":1,"r":1},{"t":"低眉信手续续弹，说尽心中无限事。","tr":"她低着眉、随手连续弹奏，把心中无限的往事都倾诉出来。","p":1,"r":1},{"t":"轻拢慢捻抹复挑，初为《霓裳》后《六幺》。","tr":"她轻轻拢、慢慢捻，又抹又挑，先弹《霓裳羽衣曲》，再弹《六幺》。","p":1,"r":1},{"t":"大弦嘈嘈如急雨，小弦切切如私语。","tr":"粗弦声音沉重急促，像急雨；细弦声音轻细低柔，像私语。","p":1,"r":1},{"t":"嘈嘈切切错杂弹，大珠小珠落玉盘。","tr":"粗弦和细弦交错弹奏，像大小珠子掉落在玉盘上。","p":1,"r":1},{"t":"间关莺语花底滑，幽咽泉流冰下难。","tr":"时而像黄莺在花下婉转鸣叫，时而像泉水在冰下艰涩呜咽地流动。","p":1,"r":1},{"t":"冰泉冷涩弦凝绝，凝绝不通声暂歇。","tr":"泉水冰冷凝涩，琴弦仿佛凝结，凝结阻断，声音暂时停歇。","p":1,"r":1},{"t":"别有幽愁暗恨生，此时无声胜有声。","tr":"另有一种深藏的忧愁和怨恨在心中生出，此刻无声胜过有声。","p":1,"r":1},{"t":"银瓶乍破水浆迸，铁骑突出刀枪鸣。","tr":"忽然像银瓶破裂、浆水迸溅，又像铁甲骑兵冲出、刀枪齐鸣。","p":1,"r":1},{"t":"曲终收拨当心画，四弦一声如裂帛。","tr":"曲子终了，她对着琴弦中心用拨子一划，四根弦同时发声，像撕裂丝帛。","p":1,"r":1},{"t":"东船西舫悄无言，唯见江心秋月白。","tr":"东边西边的船上都静悄悄没人说话，只见江心一轮秋月洁白。","p":1,"r":1},{"t":"沉吟放拨插弦中，整顿衣裳起敛容。","tr":"她沉吟着把拨子插在弦间，整理衣裳，起身神情庄重。","p":2,"r":1},{"t":"自言本是京城女，家在虾蟆陵下住。","tr":"她说自己本是京城女子，家在虾蟆陵一带。","p":2,"r":1},{"t":"十三学得琵琶成，名属教坊第一部。","tr":"十三岁就学成琵琶，名字列在教坊第一队。","p":2,"r":1},{"t":"曲罢曾教善才服，妆成每被秋娘妒。","tr":"一曲弹完曾让琵琶名手也佩服，妆扮好了常被名妓羡慕嫉妒。","p":2,"r":1},{"t":"五陵年少争缠头，一曲红绡不知数。","tr":"五陵的富家子弟争着送赠礼，一曲弹完收到的红绡数不清。","p":2,"r":1},{"t":"钿头银篦击节碎，血色罗裙翻酒污。","tr":"镶着花钿的银篦打拍子被敲碎，红色罗裙被洒的酒弄脏也不在乎。","p":2,"r":1},{"t":"今年欢笑复明年，秋月春风等闲度。","tr":"今年欢笑，明年依旧，秋月春风就这样随随便便度过。","p":2,"r":1},{"t":"弟走从军阿姨死，暮去朝来颜色故。","tr":"弟弟从军走了，养母也死了，晨去暮来，容颜也衰老了。","p":2,"r":1},{"t":"门前冷落鞍马稀，老大嫁作商人妇。","tr":"门前冷清，车马稀少，年纪大了，便嫁给商人做妻子。","p":2,"r":1},{"t":"商人重利轻别离，前月浮梁买茶去。","tr":"商人看重利益，不把离别当回事，上个月到浮梁去买茶了。","p":2,"r":1},{"t":"去来江口守空船，绕船月明江水寒。","tr":"他走后我在江口守着空船，明月绕着船，江水寒冷。","p":2,"r":1},{"t":"夜深忽梦少年事，梦啼妆泪红阑干。","tr":"夜深时忽然梦见年少时的事，梦中哭泣，泪水混着胭脂纵横流淌。","p":2,"r":1},{"t":"我闻琵琶已叹息，又闻此语重唧唧。","tr":"我听琵琶声已经叹息，又听了她这番话更加叹息不已。","p":3,"r":1},{"t":"同是天涯沦落人，相逢何必曾相识！","tr":"我们都是流落天涯的人，今日相逢，何必一定要以前认识！","p":3,"r":1},{"t":"我从去年辞帝京，谪居卧病浔阳城。","tr":"我从去年离开京城，被贬居住、卧病在浔阳城。","p":3,"r":1},{"t":"浔阳地僻无音乐，终岁不闻丝竹声。","tr":"浔阳地方偏僻，没有音乐，整年听不到管弦声。","p":3,"r":1},{"t":"住近湓江地低湿，黄芦苦竹绕宅生。","tr":"住处靠近湓江，地势低而潮湿，黄芦和苦竹围着宅子生长。","p":3,"r":1},{"t":"其间旦暮闻何物？杜鹃啼血猿哀鸣。","tr":"这期间早晚能听到什么？只有杜鹃啼血、猿猴哀鸣。","p":3,"r":1},{"t":"春江花朝秋月夜，往往取酒还独倾。","tr":"春江花开的早晨、秋月明亮的夜晚，常常取酒来独自饮。","p":3,"r":1},{"t":"岂无山歌与村笛？呕哑嘲哳难为听。","tr":"难道没有山歌和村笛？可是声音嘈杂刺耳，难以入耳。","p":3,"r":1},{"t":"今夜闻君琵琶语，如听仙乐耳暂明。","tr":"今夜听你弹琵琶，如听仙乐，耳朵顿时清亮。","p":3,"r":1},{"t":"莫辞更坐弹一曲，为君翻作《琵琶行》。","tr":"请不要推辞，再坐下弹一曲，我为你把它改写成一首《琵琶行》。","p":3,"r":1},{"t":"感我此言良久立，却坐促弦弦转急。","tr":"她被我的话感动，站了很久，然后回座把弦拧紧，琴声转急。","p":3,"r":1},{"t":"凄凄不似向前声，满座重闻皆掩泣。","tr":"声音凄切，不像之前那样，满座的人再次听到都掩面哭泣。","p":3,"r":1},{"t":"座中泣下谁最多？江州司马青衫湿。","tr":"在座的人谁哭得最多？是我这个江州司马，青衫都被泪水打湿了。","p":3,"r":1}],"notes":[{"u":0,"w":"左迁","m":"降职，贬官","t":"实词","d":["迁居左边","升官"]},{"u":1,"w":"闻","m":"听见","t":"实词","d":["嗅","名声"]},{"u":1,"w":"铮铮然","m":"金属相击的清脆声","t":"实词","d":["刚直不阿的样子","沉重缓慢的声音"]},{"u":2,"w":"倡女","m":"歌女，以歌舞为业的女子","t":"古今异义","d":["倡导的女子","女演员"]},{"u":2,"w":"善才","m":"唐代对琵琶艺人的称呼","t":"实词","d":["有才能的人","善良有才华的人"]},{"u":2,"w":"委身","m":"托身，嫁给","t":"实词","d":["弯腰屈身","舍身"]},{"u":5,"w":"转徙","m":"辗转迁移","t":"实词","d":["转身","转让"]},{"u":6,"w":"恬然","m":"安然、满足的样子","t":"实词","d":["冷漠的样子","沉默的样子"]},{"u":8,"w":"瑟瑟","m":"形容风吹草木的声音（也有萧瑟之意）","t":"实词","d":["颤抖的样子","碧绿的颜色"]},{"u":9,"w":"主人","m":"诗人自指","t":"古今异义","d":["宴会的东道主","房屋的主人"]},{"u":14,"w":"犹","m":"仍然，还","t":"实词","d":["如同","好像"]},{"u":15,"w":"转轴","m":"拧动琵琶上系弦的轴","t":"实词","d":["旋转的车轴","转动的机械"]},{"u":16,"w":"掩抑","m":"低沉压抑","t":"实词","d":["遮掩","压制"]},{"u":18,"w":"拢","m":"扣弦（琵琶指法）","t":"实词","d":["合拢","聚集"]},{"u":18,"w":"霓裳","m":"《霓裳羽衣曲》","t":"实词","d":["彩虹做的衣裳","舞者的衣服"]},{"u":21,"w":"间关","m":"鸟鸣声（一说婉转）","t":"实词","d":["关隘之间","路途艰难"]},{"u":23,"w":"暗恨","m":"心中暗藏的怨恨","t":"实词","d":["暗中憎恨","偷偷怨恨他人"]},{"u":25,"w":"当心画","m":"对着琵琶中央划拨","t":"特殊句式","d":[]},{"u":27,"w":"沉吟","m":"沉思吟味，迟疑","t":"实词","d":["低声吟诵","叹息"]},{"u":28,"w":"虾蟆陵","m":"长安城东南的地名，歌女聚居地","t":"实词","d":["蟾蜍居住的山陵","皇家陵墓"]},{"u":31,"w":"缠头","m":"赠给歌舞艺人的锦帛财物","t":"实词","d":["缠绕在头上的头巾","头饰"]},{"u":34,"w":"弟走从军阿姨死","m":"弟弟从军而去，养母已死","t":"特殊句式","d":[]},{"u":35,"w":"老大","m":"年纪大","t":"古今异义","d":["排行第一","最大的孩子"]},{"u":37,"w":"去来","m":"离去以后（“来”为助词）","t":"实词","d":["来来去去","往返"]},{"u":39,"w":"重","m":"更加","t":"实词","d":["重量","再次"]},{"u":40,"w":"天涯","m":"天边，指远离家乡的地方","t":"实词","d":["天空的边缘","边疆"]},{"u":46,"w":"呕哑嘲哳","m":"嘈杂刺耳的声音","t":"实词","d":["呕吐的声音","欢笑的声音"]},{"u":51,"w":"青衫","m":"唐代低级官员的服色，指诗人自己","t":"实词","d":["读书人的白衣","年轻人的衣裳"]}],"tricky":["浔","荻","瑟","管弦","掩抑","拢","捻","霓裳","嘈","珠","莺","咽","迸","帛","舫","虾蟆","缠头","篦","唧","呕哑嘲哳"],"keyLines":[{"u":8,"hint":"《琵琶行》开头点明送别的时间、地点与秋景的两句是："},{"u":14,"hint":"《琵琶行》中，写琵琶女被邀请出场时羞涩情态的两句是："},{"u":15,"hint":"《琵琶行》中，写琵琶女调弦试音时尚未成曲已含深情的两句是："},{"u":19,"hint":"《琵琶行》中，用比喻形容琵琶声急骤和低柔的两句是："},{"u":20,"hint":"《琵琶行》中，以珠落玉盘形容琵琶声清脆圆润的两句是："},{"u":23,"hint":"《琵琶行》中，写琴声暂歇、此时无声胜过有声的两句是："},{"u":40,"hint":"《琵琶行》中，点明诗人与琵琶女共同遭遇、心灵相通的两句是："},{"u":51,"hint":"《琵琶行》结尾，写诗人因同情琵琶女而泪湿青衫的两句是："}],"appr":[{"q":"诗中对琵琶声的描写有什么特点？","a":"诗人综合运用比喻、通感：以急雨、私语、大珠小珠、莺语、泉流、银瓶乍破、铁骑刀枪等形象，把听觉化为视觉，写出了乐声由急到缓、由断到起的变化，细腻传神。"},{"q":"“此时无声胜有声”好在哪里？","a":"琴声暂停，听者沉浸在余韵与琵琶女的幽愁暗恨中，此时的静默更含不尽之情，也为后面的高潮蓄势，表现了留白的艺术效果。"},{"q":"全诗的两条线索是什么？如何交会？","a":"明线写琵琶女的演奏和身世，暗线写诗人自己的贬谪失意。两线在“同是天涯沦落人，相逢何必曾相识”处交汇，使叙事升华为同病相怜的共鸣。"}]},{"id":"h1a-p08","volume":"h1a","title":"念奴娇·赤壁怀古","author":"苏轼","dynasty":"北宋","genre":"词（豪放派）","kind":"poem","intro":"元丰五年，苏轼被贬黄州，游览黄州城外的赤壁（实为“赤鼻矶”）时，由眼前的大江联想到三国周瑜，写下这首怀古名篇。","theme":"借赞美周瑜的少年英发，抒发自己壮志未酬、功业难成的感慨，并以旷达之语自我宽解。","tags":["怀古","咏史","抒怀"],"units":[{"t":"大江东去，浪淘尽，千古风流人物。","tr":"大江滚滚向东流去，浪花淘尽了千古的英雄人物。","p":0,"r":1},{"t":"故垒西边，人道是，三国周郎赤壁。","tr":"那旧营垒的西边，人们说，就是三国时周瑜大破曹军的赤壁。","p":0,"r":1},{"t":"乱石穿空，惊涛拍岸，卷起千堆雪。","tr":"陡峭的乱石直插云天，惊人的巨浪拍打着江岸，卷起千万堆白雪般的浪花。","p":0,"r":1},{"t":"江山如画，一时多少豪杰。","tr":"江山壮丽如画，一时间涌现了多少英雄豪杰。","p":0,"r":1},{"t":"遥想公瑾当年，小乔初嫁了，雄姿英发。","tr":"遥想当年的周公瑾，刚刚迎娶小乔，英姿雄健，风度焕发。","p":1,"r":1},{"t":"羽扇纶巾，谈笑间，樯橹灰飞烟灭。","tr":"手摇羽扇，头戴青丝巾，谈笑之间，曹军的战船就被烧得灰飞烟灭。","p":1,"r":1},{"t":"故国神游，多情应笑我，早生华发。","tr":"我神游于古战场，应当笑我多愁善感，过早地生出了白发。","p":1,"r":1},{"t":"人生如梦，一尊还酹江月。","tr":"人生就像一场梦，且举一杯酒，祭奠江中的明月吧。","p":1,"r":1}],"notes":[{"u":0,"w":"风流人物","m":"杰出的英雄人物","t":"古今异义","d":["举止轻浮的人","有才情的文人"]},{"u":1,"w":"故垒","m":"旧时的营垒","t":"实词","d":["旧城墙","古老的石堆"]},{"u":1,"w":"周郎","m":"指周瑜，“郎”是对年轻人的称呼","t":"实词","d":["周朝的男子","周姓的官员"]},{"u":2,"w":"穿空","m":"直插天空","t":"实词","d":["穿越空旷处","通向天空"]},{"u":4,"w":"公瑾","m":"周瑜的字","t":"实词","d":["周瑜的号","周瑜的谥号"]},{"u":4,"w":"英发","m":"谈吐不凡，才华外露","t":"实词","d":["头发茂盛","出发远行"]},{"u":5,"w":"纶巾","m":"青丝带做的头巾","t":"实词","d":["古代的官帽","布制的腰带"]},{"u":5,"w":"樯橹","m":"代指曹操的战船（也有版本作“强虏”）","t":"实词","d":["船上的帆","战争的武器"]},{"u":6,"w":"故国","m":"旧地，这里指旧战场（赤壁）","t":"古今异义","d":["旧时的国家","故乡"]},{"u":6,"w":"华发","m":"花白的头发","t":"实词","d":["华美的头饰","茂盛的头发"]},{"u":7,"w":"尊","m":"通“樽”，酒杯","t":"通假","d":["尊敬","辈分高"]},{"u":7,"w":"酹","m":"把酒洒在地上祭奠","t":"实词","d":["酿酒","斟酒敬客"]}],"tricky":["淘","垒","郎","穿","拍","豪杰","瑾","纶","樯橹","灰飞烟灭","酹"],"keyLines":[{"u":0,"hint":"《念奴娇·赤壁怀古》开篇气势磅礴，写长江东流、淘尽历代英雄的句子是："},{"u":2,"hint":"《念奴娇·赤壁怀古》中，描写赤壁险峻江景、惊涛拍岸的三句是："},{"u":5,"hint":"《念奴娇·赤壁怀古》中，写周瑜风度从容、轻松取胜的三句是："},{"u":6,"hint":"《念奴娇·赤壁怀古》中，诗人自嘲因多情而早生白发的句子是："},{"u":7,"hint":"《念奴娇·赤壁怀古》结句，以洒酒祭月作结、表达旷达与感慨的是："}],"appr":[{"q":"上阕“乱石穿空，惊涛拍岸，卷起千堆雪”运用了什么手法？","a":"运用夸张和比喻，把巨浪比成堆雪，从高处、动态、色彩等多角度写出赤壁雄奇险峻的江景，为后文评说英雄人物铺垫了壮阔的背景。"},{"q":"词中为何着重写周瑜？表达了什么感情？","a":"周瑜年少成名、功业赫赫，与诗人此时的壮志难酬、两鬓斑白形成鲜明对比。这样写既表达对英雄的仰慕，也流露出自己被贬的失意，最后以“人生如梦”作自我排解。"},{"q":"这首词的整体风格是什么？","a":"意境开阔，气势雄浑，写景、咏史、抒情融于一体，是豪放词的代表作，不过结尾也含着旷达与伤感相交织的复杂心绪。"}]},{"id":"h1a-p09","volume":"h1a","title":"永遇乐·京口北固亭怀古","author":"辛弃疾","dynasty":"南宋","genre":"词（豪放派）","kind":"poem","intro":"开禧元年，六十六岁的辛弃疾出任镇江知府，登上京口北固亭，面对山河，追怀古人，借古讽今，写下这首词，表达对朝廷北伐准备不足的忧虑。","theme":"借怀古抒发词人收复失地的壮志，批评南宋朝廷轻率北伐，同时感叹自己年老被弃、壮志难酬。","tags":["怀古","爱国","咏史"],"units":[{"t":"千古江山，英雄无觅，孙仲谋处。","tr":"千古江山依旧，却再也找不到像孙权那样的英雄。","p":0,"r":1},{"t":"舞榭歌台，风流总被、雨打风吹去。","tr":"当年的歌台舞榭，英雄的风流业绩，都被风吹雨打消逝了。","p":0,"r":1},{"t":"斜阳草树，寻常巷陌，人道寄奴曾住。","tr":"夕阳照着草木，寻常的街巷里，人们说刘裕曾在这里居住。","p":0,"r":1},{"t":"想当年，金戈铁马，气吞万里如虎。","tr":"回想当年，他带着金戈铁马北伐，气势如虎，足以吞并万里。","p":0,"r":1},{"t":"元嘉草草，封狼居胥，赢得仓皇北顾。","tr":"宋文帝元嘉年间草率北伐，想建立封狼居胥的功业，结果只落得仓皇败逃、回望北方。","p":1,"r":1},{"t":"四十三年，望中犹记，烽火扬州路。","tr":"离开北方已四十三年，回望时还记得扬州一带战火连天的情景。","p":1,"r":1},{"t":"可堪回首，佛狸祠下，一片神鸦社鼓。","tr":"怎堪回首，佛狸祠下，竟是一片乌鸦啄食祭品、社日鼓声喧闹。","p":1,"r":1},{"t":"凭谁问：廉颇老矣，尚能饭否？","tr":"有谁来问：廉颇老了，饭量还行吗？","p":1,"r":1}],"notes":[{"u":0,"w":"孙仲谋","m":"三国时吴国的孙权，字仲谋","t":"实词","d":["东晋的谢安","东吴大将周瑜"]},{"u":1,"w":"风流","m":"指英雄业绩和流风余韵","t":"古今异义","d":["举止轻浮","洒脱不羁"]},{"u":1,"w":"舞榭歌台","m":"歌舞享乐的楼台","t":"实词","d":["戏曲表演的舞台","官府的宴客厅"]},{"u":2,"w":"寄奴","m":"南朝宋武帝刘裕的小名","t":"实词","d":["侍者的称呼","孙权的别称"]},{"u":3,"w":"金戈铁马","m":"指精良的兵器和战马，形容军队强大","t":"实词","d":["金属的戈和黑色的马","战争的惨烈"]},{"u":4,"w":"元嘉","m":"宋文帝刘义隆的年号","t":"实词","d":["宋武帝的年号","孙权的年号"]},{"u":4,"w":"封狼居胥","m":"指在狼居胥山祭天，借指建立卓越战功（用霍去病事）","t":"实词","d":["封锁狼居胥山","狼在山里居住"]},{"u":4,"w":"北顾","m":"回头北望，指担忧北方的敌人","t":"实词","d":["向北拜访","照顾北方"]},{"u":6,"w":"可堪","m":"怎能忍受","t":"实词","d":["可以承受","值得称赞"]},{"u":6,"w":"佛狸祠","m":"北魏太武帝拓跋焘（小名佛狸）所建的行宫，后成祠庙","t":"实词","d":["佛寺","祭祀刘裕的祠庙"]},{"u":6,"w":"神鸦社鼓","m":"乌鸦啄食祭品，社日祭神的鼓声","t":"实词","d":["神话中的乌鸦和战鼓","祭祖时的鼓乐"]},{"u":7,"w":"廉颇","m":"战国时赵国名将，老年仍想为国出力","t":"实词","d":["秦国大将","赵国相国"]}],"tricky":["榭","陌","戈","胥","仓","烽","祠","鸦","颇","饭"],"keyLines":[{"u":3,"hint":"《永遇乐·京口北固亭怀古》中，追忆刘裕北伐时气势如虎的两句是："},{"u":4,"hint":"《永遇乐·京口北固亭怀古》中，批评宋文帝草率北伐、结果仓皇败退的句子是："},{"u":5,"hint":"《永遇乐·京口北固亭怀古》中，词人回忆四十三年前扬州战火的两句是："},{"u":7,"hint":"《永遇乐·京口北固亭怀古》结句，借廉颇表达自己老而仍愿报国的句子是："},{"u":0,"hint":"《永遇乐·京口北固亭怀古》开篇，感叹千古江山再无英雄的句子是："}],"appr":[{"q":"这首词怀古使用了多个典故，它们各有什么作用？","a":"孙权、刘裕的典故赞扬英雄的功业，用来对照南宋当权者的无能；刘义隆北伐失败，则警示朝廷勿重蹈覆辙；佛狸祠和廉颇的典故则抒写自己对时局的忧虑和壮志难酬的感慨。"},{"q":"“凭谁问：廉颇老矣，尚能饭否？”表达了怎样的情感？","a":"词人以廉颇自比，表面是自问年老还能否出力，实则表达自己渴望报国却无人信任的悲愤，也含有对朝廷不识人才的批评。"}]},{"id":"h1a-p10","volume":"h1a","title":"声声慢（寻寻觅觅）","author":"李清照","dynasty":"宋","genre":"词（婉约派）","kind":"poem","intro":"李清照是宋代著名女词人。南渡之后，丈夫去世，家国破碎，她孤身漂泊，这首词写于晚年，集中抒写了深重的愁苦。","theme":"借深秋景物，抒发词人经历国破家亡、丧夫孤独之后的凄凉、愁苦之情。","tags":["伤秋","愁情","婉约"],"units":[{"t":"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。","tr":"我若有所失地寻找，却只有冷清，心中一片凄惨悲伤。","p":0,"r":1},{"t":"乍暖还寒时候，最难将息。","tr":"忽暖忽冷的时节，最难保养休息。","p":0,"r":1},{"t":"三杯两盏淡酒，怎敌他、晚来风急！","tr":"喝上几杯淡酒，怎么抵得住傍晚时分的急风！","p":0,"r":1},{"t":"雁过也，正伤心，却是旧时相识。","tr":"大雁飞过，正使我伤心，却发现是旧日见过的大雁。","p":0,"r":1},{"t":"满地黄花堆积，憔悴损，如今有谁堪摘？","tr":"菊花堆满地面，已经憔悴枯损，如今还有谁来摘取？","p":1,"r":1},{"t":"守着窗儿，独自怎生得黑！","tr":"守着窗口，独自一人怎么熬到天黑！","p":1,"r":1},{"t":"梧桐更兼细雨，到黄昏、点点滴滴。","tr":"梧桐叶上又添细雨，到了黄昏，一点一滴地落个不停。","p":1,"r":1},{"t":"这次第，怎一个愁字了得！","tr":"这般光景，哪里是一个“愁”字所能概括！","p":1,"r":1}],"notes":[{"u":0,"w":"寻寻觅觅","m":"若有所失地寻找，却什么也找不到","t":"实词","d":["四处寻找丢失的东西","认真观察"]},{"u":0,"w":"戚戚","m":"忧伤悲哀的样子","t":"实词","d":["亲戚之间","不安的样子"]},{"u":1,"w":"乍暖还寒","m":"忽然转暖，又转寒","t":"实词","d":["天气渐渐暖和","寒冷刚刚过去"]},{"u":1,"w":"将息","m":"调养，休养","t":"实词","d":["将要停止","消息"]},{"u":2,"w":"敌","m":"抵挡，对付","t":"实词","d":["敌人","匹配"]},{"u":2,"w":"晚来","m":"傍晚时分（一作“晓来”）","t":"实词","d":["晚到","后来"]},{"u":4,"w":"黄花","m":"菊花","t":"实词","d":["黄色的花朵","野花"]},{"u":4,"w":"憔悴损","m":"枯萎凋残（“损”为程度副词）","t":"实词","d":["损坏","病弱"]},{"u":4,"w":
